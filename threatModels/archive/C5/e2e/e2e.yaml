  <img src=" img/e2eAnalysis1.svg">

threats:
  - ID: E2E_SPOOFING1
    title: End to End authentication failure, missing nonce signature
    pentestTestable: true
    assets:
      - REFID: DF_P2PGW_2_P2PGW
    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:N/I:L/A:L
    threatType: Spoofing
    attack: |
      An attacker can impersonate a VNode in the e2e session / init protocol (not in the lower level Flow/transaction with ledger keys ) without having access to the private [SESSION_KEYS](#SESSION_KEYS)
       given the fact that there is not mutual TLS authentication (only server). The attacker will just try to connect and impersonate another NVode.
    impactDesc: Attackers can attempt flows, consume resources, pollute logs.
    impactedSecObj:
      - REFID: AVAILABILITY
    public: true
    fullyMitigated: true
    countermeasures:
      - ID: CHALLENGE_SIGNATURE
        title: Signed nonce in handshakes
        description: |
          An unpredictable/random nonce is present to avoid replay and known plaintext attacks.
          Messages 3 & 4 (InitiatorHandshake / ResponderHandshake) in SIGMA-R contain signatures with the members' session
            initiation keys that are validated when received.
        operational: false
        inPlace: true
        public: true


  - ID: DF_KafkaP2P_STRIDE
    title: Insecure communication between P2P Gateway and Kafka
    pentestTestable: true
    assets:
      - REFID: DF_KafkaP2P
    CVSS:
      vector: CVSS:3.1/AV:A/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H
    threatType: Spoofing, Tampering, Repudiation, Information disclosure, Denial
      of Service, Elevation of privileges
    impactedSecObj:
      - REFID: FULL_CIA
    attack: >
      An attacker can easily connect and attempt to exploit the P2P_GATEWAY being
      open to the Internet, at least partially during TLS and unauthenticated  Avro
      messages processing (e.g. DF_P2PGW_2_P2PGW initialization).  Both [anonymous
      internet user](#C5.anonymous) and peer VNodes are considered untrusted (See
      [Attackers](#Attackers)).
      Being in a DMZ the P2P Gateway is considered less trusted than the other worker
      that it communicates with.  This is also a full input/output communication with
      the message bus (kafka) while the only intended endpoints/topics are a subset
      of those defined in Kafka.
    public: true
    fullyMitigated: false
    countermeasures:
      - ID: P2P_GATEWAY_MINIMAL_KAFKA_ACCESS
        title: P2P_GATEWAY minimal privilege access to KAFKA
        description: |
          The INFRASTRUCTURE_OPERATOR configures the cluster so that: 
          Each Corda processor has a separate user/account that is authenticated by Kafka using SASL. 
          The processor authenticates Kafka using TLS (and traffic is exchanged encrypted) 
          Mutual authentication can be turned on based on the customer setup using the broker Kafka configuration `ssl.client.auth=requested`.
          Hostname verification is in place (Kafka client config: `ssl.endpoint.identification.algorithm=HTTPS`), which is a default setting.
          A set of ACLs is applied by Kafka that restricts access for every processor to a limited set of topics, so it cannot access topics of other processors.  
        operational: true
        operator: INFRASTRUCTURE_OPERATOR
        inPlace: false
        public: true

      - ID: P2P_GATEWAY_DEDICATED_TOPICS
        title: P2P_GATEWAY dedicated topics
        description: |
          The INFRASTRUCTURE_OPERATOR configures the cluster so that: 
          P2P_GATEWAY can only access dedicated topics and do not share consumed topics with
           other Corda 5 cluster workers (in different zones of trust) other than the necessary ones to coordinate its specific tasks,
            e.g. sharing only Kafka topics with the LINK_MANAGER 
        operational: true
        operator: INFRASTRUCTURE_OPERATOR
        inPlace: false
        public: true

  - ID: UNAUTH_MESSAGE_ABUSE
    title: UnauthenticatedMessage abuse
    pentestTestable: true
    assets:
      - REFID: DF_P2PGW_2_P2PGW
      - REFID: DF_P2P_REG1
    CVSS:
      vector: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:L/E:U/RC:R
    threatType: Spoofing, Denial of Service
    attack: |
      Unauthenticated messages (DF_P2P_REG1) are accepted by the P2P_GATEWAY and routed to the LINK_MANAGER. They can be abused as attack vector to 
      deliver malicious serialized payloads.
    impactDesc: Attack vector for compromising the Cluster
    impactedSecObj:
      - REFID: FULL_CIA
    public: true
    fullyMitigated: true
    countermeasures:
      - ID: P2P_AUTHVALUE_VALIDATION
        title: Message type Validation
        description: |
          The only payload type of `UnauthenticatedMessage` accepted if for member registration messages DF_P2P_REG1. 
          There is syntax (including max size) and semantic validation of the serialized payload data.
        operational: false
        inPlace: true
        public: true

  - ID: E2E_HEADER_TAMPERING1
    title: Tampering Avro binary data in e2e protocol headers of the message 
      Schema
    pentestTestable: true
    assets:
      - REFID: DF_P2PGW_2_P2PGW
      - REFID: DF_P2PGW_2_MGMGW
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:L
    threatType: Tampering, Elevation of Privileges, Denial of Service
    attack: |
      An attacker, including malicious peer VNodes running in malicious Clusters, can tamper the values of the message schema e.g. `subsystem` to 
      direct a message to a specific component it should not be able to.
    impactDesc: Creates a potential attack vector for compromising the Cluster
    impactedSecObj:
      - REFID: FULL_CIA
    public: true
    fullyMitigated: true
    countermeasures:
      - ID: INPUT_HEADERS_SEMANTIC_VALIDATION
        title: Full headers validation validation
        description: |
          Strict syntactic and semantic validation of all Headers values. Values should be NULL for the unused values. 
          some headers e.g. `subsystem` should not be exposed (expected as input).

        #  Complete syntactic and semantic validation of the expected safe headers fields.
        #  The full content of the AuthenticatedMessage is AEAD encrypted or MAC-authenticated depending on the network mode. 
        #  To be more precise, it's wrapped further before being encrypted to send some more information along with the message 
        #  (e.g. original Kafka key). So, the actual data structure that's encrypted is AuthenticatedMessageAndKey / DataMessagePayload. 
        #  As a result, the header fields of the Authenticated Message (e.g. subsystem) cannot be tampered with by any other than the sender itself.
        operational: false
        inPlace: true
        public: false

  - ID: EPHEMERAL_SESSION_KEY_REST_LEAK1
    title: Disclosure of the ephemeral session keys
    assets:
      - REFID: EPHEMERAL_SESSION_KEY
    CVSS:
      vector: CVSS:3.1/AV:A/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:L
    threatType: Information disclosure, tampering, spoofing
    attack: |
      An attacker that gains access to some part on the cluster would be able to access the EPHEMERAL_SESSION_KEY persisted in the Corda 5 cluster
       infrastructure (e.g. Kafka link.in link.out storage)
    impactedSecObj:
      - REFID: DATABASE_LEAK_RESILIENCY
    public: true
    fullyMitigated: true
    countermeasures:
      - ID: EPHEMERAL_SESSION_KEY_REST_ENCRYPTION
        title: EPHEMERAL_SESSION_KEY at rest
        appliesToVersions: ">5.1"
        description: |
          Ephemeral session keys are encrypted in the database by the CRYPTO_WORKER.
          Also all the stateful steps during key exchange algorithm are encrypted at rest (since Corda 5.2)
        operational: false
        inPlace: true
        public: true
      - ID: JVM_SECURE_MEMDUMP_CONFIG
        title: Memory dump/jmx/debug protection for EPHEMERAL_SESSION_KEY and 
          LINK_MANAGER process
        description: |
          Even if the LINK_MANAGER process crashes (e.g. `out of memory java error`) the process memory will not be dumped to a file. 
        operational: false
        inPlace: false
        public: true

  - ID: STEP_DOWN_ENCRYPTION1
    title: AUTHENTICATED_ENCRYPTION to AUTHENTICATION_ONLY in session
    assets:
      - REFID: DF_P2PGW_2_MGMGW
      - REFID: DF_P2PGW_2_P2PGW
    CVSS:
      vector: CVSS:3.0/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:N/A:N
    threatType: Information disclosure
    impactedSecObj:
      - REFID: CONFIDENTIALITY
    attack: |
      A malicious Cluster/VNode sends session messages that are AUTHENTICATION_ONLY even if the more stringent AUTHENTICATED_ENCRYPTION `protocolMode`
       was initially negotiated.
    public: true
    fullyMitigated: true
    countermeasures:
      - ID: STEP_DOWN_ENCRYPTION_VALIDATION
        title: Per message protocolMode validation
        description: |
          If one side uses the wrong mode, that step will just fail.
          During the original e2e session handshake, the two sides will negotiate the protocol mode. 
          In practice though, there is no negotiation made (this is just flexibility built into the protocol),
           since both sides will send the same protocol mode, which is the one set in the network's group policy. 
           At this point, if any of the two sides tries to send a different protocol mode, the negotiation will fail as there won't
            be a common mode to negotiate. Reference to the code here: 
            [REF](https://github.com/corda/corda-runtime-os/blob/release/os/5.0/libs/p2p-crypto/src/main/kotlin/net/corda/p2p/crypto/protocol/ProtocolModeNegotiation.kt#L9).
          After a session is established, each side will expect a message either AEAD-encrypted or MAC’ed and it will try to 
          decrypt or validate the MAC accordingly. 
        # operational: yes
        inPlace: true
        public: true

  - ID: STEP_DOWN_ENCRYPTION2
    title: Step down to AUTHENTICATION_ONLY when one party does not support 
      AUTHENTICATED_ENCRYPTION
    assets:
      - REFID: DF_P2PGW_2_P2PGW
      - REFID: DF_P2PGW_2_MGMGW
    CVSS:
      vector: CVSS:3.0/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:N/A:N
    threatType: Information disclosure, Denial of Service
    attack: |
      When one of the parties in the DF_P2PGW_2_P2PGW does not support AUTHENTICATED_ENCRYPTION then the chosen protocolMode will default to 
      AUTHENTICATION_ONLY, this may not be in compliance with one of the parties involved in the DF and expand the attack surface of the system.
    impactedSecObj:
      - REFID: CONFIDENTIALITY
    public: true
    fullyMitigated: true
    countermeasures:
      - ID: USE_AUTHENTICATED_ENCRYPTION_OPTION
        title: AUTHENTICATED_ENCRYPTION `only` enforcement option
        description: |
          The MGM will effectively mandate the protocol mode the network operates in. And by participating, 
          members effectively agree they are forced with this mode. 
          As a result, all members in a network will only use this protocol mode when communicating.
          If someone attempts to use a different protocol mode (e.g. tries to use AUTHENTICATION_ONLY in a network that requires 
          AUTHENTICATED_ENCRYPTION), e2e session negotiation will fail.
        # operational: true
        # operator: NETWORK_OPERATOR
        inPlace: true
        public: true

  - ID: EPHEMERAL_SESSION_KEY_REVOC1
    title: SESSION_KEYS revocation through OCSP/CRL is not effective for 
      relatively long lived EPHEMERAL_SESSION_KEY
    impactDesc: Impediment to recover compromised keys/cluster or to revoke 
      permission to a VNode
    impactedSecObj:
      - REFID: LEDGER_INTEGRITY
      - REFID: LEDGER_TX_CONFIDENTIALITY
    assets:
      - REFID: DF_P2PGW_2_MGMGW
      - REFID: DF_P2PGW_2_P2PGW
    CVSS:
      vector: CVSS:3.0/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N
    threatType: Repudiation, Spoofing
    attack: |
      An attacker can continue to use established session even after a compromised VNode gets SESSION_KEYS key rotation
    public: true
    fullyMitigated: false
    countermeasures:
      - ID: SESSION_INV1
        title: E2E_SESSION invalidation
        description: |
          Option to manually purge/invalidate sessions (for a VNode entity) with an actionable API by VNode operator and/or Cluster operator.
          *Example:* if a participant bank get its license revoked and needs to stop using the Corda Network there would be
           no process/API to invalidate long lived sessions in peers VNodes. 
        operational: true
        operator: CLUSTER_OPERATOR
        inPlace: no
        public: true
      - ID: SESSION_EXPIRATION1
        title: Session or EPHEMERAL_SESSION_KEY fixed expiration
        description: |
          Maximum live / timeout session even with heartbeat active. The link manager maintains sessions for a maximum period of time, 
          after which a session is torn down and a new one is established between the same pair of VNodes.
          This is configurable at the moment in case customers want to enforce more frequent key rotations via session refresh.
          The current default is set to 5 days and it is also set as the maximum allowed value in order to protect customers from setting a very large value that could introduce security risks.
        operational: true
        operator: CLUSTER_OPERATOR
        inPlace: yes
        public: true

  - ID: EPHEMERAL_SESSION_KEY_ROTATION1
    title: SESSION_KEYS rotation leaves EPHEMERAL_SESSION_KEY valid
    impactDesc: Impediment to timely recover expired/compromised keys/cluster or
      to revoke permission to a VNode
    impactedSecObj:
      - REFID: LEDGER_INTEGRITY
      - REFID: NON_REPUDIATION
    assets:
      - REFID: DF_P2PGW_2_P2PGW
    CVSS:
      vector: CVSS:3.0/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:N
    threatType: Repudiation, Spoofing

    attack: |
      An attacker can continue to use established e2e sessions (EPHEMERAL_SESSION_KEY) even after an expired or compromised VNode
       get SESSION_KEYS key rotation. SESSION_KEYS rotation through updated network participant list distribution
      is not immediately effective for relatively long lived EPHEMERAL_SESSION_KEY.
    pentestTestable: true
    public: true
    fullyMitigated: false
    countermeasures:
      - ID: SESSION_INVALIDATION1
        title: Session expiration on updated PUB_SESSION_KEY distributed
        description: |
          When a participant has a new SESSION_KEYS and it gets distributed to 
          the participants of the network (VNodes) the associated session are invalidated.
        operational: false
        inPlace: no
        public: true



  - ID: MGM_SESSION_KEY_ROTATION1
    title: MGM identity session key rotation disruption
    impactDesc: |
      MGM would not allow to accept or redistribute info about network participant (necessary to revoke access to parties as well). 
      The only way to recover would be to force all participant to install an new CPI with new MGM root of trust. In this scenario, the MGM would have to create
      a new session initiation key, update group policy for the network, provide the group policy to the party that is responsible 
      for assembling the CPI and then provide the CPU to the members of the network to upgrade.
    impactedSecObj:
      - REFID: AVAILABILITY
    assets:
      - REFID: SESSION_KEYS
      - REFID: MGM_VNODE
    CVSS:
      vector: CVSS:3.0/AV:P/AC:H/PR:N/UI:N/S:U/C:N/I:N/A:H
    threatType: Denial of Service
    attack: |
      The MGM's SESSION_KEY get compromised or there's a loss of private key part due to HSM failure or similar.
    public: true
    fullyMitigated: false
