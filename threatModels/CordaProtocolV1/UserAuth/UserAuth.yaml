    countermeasures:
      - ID: ANTI_COLLUSION_POLICIES
        title: Anti-Collusion Policies and Signer Independence
        description: |
          Organizational and structural controls to prevent collusion:

          - **Independence requirements:** Signers must be independent parties
            with no shared ownership, employment, or financial ties
          - **Conflict-of-interest rules:** Documented CoI policies and attestations
          - **Geographic/jurisdictional distribution:** Signers across different
            jurisdictions to prevent local coordination and legal coercion
          - **Higher thresholds for high-value actions:** Scale threshold with impact
          - **Randomized signer selection:** Select subset from larger pool per
            transaction to prevent pre-arranged collusion groups
          - **Transparency and audit trail:** All signing activity logged and
            auditable to increase detection risk
