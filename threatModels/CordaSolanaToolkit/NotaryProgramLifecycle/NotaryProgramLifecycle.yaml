  - ID: THREE_SIGNER_COMPROMISE
    title: Three-Signer Key Compromise (External Quorum Takeover)
    attack: |
      An external attacker compromises three of the five signer keys remotely through malware,
      phishing, supply chain attacks, or endpoint exploitation. The signers are unwilling victims
      whose keys are stolen or abused without their knowledge.

      The attacker may compromise keys sequentially over time, exploiting weak custody practices,
      unpatched endpoints, or social engineering against individual signers.

      With 3-of-5 control, the attacker can approve unauthorized Upgrade Authority or Notary Admin
      transactions without any insider cooperation.

    threatType: Elevation of Privilege
    impactDesc: |
      Complete compromise of privileged governance for deployment and administration.

      Concrete impact scenarios (in order of severity):

      - **Double spending (higher impact, likely):** Attacker upgrades the notary program code
        to bypass uniqueness checks, enabling double-spend of assets on Corda via the Solana notary.
        This directly undermines ASSET_INTEGRITY.

      - **Route bridging/unbridging to attacker accounts (higher impact, unlikely but TBC):**
        Attacker modifies program logic or admin state to redirect bridging or unbridging operations
        to attacker-controlled Solana accounts, stealing assets in transit.

      - **Add unauthorized Corda network (lower impact):** Attacker uses admin authority
        to authorize a rogue Corda network, potentially enabling illegitimate notarization
        requests from an attacker-controlled network.

      - Malicious program upgrade introducing backdoors or persistent compromise
      - Unauthorized authorization/revocation of notaries

