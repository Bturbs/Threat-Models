      inScope: true

    - ID: CORDAPP_USER
      title: CorDapp User
      description: |
        Cordapp user that calls the Flow REST API on a specific VNode.

         **Main use cases:**

          - Call and retrieve CordApp Flows:
             - Gets all flows that can be used by the specified holding identity [API doc](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/Flow-Info-API/operation/get_flowclass__holdingidentityshorthash_)
             - Starts a new instance for the specified flow for the specified holding identity [API doc](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/Flow-Management-API/operation/post_flow__holdingidentityshorthash_)
             - gets the current status of the specified flow instance [API doc](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/Flow-Management-API/operation/get_flow__holdingidentityshorthash___clientrequestid_)
      inScope:
#       TODO: To be defined precisely (R.F.I.: is it accessing RPC APIs with less privileges than VNODE_OPERATOR? is it the same legal entity as the VNODE_OPERATOR ? )
    - ID: CLUSTER_OPERATOR
      title: Cluster Operator
      description: |
        Performs routine operations like uploading a CPIs (i.e. making an app available), enabling VNodes onboarding, upgrading the platform ...
        It uses sensitive APIs but by design it cannot execute remote code (even implicitly by downgrading security), impersonate a VNode or access its private data, 
        cannot also access infrastructure credentials.

        **Main use cases:**
        - Register a VNode:
            - starts the registration process for a holding identity [API doc](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/Member-Registration-API/operation/post_membership__holdingidentityshorthash_)

        - Upload and manages CPI 
            - upload a Corda Package Installer (CPI) file to the Corda cluster [API doc](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/CPI-API/operation/post_cpi)
            - list of all CPIs uploaded to the cluster. [API doc](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/CPI-API/operation/get_cpi)
            - Get the status information for the CPI upload with the given request ID [API doc](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/CPI-API/operation/get_cpi_status__id_) 
            - overwrite the previously stored CPI record. This operation also purges any sandboxes running [API doc](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/Virtual-Node-Maintenance-API/operation/post_maintenance_virtualnode_forcecpiupload)
        - Configure Cluster certificates (P2P, RPC API, CPI code signing checks)
            - imports a certificate chain for a cluster. TODO: fix API DOC [API DOC](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/Certificates-API/operation/put_certificates_cluster__usage_)
            - gets the certificate chain aliases for a cluster. 
            [API doc](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/Certificates-API/operation/get_certificates_cluster__usage_) and other get APIs methods
        - request the CSR (certificate signing request for its own identity) 
            - enables to generate a certificate signing request (CSR) for a tenant (cluster tenant TLS: rpc-api or P2P) [API doc](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/Certificates-API/operation/post_certificates__tenantid___keyid_)
        - apply and read Cluster level configurations 
            - updates a section of the cluster configuration. [API doc](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/Configuration-API)
            - returns the 'active' configuration for the given section, in both the 'raw' format and with defaults applied [API doc](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/Configuration-API/operation/get_config__section_)
        - Manages HSMs ('ACCOUNTS', 'CI', 'LEDGER', 'NOTARY', 'SESSION_INIT', 'TLS', or 'JWT_KEY'):
            - assign a soft HSM to the tenant for the specified category. [API doc](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/HSM-API/operation/post_hsm_soft__tenantid___category_)
            - retrieves information on the HSM of the specified category assigned to the tenant [API doc](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/HSM-API/operation/get_hsm__tenantid___category_)
            - enables to assign a hardware-backed HSM to the tenant for the specified category. [API doc](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/HSM-API/operation/post_hsm__tenantid___category_)
        - Create Cluster level Key Pairs:
            - generates a new key pair for a tenant (cluster tenant being `rpc-api` or `p2p`) [API doc](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/Keys-Management-API/operation/post_keys__tenantid__alias__alias__category__hsmcategory__scheme__scheme_)
        - Setup permissions and RBAC:
            - creates a new permission. [https://CLUSTER/api/v1/permission](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/RBAC-Permission-API/operation/post_permission)
            - creates a set of permissions (bulk) and optionally assigns them to the existing roles. [https://CLUSTER/api/v1/permission/bulk](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/RBAC-Permission-API/operation/post_permission_bulk)
            - creates a new role in the RBAC permission system. [https://CLUSTER/api/v1/role](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/RBAC-Role-API/operation/post_role)
            - adds the specified permission to the specified role. [https://CLUSTER/api/v1/role/{roleid}/permission/{permissionid}](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/RBAC-Role-API/operation/put_role__roleid__permission__permissionid_)
            - removes the specified permission from the specified role.
            - creates a new user with initialPassword, roles, optional SSO ...
            - assigns a specified role to a specified user.
            - removes the specified role from the specified user.
        - Creates and list Virtual Nodes (VNodes)
            - creates a new virtual node[API doc](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/Virtual-Node-API/operation/post_virtualnode)
            - lists all virtual nodes in the cluster[API doc](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/Virtual-Node-API/operation/get_virtualnode)
            - updates the state of a new virtual node to one of the pre-defined values[API doc](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/Virtual-Node-Maintenance-API/operation/put_maintenance_virtualnode__virtualnodeshortid__state__newstate_)

        The operator with monitoring capabilities is also considered The Cluster Operator (not infrastructure operator, as this last is 
        not considered an attacker).

