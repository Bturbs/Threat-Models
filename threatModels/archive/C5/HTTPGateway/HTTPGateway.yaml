  - ID: JAVA_API_DESERIALIZATION
    title: Dangerous data deserialization in REST APIs
    assets:
      - REFID: DF_ALL_HTTP_ENDP
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H
    threatType: Elevation of Privileges
    pentestTestable: true
    attack: |
      An attacker with API access can send specially crafted malicious deserialization objects as part of the endpoints' request data.
      [REF](https://cwe.mitre.org/data/definitions/502.html). 
      Examples may include nested serialized objects like. `"[...]data": { "value": [...]` field in `POST holdingidentityshorthash/{holdingidentityshorthash}`<br/>
      `registration context` and its PEM encode certificate etc.

    impactedSecObj:
      - REFID: FULL_CIA
    public: true
    fullyMitigated: true
    countermeasures:
      - ID: DESERIALIZATION_PROTECTION
        title: Deserialization AllowList
        description: |
          Disable native Java deserialization and restrict non native
          deserialization to safe types (allow list).
        inPlace: true
        public: true



  - ID: CLUSTER_OPERATOR_RESTRICTED1
    title: Enforce authN also to Highly Privileged users e.g. CLUSTER_OPERATOR
    assets:
      - REFID: DF_adminPolicyEndP1
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H
    threatType: Elevation of Privileges, Tampering, Repudiation
    attack: |
      A malicious user could abuse CLUSTER_OPERATOR abilities for performing attacks. The breach 
      in compliance is given by the fact that there is a 'super user' CLUSTER_OPERATOR
      that has the ability to call any API endpoint without RBAC limit or with RBAC policies that are not restricted.
    pentestTestable: true
    impactedSecObj:
      - REFID: FULL_CIA
      - REFID: COMPLIANCE
      - REFID: CLUSTER_OPERATOR_PROTECTION
    public: true
    fullyMitigated: false
    countermeasures:
      - ID: CLUSTER_OPERATOR_AUTHZ
        title: CLUSTER_OPERATOR Authorization enforcement
        description: |
          CLUSTER_OPERATOR or any other `super-user` can only perform a well defined set of actions that do not exceed the 
          strict necessary. All user have enforced RBAC with minimal access.
          No API user should be able to:
            
            1. Compromise logs, monitoring and accountability in general
            2. Impersonate another user
            3. Lower the security configuration of the system
        inPlace: false
        public: true


  - ID: API_UPLOAD1
    assets:
      - REFID: DF_StartupConf1
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H
    threatType: Elevation of Privileges, Tampering, Repudiation
    title: Malicious upload, e.g. CPIs
    attack: |
      An upload of a malicious/tampered artifact (e.g. CPI) from any user, even authorized ones may include
      server side code (e.g. implementation of the API annotated Java classes) that is run in the memory context of the Java process/classpath 
      (HTTP gateway itself, as it discover classpath annotated services) leading to arbitrary code execution.
      REF:
      ```kotlin
      package net.corda.rest.annotations

      import net.corda.rest.annotations.RestApiVersion.C5_0 as MIN_SUPPORTED
      import net.corda.rest.annotations.RestApiVersion.C5_2 as CURRENT

      /**
      * Marks an interface extending `RestResource` to be exposed as an HTTP resource.
      *
      * @property name The name of the resource, used for documentation. Defaults to the class name.
      * @property description The description of the resource, used for documentation. Defaults to empty string.
      * @property path The endpoint path of the resource. All exposed functions of the annotated class will have their path
      * prepended with this. Defaults to the class name.
      * @property minVersion version when API has been introduced.
      * @property maxVersion version till which API is still supported.
      */
      @Target(AnnotationTarget.CLASS)
      @Retention(AnnotationRetention.RUNTIME)
      @SuppressWarnings("LongParameterList")
      annotation class HttpRestResource(
          val name: String = "",
          val description: String = "",
          val path: String = "",
          val minVersion: RestApiVersion = MIN_SUPPORTED,
          val maxVersion: RestApiVersion = CURRENT
      )
      ```
    impactDesc: Full integrity availability and confidentiality loss of the 
      Corda cluster
    impactedSecObj:
      - REFID: FULL_CIA
    public: true
    fullyMitigated: true
    pentestTestable: true
    countermeasures:
      - ID: UPLOAD_VALIDATION
        title: Upload validation
        description: |
          Uploaded files are handled securely and not persisted in Java classpath. For example the CordApp code, even when loaded,
           is not introspceted for dynamicAPI endpoint confiugration, for example
          the default installation with separate HTTP_GATEWAY WORKER_PROCESS also prevents this.
        inPlace: true
        public: true
      # - ID: C2
      #   title: Separate Kubernetes workers in production
      #   description: | 
      #    Combined worker deployment may expand the attack surface of the CPI untrusted code to the point that it
      #     can elverage the network connectivity of the HTTP_GATEWAY. It is not intended for production use.
      #   inPlace: true
      #   public: true

