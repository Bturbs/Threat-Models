parent: C5.CryptoLibrary
ID: CryptoLibraryStandard
schemaVersion: 2
title: Crypto Library Standard Security Level

scope:
  description: |
    When using the `Standard` configuration, the Crypto Worker or Crypto Library does not store the master encryption 
    keys for VNode identities and other keys (such as P2P, RPC HTTP Gateway) in HSMs. Instead,
     it stores them as encrypted/wrapped keys in the databases.

    <img src="img/corda5-Crypto Worker_Standard.svg" />

  attackers:
  assumptions:
    - ID: 1
      description: |

  assets:
    - ID: MASTER_KEY
      inScope: true
      title: master key for 'Standard' Crypto Library
      type: AES secret key
      description: Master key used to encrypt/decrypt Wapping keys protecting 
        VNodes ledger signing key

analysis: |2

  By using the `Standard` configuration (soft HSM) the VNodes do not completely own (they can sign but not restore/transfer)
   their private keys, unless they own the whole Cluster itself (single tenancy). 
   
threats:

  - ID: UNRECOVERABLE_MASTER_KEY
    title: Unrecoverable master encryption key
    threatType: Denial of Service, Repudiation
    assets:
      - REFID: MASTER_KEY
    attack: |
      Due to an IT incident the master key is lost and not recoverable.
    impactDesc: Major loss of Availability on Cluster and inability to validate 
      ledger status
    impactedSecObj:
      - REFID: AVAILABILITY
      # - REFID: LEDGER_DURABILITY
    public: true
    fullyMitigated: true
    CVSS:
      vector: CVSS:3.1/AV:L/AC:H/PR:N/UI:N/S:U/C:N/I:N/A:H/E:U/RC:U
    countermeasures:
      - ID: MASTER_KEY_BACKUP
        title: Backup the master key
        description: |
          Define and implement a reliable backup mechanism for the MASTER_KEY. How to implement this backup depends on the storage on the MASTER_KEY
        operational: true
        operator: INFRASTRUCTURE_OPERATOR
        inPlace: false
        public: true


      # - ID: VAULT_BACKUP_KEYS
      #   title: Use Hashicorp Vault 
      #   description: | 
      #    (RFI: have some doc around this?)
      #   inPlace: false
      #   public: true
      #   operational: true

      # - ID: MULTIPLE_MASTER_KEYS
      #   title: VNode key wrapping encoded with multiple master keys
      #   description: |
      #     It is possible to encrypt the master keys with additional master keys and
      #      backup them for high availability and disaster recovery.
      #   inPlace: false
      #   public: true
      #   operational: true

  - ID: INSECURE_MASTER_KEY_SETUP
    title: Secure Master Wrapping Key setup process
    threatType: Denial of Service, Repudiation

    assets:
      - REFID: MASTER_KEY
    attack: |
      Due to an IT incident the master key is lost and not recoverable.
    impactedSecObj:
      - REFID: DATABASE_LEAK_RESILIENCY
    public: true
    fullyMitigated: true
    CVSS:
      vector: CVSS:3.1/AV:L/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H/E:U/RC:U
    countermeasures:
      - ID: SECURE_MASTER_KEY_SETUP
        title: Backup the master key
        description: |
          MASTER_KEY(s),or secrets to derive the master key from, are injected into the CRYPTO_WORKER at startup from a most secure/trusted zone 
          (see also Threat Model Zones of trust as defined in the "Deployment" threat model). This higher trust zones from which the above mentioned 
          secretes **do not include any unencrypted databases data (CLUSTER_DB ot VNODE_DB)**. Higher trust zones for MASTER_KEY(s), or secrets to derive the master key from, storage options may include dedicated secret injection mechanisms HashiCorp Vault,
           AWS secret manager etc. The specific system used to store MASTER_KEY(s),or secrets to derive the master key from, is out of the scope of this specific Threat Model section.
        inPlace: true
        public: true
        operational: true
        operator: INFRASTRUCTURE_OPERATOR
