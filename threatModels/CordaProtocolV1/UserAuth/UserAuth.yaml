      Compromised signing tools can:

      - Exfiltrate private keys to attacker-controlled infrastructure
      - Display one transaction to signer while signing a different one
      - Modify transaction content after signer approval
      - Leak transaction details (timing, amounts, addresses) before broadcast

      These attacks are particularly dangerous because they bypass all
      threshold and timelock controls — the compromised tool produces what
      appears to be a legitimate signature.
