parent: C5
ID: CryptoLibrary
schemaVersion: 2
title: Crypto Library
children:
  - REFID: CryptoLibraryStandard
version: 1.0

scope:
  description: |
    Reference:

    - [REF1](https://github.com/corda/corda-runtime-os/wiki/Crypto-library)
    - [REF2](https://r3-cev.atlassian.net/wiki/spaces/CB/pages/4164288551/Crypto+and+HSMs)
    - [REF3](https://r3-cev.atlassian.net/wiki/spaces/CB/pages/4290543645/Use+of+wrapping+keys+in+Corda+5)
    - [REF4](https://github.com/corda/platform-eng-design/blob/main/core/corda-5/corda-5.2/network/shared-session-storage/crypto-encryption-api.md)

    **Managed Secrets are:** 

      - P2P HTTP endpoint TLS private key
      - RPC HTTP Gateway API endpoints TLS private key 
      - Transaction signing keys and Session Initiating Key for NVode identities 

    **Sensitive operations:** 

      - Key generation
      - Signing
      - HSM assignments
      - Key lookups

    **This worker provides other less sensitive operations:**

      - Calculating digests
      - Signature verification
      - Providing metadata about public keys and digests, like algorithm

    **Keys involved in this CRYPTO WORKER lifecycle:**

      - Private Key of VNodes (signing and ledger), or TLS key for P2P and RPC
        - Symmetric Wapping key for individual VNodes and TLS private keys 
         - OPTION 2: Symmetric Master Wrapping key(S): An external key management system and picked up by Corda when required 
         - OPTION 1: Symmetric Master Wrapping key(S): at Cluster level (derived from passphrase and salt)
          - Passphrase and Salt environment/parameters to WORKER node to access encrypted configuration and derive Symmetric Master Wrapping key
            


  attackers:
  # assumptions:
  assets:
    - ID: SigningKeyID
      inScope: true
      title: Signing Key ID
      type: database record
      description: The Signing Key ID in the first 12 chars (HEX) of the SHA of 
        the public key (the correspondent private key is the signing)
    - ID: HTTP_GW_TLS_private_key
      inScope: true
      title: HTTP Gateway TLS private key
      type: TLS private key
      description: The private key used to establish TLS connection to for 
        RPC/APIs
    - ID: P2P_private_key
      inScope: true
      title: P2P TLS private key
      type: TLS private key
      description: The private key used to P2P connections
    - ID: VNodePrivateKey
      inScope: true
      title: VNode private ledger signing key
      type: private key
      description: Key used to sign flows and consume Corda network ledger 
        states. This key is critical for availability and cannot be rotated even
        if compromised.

    - ID: MASTER_KEY
      inScope: true
      title: Master Wrapping Key
      type: key
      description: Master key to decrypt, through wrapping keys, private keys. 
        This Master wrapping key is not available in the database but in higher 
        trust zones (CRYPTO_WORKER, secret managers etc.) and allow to decrypt 
        in database encrypted wrapping keys. Encrypted wrapping keys can then 
        decrypt in database encrypted VNodePrivateKey.
      properties:
        location: CRYPTO_WORKER Java memory process
        type: Symmetric master key
        format: AES
        length: 256
      applicationRelated: true
      infrastructureRelated: false

    - ID: MANAGED_WRAPPING_KEY
      inScope: true
      title: Managed Wrapping Key
      type: key
      description: Symmetric keys used to wrap higher level asymmetric private 
        keys. They are stored, wrapped by a master wrapping key, in Crypto 
        databases in both the cluster and per vnode.
      properties:
        location: CRYPTO_WORKER Java memory process
        type: Symmetric key wrapping key
        format: AES
        length: 256
      applicationRelated: true
      infrastructureRelated: false

    - ID: DF_CRYPTO_API1
      inScope: true
      title: Crypto API for symmetric encrypt/decrypt
      type: dataflow
      description: |
        REST APIs (`/crypto-api/session/encrypt` and `/crypto-api/session/decrypt`) which can be used to encrypt and decrypt arbitrary byte arrays using symmetric keys managed by the Crypto component/worker.
        Introduced to remove the affinity between Link Managers and sessions and improve performance (shared end-to-end sessions across all Link Managers).
          ``` fun encrypt(
              tenantId: String,
              alias: String?,
              plainBytes: ByteArray,
              context: Map<String, String> = EMPTY_CONTEXT
            ): ByteArray
          ```
          (RFI: The CRYPTO API likely allows more use cases that those needed, is it the case? this may be against some minimal attack surface etc...)


# listed in e2e as P2P_MASTER_KEY_EPHEMERAL_SESSION_KEY
# - ID: TENANT_ENCRYPTION_SECRET
#   inScope: true
#   title: Crypto API for symmetric encrypt/decrypt 
#   type: key
#   description: |
#     With this Cluster level symmetric key the Crypto Worker can encrypt (and decrypt) an arbitrary byte array for a tenant. Used in 
#     [DF_CRYPTO_API1](#DF_CRYPTO_API1). It also defines a new New HSM Category: `ENCRYPTION_SECRET`. The key will be shared between all
#     VNodes in the cluster; the cluster level tenant is for this key `p2p`.




analysis: |


threats:


  - ID: DB_KEY_ID_DISCLOSURE
    title: Weak database VNode identity to key association
    threatType: Spoofing, Elevation of Privileges
    assets:
      - REFID: VNodePrivateKey
    attack: |
      A successful attack (or incident) that compromises the database confidentiality would easily be escalated to compromise the
       full validity of the ledgers of the cluster and of the Cluster itself.
    impactedSecObj:
      - REFID: DATABASE_LEAK_RESILIENCY
    public: true
    fullyMitigated: true
    CVSS:
      vector: CVSS:3.1/AV:A/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H/E:U/RC:U
    countermeasures:
      - ID: PRIV_KEYS_NOT_IN_CLEAR
        title: Decrypt the private keys only in CRYPTO_WORKER or use HSMs
        description: |
          All `Standard`, `High` or `Ultimate` CRYPTO_WORKER operational modes avoid storing the private keys unencrypted in the databases 
          (or decryptable with database data only). Secrets from higher than the databases Threat Model Trust Zones are used to to access private
           keys and create their signatures.
        inPlace: true
        public: true

  - ID: DB_KEY_ID_TAMPERING
    title: Weak database VNode identity to key association
    threatType: Spoofing
    assets:
      - REFID: SigningKeyID
    attack: |
      It is feasible for an attacker with database write access and any VNode identity 
      (for example due to a SQL injection vulnerability or an database infrastructure incident etc. ) to forge 
      signatures by altering the associated keys to a VNode.
    impactedSecObj:
      - REFID: DATABASE_TAMPER_RESILIENCY
    public: true
    fullyMitigated: false
    CVSS:
      vector: CVSS:3.1/AV:A/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N
    countermeasures:
      - ID: VNODEID_TO_KEY_PROOF
        title: Sign and validate the VNode to SESSION_KEY associations
        description: |
          Implement a database tamper proof mechanism to prevent to associate a VNode identity to some other VNode keys.
          For example add a field that encrypts/signs/HMAC (with a master secret that is not in the database but in an higher trust zone 
          as is for the master wrapping key) this association and verifies it at read time.
        inPlace: false
        public: true

  - ID: DB_KEYID_COLLISION
    title: Weak database VNode identity to key association
    threatType: Spoofing
    assets:
      - REFID: SigningKeyID
    attack: |
      It is feasible for an attacker generate an alternative public key that collides due to the (low)
       48 bit entropy of the [SigningKeyID](#SigningKeyID).
      To execute the attack, the attacker needs to know the target public key (easily obtainable as is it public)
    impactedSecObj:
      - REFID: LEDGER_TX_CONFIDENTIALITY
      - REFID: LEDGER_INTEGRITY
    public: true
    fullyMitigated: true
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N
    countermeasures:
      - ID: KEYID_UNIQUENESS_VALIDATION
        title: KeyID uniqueness validation and enforcement
        description: |
          Uniqueness of the KEYID is verified at key creation time at the database level (unique SQL DDL constraints) 
          (RFI: could we have a link at the code where this KEY ID  uniqueness is defined/enforced?)
          even in the case where the keys are provided from other systems: HSM, PKI session keys etc. 
          In general all used truncated hash/short hashes IDs are collision resistant by validating uniqueness at creation time.
        inPlace: true
        public: false


  - ID: NON_RCE_RESILIENCY
    title: Escalation of successful attack can leak private keys
    threatType: Elevation of privileges, Repudiation, Information Disclosure, 
      Tampering
    assets:
      - REFID: CRYPTO_WORKER
      - REFID: VNodePrivateKey
    attack: |
      A successful attack on any worker (e.g. arbitrary code execution) can escalate in controlling cryptographic
       operations and, depending on the configuration (standard or high) accessing decrypted secrets.
    impactedSecObj:
      - REFID: FULL_CIA
    public: true
    fullyMitigated: false
    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H/E:U/RC:U
    conditional: |
      Security Level: `Standard` OR `High` (non `ultimate`)
    countermeasures:
      - ID: ISOLATED_K8S_NODE_CRYPTO
        title: Isolated Kubernetes node for CRYPTO_WORKER
        description: |
          The Crypto worker will run in a more secure environment (e.g. an isolated kubernetes node).
          This will result in a higher trust zone and in a impediment of horizontal movements and escalation 
          from successful attacks on other nodes
        inPlace: false
        operational: true
        operator: INFRASTRUCTURE_OPERATOR
        public: true


  - ID: ECDSA_SIGNING_KEY_DISCLOSURE
    title: Weak random nonce in ECDSA implementation
    impactedSecObj:
      - REFID: LEDGER_SPOOFING_PREVENTION
    assets:
      - REFID: VNodePrivateKey
    attackers:
      - REFID: VNODE_OPERATOR
    CVSS:
      vector:
    threatType: Spoofing
    attack: |
      The attacker (a VNode operator acting as a counterparty in a flow or transaction) can guess the private key of 
      an ECDSA from previous usage. This attack is only possible
       when the nonce (parameter k) in the ECDSA signature algorithm is not generated uniformly at random.
       "[Attacks against Weak ECDSA Signatures](https://eprint.iacr.org/2019/023.pdf)"           
    public: true
    fullyMitigated: true
    countermeasures:
      - ID: HIGH_ENTROPY_SOURCE
        title: Secure ECDSA Signature Algorithm Implementation
        description: |
          Implementation of the key signing algorithm should use secure random generating nonce with high entropy.
        operational: false
        inPlace: true
        public: true
      - ID: SINGLE_USE_PRIVATE_KEY
        title: Different Signing key for each UTXO
        description: |
          Use a signing key only once. Use a different signing key for each UTXO.  
        operational: false
        inPlace: false
        public: true

  - ID: KEY_ROTATION_SYNCHRONIZATION
    title: Weak database VNode identity to key association
    threatType: Spoofing
    assets:
      - REFID: SigningKeyID
    attack: |
      During MASTER_KEY rotation some CRYPTO_LIB operations may fail due to the non atomic nature of the whole key rotation process.
    impactedSecObj:
      - REFID: LEDGER_TX_CONFIDENTIALITY
      - REFID: LEDGER_INTEGRITY
    public: true
    fullyMitigated: true
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:L
    countermeasures:
      - ID: INCREMENTAL_KEY_ROTATION
        title: KeyID uniqueness validation
        description: |
          At every time there will be at least one working associated VNODE_WRAPPING_KEY per VNode (decrypted with one current the MASTER_WRAPPING_KEY). 
          This imply that there will be at least 2 MASTER_WRAPPING_KEY in the CRYPTO_LIB processes at a certain time during a Key Rotation. The VNode to current key association
          is performed in an atomic (ACID) database transaction. 
        inPlace: false
        public: false


  - ID: CRYPTO_REST_API_EOP
    title: Unauthorized actors can access internal REST APIs
    threatType: Elevation of privileges
    # attackers:
    #   - REFID: ANONYMOUS
    assets:
      - REFID: SigningKeyID
    attack: |
      An attacker that gain access to a less trusted service like monitoring systems can escalate to reach the Crypto API (and other sensitive internal APIs)
    impactedSecObj:
      - REFID: FULL_CIA
    public: false
    pentestTestable: true
    fullyMitigated: true
    CVSS:
      vector: CVSS:3.1/AV:A/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:L
    countermeasures:
      - ID: API_AUTHORIZATION_GATEWAY
        title: Use a configurable K8s Gateway instead of ingress
        description: |
          As different endpoints (worker services, Prometheus monitoring ... ) listen on the same POD port (7000) unauthorized 
          calls should be prevented at least at the trust boundaries. In this case a less trusted service like Prometheus monitoring server could
          access APIs that requires more privileges (Encryption/Description APIs). One way to avoid this is to only expose the specific 
          endpoints to the external service. As the different endpoints all listen to the same TCP port the K8s Ingress configuration 
          is not enough. Another alternative is K8s Gateway that allow to fine configure the PATH of the specific endpoint to be exposed.
          In this case only the Prometheus endpoint will be exposed by the Gateway allowing only internal calls to call other sensitive internal services.
          REF: [Kubernetes gateway](https://kubernetes.io/docs/concepts/services-networking/gateway/)
        operational: false
        inPlace: false
        public: false

      - ID: SEGREGATED_PROMETHEUS_PORT
        title: Use a dedicated port for Prometheus and do not allow ingress on 
          internal APIs ports
        description: |
          Use a dedicated port for Prometheus and do not allow Kubernetes Ingress to expose internal APIs ports.
        operational: false
        inPlace: false
        public: false

      - ID: ISTIO_POLICY_FOR_PROMETHEUS
        title: Istio configuration
        description: |
          Setup dedicated policy for Prometheus agent and do not allow Prometheus to access internal APIs endpoints.
        operational: false
        inPlace: false
        public: false

