scope:
  description: |
    **NOTE:** This threat model outlines potential risks associated with Governance, Risk, and Compliance (GRC) processes and the software product build pipeline within a typical software development company. It focuses on threats that could compromise sensitive data, system integrity, regulatory compliance, and the security of the software supply chain. The scope encompasses policy management, access controls, monitoring, data protection practices, and the integrity of code from development through to deployment artifact storage. It covers concepts often found in compliance frameworks like PCI-DSS but uses generic terminology.

  securityObjectives:

    - ID: AVAILABILITY
      title: System availability
      description: |
        Maintain system availability and performance under normal and adverse conditions, including protection against resource exhaustion and service degradation.
      treeImage: true
      group: Operational Security

    - ID: SENSITIVE_DATA_PROTECTION
      title: Sensitive Data Protection
      description: |
        Protect sensitive company and customer data (e.g., credentials, personal information, financial data, intellectual property) from unauthorized access, disclosure, or modification, both at rest and in transit, across all systems and processes.
      group: Data Security

    - ID: ACCESS_CONTROL
      title: Access Control Enforcement
      description: |
        Ensure access to systems, data, and code repositories is strictly controlled based on the principle of least privilege, role-based access control (RBAC), and strong authentication mechanisms.
      group: Access Management

    - ID: SYSTEM_INTEGRITY_MAINTENANCE
      title: System Integrity Maintenance
      description: |
        Maintain the integrity and security of all IT systems, including servers, workstations, network devices, and build infrastructure, through regular patching, secure configuration, and vulnerability management.
      group: System Integrity

    - ID: BUILD_PIPELINE_INTEGRITY
      title: Build Pipeline Integrity
      description: |
        Ensure the integrity and security of the software build pipeline, protecting source code, build processes, dependencies, and artifacts from tampering or malicious injection.
      group: Supply Chain Security

    - ID: LOGGING_MONITORING_EFFECTIVENESS
      title: Effective Logging and Monitoring
      description: |
        Implement comprehensive logging and monitoring across all critical systems and applications to detect, alert, and facilitate investigation of security incidents and compliance deviations in a timely manner.
      group: Monitoring & Audit

    - ID: COMPLIANCE
      title: Compliance Adherence
      description: |
        Ensure all GRC processes, security controls, and operational procedures meet relevant regulatory requirements, industry standards, and internal policies.
      group: Governance & Compliance

    - ID: SECURE_DEVELOPMENT_PRACTICES
      title: Secure Development Practices
      description: |
        Embed security throughout the software development lifecycle (SDLC), including secure coding standards, code reviews, and security testing, to minimize vulnerabilities in developed software.
      group: Development Security

    - ID: INCIDENT_RESPONSE_CAPABILITY
      title: Incident Response Capability
      description: |
        Maintain a robust incident response plan and capability to effectively detect, contain, eradicate, recover from, and learn from security incidents.
      group: Operational Security

  assets:
    - ID: SENSITIVE_DATA
      type: data
      title: Sensitive Company and Customer Data
      description: |
        Includes PII, financial records, intellectual property, source code, credentials, API keys, configuration secrets, and internal strategy documents.
      inScope: true

    - ID: GRC_POLICIES_PROCEDURES
      type: data
      title: GRC Policies and Procedures Documents
      description: |
        Formal documentation outlining security policies, standards, guidelines, and operational procedures for compliance and risk management.
      inScope: true

    - ID: ACCESS_CONTROL_SYSTEMS
      type: system
      title: Access Control Systems
      description: |
        Includes Identity Provider (IdP), Multi-Factor Authentication (MFA) systems, directory services (e.g., LDAP, Active Directory), and Role-Based Access Control (RBAC) configuration databases.
      inScope: true

    - ID: SOURCE_CODE_REPOSITORIES
      type: system
      title: Source Code Repositories (e.g., Git)
      description: |
        Systems storing the company's proprietary source code, including version history and access controls.
      inScope: true

    - ID: BUILD_SERVERS_INFRASTRUCTURE
      type: system
      title: Build Servers and Infrastructure
      description: |
        CI/CD servers (e.g., Jenkins, GitLab CI, GitHub Actions runners), container orchestration platforms used for builds, and supporting infrastructure.
      inScope: true

    - ID: DEPENDENCY_REPOSITORIES
      type: system
      title: Dependency Repositories
      description: |
        Internal or external repositories storing third-party libraries, packages, and container images used in the software build process (e.g., Nexus, Artifactory, Docker Hub, PyPI, npm).
      inScope: true

    - ID: ARTIFACT_REPOSITORIES
      type: system
      title: Artifact Repositories
      description: |
        Systems storing compiled binaries, container images, and other deployable artifacts generated by the build pipeline.
      inScope: true

    - ID: LOGGING_MONITORING_SYSTEMS
      type: system
      title: Logging and Monitoring Systems
      description: |
        Centralized logging infrastructure (e.g., ELK stack, Splunk), Security Information and Event Management (SIEM) systems, and alerting platforms.
      inScope: true

    - ID: NETWORK_INFRASTRUCTURE
      type: system
      title: Network Infrastructure
      description: |
        Includes firewalls, routers, switches, VPNs, and network segmentation configurations protecting internal and cloud environments.
      inScope: true

    - ID: PRODUCTION_ENVIRONMENTS
      type: system
      title: Production Environments
      description: |
        Live systems hosting the company's software products and services accessed by customers or internal users.
      inScope: true

  assumptions:
    - ID: CLOUD_RELIANCE
      description: |
        The company utilizes cloud infrastructure (IaaS, PaaS, SaaS) for various functions, inheriting some security controls but also introducing cloud-specific risks.
    - ID: BASELINE_NETWORK_SECURITY
      description: |
        Basic network security controls (e.g., firewalls, intrusion detection) are assumed to be in place, but misconfigurations or bypasses are possible.
    - ID: EMPLOYEE_AWARENESS_VARIABILITY
      description: |
        Employee security awareness and adherence to policies vary across the organization.
    - ID: THIRD_PARTY_RISK
      description: |
        The company relies on third-party software, libraries, and services, introducing supply chain risks.

  attackers:
    - ID: MALICIOUS_INSIDER
      description: |
        Current or former employees, contractors, or partners with legitimate access who abuse their privileges for malicious purposes (e.g., data theft, sabotage, fraud).
      inScope: true
    - ID: EXTERNAL_ATTACKER
      description: |
        Unauthorized external entities (hackers, organized crime groups) attempting to breach systems, steal data, or disrupt operations via network attacks, phishing, or exploiting vulnerabilities.
      inScope: true
    - ID: COMPROMISED_THIRD_PARTY
      description: |
        Attackers leveraging compromised credentials or systems of a trusted third-party vendor or software supplier to gain access to the company's environment or inject malicious code into the supply chain.
      inScope: true
    - ID: NATION_STATE_ACTOR
      description: |
        Highly sophisticated attackers sponsored by governments, targeting intellectual property, critical infrastructure, or conducting espionage. Often possess advanced capabilities and resources.
      inScope: true
    - ID: ACCIDENTAL_INSIDER
      description: |
        Employees or contractors who unintentionally cause security incidents through errors, misconfigurations, or falling victim to social engineering.
      inScope: true
    # - ID: NATURAL_DISASTER
    #   description: |
    #     Events such as floods, earthquakes, fires, or chemical spills that physically disrupt operations.
    #   inScope: true
analysis: |
  This threat model analyzes risks to the software company's GRC posture and build pipeline security. It identifies potential attack vectors against key assets like sensitive data, source code, and build systems, considering various attacker types. The focus is on identifying weaknesses in controls related to data protection, access management, system hardening, monitoring, and supply chain security, mapping them to relevant security objectives and proposing countermeasures aligned with common compliance requirements and secure development practices.

threats:
  - ID: UNAUTHORIZED_DATA_ACCESS
    title: Unauthorized Access to Sensitive Data
    attack: |
      Attackers exploit weak authentication, stolen credentials, misconfigured permissions, or software vulnerabilities to gain unauthorized access to databases, file shares, or cloud storage containing sensitive company or customer data.
    threatType: Information Disclosure, Elevation of Privilege
    impactDesc: |
      Exposure of confidential information (PII, financial data, IP), leading to regulatory fines, reputational damage, loss of customer trust, and potential identity theft or fraud. Violation of data privacy regulations.
    impactedSecObj:
      - REFID: SENSITIVE_DATA_PROTECTION
      - REFID: ACCESS_CONTROL
      - REFID: COMPLIANCE
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: MALICIOUS_INSIDER
      - REFID: COMPROMISED_THIRD_PARTY
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N   # Assumes some access needed initially, High impact
    fullyMitigated: false
    compliance:
      - ISO27001:
          - ref: A.5.12 (Classification of information)
          - ref: A.5.14 (Information transfer)
          - ref: A.5.15 (Access control)
          - ref: A.5.16 (Identity management)
          - ref: A.5.17 (Authentication information)
          - ref: A.5.18 (Access rights)
          - ref: A.5.34 (Privacy and protection of PII)
          - ref: A.8.3 (Information access restriction)
          - ref: A.8.5 (Secure authentication)
          - ref: A.8.11 (Data masking)
          - ref: A.8.12 (Data leakage prevention)
    ticketLink: https://r3-cev.atlassian.net/browse/RR-640
    countermeasures:
      - ID: RBAC_IMPLEMENTATION
        title: Implement Strict Role-Based Access Control (RBAC)
        description: |
          Define roles with minimum necessary privileges and assign users/systems to these roles. Regularly review and audit access rights.
        inPlace: true
        public: true
      - ID: STRONG_AUTHENTICATION
        title: Enforce Strong Authentication and MFA
        description: |
          Require strong passwords/passkeys and Multi-Factor Authentication (MFA) for all access to systems handling sensitive data, especially for privileged accounts.
        inPlace: true
        public: true
      - ID: DATA_ENCRYPTION
        title: Encrypt Sensitive Data at Rest and In Transit
        description: |
          Utilize strong encryption protocols (e.g., TLS 1.2+) for data in transit and robust encryption methods (e.g., AES-256) for data stored in databases, file systems, and object storage. Implement proper key management.
        inPlace: true
        public: true
      - ID: DATA_MINIMIZATION
        title: Implement Data Minimization Principles
        description: |
          Collect and retain only the sensitive data absolutely necessary for legitimate business purposes and delete or anonymize it when no longer needed.
        inPlace: false
        public: true

  - ID: WEAK_ACCESS_CONTROL
    title: Weak or Misconfigured Access Controls
    attack: |
      Attackers exploit overly permissive default settings, lack of granular controls, misconfigured RBAC policies, or failure to revoke access for terminated employees/systems to escalate privileges or gain unauthorized access.
    threatType: Elevation of Privilege, Information Disclosure
    impactDesc: |
      Unauthorized users or systems gain access beyond their intended permissions, potentially leading to data breaches, system compromise, or unauthorized system modifications.
    impactedSecObj:
      - REFID: ACCESS_CONTROL
      - REFID: SENSITIVE_DATA_PROTECTION
      - REFID: SYSTEM_INTEGRITY_MAINTENANCE
    attackers:
      - REFID: MALICIOUS_INSIDER
      - REFID: EXTERNAL_ATTACKER
      - REFID: ACCIDENTAL_INSIDER
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H   # Assumes some initial access, high impact
    fullyMitigated: false
    compliance:
      - ISO27001:
          - ref: A.5.15 (Access control)
          - ref: A.5.16 (Identity management)
          - ref: A.5.18 (Access rights)
          - ref: A.8.2 (Privileged access rights)
          - ref: A.8.3 (Information access restriction)
          - ref: A.8.5 (Secure authentication)
          - ref: A.8.9 (Configuration management)
    ticketLink: https://r3-cev.atlassian.net/browse/RR-637
    countermeasures:
      - ID: LEAST_PRIVILEGE
        title: Enforce Principle of Least Privilege
        description: |
          Grant users and systems only the minimum permissions required to perform their designated functions.
        inPlace: true
        public: true
      - ID: ACCESS_REVIEW_PROCESS
        title: Regular Access Reviews
        description: |
          Periodically review user access rights, group memberships, and system permissions to ensure they remain appropriate and remove unnecessary access. Implement automated workflows for joiners, movers, and leavers.
        inPlace: true
        public: false
      - ID: CONFIGURATION_MANAGEMENT_ACCESS
        title: Secure Configuration Management for Access Controls
        description: |
          Use infrastructure-as-code and configuration management tools to define and enforce access control policies consistently. Audit configurations regularly.
        inPlace: false
        public: true

  - ID: INSUFFICIENT_LOGGING_MONITORING
    title: Insufficient Logging and Monitoring
    attack: |
      Lack of comprehensive logging or ineffective monitoring prevents timely detection of security incidents, policy violations, or system anomalies. Attackers operate undetected for longer periods.
    threatType: Detection Evasion
    impactDesc: |
      Delayed detection and response to attacks, inability to investigate incidents effectively, failure to meet compliance requirements for audit trails, increased damage from breaches.
    impactedSecObj:
      - REFID: LOGGING_MONITORING_EFFECTIVENESS
      - REFID: COMPLIANCE
      - REFID: INCIDENT_RESPONSE_CAPABILITY
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: MALICIOUS_INSIDER
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H   # Impacts Availability of detection/response
    fullyMitigated: false
    compliance:
      - ISO27001:
          - ref: A.5.29 (Information security during disruption) # Detection aspect
          - ref: A.8.16 (Monitoring activities)
          - ref: A.5.33 (Protection of records) # Log integrity
    ticketLink: https://r3-cev.atlassian.net/browse/RR-642
    countermeasures:
      - ID: CENTRALIZED_LOGGING
        title: Implement Centralized Logging
        description: |
          Collect logs from all critical systems (servers, network devices, applications, databases, build systems) into a centralized, secure logging system (e.g., SIEM).
        inPlace: true
        public: true
      - ID: LOG_CONTENT_STANDARDS
        title: Define Log Content Standards
        description: |
          Ensure logs contain sufficient detail (timestamp, source, user ID, event type, status, target resource) to reconstruct events and detect anomalies. Include logs for access attempts (success/failure), configuration changes, and data access.
        inPlace: true
        public: true
      - ID: REALTIME_ALERTING
        title: Configure Real-time Alerting
        description: |
          Set up automated alerts in the SIEM or monitoring system for suspicious activities, security events, policy violations, and critical system failures.
        inPlace: true
        public: true
      - ID: LOG_RETENTION_PROTECTION
        title: Secure Log Storage and Retention
        description: |
          Protect logs from tampering and ensure they are retained according to regulatory and operational requirements.
        inPlace: true
        public: true

  - ID: VULNERABLE_SYSTEMS_UNPATCHED
    title: Failure to Maintain Secure Systems (Patching/Hardening)
    attack: |
      Attackers exploit known vulnerabilities in operating systems, applications, libraries, or network devices that have not been patched or securely configured.
    threatType: Exploitation of Vulnerability
    impactDesc: |
      System compromise, malware infection, denial of service, data breaches, lateral movement within the network. Non-compliance with vulnerability management requirements.
    impactedSecObj:
      - REFID: SYSTEM_INTEGRITY_MAINTENANCE
      - REFID: COMPLIANCE
      - REFID: SENSITIVE_DATA_PROTECTION
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: MALICIOUS_INSIDER
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H   # High impact if critical vulnerability exists
    fullyMitigated: false
    compliance:
      - ISO27001:
          - ref: A.8.8 (Management of technical vulnerabilities)
          - ref: A.8.9 (Configuration management) # Hardening
          - ref: A.8.32 (Change management) # Patch deployment
          - ref: A.5.31 (Legal, statutory, regulatory and contractual 
              requirements)                                                         # Compliance aspect
    ticketLink: https://r3-cev.atlassian.net/browse/RR-629
    countermeasures:
      - ID: VULN_MANAGEMENT_PROGRAM
        title: Implement a Vulnerability Management Program
        description: |
          Regularly scan systems for vulnerabilities using automated tools. Prioritize and remediate vulnerabilities based on risk (e.g., CVSS score, exploitability, asset criticality).
        inPlace: true
        public: true
      - ID: TIMELY_PATCHING
        title: Establish Timely Patch Management Process
        description: |
          Implement a process to identify, test, and deploy security patches for operating systems, applications, and third-party software within defined timelines based on severity.
        inPlace: true
        public: true
      - ID: SECURE_CONFIGURATION_STANDARDS
        title: Define and Enforce Secure Configuration Standards
        description: |
          Develop hardening baselines for all system types (servers, databases, network devices, workstations). Disable unnecessary services/ports, enforce strong configurations, and audit compliance.
        inPlace: true
        public: true

  - ID: COMPROMISED_SOURCE_CODE_REPO
    title: Source Code Repository Compromise
    attack: |
      Attackers gain unauthorized access to the source code repository (e.g., via stolen developer credentials, repository vulnerabilities) and inject malicious code, steal intellectual property, or tamper with commit history.
    threatType: Tampering, Information Disclosure, Code Injection
    impactDesc: |
      Introduction of backdoors or vulnerabilities into software products, theft of valuable IP, disruption of development workflows, loss of trust in software integrity.
    impactedSecObj:
      - REFID: BUILD_PIPELINE_INTEGRITY
      - REFID: SYSTEM_INTEGRITY_MAINTENANCE
      - REFID: SENSITIVE_DATA_PROTECTION
      - REFID: SECURE_DEVELOPMENT_PRACTICES
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: MALICIOUS_INSIDER
      - REFID: COMPROMISED_THIRD_PARTY
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H   # Compromise can impact downstream systems (Scope Change)
    fullyMitigated: false
    compliance:
      - ISO27001:
          - ref: A.5.15 (Access control)
          - ref: A.5.18 (Access rights)
          - ref: A.8.4 (Access to source code)
          - ref: A.8.5 (Secure authentication)
          - ref: A.8.25 (Secure development life cycle)
          - ref: A.8.28 (Secure coding) # Review aspect
          - ref: A.8.32 (Change management)
          - ref: A.5.32 (Intellectual property rights)
    ticketLink: https://r3-cev.atlassian.net/browse/RR-626
    countermeasures:
      - ID: S_ACCESS_CONTROL
        title: Secure Access Control for SCM
        description: |
          Enforce strong authentication (MFA) for repository access. Implement least privilege for branch access and merge rights. Regularly audit permissions.
        inPlace: true
        public: true
      - ID: MANDATORY_CODE_REVIEW
        title: Mandatory Code Reviews
        description: |
          Require peer reviews for all code changes before merging to detect malicious or insecure code. Use tools to enforce review policies (e.g., required approvers).
        inPlace: true
        public: true
      - ID: COMMIT_SIGNING
        title: Enforce Commit Signing
        description: |
          Require developers to cryptographically sign their commits (e.g., using GPG) to ensure authenticity and integrity of code contributions. Configure repository to verify signatures.
        inPlace: false
        public: true
      - ID: S_AUDIT_LOGGING
        title: Comprehensive SCM Audit Logging
        description: |
          Enable detailed logging for all repository activities (clones, fetches, pushes, permission changes) and monitor for suspicious behavior.
        inPlace: true
        public: true

  - ID: BUILD_SERVER_COMPROMISE
    title: Build Server Compromise
    attack: |
      Attackers compromise the build server/CI/CD infrastructure (e.g., via OS vulnerabilities, weak credentials, insecure plugins) to inject malicious code into the build process, tamper with artifacts, or steal secrets used during the build.
    threatType: Tampering, Code Injection, Information Disclosure
    impactDesc: |
      Distribution of compromised software artifacts containing malware or backdoors, exposure of build secrets (API keys, signing keys), disruption of the build pipeline.
    impactedSecObj:
      - REFID: BUILD_PIPELINE_INTEGRITY
      - REFID: SYSTEM_INTEGRITY_MAINTENANCE
      - REFID: SENSITIVE_DATA_PROTECTION
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: MALICIOUS_INSIDER
    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:H/UI:N/S:C/C:H/I:H/A:H   # High privilege usually needed, high impact with scope change
    fullyMitigated: false
    compliance:
      - ISO27001:
          - ref: A.5.15 (Access control)
          - ref: A.5.18 (Access rights)
          - ref: A.8.2 (Privileged access rights)
          - ref: A.8.9 (Configuration management) # Hardening
          - ref: A.8.14 (Development, test and production environments)
          - ref: A.8.16 (Monitoring activities)
          - ref: A.8.25 (Secure development life cycle)
          - ref: A.8.31 (Separation of development, test and production 
              environments)
          - ref: A.8.32 (Change management)
    ticketLink: https://r3-cev.atlassian.net/browse/RR-641
    countermeasures:
      - ID: HARDEN_BUILD_INFRA
        title: Harden Build Infrastructure
        description: |
          Apply secure configuration baselines and timely patching to build servers and CI/CD tools. Run builds in isolated environments (e.g., containers, VMs) with least privilege. Limit network access.
        inPlace: true
        public: true
      - ID: SECURE_SECRET_MANAGEMENT_BUILD
        title: Secure Secret Management in Build Pipeline
        description: |
          Use secure secret management solutions (e.g., HashiCorp Vault, cloud provider KMS/Secrets Manager) to inject secrets into the build process at runtime, avoiding hardcoding or storing them in source code or build logs.
        inPlace: true
        public: true
      - ID: BUILD_PROCESS_MONITORING
        title: Monitor Build Processes
        description: |
          Log and monitor build execution steps, dependencies fetched, and artifacts generated. Alert on unexpected changes or anomalies.
        inPlace: true
        public: true
      - ID: ARTIFACT_INTEGRITY_CHECKS
        title: Verify Artifact Integrity
        description: |
          Generate and verify checksums or digital signatures for build artifacts to detect tampering during or after the build process.
        inPlace: false
        public: true

  - ID: MALICIOUS_DEPENDENCY_INJECTION
    title: Malicious Dependency Injection (Supply Chain)
    attack: |
      Attackers publish malicious packages to public repositories (typosquatting, dependency confusion) or compromise legitimate dependencies, causing the build process to download and incorporate malware.
    threatType: Code Injection, Tampering
    impactDesc: |
      Inclusion of malicious code in the final software product, leading to potential backdoors, data exfiltration, or system compromise in production environments where the software is deployed.
    impactedSecObj:
      - REFID: BUILD_PIPELINE_INTEGRITY
      - REFID: SYSTEM_INTEGRITY_MAINTENANCE
      - REFID: SECURE_DEVELOPMENT_PRACTICES
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: COMPROMISED_THIRD_PARTY
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H   # Easy to trigger, high impact with scope change
    fullyMitigated: false
    compliance:
      - ISO27001:
          - ref: A.5.19 (Information security in supplier relationships)
          - ref: A.5.20 (Addressing information security within supplier 
              agreements)
          - ref: A.5.21 (Managing information security in the ICT supply chain)
          - ref: A.8.25 (Secure development life cycle)
          - ref: A.8.26 (Application security requirements) # Dependency management
          - ref: A.8.29 (Security testing in development and acceptance) # SCA
          - ref: A.8.32 (Change management) # Dependency updates
    ticketLink: https://r3-cev.atlassian.net/browse/RR-627
    countermeasures:
      - ID: DEPENDENCY_SCANNING
        title: Implement Dependency Scanning
        description: |
          Use Software Composition Analysis (SCA) tools to scan dependencies for known vulnerabilities (CVEs) and potentially malicious packages during the build process.
        inPlace: true
        public: true
      - ID: INTERNAL_PACKAGE_REPO
        title: Use a Curated Internal Package Repository
        description: |
          Maintain an internal repository (proxy/cache) for approved third-party dependencies. Vet dependencies before adding them and restrict builds to only use the internal repository. Mitigates dependency confusion.
        inPlace: false
        public: true
      - ID: LOCK_FILES
        title: Use Dependency Lock Files
        description: |
          Utilize lock files (e.g., package-lock.json, yarn.lock, requirements.txt with hashes) to ensure builds use specific, verified versions of dependencies.
        inPlace: true
        public: true
      - ID: DEPENDENCY_REVIEW_PROCESS
        title: Manual Review for New Dependencies
        description: |
          Implement a process to review and approve the introduction of new third-party dependencies into projects.
        inPlace: false
        public: false

  - ID: ARTIFACT_REPO_POISONING
    title: Artifact Repository Poisoning
    attack: |
      Attackers gain unauthorized access to the artifact repository and replace legitimate build artifacts (binaries, container images) with malicious versions, or upload new malicious artifacts that might be mistakenly used.
    threatType: Tampering, Code Injection
    impactDesc: |
      Deployment of compromised software into testing or production environments, leading to widespread system compromise or data breaches.
    impactedSecObj:
      - REFID: BUILD_PIPELINE_INTEGRITY
      - REFID: SYSTEM_INTEGRITY_MAINTENANCE
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: MALICIOUS_INSIDER
    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H   # Requires repo access, high impact with scope change
    fullyMitigated: false
    compliance:
      - ISO27001:
          - ref: A.5.15 (Access control)
          - ref: A.5.18 (Access rights)
          - ref: A.8.9 (Configuration management) # Repo setup
          - ref: A.8.16 (Monitoring activities)
          - ref: A.8.25 (Secure development life cycle)
          - ref: A.8.32 (Change management) # Artifact promotion
          - ref: A.5.21 (Managing information security in the ICT supply chain)
    ticketLink: https://r3-cev.atlassian.net/browse/RR-638
    countermeasures:
      - ID: ARTIFACT_REPO_ACCESS_CONTROL
        title: Secure Access Control for Artifact Repository
        description: |
          Enforce strong authentication and authorization for repository access. Limit write permissions to authorized build service accounts or specific users.
        inPlace: true
        public: true
      - ID: ARTIFACT_SIGNING
        title: Implement Artifact Signing and Verification
        description: |
          Digitally sign all build artifacts using trusted keys upon creation. Verify signatures before deployment to ensure integrity and authenticity.
        inPlace: false
        public: true
      - ID: IMMUTABLE_ARTIFACTS
        title: Use Immutable Artifact Tagging/Versioning
        description: |
          Prevent overwriting of existing artifact versions/tags in the repository. Use unique versioning for each build.
        inPlace: true
        public: true
      - ID: ARTIFACT_REPO_AUDITING
        title: Audit Artifact Repository Activity
        description: |
          Log all artifact uploads, downloads, and permission changes. Monitor for unauthorized or suspicious activities.
        inPlace: true
        public: true

  - ID: NON_MAM_APP_DATA_LEAKAGE
    title: Data Leakage via Non-MAM Supported Apps (e.g., Slack)
    attack: |
      Users, either inadvertently or intentionally, transfer sensitive corporate information from company systems (e.g., Slack) to personal devices or external locations not managed by Mobile Application Management (MAM) policies. This bypasses intended data protection controls.
    threatType: Information Disclosure, Compliance Violation
    impactDesc: |
      Sharing corporate information outside the controlled R3 environment via non-MAM apps like Slack can lead to data leakage,
       regulatory violations (e.g., GDPR), loss of confidentiality, reputational damage, 
       and potential legal issues. Sensitive information could be accessed or shared inappropriately.
    impactedSecObj:
      - REFID: SENSITIVE_DATA_PROTECTION
      - REFID: COMPLIANCE
    attackers:
      - REFID: ACCIDENTAL_INSIDER
      - REFID: MALICIOUS_INSIDER
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:U/C:H/I:L/A:N   # Network access, Low complexity, Low priv, User interaction, Scope Unchanged, High Confidentiality, Low Integrity, No Availability impact
    fullyMitigated: true
    compliance: # Updated/Refined ISO 27001:2022 references
      - ISO27001:
          - ref: A.5.1 (Policies for information security)
          - ref: A.5.10 (Acceptable use of information and other associated 
              assets)
          - ref: A.5.14 (Information transfer)
          - ref: A.5.23 (Information security for use of cloud services) # Slack is SaaS
          - ref: A.6.3 (Information security awareness, education and training)
          - ref: A.8.1 (User end point devices) # MAM relates here
          - ref: A.8.12 (Data leakage prevention)
          - ref: A.5.34 (Privacy and protection of PII) # If PII involved
      - GDPR: # Existing GDPR refs kept
          - ref: Art.5 # Principles relating to processing of personal data
          - ref: Art.24 # Responsibility of the controller
          - ref: Art.25 # Data protection by design and by default
          - ref: Art.32 # Security of processing
          - ref: Art.33 # Notification of a personal data breach
          - ref: Art.34 # Communication of a personal data breach to the data subject
    countermeasures:
      - ID: MAM_ENFORCEMENT
        title: Enforce Mobile Application Management (MAM)
        description: |
          Implement and enforce MAM policies for corporate applications (including communication tools like Slack) on all devices accessing company data to prevent unauthorized data transfer.
        inPlace: true
        public: true
      - ID: DLP_IMPLEMENTATION_SLACK
        title: Implement Data Loss Prevention (DLP) for Slack
        description: |
          Deploy DLP solutions configured to monitor and block the transfer of sensitive information patterns via Slack, especially to unmanaged destinations.
        inPlace: false
        public: true
      - ID: RISK_ACCEPTANCE_NON_MAM
        title: Formal Risk Assessment and Exception Process for Non-MAM Apps
        description: |
          Establish a formal process to assess the risks of using non-MAM supported applications, document exceptions, and implement compensating controls where necessary. Obtain formal risk acceptance from relevant stakeholders.
        inPlace: false
        public: false
      - ID: USER_AWARENESS_TRAINING_DATA_HANDLING
        title: User Awareness Training on Data Handling
        description: |
          Conduct regular training to educate users about the risks of transferring corporate data to personal devices and the proper procedures for handling sensitive information.
        inPlace: false
        public: true



