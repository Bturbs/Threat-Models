  - ID: INSECURE_KEYCLOAK_CACHE_SYNC
    title: Insecure Infinispan Cache Synchronization
    assets:
      - REFID: INFINISPAN_CACHE
      - REFID: DF_INFINISPAN_CACHE_SYNC
      - REFID: KEYCLOAK
    attack: |
      An attacker can intercept or manipulate the data flow during the
        Infinispan Cache synchronization process, leading to data corruption or
        unauthorized access.

      **Refs:** [LLD - 12.10 Identity and Access Management (IAM)/Identity management performance, scalability & resiliency](#LLD)
    impactedSecObj:
      - REFID: DEFENSE_IN_DEPTH
      - REFID: ZERO_TRUST
      - REFID: ZERO_TRUST
    fullyMitigated: true
    CVSS:
      vector: CVSS:3.1/AV:L/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H
    threatType: Tampering
    public: true
    countermeasures:
      - ID: MTLS_INFINISPAN_CACHE_SYNC
        title: Mutual TLS for Infinispan Cache Synchronization
        description: |
          Implement mutual TLS for the Infinispan Cache synchronization process to ensure
          data integrity, authenticity, and confidentiality. This is crucial for securing 
          the communication between Keycloak pods and Infinispan, especially during session 
          data synchronization. Infinispan moves session state to an in-memory cache to handle 
          multiple replicas, and mutual TLS will protect this data during transit.
          mTLS is in place as Keyclock run on a Kubernetes pod, all pods are mTLS enabled 
          Linkerd.

          **Refs:** [LLD - 5.3 Corda Networks/Service mesh](#LLD), [LLD - 12.9.3.1 Identity and Access Management (IAM)/Securing the identity provider/Keycloak data/Data in transit](#LLD)
        inPlace: true
        public: true

  - ID: SERVICE_TO_SERVICE_AUTHNZ
    title: Service-to-Service Authorization
    attack: |
      An attacker with access to an internal network or process 
      can escalate the attack and exploit a vulnerability in the service-to-service authorization mechanism
      to gain unauthorized access to sensitive resources or perform unauthorized actions.

      **Refs:** [LLD - 13 Network Identity Detailed Design](#LLD)
    impactDesc: |
      - Unauthorized access to sensitive resources.
      - Unauthorized actions performed by the attacker.

      **Refs:** [LLD - 12.11 Identity and Access Management (IAM)/Authorization services](#LLD)
    impactedSecObj:
      - REFID: ZERO_TRUST
      - REFID: DEFENSE_IN_DEPTH
      - REFID: PRINCIPLE_LEAST_PRIVILEGE
    fullyMitigated: true
    CVSS:
      vector: CVSS:3.1/AV:A/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H
    threatType: Elevation of Privilege
    public: true
    countermeasures:
      - ID: SVID_JWT
        title: Strict SVID/SPIFFE JWT Authentication & Audience Check
        description: |
          Require issuance API callers to present valid SPIFFE-based JWT tokens. 
          Validate token signatures, issuer, and audience fields to ensure 
          only trusted Core Business Services or the Issuance Platform can invoke 
          the connector. Based in the verified identity, 
          the service/APP/API can also enforce fine-grained authorization at the 
          application/service level.

          **Refs:** [LLD - 13.3 Network Identity Detailed Design/SPIFFE identity format](#LLD), [LLD - 13.4 Network Identity Detailed Design/Exchanging application identity via tokens](#LLD)
        inPlace: true
        public: true

      - ID: MTLS_SERVICE_MESH
        title: Mutual TLS for Service Mesh
        description: |
          Implement mutual TLS for the service mesh to ensure secure 
          communication between services.

          **Refs:** [LLD - 5.3 Corda Networks/Service mesh](#LLD)
        inPlace: true
        public: true

  - ID: HASHURA_CREDENTIAL_DISCLOSURE
    title: Hashura Credentials Disclosure
    attack: |
      An attacker can gain unauthorized access to the Hasura GraphQL Engine by intercepting or improperly handling the admin secret. 
      The current practice of sharing the admin secret variable exposes it to potential misuse or compromise. 
      This could allow unauthorized services or individuals to query or modify sensitive resource data.

      **Refs:** [LLD - 12.11.5 Identity and Access Management (IAM)/Authorization services/Component 2 - Resource Service (using Hasura GraphQL Engine)](#LLD)
    impactDesc: |
      - Unauthorized access to the Hasura GraphQL Engine.
      - Potential modification of resource data and security settings.
      - Violation of the principle of least privilege, as the admin secret grants excessive permissions.

      **Refs:** [LLD - 12.11.5.5 Identity and Access Management (IAM)/Authorization services/Component 2 - Resource Service (using Hasura GraphQL Engine)/Security guarantees](#LLD)
    impactedSecObj:
      - REFID: ZERO_TRUST
      - REFID: DEFENSE_IN_DEPTH
      - REFID: PRINCIPLE_LEAST_PRIVILEGE
    fullyMitigated: false
    CVSS:
      vector: CVSS:3.1/AV:L/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H
    threatType: Elevation of Privilege
    public: false
    countermeasures:
      - ID: HASHURA_CREDENTIALS_HARDENING
        title: Harden Hasura Credential Management
        description: |
          Implement the following measures to secure Hasura credentials:
          1. **Use Hashicorp Vault for Credential Management**: Store the admin secret in Hashicorp Vault and retrieve it dynamically at runtime. Avoid exposing it in Terraform outputs or configuration files.
          2. **Enforce Role-Based Access Control (RBAC)**: Replace the admin secret with service-specific credentials that grant only the minimum required permissions (e.g., read-only for querying services, write access for resource management).
          3. **Use mTLS for Service Communication**: Once the service mesh is set up, enforce mutual TLS (mTLS) to secure communication between services and Hasura.

          **Refs:** [LLD - 11 Secrets Management](#LLD), [LLD - 12.9.5 Identity and Access Management (IAM)/Securing the identity provider/Secrets management](#LLD)
        inPlace: false
        public: true



