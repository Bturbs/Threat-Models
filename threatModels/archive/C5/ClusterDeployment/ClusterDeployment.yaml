  - ID: KAFKA_CONN1
    title: Insecure Kafka connection
    assets:
      - REFID: DF_KAFKA_WORKERS
    CVSS:
      vector: CVSS:3.1/AV:A/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H
    threatType: Tampering, Information Disclosure
    attack: |
      An attacker with gained internal network access can perform man in the middle attack to gain unauthorised access to Kafka 
    impactedSecObj:
      - REFID: FULL_CIA
    public: true
    fullyMitigated: true
    countermeasures:
      - ID: CLIENT_KAFKA_TLS
        title: Kafka SASL-SSL
        description: |
          The CLUSTER_OPERATOR creates secure Kubernetes secrets:
            - kafka-sasl-`worker-name`: containing the username/password for the single worker pod to Kafka, the default secrets shares all password across workers (RFI: @DavidCurrie is it correct?)
            - kafka-tls: containing the secure server certificates (the default value at installation time contains also the private key that needs to be deleted)
# TLS can be used, and a password-protected trust store defined -
#  the trust store password is passed to the JVM level System Property (cmd parameter with the file name) 
#  WORKER_PROCESS and then use the Java Kafka client.
        inPlace: true
        public: true
        operational: true
        operator: INFRASTRUCTURE_OPERATOR
