scope:
  description: |
    The scope of analysis of this Corda 5 (NextGen) Threat Model section is composed of:

    - Flow sandbox: runs CPI's Flow code inside the FLOW_WORKER process
    - Verification sandbox: runs all historical contracts CPK's code inside the FLOW_WORKER process
    - JPA sandboxes: runs persistance data operations in the DB_WORKER process

    Findings will be related to the trust relationship between participants 
    ,in this threat model often called `attackers`, on the specific final Cluster instance installation.

    The trust between the (1 or more) ApplicationPublisher and the VNode (one or more) is also at the base of the operational model classification:

    > From `C5 parent` Scope description:
    >  **Operational Modes**
    >
    >    There are different ways in which a Corda 5 Cluster can be used/operated, here summarized in three main tenancy modes:
    >
    >    1) **Single tenant**: Cluster with single VNode and single or multiple trusted CordApp CPIs
    >
    >    2) **Multiple tenants with trusted CPIs**: Cluster with multiple VNodes with a single or multiple trusted (by all NVodes) CordApp CPIs
    >
    >    3) **Unconstrained multi-hosting**: Cluster with multiple VNodes with multiple untrusted CorDapps CPIs
    >
    >    The different operational modes may impact specific threats and their mitigations. 
    >    In particular `Single tenant` poses less threats than `Multiple tenants with trusted CPIs`
    >    that poses less threat than `Full multi-hosting` operational mode.

    In **Full multi-tenancy** operational mode we imply that some VNode do not trust other 
    VNodes ApplicationPublisher CPBs, signed by another, as well untrusted, MGM.

    This operational mode coincides with the conditional threats on which condition is: `Unconstrained multi-hosting`



    REF:

    - VNode design: https://github.com/corda/platform-eng-design/blob/master/core/corda-5/corda-5.0/virtual-node/index.md
    - In particular, high level overview: https://github.com/corda/platform-eng-design/blob/master/core/corda-5/corda-5.0/virtual-node/vnode-design.md
    - Sandbox overview:  https://r3-cev.atlassian.net/wiki/spaces/CB/pages/4047798306/Sandboxes+Components+and+Services+Documentation
    - Security Manager: https://r3-cev.atlassian.net/wiki/spaces/CCD/pages/3966861374/Security+Manager+-+Integration+POC+CORE-4094

  assets:
    - ID: DF_EXEC_SB1
      type: process
      title: Flow code execution in Sandbox
      description: Flow code executed in Sandbox as part of the FLOW_WORKER 
        process
      inScope: true
    - ID: DF_UNSUSPEND_SB1
      type: DATAFLOW
      title: Suspended Flow deserialization
      description: |
        Serialized quasar bytecode get loaded from the DB and execute (resumed) 
        in a FLOW_SANDBOX, typically when receiving a e2e Flow message
      inScope: true

