scope:
  description: |
    The scope of analysis of this Corda 5 Threat Model section is composed of:

    - The notary
    - Uniqueness checking specification
    - Notarisation request flows

    Corda 5 standard notarisation protocol is the non-validating protocol. However, notary services with 
    different notarisation protocol is also allowed. 
    The MGM is responsible for allowing notary services on the network. 

    <strong>SubMerkle Tree Notary</strong><br/>
     The following diagram shows transaction fields that are disclosed to a standard non-validating notary. 
     This is known as transaction tear-offs, 
     and is used to hide components of the transaction for privacy purposes. 
     Transaction fields that are disclosed to a standard non-validating notary are:

       - Transaction hash (root of the Merkle Tree)
       - Input state references
       - Notary, which is used to identify the notary
       - Time window bounds, which is used to specify the time range to validate the transaction
       - Number of output states (not shown in the diagram)
       - Reference states (not shown in the diagram) 
       (RFI: How input state references are distinguished by the notary from referece states?) 
      <img src="img/SubMerkleTree_Notary.png"/>

    The uniqueness checker is a stand alone service that is called by the notary. It is independent of the notarisation
    protocol. 
    The uniqueness checker requires that all transactions are presented to it, 
    even those containing only output states (i.e. issuance transactions). 
    It is responsible for validating the following:

       - Any reference states in a transaction have not been spent
       - Any input states in a transaction have not been spent
       - Any time window bounds specified by a transaction are valid at the point the uniqueness checker 
        processes the transaction
        
    These checks are performed sequentially, with the notary stopping validation at the first point of failure, 
    even if the transaction would have gone on to fail further checks. 
    For example, if a transaction contained both spent reference and spent input states, 
    then only the reference state check would fail. 
    If the reference states were subsequently removed and a new transaction submitted this would then 
    fail the input state checks.  


    <strong>Notarization sequence</strong><br/>
    The following is a sequence diagram that shows notarisation requests made as part of the finality flow. 


  assets:
    - ID: States
      type: Data
      title: State
      description: An immutable object that can represent a fact. It references 
        a contract that governs the evolution of states. An example of a state 
        could be a bank account.
      inScope: true
    - ID: Transactions
      type: Data
      title: Transaction
      description: |
        A proposal to update the ledger. They manage state transitions.  
      inScope: true

    - ID: UTXO
      type: Data
      title: Unspent transactions output
      description: An (unspent) unconsumed transactions outputs. This is also 
        called the current state.
      inScope: true

    - ID: DF_NV_NOTARIZATION_REQ
      type: DataFlow
      title: Non validating notarization request
      description: |
