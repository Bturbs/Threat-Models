ID: Ledger_PKI
schemaVersion: 2
parent: CBUAE_PHASE2


scope:
  description: |
    This threat model covers the Public Key Infrastructure (PKI) used for ledger transaction 
    verification in the CBUAE Phase 2 project.

    **Refs:** [LLD - 10 Cryptography and Public Key Infrastructure](#LLD), [LLD - 10.7 Cryptography and Public Key Infrastructure/Public key infrastructure](#LLD), [LLD - 10.8 Cryptography and Public Key Infrastructure/Certificate authority, certificate trust chain, and validation](#LLD)



  assets:
    - ID: LEDGER_ROOT_CERT
      title: Ledger verification root certificate
      type: certificate
      description: |
        A self-signed certificate that identifies the Root Certificate Authority.

        **Refs:** [LLD - 10.8.6 Cryptography and Public Key Infrastructure/Certificate authority, certificate trust chain, and validation/Component 1 - Root and intermediate certificate authority](#LLD)
      inScope: true
      properties:
        location: configuration file
        format: X.509
        length: 256
        type: CA certificate
      applicationRelated: true
      infrastructureRelated: false

    - ID: INTERMEDIATE_CA_CERT
      title: Ledger verification intermediate CA certificate
      type: certificate
      description: |
        A certificate issued by the intermediate CA, signed by the root CA.

        **Refs:** [LLD - 10.8.6 Cryptography and Public Key Infrastructure/Certificate authority, certificate trust chain, and validation/Component 1 - Root and intermediate certificate authority](#LLD), [LLD - 10.8.2 Cryptography and Public Key Infrastructure/Certificate authority, certificate trust chain, and validation/Chain validation](#LLD)
      inScope: true
      properties:
        location: configuration file
        format: X.509
        length: 256
        type: CA certificate
      applicationRelated: true
      infrastructureRelated: false

    - ID: CRL
      title: Certificate Revocation List
      type: certificate
      description: |
        Certificate Revocation List (CRL) signed by the CA as in https://datatracker.ietf.org/doc/html/rfc5280

        **Refs:** [LLD - 10.8.2 Cryptography and Public Key Infrastructure/Certificate authority, certificate trust chain, and validation/Chain validation](#LLD)
      inScope: true
      properties:
        location: accessed online
        format: X.509 v3 CRL format
        length: 256
        type: CA certificate
      applicationRelated: true
      infrastructureRelated: false

  assumptions:
    - ID: LOCAL_TX_VALIDATION
      description: |
        Certificates are tight to identities. They can be sent from any entity on the network and be validated locally by the recipient.
    - ID: SINGLE_PURPOSE_CERT
      description: |
        A ledger certificate should not be used as an mTLS certificate for this reason but also because it conflates responsibilities.

    - ID: TODO_VALID_SIGNING_TIME
      description: a certificate should not be revoked when signing and should 
        not be expired. (TODO timestamping for stolen keys back-signing)

    - ID: REVOKED_CERT_VERIFICATION
      description: |
        [...] we need to keep such revoked certificates available to validate older transactions 
        as long as these certificates are referenced by the ledger.


