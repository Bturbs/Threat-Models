      <img src="img/membership_registration_seq1.svg"/>
     <img src="diagrams/08_Member_regstrationProtocol.svg"/>


    <strong>Nested protocol and data diagram</strong><br/>
      <img src="img/corda5-p2p_protocols.svg"/><br/>

     CPI identityKeyPolicy setting with the following options:

        - Combined: Ledger key is also used as a session key. This is a default option. In this case, there is no key rotation option.
        - Distinct: Requires to have distinct ledger and session keys.

  assets:

    - ID: SIGMAR_KEY_EXCHANGE
      type: dataflow
      title: |
        'SIGn-and-MAc' DH key exchange algorithm
      description: DH key exchange algorithm with authentication 
        [REF](https://www.iacr.org/cryptodb/archive/2003/CRYPTO/1495/1495.pdf)
      inScope: true
    - ID: KeyExnchangeAlgorithmSTEPS
      description: SIGMAR_KEY_EXCHANGE steps
      type: dataflow
      inScope: true
    - ID: E2E_SESSIONS
      description: |
        In the case where these identities are hosted in a remote cluster, the link manager 
        will establish end-to-end sessions 
        with the link managers in the remote cluster and deliver these messages securely using these sessions
      title: end-to-end sessions
      type: dataflow
      inScope: true
    - ID: P2P_TLS_KEY
      title: P2P TLS key
      type: key
      description: TLS transport for P2P communications between Corda clusters
      inScope: true
      properties:
        location: CRYPTO_WORKER Java memory process
        format: ECDSA key pair
        length: 256
        type: private authentication key
      applicationRelated: false
      infrastructureRelated: true
    - ID: SESSION_KEYS
      title: Session Initiation Key
      type: key
      description: (A.K.A. Identity Key or Session Key). Public and private 
        VNode P2P/E2E session initiation key. It is also used to sign group 
        parameters. Member's Session initiation key is used to sign member's 
        context part of the MemberInfo. MGM's Session initiation key is used to 
        sign MGM's context part.
      inScope: true
      properties:
        location: CRYPTO_WORKER Java memory process, VNODE_DB (encrypted with 
          wrapping keys) and encrypted with wrapping keys in the Database 
          Storage
        format: ECDSA key pair
        length: 256
        type: Public/Private authentication key
      applicationRelated: true
      infrastructureRelated: false
    - ID: SESSION_KEY_CERT
      title: SESSION_KEYS X.509 certificate
      type: certificate
      description: |
        SESSION_KEYS certificate that is validated during session initialization. 
        [REF](https://github.com/corda/corda-runtime-os/wiki/Session-Certificates)
      inScope: true
      properties:
        location: P2P_GATEWAY worker (Java process memory), CLUSTER_DB 
          (encrypted configuration) TBC
        format: X.509 certificate
      applicationRelated: false
      infrastructureRelated: false
    - ID: IDENTITY_TRUST_ROOTS
      title: E2E Identity trust roots
      type: certificate
      description: Trust root of certificates for session initiation keys 
        [SESSION_KEYS]
      inScope: true
      properties:
        location: CPI groupPolicy.json, VNODE_DB (TBC)
        format: pem (TBC)
        length: 256
      applicationRelated: false
      infrastructureRelated: false
    - ID: E2E_SESSION
      title: End-to-end session
      type: dataflow
      description: |
        bidirectional channel that in practice sends application messages only in one direction for each session. 
        Note that it is technically possible to send messages in both directions in a session 
        (there is a symmetric key derived for each direction). But, in practice the Corda platform only sends application messages
         in one direction (e.g. from A -> B) and acknowledgements for receipt of these messages in the other direction 
         (e.g. from B -> A). These acknowledgements also act as health indicators of the session and can trigger replacement of 
         the session if it is considered unhealthy / died.
        For bidirectional communication two session will be needed. Can be of two types: AUTHENTICATION_ONLY or AUTHENTICATED_ENCRYPTION
        During the handshake, messages 3 & 4 (InitiatorHandshake / ResponderHandshake) 
        contain signatures with the members' session initiation keys that are validated when received.
      inScope: true
      authorization: mapping to DB of Roles
      authentication: mutual TLS, certificate , rot

    - ID: E2E_SESSION_MODE
      title: End-to-end session mode
      type: configuration
      description: |
        an attribute indicating the mandated mode for end-to-end sessions (network level), 
        AUTHENTICATION_ONLY, allowing communication introspection, or AUTHENTICATED_ENCRYPTION
      inScope: true

    - ID: EPHEMERAL_SESSION_KEY
      title: Ephemeral session keys
      type: key
      description: |
        Created During the `SIGMAR_KEY_EXCHANGE`, these secret symmetric keys that are used for 
        authenticating and encrypting messages sent in one E2E_SESSIONS.
      inScope: true
      properties:
        location: |
          Encrypted with P2P_MASTER_KEY_EPHEMERAL_SESSION_KEY key in the Link Manager State Database
        length: 256
        cipherSuite: AES
        type: Symmetric authentication key
      applicationRelated: true
      infrastructureRelated: false

    - ID: P2P_MASTER_KEY_EPHEMERAL_SESSION_KEY
      title: Master wrapping key for ephemeral session keys, p2p tenant
      type: key
      description: |
        Master Symmetric key to encrypt EPHEMERAL_SESSION_KEY in the state Database used by the link Manager.
        The key is identified by a new HSM category: `ENCRYPTION_SECRET` and a default alias/tenant `p2p`.
        The Encryption/decryption is performed by the [CRYPTO_WORKER](#CRYPTO_WORKER) internally Http exposed
         methods as described in [DF_CRYPTO_API1](#DF_CRYPTO_API1) dataflow
      appliesToVersions: ">=5.2"
      inScope: true
      properties:
        location: |
          HSM or soft HSM DB (wrapped with master key) if managed by CRYPTO_WORKER 
        length: "256 (RFI: is the P2P_MASTER_KEY_EPHEMERAL_SESSION_KEY AES 256? stored
          as wrapped key by soft HSM?)"
        cipherSuite: AES
        type: AES Symmetric key
        rotation: ability to periodically delete and re-establish sessions 
          (default 5 days expiration)
      applicationRelated: true
      infrastructureRelated: false

    - ID: identityPki
      title: identityPki configuration
      description: |
        attribute at application network level (groupPolicy.json in CPI file), can be standard 
        (PKI validation, including revocation) or no_pki (only advertised keys by participant when entering the network)
      type: configuration
      inScope: true

    - ID: DF_KafkaP2P
      title: P2PGateway produce/consume msg bus topics (kafka)
      description: |
        Connection to Kafka and production/consumption of topic messages. Topics are: 

          - `link.out` (containing outbound messages from link managers to other clusters
          - `link.in` (containing inbound messages from other clusters destined for the link managers in this cluster), 
          - `gateway.tls.certs` (containing TLS certificates to be used by the gateway during TLS handshakes), 
          - `gateway.tls.truststores` (containing TLS trust roots of all the app networks the gateway is expected to trust certificates from), 
          - `gateway.revocation.request` (containing requests from other workers in the cluster to check revocation of a provided certificate), 
          - `gateway.revocation.request.resp` (containing responses to requests for revocation checks),  
          - `session.out.partitions` (containing mapping between session IDs and the corresponding partitions of link.in that host them - used
           by the gateway to route messages for a specific session to the right link manager hosting it), 
          - `config.topic` (containing configuration for the various components - in the future, we have plans to have dedicated configuration topic 
           for gateway for extra isolation, countermeasure ID: `C5.DF_KafkaP2P_STRIDE.C2`), 
          - `crypto.rpc.ops` (containing signing requests to the crypto processor for TLS handshakes - 
           in the future, we have plans to have dedicated topic for gateway for crypto requests for extra isolation, countermeasure ID: `C5.DF_KafkaP2P_STRIDE.C2`)
          - `crypto.rpc.ops.resp` (containing responses from the crypto processor). 
          
          
          For reference, you can find a full list of topics here (along with producers and consumers): 
          <a href="https://github.com/corda/corda-api/tree/release/os/5.0/data/topic-schema/src/main/resources/net/corda/schema"> REF </a>
      type: dataflow
      inScope: true
    - ID: DF_P2PGW_2_MGMGW
      title: Member P2P Gateway to MGM P2P Gateway communication
      description: |
        communication between P2P Gateway of the member cluster and the P2P Gateway of the MGM cluster
        The data being transmitted is AVRO serialized binary data (as HTTP body) over TLS (non mutual). 
        Mutual TLS may be added for internal compliance but is currently out of scope and not part of the security model. 
        The solution is to be designed secure in absence of mutual TLS.
      type: dataflow
      inScope: true
    - ID: DF_P2PGW_2_P2PGW
      title: Member P2P Gateway to Member P2P Gateway communication
      description: |
        communication between P2P Gateway of the member cluster and the P2P Gateway of a peer cluster
        The data being transmitted is AVRO serialized binary data (as HTTP body) over TLS (non mutual)
      type: dataflow
      inScope: true

    - ID: DF_P2P_REG1
      title: P2P registration request from VNode to the MGM
      type: dataFlow
      description: |
        Registration request is encrypted with the MGM PUB_SESSION_KEY using ECIES (the VNode requests uses an ephemeral pub/priv key pair for ECIES)
        The requests contains `member-provided context` -which is the member-provided part of the member info- and `SESSION_KEY`. [REF: ECIES encryption](https://github.com/corda/corda-runtime-os/blob/2e0db8d10ee12640beeb89fe8e6de4d2339002d8/components/membership/registration-impl/src/main/kotlin/net/corda/membership/impl/registration/dynamic/member/DynamicMemberRegistrationService.kt#L307) 
        [REF: Preparing member context](https://github.com/corda/corda-runtime-os/blob/2e0db8d10ee12640beeb89fe8e6de4d2339002d8/components/membership/registration-impl/src/main/kotlin/net/corda/membership/impl/registration/dynamic/member/DynamicMemberRegistrationService.kt#L368)
      inScope: true
    - ID: DF_P2P_OCSP_CRL1
      title: SESSION_KEY_CERT verification with OCSP or CRL
      type: dataFlow
      description: |
        Verify SESSION_KEY_CERT (using production configuration `PKI Identity policy: standard`)
      inScope: true

    - ID: HTTP_INBOUND_LINK_MANAGER1
      type: dataflow
      title: |
        HTTP endpoint for inbound messages
      description: |
        HTTP service endpoint in the LINK_MANAGER processing inbound messages from the P2P_GATEWAY
        [REF: scalability-improvements.md](https://github.com/corda/platform-eng-design/blob/af6416f307c68b10c16e84309506fbbfbd2441f2/core/corda-5/corda-5.2/P2P/Perfomance%20Enhancements/scalability-improvements.md)
      inScope: true


  assumptions:
    - ID: RND1
      description: >
        The random number generation used is secure with enough entropy. Java's SecureRandom
        is used for the e2e protocol on p2p.  For ECIES, the code is inside the crypto
        processor and the Java's SecureRandom is also used.
    - ID: OPT_REV_PROXY
      description: |
        There may be an optional TLS terminating reverse proxy in front of the P2P gateway. 
        The trust root of the P2P Gateway (internal CA) may differ from the one of the reverse proxy (group CA) 
        [REF](https://github.com/corda/platform-eng-design/blob/a6151195196bcfa20daf6f6a7f0901a73ab2da6f/core/corda-5/corda-5.0/p2p-customer-facing-doc/doc.md#proxy-integration)
    - ID: DYNAMIC_NETWORK
      description: |
        the production Corda 5 application network in analysis is `dynamic`.
        This implies  a `PKI Identity policy: standard` parameter at network level (groupPolicy.js file ).
        Static Corda application networks are meant for testing and during initial development. 
        They are not for production use and hence not in the scope of this analysis.
    - ID: GW2GW_TLS_ALWAYS
      description: |
        Communication between P2P Gateways (MGM, members) are always over TLS with verified server certificated.
    - ID: UNIDIRECTIONAL_SESSIONS
      description: |
        P2P communication a one way only, bidirectional communication is achieved with 2 separate SESSIONS. 
        The direction of the SESSION is the same on the client to server in the GW2GW_TLS_ALWAYS assumption


  attackers:


analysis: |
  <strong>Membership registration protocol, sequence diagram analysis</strong>
  <img src="img/membership_registration_seq1_analysis.svg"/>


