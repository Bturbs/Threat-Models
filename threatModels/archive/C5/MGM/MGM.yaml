  - ID: MGM_SUSPENSION_SYNC
    title: Suspended members synchronizes with the MGM
    impactedSecObj:
      - REFID: CONFIDENTIALITY

    impactDesc: |
      Information disclosure to suspended members.
    assets:
      - REFID: MemberInfo
      - REFID: groupDataPackage
      - REFID: DF_Member_2_MGM_synchronisation
    attackers:
      - REFID: VNODE_OPERATOR

    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:U/C:L/I:N/A:N
    threatType: Information disclosure
    pentestTestable: true
    lastReview: 2024-04-05
    attack: |
      A suspended member synchronizes with the MGM and gets group/Corda network information updates (it should not be possible).
      In this attack the suspended member circumvents the fact that the MGM does not send it its standard 
      distrubtion group data updates. The attacker makes a synchronisation requests to the MGM and gets updated.
    public: true
    fullyMitigated: true
    countermeasures:
      - ID: NOSYNC_SUSPENDED
        title: Suspended members are not allowed synchronsation
        description: |
          The MGM checks member status before responding to its synchronisation request. 
          Limited information is disclosed to suspended members. 

        operational: false
        inPlace: true
        public: true


