  - ID: TWO_SIGNER_COLLUSION_OR_COMPROMISE
    title: Two-Signer Collusion or Compromise
    attack: |
      Two of the five signer keys are compromised or their holders collude (through malware, phishing,
      insider collusion, or weak custody practices).

      With a 2-of-4 threshold this would have been sufficient to approve unauthorized transactions.
      With the 3-of-5 threshold, two colluding or compromised signers cannot reach quorum and
      therefore cannot approve any privileged operation.
    threatType: Elevation of Privilege
    impactDesc: |
      If quorum were reachable (i.e., under a weaker threshold), the impact would be complete
      compromise of privileged governance:

      - Double spending via malicious program upgrade
      - Routing bridging/unbridging assets to attacker accounts
      - Adding unauthorized Corda network
      - Unauthorized authorization/revocation of notaries

      With 3-of-5, two-signer collusion is insufficient to execute any of these scenarios.

