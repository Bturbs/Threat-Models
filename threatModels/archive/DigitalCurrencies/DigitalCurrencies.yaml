    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:H/A:H
    conditional: |
      Multiple Clusters Network (as the code of the CPI is not ensured by the trusted CB itself)
    threatType: Tampering
    attack: |
      CorDapp participants, including LFI/Banks, can tamper P2P protocol calls changing the Flow payload 
      (e.g. by adding an unexpected valid state).
      Elevation of Privileges over P2P (only HTTP REST/RPC enforces strict configurable flow authorization)<br/>
