  - ID: IMMUTABLE_LOCK_PREMATURE_OR_INCOMPLETE
    title: Premature or Incomplete Immutable Lock
    attack: |
      Operators execute immutable lock (revoke upgrade authority) on the notary program
      before all initialization, configuration, and verification steps are complete.

      Alternatively, operators fail to lock the program when it should be immutable, leaving
      an unnecessary upgrade attack surface.

    threatType: Denial of Service, Tampering
    impactDesc: |
      Premature lock:

      - Cannot fix discovered bugs or misconfigurations in the notary program
      - Cannot update network configuration or notary administration logic
      - Requires full redeployment and state migration to recover

      Incomplete lock:

      - Upgradeable program remains vulnerable to governance compromise
      - Inconsistent security posture if lock was part of the intended release plan

    impactedSecObj:
      - REFID: AVAILABILITY
      - REFID: KEY_GOVERNANCE_INTEGRITY
    attackers:
      - REFID: MALICIOUS_SIGNER
    assets:
      - REFID: DF_IMMUTABLE_LOCK
      - REFID: UPGRADE_AUTHORITY_WALLET
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:N/I:H/A:H'
    pentestTestable: false
    fullyMitigated: true
    countermeasures:
      - ID: NO_IMMUTABLE_LOCK
        title: Do Not Lock Program — Retain Multisig Upgrade Capability
        description: |
          Deliberately avoid making the notary program immutable. Keep it upgradeable
          via Squads multisig governance indefinitely.

          **Rationale**:

          - Preserves ability to fix critical vulnerabilities post-deployment
          - Eliminates risk of premature lock causing permanent operational issues
          - Multisig already provides sufficient protection against unauthorized upgrades
          - Network Operator is centralized initially, so a single governance policy applies

          **Trade-off accepted**:

          - Program remains theoretically upgradeable if multisig is compromised
          - Mitigated by multisig signer controls (hardware wallets, diversity, monitoring)

          This approach avoids the entire threat category of premature/incomplete locking.
        inPlace: true
        public: true
        operational: true
        operator: Platform Operations and Security team

      - ID: REDEPLOYMENT_AS_RECOVERY
        title: Redeploy Notary Program as Recovery Path
        description: |
          Unlike multi-program systems with cross-program hardcoded IDs and non-rotatable admin keys,
          the notary program is a single replaceable program. If a critical misconfiguration or
          compromise occurs, the Network Operator can:

          - Deploy a fresh notary program instance to a new program ID
          - Update the Corda Notary Node (Uniqueness Provider) configuration to point to the new instance
          - Re-initialize network and notary authorization state on-chain
          - Retire the compromised program instance

          This recovery path is viable because:

          - No other programs hardcode the notary program ID
          - Admin authority is multisig-governed (not permanently set at initialization)
          - Corda node configuration is operator-controlled and updateable
        inPlace: true
        public: true
        operational: true
        operator: Corda Network operator

