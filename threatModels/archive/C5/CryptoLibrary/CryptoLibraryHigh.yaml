  - ID: MASTER_KEY_BACKUP_DEGRADE
    threatType: Repudiation, Information disclosure, loss of compliance
    assets:
      - REFID: SecondaryWrappedKey
    title: Multiple key cryptographic degradation in master key rotation
    attack: |
      For every SecondaryWrappedKey backup/rotation the cost of a brute force attack diminishes.
      Multiple encryption of the same secret lower the cost of a brute force attack (multiple positive results/master keys).
      If an attacker has access to any master key rotation mechanism, he/she can abuse it to lower the cost of an effective 
      brute force attack.
      Still, the degradation seems not to be exponential,rather logarithmic:
      from 1 to 2 keys (our most likely example) the degradation is 50% (1 bit less to guess, in average)
      from 1000 to 1001 master encrypted keys the degradation of the additional wrapped encrypted key to match in a brute force (trying all the space of keys) will be only 1/1000 or 0,1% circa (10 bits total).
      This is true in the hypothesis that AES is a perfect encryption algorithm (really random output of encrypted message),
      that is not likely 100% true and crypto-analysts may find an advantage in having the same message encrypted multiple times with different keys, specially if some of the plaintext is known.
    impact: Slightly degraded encryption that may lead to signing key 
      disclosure. May be not compatible with minimum 256 bit encryption 
      compliance requirement.
    public: true
    fullyMitigated: false
    CVSS:
      vector: CVSS:3.1/AV:L/AC:H/PR:H/UI:N/S:U/C:H/I:H/A:H/E:U/RC:U
    countermeasures:
      - ID: C1
        title: Limited number of backup keys
        description: |
          Limit the number of backup/rotation of backup keys.
        inPlace: true
        public: true
      - ID: C2
        title: Salting secret rotation
        description: |
          Use different SALT for every wrapped key, even of the same VNodeID between master key rotation.
        inPlace: false
        public: true

  - ID: CRYPTOW_MEM_LEAK
    threatType: Elevation of privileges, spoofing, repudiation
    assets:
      - REFID: SecondaryWrappedKey
    title: Crypto worker memory leak
    attack: |
      A memory dump, remote execution bug, Node takeover, kubernetes hack would result in private keys access
    public: true
    fullyMitigated: false
    CVSS:
      vector: CVSS:3.1/AV:A/AC:H/PR:H/UI:N/S:U/C:H/I:H/A:H/E:U/RC:U
    countermeasures:
      - ID: CRYPTO_NO_JVM_MEM_DUMP
        title: Disable automatic dump of memory to on Java process crash
        description: |
          Disable Dump, debug and all memory introspection features on the Java process
        inPlace: false
        operational: true
        public: true
      # - ID: C2
      #   title: Document residual risk that needs to be accepted
      #   description: Clearly document the residual risk and tradeoff of this solution
      #   inPlace: false
      #   public: true
      - ID: C3
        title: Isolated Kubernetes node (same as CryptoLibrary.T3.C1)
        description: |
          Dedicated and hardware isolated (not shared VM) kubernetes node for Crypto Workers
        operational: true
        inPlace: false
        public: true
      - ID: C4
        title: Implement HSM session with temporary token (TBC)
        description: |
          This threat could be mitigated with the use of HSM PCKS#11 sessions, if supported: sign with a temporary key (unwrapped signing key) inside the HSM. 
          If possible (need to implement a POC) this mechanism would offer a security similar to the Ultimate. 
          Ultimate has different compliance features as it does not store keys, even if wrapped) outside the HSM.

          - ref: <https://crypto.stackexchange.com/questions/60759/how-should-short-term-keys-keys-stored-in-ram-or-volatile-memory-be-described>
          - ref: <http://docs.oasis-open.org/pkcs11/pkcs11-ug/v2.40/cn02/pkcs11-ug-v2.40-cn02.html#_Toc406759989>
          - ref: <https://docs.aws.amazon.com/cloudhsm/latest/userguide/pkcs11-apis.html>
          - ref: <https://github.com/aws-samples/aws-cloudhsm-pkcs11-examples/blob/master/src/wrapping/aes_wrapping.c>
        inPlace: false
        public: true

