ID: AsyncRedemptionFlows
schemaVersion: 2
title: Async Redemption Flows
version: '0.2'
status: Draft
parent: CordaProtocolV1

authors: |
  Security Research team at R3
  Updated: 2026-05-14

scope:
  description: |
    Child threat model covering the current async redemption flows in the Vault
    Program. The live code uses escrowed vTokens plus optional internal matching
    against pending deposits; it no longer depends on tokenizer aToken burns as
    the primary redemption mechanism.

    This flow usually involves these steps:

    1. **Tx 1** — Investor calls `create_redemption_proposal`. vTokens are moved
       from the investor account into the vault's pinned `vtoken_vault` escrow and
       an expected USDC amount is recorded on the proposal.
     2. **Optional batch path** - Curator can create a redemption snapshot,
       incrementally add pending proposals, seal the snapshot to freeze
       membership, call `set_redemption_snapshot_totals` to bind batch totals
       against oracle tolerance, and then call `settle_from_snapshot` to
       distribute payout and fees proportionally across many proposals.
     3. **Optional Tx 2 / Tx N** - Curator calls `match_deposit_redemption` to
       cross part of the redemption against a pending `InvestmentProposal`. The
       depositor receives escrowed vTokens, the redeemer receives USDC from
       `usdc_vault`, and fee transfers go to the pinned `fee_recipient`.
     4. **Optional Tx 3 / Tx N** - If the proposal remains completely unmatched,
       curator may call `cancel_redemption_proposal` to return escrowed vTokens.
     5. **Tx 4 / Tx N** - Curator calls `settle_redemption` for any remaining
       unmatched vTokens by supplying `gross_usdc` constrained by on-chain
       oracle tolerance checks, paying USDC to the investor, transferring exit
       fees to `fee_recipient`, and burning the remaining escrowed vTokens.

    Pricing is anchored to the vault's live oracle-wrapper-backed price.
    Matching can consume optional sealed snapshots, while settlement paths now
    verify caller-supplied totals via implied-price tolerance checks.

    <img src="img/Redemption-flowSEQ1.svg" alt="Redemption Flow Sequence Diagram"/>

  assets:
    - ID: DF_MATCH_DEPOSIT_REDEMPTION
      type: dataflow
      title: Deposit and Redemption Matching Dataflow
      description: |
        `match_deposit_redemption` crosses a pending investment proposal against a
        pending redemption proposal at a chosen price anchor, moving vTokens from
        `vtoken_vault` to the depositor and USDC from `usdc_vault` to the redeemer.
      inScope: true

    - ID: DF_BATCH_REDEMPTION_SETTLEMENT
      type: dataflow
      title: Batch Redemption Snapshot Settlement
      description: |
        The `batch_redemption` instruction family creates curator-controlled
        redemption snapshots, seals proposal membership, binds batch totals via
        `set_redemption_snapshot_totals`, and proportionally distributes payout
        and fees across many pending redemption proposals.
      inScope: true

    - ID: DF_REDEMPTION_SETTLEMENT
      type: dataflow
      title: Redemption Settlement Payout and Fee Transfer
      description: |
        `settle_redemption` transfers investor payout and exit fee out of the
        vault's USDC account and burns the remaining escrowed vTokens.
      inScope: true

  assumptions:
    - ID: RD_CURATOR_AUTHORIZED
      description: |
        The curator controls `match_deposit_redemption`, `settle_redemption`, and
        unmatched `cancel_redemption_proposal`. Abuse of this authority is in scope.

    - ID: RD_SNAPSHOT_OPTIONAL
      description: |
        Snapshot accounts are optional for matching flows. Redemption settlement
        uses caller-supplied totals checked against oracle tolerance.

analysis: |
  The current async redemption flow is a custody and timing problem rather than
  a tokenizer clawback problem. The main attack surface is now:

  - vTokens are escrowed before the investor receives USDC
  - Batch redemption snapshots let the curator choose grouping and sealing time
  - curator controls whether a proposal is matched, cancelled, or settled
  - settlement inputs are curator-supplied and accepted when implied price is
    within configured tolerance of the oracle
  - fees are paid to a pinned recipient, making recipient governance a custody control

  **Key Attack Surface**

  - Curator-controlled cancellation and settlement timing
  - Curator-controlled batch snapshot creation, sealing, and distribution
  - Optional rather than mandatory snapshot-based price locking
  - Internal crossing between deposits and redemptions
  - Pinned fee recipient as a configuration-critical payout destination

threats:
  - ID: RD_CURATOR_LOCKS_ESCROWED_FUNDS
    title: Curator delays settlement or refuses cancellation of escrowed redemption
    attack: |
      After `create_redemption_proposal`, the investor's vTokens are locked in
      `vtoken_vault`. The curator can then delay both matching and settlement, or
      refuse to call `cancel_redemption_proposal` while the proposal remains
      unmatched.

      The same risk extends to the batch-redemption path if the curator creates
      or seals a redemption snapshot but does not complete `settle_from_snapshot`
      for included proposals.

      The investor has no unilateral on-chain cancel path even when the proposal
      is still fully unmatched.

    threatType: Denial of Service
    impactDesc: |
      The investor's vTokens remain escrowed and unusable.

      - The investor cannot transfer or redeem those shares elsewhere
      - Exit timing depends on curator responsiveness
      - Operational outages can extend lockup indefinitely
      - Batch settlement can stall many escrowed proposals behind one curator action

    impactedSecObj:
      - REFID: USER_FUNDS_SAFETY
      - REFID: AVAILABILITY
    attackers:
      - REFID: CURATOR
      - REFID: VAULT_MANAGER
    assets:
      - REFID: REDEMPTION_PROPOSAL_PDA
      - REFID: VTOKEN_VAULT_ATA
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:N/I:N/A:H'
    fullyMitigated: false
    countermeasures:
      - ID: RD_CURATOR_CANCEL_EXISTS
        title: Curator can cancel unmatched proposals
        description: |
          The code supports `cancel_redemption_proposal` when `matched_vtokens == 0`.
          This reduces indefinite lock risk but does not help if the curator is the
          failing or malicious party.
        inPlace: true
        public: true

      - ID: RD_INVESTOR_SELF_CANCEL_TIMEOUT
        title: Investor self-cancel or timeout path
        description: |
          Add an investor-invokable timeout or self-cancel path for unmatched
          proposals so escrowed vTokens can be recovered without curator action.
        inPlace: false
        public: true

  - ID: RD_OPTIONAL_SNAPSHOT_PRICE_MANIPULATION
    title: Curator manipulates settlement inputs within tolerance around oracle timing
    attack: |
      `settle_redemption(gross_usdc)` and `settle_investment(investor_vtokens)`
      now use caller-supplied totals, deriving an implied price that must fall
      within `price_tolerance_bps` of the live oracle.

      A malicious curator can still exploit execution timing around oracle
      movements and select in-band totals that favor one side of a trade,
      especially if tolerance is wide.

      The curator also controls when to bind batch totals via
      `set_redemption_snapshot_totals` / `set_deposit_snapshot_totals` after
      snapshot membership is frozen.

    threatType: Tampering
    impactDesc: |
      Investors can receive less favorable pricing than expected.

      - Redeemers may receive lower USDC payouts
      - Depositors may receive fewer vTokens than intended
      - Tolerance-band discretion and timing become hidden value extraction paths

    impactedSecObj:
      - REFID: USER_FUNDS_SAFETY
      - REFID: AUDITABILITY
    attackers:
      - REFID: CURATOR
      - REFID: VAULT_MANAGER
    assets:
      - REFID: REDEMPTION_PROPOSAL_PDA
      - REFID: INVESTMENT_PROPOSAL_PDA
      - REFID: VAULT_PDA
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:H/UI:N/S:U/C:N/I:H/A:N'
    fullyMitigated: false
    countermeasures:
      - ID: RD_IMPLIED_PRICE_TOLERANCE_CHECK
        title: Implied-price tolerance checks in settlement instructions
        description: |
          Settlement instructions derive implied price from caller inputs and
          enforce `check_price_tolerance` against oracle price. Batch totals are
          also tolerance-checked in `set_redemption_snapshot_totals` and
          `set_deposit_snapshot_totals`.
        inPlace: true
        public: true

      - ID: RD_TOLERANCE_HARD_CAP
        title: Hard cap on configurable tolerance values
        description: |
          Vault config updates enforce `price_tolerance_bps <=
          PRICE_TOLERANCE_MAX_BPS`, preventing extreme variance bands.
        inPlace: true
        public: true

      - ID: RD_SNAPSHOT_PRICED_REQUIRED
        title: Batch settlement blocked until snapshot totals are priced
        description: |
          `settle_from_snapshot` requires `snapshot.priced == true`
          (`SnapshotNotPriced` otherwise), so batch settlement cannot run
          before totals are bound and oracle-validated.
        inPlace: true
        public: true

      - ID: RD_STRICT_TOLERANCE_AND_CHANGE_CONTROL
        title: Strict tolerance configuration and governance change control
        description: |
          Keep `price_tolerance_bps` conservative and require multi-party
          approval plus monitoring for any tolerance update.

          This reduces in-band discretionary pricing and constrains abuse of
          oracle timing windows.
        inPlace: false
        public: true

  - ID: RD_MATCHING_ACCOUNTING_ERROR
    title: Matching logic misallocates value between depositor and redeemer
    attack: |
      A defect in `match_deposit_redemption` or a malformed curator invocation
      could attempt to overmatch either side of the trade, miscompute fees, or
      move more vTokens or USDC than the remaining proposal balances allow.

    threatType: Tampering
    impactDesc: |
      Incorrect crossing could transfer value between investors incorrectly.

      - Depositor could receive too many or too few vTokens
      - Redeemer could receive too much or too little USDC
      - Proposal bookkeeping could become inconsistent across the pair

    impactedSecObj:
      - REFID: USER_FUNDS_SAFETY
      - REFID: INTEGRITY
    attackers:
      - REFID: CURATOR
      - REFID: VAULT_MANAGER
    assets:
      - REFID: DF_MATCH_DEPOSIT_REDEMPTION
      - REFID: REDEMPTION_PROPOSAL_PDA
      - REFID: INVESTMENT_PROPOSAL_PDA
      - REFID: VTOKEN_VAULT_ATA
      - REFID: USDC_VAULT_ATA
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:H/UI:N/S:U/C:N/I:H/A:N'
    fullyMitigated: true
    countermeasures:
      - ID: RD_REMAINING_AMOUNT_BOUNDS
        title: Remaining amount bounds enforced on both proposals
        description: |
          The instruction bounds `usdc_amount` by deposit remaining capacity and
          bounds the derived vToken count by redemption remaining capacity.
          Proposal counters (`netted_usdc`, `matched_vtokens`) are updated using
          checked arithmetic.
        inPlace: true
        public: true

      - ID: RD_FULLY_MATCHED_CLOSEOUT
        title: Fully matched redemption proposal closes immediately
        description: |
          When the redemption proposal is fully matched, the PDA is closed and
          cannot later be settled again for a duplicate payout.
        inPlace: true
        public: true

  - ID: RD_FEE_RECIPIENT_DIVERSION
    title: Fee recipient misconfiguration diverts exit fees
    attack: |
      `settle_redemption` and `match_deposit_redemption` both route fees to the
      vault's pinned `fee_recipient`. If that field is misconfigured or changed to
      an attacker-controlled account, every redemption routes fees to the wrong
      destination while still passing account validation.

    threatType: Tampering, Elevation of Privilege
    impactDesc: |
      Exit fees are diverted from the intended treasury or operations account.

      - Fee revenue is lost or stolen
      - Accounting and audit expectations are violated
      - Misconfiguration persists across all future settlements until corrected

    impactedSecObj:
      - REFID: INTEGRITY
      - REFID: AUDITABILITY
    attackers:
      - REFID: CURATOR
      - REFID: PROTOCOL_CONFIG_AUTHORITY
      - REFID: VAULT_MANAGER
    assets:
      - REFID: DF_REDEMPTION_SETTLEMENT
      - REFID: VAULT_PDA
      - REFID: USDC_VAULT_ATA
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:N/I:H/A:N'
    fullyMitigated: false
    countermeasures:
      - ID: RD_PINNED_FEE_RECIPIENT_CHECK
        title: Fee recipient is pinned and validated on-chain
        description: |
          Settlement instructions require the supplied fee recipient account to
          match `vault.fee_recipient`, preventing a compromised curator from
          substituting an arbitrary payout account per transaction.
        inPlace: true
        public: true

      - ID: RD_FEE_RECIPIENT_GOVERNANCE
        title: Governance review for fee recipient changes
        description: |
          Changes to `fee_recipient` should require multi-party review, monitoring,
          and an operational approval trail because the field is a custody-critical
          destination for every redemption fee.
        inPlace: false
        public: true
        operational: true
        operator: Vault Admin Team

  - ID: RD_SNAPSHOT_ADMISSION_RACE
    title: Redemption snapshot settles proposals that were matched after admission
    attack: |
      A curator can add a redemption proposal to a snapshot when
      `matched_vtokens == 0`, then partially match it via
      `match_deposit_redemption` before `settle_from_snapshot` executes.

      If per-proposal snapshot settlement does not re-validate unmatched state,
      the snapshot path can compute proportional payout and burn assumptions from
      stale pre-match totals.

    threatType: Tampering, Denial of Service
    impactDesc: |
      Post-admission drift can break batch consistency and accounting:

      - Proportional payouts can diverge from actual unmatched remainder
      - Burn and payout assumptions can become inconsistent mid-cycle
      - Batch settlement may fail and require manual operator recovery

    impactedSecObj:
      - REFID: USER_FUNDS_SAFETY
      - REFID: INTEGRITY
      - REFID: AVAILABILITY
    attackers:
      - REFID: CURATOR
      - REFID: VAULT_MANAGER
    assets:
      - REFID: DF_BATCH_REDEMPTION_SETTLEMENT
      - REFID: REDEMPTION_PROPOSAL_PDA
      - REFID: DF_MATCH_DEPOSIT_REDEMPTION
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:H/UI:N/S:U/C:N/I:H/A:H'
    pentestTestable: true
    fullyMitigated: false
    countermeasures:
      - ID: RD_REVALIDATE_UNMATCHED_AT_SNAPSHOT_SETTLE
        title: Re-validate unmatched state during per-proposal snapshot settlement
        description: |
          Re-check `matched_vtokens == 0` and `status == Pending` in
          `settle_from_snapshot`, not only when adding proposals to the snapshot.

          Example guard pattern:

          ```rust
          require!(proposal.status == ProposalStatus::Pending, VaultError::ProposalAlreadyProcessed);
          require!(proposal.matched_vtokens == 0, VaultError::ProposalAlreadyProcessed);
          ```

        inPlace: false
        public: true

      - ID: RD_LOCK_MATCHING_WHILE_IN_SNAPSHOT
        title: Block matching for proposals enrolled in an open redemption snapshot
        description: |
          Track snapshot membership on proposals and reject
          `match_deposit_redemption` while membership is active.

          Example enforcement point:

          ```rust
          require!(!proposal.in_open_redemption_snapshot, VaultError::ProposalAlreadyProcessed);
          ```

        inPlace: false
        public: true

  - ID: RD_OUTBOUND_OUTSTANDING_DOUBLE_DECREMENT
    title: Partial match plus later settlement can over-reduce outbound outstanding volume
    attack: |
      For a redemption proposal that is partially matched first and then settled,
      outbound outstanding volume can be reduced in both paths using inconsistent
      decrement bases.

      The matching path reduces outstanding by matched USDC, while
      `settle_redemption` can still close against proposal-level expected
      outbound derived at creation time.

      If both reductions are applied without a shared remaining-expected tracker,
      global outstanding outbound volume can be over-decremented.

    threatType: Tampering
    impactDesc: |
      Outbound monitoring integrity can be corrupted:

      - Outstanding liabilities can appear smaller than reality
      - Operator dashboards and alerting can miss stress conditions
      - Circuit-breaker policies based on outstanding data can misfire

    impactedSecObj:
      - REFID: INTEGRITY
      - REFID: AUDITABILITY
    attackers:
      - REFID: CURATOR
      - REFID: VAULT_MANAGER
    assets:
      - REFID: REDEMPTION_PROPOSAL_PDA
      - REFID: VAULT_PDA
      - REFID: DF_MATCH_DEPOSIT_REDEMPTION
      - REFID: DF_REDEMPTION_SETTLEMENT
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:H/UI:N/S:U/C:N/I:H/A:N'
    pentestTestable: true
    fullyMitigated: false
    countermeasures:
      - ID: RD_BOUNDED_OUTBOUND_CLOSE_ON_SETTLE
        title: settle_redemption bounds outbound close to current outstanding
        description: |
          `settle_redemption` now closes only
          `min(expected_usdc_amount, outstanding_outbound_volume_usdc)`.

          This prevents over-decrement underflow in the individual settle path
          when partial matching already consumed part of outbound outstanding.
        inPlace: true
        public: true

      - ID: RD_TRACK_REMAINING_EXPECTED_OUTBOUND
        title: Persist per-proposal remaining expected outbound and decrement only that value
        description: |
          Add an explicit `remaining_expected_usdc` field and update it in every
          match/settle path. All global outstanding decrements should consume the
          same remaining field.

          Example pattern:

          ```rust
          proposal.remaining_expected_usdc = proposal
              .remaining_expected_usdc
              .checked_sub(decrement)
              .ok_or(VaultError::MathOverflow)?;
          vault.close_outstanding_outbound(decrement)?;
          ```

        inPlace: false
        public: true

      - ID: RD_ASSERT_OUTBOUND_DECREMENT_CONSISTENCY
        title: Add invariant checks for outbound decrement consistency
        description: |
          Add defensive checks ensuring per-proposal decrements and global
          outstanding decrements are consistent in both match and settle paths.

          Example assertion:

          ```rust
          require!(decrement <= proposal.remaining_expected_usdc, VaultError::MathOverflow);
          ```

        inPlace: false
        public: true

  - ID: RD_OUTBOUND_DECREMENT_UNIT_MISMATCH
    title: Matching decrements outbound bookkeeping using a unit inconsistent with proposal expected outbound
    attack: |
      `create_redemption_proposal` stores `expected_usdc_amount` based on
      creation-time price. Later matching can decrement global outbound using the
      matched deposit-side `usdc_amount`, which may not equal the redemption
      proposal's expected-outbound basis when price moved.

      This introduces unit/basis drift between proposal-level tracking and global
      outstanding counters.

    threatType: Tampering
    impactDesc: |
      Basis drift undermines auditability of redemption accounting:

      - Proposal-level and global outstanding numbers diverge
      - Operational controls become harder to reason about and verify
      - Incident reconstruction can become ambiguous

    impactedSecObj:
      - REFID: INTEGRITY
      - REFID: AUDITABILITY
    attackers:
      - REFID: CURATOR
      - REFID: VAULT_MANAGER
    assets:
      - REFID: REDEMPTION_PROPOSAL_PDA
      - REFID: DF_MATCH_DEPOSIT_REDEMPTION
      - REFID: VAULT_PDA
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:H/UI:N/S:U/C:N/I:H/A:N'
    pentestTestable: true
    fullyMitigated: false
    countermeasures:
      - ID: RD_SETTLE_REDEMPTION_MIN_BOUNDS
        title: Individual settlement path bounds expected-outbound close
        description: |
          The individual `settle_redemption` path now bounds outstanding close by
          current global outstanding volume, reducing impact of basis drift in
          mixed match/settle execution.
        inPlace: true
        public: true

      - ID: RD_SINGLE_OUTBOUND_BASIS
        title: Standardize outbound decrement basis across create, match, and settle
        description: |
          Pick one canonical basis (for example proposal `remaining_expected_usdc`)
          and use it consistently in every path. Avoid decrementing global
          outstanding directly from deposit-side `usdc_amount`.

          Example approach:

          ```rust
          let decrement = proposal.remaining_expected_usdc.min(computed_remaining);
          proposal.remaining_expected_usdc = proposal.remaining_expected_usdc - decrement;
          vault.close_outstanding_outbound(decrement)?;
          ```

        inPlace: false
        public: true

      - ID: RD_OUTBOUND_RECONCILIATION_TESTS
        title: Add reconciliation tests for partial-match plus settle scenarios
        description: |
          Add tests asserting that proposal-level remaining expected outbound and
          global outstanding outbound converge to zero after mixed
          match/settle/cancel paths.

          Example test assertion shape:

          ```rust
          assert_eq!(proposal.remaining_expected_usdc, 0);
          assert_eq!(vault.outstanding_outbound_volume_usdc, expected_global);
          ```

        inPlace: false
        public: true
