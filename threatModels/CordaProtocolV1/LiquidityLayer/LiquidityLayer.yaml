  #     (minutes around the boundary).
  #
  #   threatType: Tampering
  #   impactDesc: |
  #     Investor can execute up to 2× the intended daily volume in a short burst:
  #
  #     - 2× daily_sync_invest_limit in USDC invested near window boundary
  #     - 2× daily_sync_redeem_limit in USDC redeemed near window boundary
  #     - Can contribute to faster inventory depletion
  #
  #   impactedSecObj:
  #     - REFID: INTEGRITY
  #   attackers:
  #     - REFID: MALICIOUS_USER
  #   assets:
  #     - REFID: INVESTOR_SYNC_USAGE_PDA
  #   CVSS:
  #     vector: 'CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:L/A:N'
  #   fullyMitigated: false
  #   countermeasures:
