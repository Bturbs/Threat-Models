ID: mBridgeConnector
schemaVersion: 2
title: mBridge connector
parent: CBUAE_PHASE1
proposal: TESTPROPOSAL


scope:
  description: |
    This threat model focuses on the mBridge Connector java process. The scope does not include 
    network infrastructural hardening, firewalls and similar. Infrastructral hardening will be scoped in another threat model. 

  assets:

    - ID: MBC_MESSAGING_SERVICE
      title: MBridge Connector Messaging Service
      type: system
      description: |
        This component is responsible for the following:
          - Overall coordination of issuance, redemption and reporting flows
          - Consuming messages from the CBCC (Issuance platform) via Kafka topic
          - Producing messages for the CBCC to Kafka topic
          - Invoke Message Translator service to translate messages from mBridge XML to CBCC JSON and vice-versa.
          - Invoke Docking API to call mBridge CBUAE Backend node.
      inScope: true

    - ID: MBC_REPORTING_SERVICE
      title: mBridge Connector Reporting Service
      type: system
      description: |
        This component is responsible for the following: 
         - Run a scheduler service to invoke the mBridge Docking API for Batch Transaction Query
         - Process the response and generate LFI-wise wallet balance
         - Publish LFI wallet balances to Kafka reporting topic
      inScope: true

    - ID: MBC_TRANSLATING_SERVICE
      title: mBridge Message Translator Service
      type: system
      description: |
        This component is responsible for the following: 
         - Convert CBCC JSON message to mBridge XML message
         - Convert mBridge XML message to CBCC JSON message
         - Store and apply any fixed constants 
      inScope: true

    - ID: MB_API_ENDPOINT
      type: system
      title: mBridge Docking API Module endpoint
      description: |
        This component is responsible for the following 
         - Create the mBridge request/response from the message XML including the SOAP message 
          and the HTTP Request Headers
         - Generate signature for the mBridge request
         - Receive the mBridge request/response on a web service endpoint and validate message 
          signature
         - Handle mBridge connectivity errors and pass wrapper exception to the Message Service 
      inScope: true

    - ID: MBC_HEALTH_METRICS
      type: system
      title: MBridge Connector Health Metrics
      description: |
        This component provides the health status (UP/DOWN) for the connector and 
         publishes operational metrics of the connector
      inScope: true

    - ID: MBC_TRANSLATION_DATA
      type: data
      title: Business data used for message Translation
      description: |
        Business data used for message Translation from MBC to CBCC (CB Command Center) and back. 
        The values are hardcoded and are art of the MBC process.
      inScope: true

    - ID: MBC_SOAP_MESSAGE_SIGNING_KEY
      title: MBridge Connector SOAP message signing key
      type: key
      description: It is used to sign SOAP messages sent to the CB mBridge node.
      inScope: true
      properties:
        location: VAULT
        format: ECDSA key pair (secp256k1)
        length: 256
        type: Private authentication key
      applicationRelated: true
      infrastructureRelated: false

    - ID: MB_CERTIFICATE
      title: MBridge SOAP/XML Verification certificate
      type: Certificate
      description: This is the certificate holding the mBridge CBUAE node 
        backend public key. It is used by the connector to verify the mBridge's 
        signature.
      properties:
        location: |
        Hashicorp VAULT (RFI: Mayank, how is this injected? as a K8s Secret)
      inScope: true

