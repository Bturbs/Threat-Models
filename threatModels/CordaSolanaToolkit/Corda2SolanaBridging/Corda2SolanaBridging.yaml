  - ID: UNSYNC_REDEEM_ADDRESS
    title: Unsynchronized Redemption Address Communication
    attack: |
      Bob purchases tokens from Alice on Solana and later wants to redeem them back to Corda. However, redemption
      requires sending tokens to Alice's designated redemption address, which is:

      1. **Manually configured** by the Bridge Authority in the redemptionWalletAccountToHolder mapping
      2. **Not discoverable on-chain** or from token metadata
      3. **Communicated out-of-band** from Alice to Bob (email, chat, contract terms)

      This creates multiple attack vectors:

      - **Stale Address**: BA reconfigures redemption addresses, but Alice provides Bob with an old address. Bob's
        tokens are sent to an unmapped address and are permanently lost.
      - **Incorrect Address**: Alice accidentally provides the wrong address (typo, copy-paste error). Bob's tokens
        are lost or sent to another user's redemption address.
      - **Unavailable Information**: Alice is unreachable or unwilling to provide the redemption address. Bob cannot
        redeem tokens he legitimately owns.
      - **Malicious Misdirection**: Alice intentionally provides Bob with a wrong address to cause him loss.

      The bridge design constrains redemption to always unlock tokens to the *original Corda holder* (Alice), not
      to the current token holder (Bob). This requires trust and coordination between trading parties.
    threatType: Tampering
    impactDesc: |
      Impacts include:

      - **Asset Loss**: Tokens sent to wrong or unmapped addresses are permanently lost, breaking the 1:1 peg
      - **Denial of Service**: Bob cannot redeem tokens if Alice won't provide the redemption address
      - **Poor UX**: Manual coordination required between trading parties creates friction and errors
      - **Trust Requirement**: Bob must trust Alice to provide correct information, undermining public blockchain principles
    impactedSecObj:
      - REFID: ASSET_INTEGRITY
      - REFID: AVAILABILITY
    attackers:
      - REFID: BRIDGING_PARTY
      - REFID: NETWORK_ATTACKER
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:R/S:U/C:N/I:H/A:L
    fullyMitigated: false
    countermeasures:
      - ID: DETERMINISTIC_REDEMPTION_ADDRESS
        title: Deterministic Redemption Address Derivation
        description: |
          Use Solana Program Derived Addresses (PDAs) to deterministically derive redemption addresses from
          immutable identifiers:

          redemptionAddress = deriveAddress(seed: hash(cordaX500Name), mintAccount)

          This makes redemption addresses:
          - **Discoverable**: Anyone can calculate the address
          - **Immutable**: Cannot be changed by BA reconfiguration
          - **Self-service**: No manual communication needed

          Implementation: Use Anchor's seeds constraint or native Solana PDA derivation.
        inPlace: false
        public: true

      - ID: DYNAMIC_REDEMPTION_WALLET_CREATION
        title: Dynamic Redemption Wallet Creation During Bridging
        description: |
          Modify BridgeFungibleTokenFlow to automatically create and configure a redemption wallet when
          tokens are first bridged:

          1. BA creates redemptionWallet and redemptionTokenAccount during mint phase
          2. Mapping stored in vault or dynamic config (not static file)
          3. Redemption address returned to user as part of bridging confirmation
          4. Address embedded in SPL token metadata or associated on-chain account

          This ensures:
          - **Timely creation**: Address exists before tokens can be traded
          - **No staleness**: Address created for this specific bridging event
          - **Automated communication**: Address returned via Corda flow, not out-of-band

          Implementation: Add createRedemptionWallet() call in BridgeFungibleTokenFlow.call()
        inPlace: false
        public: true
      - ID: ONCHAIN_REDEMPTION_METADATA
        title: On-Chain Redemption Address Metadata
        description: |
          Store the redemption address in a cryptographically verifiable on-chain location so any token
          holder can discover it without out-of-band communication.

          **Recommended Approach: Deterministic, Program-Owned Address**

          Derive the redemption address deterministically from immutable inputs (Corda holder identity + token mint).
          The address is owned by a Bridge Authority (BA) Solana program, not a keypair. This ensures:

          - **Discoverability**: Any holder can compute or query the address
          - **Immutability**: Address cannot drift due to configuration changes
          - **Authority control**: Only the BA program can authorize burns from this address
          - **Fewer keys**: BA does not need a separate private key per redemption address

          **Operational Implication**

          Because the address is program-owned, a **custom BA program is required** to sign burn instructions
          via CPI. A standard keypair alone cannot authorize burns from a program-owned address.
        inPlace: false
        public: true

