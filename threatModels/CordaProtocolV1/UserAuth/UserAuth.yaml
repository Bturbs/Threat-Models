      - REFID: CURATOR_CONFIG_AUTHORITY_KEYS
      - REFID: PROTOCOL_MANAGER_KEYS
      - REFID: VAULT_MANAGER_KEYS
      - REFID: CURATOR_KEYS
      - REFID: UNFREEZE_AUTHORITY_KEYS
    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:H/UI:N/S:C/C:N/I:H/A:H
    fullyMitigated: false
    ticketLink: https://r3-cev.atlassian.net/browse/PROT-862
    countermeasures:
      - ID: ELEVATED_THRESHOLD_MEMBERSHIP
        title: Elevated Config Threshold for Membership Changes
        description: |
          Squads v4 natively supports a **Config Threshold** separate from the
          Vault Threshold. For every multisig role, the Config Threshold must
          be set strictly higher than the Vault Threshold. For example:

          - Vault Threshold (operational): 2 of 5
          - Config Threshold (governance): 4 of 5 or unanimous

          Additionally, use Squads v4 permissions to restrict which members
          hold Owner-level access (required for config changes). Operational
          members should be assigned Proposer/Voter/Executor only, ensuring
          they cannot participate in governance votes even if colluding.

          **Verification checklist:**

          - Config Threshold > Vault Threshold for every multisig
          - Owner permission granted only to governance-designated members
          - Operational-only members have Proposer + Voter + Executor (not Owner)
          - Periodic audit of permission assignments
        inPlace: false
        public: true
        operational: false
        operator: Signer Committee
      - ID: TIMELOCK_MEMBERSHIP_CHANGES
        title: Timelock on Membership Change Proposals
        description: |
          Apply a mandatory timelock (e.g., 48–72h) to all membership change
          proposals across all multisigs, regardless of the multisig's
          operational timelock settings. This provides:

          - Detection window for watchtowers and monitoring
          - Time for legitimate members to revoke malicious proposals
          - Prevention of rapid sequential membership changes
        inPlace: false
        public: true
