threats:
  - ID: DENIAL_OF_STATE_ON_CONFIDENTIAL_STATES
    lastReview: 2024-04-23
    title: Denial of state
    impactDesc: |
      Denial of state attack prevents the rightful owner from spending its unspent state. 
      Whilst the attack targets a non-validating Notary
      the impact of this attack affects the state owner, which could be any participating node.
      It can go undetected until the owner tries to spend it.
    impactedSecObj:
      - REFID: LEDGER_INTEGRITY
      - REFID: AVAILABILITY

    assets:
      - REFID: UTXO
    attackers:
      - REFID: COUNTERPARTY
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:L/A:H
    threatType: Denial of Service, Spoofing
    pentestTestable: true
    attack: |
      A denial of state is where a malicious counterparty is able to block the transfer of states 
      between participating peers on the network using [Non-Validating Notary Protocol](https://docs.r3.com/en/platform/corda/5.2/developing-applications/ledger/notaries/non-validating-notary.html)
      In this scenario, the attacker does not own any of the states, but is able to get the notary to mark them as consumed 
       even with invalid transaction signature, 
      thereby blocking the states in any future transaction. 
      The attacker needs to know the reference to an unspent state i.e. TXID and index. 
      The attacker forms a transaction that uses as an input a UTXO.
       The attacker then notarizes the transaction with a non-validating notary, 
       which will then mark the referenced UTXO as spent. 
       Since the non-validating notary does not validate the transaction signatures, 
       the attacker does not need to know the UTXO owner's signing key.

    # (R.F.I.: Though state refrences are confidential, an attacker can get them during backchain validation, and or transacting with the victim party. The attacker cancels(by not signing it) the tx the moment it gets the victim input states and use them in a denial of state attack)
    #  (R.F.I.: Attacks that use unauthorised misbehaving Flows can be very disruptive -for e.g. change-notary flow and Finalisation flow- is this within the scope?)   

    public: true
    fullyMitigated: false
    countermeasures:
      - ID: SIGNATURE_VALIDATING_NOTARY
        title: Signature Validating Notary
        description: |
          Notary could run a signature validation algorithm for each UTXO being spent.
          One way could be each UTXO should have a new public-private key pair. The private key 
          is kept by the owner only. The notary keeps the public key for each UTXO. Privacy of input owners can be maintained
          by using a different key pair for each input if required. 
          The signature validating notary would not need to fully verify
          each transaction with the respective contract, it purely needs to verify the owner's signature meaning that most of
          the transaction is not disclosed to the notary.
          Other custom notarization protocols could also mitigate the threat.  

        operational: true
        operator: CORDAPP_PUBLISHER
        inPlace: false
        public: true
      - ID: LOG_REQUESTER_ID
        title: Identify the attacker and log requests
        description: |
          Keeping a log file of the P2P identity of the requester and the transaction ids requested can deter an attacker from carrying this attack, 
          and allow the MGM or the notary to take action for example deny rights to use the network or to use the cryptographic proof
          of fraudulent behaviour.
        operational: false
        inPlace: true
        public: true

      - ID: VALIDATING_NOTARY
        title: Use Validating Notary
        description: |
          Use a validating notary. This attack will not be possible against validating notary.
          However, the downside is the loss of privacy because the validating notary will be able to see all transaction details.   
          REF: `ContractVerifyingNotaryServerFlowImpl` class
        operational: true
        operator: CORDAPP_PUBLISHER
        inPlace: true
        public: true

  - ID: DENIAL_OF_REFERENCED_STATES
    lastReview: 2024-04-23
    title: Denial of state attack against reference states
    impactDesc: |
      That attacks prevents any transaction that has reference states from being notarised, 
      causing severe denial of service.
    impactedSecObj:
      - REFID: AVAILABILITY
      - REFID: LEDGER_INTEGRITY

    assets:
      - REFID: UTXO
    attackers:
      - REFID: COUNTERPARTY
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:L/A:H
    threatType: Denial of Service, Spoofing
    attack: |
      Referenced States are potentially known to any Participant node.
      When there is a [Non-Validating Notary](https://docs.r3.com/en/platform/corda/5.2/developing-applications/ledger/notaries/non-validating-notary.html)
      an attacker Node reference state that does not own and/or cannot spend as an input in a transaction, and gets the notary to notarise it,
       marking it as spent. 
      When notaristing any subsequent transaction that uses that reference state, the notary will find it spent and 
      will not notarise the transaction. 
      The problem is the state references may be known to all network counterparties. 
      Thus any counterparty can launch this attack, whereas in the previous denial of state attack the 
      assumption was state references were confidential. 
    pentestTestable: true
    public: true
    fullyMitigated: false
    countermeasures:
      - ID: SIGNATURE_VALIDATING_NOTARY_FOR_REFERENCE_STATE
        title: Signature Validating Notary for reference states
        description: |
          Notary could run a signature validation algorithm when reference states are being spent.
          Note that the reason behind using non-validating notary is to maintain the privacy of the transaction 
          participants. However, in the case of reference states, it is expected that 
          only identified and authenticated actors should be authorised to issue and update reference states.    

        operational: true
        operator: CORDAPP_PUBLISHER
        inPlace: false
        public: true

      - ID: LOG_REQUESTER_ID
        title: Identify the attacker and log requests
        description: |
          Keeping a log file of the P2P identity of the requester and the transaction ids requested can deter an attacker from carrying this attack, 
          and allow the MGM or the notary to take action for example deny rights to use the network or to use the cryptographic proof
          of fraudlent behaviour.
        operational: false
        inPlace: true
        public: true


  - ID: NOTARY_DENIAL_OF_STATE_BY_COUNTERPARTY
    lastReview: 2024-04-23
    title: Not sending Notary signatures to counterparties
    impactDesc: |
      Denial of state attack prevents the rightful owner from spending its unspent state. 

    assets:
      - REFID: DF_sendNotarySignaturesToCounterparties
    attackers:
      - REFID: COUNTERPARTY
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:L/A:L/MPR:H/MI:L/MA:L
    threatType: Denial of service, repudiation
    attack: |
      The attacker runs a modified finalisation flow that collects the notary signatures but 
      does not send notary signatures to the participants. 
      This prevents the remaining participants from updating their ledgers and finalise the transaction. 
      There is no ledger evidence of DF_sendNotarySignaturesToCounterparties being executed.
         
    public: true
    fullyMitigated: false
    countermeasures:
      - ID: QUERY_NOTARY_SIGNATURE_BY_TXID
        title: Query the notary signature by txid
        description: |
          Participants should be able to query the notary using the TXID.
          The TXID is confidential information that is known for limited number of participants.
          If a participant does not receive notary signature to confirm transaction notarisation, it can query the 
          notary directly to obtain the notary signature.

          If the notary has signed the transaction, it will return its signature.
          If the transaction is not signed or has been archived, it will return null.

        operational: false
        inPlace: false
        public: true


# (R.F.I.: I assume this is a safe response from the notary. The notary is not supposed to store txid list of txid that failed notarisation, nor a list of archived tx?)
