  - ID: MITM1
    title: Insecure connection to RPC APIs
    attack: An attacker with access to the network can perform MiTM and network 
      sniffing attacks.
    impactDesc: |
      Disclosure of sensitive data including administrative credentials.
    impactedSecObj:
      - REFID: FULL_CIA
    assets:
      - REFID: DF_OP_1
    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H
    threatType: complete confidentiality integrity and availability loss
    public: true
    fullyMitigated: true
    countermeasures:
      - ID: TLS_TERMINATION1
        title: Default TLS on API endpoints
        description: |
          Default TLS on API endpoints. TLS termination if performed on the WORKER_PROCESS itself.
        inPlace: yes
        public: true

  - ID: API_TLS_CONFIG1
    title: |
      Insecure initial TLS connection
    impactDesc: |
      Private certificate and CLUSTER_OPERATOR credentials disclosure resulting also in insecure future connections
    impactedSecObj:
      - REFID: FULL_CIA
    assets:
      - REFID: DF_OP_1
    pentestTestable: true
    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H
    threatType: complete confidentiality integrity and availability loss
    attack: |
      An attacker can execute network based attacks on a fresh installation as TLS is configured afterwards via API itself.
      Initial RPC API call, even to configure TLS, is vulnerable to network attacks like MiTM and sniffing as the TLS
       connection encryption is negotiated with a known insecure self signed certificate hardcoded in the RPC gateway.
    public: true
    fullyMitigated: true
    countermeasures:
      - ID: INFRA_OP_TLS_CONFIG
        title: Prior TLS certificate configuration
        description: |
          The INFRASTRUCTURE_OPERATOR configures the TLS certificate for RPC API GW before the API is actually used by the CLUSTER_OPERATOR.
          This also means there is not initial insecure TLS and initial TLS private material configuration via API itself.
        inPlace: true
        public: true

  - ID: INSECURE_JVM_PROCESS1
    title: |
      Secure JVM process configuration 
    impactDesc: |
      Disclosure of the `workers processes` in memory credentials and data
    impactedSecObj:
      - REFID: FULL_CIA
    attack: |
      An attacker with previous access to the infrastructure is able to recover the information stored and not encrypted 
      in the filesystem at rest while being in memory only. An attacker could as well retrieve the secrets and alter behaviors from debug
       features and controls systems like JMX.
    assets:
      - REFID: WORKER_PROCESS
    CVSS:
      vector: CVSS:3.1/AV:L/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H
    threatType: complete confidentiality integrity and availability loss
    public: true
    fullyMitigated: false
    countermeasures:
      - ID: JVM_SECURE_CONF1
        title: Memory dump/jmx/debug protection for all worker processes
        description: |
          For every JVM process, even if it crashes (e.g. `out of memory java error`) the process memory will not be dumped to a file.
          Tools for memory introspection are also disabled: debug features, JMX, etc.
          Override JVM options with ...
        inPlace: no
        public: true
        operational: true
        operator: INFRASTRUCTURE_OPERATOR

