  attackers:
    - ID: NETWORK_ATTACKER
      title: Network Attacker
      description: |
        An external attacker with network access who attempts to intercept, replay, or manipulate
        communications between bridge components (Corda nodes, Solana RPC, WebSocket connections).
      inScope: true