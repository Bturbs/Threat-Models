        public: true
        operational: true
  - ID: SIGNER_DURESS
    title: Signer Under Duress (Coercion or Blackmail)
    attack: |
      Attacker coerces a legitimate signer into performing an unauthorized
      action through:

      - **Physical threats / violence:** Signer or family threatened
      - **Blackmail:** Leveraging compromising information
      - **Legal/regulatory pressure:** Jurisdictional coercion

      Attack is facilitated by disclosure of signer identity through:

      - Hardware wallet delivery records (shipping address links to signer)
      - Company data (employment records, org charts)
      - Self-disclosure (social media, conferences)
      - On-chain analysis (address patterns linking to known entities)

      Higher risk for roles where signer identity is more visible:

      - Curator, Vault Manager (business-facing roles)
      - Protocol Config Authority (governance-visible)
      - Lower risk for anonymous signers (Vault Guard, Freeze Authority)
    threatType: Tampering
    impactDesc: |
      Signer performs unauthorized action under duress, providing legitimate
      signature for malicious intent. Unlike key theft, the duress scenario may
      not be detectable from on-chain data alone since the signature is
      technically valid and from the expected signer.
