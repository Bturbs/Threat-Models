  - ID: CONF_DISCLOSURE_INTERPOLATION
    title: Secret disclosure by variable interpolation feature
    threatType: Information Disclosure, DoS, Tampering
    attackers:
      - REFID: CLUSTER_OPERATOR
    assets:
      - REFID: CONFIG_DB_TABLES
    pentestTestable: true
    attack: |
      An attacker with CLUSTER_OPERATOR access can retrieve secret configurations, Kubernetes secrets and local files by 
      crafting special configuration entries that are somehow reflected through RPC APIs 
      (HOCON interpolation, variable resolution and file inclusion features). One example of configuration 
      reflection is the API REST endpoint [api/v1/config/{section}](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/Configuration-API/operation/get_config__section_)
    impactDesc: |
      Cluster configuration credentials disclosure.
    impactedSecObj:
      - REFID: FULL_CIA
    public: false
    fullyMitigated: false
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H
    countermeasures:
      - ID: DISABLE_LIBRARY_FEATURES
        title: Disable HOCON variable resolution and file inclusion
        description: |
          REF:  [HOCON variable resolution and file inclusion](https://github.com/lightbend/config#note-about-resolving-substitutions-in-referenceconf-and-applicationconf)
              > "substitutions fall back to environment variables" and include function"
        inPlace: false
        public: true


  - ID: SECRET_CONFIG_DISCLOSURE_API
    title: Secret disclosure by design in API
    threatType: Information Disclosure, DoS, Tampering
    attackers:
      - REFID: CLUSTER_OPERATOR
    assets:
      - REFID: CONFIG_DB_TABLES
    attack: |
      An attacker with CLUSTER_OPERATOR access can retrieve secret configurations through 
      [RPC API](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/Configuration-API/operation/get_config__section_)
    # impact: |
    #  Completely loss in integrity confidentiality and availability
    pentestTestable: true
    impactedSecObj:
      - REFID: FULL_CIA
    public: true
    fullyMitigated: true
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H
    countermeasures:
      - ID: CONF_API_WRITEONLY
        public: false
        title: There is no API to retrieve encrypted configuration secrets
        description: |
          There is no read from API of the encrypted configuration values
           [REF](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/Configuration-API/operation/get_config__section_)
        inPlace: false
      - ID: MASK_GET_CONFIG_API
        title: Mask secret credentials
        description: |
          Mask secret credentials returned in GET configuration API. For example CLUSTER TLS private keys.
        public: true
        inPlace: true
