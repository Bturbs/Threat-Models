  - ID: REGISTRATION_SPOOFING1
    title: Joiner's Registration spoofing
    impactDesc: |
      Malicious VNode impersonates a legal entity that can then read and consume ledger states (transactions).
    impactedSecObj:
      - REFID: LEDGER_SPOOFING_PREVENTION
      - REFID: LEDGER_TX_CONFIDENTIALITY
    assets:
      - REFID: DF_REGISTRATION_PROT
    attackers:
      - REFID: ANONYMOUS
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N
    threatType: Spoofing, Tampering
    attack: |
      An Anonymous internet user can attempt a registration with any X500 name, without any secret data/credential,
       for example by only having the CPI. The attacker will then be able to read and consume ledger states (transactions). 
    public: true
    conditional: |
      `corda.group.pki.session = NoPKI`
    fullyMitigated: true
    countermeasures:
      - ID: PRE_AUTH_TOKEN
        title: Out of band pre-authorization token registration requirement
        description: |
          Activate requirements for PRE_AUTH_TOKEN at registration via configuration:
          Configure regular expression matching rule to match all the registration requests without 
          PRE_AUTH_TOKEN [REF](https://github.com/corda/platform-eng-design/blob/master/core/corda-5/corda-5.0/the-host/manual-approval.md#configurability)
          to automatically being declined. With this configurations a non predictable PRE_AUTH_TOKEN needs is by the NETWORK_OPERATOR and shared 
          with the JOINER.
          The registration protocol will include the PRE_AUTH_TOKEN in the registration context under the key `corda.auth.token`.
          The MGM will decline every registration request without a valid PRE_AUTH_TOKEN matching the X500 name in the registration 
          context and checking also the TTL (time to live).
        inPlace: true
        public: true
        operational: true
        operator: CLUSTER_OPERATOR

  - ID: REGISTRATION_REPUDIATION1
    title: Joiner repudiates registration request
    impactDesc: |
      Network participants list may be not reliable because there
       is no durable cryptographic proof that the a member requested to Join a Corda Network. There may be also compliance impacts due to the lack of
       durable evidence.
    impactedSecObj:
      - REFID: NON_REPUDIATION
    assets:
      - REFID: DF_REGISTRATION_PROT
    attackers:
      - REFID: VNODE_OPERATOR
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:L/A:N
    threatType: Spoofing, Tampering
    attack: |
      A network participant can repudiates its registration to a Corda Network (before the first transaction is signed).
      The MGM will not be able to produce a cryptographic verifiable evidence of the VNode registration protocol.
    public: true
    # conditional: |
    #  `corda.group.pki.session = NoPKI`
    fullyMitigated: false
    countermeasures:
      - ID: SIGNED_REGISTRATION_RECEPT
        title: Signed registration
        description: |
          The registration context contains a signature of the PRE_AUTH_TOKEN or of the registration context itself, 
          verifiable with public JOINER SESSION_KEY. Note: the ping-pong message exchanges at the end of the REGISTRATION_PROTOCOL
          assures only the ownership on the private SESSION_KEY. 
        inPlace: false
        public: true
        operational: false

  - ID: REGISTRATION_REPUDIATION2
    title: MGM repudiates registration request
    impactDesc: |
      Network participants list may be not reliable because there
       is no durable cryptographic proof that the MGM received successfully the registration request. There may be also compliance impacts due to the lack of
       durable evidence.
    impactedSecObj:
      - REFID: NON_REPUDIATION
    assets:
      - REFID: DF_REGISTRATION_PROT
    attackers:
      - REFID: NETWORK_OPERATOR
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:N/I:L/A:L
    threatType: Spoofing, Tampering
    attack: |
      A NETWORK_OPERATOR can repudiate the fact that a JOINER sent a registration request, ultimately denying the
       JOINER to enter the network by falsely claiming that it never receives the registration request.
      The JOINER will not be able to produce a cryptographic verifiable evidence of the MGM receiving the registration request.
    public: true
    # conditional: |
    #  `corda.group.pki.session = NoPKI`
    fullyMitigated: false
    countermeasures:
      - ID: SIGNED_REGISTRATION_MGM_RECEIPT
        title: Signed registration receipt from the MGM
        description: |
          The MGM sends a signature (with the MGM SESSION_KEY) of the received registration request to the JOINER's Cluster. 
          This signature could be retrieved as part of the API:
          `Check registration status: GET /membership/$HOLDING_ID/$REGISTRATION_ID`
        inPlace: false
        public: true
        operational: false

  - ID: REGISTRATION_REPUDIATION3
    title: MGM repudiates registration approval
    impactDesc: |
      Network participants list may be not reliable because there
       is no durable cryptographic proof that the MGM received successfully the registration request. There may be also compliance impacts due to the lack of
       durable evidence.
    impactedSecObj:
      - REFID: NON_REPUDIATION
    assets:
      - REFID: DF_P2P_APPROVED_MSG
    attackers:
      - REFID: NETWORK_OPERATOR
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:N/I:L/A:L
    threatType: Spoofing, Tampering
    attack: |
      A NETWORK_OPERATOR can repudiate the fact that a JOINER was accepted, ultimately denying the
       JOINER to enter the network by falsely claiming that it never joined the Network.
      The JOINER will not be able to produce a cryptographic verifiable evidence of the MGM accepted the registration request.
    public: true
    # conditional: |
    #  `corda.group.pki.session = NoPKI`
    fullyMitigated: false
    countermeasures:
      - ID: SIGNED_REGISTRATION_ACCEPTED_MGM_RECEIPT
        title: Signed registration acceptance
        description: |
          The MGM sends a signature (with the MGM SESSION_KEY) of the accepted registration request to the JOINER's Cluster. 
          This signature could be retrieved as part of the API:
          `Check registration status: GET /membership/$HOLDING_ID/$REGISTRATION_ID`
        inPlace: false
        public: true
        operational: false

  - ID: PRE_AUTH_TOKEN_DISCLOSURE_REST
    title: PRE_AUTH_TOKEN leaked from CLUSTER_DB
    impactDesc: |
      An Anonymous internet user can attempt a registration with a X500 name for which a PRE_AUTH_TOKEN has been generated
       and not yet consumed, without any secret data/credential,
       for example by only having the CPI. The attacker will then be able to read and consume ledger states (transactions). 
    impactedSecObj:
      - REFID: LEDGER_SPOOFING_PREVENTION
      - REFID: LEDGER_TX_CONFIDENTIALITY
    assets:
      - REFID: CLUSTER_DB
    attackers:
      - REFID: ANONYMOUS
    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N/E:U/RC:U
    threatType: Spoofing, Tampering
    attack: |
      A disclosure of the CLUSTER_DB data would allow ANONYMOUS attacker to register a VNode impersonating a legit entity. 
    public: true
    fullyMitigated: false
    countermeasures:
      - ID: PRE_AUTH_TOKEN_HASHING
        title: PRE_AUTH_TOKEN secure hashing
        description: |
          Secure Hash the PRE_AUTH_TOKEN at rest in the DB in a similar way that the hashed password are stored securely.
          If the PRE_AUTH_TOKEN length and entropy is enough, then simple hash (SHA-256) without salt may be adequate as well. 
        inPlace: false
        public: true
        operational: false


  - ID: REGISTRATION_DISCLOSURE1
    title: Registration Request Status disclosure
    impactDesc: |
      Registration Requests get disclosed to any NETWORK_OPERATOR accessing the CLUSTER API.
    impactedSecObj:
      - REFID: CONFIDENTIALITY
    assets:
      - REFID: DF_GET_REGISTRATIONS_REQS1
    attackers:
      - REFID: NETWORK_OPERATOR
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:L/I:N/A:N
    threatType: Information Disclosure
    attack: |
      An API authorized user (NETWORK_OPERATOR) calls the Registration Status API with another 
      mgmHoldingIdentityShortHash (not his own) to retrieve information about others Corda Network JOINER.
    public: true
    fullyMitigated: true
    countermeasures:
      - ID: DATA_LEVEL_AUTH_REG1
        title: API result filtering
        description: |
          API `GET pending/historic registration requests "{mgmHoldingIdentityShortHash}/requests/"` validate the mgmHoldingIdentityShortHash against the caller
          and filter the results enforcing authorization and horizontal data access (RFI: pls confirm this is in place). Ultimately, {mgmHoldingIdentityShortHash} could be avoided as a parameter.
        inPlace: true
        public: true
        operational: false
        test: |
          [d](d) this should be a link to the test in development (feature ork in progress)


  - ID: UNAUTH_REGISTRATION_APPROVAL
    title: Unauthorized Registration Approval
    impactDesc: |
      A NETWORK_OPERATOR can compromise other Cordapp networks he does not belong to: 
        
        - Accept unauthorized members compromising confidentiality, and integrity
        - Deny legit JOINER compromising availability
    impactedSecObj:
      - REFID: AVAILABILITY
      - REFID: LEDGER_INTEGRITY
      - REFID: LEDGER_TX_CONFIDENTIALITY
    assets:
      - REFID: DF_REVIEW_REGISTRATIONS_REQ1
    attackers:
      - REFID: NETWORK_OPERATOR
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H
    threatType: Information Disclosure
    attack: |
      Registration Requests get approved/declined by an unauthorized NETWORK_OPERATOR on the same cluster.
    public: true
    fullyMitigated: true
    countermeasures:
      - ID: DATA_LEVEL_AUTH_REG2
        title: API result filtering
        description: |
          API `POST {mgmHoldingIdentityShortHash}/request/{requestId}` validates the mgmHoldingIdentityShortHash against the caller
          and filter the results enforcing authorization and horizontal data access (RFI: pls confirm this is in place).
          Ultimately, {mgmHoldingIdentityShortHash} could be avoided as a parameter.
        inPlace: true
        public: true
        operational: false
        test: |
          [d](d) this should be a link to the test in development (feature ork in progress)

  - ID: REGISTRATION_INJECTION1
    title: Injection attack from Registration Request Status API
    impactDesc: |
      Compromise NETWORK_OPERATOR credentials and actions, ultimately compromising the CordApp Network.
    impactedSecObj:
      - REFID: FULL_CIA
    assets:
      - REFID: DF_GET_REGISTRATIONS_REQS1
    attackers:
      - REFID: ANONYMOUS
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H
    threatType: Elevation of Privileges
    attack: |
      A Malicious JOINER can send a request with parameters that get rendered on the NETWORK_OPERATOR web user interface containing 
      Javascript and other malicious code that ultimately lead to successful XSS attacks.
    public: true
    fullyMitigated: true
    countermeasures:
      - ID: REG_VALIDATION_ENCODING
        title: Secure coding for XSS
        description: |
          All parameters shown in the DF_GET_REGISTRATIONS_REQS1 API, especially those received from other parties, 
          are validated syntactically, and encoded correctly on the output context (JSON/HTML...).
        inPlace: true
        public: true
        operational: false

  - ID: REGISTRATION_STATUS_DISCLOSURE1
    title: Unauthorized Registration status disclosure
    impactDesc: |
      A VNODE_OPERATOR can query the registration status of other JOINER (VNodes).
    impactedSecObj:
      - REFID: CONFIDENTIALITY
    assets:
      - REFID: DF_CHECK_REG_STATUS
    attackers:
      - REFID: VNODE_OPERATOR
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:N/A:N
    threatType: Information Disclosure
    attack: |
      A VNODE_OPERATOR  query the registration status of other JOINER (VNodes) changing the expected $HOLDING_ID in the API:
      `GET /membership/$HOLDING_ID/$REGISTRATION_ID`
    public: true
    fullyMitigated: true
    countermeasures:
      - ID: C1
        title: API result filtering
        description: |
          API `GET /membership/$HOLDING_ID/$REGISTRATION_ID` validates the HOLDING_ID against the caller
          and filter the results enforcing authorization and horizontal data access (RFI: pls confirm this is in place).
          Ultimately, HOLDING_ID could be avoided as a parameter.
        inPlace: true
        public: true
        operational: false
        test: |
          [d](d) this should be a link to the test in development (feature ork in progress)

  - ID: UNAUTHENTICATED_MGM1
    title: Registration request get sent to a malicious spoofed MGM party
    impactDesc: |
      Disclosure of Registration context data: X.500 name and public SESSION_KEY.
      There may be information disclosure if the P2P_GATEWAY DMZ or Reverse proxy with TLS termination get compromised, 
        as the gateway is in the DMZ while the registration request in decrypted in the link manager.  
    impactedSecObj:
      - REFID: CONFIDENTIALITY
    assets:
      - REFID: DF_REGISTRATION_PROT
    CVSS:
      vector: CVSS:3.0/AV:A/AC:H/PR:N/UI:R/S:U/C:L/I:N/A:N
    threatType: Spoofing, DoS, Information disclosure
    attack: |
      The registration request is inside TLS with trust root from CPI, so the MGM Cluster is authenticated, not the MGM VNode
      [REF](https://github.com/corda/platform-eng-design/blob/a6151195196bcfa20daf6f6a7f0901a73ab2da6f/core/corda-5/corda-5.0/p2p-customer-facing-doc/doc.md#tls).
      The only way to direct the request to a wrong MGM would be to influence the Cluster behavior, so we need to have an already compromised Cluster.
      In the case of the requester and the MGM on the same cluster there's not TLS verification, still, in a non compromised Cluster the registration request 
      would be routed by the link manager to the correct MGM VNode. The attack would disclose information even if only the P2P_GATEWAY is compromised.
    public: true
    fullyMitigated: true
    countermeasures:
      - ID: ECIES1
        title: ECIES encryption
        description: |
          ECIES encryption of the [DF_REGISTRATION_PROT](#DF_REGISTRATION_PROT) payload.
          In the case where only the P2P_GATEWAY is compromised by an attacker but not the other WORKER_PROCESS,
          this is plausible given the lower trust network (e.g. DMZ) the P2P_GATEWAY runs in then ECIES encryption would avoid the 
          information disclosure of the X.500 name, the public SESSION_KEY and any other data of the registration and 
          the decryption happens in the LINK_MANAGER.
        operartional: false
        inPlace: yes
        public: true

  - ID: REGISTRATION_DOS1
    title: Registration squatting
    impactDesc: |
      A VNode can't register timely.
    impactedSecObj:
      - REFID: AVAILABILITY
    assets:
      - REFID: DF_REGISTRATION_PROT
    CVSS:
      vector: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:L
    threatType: Denial of Service
    attack: |
      An anonymous attacker with no secret credential needed may continuously 'occupy' X500 names not allowing a specifics legitimate 
      VNode identity to successfully register. 
    public: true
    fullyMitigated: false
    countermeasures:
      - ID: NON_BLOCKING_REGISTRATION
        title: Non blocking registration implementation
        description: |
          The registration request does not reserve the X500 name until the successful onboard process terminates.
          This means multiple attempts of registration for the same X500 name are possible.
        operational: false
        inPlace: false
        public: true
      - ID: SIGNED_REGISTRATION_REQUEST1
        title: SESSION_KEY_CERT check
        description: |
          When the optional certificates (chain of trust) has been configured the caller REGISTRANT could present a verifiable signature to the 
          MGM_VNode instead of the ephemeral keys used for ECIES.
        operational: false
        inPlace: false
        public: true
      - ID: PRE_AUTHENTICATION_TOKEN
        title: PRE Authentication Token
        description: |
          The MGM can require tha the initial registration needs to have a matching rule ([REF](https://github.com/corda/corda-runtime-os/wiki/Manual-Approval#add-a-pre-auth-group-approval-rule)) issued from the MGM and bound to a 
          specific X500 name, which needs to be transferred out-of-band to the member before registration.
        operational: true
        inPlace: true
        public: true
        operator: NETWORK_OPERATOR

  - ID: REGISTRATION_DOS2
    title: Registration flooding
    impactDesc: |
      A VNode can't register timely.
    impactedSecObj:
      - REFID: AVAILABILITY
    assets:
      - REFID: DF_REGISTRATION_PROT
    CVSS:
      vector: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:L
    threatType: Denial of Service
    attack: |
      An anonymous attacker can flood the MGM P2P_GATEWAY with cryptographically valid registration 
      requests, consuming P2P_GATEWAY resources. This results in denial of service conditions for the gateway. 
      The attacker does not need any form of credentials to perform this attack. 
      Note that the ECDH key of the MGM (contained in the CPI) is not considered a secret. 
    public: true
    fullyMitigated: false
    countermeasures:
      # - ID: C1
      #   title: Delayed registration risk acceptance 
      #   description: | 
      #     The risk of a VNode can't register timely is accepted.
      #   operational: true
      #   inPlace: true
      #   public: true
      - ID: MUTUAL_TLS
        title: Mutual TLS
        description: |
          DF_REGISTRATION_PROT communication (in the mutual TLS proposal all the P2P_GATEWAY connection) have a mutual TLS verification.
          This implies that the certificates and policies have to be in place prior to the registration happening
          [REF](https://github.com/corda/platform-eng-design/blob/af0fde5a55263eb576e9b4a0cbbb9d24d29e5714/core/corda-5/corda-5.0/p2p-mtls/mutual-tls.md).
          Mutual TLS is a valid mitigation, since the MGM will need to have added the member’s client TLS certificate to the allow list in order for the gateway to allow the connection. Even in the one-way (non mutual TLS) case, a member will have to be given the application CPI in order to register. This contains the MGM’s ECDH key. Without that any registration request will be invalid. This cannot be detected at the gateway, but it could be possibly detected at the membership level and operational controls could be used, e.g. to block connections from specific sources if this is observed
        operational: true
        inPlace: no
        public: true
        operator: INFRASTRUCTURE_OPERATOR
      - REFID: PRE_AUTHENTICATION_TOKEN
