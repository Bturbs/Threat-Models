  - ID: FC_CONNECTOR_DOS
    title: Denial of Service Against Connector
    attack: |
      An attacker or compromised LFI flood the connector with excessive 
      requests or exploit resource-intensive operations,
      preventing legitimate banking transactions from proceeding.
    impactDesc: |
      Interrupts core banking operations, delaying or blocking legitimate transactions
      and causing customer dissatisfaction.
    impactedSecObj:
      - REFID: AVAILABILITY
    fullyMitigated: true
    threatType: Denial of Service
    CVSS:
      vector: CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H
    pentestTestable: true
    countermeasures:
      - ID: RATE_LIMITING_AND_TIMEOUTS
        title: Throttling & Circuit Breakers
        description: |
          Protect connector endpoints using rate limiting, resource usage monitoring,
          and timeouts to mitigate large request bursts and heavy computing tasks.
        inPlace: false
        public: true
      - ID: HA_SETUP
        title: High Availability Setup
        description: |
          Deploy the connector in a high-availability configuration with load balancing
          and failover mechanisms to ensure continuous service availability.
        inPlace: true
        public: true
      - ID: PER_LFI_CONNECTOR
        title: Having one separate Flexcube connector per LFI
        description: |
          Having one separate Flexcube connector per LFI to avoid the DOS attacks.
        inPlace: false
        public: true



  - ID: FLEXCUBE_PASSWORD_LEAK_AT_REST
    title: Flexcube credential leaked to less trusted system
    CVSS:
      vector: CVSS:3.1/AV:A/AC:H/PR:L/UI:N/S:C/C:L/I:H/A:H
    threatType: Tampering, Elevation of Privileges
    assets:
      - REFID: FLEXCUBE_PASSWORD
    attack: |
      An attacker can reverse the original passwowrd just by accessing any message (that contains MSGID encryption key itself in it).
      The password is not actually encrypted but just obfuscated with the MSGID.
      Another option for an attaccker is just to replay the message with the same MSGID and ##PASSWORD XML field in a new fabricated
      message, as MSGID is not bound to the message itself (at least, before processing it in FLEXCUBE).
      Storing the password in a secure Vault while storing it at the same time in an easily reversible manner in persistent storage (for example, a database)
      is a security risk. Transaction messages are likely also logged; again, this is a another potential FLEXCUBE password leak vector.
    impactDesc: |
      FLEXCUBE Core banking request execution, including fund transfers, DoS on redemptions and issuances, 
      integrity and repudiation issues of the LFI accounts movements.
    impactedSecObj:
      - REFID: COMPLIANCE
      - REFID: NON_REPUDIATION
      - REFID: INTEGRITY
    public: false
    fullyMitigated: false
    ticketLink: https://r3-cev.atlassian.net/browse/R3SOL-4245
    countermeasures:
      - ID: DO_NOT_STORE_REVERSIBLE_PASSWORDS
        title: Do not store reversible passwords
        description: |
          Treat FLEXCUBE encrypted passwords as plaintext sensitive passwords: for example, by masking in logs and in any persistence 
          layer.
          Do not store the password in a reversible manner in the persistence layer: the connector should mask the calculated
           value when storing the message. 
           It is always possible to reset the password after it has been read from the storage prior to being sent to FLEXCUBE. 
          Store the password only in a secure Vault. 
          To execute retries for HA and so on, the FLEXCUBE connector needs to re-calculate
          the ##PASSWORD XML field from the password in the Vault.
        inPlace: false
        public: true
