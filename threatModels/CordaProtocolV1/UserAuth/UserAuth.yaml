        title: Hardware and Software Supply Chain Controls
        description: |
          Comprehensive supply chain hardening:

          - **Hardware procurement:** Buy directly from manufacturer; verify
            tamper-evident packaging; document process (photos, attestation)
          - **Firmware verification:** Verify firmware signatures on boot and
            after updates
          - **Multi-vendor diversity:** Use multiple hardware wallet vendors
            across the multisig (e.g., Ledger + Trezor + Keystone) so a single
            vendor compromise does not reach threshold
          - **Device type diversity:** Require signers within the same multisig
            to use different device types (e.g., hardware wallet, mobile, air-
            gapped laptop) in addition to different vendors. A single supply
            chain compromise of one device type (e.g., a compromised mobile OS
            update) cannot reach threshold if other signers use different device
            types
          - **Dependency auditing:** Pin and audit dependencies in custom
            signing tools (cargo audit, npm audit)
          - **Open-source preference:** Prefer open-source firmware wallets for
            auditability
          - **Air-gapped signing:** Use QR code or SD card transfer to
            eliminate remote firmware attack vectors
