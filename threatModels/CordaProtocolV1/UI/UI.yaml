ID: UI
schemaVersion: 2
title: Web Application UI
version: '0.1'
status: Draft
children:
  - REFID: UI_Indexer

authors: |
  Security Research team at R3
  Updated: 2026-02-27

parent: CordaProtocolV1

scope:
  description: |
    Threat model for the Corda Protocol V1 Web Application UI — a React/Vite single-page
    application (SPA) that allows investors and curators to interact with the on-chain
    vault program via a browser-based interface.

    **Key Capabilities:**
    - Investor flows: investment proposals, vToken balance, redemption requests
    - Curator flows: settlement, rejection, whitelist management, and operations
      that depend on the live oracle-wrapper-backed price path
    - Solana wallet integration (Phantom, Solflare, etc.) via wallet-adapter
    - Direct on-chain transaction construction and signing in the browser

    **Technology Stack:**
    - React (JSX), Vite dev server
    - @solana/wallet-adapter for wallet connectivity
    - @solana/web3.js / Anchor for RPC calls and program interaction
    - Runs primarily in the browser; the read-only indexer backend is modeled separately as a child

    **Repository:** corda-protocol-mvp/ui

  assets:
    - ID: UI_APP
      type: system
      title: Web Application (SPA)
      description: |
        React/Vite single-page application served to the user's browser.
        Constructs and submits Solana transactions to the vault program.
      inScope: true

    - ID: WALLET_ADAPTER
      type: system
      title: Solana Wallet Adapter Integration
      description: |
        Browser extension wallet integration (e.g., Phantom, Solflare) used to sign
        transactions on behalf of the investor or curator. Private keys never leave
        the wallet extension.
      inScope: true

    - ID: BROWSER_STORAGE
      type: data
      title: Browser Local/Session Storage
      description: |
        Any session state, cached RPC responses, or preferences stored in
        localStorage or sessionStorage by the application.
      inScope: true

    - ID: RPC_ENDPOINT
      type: dataflow
      title: Browser-to-RPC Node Connection
      description: |
        HTTPS/WSS connection from the browser to a Solana RPC endpoint used to
        fetch on-chain state and submit transactions.
      inScope: true

    - ID: SOLANA_RPC_NODE
      type: system
      title: Solana RPC Node
      description: |
        External Solana RPC endpoint (e.g., Helius, Quicknode, public mainnet RPC).
        Not built by this team.
      inScope: false

  assumptions:
    - ID: WALLET_SECURITY
      description: |
        The user's wallet extension (e.g., Phantom) correctly isolates private key
        material and only signs transactions approved by the user. Bugs in the
        wallet extension itself are out of scope.

    - ID: BROWSER_TRUST
      description: |
        The user's browser is assumed to be uncompromised by malware or malicious
        extensions at the OS level. Browser supply-chain attacks are out of scope.

analysis: |
  The UI is a thin client that constructs Solana transactions and delegates signing
  to the user's wallet. The main attack surface is:

  1. **Cross-Site Scripting (XSS)** — injected scripts could intercept wallet approval dialogs
     or silently modify transaction parameters before signing
  2. **Dependency supply-chain** — npm packages (wallet-adapter, web3.js, React) could be
     compromised to inject malicious transaction logic
  3. **RPC endpoint manipulation** — pointing the UI at a malicious RPC node could return
     forged on-chain state to deceive users
  4. **Sensitive data leakage** — account addresses, transaction history, or whitelist status
     cached in browser storage
  5. **UI spoofing / phishing** — users directed to a lookalike site that mimics the UI

threats:
  - ID: XSS_TRANSACTION_MANIPULATION
    title: XSS Leading to Malicious Transaction Injection
    attack: |
      An attacker injects malicious JavaScript into the application via:

      - A stored or reflected XSS vulnerability in user-controlled input fields
        (e.g., memo fields, proposal descriptions)
      - A compromised npm dependency that executes in the browser context
      - A browser extension with broad page permissions

      The injected script intercepts the transaction construction flow and silently modifies
      destination accounts, amounts, or instruction data before the wallet signs.

    threatType: Tampering
    impactDesc: |
      The investor or curator unknowingly signs a manipulated transaction, potentially:

      - Transferring funds to an attacker-controlled account
      - Approving unauthorized whitelist entries
      - Triggering unintended program instructions (e.g., redemption at wrong amount)

    impactedSecObj:
      - REFID: USER_FUNDS_SAFETY
      - REFID: PROGRAM_INTEGRITY
    assets:
      - REFID: UI_APP
      - REFID: WALLET_ADAPTER
    attackers:
      - REFID: EXTERNAL_ATTACKER
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:N'
    pentestTestable: true
    fullyMitigated: false
    ticketLink: 'https://r3-cev.atlassian.net/browse/PROT-850'
    countermeasures:
      - ID: CSP_POLICY
        title: Enforce Content Security Policy (CSP)
        description: |
          Configure a strict Content Security Policy header to prevent inline scripts
          and restrict script sources to known trusted origins. Disallow `eval()` and
          inline event handlers. Use nonce-based CSP for dynamic scripts if needed.
        inPlace: false
        public: true
        operational: false

      - ID: INPUT_SANITIZATION
        title: Sanitize All User-Controlled Input
        description: |
          Apply output encoding and input sanitization for all user-provided strings
          rendered in the DOM. Use React's built-in JSX escaping; avoid `dangerouslySetInnerHTML`.
        inPlace: false
        public: true
        operational: false

      - ID: TRANSACTION_REVIEW_UI
        title: Display Full Transaction Details Before Signing
        description: |
          Present a human-readable summary of the constructed transaction (accounts,
          amounts, instruction type) in the UI before invoking the wallet adapter's
          `signTransaction`. This allows users to visually verify the transaction
          matches their intent.
        inPlace: false
        public: false
        operational: false

  - ID: MALICIOUS_RPC_ENDPOINT
    title: Attacker-Controlled RPC Node Returning Forged State
    attack: |
      The UI reads on-chain state exclusively via the configured RPC endpoint. An attacker
      who can influence the RPC endpoint URL (e.g., via XSS, DNS poisoning, or user
      misconfiguration) can serve forged account data, including:

      - Fake NAV values inflating apparent vault worth
      - Forged whitelist status to deceive a curator into believing an investor is whitelisted
      - Modified token balances to confuse settlement decisions

    threatType: Spoofing
    impactDesc: |
      Users make financial decisions (invest, redeem, settle) based on incorrect on-chain
      state displayed in the UI, potentially leading to fund loss or compliance violations.

    impactedSecObj:
      - REFID: USER_FUNDS_SAFETY
      - REFID: COMPLIANCE
    assets:
      - REFID: RPC_ENDPOINT
      - REFID: UI_APP
    attackers:
      - REFID: EXTERNAL_ATTACKER
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:L/I:H/A:N'
    pentestTestable: true
    fullyMitigated: false
    ticketLink: 'https://r3-cev.atlassian.net/browse/PROT-887'
    countermeasures:
      - ID: RPC_ENDPOINT_PINNING
        title: Pin and Validate RPC Endpoint Configuration
        description: |
          Hard-code or strongly validate the RPC endpoint URL at build time.
          Do not allow end-users to override the RPC endpoint without explicit
          confirmation. Consider using multiple RPC nodes and cross-validating
          critical account reads.
        inPlace: false
        public: true
        operational: false

      - ID: ON_CHAIN_VERIFICATION
        title: Verify Critical State On-Chain at Transaction Time
        description: |
          For critical operations (settlement, whitelist checks), rely on the on-chain
          program's own validation rather than trusting UI-displayed state. The program
          enforces correct state transitions regardless of what the UI displays.
        inPlace: true
        public: true
        operational: false

  - ID: DEPENDENCY_SUPPLY_CHAIN_ATTACK
    title: Compromised npm Dependency Injecting Malicious Code
    attack: |
      A widely used npm package in the UI's dependency tree (e.g., @solana/wallet-adapter,
      @solana/web3.js, a React utility library) is compromised via:

      - Maintainer account takeover publishing a malicious version
      - Typosquatting package with similar name
      - Malicious package introduced via transitive dependency

      The compromised package exfiltrates wallet public keys, session data, or manipulates
      transaction construction logic silently.

    threatType: Tampering
    impactDesc: |
      Widespread silent compromise of all users of the deployed UI, enabling:

      - Theft of session tokens or wallet connection details
      - Silent transaction manipulation at scale
      - Exfiltration of investor identity and trading activity

    impactedSecObj:
      - REFID: USER_FUNDS_SAFETY
      - REFID: PROGRAM_INTEGRITY
    assets:
      - REFID: UI_APP
    attackers:
      - REFID: EXTERNAL_ATTACKER
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:C/C:H/I:H/A:N'
    pentestTestable: false
    ticketLink: 'https://r3-cev.atlassian.net/browse/PROT-871'
    fullyMitigated: false
    countermeasures:
      - ID: DEPENDENCY_LOCKFILE
        title: Lock Dependency Versions and Audit Regularly
        description: |
          Commit `package-lock.json` and enforce exact version pinning. Run
          `npm audit` in CI to detect known vulnerabilities. Consider using
          Dependabot or Renovate for automated update PRs with changelogs.
        inPlace: false
        public: true
        operational: true
        operator: Development Team

      - ID: SUBRESOURCE_INTEGRITY
        title: Use Subresource Integrity (SRI) for CDN Assets
        description: |
          For any assets loaded from CDN, use SRI hashes to ensure integrity.
          For the SPA bundle itself, serve from a controlled origin with HTTPS only.
        inPlace: false
        public: true
        operational: false

  - ID: SENSITIVE_DATA_BROWSER_STORAGE
    title: Sensitive On-Chain Data Leaked via Browser Storage
    attack: |
      The UI caches on-chain data (investor addresses, whitelist status, NAV,
      transaction history) in `localStorage` or `sessionStorage`. An attacker
      with local access, a malicious browser extension, or XSS can read this data.

    threatType: Information Disclosure
    impactDesc: |
      Investor wallet addresses, whitelist status, and transaction patterns are
      exposed, potentially enabling:

      - KYC/AML data leakage (regulatory violation)
      - Targeted phishing against identified investors
      - Competitive intelligence on vault activity

    impactedSecObj:
      - REFID: COMPLIANCE
      - REFID: AUDITABILITY
    assets:
      - REFID: BROWSER_STORAGE
      - REFID: UI_APP
    attackers:
      - REFID: EXTERNAL_ATTACKER
    CVSS:
      vector: 'CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N'
    pentestTestable: true
    ticketLink: 'https://r3-cev.atlassian.net/browse/PROT-885'
    fullyMitigated: false
    countermeasures:
      - ID: MINIMIZE_BROWSER_STORAGE
        title: Minimize Sensitive Data in Browser Storage
        description: |
          Do not persist sensitive data (whitelist status, investor identities,
          transaction amounts) in `localStorage`. Use in-memory state (React state/context)
          for session-scoped data and re-fetch from chain on reload.
        inPlace: false
        public: true
        operational: false

  - ID: UI_PHISHING
    title: Phishing via UI Spoofing
    attack: |
      An attacker hosts a lookalike copy of the UI at a similar domain
      (e.g., `corda-vauit.app`, `cordaprotocol-ui.io`) and lures users via
      email or social media. The fake UI mimics the legitimate interface and
      either:

      - Captures wallet connection approvals to infer active addresses
      - Tricks users into signing malicious transactions disguised as
        legitimate vault operations

    threatType: Spoofing
    impactDesc: |
      Investors or curators unknowingly interact with a malicious site, leading to
      unauthorized transaction signatures, fund loss, or credential harvesting.

    impactedSecObj:
      - REFID: USER_FUNDS_SAFETY
    assets:
      - REFID: UI_APP
      - REFID: WALLET_ADAPTER
    attackers:
      - REFID: EXTERNAL_ATTACKER
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:H/A:N'
    pentestTestable: false
    ticketLink: 'https://r3-cev.atlassian.net/browse/PROT-870'
    fullyMitigated: false
    countermeasures:
      - ID: OFFICIAL_URL_COMMUNICATION
        title: Communicate Official URL via Verified Channels
        description: |
          Publish and maintain an authoritative list of official UI URLs through
          verified channels (signed release notes, official documentation).
          Educate users to verify the domain before connecting their wallet.
        inPlace: false
        public: true
        operational: true
        operator: Product Team

      - ID: HTTPS_HSTS
        title: Enforce HTTPS with HSTS on Official Domain
        description: |
          Serve the UI exclusively over HTTPS with HSTS (HTTP Strict Transport
          Security) preloading to prevent protocol downgrade and domain impersonation
          via lookalike HTTP sites.
        inPlace: false
        public: true
        operational: false
        
      - ID: USER_EDUCATION
        title: User Education on Phishing Risks
        description: |
          Provide clear guidance in the UI and documentation about phishing risks,
          how to verify the official site, and best practices for wallet security.
        inPlace: false
        public: true
        operational: true
        operator: Product Team
