    impactDesc: |
      Signers or monitoring infrastructure become unavailable:

      - Time-sensitive actions cannot be executed (freeze, pause, revoke)
      - Timelocked malicious actions execute without detection or intervention
      - Emergency response is blocked during active attacks
      - Vault remains in degraded state (frozen, paused) longer than necessary
