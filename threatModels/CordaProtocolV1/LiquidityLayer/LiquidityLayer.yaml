  #         Replace the clean window reset with a true sliding window that tracks
  #         individual transaction timestamps. Alternatively, use an exponentially
  #         decaying counter that gradually frees up capacity rather than resetting
  #         all at once.
  #
  #       inPlace: false
  #       public: true

  - ID: LL_POOL_WHITELIST_REVOCATION
    title: Pool PDA De-Whitelisted Breaks Rebalancing
    attack: |
      The LiquidityPool PDA must be whitelisted in the vault's whitelist for
      rebalance operations to work:

      - rebalance_invest_async: pool PDA is the "investor" in the vault
        CPI call to create_investment_proposal
      - rebalance_redeem_async: pool PDA is the "investor" in the vault CPI
        call to create_redemption_proposal (requires whitelist check)

      If the vault admin removes the pool PDA from the whitelist (via
      remove_from_vtoken_whitelist), all rebalance operations fail. The pool
      can still serve sync swaps from existing inventory, but cannot replenish.

    threatType: Denial of Service
    impactDesc: |
      Pool loses ability to rebalance inventory via the vault:

      - Cannot convert excess USDC to vTokens (rebalance_invest fails)
      - Cannot convert excess vTokens to USDC (rebalance_redeem fails)
      - Pool inventory gradually depletes without replenishment
      - Eventually, both invest_sync and redeem_sync fail

    impactedSecObj:
      - REFID: AVAILABILITY
    attackers:
      - REFID: ACL_AUTHORITY
    assets:
      - REFID: LIQUIDITY_POOL_PDA
      - REFID: WHITELIST_ENTRY_PDA
      - REFID: DF_REBALANCE
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:N/I:N/A:H'
    fullyMitigated: false
    countermeasures:
      - ID: LL_POOL_WHITELIST_OPERATIONAL_CONTROL
        title: Operational Control for Pool Whitelisting
        description: |
          Establish an operational procedure that the pool PDA must remain
          whitelisted at all times. The whitelist removal of the pool PDA
          should require multi-party approval and explicit acknowledgement
          of the impact on liquidity operations.

        inPlace: false
        public: true
        operational: true
        operator: Vault Admin Team

  - ID: LL_STALE_FEE_ACCRUAL_PRICING
    title: Sync Swap Pricing Ignores Pending Fee Accrual
    attack: |
      invest_sync and redeem_sync now call the vault's live oracle-wrapper price
      path instead of deriving price locally from TVL.

      If that live price feed drifts from the vault's intended operational price
      basis, or if operators expect snapshot-style price locking but sync flows
      continue to use the live wrapper value, sync swaps can execute at a price
      that does not match adjacent async settlement.

      This means:

      - invest_sync and redeem_sync can diverge from sealed async cycle pricing
      - Users can trade around stale or delayed operational expectations
      - The pool inherits every oracle-wrapper freshness and governance mistake

    threatType: Tampering
    impactDesc: |
      Pricing drift in sync mode can create systematic unfairness:

      - Sync users can receive a materially different price than async users
      - The pool becomes another venue for exploiting oracle timing drift
      - Manager-set spreads amplify the impact of a bad live price source

    impactedSecObj:
      - REFID: INTEGRITY
    attackers:
      - REFID: EXTERNAL_ATTACKER
    assets:
      - REFID: DF_SYNC_INVEST
      - REFID: DF_SYNC_REDEEM
      - REFID: VAULT_PDA
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:N/I:L/A:N'
    fullyMitigated: false
    countermeasures:
      - ID: LL_EXPLICIT_SYNC_PRICE_POLICY
        title: Define sync pricing policy against the live wrapper price
        description: |
          Document and enforce whether sync flows are expected to use the live
          oracle-wrapper price or a cycle-locked price. Reject sync trades during
          sealed batch windows if the live price would violate that policy.

        inPlace: false
        public: true

      - ID: LL_SYNC_PRICE_SANITY_CHECK
        title: Sanity-check sync price against operational reference data
        description: |
          Add a guard that compares the live wrapper price against an expected
          operational reference or recent sealed snapshot price before allowing
          large sync swaps.

        inPlace: false
        public: true
        operational: true
        operator: Infrastructure Team
