    <a id="vaultDataModel"></a>
    **Vault Data Model**

    <object type="image/svg+xml" data="img/vaultDataModel.svg" style="width:100%; height:auto;">
    <img src="img/vaultDataModel.svg"/>
    </object>

  **Jupiter Swap Data Structure**

     
  The actual on-chain instruction is an opaque,
  serialized byte array. The vault program does
  NOT deserialize this—it passes it directly to
  Jupiter via CPI.

  Security relies on:

  1. Pre/post balance validation
  2. Jupiter program ID check
  3. Custody account binding

  **IMPORTANT:** The `jupiter_swap_data` byte array passed to the vault
  is an opaque, pre-serialized Jupiter instruction. The vault program
  treats it as untrusted input and does NOT parse or validate its
  internal structure.

  Instead, security is enforced through:

  - Validating the Jupiter program ID before CPI
  - Measuring actual SPL token balance changes (pre/post swap)
  - Binding custody accounts to prevent misdirection
  - Enforcing min_out via balance checks, not instruction data

  **References:**

  - Jupiter Swap API (off-chain): <a href="https://dev.jup.ag/api-reference/swap/swap">https://dev.jup.ag/api-reference/swap/swap</a>
  - jupiter-cpi-swap-example: <a href="https://github.com/jup-ag/jupiter-cpi-swap-example/tree/main">https://github.com/jup-ag/jupiter-cpi-swap-example/tree/main</a>
