      type: data flow
      description: |
        Out of band PRE_AUTH_TOKEN shared with JOINER
      inScope: false

    - ID: DF_CHECK_REG_STATUS
      title: Check Registration status API
      type: data flow
      description: |
        Check Registration status API by registration ID
        [REF](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/Member-Registration-API/operation/get_membership__holdingidentityshorthash___registrationrequestid_)
      inScope: false
