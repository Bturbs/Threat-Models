    pentestTestable: false
    fullyMitigated: false
    countermeasures:
      - ID: SUCCESSION_PLAN_FOR_SIGNERS
        title: Establish Signer Succession Playbook and Recovery Plan
        description: |
          Define, document, and test a comprehensive succession playbook covering signer
          replacement, key loss, and operator departure.

          **Playbook contents:**

          - **Planned departure:** Step-by-step process for orderly signer offboarding, including
            new signer onboarding, multisig member update (DF_MEMBER_UPDATE), and key retirement.

          - **Emergency replacement:** Pre-authorized procedure for replacing a compromised or
            unavailable signer, including identity verification, key generation ceremony, and
            on-chain member update under time pressure.

          - **Key loss recovery:** Procedure when a signer permanently loses access to their key
            (device failure, theft). Includes immediate revocation and replacement flow.

          - **Role handover controls:** Ensure no single person can both remove an old signer and
            add a replacement without independent approval.

          - **Periodic validation:** Review succession playbook at least annually and after every
            actual signer change. Run succession drills as part of DRILLS schedule.

          **Critical constraint:** Succession must preserve quorum at all times — never reduce
          the active signer count below the threshold during transitions.
        inPlace: false
        public: false
        operational: true
        operator: Platform Operations and Security team

      - ID: THRESHOLD_DESIGN_GUARDRAILS
        title: At least 3-of-5 Multisig Threshold
        description: |
          Selected configuration: 3-of-5 threshold for both Upgrade Authority and Notary Admin.

          **Rationale for 3-of-5 over 2-of-4:**

          - Collusion resistance: requires compromising 3 signers (majority) instead of 2 (minority)
          - After a single key compromise, attacker is still 2 steps from quorum (vs 1 step in 2-of-4)
          - Liveness: tolerates 2 unavailable signers (same as 2-of-4)
          - Aligns with industry best practices for high-value governance

          **Operational constraints:**

          - Requires 5 qualified, geographically diverse signers (see SIGNER_SELECTION_RULES)
          - 3 approvals needed for each privileged operation
          - Signing coordination across time zones must be planned for routine and emergency operations

          Other options are 4 of 7 signers.
        inPlace: true
        public: true
        operational: true
        operator: Platform Operations and Security team

