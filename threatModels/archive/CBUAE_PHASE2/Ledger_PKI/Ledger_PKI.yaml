  - ID: EXTERNAL_LEDGER_VERIFICATION
    title: Transaction verification after finality depends on off-ledger 
      services
    # assets:
    #   - REFID: DF_FIN_PAYEE_RCVBLCK
    # attackers:
    #   - REFID: PAYER

    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H
    threatType: Denial of Service
    attack: |
      Transaction verification after finality (e.g. backchain, proof of ownership, new transaction initiation)
       in not deterministic and self referencing and depends on off-ledger services like mutable online PKI's CRL that may be unavailable/offline.

      **Refs:** [LLD - 10.8.2 Cryptography and Public Key Infrastructure/Certificate authority, certificate trust chain, and validation/Chain validation](#LLD), [LLD - 10.9 Cryptography and Public Key Infrastructure/Certificate propagation: platform operator and local certificate store](#LLD)
    impactDesc: |
      The concept of token ownership and finality is weakened by unnecessarily depending on third parties continuous availability.
      Finality and the ability by a network participant to verify old transactions is limited by accessing online services.
      Potentially future layer 2 solutions and faster payment channels based on peer to peer TX signature exchanges will depend on third party online services as well.

      **Refs:** [LLD - 7.3.5.3 Corda Distributed Ledger Technology/Solution design/Finality & consensus/Finality](#LLD)
    public: true
    fullyMitigated: true
    pentestTestable: false
    ticketLink: https://r3-cev.atlassian.net/browse/R3SOL-1347
    countermeasures:
      - ID: LEDGER_SELF_REFERENCING_VERIFICATION
        title: The Ledger of any participant contains all the data to verify 
          already finalized transaction
        description: |
          The Ledger of any participant contains all the data to verify already finalized transaction, that include signatures, certificates and CRL used 
          to verify the TX at finalization time. If instead a formal ledger storage of all the data necessary to validate the state of the transaction in the ledger 
          we use cache this threat is not mitigated. 
          Usually the concept of CACHE for CRL and certificate/public keys implies that is used only to optimize
           an online access to a source of truth and can be evicted/deleted.

          **Refs:** [LLD - 10.9.4 Cryptography and Public Key Infrastructure/Certificate propagation: platform operator and local certificate store/Component 1: Back-end Vault KV store](#LLD), [LLD - 7.3.8 Corda Distributed Ledger Technology/Solution design/Data storage & management](#LLD)
        inPlace: false
        public: true

      - ID: CERTIFICATE_STORAGE_DOCUMENTATION
        title: Certificate Storage Documentation
        description: |
          Document the locations where certificates are stored and how they can be restored. 
          Include recommendations for backing up Hashicorp Vault separately to ensure the integrity and availability of certificates.
          - **Storage Locations:**
            - Certificates are stored in the following locations:
              - Certificate Authority (CA) that issued them.
              - Definitive store at the Central Bank.
              - Local stores for on-demand access by local banks.
              - Hashicorp Vault for secure storage and access control.
          - **Backup Recommendations:**
            - Back up Hashicorp Vault separately to prevent data loss in case of corruption.
            - Ensure that backup procedures are documented and followed to maintain the integrity of the key value store for past and present certificates.
            - Regularly test the restoration process to verify that certificates can be successfully restored from backups.

          **Refs:** [LLD - 10.13.3.3 Cryptography and Public Key Infrastructure/Resiliency and recovery/HashiCorp Vault storage/Backups](#LLD), [LLD - 10.9.4.3 Cryptography and Public Key Infrastructure/Certificate propagation: platform operator and local certificate store/Component 1: Back-end Vault KV store/Fault tolerance and disaster recovery guarantees](#LLD)
        inPlace: true
        public: true
        operational: true
        operator: DEVOPS


  - ID: EXPIRED_BACKCHAIN_NOTARIZATION
    title: Backchain signatures expired at discovery time
    # assets:
    #   - REFID: DF_FIN_PAYEE_RCVBLCK
    # attackers:
    #   - REFID: PAYER


    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:H/A:H
    threatType: Denial of Service
    attack: |
      It is possible to use compromised/revoked keys to sign malicious and untrustworthy backchain. CRLs may contain the compromised key 
      information but it has to be ignored to verify supposedly older tx. A rotated/compromised key of the notary (or any other trusted
       timestamper party) will eventually be rotated.

      **Refs:** [LLD - 10.10.3.2 Cryptography and Public Key Infrastructure/Certificate and asymmetric key lifecycle/Solution design/Certificate expiry](#LLD), [LLD - 10.8.3 Cryptography and Public Key Infrastructure/Certificate authority, certificate trust chain, and validation/Timestamping](#LLD)
    impactDesc: |
      Notarization was required to prevent double spending only (REF: see non-validation notary in C5). A non validating notary wouldn't now even be secure for 
      double spending in this case (potential use of compromised old keys). A full validation notary is always required. The PAYEE validation in a transfer is thereof 
      useless, when not misleading, and implies information disclosure of past transaction history.

      **Refs:** [LLD - 7.3.5.2 Corda Distributed Ledger Technology/Solution design/Finality & consensus/Notary implementation](#LLD)
    public: false
    fullyMitigated: false
    pentestTestable: true
    ticketLink: https://r3-cev.atlassian.net/browse/R3SOL-4240
    countermeasures:
      - ID: NOTARY_MANAGED_UTXO
        title: Notary/CB only managed UTXOs
        description: |
          TODO: Basically identity based managed account... is it still a distributed ledger? does it makes sense to have tokens if validation can be done only by a central party 
          (account based management from CB makes more sense as tokens ID at this are an unnecessary complication)?

          **Refs:** [LLD - 7.3.5 Corda Distributed Ledger Technology/Solution design/Finality & consensus](#LLD)
        inPlace: false
        public: true
      - ID: TOKEN_REISSUANCE
        title: Notary/CB reissuance of tokens with valid signatures
        description: |
          TODO: expand on Notary/CB reissuance of tokens with valid signatures
          check before send by PAYER (does this compromises finality?

          **Refs:** [LLD - 7.3.2 Corda Distributed Ledger Technology/Solution design/API](#LLD)
        inPlace: false
        public: true
      - ID: SIGN_TIME_VALIDATION_WITH_TIMESTAMP
        title: Sign time validation with timestamp
        description: |
          > The expiry time of a certificate is relevant in our case not to the time of validation, but the time of signing
          [REF](https://github.com/corda/r3-engineering/blob/f4e4274f04407ebdf9e0b6dc1f5afceed5b08180/architecture-and-design/cryptography-manager/HLD/v2/README.md#features)

          **Note**: Residual risk of compromised timestamp key can only be accepted.

          **Refs:** [LLD - 10.8.3 Cryptography and Public Key Infrastructure/Certificate authority, certificate trust chain, and validation/Timestamping](#LLD), [LLD - 10.10.3.2 Cryptography and Public Key Infrastructure/Certificate and asymmetric key lifecycle/Solution design/Certificate expiry](#LLD)
        inPlace: true
        public: true


  - ID: LFI_SPOOFING_BY_INTERMEDIATE_CA
    title: An LFI Issuing Certificates for Other LFIs With Its Own Intermediate 
      CA
    attack: |
      A Licensed Financial Institution (LFI) misuses its intermediate Certification Authority 
      to generate valid-looking end-entity certificates for other LFIs (or the CB itself). This undermines the trust model 
      by bypassing the root CA hierarchy and allowing malicious impersonation or unauthorized access.

      **Refs:** [LLD - 10.8.6 Cryptography and Public Key Infrastructure/Certificate authority, certificate trust chain, and validation/Component 1 - Root and intermediate certificate authority](#LLD), [LLD - 10.8.2 Cryptography and Public Key Infrastructure/Certificate authority, certificate trust chain, and validation/Chain validation](#LLD)
    impactDesc: |
      Permits advanced spoofing attacks, unauthorized credential issuance, and 
      disruption of trust throughout the ledger network, resulting in complete compromise of the network.

      **Refs:** [LLD - 10.7.3 Cryptography and Public Key Infrastructure/Public key infrastructure/Solution design](#LLD)
    fullyMitigated: true
    threatType: Spoofing, Elevation of Privileges
    pentestTestable: true
    public: true
    CVSS:
      vector: CVSS:3.0/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H
    countermeasures:
      - ID: STRICT_NAME_BASED_CONSTRAINTS
        title: Strict Name-Based Constraints
        description: |
          Enforce strict name-based constraints on the intermediate CA to 
          prevent unauthorized issuance. See [RFC-5280](https://datatracker.ietf.org/doc/html/rfc5280)

          **Refs:** [LLD - 10.8.6.3 Cryptography and Public Key Infrastructure/Certificate authority, certificate trust chain, and validation/Component 1 - Root and intermediate certificate authority/Security guarantees](#LLD)
        inPlace: true
        public: true
      - ID: CERTIFICATE_TRANSPARENCY
        title: Certificate Transparency
        description: |
          LFIs each maintain a Certificate Transparency service that allows other LFIs to independently monitor each other's behaviour. See [RFC-9162](https://datatracker.ietf.org/doc/html/rfc9162)

          **Refs:** [LLD - 10.14 Cryptography and Public Key Infrastructure/Security information and event management (SIEM), monitoring and alerting](#LLD), [LLD - 10.9 Cryptography and Public Key Infrastructure/Certificate propagation: platform operator and local certificate store](#LLD)
        inPlace: false
        public: true


