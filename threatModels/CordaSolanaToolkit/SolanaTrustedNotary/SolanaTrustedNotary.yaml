  - ID: STN_PDA_CREATION_DOS
    title: PDA Creation Denial of Service
    attack: |
      An attacker creates a PDA (Program Derived Address) for a transaction ID 
      using a third-party Solana program before the Solana Notary Program can create it.
       This blocks the legitimate creation of the PDA by the Notary Program, causing a denial
        of service.
      A more severe attack involves front-running the notarisation 
      transaction by submitting a conflicting PDA creation transaction through an anonymous Solana
       bot. This allows any participant of the transaction to block it with plausible deniability.
      A general version of this attack is described in: [lamsy - PDA Initialization Front-running Vulnerability #69](https://github.com/sherlock-audit/2024-09-orderly-network-solana-contract-judging/issues/69) 
      This is a Solana-specific attack that exploits the PDA creation mechanism, which is not unique to the Notary Program.
      This derives from design trade-offs in Solana's PDA creation process to make programs 
      completely stateless (defferent of Ethereum's contract creation process),
       where PDAs are created based on a seed and a program ID, and the first transaction to create a PDA with a specific seed wins.
       where the first transaction to create a PDA with a specific seed wins,
       and subsequent attempts with the same seed fail.
       

    threatType: Denial of Service
    impactDesc: |
      The legitimate notarisation process is blocked, 
      preventing the transaction from being notarised. 
      This disrupts the Corda network's operations and could lead to financial or operational 
      losses.
    impactedSecObj:
      - REFID: AVAILABILITY
    assets:
      - REFID: SOLANA_NOTARY_PROGRAM
      - REFID: NOTARISED_TRANSACTION_ACCOUNT_PDA
      - REFID: DF_STN_VERIFY_ACCOUNT_COUNT
    attackers:
      - REFID: ATTACKER_ON_SOLANA_NETWORK_STN
      - REFID: MALICIOUS_CORDA_PARTICIPANT_STN
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H'
    fullyMitigated: true
    countermeasures:
      - REFID: STN_NOTARY_AUTHENTICATION
      - ID: SOLANA_PDA_COLLISION_PREVENTION
        title: Solana PDA Collision Prevention
        description: |
          Only a specific program can create PDAs for itself because the program ID is cryptographically
          bound into the derivation. The formula is essentially: PDA = hash(program_id + seeds + bump).
          Front-Running Protection
          Other programs cannot front-run to steal a PDA because:

          - They can't create the same PDA (different program ID = different result)
          - PDAs are designed to be off-curve (not valid Ed25519 public keys), so no one can sign transactions as that account
          - The owning program is the only one with authority to write to that PDA
        inPlace: false
        public: true
      - ID: UNPREDICTABLE_PDA_SEEDS
        title: Unpredictable PDA Seeds
        description: |
          PDA seeds are derived from transaction-specific data (e.g., Corda transaction hashes) rather than static or predictable values, making it infeasible for an attacker to precompute addresses in advance.
          This provides defense-in-depth: while the signature-based authorization layer is the primary protection against unauthorized execution, unique seeds per transaction ensure that even if authorization logic were somehow bypassed, distinct PDAs would prevent state collisions across different transactions.
        inPlace: true
        public: true

  - ID: STN_INITIALIZE_FRONT_RUNNING
    title: Front-Running during Program Initialization
    attack: |
      An attacker bot monitors the blockchain for new program deployments and attempts to front-run the legitimate deployer's `initialize` instruction by submitting their own transaction first. This could result in unauthorized initialization of the program, potentially compromising its intended functionality.
    threatType: Elevation of Privilege
    impactDesc: |
      Unauthorized initialization of the program could lead mainly to the loss of avilability on the initialization of a Trusted Notary Program.
    impactedSecObj:
      - REFID: AVAILABILITY
    pentestTestable: true
    assets:
      - REFID: SOLANA_NOTARY_PROGRAM
      - REFID: ADMIN_PDA
    attackers:
      - REFID: ATTACKER_ON_SOLANA_NETWORK_STN
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:N/I:N/A:H'
    fullyMitigated: true
    countermeasures:
      - ID: STN_DEPLOYER_SPEED_ADVANTAGE
        title: Deployer Speed Advantage with automation and right sequence of 
          operations
        description: |
          The deployer uses a scripted workflow to immediately submit the `initialize` transaction upon confirmation of the program deployment. This minimizes the time window for an attacker to front-run the initialization process.
          This requires the deployer to have a ready generated Admin key before or instantly after the program deployment (though automation).
          This also requires de deployer to be able to re-execute the `initialize` instruction in case of a front-running attack. This means is this attack happens the configuration of the program ID in the Corda Notary code (uniquenessProvider coniguration) may also needs to after a successful initialization (not only after program deployment as it may be invalidated by a reactive attacker/bot).
        inPlace: true
        public: true
      - ID: STN_UPGRADE_AUTHORITY_CHECK
        title: Upgrade Authority Verification
        description: |
          The `initialize` instruction verifies that the signer of the transaction matches the program's designated `upgrade_authority`. This ensures that only the legitimate deployer can successfully initialize the program.
        inPlace: false
        public: true
      - ID: STN_HARD_CODE_ADMIN_KEY
        title: Hardcoding the Admin Key
        description: |
          The Solana Notary Program should hardcode the admin public key into its logic during deployment. This ensures that the admin key cannot be altered or replaced post-deployment, preventing unauthorized administrative access.
        inPlace: false
        public: true
      - ID: STN_ATOMIC_INITIALIZATION_TX
        title: Atomic Multi-Instruction Initialization Transaction
        description: |
          All initialization instructions (`initialize`, `create_network`, `authorize_notary`) are batched into a single Solana transaction, executing atomically in sequence.
          This prevents an attacker from front-running only the `initialize` instruction—they would need to front-run the entire atomic transaction, which is significantly harder because:
          1. The attacker cannot partially intercept (all-or-nothing execution)
          2. Detecting success/failure requires observing the full tx outcome
          3. Racing against a bundled multi-instruction tx is harder than racing a single instruction
        inPlace: false
        public: true

      - ID: STN_POST_INIT_VERIFICATION
        title: Post-Initialization Administrative Verification
        description: |
          After the `initialize` and `authorize_notary` instructions complete, an off-chain automated script immediately verifies that:
          1. The `administration.admin` field matches the expected administrator public key
          2. All expected notaries were successfully authorized with correct network IDs
          If verification fails (indicating successful front-running), the deployment is rolled back or recovery procedures are triggered.
          This provides rapid detection (within the same block) and actionable recovery paths.
        operational: true
        operator: Corda Network operator
        inPlace: false
        public: true

  - ID: NETWORK_ID_SPOOFING1
    title: NeworkID Spoofing by different Corda Network
    attack: |
      A malicious Corda network operator register its own corda network.
      They then configure a compromised Corda Notary Node to use the Solana Notary Program with the spoofed `network_id`.
      This could allow them to notarise transactions for that network without proper authorization.
    threatType: Spoofing, Elevation of Privilege
    impactDesc: |
      Unauthorized notarisation of transactions for a Corda network, leading to potential ledger inconsistenciesi, complete denial of states, and trust issues.
    impactedSecObj:
      - REFID: CORDA_NETWORK_AUTH
      - REFID: LEDGER_INTEGRITY
      - REFID: AVAILABILITY
    assets:
      - REFID: SOLANA_NOTARY_PROGRAM
      - REFID: COMMIT_INSTRUCTION_PARAMS
      - REFID: DF_STN_INVOKE_COMMIT
    attackers:
      - REFID: NETWORK_ATTACKER
    pentestTestable: true

    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:N/I:H/A:H'
    fullyMitigated: true
    countermeasures:
      - ID: STN_NETWORK_ID_VERIFICATION
        title: Network ID Verification during commit
        description: |
          The `commit` instruction does **not** trust any `network_id` supplied by the caller. Instead it:
          1. Loads the NotaryAuthorization PDA for the signing notary and reads `authorization.network_id`.
          2. Re-derives the expected NotarisedTransactionAccount PDA using the seeds:
             `['corda_tx', tx_id, authorization.network_id]` (see commit.rs:122-140).
          3. Compares the provided output account key against the expected PDA.
          If the caller spoofs a different `network_id`, the PDA derivation does not match and the
          instruction fails with `InvalidAccounts`.
          This cryptographically enforces network isolation: a notary authorized for Network A cannot
          notarise transactions in Network B's state space.

          Test coverage: [solana-program/programs/corda-notary/tests/test_security.rs](solana-program/programs/corda-notary/tests/test_security.rs)
          (`network_id_spoofing_attack_should_fail`) validates the failure path and expected error.
        inPlace: true
        public: true
      - ID: SOLANA_DEFAULT_CHECKS
        public: true
        inPlace: false
        title: Solana Default Checks
        description: |
          The Solana Notary Program relies on Solana's native transaction signing and accounti
           ownership mechanisms to ensure that only authorized Corda Notary Nodes can invoke the 
           `commit` instruction for their registered `network_id`s.
          This includes verifying that the transaction is signed by the private key corresponding 
          to the Corda Notary Node's Solana account, which is linked to its authorized networks.

  - ID: DEVKEYS_IN_PRODUCTION
    title: Use of Development Keys in Production
    attack: |
      An attacker exploits the presence of hardcoded or default development keys used by the Solana Notary Program or associated Corda Notary Nodes in a production environment.
      Examples:

      1. Using known default keys to impersonate a Corda Notary Node and submit fraudulent notarisation requests.
      2. Exploiting weak or publicly known keys to gain unauthorized access to administrative functions of the Notary Program.
      3. Program deployment used for upgrade or initialization uses development keys that are compromised.


    threatType: Spoofing, Elevation of Privilege
    pentestTestable: true
    impactDesc: |
      Unauthorized notarisation of transactions, potential ledger inconsistencies, and compromise of administrative controls.
    impactedSecObj:
      - REFID: CORDA_NETWORK_AUTH
      - REFID: LEDGER_INTEGRITY
    assets:
      - REFID: SOLANA_NOTARY_PROGRAM
      - REFID: CORDA_NOTARY_NODE_SOLANA
      - REFID: STN_ADMIN_PRIVATE_KEY
    attackers:
      - REFID: ATTACKER_ON_SOLANA_NETWORK_STN
      - REFID: MALICIOUS_CORDA_PARTICIPANT_STN
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:L'
    fullyMitigated: true
    countermeasures:
      - ID: STN_SECURE_KEY_MANAGEMENT
        title: Secure Key Management Practices
        description: |
          All private keys used by the Solana Notary Program and associated Corda Notary Nodes must be securely generated, stored, and managed.
          Development or default keys must never be used in production environments.
          Recommended practices include using hardware security modules (HSMs), secure key vaults, and regular key rotation policies.
        inPlace: true # Operational responsibility
        operational: true
        operator: Corda Network operator
        public: true
