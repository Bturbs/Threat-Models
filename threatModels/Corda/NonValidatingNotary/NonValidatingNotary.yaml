  - ID: DENIAL_OF_STATE
    title: Denial of State
    attack: |
      A malicious node is able to block the transfer of states between participating 
      peers on the network. In this scenario, the attacker does not own any of the 
      states, but is able to consume them by notarizing an invalid transaction, 
      thereby blocking the states in any future transaction.
    threatType: Denial of Service, Tampering
    impactDesc: |
      Prevents legitimate ledger updates, disrupts business processes, and potentially locks up assets.
    impactedSecObj:
      - REFID: LEDGER_INTEGRITY
      - REFID: AVAILABILITY
    assets:
      - REFID: STATE_OBJECT
      - REFID: TRANSACTION
      - REFID: NOTARY
    attackers:
      - REFID: MALICIOUS_NODE
      - REFID: MALICIOUS_NOTARY
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H' # High impact on availability and integrity
    fullyMitigated: false # Depends on notary behavior and governance
    countermeasures:

      - ID: NOTARY_VALIDATION
        title: Notary Validation of Transactions
        description: |
          Notaries validate transactions against contract rules to prevent the 
          notarization of invalid transactions that could lead to state denial.
        inPlace: true # Depends on Notary type
        public: true

      - ID: NETWORK_GOVERNANCE
        title: Network Governance Policies
        description: |
          Clear network governance policies and dispute resolution mechanisms are needed to address and remediate denial-of-state scenarios.
        inPlace: true # Assumed network governance feature
        public: true

      - ID: HASH_LOCK_STATES
        title: Hash-Locked States
        description: |
          Using hash-locks on states can prevent them from being consumed by a 
          malicious node, as they would require the pre-image to unlock the state.
        inPlace: false # CorDapp design choice
        public: true

  - ID: INFO_DISCLOSURE_TO_NOTARY
    title: Information Disclosure to Notary
    attack: |
      The filtered transaction and the P2P protocol used for collecting signatures 
      disclose the identities of the sender and receiver to the notary. This can 
      lead to privacy concerns as the notary gains visibility into transaction participants.
    threatType: Information Disclosure
    impactDesc: |
      Compromises the privacy of transaction participants by exposing their identities 
      to the notary, potentially leading to misuse of sensitive information.
    impactedSecObj:
      - REFID: DATA_CONFIDENTIALITY
    attackers:
      - REFID: MALICIOUS_NOTARY
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:H/UI:N/S:U/C:H/I:N/A:N'
    fullyMitigated: true
    countermeasures:
      - REFID: CORDA_CONFIDENTIAL_IDENTITIES

      - ID: ZERO_KNOWLEDGE_PROOFS
        title: Use of Zero-Knowledge Proofs
        description: |
          Leverage zero-knowledge proofs to validate transactions without revealing 
          the identities of the sender and receiver to the notary.
        inPlace: false
        public: true
      - ID: FILTERED_TRANSACTIONS
        title: Filtered Transaction Protocol
        description: |
          Implement a protocol that allows the notary to verify transactions without 
          needing to know the full details of the participants' identities and output states.
        inPlace: true # CorDapp design choice
        public: true
      - ID: NON_VALIDATING_NOTARY
        title: Non-Validating Notary Design
        description: |
          Design the notary to not validate transactions, thus limiting the information 
          it needs to access about transaction participants.
