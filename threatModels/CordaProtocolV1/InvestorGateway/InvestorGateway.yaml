ID: InvestorGateway
schemaVersion: 2
title: Investor Gateway

authors: |
  Security Research team at R3

parent: CordaProtocolV1

scope:
  description: |
    Threat model for the **Investor Gateway** — a stateless Kotlin/Ktor HTTP service
    that sits between the investor UI and the Solana vault program. It is the
    off-chain enforcement point for the protocol's compliance controls.

    **Two security-critical functions:**

    - Compliance screening of investor wallet addresses via the Hypernative Monitor
      reputation API.
    - Production of signed on-chain compliance attestations (Ed25519) bound to
      `(programId, vault, investor, action, amount, requestId, expiresAt, nonce)`
      that the vault program verifies on-chain against `vault.compliance_authority`.

    **Primary security goal of the gateway:** prevent **fraudulent or
    out-of-compliance investment / redemption transactions** from reaching the vault
    program. The gateway is itself the principal countermeasure for that risk; this
    model focuses on the new attack surface the gateway introduces and the trust
    boundaries it crosses.

    **Repository:** `corda-protocol-mvp/services/investor-gateway`

    <img src="img/IG_seq1.svg"/>

  assets:
    - ID: IG_SERVICE
      type: system
      title: Investor Gateway Service
      description: |
        Stateless Kotlin/Ktor HTTP service. Holds no persistent state. Holds the
        Ed25519 attestation signer keypair and Hypernative API credentials in
        memory only.
      inScope: true

    - ID: IG_SIGNER_KEYPAIR
      type: credential
      title: Ed25519 Compliance Attestation Signer Keypair
      description: |
        Ed25519 keypair used to sign on-chain compliance attestations. The matching
        public key is configured on-chain as `vault.compliance_authority` via
        vault admin tooling.

        Possession of the private key is equivalent to authority to approve any
        investment or redemption transaction the vault program will accept.
      inScope: true
      properties:
        location: Process memory; loaded at boot from env var `GATEWAY_ATTESTATION_SIGNER_KEYPAIR`
        format: 64-byte Solana keypair (seed ‖ pubkey), JSON byte-array or base64 encoded
        publicKeyLength: 256 bits
        privateKeyLength: 256 bits
      applicationRelated: true
      infrastructureRelated: true

    - ID: IG_HYPERNATIVE_CREDS
      type: credential
      title: Hypernative API Credentials
      description: |
        Credentials used by the gateway to call the Hypernative `/screener/reputation`
        endpoint. Either `x-client-id` + `x-client-secret`, or a Bearer token, or
        both. Provisioned via env vars `HYPERNATIVE_CLIENT_ID`,
        `HYPERNATIVE_CLIENT_SECRET`, `HYPERNATIVE_BEARER_TOKEN`.
      inScope: true
      properties:
        location: Process memory; loaded at boot from env vars

    - ID: IG_ATTESTATION
      type: data
      title: Signed Compliance Attestation
      description: |
        Canonical attestation message + Ed25519 signature returned to the caller.

        Message layout (94 bytes domain-prefixed):

        - `"CORDA_COMPLIANCE_ATTESTATION_V1"` (31B)
        - `program_id` (32B), `vault` (32B), `investor` (32B)
        - `action` (1B: 0 = INVESTMENT, 1 = REDEMPTION)
        - `amount` (u64 LE), `request_id` (u64 LE)
        - `expires_at` (i64 LE, default TTL 300s)
        - `nonce` (32B CSPRNG)
      inScope: true

    - ID: DF_CLIENT_TO_GATEWAY
      type: dataflow
      title: Investor UI → Gateway HTTPS
      description: |
        Inbound HTTPS from the investor browser, terminated by an upstream
        load balancer / API gateway / WAF that is responsible for client
        authentication and rate limiting. The gateway itself does not
        authenticate inbound callers.
      inScope: true

    - ID: DF_GATEWAY_TO_HYPERNATIVE
      type: dataflow
      title: Gateway → Hypernative Monitor (HTTPS)
      description: |
        Outbound HTTPS to `api.hypernative.xyz/screener/reputation` carrying the
        candidate investor address and the configured screener policy ID.
        Authenticated with `x-client-id` / `x-client-secret` and/or Bearer.
      inScope: true

    - ID: DF_GATEWAY_LEGACY_FORWARD
      type: dataflow
      title: Gateway → Operator-Configured Forward Target (legacy)
      description: |
        HTTP/HTTPS forward of the raw inbound body to `${VAULT_BASE_URL}` for the
        legacy `/api/investment` and `/api/redemption` routes. **No in-repo
        consumer exists**; the standard UI flow does not use these routes.
        Included in scope because misconfiguration of `VAULT_BASE_URL` could
        be abused as an internal HTTP probe.
      inScope: true

    - ID: HYPERNATIVE_API
      type: system
      title: Hypernative Monitor (external SaaS)
      description: |
        External screening backend. Treated as a trusted external service over
        TLS. Internal failure modes of Hypernative are out of scope.
      inScope: false

  assumptions:
    - ID: UPSTREAM_AUTH_AND_RATE_LIMIT
      description: |
        The deployment fronting the gateway (load balancer / API gateway / WAF)
        authenticates inbound callers and applies rate limiting before traffic
        reaches the Investor Gateway. The gateway itself performs no inbound
        authentication.

    - ID: HYPERNATIVE_TLS_TRUSTED
      description: |
        TLS to `api.hypernative.xyz` uses the JVM default trust store with
        certificate verification enabled (Ktor CIO defaults). TLS verification
        cannot be disabled by configuration.

    - ID: SECRET_PROVISIONING
      description: |
        `GATEWAY_ATTESTATION_SIGNER_KEYPAIR` and Hypernative credentials are
        provisioned by the deployment platform's secret manager and exposed to
        the process as environment variables. At-rest custody, rotation
        procedure, and access control of those secrets are properties of the
        deployment platform and are addressed by the parent model's SignOps /
        Infrastructure scopes.

    # - ID: VAULT_REQUEST_ID_UNIQUENESS
    #   description: |
    #     The on-chain vault program enforces uniqueness of `request_id` for the
    #     operational TTL window of an attestation, so that a leaked attestation
    #     cannot be replayed against the vault state machine within its 300 s
    #     validity. Verified in the vault program threat model
    #     (`AsyncInvestmentFlows`, `AsyncRedemptionFlows`).

  attackers:
    - REFID: EXTERNAL_ATTACKER
    - REFID: MALICIOUS_USER

analysis: |
  The Investor Gateway is the **off-chain compliance choke-point** for the
  protocol. It is itself the principal countermeasure for the parent-level risk
  of *"a fraudulent or out-of-compliance investment / redemption transaction is
  accepted by the vault"*: the vault program will only accept investments and
  redemptions accompanied by an Ed25519 attestation signed by the
  `compliance_authority`, and the gateway is the sole legitimate producer of
  such attestations.

  Because the gateway crosses three trust boundaries (investor browser → gateway,
  gateway → Hypernative, gateway → on-chain via the user's wallet), its own
  attack surface is the focus of this model. Threats below cover:

  - The gateway being abused as an **open attestation oracle** (no inbound auth
    on the service itself).
  - **Compromise of the signer keypair** (held only in process memory, sourced
    from an env var).
  - **Tampering of the screening verdict** (network position between gateway and
    Hypernative, or an attacker-controlled `HYPERNATIVE_BASE_URL`).
  - **Replay** of a valid attestation within its TTL.
  - **Information disclosure** via the verbose error-echo path that mirrors
    Hypernative request/response bodies back to the caller.
  - **Permissive CORS** (`anyHost()`) exposing the local screening UI tool to
    cross-origin browser callers.
  - **Legacy HTTP forwarder** (`/api/investment`, `/api/redemption`) acting as
    an internal-network probe via a misconfigured `VAULT_BASE_URL`.
  - **Fail-closed denial of service** of the compliance flow when Hypernative
    is unreachable, and the corresponding need for a controlled
    business-continuity override path.
  - **Repudiation / lack of compliance evidence** — the gateway today does
    not durably persist the Hypernative response that justified each issued
    attestation, so after-the-fact compliance audits cannot reconstruct
    *why* a given attestation was signed.
  - **Transaction-to-attestation binding malleability** — an attacker tries
    to reuse a valid signature with a transaction whose parameters differ
    from what was signed, defeated by the canonical message format plus
    on-chain reconstruction.

  **Out of scope (handled elsewhere):**

  - At-rest custody and rotation of `GATEWAY_ATTESTATION_SIGNER_KEYPAIR` —
    deployment platform / SignOps.
  - Authentication and rate limiting of inbound HTTP traffic — upstream API
    gateway / WAF.
  - Bugs in Hypernative itself, in the JVM Ed25519 implementation, in Ktor, or
    in the investor's wallet extension.

threats:
  - ID: ATTESTATION_BINDING_MALLEABILITY
    title: Attestation reused against a transaction with different parameters
    attack: |
      An attacker holds a valid attestation signature issued by the gateway
      for one tuple of `(programId, vault, investor, action, amount,
      requestId, expiresAt, nonce)` and attempts to submit an on-chain
      transaction whose parameters differ from what was actually signed.

      Concrete variants:

      - **Amount inflation:** keep the signature, raise `amount` in the vault
        instruction.
      - **Action swap:** present an investment attestation alongside a
        redemption instruction (or vice-versa) by flipping the action byte
        in the on-chain instruction.
      - **Investor swap:** redirect the operation to a different
        `investor` pubkey from the one in the signed message.
      - **Vault / programId swap:** present the attestation against a
        different vault or program where the same `compliance_authority`
        is configured.
      - **Field reordering / re-encoding:** submit the signed payload with
        equivalent-but-different byte layout (varint vs fixed, big-endian
        vs little-endian, alternative domain string) hoping a parser
        mismatch lets a non-canonical encoding verify.

      This is the classic *binding malleability* question for any signed
      authorization: can the signature be reused against a transaction it
      was not intended to authorise? It is **not** the same as raw Ed25519
      signature malleability (mutating the `S` component to produce a
      second valid signature for the same message): the on-chain
      verification binds parameters via the *message*, so a malleated
      signature still authenticates the same canonical message.

    threatType: Tampering, Spoofing, Elevation of Privilege
    impactDesc: |
      If accepted, the attacker turns a compliant approval for one set of
      parameters into a fraudulent or out-of-compliance transaction with
      different parameters. This would directly defeat the gateway's
      reason for existing.

      Possible outcomes if any binding gap existed:

      - amount uplift on settlement (compliance approved $X, executed for $Y),
      - action confusion (investment attestation drives a redemption flow,
        or vice-versa),
      - cross-investor or cross-vault reuse of a single approval,
      - silent acceptance of equivalent-but-non-canonical encodings.

      In the current design these are blocked by construction (canonical
      message + on-chain reconstruction); this threat is included
      explicitly so any future change to the message format or
      verification path is reviewed against this attack class.

    impactedSecObj:
      - REFID: COMPLIANCE
      - REFID: SIGNING_TRANSACTION_INTEGRITY
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: MALICIOUS_USER
    assets:
      - REFID: IG_ATTESTATION
      - REFID: IG_SERVICE
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:N/I:H/A:N'
    pentestTestable: true
    fullyMitigated: true
    countermeasures:
      - ID: CANONICAL_DOMAIN_TAGGED_MESSAGE
        title: Canonical, fixed-layout, domain-tagged signed message
        description: |
          The signed message uses a single fixed byte layout prefixed by the
          domain string `CORDA_COMPLIANCE_ATTESTATION_V1` (31 B), followed
          by `program_id` (32 B), `vault` (32 B), `investor` (32 B),
          `action` (1 B), `amount` (u64 LE), `request_id` (u64 LE),
          `expires_at` (i64 LE), and `nonce` (32 B). All integer fields
          are fixed-width little-endian — no varints, no alternative
          encodings. The Kotlin signer (`ComplianceAttestationSigner`) and
          the Rust verifier (`programs/vault/src/attestation.rs`) build the
          exact same byte sequence; any divergence rejects the transaction
          on-chain.

          Effect: there is exactly one byte string per logical
          authorization, removing re-encoding / field-reordering as an
          attack vector and making the action byte semantically distinct
          (`0` for investment, `1` for redemption) so an investment
          attestation cannot be presented for a redemption flow.
        inPlace: true
        public: true

      - ID: ON_CHAIN_MESSAGE_RECONSTRUCTION
        title: On-chain reconstruction of the expected message before verification
        description: |
          The vault program rebuilds the expected attestation message from
          the actual instruction inputs (`programId`, the vault account,
          the investor account, the chosen flow's action byte, the
          `amount` and `request_id` arguments, the supplied `expiresAt`
          and `nonce`) and then loads the Ed25519 verification instruction
          from the instructions sysvar. It requires:

          - the verified message in the sigverify instruction to be
            byte-equal to the reconstructed expected message,
          - the verifying public key to equal `vault.compliance_authority`,
          - `expiresAt >= now`.

          Effect: any divergence between the signed parameters and the
          parameters used by the vault instruction (amount, action,
          investor, vault, programId) causes verification to fail. A
          signature is only useful for the exact transaction it was
          issued for.
        inPlace: true
        public: true

      - ID: SIGVERIFY_INSTRUCTION_LINKAGE
        title: Verify the Ed25519 sigverify instruction is present and bound
        description: |
          The vault instruction loads the Ed25519 sigverify instruction via
          the instructions sysvar and verifies that the message offset and
          length cover the reconstructed expected message. This prevents
          an attacker from supplying a sigverify instruction that signs an
          unrelated payload while the vault instruction processes
          different parameters.
        inPlace: true
        public: true

  - ID: OPEN_ATTESTATION_ORACLE_ABUSE
    title: Gateway abused as an open compliance attestation oracle
    attack: |
      The gateway exposes `/api/attestation/investment` and
      `/api/attestation/redemption` without any inbound authentication. The
      design intent is that an upstream API gateway / WAF authenticates and
      rate-limits callers before traffic reaches the service.

      An attacker reaches the gateway directly because:

      - The upstream auth/WAF layer is misconfigured, missing, or bypassed
        (e.g., direct pod-to-pod access on the cluster network, exposed
        management port, leaked internal hostname).
      - A legitimate investor wallet — not under the attacker's control — has
        previously been screened as `Approve`'d by Hypernative. The attacker
        submits attestation requests for that investor address and any
        `(programId, vault, action, amount, requestId)` tuple they choose.

      The gateway will return a fully valid Ed25519-signed attestation for any
      `Approve`'d address, because it has no notion of caller identity and no
      binding between the requester and the `investor` field in the signed
      payload.

    threatType: Spoofing, Elevation of Privilege
    impactDesc: |
      The attacker obtains a valid on-chain compliance attestation for an
      investor they do not control, for parameters they choose. They cannot
      directly sign and submit the investor's vault transaction (the investor's
      wallet still has to authorise the Solana transaction), but the
      attestation:

      - removes the compliance gate as a barrier for any investor wallet that
        is also under attacker influence (e.g., another wallet they hold that
        happens to be `Approve`'d), letting them submit fraudulent or
        out-of-compliance transactions at will;

      - constitutes a usable on-chain credential the attacker can reuse for the
        full TTL window (default 300 s) for the chosen `request_id`.

      Combined with any attacker-controlled `Approve`'d wallet this collapses
      the parent compliance objective.

    impactedSecObj:
      - REFID: COMPLIANCE
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: MALICIOUS_USER
    assets:
      - REFID: IG_SERVICE
      - REFID: DF_CLIENT_TO_GATEWAY
      - REFID: IG_ATTESTATION
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:N/I:H/A:N'
    pentestTestable: true
    fullyMitigated: false
    countermeasures:
      - ID: UPSTREAM_INBOUND_AUTH
        title: Authenticate and rate-limit all inbound traffic at the edge
        description: |
          The deployment fronting the gateway (API gateway / WAF / mTLS-enforcing
          load balancer) must authenticate every inbound caller and apply
          per-caller rate limits before any request reaches `IG_SERVICE`. The
          gateway is not network-reachable except through that edge.
        inPlace: false
        public: true
        operational: true
        operator: Platform / Infrastructure Team

      - ID: GATEWAY_NETWORK_ISOLATION
        title: Restrict gateway listener to the upstream auth layer
        description: |
          Bind the gateway only on the internal interface that terminates
          traffic from the upstream auth layer (network policy / security group /
          mesh policy). Reject traffic from any other source.
        inPlace: false
        public: false
        operational: true
        operator: Platform / Infrastructure Team

      - ID: BIND_REQUESTER_TO_INVESTOR
        title: Require the authenticated caller to match the attested investor
        description: |
          Once inbound authentication is in place, enforce at the gateway that
          the authenticated caller identity is bound to the `investor` field in
          the signed attestation request. Reject mismatches with 403 before
          calling Hypernative or the signer.

          **Primary implementation — Sign-In With Solana (SIWS) + wallet-bound JWT:**

          - At login, the user signs a SIWS challenge with their Solana wallet.
            The gateway verifies the signature against the claimed pubkey and
            issues a short-lived JWT whose `sub` (or equivalent claim) is the
            investor pubkey.
          - On every attestation request, the gateway verifies the JWT and
            requires `jwt.sub == request.investor`. Mismatch → 403 before
            Hypernative is contacted and before the signer is invoked.
          - JWT lifetime is short (minutes, not hours) and the JWT is scoped
            to the investor pubkey only — it does not carry vault / amount /
            action authority on its own.

          With this in place, the per-request wallet signature in
          `WALLET_PROOF_OF_POSSESSION` is **not required**: possession of the
          investor key was already proven at login, and the JWT carries that
          binding for the session. PoP remains documented as a stronger
          defence-in-depth option for higher-risk deployments where JWT
          theft is in scope.
        inPlace: false
        public: true
        operational: false

      - ID: WALLET_PROOF_OF_POSSESSION
        title: Require wallet proof-of-possession for the attested investor (defence in depth)
        description: |
          **Not in place — defence-in-depth alternative to the SIWS+JWT
          binding in `BIND_REQUESTER_TO_INVESTOR`.** Documented for cases
          where session-token theft is part of the threat model.

          Before issuing an attestation, require the caller to prove control of
          the wallet whose pubkey appears in the `investor` field of the
          attestation request:

          - The gateway issues a short-lived, single-use challenge bound to
            `(investor, programId, vault, action, amount, requestId,
            issuedAt)`.
          - The caller signs the challenge with the investor wallet
            (Ed25519 via the wallet adapter — same key the on-chain
            transaction will be signed with).
          - The gateway verifies the signature against the `investor`
            pubkey before calling Hypernative or the signer.
          - Challenge is consumed on use and expires within seconds.

          Trade-off: adds a per-request wallet popup, which is UX-hostile when
          a SIWS+JWT login flow is already in place. For the standard
          investor UI flow, prefer `BIND_REQUESTER_TO_INVESTOR` and treat
          this control as not in place.
        inPlace: false
        public: true
        operational: false

  - ID: SIGNER_KEYPAIR_COMPROMISE
    title: Compromise of the Ed25519 attestation signer keypair
    attack: |
      The signer keypair is loaded at boot from the
      `GATEWAY_ATTESTATION_SIGNER_KEYPAIR` env var and held in process memory
      for the lifetime of the process. An attacker obtains it via:

      - read access to the deployment's secret manager / env var configuration
        (CI/CD compromise, cluster compromise, misconfigured RBAC),
      - process memory disclosure on the gateway host (debug endpoint, heap
        dump artefact, container escape),
      - exfiltration during deployment (logs that accidentally include env, a
        compromised base image, a compromised build pipeline).

      With the private key the attacker can produce arbitrary valid
      `CORDA_COMPLIANCE_ATTESTATION_V1` messages for any `(vault, investor,
      action, amount, requestId)` of their choosing, entirely off-platform —
      no interaction with the gateway or with Hypernative is required.

    threatType: Spoofing, Tampering, Elevation of Privilege
    impactDesc: |
      The attacker can mint valid compliance attestations indefinitely, for any
      investor address, including sanctioned or non-KYC'd wallets, for any
      amount, for any vault. This fully bypasses the off-chain compliance gate.

      Detection is hard: forged attestations are cryptographically
      indistinguishable from gateway-issued ones. The only mitigation that
      removes outstanding forged attestations is **rotation of
      `vault.compliance_authority` on-chain**, which itself requires the parent
      governance flow.

    impactedSecObj:
      - REFID: COMPLIANCE
      - REFID: CONFIDENTIALITY
    attackers:
      - REFID: EXTERNAL_ATTACKER
    assets:
      - REFID: IG_SIGNER_KEYPAIR
      - REFID: IG_SERVICE
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:H/UI:N/S:C/C:H/I:H/A:N'
    pentestTestable: false
    fullyMitigated: false
    countermeasures:
      - ID: KEYPAIR_SECRET_MANAGER
        title: Provision keypair from a managed secret store with audited access
        description: |
          Store `GATEWAY_ATTESTATION_SIGNER_KEYPAIR` in a managed secret store
          (cloud KMS-backed secret, Vault, or equivalent) with:

          - least-privilege IAM (only the gateway workload identity can read it),
          - audit logging of every secret read,
          - encryption at rest and in transit,
          - separation from CI/CD admin roles.
        inPlace: false
        public: false
        operational: true
        operator: Platform / SignOps Team

      - ID: BOOT_TIME_KEY_CONSISTENCY_CHECK
        title: Verify keypair self-consistency at boot
        description: |
          On startup the gateway signs a fixed challenge with the loaded private
          key and verifies it against the embedded public key
          (`keypairIsConsistent()` in `ComplianceAttestationSigner`). Mismatch
          fails startup, preventing the service from running with a corrupted
          or malformed keypair.
        inPlace: true
        public: true
        operational: false

      - ID: COMPLIANCE_AUTHORITY_ROTATION
        title: Documented rotation procedure for the compliance authority
        description: |
          Operate a runbook to rotate `GATEWAY_ATTESTATION_SIGNER_KEYPAIR` and,
          atomically, the on-chain `vault.compliance_authority`. The runbook
          must cover the suspected-compromise path (immediate rotation, with
          minimal grace overlap) and the routine-rotation path. Rotation is the
          only mechanism that invalidates already-leaked attestations once the
          TTL would otherwise allow them.
        inPlace: false
        public: true
        operational: true
        operator: SignOps / Vault Admin Team

      - ID: NO_KEY_LOGGING
        title: Never log key material or env contents
        description: |
          Logging is restricted to non-secret config (echoed only via
          `/healthz`). The signer never logs the private key, the env var
          contents, or the consistency-check challenge bytes.
        inPlace: true
        public: true

  - ID: SCREENING_VERDICT_TAMPERING
    title: Tampering with the Hypernative screening verdict
    attack: |
      The gateway's screening decision rule is `recommendation == "Approve"
      ⇒ allowed`. An attacker subverts the verdict by manipulating the
      `gateway → Hypernative` channel:

      - controlling DNS resolution of `api.hypernative.xyz` from the gateway
        host (DNS hijack, malicious resolver, in-cluster CoreDNS poisoning);
      - injecting an attacker-issued certificate trusted by the gateway's JVM
        trust store (private CA pushed to the host, base-image tampering);
      - changing `HYPERNATIVE_BASE_URL` configuration to point at an
        attacker-controlled endpoint (env-var tampering on the host or in the
        deployment manifest);
      - performing an active MITM on a misconfigured TLS deployment.

      A forged `200 OK` with `recommendation: "Approve"` causes the gateway to
      proceed to sign an attestation for an address that has not, in fact, been
      screened.

    threatType: Tampering, Spoofing
    impactDesc: |
      The compliance gate effectively passes any address the attacker chooses.
      Combined with control of an investor wallet this enables fraudulent or
      out-of-compliance investment / redemption transactions to be settled
      on-chain.

    impactedSecObj:
      - REFID: COMPLIANCE
    attackers:
      - REFID: EXTERNAL_ATTACKER
    assets:
      - REFID: DF_GATEWAY_TO_HYPERNATIVE
      - REFID: IG_SERVICE
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:H/UI:N/S:C/C:N/I:H/A:N'
    pentestTestable: true
    fullyMitigated: false
    countermeasures:
      - ID: ENFORCE_OUTBOUND_TLS_VERIFICATION
        title: Enforce outbound TLS verification with no override
        description: |
          The Ktor CIO HTTP client uses default TLS verification. Ensure no
          configuration path (env var, system property, code branch) can disable
          certificate validation or trust an arbitrary CA bundle at runtime.
          Add a startup assertion that the active SSLContext uses the platform
          default trust store.
        inPlace: false
        public: true
        operational: false

      - ID: PIN_HYPERNATIVE_BASE_URL
        title: Protect and validate the Hypernative base URL setting
        description: |
          Treat `HYPERNATIVE_BASE_URL` as trusted deployment configuration.
          It must not be modifiable by untrusted runtime inputs, and the
          gateway must validate at startup that it points only to an approved
          Hypernative endpoint over HTTPS.

          Changes to this setting require the same review and deployment
          controls as code changes.
        inPlace: false
        public: true
        operational: true
        operator: Platform / Infrastructure Team

      - ID: EGRESS_NETWORK_POLICY
        title: Restrict gateway egress to Hypernative only
        description: |
          Apply egress network policy / firewall rules so the gateway can only
          reach `api.hypernative.xyz` (and the legacy `VAULT_BASE_URL` if
          still enabled). Blocks attacker-controlled exfiltration / redirection
          targets even if `HYPERNATIVE_BASE_URL` is tampered with.
        inPlace: false
        public: false
        operational: true
        operator: Platform / Infrastructure Team

  - ID: ATTESTATION_REPLAY_WITHIN_TTL
    title: Replay of a valid attestation within its TTL window
    attack: |
      A valid attestation is bound to a specific `(programId, vault, investor,
      action, amount, requestId)` tuple plus a 32-byte nonce and an
      `expiresAt` (default `now + 300 s`). The on-chain vault program checks
      `expiresAt >= now` but does **not** track used nonces, and this model
      does not assume on-chain single-use enforcement for `request_id`.
      A captured attestation may therefore be replayable until expiry.

      An attacker who observes a valid attestation (in browser memory, in
      browser-side telemetry, in a malicious browser extension, in a
      compromised CDN-injected script, or via another cross-origin path
      reachable through the permissive CORS policy — see
      `PERMISSIVE_CORS_EXPOSURE`) attempts to:

      - resubmit the exact attestation one or more times before `expiresAt`;
      - race the investor's own submission with the same attestation;
      - replay the attestation after a previous successful use if the vault
        state machine does not reject the reused tuple.

    threatType: Tampering, Repudiation
    impactDesc: |
      An attestation captured from a legitimate flow is used to drive a
      transaction the original investor did not intend, within the 300 s
      window. Without on-chain single-use enforcement for `request_id`, the
      same captured attestation may be reusable multiple times until expiry,
      enabling repeated in-compliance transactions at the investor's expense.

    impactedSecObj:
      - REFID: COMPLIANCE
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: MALICIOUS_USER
    assets:
      - REFID: IG_ATTESTATION
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:N/I:L/A:N'
    pentestTestable: true
    fullyMitigated: false
    countermeasures:
      - ID: SHORT_ATTESTATION_TTL
        title: Short attestation TTL bound into the signed message
        description: |
          The signed message includes `expiresAt` (default 300 s). The on-chain
          program rejects expired attestations. Bounds the replay window.
        inPlace: true
        public: true

      - ID: REQUEST_ID_BINDING
        title: Bind attestation to the `request_id` field
        description: |
          `request_id` is included in the canonical signed message. The vault
          verifier therefore checks that the attestation is bound to a
          specific `request_id` value and rejects messages whose signed
          `request_id` does not match the instruction inputs.

          This binds the attestation to the intended request parameters, but
          without separate on-chain single-use enforcement it does not by
          itself prevent replay.
        inPlace: false
        public: true

      - ID: NONCE_ENTROPY
        title: Per-attestation 32-byte CSPRNG nonce
        description: |
          The signed message includes a fresh 32-byte CSPRNG nonce, so two
          attestations for the same logical request are always distinct
          messages. This does not by itself prevent replay (the on-chain
          program does not track nonces) but prevents accidental
          message-collision and supports future nonce-tracking on-chain if
          desired.
        inPlace: true
        public: true

  - ID: ATTESTATION_TOCTOU_FAILURE
    title: TOCTOU - Compliance attestation goes not-compliant before execution
    attack: |
      The gateway screens the investor address and issues a valid attestation
      for a specific investment record, but the compliance facts relied on at
      screening time can change before the vault transaction executes. A
      malicious user can exploit this time-of-check/time-of-use gap by:

      - obtaining a green attestation while the investor address screens
        `Approve`;
      - funding the deposit path with non-compliant or stolen USDC after the
        attestation is issued but before `expiresAt`;
      - submitting the investment transaction within the attestation TTL so
        the vault accepts it based on stale off-chain screening.

      The signed attestation binds `(programId, vault, investor, action,
      amount, requestId, expiresAt, nonce)`, but it does not prove that the
      source of funds remains compliant throughout the TTL window.
    threatType: Tampering, Elevation of Privilege
    impactDesc: |
      The vault accepts an investment that was compliant only at screening
      time, not at execution time. A depositor can therefore move
      non-compliant or stolen funds into the protocol after receiving a green
      attestation, defeating the intended compliance gate.

      Consequences include:

      - onboarding tainted funds despite a valid attestation,
      - false confidence that wallet screening covers source-of-funds risk,
      - regulatory or forensic failure after the fact because the attestation
        proves only a past screening result.
    impactedSecObj:
      - REFID: COMPLIANCE
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: MALICIOUS_USER
    assets:
      - REFID: IG_ATTESTATION
      - REFID: IG_SERVICE
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:N'
    pentestTestable: true
    fullyMitigated: false
    countermeasures:
      - ID: REDUCE_ATTESTATION_STALENESS_WINDOW
        title: Keep the attestation TTL short
        description: |
          The current attestation TTL limits how long a screening result can
          be reused after issuance. This reduces, but does not eliminate, the
          window in which compliance facts can change before execution.
        inPlace: true
        public: true

      - ID: RECHECK_COMPLIANCE_AT_EXECUTION
        title: Re-check compliance immediately before execution
        description: |
          Re-screen the investor address at the point where the investment is
          actually submitted or settled, rather than relying solely on a prior
          attestation issued up to 300 seconds earlier.

          **Solana constraint:** on-chain programs cannot make HTTP calls to
          off-chain screening services. A re-check would require either an
          oracle/callback pattern (the gateway submits the investment only
          after a second screening) or a two-phase commit where the vault
          escrows funds pending a follow-up compliance instruction. Neither
          pattern exists in the current architecture.
        inPlace: false
        public: true
        operational: false

      # - ID: SOURCE_OF_FUNDS_COMPLIANCE_CONTROL
      #   title: Add source-of-funds controls beyond wallet reputation screening
      #   description: |
      #     Treat wallet reputation screening and source-of-funds validation as
      #     separate controls. Add an explicit control that can detect or hold
      #     deposits whose funding becomes non-compliant after screening but
      #     before execution.

      #     **Solana constraint:** Solana programs have no access to an
      #     account's transaction history or "last transaction hash". There is
      #     no native way for the vault to assert that the token account balance
      #     has not changed since screening. A balance-snapshot approach (bind
      #     the attested balance into the signed message and reject if the
      #     on-chain balance differs at execution) is theoretically possible but
      #     would reject legitimate top-ups and does not cover the case where
      #     funds arrive and leave within the TTL window.
      #   inPlace: false
      #   public: true
      #   operational: true
      #   operator: Compliance / Operations Team

      - ID: REDEMPTION_TIME_RESCREEN
        title: Re-screen investor wallet before issuing redemption attestation
        description: |
          When an investor requests a redemption, the gateway re-screens the
          wallet address via the same Hypernative screening path before
          issuing a redemption attestation. If the wallet is now flagged, the
          gateway refuses the attestation and the on-chain redemption cannot
          proceed.

          This does not prevent tainted funds from entering the vault, but it
          ensures that a flagged investor cannot exit cleanly. The vault
          already requires a compliance attestation for redemptions, so the
          gateway is the natural enforcement point.
        inPlace: false
        public: true
        operational: false

      - ID: CONTINUOUS_WALLET_MONITORING
        title: Continuous off-chain monitoring with on-chain de-whitelist and freeze
        description: |
          A background process (e.g., Hypernative monitoring feed or periodic
          re-screening batch) continuously evaluates investor wallets after
          deposit. When a previously-cleared wallet becomes flagged, an
          operator calls `remove_from_vtoken_whitelist`, which atomically sets
          `whitelisted = false` and freezes the investor's vToken account via
          Token-ACL.

          While frozen, the investor cannot transfer or redeem vTokens. The
          admin can later thaw via `thaw_vtoken_account` if the wallet is
          cleared.

          This is a detect-and-respond control rather than a preventive one,
          but it limits the blast radius by locking tainted positions as soon
          as the monitoring feed detects the change.
        inPlace: false
        public: true
        operational: true
        operator: Compliance / Operations Team

      - ID: PRE_ATTESTATION_BALANCE_CHECK
        title: Verify investor holds sufficient USDC before issuing attestation
        description: |
          Before signing the attestation, the gateway queries the investor's
          Associated Token Account (ATA) balance via a Solana RPC
          `getTokenAccountBalance` call and rejects the request if
          `balance < amountAtomic`.

          This ensures the screened funds are already present at the moment
          Hypernative returns `Approve`. An attacker can no longer obtain a
          green attestation with an empty wallet and fund it afterwards with
          tainted USDC.

          **Residual gap:** the check proves the wallet held ≥ amount of USDC
          at screening time, not that those specific tokens are clean (USDC is
          fungible). An attacker who already holds clean USDC could
          theoretically swap it out for dirty USDC within the TTL window. This
          is a significantly harder attack than the baseline (requires parking
          clean funds) and is further bounded by REDUCE_ATTESTATION_STALENESS_WINDOW
          and CONTINUOUS_WALLET_MONITORING.

          **Implementation note:** the gateway already uses Ktor HTTP client;
          a single JSON-RPC POST to any Solana RPC endpoint is sufficient — no
          Solana SDK dependency required.
        inPlace: false
        public: true
        operational: false

      - ID: ESCROW_DEPOSIT_PENDING_COMPLIANCE
        title: Escrow deposited funds until a second compliance check clears
        description: |
          Introduce a two-phase deposit: the vault accepts the USDC into an
          escrow account (not yet minting vTokens), then a follow-up
          compliance instruction — submitted by the gateway after a second
          screening — finalises the mint. If the second check fails, the
          escrow is unwound and USDC returned.

          This eliminates the TOCTOU gap entirely because funds are not
          committed until the second screening passes. However, it requires a
          new on-chain escrow instruction, changes to the vault state machine,
          and introduces UX latency. Not currently implemented.
        inPlace: false
        public: true
        operational: false

  - ID: VERBOSE_ERROR_PII_LEAK
    title: Sensitive Hypernative data echoed in error responses
    attack: |
      On Hypernative call failure (non-2xx, decode failure, empty `data`), the
      gateway returns 502 with an `ErrorResponse` that includes the upstream
      request body, response body, response headers, and upstream status.
      An unauthenticated remote caller — once they reach the gateway — can
      deliberately trigger error paths (malformed addresses, bogus policy
      hints, address fields that trip Hypernative validation) and observe the
      mirrored upstream payloads.

    threatType: Information Disclosure
    impactDesc: |
      Disclosure of:

      - Hypernative internal error messages and header semantics, easing
        further targeted attacks against the screening backend.
      - The screened wallet address(es) the gateway tried to submit, which
        may correlate other investors' addresses with the protocol.
      - In some Hypernative error shapes, configuration details (policy IDs,
        client IDs).

      Limited risk to the parent compliance objective directly, but a
      regulatory and PII concern (investor addresses are linkable identifiers).

    impactedSecObj:
      - REFID: CONFIDENTIALITY
    attackers:
      - REFID: EXTERNAL_ATTACKER
    assets:
      - REFID: IG_SERVICE
      - REFID: DF_GATEWAY_TO_HYPERNATIVE
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N'
    pentestTestable: true
    fullyMitigated: false
    countermeasures:
      - ID: GATE_VERBOSE_ERRORS_BEHIND_DEBUG_FLAG
        title: Gate verbose `hypernative*` error fields behind a debug toggle
        description: |
          Strip `hypernativeRequestBody`, `hypernativeResponseBody`, and
          `hypernativeResponseHeaders` from `ErrorResponse` in production
          builds / when a `GATEWAY_DEBUG_ERRORS` flag is not set. Keep them
          available locally for the operator screening UI.
        inPlace: false
        public: true
        operational: false

      - ID: STRUCTURED_ERROR_LOGGING
        title: Log full upstream error context server-side, not to clients
        description: |
          Continue to log Hypernative failures at ERROR with stack trace and
          upstream context for operations debugging, but return only a
          minimal, generic 502 body to remote callers.
        inPlace: false
        public: true
        operational: false

  - ID: PERMISSIVE_CORS_EXPOSURE
    title: Permissive CORS exposes attestation endpoints cross-origin
    attack: |
      The Ktor CORS configuration uses `anyHost()` and allows `Content-Type`
      and `x-investor-address` for `GET` and `POST`. This was intended for the
      local operator screening UI served by `GET /`. In production it allows
      any origin to invoke `/api/screening`, `/api/attestation/investment`,
      and `/api/attestation/redemption` from the victim's browser via a
      malicious page.

      Combined with `OPEN_ATTESTATION_ORACLE` (no inbound auth) the attacker's
      page can drive attestation issuance from the victim's network position
      (e.g., when the victim is inside the deployment perimeter and the
      gateway is reachable only from there).

    threatType: Spoofing, Elevation of Privilege
    impactDesc: |
      Cross-origin attestation requests succeed where they should be blocked,
      enabling drive-by exploitation of `OPEN_ATTESTATION_ORACLE` and
      drive-by exfiltration of error-response content (see
      `VERBOSE_ERROR_PII_LEAK`).

    impactedSecObj:
      - REFID: COMPLIANCE
    attackers:
      - REFID: EXTERNAL_ATTACKER
    assets:
      - REFID: IG_SERVICE
      - REFID: DF_CLIENT_TO_GATEWAY
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N'
    pentestTestable: true
    fullyMitigated: false
    countermeasures:
      - ID: RESTRICT_CORS_TO_UI_ORIGIN
        title: Allow only the investor UI origin(s) in production CORS
        description: |
          Replace `anyHost()` with an explicit allowlist of investor UI
          origins. Disable the local operator screening UI route (`GET /`) in
          production builds, or move it behind a separate listener bound to
          localhost only.
        inPlace: false
        public: true
        operational: false

  - ID: LEGACY_FORWARDER_INTERNAL_PROBE
    title: Legacy `/api/investment` and `/api/redemption` forwarder abused as an internal probe
    attack: |
      The legacy routes screen the address and then forward the raw inbound
      body to `${VAULT_BASE_URL}${VAULT_INVESTMENT_PATH | VAULT_REDEMPTION_PATH}`.
      No HTTP service in this repository consumes those forwards; the
      configuration exists as a hook for non-UI integrations.

      An attacker who can influence `VAULT_BASE_URL` (env tampering on the
      host, deployment-manifest tampering, supply-chain into the deployment
      pipeline) reroutes legacy traffic to an internal endpoint of their
      choosing. They can then use the legacy routes to:

      - probe internal HTTP services reachable from the gateway,
      - relay raw caller bodies (which may include investor wallet metadata)
        into an internal collector,
      - observe upstream status / body / content-type relayed back unchanged
        to the caller.

      Even without env tampering, leaving the legacy routes enabled in
      production widens the attack surface beyond what the UI flow needs.

    threatType: Information Disclosure, Tampering
    impactDesc: |
      Internal-network reconnaissance and selective relay of attacker-shaped
      payloads to internal services, exfiltration of upstream responses, and
      possible exposure of investor request payloads to unintended
      destinations.

    impactedSecObj:
      - REFID: CONFIDENTIALITY
      - REFID: COMPLIANCE
    attackers:
      - REFID: EXTERNAL_ATTACKER
    assets:
      - REFID: DF_GATEWAY_LEGACY_FORWARD
      - REFID: IG_SERVICE
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:H/UI:N/S:C/C:L/I:L/A:N'
    pentestTestable: true
    fullyMitigated: false
    countermeasures:
      - ID: DISABLE_LEGACY_FORWARDER
        title: Feature-gate or remove the legacy `/api/investment|redemption` routes
        description: |
          The standard investor UI flow uses `/api/attestation/*` only. Either
          remove the legacy routes from production builds, or feature-gate
          them behind an explicit `GATEWAY_ENABLE_LEGACY_FORWARDER` flag that
          is off by default.
        inPlace: false
        public: true
        operational: false

      - ID: ALLOWLIST_FORWARD_TARGET
        title: Allowlist `VAULT_BASE_URL` and validate at boot
        description: |
          When the legacy forwarder is enabled, validate `VAULT_BASE_URL` at
          startup against a deployment-time allowlist of permitted hosts.
          Refuse to start otherwise. Combined with `EGRESS_NETWORK_POLICY`,
          this prevents arbitrary internal redirection.
        inPlace: false
        public: true
        operational: true
        operator: Platform / Infrastructure Team

  - ID: HYPERNATIVE_OUTAGE_DOS
    title: Compliance flow denial of service when Hypernative is unreachable
    attack: |
      The gateway's decision rule is fail-closed: any non-2xx, decode failure,
      or empty `data` array from Hypernative causes a 502 to the caller and
      no attestation is issued. An attacker who can disrupt Hypernative
      availability — or the gateway's path to it — therefore halts all
      investment and redemption UI flows until reachability is restored:

      - DDoS of Hypernative (out of scope — external),
      - DDoS of the gateway's egress path (in scope — network reachability),
      - exhausting Hypernative quota / rate limits with junk addresses
        submitted via the open `/api/screening` endpoint.

    threatType: Denial of Service
    impactDesc: |
      Investors cannot complete the standard UI investment / redemption flow
      because no compliance attestation can be produced. The on-chain vault
      remains operational but is effectively unreachable through the standard
      flow until Hypernative connectivity is restored. Fail-closed is the
      desired posture for compliance, so this is an accepted-by-design
      availability cost; the threat is documented to make the trade-off
      explicit, and to motivate a controlled override path
      (`OPERATOR_COMPLIANCE_OVERRIDE`) for cases where business continuity
      requires issuing an attestation despite an unavailable or non-`Approve`
      Hypernative verdict.

    impactedSecObj:
      - REFID: AVAILABILITY
    attackers:
      - REFID: EXTERNAL_ATTACKER
    assets:
      - REFID: DF_GATEWAY_TO_HYPERNATIVE
      - REFID: IG_SERVICE
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H'
    pentestTestable: true
    fullyMitigated: false
    countermeasures:
      - ID: SCREENING_RATE_LIMIT
        title: Rate-limit `/api/screening` upstream to protect Hypernative quota
        description: |
          Apply per-caller rate limits at the upstream API gateway / WAF on
          the screening endpoints, so that quota exhaustion from junk
          addresses cannot deny service to legitimate investors. Depends on
          `UPSTREAM_INBOUND_AUTH`.
        inPlace: false
        public: true
        operational: true
        operator: Platform / Infrastructure Team

      - ID: HYPERNATIVE_REACHABILITY_MONITORING
        title: Alert on Hypernative reachability failures
        description: |
          Emit a metric / alert when Hypernative call failure rate exceeds a
          threshold, so that an outage of the compliance flow is detected
          and communicated rather than left to be discovered by users.
        inPlace: false
        public: true
        operational: true
        operator: Platform / SRE Team

      - ID: FAIL_CLOSED_BY_DESIGN
        title: Fail-closed posture documented and accepted
        description: |
          Any non-`Approve` outcome, including unreachable Hypernative,
          blocks attestation issuance. This is the intended posture for the
          compliance objective and is documented in `ig_doc.md` §13.6.
        inPlace: true
        public: true

      - ID: OPERATOR_COMPLIANCE_OVERRIDE
        title: Controlled operator override for the fail-closed posture
        description: |
          Provide an explicit, audited override path that allows a designated
          operator role to authorise issuance of a compliance attestation
          when Hypernative is unreachable, returns a transient error, or
          returns a non-`Approve` recommendation that is judged a false
          positive against documented business rules.

          **Required properties of the override:**

          - **Out of band from the investor UI flow** — the override is not
            reachable from `/api/attestation/*`. It is a separate operator
            endpoint or admin tool, gated by its own authentication.
          - **Dual control** — at least two operator identities (e.g.,
            Compliance Officer + Vault Manager) must co-authorise each
            override. A single operator credential is never sufficient.
          - **Per-request justification** — every override carries a free-text
            reason and a reference to the supporting evidence (ticket,
            manual KYC packet, Hypernative incident ID).
          - **Bound to the same canonical message** — the issued attestation
            uses the standard `CORDA_COMPLIANCE_ATTESTATION_V1` layout; the
            override only changes *whether* it is issued, not *what* is
            signed. The on-chain protocol cannot distinguish an override
            attestation from a normal one — that distinction lives in the
            off-chain audit trail.
          - **Marked as override in the audit log** — see
            `COMPLIANCE_EVIDENCE_RECORD`. Override attestations are tagged
            with the operator identities, justification, and screening
            verdict (or unavailability reason) that prompted them.
          - **Rate-limited and alerted** — every override fires a high-
            priority alert to security operations. Sustained or unusual
            override volume must be detectable.

          **Threat-model interaction:** the override is itself a path to
          issue an attestation without a fresh `Approve` verdict, so it is
          covered by `OPEN_ATTESTATION_ORACLE_ABUSE` if access controls on
          the override endpoint are weak. The dual-control + audit
          properties above are what bound the residual risk.
        inPlace: false
        public: true
        operational: true
        operator: Compliance Officer + Vault Manager

  - ID: COMPLIANCE_DECISION_REPUDIATION
    title: No durable evidence linking compliance attestations to screening verdicts
    attack: |
      The gateway calls Hypernative, applies the `recommendation == "Approve"`
      rule, and signs an attestation. Today it does **not** persist the
      Hypernative request/response evidence in a durable, tamper-evident
      store linked to the issued attestation. The only artefacts that
      survive are:

      - the on-chain attestation itself (signature + canonical message),
        which proves the gateway approved the transaction but **not** why,
      - INFO-level log lines for blocked requests (`logBlockedRequest`),
        which are emitted to stdout / the deployment log pipeline and are
        not, by themselves, evidence-grade (no integrity protection, no
        retention guarantee, no link to a specific issued attestation),
      - on Hypernative call failure: the verbose error response echoed to
        the caller (which is itself a separate problem — see
        `VERBOSE_ERROR_PII_LEAK`).

      Failure modes this enables:

      - **Repudiation by the protocol operator.** After an incident, the
        operator cannot prove to a regulator or auditor that a given
        attestation was issued in response to a genuine `Approve` verdict
        from Hypernative. "It must have been `Approve` because we issued
        it" is circular.
      - **Repudiation by Hypernative.** If Hypernative later contests that
        a particular wallet was ever screened as `Approve`, there is no
        signed/timestamped record on the gateway side to refute that.
      - **Concealed override.** If `OPERATOR_COMPLIANCE_OVERRIDE` is added
        without an evidence record, an override looks identical to a normal
        attestation in any after-the-fact review.
      - **Insider tampering.** A malicious operator with access to logs can
        delete or alter INFO-level entries for blocked requests, hiding
        screening failures that should have been investigated.
    threatType: Repudiation
    impactDesc: |
      The protocol cannot demonstrate compliance after the fact:

      - Regulator / auditor questions about *any* historical investment or
        redemption ("prove this wallet was screened on this date with this
        result") cannot be answered from the gateway side; reliance on
        Hypernative's own retention is the only fallback.
      - Disputes between the protocol operator, Hypernative, and an
        investor cannot be adjudicated from gateway-side evidence.
      - Any operator override (see `OPERATOR_COMPLIANCE_OVERRIDE`) becomes
        invisible in retrospect, defeating its dual-control purpose.
      - Detection of `SIGNER_KEYPAIR_COMPROMISE` is harder — without an
        evidence record per attestation, forged attestations cannot be
        distinguished from legitimate ones by examining gateway logs.

      No direct on-chain financial loss, but a serious gap in regulatory
      defensibility and incident-response capability.
    impactedSecObj:
      - REFID: AUDITABILITY
      - REFID: COMPLIANCE
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: MALICIOUS_USER
    assets:
      - REFID: IG_SERVICE
      - REFID: IG_ATTESTATION
      - REFID: DF_GATEWAY_TO_HYPERNATIVE
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:N'
    pentestTestable: false
    fullyMitigated: false
    countermeasures:
      - ID: COMPLIANCE_EVIDENCE_RECORD
        title: Persist per-attestation Hypernative evidence in an append-only store
        description: |
          For every issued attestation (and every blocked decision), persist
          a structured evidence record to a durable, append-only,
          tamper-evident store (managed log service with object-lock /
          WORM, or equivalent). Each record contains:

          - the canonical attestation message and its signature (so the
            record can be matched to the on-chain transaction by
            `request_id` / `nonce`),
          - the exact Hypernative request body submitted,
          - the exact Hypernative response body, status, and selected
            response headers,
          - a high-resolution server timestamp,
          - the upstream caller identity (once `BIND_REQUESTER_TO_INVESTOR`
            is in place — JWT subject and any session metadata),
          - the gateway build / version identifier,
          - if applicable, the `OPERATOR_COMPLIANCE_OVERRIDE` metadata
            (operator identities, justification, ticket reference).

          Records are written before the attestation is returned to the
          caller (write-then-respond), so a successful response implies a
          persisted evidence record.
        inPlace: false
        public: true
        operational: true
        operator: Platform / Compliance Engineering

      - ID: EVIDENCE_INTEGRITY
        title: Cryptographically chain or sign evidence records
        description: |
          Apply tamper-evidence to the evidence store: either a hash chain
          across records (latest-record hash anchored periodically — e.g.,
          on-chain memo, transparency log, or signed ops timestamp) or
          per-record signing by an operations key distinct from
          `IG_SIGNER_KEYPAIR`. Goal: an insider with write access to the
          log pipeline cannot silently delete or modify historical
          decisions.
        inPlace: false
        public: true
        operational: true
        operator: Platform / Compliance Engineering

      - ID: EVIDENCE_RETENTION_POLICY
        title: Define and enforce a regulatory-aligned retention policy
        description: |
          Document the retention period required for compliance evidence
          (aligned with the protocol's regulatory obligations — typically
          5–7 years), enforce it via the storage backend's lifecycle
          policy, and document the legal-hold and destruction processes.
          Out-of-band from the gateway runtime; lives with Compliance.
        inPlace: false
        public: true
        operational: true
        operator: Compliance / Legal

      - ID: BLOCKED_DECISION_LOGGING_PARITY
        title: Persist blocked decisions with the same evidence shape as approved ones
        description: |
