ID: Corda2SolanaBridging
schemaVersion: 2
title: Corda to Solana Bridging
version: 1.0
parent: CordaSolanaToolkit

scope:
  description: |
    This threat model covers the *bridge protocol* for moving tokenized RWAs from a private Corda network
    to the public Solana blockchain using the **corda-solana-toolkit**.

    **Bridging Architecture (Corda to Solana):**

    The bridging process follows a three-phase protocol:

    1. **Lock Phase**: Tokens are moved from the Token Holder to the Bridge Authority's confidential
       Locking Identity. A `BridgedFungibleTokenProxy` state is created containing Solana mint metadata.
       State: [BridgedFungibleTokenProxy](https://github.com/corda/corda-solana-toolkit/blob/main/bridging-token-contracts/src/main/kotlin/com/r3/corda/lib/solana/bridging/token/states/BridgedFungibleTokenProxy.kt)
       Contract: [FungibleTokenBridgeContract.LockToken](https://github.com/corda/corda-solana-toolkit/blob/main/bridging-token-contracts/src/main/kotlin/com/r3/corda/lib/solana/bridging/token/contracts/FungibleTokenBridgeContract.kt)

    2. **Notary Change Phase**: The proxy state's notary is changed from the General Notary to the
       Solana Notary using Corda's `NotaryChangeFlow`.

    3. **Mint Phase**: The Solana Notary executes a `Token2022.mintTo` instruction atomically with
       Corda transaction finalization. The proxy is consumed (no outputs).
       Contract: [FungibleTokenBridgeContract.MintToSolana](https://github.com/corda/corda-solana-toolkit/blob/main/bridging-token-contracts/src/main/kotlin/com/r3/corda/lib/solana/bridging/token/contracts/FungibleTokenBridgeContract.kt)

    **Redemption Architecture (Solana to Corda):**

    1. **Burn on Solana**: Bridge Authority creates a `Token2022.burn` instruction and issues a
       [FungibleTokenBurnReceipt](https://github.com/corda/corda-solana-toolkit/blob/main/bridging-token-contracts/src/main/kotlin/com/r3/corda/lib/solana/bridging/token/states/FungibleTokenBurnReceipt.kt) as proof.
       Contract: [FungibleTokenRedemptionContract.BurnOnSolana](https://github.com/corda/corda-solana-toolkit/blob/main/bridging-token-contracts/src/main/kotlin/com/r3/corda/lib/solana/bridging/token/contracts/FungibleTokenRedemptionContract.kt)

    2. **Notary Change**: The burn receipt's notary is changed from Solana Notary to General Notary.

    3. **Unlock Tokens**: The receipt is consumed along with locked tokens, releasing them to the
       redemption holder.
       Contract: [FungibleTokenRedemptionContract.UnlockToken](https://github.com/corda/corda-solana-toolkit/blob/main/bridging-token-contracts/src/main/kotlin/com/r3/corda/lib/solana/bridging/token/contracts/FungibleTokenRedemptionContract.kt)

    **Key Design Decisions:**

    - Lock-and-mint (not burn-and-mint) for Corda to Solana
    - Burn-and-unlock (not burn-and-remint) for Solana to Corda
    - Bridge Authority is a trusted central party holding both Corda and Solana keys
    - WebSocket subscription monitors Solana redemption addresses for incoming deposits
      (implementation: [BridgingService](https://github.com/corda/corda-solana-toolkit/blob/main/bridging-token-workflows/src/main/kotlin/com/r3/corda/lib/solana/bridging/token/flows/BridgingService.kt), config: [ConfigHandler](https://github.com/corda/corda-solana-toolkit/blob/main/bridging-token-workflows/src/main/kotlin/com/r3/corda/lib/solana/bridging/token/flows/ConfigHandler.kt))

  assets:
    - ID: CORDA_ASSET
      type: data
      title: Corda Digital Asset
      description: |
        The original tokenized asset residing on the Corda network that is to be bridged.
      inScope: true

    - ID: SOLANA_REFERENCE_ASSET
      type: data
      title: Solana Reference Asset
      description: |
        The SPL token minted on Solana that represents the locked asset on Corda.
      inScope: true

    - ID: BRIDGE_AUTHORITY
      type: system
      title: Bridge Authority
      description: |
        Central trusted party running the bridging CorDapp. Orchestrates bridging operations, holds locked
        tokens via a Locking Identity, and signs Solana transactions via whitelisted key. Implemented as
        a Corda node running the bridging-token-workflows CorDapp.
      inScope: true

    - ID: SOLANA_NOTARY
      type: system
      title: Solana Notary
      description: |
        A specialized Corda notary service that validates and notarizes Corda transactions while also
        executing Solana instructions (mintTo, burn) atomically. Part of the corda-solana-toolkit.
      inScope: true

    - ID: GENERAL_NOTARY
      type: system
      title: General Notary
      description: |
        Standard Corda notary for non-bridging transactions. Used for initial token issuance and
        transfers before bridging.
      inScope: true

    - ID: LOCKING_IDENTITY
      type: system
      title: Locking Identity
      description: |
        Confidential identity controlled by Bridge Authority used to hold locked tokens in escrow
        during bridge lifecycle. Generated via Corda's confidential identity mechanism, tied to a
        configurable UUID (lockingIdentityLabel).
      inScope: true

    - ID: BRIDGED_FUNGIBLE_TOKEN_PROXY
      type: data
      title: Bridged Fungible Token Proxy
      description: |
        Transient Corda state created during Lock Phase containing Solana minting metadata (bridgeTokenAccount,
        mintAccount, mintAuthority). Consumed during Mint Phase. Contract: FungibleTokenBridgeContract.
        Source: https://github.com/corda/corda-solana-toolkit/blob/main/bridging-token-contracts/src/main/kotlin/com/r3/corda/lib/solana/bridging/token/states/BridgedFungibleTokenProxy.kt
      inScope: true

    - ID: FUNGIBLE_TOKEN_BURN_RECEIPT
      type: data
      title: Fungible Token Burn Receipt
      description: |
        Transient Corda state issued as proof of burn on Solana. Created during BurnOnSolana command,
        consumed during UnlockToken. Contract: FungibleTokenRedemptionContract.
        Source: https://github.com/corda/corda-solana-toolkit/blob/main/bridging-token-contracts/src/main/kotlin/com/r3/corda/lib/solana/bridging/token/states/FungibleTokenBurnReceipt.kt
      inScope: true

    - ID: BRIDGE_AUTHORITY_SOLANA_KEY
      type: credential
      title: Bridge Authority Solana Key
      description: |
        Solana keypair (Signer) held by Bridge Authority for signing Solana transactions. Loaded from
        file via ConfigHandler (bridgeAuthorityWalletFile config). In scope: key file loading, in-memory
        storage, potential log/dump exposure. Out of scope: external HSM internals.
        Implementation: https://github.com/corda/corda-solana-toolkit/blob/main/bridging-token-workflows/src/main/kotlin/com/r3/corda/lib/solana/bridging/token/flows/ConfigHandler.kt
      inScope: true

    - ID: BA_CONFIG
      type: configuration
      title: Bridge Authority Configuration
      description: |
        Configuration used by the Bridge Authority service for mapping parties, wallets, mint authorities,
        notaries, and Solana connectivity.

        <table>
          <thead>
            <tr>
              <th>Config Key</th>
              <th>Type</th>
              <th>Purpose</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>participants</td>
              <td>Map&lt;String, String&gt;</td>
              <td>Corda X500 Name → Solana address (bridging)</td>
            </tr>
            <tr>
              <td>redemptionWalletAccountToHolder</td>
              <td>Map&lt;String, String&gt;</td>
              <td>Solana address → Corda X500 Name (redemption)</td>
            </tr>
            <tr>
              <td>mintsWithAuthorities</td>
              <td>Map&lt;String, Object&gt;</td>
              <td>Token ID → {tokenMint, mintAuthority}</td>
            </tr>
            <tr>
              <td>lockingIdentityLabel</td>
              <td>String (UUID)</td>
              <td>Label for locking identity</td>
            </tr>
            <tr>
              <td>solanaNotaryName</td>
              <td>String</td>
              <td>X500 name of Solana notary</td>
            </tr>
            <tr>
              <td>generalNotaryName</td>
              <td>String</td>
              <td>X500 name of general notary</td>
            </tr>
            <tr>
              <td>solanaWsUrl</td>
              <td>String</td>
              <td>Solana WebSocket URL</td>
            </tr>
            <tr>
              <td>solanaRpcUrl</td>
              <td>String</td>
              <td>Solana RPC URL</td>
            </tr>
            <tr>
              <td>bridgeAuthorityWalletFile</td>
              <td>String (path)</td>
              <td>Path to bridge authority keypair file</td>
            </tr>
            <tr>
              <td>redemptionCheckIntervalSeconds</td>
              <td>Long (optional)</td>
              <td>Polling interval (default: 10)</td>
            </tr>
          </tbody>
        </table>
      inScope: true

    - ID: SOLANA_RPC_PROVIDER
      type: system
      title: Solana RPC Provider
      description: |
        Third-party RPC service (e.g., Helius, Infura, QuickNode) that provides HTTP RPC and WebSocket
        endpoints for interacting with the Solana blockchain. The Bridge Authority connects to this
        service for:

        - Submitting transactions to the Solana network
        - Querying account balances and state
        - Receiving real-time account change notifications via WebSocket

        **Trust Implications:** The RPC provider is a trusted intermediary. It can observe all queries
        and transactions, and the Bridge Authority relies on it for accurate blockchain state.
        WebSocket events from the provider are NOT cryptographically signed blockchain data.

        Configuration: solanaRpcUrl, solanaWsUrl in ConfigHandler
      inScope: true

    - ID: DFC2S_WEBSOCKET_SUBSCRIPTION
      type: dataflow
      title: WebSocket Redemption Monitoring
      description: |
        WebSocket subscription used by BridgingService to monitor Solana redemption addresses for
        incoming token deposits. Triggers redemption flow when non-zero balance detected.
        The connection is to the RPC Provider, not directly to Solana validators.
        Implementation: https://github.com/corda/corda-solana-toolkit/blob/main/bridging-token-workflows/src/main/kotlin/com/r3/corda/lib/solana/bridging/token/flows/BridgingService.kt
      inScope: true

    - ID: BRIDGING_PARTY_WALLET
      type: system
      title: Bridging Party Wallet
      description: |
        The wallet used by the Corda network participant to initiate the bridging transaction and specify the destination for the Solana reference asset.
      inScope: true

    - ID: DFC2S_TRANSFER_STATE
      type: dataflow
      title: Transfer Corda state to bridging authority
      description: |
        Alice transfers the Corda state to the Bridging Authority to initiate the bridging process.
      inScope: true

    - ID: DFC2S_NOTARISE_REQUEST
      type: dataflow
      title: Send transaction for notarisation and bridging
      description: |
        The Bridging Authority sends the constructed Corda transaction to the Solana Notary.
      inScope: true

    - ID: DFC2S_SEND_SOLANA_TX
      type: dataflow
      title: Submit Solana transaction
      description: |
        The Solana Notary submits the signed Solana transaction (commit + mint) to the Solana network.
      inScope: true

    - ID: DFC2S_CONF_SOLANA_TX
      type: dataflow
      title: Confirm Solana transaction
      description: |
        The Solana network confirms the transaction back to the Notary.
      inScope: true

    - ID: DFC2S_NOTIF_BRIDGE_OK
      type: dataflow
      title: Notify bridging complete
      description: |
        The Solana Notary notifies the Bridging Authority that the process is complete.
      inScope: true

    - ID: DFC2S_NOTIF_USER_BRIDGE_OK
      type: dataflow
      title: Notify user bridging complete
      description: |
        The Bridging Authority notifies Alice that the bridging is complete.
      inScope: true

    - ID: DFC2S_MINT_TOKEN
      type: dataflow
      title: Minted Solana token credited
      description: |
        The minted SPL token is credited to Alice's Solana account.
      inScope: true

    - ID: DFC2S_TRANSFER_SOLANA_TOKEN
      type: dataflow
      title: Transfer/SWAP Solana token
      description: |
        Alice transfers the Solana token to another party, Bob.
      inScope: true

    - ID: DFC2S_SEND_REDEEM_ADDR
      type: dataflow
      title: Out-of-band redemption address communication
      description: |
        Alice (the original Corda holder) provides Bob with the designated Solana redemption address
        needed to initiate the burning process. This happens via manual, out-of-band channels
        (email, chat, etc.) because the address is not discoverable on-chain.
      inScope: false

    - ID: DFC2S_SEND_FOR_REDEMPTION
      type: dataflow
      title: Send tokens to redemption address
      description: |
        Bob sends the tokens to a redemption address to initiate the burn process.
      inScope: true

    - ID: DFC2S_POLL_REDEMPTION
      type: dataflow
      title: Monitor redemption address (WebSocket)
      description: |
        The Bridge Authority monitors redemption addresses via WebSocket subscription for non-zero balances.
        This triggers the redemption flow when tokens are deposited.
      inScope: true

    - ID: DFC2S_NOTIF_BALANCE
      type: dataflow
      title: Notify non-zero balance
      description: |
        The Solana network notifies the Bridging Authority of the balance.
      inScope: true

    - ID: DFC2S_REDEEM_REQUEST
      type: dataflow
      title: Send transaction for atomic redemption
      description: |
        The Bridging Authority sends the un-bridge transaction to the Solana Notary.
      inScope: true

    - ID: DFC2S_SEND_BURN_TX
      type: dataflow
      title: Submit Solana burn transaction
      description: |
        The Solana Notary submits the signed burn transaction to the Solana network.
      inScope: true

    - ID: DFC2S_CONF_BURN_TX
      type: dataflow
      title: Confirm Solana burn transaction
      description: |
        The Solana network confirms the burn transaction back to the Notary.
      inScope: true

    - ID: DFC2S_NOTIF_REDEMPTION_OK
      type: dataflow
      title: Notify redemption complete
      description: |
        The Solana Notary notifies the Bridging Authority of the successful redemption.
      inScope: true

    - ID: DFC2S_NOTIF_USER_RED_OK
      type: dataflow
      title: Notify user redemption complete
      description: |
        The Bridging Authority notifies Bob that the redemption is complete.
      inScope: true

    - ID: BRIDGE_AUTHORITY_WALLET
      type: credential
      title: Bridge Authority Wallet
      description: |
        Solana wallet owned by the Bridge Authority service.
        Used to sign Token2022 mint and burn instructions during bridging operations.
        Controls issuance and redemption of bridged tokens on Solana.
      inScope: true
      properties:
        location: Bridge Authority operational key, secure key management system
        format: Ed25519 keypair (public + private key)
        publicKeyLength: 256 bits
        privateKeyLength: 256 bits
      applicationRelated: true
      infrastructureRelated: false

    - ID: BRIDGE_AUTHORITY_REDEMPTION_WALLET
      type: credential
      title: Bridge Authority Redemption Wallet
      description: |
        Per-redeemer Solana wallet owned by the Bridge Authority.
        Used to manage token redemption ATAs and burn instructions for redemption flows.
        Owned by the Bridge Authority per redemption participant.
      inScope: true
      properties:
        location: Bridge Authority operational key, per-redeemer instance in 
          secure storage
        format: Ed25519 keypair (public + private key)
        publicKeyLength: 256 bits
        privateKeyLength: 256 bits
      applicationRelated: true
      infrastructureRelated: false

    - ID: USER_WALLET
      type: credential
      title: User Wallet
      description: |
        Solana wallet owned by the user/participant who bridges or redeems tokens.
        Holds Associated Token Account (ATA) for bridged assets on Solana.
        Signs token transfer and bridging instructions initiated by the user.
      inScope: true
      properties:
        location: User-controlled Solana wallet, typically local key management 
          (hardware or software wallet)
        format: Ed25519 keypair (public + private key)
        publicKeyLength: 256 bits
        privateKeyLength: 256 bits
      applicationRelated: true
      infrastructureRelated: false




  attackers:
    - ID: BRIDGING_PARTY
      title: Malicious Bridging Party
      description: |
        A legitimate participant on the Corda network who attempts to exploit the bridging process
        to double-spend assets, front-run redemptions, or craft malicious Solana instructions.
      inScope: true



    - ID: COMPROMISED_BRIDGE_AUTHORITY_OPERATOR
      title: Compromised Bridge Authority Operator
      description: |
        An insider or external attacker who has gained access to the Bridge Authority node, including
        its Solana keypair file, configuration files, or runtime environment. This is in scope only
        for key material handled by the application code (key file loading, in-memory storage, log
        exposure). External HSM compromise is out of scope.
      inScope: false

    - ID: MALICIOUS_VALIDATOR
      title: Malicious Solana Validator
      description: |
        A compromised or malicious validator on the Solana network that attempts to censor, delay,
        or manipulate transactions related to the bridge. Includes validators on sanctions lists.
      inScope: true

    - ID: NON_COLLABORATIVE_PARTICIPANT
      title: Non-Collaborative Corda Participant
      description: |
        A Corda participant (e.g., original token issuer) who refuses to sign required transactions,
        such as notary change requests, preventing the bridging process from completing.
      inScope: true

    - ID: MALICIOUS_RPC_PROVIDER
      title: Malicious or Compromised RPC Provider
      description: |
        The Solana RPC provider (e.g., Helius, Infura) that the Bridge Authority relies on for
        blockchain access is either malicious, compromised, or experiencing a service failure.
        This includes scenarios where the provider:

        - Returns fabricated or stale blockchain state
        - Suppresses WebSocket notifications
        - Censors or delays transaction submissions
        - Logs and correlates bridge activity for surveillance

        Unlike Solana validators, RPC providers do not participate in consensus but serve as
        trusted intermediaries for reading and submitting data.
      inScope: true

  assumptions:
    - ID: CORDA_NETWORK_SECURE
      description: |
        The underlying Corda network and its participating nodes are assumed to be secure and operating correctly.

    - ID: SOLANA_CONSENSUS_RELIABLE
      description: |
        The Solana network's consensus mechanism is assumed to be reliable and resistant to majority attacks.
        Transaction finality is trusted once confirmed.

    - ID: BRIDGE_AUTHORITY_TRUSTED
      description: |
        The Bridge Authority is a trusted party that will not mint Solana tokens without properly locking
        Corda tokens, and will not unlock tokens without valid burn receipts. The Bridge Authority holds
        both Corda signing keys and the Solana mint authority key.

    - ID: SOLANA_NOTARY_TRUSTED
      description: |
        The Solana Notary correctly validates Corda transactions and executes only legitimate Solana
        instructions as part of atomic settlement. It will reject malformed or unauthorized instructions.

    - ID: EXTERNAL_KEY_STORAGE_OUT_OF_SCOPE
      description: |
        External key management infrastructure (HSMs, hardware wallets, external signing services) is out
        of scope. Only the application's handling of key material is in scope, including: key file loading
        via ConfigHandler, in-memory key storage during flow execution, and potential exposure in logs or
        crash dumps.

    - ID: CONFIGURATION_INTEGRITY
      description: |
        The configuration mappings between Corda parties and Solana accounts (wallet mappings, mint
        authorities, redemption addresses) are pre-validated and correct. Misconfiguration is an
        operational concern but not a threat vector in this model.

    - ID: SOLANA_PROGRAM_WHITELISTING
      description: |
        The Solana token program only allows whitelisted mint authorities to mint tokens. The Bridge
        Authority's Solana key must be pre-registered with the token mint.

    - ID: RPC_PROVIDER_TRUSTED
      description: |
        The Solana RPC provider (e.g., Helius, Infura) is trusted to accurately relay blockchain state
        and not suppress, fabricate, or delay transactions or notifications. This is a significant
        trust assumption as the Bridge Authority does not run its own Solana validator node.
        The provider can observe all bridge-related queries and transactions.

analysis: |
  The primary threat surface of the Corda-to-Solana bridge lies at the intersection of two distinct
  blockchain/DLT environments with different trust models. Key risks include:

  1. **Atomicity Failures**: Ensuring that lock-on-Corda and mint-on-Solana (or burn/unlock) occur atomically
  2. **Asset Integrity**: Preventing double-spending, unbacked minting, or asset loss during bridging
  3. **Key Material Exposure**: The Bridge Authority handles Solana keypairs via file loading and in-memory storage
  4. **Redemption Front-Running**: Malicious participants could attempt to hijack redemption flows
  5. **Malicious Instructions**: Crafted Solana instructions could attempt unauthorized operations

  The Bridge Authority is a trusted, centralized component; this is an accepted counterparty risk documented
  in assumptions. Contract validation (FungibleTokenBridgeContract, FungibleTokenRedemptionContract) provides
  defense-in-depth by enforcing strict rules on token movements and Solana instruction formats.

  **Sequence Diagrams:**

  - Generic bridging flow: <img src="img/C2SBridge_seq1.svg"/>
