    attack: |
      Attacker targets the availability of signing authorities or their
      supporting infrastructure to:

      - **Block threshold:** DoS enough signers to prevent multisig threshold
        from being reached, blocking time-sensitive actions
      - **Force fallback:** Push system to weaker fallback signing paths
      - **Disable monitoring:** DoS watchtower/circuit breaker services to
