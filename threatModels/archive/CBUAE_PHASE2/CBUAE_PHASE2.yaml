    - ID: CB_EFFECTIVE_MONETARY_POLICIES
      title: Exclusive CB control of monetary base and policies
      description: |
        Central banks are better able to control the money supply, allowing them to pass more effective monetary 
        policies as they are able to manage M0 (cash in circulation and reserves) and M1 (M0 plus deposits and other liquid assets) 
        more effectively through issue, burn, redemption, and various
         methods of programmability.
        [REF](https://r3-cev.atlassian.net/wiki/spaces/CB/pages/4914643124/R3+CBDC+Reference+Solution)
      # contributesTo:
      #   - REFID: INTEGRITY
      #   - REFID: COMPLIANCE
      group: Business specific

    - ID: 24_7_CDBC_AVAILABILITY
      title: 24/7 CBDC Availability
      description: |
        CBDC can make transactions faster and more efficient as they can be settled in real-time or near real-time 24/7.
         Current money transfers rely on a T+2 settlement window, increasing costs and risks, and such transfers can be 
         unavailable over weekends or national holidays as banks and RTGS systems do not open during this period.
          Improved settlement times increase liquidity for players in the ecosystem as well as reducing reconciliation time which
         is a major pain point for businesses.
        [REF](https://r3-cev.atlassian.net/wiki/spaces/CB/pages/4914643124/R3+CBDC+Reference+Solution)
      # contributesTo:
      #   - REFID: INTEGRITY
      #   - REFID: COMPLIANCE
      group: Business specific

