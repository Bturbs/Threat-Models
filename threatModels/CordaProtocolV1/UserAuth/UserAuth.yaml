  - ID: STALE_SIGNATURE_CONTEXT
    title: Stale Signature Context in Multi-Step Signing
    attack: |
      In multisig signing flows, on-chain state changes between the first and
      last signature, causing the earlier signers to have authorized a different
      effective outcome than what ultimately executes:

      - Vault balance changes during signature collection
      - NAV/AUM updates between signing rounds
      - Fee parameter changes during concurrent proposals
      - Guardian or curator changes during long-lived signing flows
      - 24h timelock windows (Protocol Config, Curator Config) create large
        drift windows

      Durable nonces used for offline signing extend the window further. Higher
      risk for roles with long timelocks (24h) and high thresholds (4/7, 3/5).
    threatType: Tampering
    impactDesc: |
      The transaction that executes is materially different from what earlier
      signers intended to authorize:

      - Settlements computed against stale NAV values
      - Fee changes applied in a different market context
      - Configuration changes applied to a vault that has since changed state
      - Earlier signers bear responsibility for an outcome they did not review
    impactedSecObj:
      - REFID: INTEGRITY
      - REFID: USER_FUNDS_SAFETY
    attackers:
      - REFID: EXTERNAL_ATTACKER
    assets:
      - REFID: VAULT_UPGRADE_AUTHORITY_KEYS
      - REFID: PROTOCOL_CONFIG_AUTHORITY_KEYS
      - REFID: CURATOR_CONFIG_AUTHORITY_KEYS
      - REFID: PROTOCOL_MANAGER_KEYS
      - REFID: VAULT_MANAGER_KEYS
      - REFID: CURATOR_KEYS
      - REFID: UNFREEZE_AUTHORITY_KEYS
    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:N/I:H/A:N
    fullyMitigated: false
    ticketLink: https://r3-cev.atlassian.net/browse/PROT-876
    countermeasures:
      - ID: STALE_CONTEXT_GUARDS
        title: Stale-Context Guards
        description: |
          On-chain and procedural protections against context drift:

          - **Atomic proposal snapshots:** Include a hash of relevant state at
            proposal time in the signed payload; contract verifies at execution
          - **State guards:** Range checks in the smart contract (e.g., vault
            balance >= X, price within range Y); execution fails if state
            drifted beyond bounds
          - **Two-phase signing:** Collect approvals against a state snapshot,
            then validate state has not materially changed before execution
          - **Signature expiry:** Time-bound signatures to limit drift window
          - **Monitoring during collection:** Alert on relevant state changes
            during active signature collection
        inPlace: false
        public: true
        operational: false
  - ID: SIGNER_AVAILABILITY_DOS
