      - ID: DRILLS
        title: Run Regular Signing Liveness and Ceremony Drills
        description: |
          Execute regular drills (at least quarterly) to verify operational readiness of the
          multisig signing process.

          **Signing drill types:**

          - **Liveness drill:** Simulate signer unavailability scenarios and measure time to
            reach quorum for an emergency upgrade or admin action. Track recovery time objective.

          - **Signing ceremony drill:** Full end-to-end rehearsal of a privileged operation
            (e.g., propose, review, co-sign, execute a no-op upgrade or test admin instruction)
            to validate tooling, communication channels, and signer coordination.

          - **Break-glass drill:** Simulate a scenario requiring the break-glass governance
            process (BREAK_GLASS_PROCESS) and verify backup coordination works.

          **Drill outcomes to track:**

          - Time to first signer response
          - Time to quorum
          - Communication channel reliability
          - Tooling issues encountered
          - Lessons learned and procedure updates
        inPlace: false
