      - **Block emergency response:** Target Vault Guard or Freeze Authority
        signers to prevent break-glass actions during an active attack

      Attack methods:

      - Network-level DoS against signer infrastructure
      - Social engineering to make signers unavailable
      - Physical disruption if signer locations are known
      - DoS against watchtower services (single point of failure if not
        redundant)

      Highest impact on reactive roles (Vault Guard, Freeze Authority) where
      unavailability directly translates to inability to respond to incidents.
