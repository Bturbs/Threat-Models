      - ID: ONCHAIN_WALLET_WHITELISTING
        title: On-chain wallet whitelisting for depositors and redeemers
        description: |
          Introduce an on-chain whitelist mechanism in the vault program, such as a PDA
          account maintaining a list of approved wallet addresses. The vault program checks
          this whitelist during `process_deposit` and `process_redeem`, rejecting any
          transactions from non-whitelisted wallets. This enforces compliance directly on-chain,
          preventing unauthorized participation.
          Reference: [https://solana.com/de/developers/guides/token-extensions/transfer-hook]
        inPlace: false
        public: true

  - ID: INSUFFICIENT_FUNTIONALITY
    title: Lack of Vault functionality like freeze or blacklist
    attack: |
      The vault program lacks mechanisms for example to freeze share transfers or blacklist
      specific user accounts. In the event of suspicious activity, regulatory
      requirements, or security incidents, the vault operator cannot halt
      redemptions or restrict access for certain wallets. An attacker could exploit
      this by using compromised or sanctioned accounts to withdraw funds without
      recourse.
    assets:
      - REFID: DF_INVOKE_REDEEM
    threatType: Elevation of Privilege
    impactDesc: |
      - Inability to respond to security incidents involving specific user accounts
      - Non-compliance with regulatory requirements for freezing assets
      - Increased risk of fund loss due to malicious or compromised wallets
    impactedSecObj:
      - REFID: COMPLIANCE
      - REFID: USER_FUNDS_SAFETY
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: MALICIOUS_USER
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N
    fullyMitigated: true
    pentestTestable: true

    countermeasures:
      - ID: IMPLEMENT_FREEZE_AUTHORITY
        title: Introduce freeze authority for share mint and user accounts
        description: |
          Implement a freeze authority mechanism in the vault program that allows the
          operator to freeze share transfers and restrict redemptions for specific user
          accounts. This could involve adding a freeze flag in user account state or a
          global freeze function that halts all redemptions temporarily. This provides a
          means to respond to security incidents and comply with regulatory requirements.
        inPlace: true
        public: true
      - ID: UPGRADABLE_VAULT_PROGRAM
        title: Maintain upgradability of the vault program for future 
          enhancements
        description: |
          Deploy the vault program as an upgradeable Solana program, allowing for future
          enhancements such as adding freeze or blacklist functionality. This ensures that
          the vault can adapt to evolving security and compliance needs without requiring a
          complete redeployment.
        inPlace: true
        public: true


  - ID: WEBSITE_UI_TRANSACTION_TAMPERING
    title: Website UI Tampering Modifies Transaction to Redirect Funds
    attack: |
      The website UI (e.g. React/Next.js) is responsible for preparing or requesting the
      Solana transaction(s) the user will sign for deposit/redeem. If the UI is compromised
      (XSS, malicious dependency update, CDN/script injection, CI/CD compromise, or other
      supply-chain attack), the attacker can tamper with the transaction content presented
      to the wallet.

      The attacker modifies the constructed instructions and/or referenced accounts so
      that, once the user signs, value is redirected to an attacker-controlled wallet.
      Examples include swapping destination token accounts, substituting a recipient owner,
      or injecting additional instructions that transfer assets to the attacker.

      This threat is specifically about off-chain transaction construction integrity: the
      on-chain vault program may be correct, but the user can still be tricked into signing
      a different transaction than intended.
    threatType: Tampering
    impactDesc: |
      If users sign attacker-modified transactions, consequences can include:

        - direct theft of USDC or shares by redirecting transfers to an attacker wallet,
        - loss of user funds and loss of trust in the vault product,
        - degraded auditability (signed intent differs from user expectation), and
        - incident response complexity if the UI compromise is widespread.
    impactedSecObj:
      - REFID: USER_FUNDS_SAFETY
      - REFID: AUDITABILITY
      - REFID: PROGRAM_INTEGRITY
    attackers:
      - REFID: EXTERNAL_ATTACKER
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:H/A:N
    fullyMitigated: false
    ticketLink: https://r3-cev.atlassian.net/browse/PROT-134

    countermeasures:
      - ID: WEB_UI_SDLС_SECURITY_CONTROLS
        title: Apply secure SDLC controls to the website UI (XSS and 
          supply-chain)
        description: |
          Apply security controls across the UI development lifecycle to reduce the risk of
          XSS and supply-chain compromise:

            - Secure commit to repossitory (github) with 2FA, code reviews, branch protections,
              and signed commits.
            - dependency pinning and lockfiles, controlled upgrade process, and SCA
              (dependency vulnerability scanning) in CI,
            - secure coding practices and automated checks for XSS (linting, SAST, code
              review, input/output encoding, safe templating),
            - build provenance and artifact integrity (trusted CI, signed build outputs),
            - routine security testing (DAST) and security review for high-risk changes.
            - Enternal Penetration Testing of the Web UI periodically.
        inPlace: false
        public: true

      - ID: WEB_UI_DEPLOYMENT_HARDENING
        title: Harden UI hosting and delivery infrastructure
        description: |
          Apply infrastructure controls to prevent or rapidly detect UI/script tampering:

            - strong CSP (Content Security Policy) with nonces/hashes and restricted script
              sources, plus other web hardening headers,
            - supply-chain protections for third-party scripts (avoid inline third-party
              scripts where possible; use integrity controls when applicable),
            - least privilege access for CDN/hosting and CI/CD deploy keys, environment
              separation, and strong monitoring/alerting on unexpected deployments.
        inPlace: false
        public: true

  - ID: SLIPPAGE_ON_REDEEM
    title: Slippage on Redeem Allows User Fund Loss
    attack: |
      Users can receive far less USDC than expected through:

        - MEV (Maximal Extractable Value) sandwich attacks: MEV refers to profit extracted
          by manipulating transaction ordering within a block. MEV bots detect pending
          redemptions and sandwich them—front-running with a swap that worsens the price
          (making the user execute at an unfavorable rate), then back-running with a reverse
          swap to profit from the price movement. The user is "sandwiched" between the
          attacker's trades, losing value that the bot extracts.

        - Market volatility: Investment token price crashes between submission and execution

      The vault checks basic sanity (received something, didn't swap too much) but doesn't
      enforce minimum output. A user expecting $1000 USDC might receive $500 with no
      transaction failure.
    threatType: Tampering
    impactDesc: |
      Users can lose 10-50% or more of value with no transaction failure or protection.
      Vault is vulnerable to MEV extraction where bots profit by sandwiching redemptions.
      Particularly severe during high volatility, low liquidity, or high MEV activity.
      Creates user trust issues and potential legal/compliance risk.
    impactedSecObj:
      - REFID: USER_FUNDS_SAFETY
      - REFID: SWAP_SAFETY
      - REFID: PROGRAM_INTEGRITY
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: MALICIOUS_USER
    assets:
      - REFID: DF_INVOKE_REDEEM
      - REFID: DF_JUPITER_REDEEM_SWAP_CALL
      - REFID: VAULT_USDC_ACCOUNT
    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:N/I:H/A:N
    fullyMitigated: false
    countermeasures:
      - ID: ADD_MIN_USDC_OUT_PARAMETER
        title: Add min_usdc_out parameter to process_redeem function
        description: |
          Add min_usdc_out parameter to process_redeem function signature. After Jupiter
          swap completes, verify usdc_received >= min_usdc_out before transferring to user.
          Transaction fails with SlippageExceeded error if minimum not met, protecting
          user's shares from burning at unfavorable rates. User specifies acceptable
          slippage tolerance (e.g., 990 USDC minimum for expected 1000 USDC = 1% slippage).
        inPlace: false
        public: true
        operator: VAULT_PROGRAM

      - ID: OFF_CHAIN_SLIPPAGE_CALCULATION
        title: Provide UI-level slippage calculation and reasonable defaults
        description: |
          Web UI fetches Jupiter quote, calculates expected USDC output, applies
          user-configurable slippage tolerance (default 0.5-1%), and sets min_usdc_out
          parameter. Display expected and minimum amounts before signing. Include warnings
          for high slippage (>5%). Allows users to adjust tolerance based on market
          conditions.
        inPlace: false
        public: true
        operator: WEB_UI
