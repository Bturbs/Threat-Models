  - ID: REV_CHECK_DISABLED
    title: Disabling revocation checks
    impactDesc: |
      - Nodes can execute flows whole they should not be allowed 
      - Compromised SESSION_KEY may still be used
      - Repudiation possible on CorDapp flows/transactions execution
      - loss of compliance 
    pentestTestable: true
    impactedSecObj:
      - REFID: CLUSTER_OPERATOR_PROTECTION
    assets:
      - REFID: DF_P2PGW_2_P2PGW
    attackers:
      - REFID: CLUSTER_OPERATOR
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:L/I:H/A:N
    threatType: Elevation of privileges, repudiation
    attack: |
      A CLUSTER_OPERATOR is allowed to compromise the authorization integrity of all the VNodes by disabling CRL/OCSP
       (certificate revocation) by using the API ($API_URL/config revocationCheck to OFF) in a way that is also is not auditable by VNodes identities/Corda Network participants.
       It could for example, turn off then on these controls.
       Note: our Threat Model has [INFRASTRUCTURE_OPERATOR](#INFRASTRUCTURE_OPERATOR), the role that deploy Corda Cluster and the infrastructure, as a trusted actor
        (out of scope) while [CLUSTER_OPERATOR](#CLUSTER_OPERATOR) is a potential attacker (e.g. we do not allow a CLUSTER_OPERATOR to impersonate 
        a NVode for example).
    public: true
    fullyMitigated: false
    countermeasures:
      - ID: DISABLE_DANGEROUS_API_CERT_REV
        title: Remove dangerous API from production systems
        description: |
          Only the trusted [system_operator] should be allowed to perform suck operation, not via API (e.g.) file configuration for example, 
          for testing and development purposes.
        operational: false
        inPlace: false
        public: true
      - ID: NODE_OPERATOR_DISABLING_CR
        title: Only NVode Operator level security checks disabling
        description: |
          Only the VNode operator (VNode legal entity) can disable certificate revocation/expiration and other certificate controls through the API.
          This will remove the liability, repudiation, and compliance issues from the Cluster operator legal entity and transfer 
          these to the NVode operator legal entity.  
        operational: false
        inPlace: false
        public: true

  - ID: SESSION_KEY_CERT_IGNORED
    title: Same cluster flow fails to check SESSION_KEY_CERT
    impactDesc: |
      A VNode with an expired or revoked SESSION_KEY is able to operate and create flows
       with VNodes on the same Cluster but not with VNodes on different clusters. This lead to authorization 
       failure or Authentication failure in case of the rotation of a key due to compromised private data, 
       old crypto algorithms etc. Following a detailed list of potential impact:


        - Nodes in the same cluster can impersonate each other
        - Compromised SESSION_KEY may still be used
        - Repudiation possible on CorDapp flows/transactions execution
        - Loss of compliance 
    impactedSecObj:
      - REFID: LEDGER_SPOOFING_PREVENTION
      - REFID: LEDGER_INTEGRITY
      - REFID: NON_REPUDIATION
    assets:
      - REFID: DF_P2PGW_2_P2PGW
    attackers:
      - REFID: VNODE_OPERATOR
    pentestTestable: true
    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:L/I:H/A:N
    threatType: Spoofing, repudiation
    attack: |
      When two VNodes Identity e.g. Alice and Bob are on the same cluster and Alice creates a flow to Bob, the link manager shortcuts
       the session without checking the validity of the SESSION_KEY and its SESSION_KEY_CERT;
        SESSION_KEY_CERT will not be checked after expiration or revocation.
    public: true
    fullyMitigated: false
    countermeasures:
      - ID: SAME_CLUSTER_CHECKCRT_AFTER_REVOKE
        title: Same cluster certificate verification
        description: |
          Session key validity verification is carried when flow executes also in the same cluster and without P2P gateway involvement.        
        inPlace: false
        public: true




