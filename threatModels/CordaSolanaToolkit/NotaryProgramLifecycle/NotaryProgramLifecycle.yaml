      - ID: HARDWARE_SIGNING
        title: Hardware-Backed Signing with Phased Migration
        description: |
          Target state: all multisig signers use hardware-backed wallets with non-exportable private keys
          and signer endpoint hardening.

          **Phased migration plan:**

          - **Phase 1 (initial deployment):** Software wallets (e.g., Phantom browser wallet)
            for initial signer onboarding and operational bootstrapping. Acceptable for
            early-stage deployment with limited asset exposure.

          - **Phase 2 (production hardening):** Transition all signers to hardware wallets
            (e.g., Ledger, Trezor) with non-exportable keys. Enforce device binding and
            anti-phishing controls.

          **Migration procedure:**

          - Generate new keypairs on hardware devices
          - Execute multisig member update flow (DF_MEMBER_UPDATE) to replace software keys
          - Verify new member set on-chain before retiring software wallets
          - Document key rotation evidence in governance log

          **Risk acceptance (Phase 1):** Software wallet keys are more vulnerable to endpoint
          compromise, clipboard hijacking, and browser extension attacks. Phase 1 risk is
          accepted only for the initial bootstrapping period.
        inPlace: false
        public: true
        operational: true
        operator: Platform Operations and Security team

