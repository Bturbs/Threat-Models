  - ID: FLEXCUBE_PASSWORD_LEAK1
    title: Flexcube credential leaked to less trusted system
    assets:
      - REFID: DF4_FC_JMS_FCC
    attackers:
      - REFID: ANONYMOUS
      - REFID: INFRASTRUCTURE_OPERATOR
    CVSS:
      vector: CVSS:3.1/AV:L/AC:H/PR:H/UI:N/S:U/C:L/I:H/A:L
    threatType: Tampering, Elevation of Privileges
    attack: |
      An attacker that does not have access to the Flexcube connector process, but for example gained access to Kafka messages, will be able to gain access to the Flexcube 
      credentials (password) and spoof the identity of the connector itself. See <b>Password mechanism</b> analysis. (WIP/TODO: waiting to source code access to verify  claimed 
      countermeasure)
    impactDesc: |
      FLEXCUBE Core banking request execution, including fund transfers, DoS on redemptions and issuances, 
      integrity and repudiation issues of the LFI accounts movements.
    impactedSecObj:
      - REFID: MONETARY_INTEGRITY
      - REFID: COMPLIANCE
      - REFID: MINIMAL_RISK_SURFACE
    public: true
    fullyMitigated: false
    countermeasures:
      - ID: FLEXCUBE_XML_REQUESTS_DESCOPE
        title: FLEXCUBE request are protected as the password itself
        description: |
          As a compromised request contains valid credential that are not strongly bounded to the message (see analysis) 
          the XML request to flexcube should not be stored in KAFKA (for example by using it in the DF3_FC_KAFKA_CBCC dataflow). 
          That should include any retry mechanisms and feature implemented in the issuance platform.
          (RFI: code reference that the retry mechanisms is based on read without consuming the Kafka message)
        operational: false
        inPlace: true
        public: true


  - ID: FLEXCUBE_SPOOFING1
    title: Flexcube Spoofing
    assets:
      - REFID: DF4_FC_JMS_FCC
    attackers:
      - REFID: ANONYMOUS
      - REFID: INFRASTRUCTURE_OPERATOR
    CVSS:
      vector: CVSS:3.1/AV:A/AC:H/PR:H/UI:N/S:U/C:H/I:H/A:H
    threatType: Spoofing, Elevation of Privileges, Tampering
    attack: |
      An attacker that has access to the JMS middleware (DF4_FC_JMS_FCC) is able to impersonate FLEXCUBE responses to the CBCC 
      due to the lack of application level credentials and integrity checks; there's no signing/verification of the request as in 
      DF1_MBRIDGECON_ASYNC_MB dataflow.
    impactDesc: |
      Bypass Flexcube fund checks and other issuance verification logic, could result in monetary loss and monetary instability. 
    impactedSecObj:
      - REFID: MONETARY_INTEGRITY
      - REFID: NON_REPUDIATION
    public: false
    fullyMitigated: false
    countermeasures:
      - ID: FLEXCUBE_XML_REQUESTS_SIGNING
        title: FLEXCUBE request are signed and verified by both parties
        description: |
          Apply identity and integrity checks via signing and verifying application level XML message between FLEXCUBE and
           FLEXCUBE_CONNECTOR
        operational: false
        inPlace: false
        public: true
