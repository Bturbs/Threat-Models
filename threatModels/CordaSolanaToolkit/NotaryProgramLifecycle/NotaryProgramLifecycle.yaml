  - ID: MULTISIG_BRICKING_AND_PERMANENT_DEADLOCK
    title: Multisig Bricking and Permanent Deadlock
    attack: |
      Operators mismanage multisig threshold settings or lose access to a critical number of signer keys.
      Common failure modes include setting an impractical threshold (for example, effectively requiring all
      members in larger teams), inadequate key recovery planning, and simultaneous signer attrition.

      Once quorum becomes unreachable, privileged governance actions can no longer be executed.
    threatType: Denial of Service
    impactDesc: |
      Privileged assets and operations can become permanently unrecoverable due to governance deadlock.

      - Funds or controlled resources become inaccessible
      - Emergency changes and recovery actions cannot be approved
      - Long-term operational lockout and incident escalation

    impactedSecObj:
