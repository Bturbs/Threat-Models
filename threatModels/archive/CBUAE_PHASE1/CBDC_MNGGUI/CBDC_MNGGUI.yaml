parent: CBUAE_PHASE1
ID: CBDC_MNGGUI
schemaVersion: 2
title: Central Bank Digital Currency Management GUI

scope:
  description: |
    The application is an Single Page Javascript (SPA) that will be loaded from a static content provider
     on a specified https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html
    The application (AKA public client in OAuth terminology) will be implemented using authorization flow with PKCE. 

    Example of SPA, PKCE auth with Keycloak and Spring Boot API checking JTWs: 
    [REF1](https://frameworks.readthedocs.io/en/latest/spring-boot/spring-boot2/keycloakOAuth2PKCE.html)
    [REF2](https://blog.ordina-jworks.io/security/2019/08/22/Securing-Web-Applications-With-Keycloak.html)

    In case https://datatracker.ietf.org/doc/html/rfc7636 PKCE cannot be implemented or 
    activated implicit flow could be used. In this case, another CSRF mechanism and 
    a limit on how mani client can register on Keycloak would be necessary; 
    it is also assumed that the login flows are over TLS.


