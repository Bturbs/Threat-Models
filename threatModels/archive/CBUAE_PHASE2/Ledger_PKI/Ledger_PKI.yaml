  - ID: LEDGER_CIPHERSUITE_CONSTRAINED_BY_TLS
    title: Incompatibility of Ledger Ciphersuites with Root of Trust 
      Certificates for TLS
    # assets:
    #   - REFID: DF_FIN_PAYEE_RCVBLCK
    # attackers:
    #   - REFID: PAYER

    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H
    threatType: Denial of Service
    attack: |
      The root Certificate ends to be in the weaker cipher suite that is supported by TLS.
      Ciphersuites required by the Ledger may be incompatible and not upgradable if the same root of trust certificates are used for both Ledger and TLS.

      **Refs:** [LLD - 10.7.3 Cryptography and Public Key Infrastructure/Public key infrastructure/Solution design](#LLD)
    impactDesc: |
      Upgrades of ledger supported and required cipher suites are bound to those supported TLS. For example, it may be impossible to migrate to quantum resilient cipher suites.

      **Refs:** [LLD - 10.6.3 Cryptography and Public Key Infrastructure/Cryptographic key management/Solution design](#LLD)
    impactedSecObj:
      - REFID: AVOID_SINGLE_FAILURE_POINT
      - REFID: CRYPTO_AGILITY
      - REFID: POST_QUANTUM_CRYPTO
    public: false
    fullyMitigated: false
    pentestTestable: false
    # ticketLink: https://r3-cev.atlassian.net/browse/R3SOL-1352
    # ticketInfo: | 
    #   ![Jira Ticket Status](https://r3-cev.atlassian.net/secure/api/v2/status/R3SOL-1352.svg)
    countermeasures:
      - ID: MULTIPLE_ROT_CA_SUPPORT
        title: Allow for multiple root CAs
        description: |
          Allows to validate ledger transactions using multiple configurable root CAs.

          **Refs:** [LLD - 10.8.6 Cryptography and Public Key Infrastructure/Certificate authority, certificate trust chain, and validation/Component 1 - Root and intermediate certificate authority](#LLD)
        inPlace: false
        public: true
      - ID: MULTIPLE_ROT_CA_CONFIG
        title: Configure at least two root CAs
        description: |
          Configure at least two valid CAs root of trust via certificates for every kind of root of trust (e.g. ledger, tls)

          **Refs:** [LLD - 10.7.3 Cryptography and Public Key Infrastructure/Public key infrastructure/Solution design](#LLD)
        inPlace: false
        public: true
        operational: true
        operator: CLUSTER_OPERATOR
      - ID: SEPARATED_TLS_LEDGER_ROT_CA_REQUIRED
        title: Separate Roots of Trust for Ledger and TLS
        description: |
          Configure different roots of trust certificates for the Ledger and for TLS communications.

          **Refs:** [LLD - 10.7.3.1 Cryptography and Public Key Infrastructure/Public key infrastructure/Solution design/Architecture/context](#LLD)
        inPlace: false
        public: true
        operational: false


