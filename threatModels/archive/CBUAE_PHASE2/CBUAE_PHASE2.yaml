    - ID: LEDGER_TX_FINALITY
      title: Transaction finality
      description: |
        With *transaction finality*, transactions are considered irreversible and cannot be altered or removed.
        Network participant are able to deterministically verify ownership and accept tokens in any moment in the future. 
        <h5>Forward ledger validation</h5>
        Forward ledger validation is defined as the ability to deterministically confirm the validity of a ledger or of any of the
         transactions at any point in the future, independently of other parties like: CAs, 
         Notaries, Ledger network administrative parties, other network participant/counterparties etc.
        To achieve this security objective of Finality and "Forward ledger validation" the PKI based Ledger should record:

        - All the transaction that needs to be validated, including the related backchain transactions
        - All the Certificates and related CRL used to validate every transaction
          - It is likely that the number of CAs certificates and CRLs are going to be orders of magnitude inferior to the number transactions itself. 

        Other Ledgers systems may not achieve this or have a pseudo ability to do it are for example:

        - In Bitcoin: to validate a Bitcoin ledger in a point in the future you should check (with a gossip protocol) if
         there is another chain of blocks that cumulatively has more Proof Of Work than the one stored and being validated.
          For this reason to confirm a TX in Bitcoin it is recommended to wait that is extremely unlikely that there will be 
          another such chain by waiting for every TX to be mined and confirmed in 3 to 6 blocks (it happens sometime that there's a
           legit chain with more POW in 1 or 2 blocks after the first valid block and is called chain reorg). The residual risk impacting the
            "Forward Ledger validation" in Bitcoin is also called Bitcoin 51% percent attack.

        - In Corda 5 networks: the ledger validation can be done in the future by having a CPIs package that incorporates a signed groupPolicy.json 
        file that has both data (e.g. participants public keys) and methods (contract code) to validate a ledger. 

        To note that the concept of CACHE for CRL and certificate/public keys is not achieving this as the cache implies that is used only to
         optimize an online access to a source of truth and can be evicted/deleted.


      contributesTo:
        - REFID: AVAILABILITY
      group: Business specific

    - ID: FORWARD_LEDGER_VALIDATION
      title: Forward ledger validation
      description: |
        The ability to deterministically confirm the validity of a ledger or of any of the transactions at any point in the future, 
        independently of other parties. Without this feature, a token coin owner depends indefinitely 
        on other parties to be able to spend its own tokens, as there are third parties that may be still needed to assess in a 
        point in time in the future the validity of a past transaction, even after being initially confirmed.

        These parties include:  

        - Certificate authorities (PKIs) 
        - Notaries 
        - Ledger network administrative parties 
        - Other network participant/counterparties 

        To achieve this security objective , the PKI-based Ledger should record: 

        - All transactions that need to be validated, including the related backchain transactions 

        - All certificates and related certificate revocation lists (CRLs) used to validate every transaction 

        It is likely that the number of certificate authorities (CAs), certificates and CRLs are negligible compared to the number of transactions. 

        Other ledgers may not achieve this objective or have a pseudo-ability to achieve it.

        For example: 

        - **Bitcoin**: To validate a Bitcoin ledger in a point in the future, it must first be checked (with a gossip protocol) if there is another chain of blocks that cumulatively has more *proof of work* than the one stored and being validated. For this reason, to confirm a transaction in Bitcoin, it is recommended to wait until it is extremely unlikely that there will be another such chain, by waiting for every transaction to be mined and confirmed in 3 to 6 blocks. Sometimes, there is a legitimate chain with more POW in 1 or 2 blocks after the first valid block; this is called *chain reorg*. The residual risk impacting forward ledger validation in Bitcoin is also called the Bitcoin 51% percent attack. 

        - **Corda 5 networks**: The ledger validation can be done in future by having a CPI package that incorporates a signed groupPolicy.json file that has both data (for example, participants’ public keys) and methods (contract code) to validate a ledger. 

        Note that the concept of a cache for CRL and certificate/public keys does not achieve this, as the cache implies that it is used only to optimize online access to a source of truth and can be evicted/deleted. 

      contributesTo:
        - REFID: LEDGER_TX_FINALITY
      group: Business specific


