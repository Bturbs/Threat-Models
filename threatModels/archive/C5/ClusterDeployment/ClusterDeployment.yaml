  - ID: WORKER_PROCESS_DOS1
    title: |
      High resource consumption from faulty or malicious code 
    assets:
      - REFID: WORKER_PROCESS
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:H
    threatType: DoS
    attack: |
      Malicious or malfunctioning flow or malfunctioning cluster native code can causes denial of service to Corda cluster
    impactDesc: Denial of Service on WORKER_PROCESS
    impactedSecObj:
      - REFID: AVAILABILITY
    public: true
    fullyMitigated: true
    countermeasures:
      - ID: K8S_WORKERS_LIMITS
        title: Container constraints on flow worker
        description: |
          Add Container/Kubernetes Pod constraints on flow worker, e.g.:
           - CPU limit (not values provided by default)
        inPlace: true
        public: true
        operational: true
        operator: INFRASTRUCTURE_OPERATOR

      - ID: K8S_WORKERS_SCALABILITY
        title: USe multiple replicas for flow worker
        description: |
          Setup Multiple replicas for flow worker (default single FLOW_WORKER)
        inPlace: no
        public: true
        operational: true
        operator: INFRASTRUCTURE_OPERATOR




