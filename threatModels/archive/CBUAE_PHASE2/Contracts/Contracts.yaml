ID: Contracts
schemaVersion: 2
parent: CBUAE_PHASE2


scope:
  description: |
    Corda Contracts define the rules and logic that govern the behavior of
     digital assets and transactions on the retail CBDC platform.
    **Refs:** [HLD - 4.6 Solution Design/Corda Contracts](#HLD), [LLD - 6 Corda Contracts](#LLD)

  assets:
    - ID: CONTRACT_ENGINE
      type: process
      title: Contract engine
      description: |
        The contract engine is a process that evaluates the rules defined in the a contract code.

        **Refs:** [LLD - 6.3.2.3 Corda Contracts/Solution design/Detail design/Evaluation Engine](#LLD)
      inScope: true
    - ID: CONTRACT_SERVICE
      type: process
      title: Contract Serive
      description: |
        The contract service is a process that provides the contracts code to the network participants.

        **Refs:** [LLD - 6.3.2.1 Corda Contracts/Solution design/Detail design/Contract Service API](#LLD)
      inScope: true
    - ID: CON_GET_BY_ID
      type: dataflow
      title: Contract get by ID
      description: |
        The contract get by ID is a data flow that retrieves a contract by its unique identifier.

        **Refs:** [LLD - 6.3.2.1 Corda Contracts/Solution design/Detail design/Contract Service API](#LLD)
      inScope: true
    - ID: CON_EVAL_CALL
      type: dataflow
      title: Contract evaluation call
      description: |
        The contract evaluation call is a call that evaluates a contract code.

        **Refs:** [LLD - 6.3.2.3 Corda Contracts/Solution design/Detail design/Evaluation Engine](#LLD)
      inScope: true

    - ID: CON_EVAL_RESULT
      type: dataflow
      title: Contract evaluation result
      description: |
        The contract evaluation result is the result of the contract evaluation call.

        **Refs:** [LLD - 6.3.2.3 Corda Contracts/Solution design/Detail design/Evaluation Engine](#LLD)
      inScope: true



analysis: |
  While the 'contract' part of the design effectively achieves a framework for defining arbitrary rules
   it is not clear where the rules (contract) enforcement is tight to the DLT transaction itself.
   The current 'contract' design does not contribute to network consensus, and does not meet the definition of a contract -
   which is an enforceable and verifiable set of rules between two or more participants.
   The security objective [TRUSTLESS_CONTRACTS_EXECUTION](#CBUAE_PHASE2.TRUSTLESS_CONTRACTS_EXECUTION) means that a contract must be 
   enforced by the TX consensus. However the current Contract design does not meet this objective. 
   This is the main difference between a classic 'smart-contract' DLT and the current design.

  **Refs:** [HLD - 4.6 Solution Design/Corda Contracts](#HLD), [HLD - 5.3.9 Solution Analysis/Design decisions/Corda Contracts execution model](#HLD), [LLD - 1.4.7 Wallet Service implementation/Programmable wallets](#LLD)
   
    The logic example in the design: 

    ``` 
    check(transaction.value > wallet.maxPurchaseLimit){
      "payments with a value over ${wallet.maxPurchaseLimit} are not allowed"
      }
    ```

    Is not automatically guaranteed to be executed by the retail users (in this design the execution AND enforcement is delegated to the LFIs)
    Colluding LFIs could also create transactions that while being valid in the DLT (notarized) are not enforcing the (non smart)
    contract. 
    As **Corda Contract** suggest smart contract logic, a more complete design version should demonstrate how retails transaction 
    rules are enforced by the whole system without potential colluding parties, atomically etc. 
    [REF](https://docs.r3.com/en/platform/corda/4.9/enterprise/cordapps/api-transactions.html#verifying-the-transactions-contents) 

    **Refs:** [LLD - 1.4.7.3 Wallet Service implementation/Programmable wallets/Contract execution](#LLD), [LLD - 7.3.6 Corda Distributed Ledger Technology/Solution design/Contract validation](#LLD)

    <img src="img/contractSequence1.png"/>
