  - ID: THREE_SIGNER_COLLUSION
    title: Three-Signer Insider Collusion (Quorum Takeover)
    attack: |
      Three of the five signers willingly collude to approve unauthorized transactions.
      Collusion may be motivated by:

      - Financial incentive (bribery, profit-sharing from stolen assets)
      - Organizational coercion (signers in the same management chain pressured by leadership)
      - Shared interest or conflict of interest (undisclosed relationships between signers)

      Hardware wallets do not prevent this attack — colluding signers use their own legitimate
      keys to sign. The attack succeeds entirely through abuse of authorized access.

      A combined scenario is also possible: an external attacker compromises one or two keys
      and recruits or coerces additional insiders to reach the 3-of-5 threshold.

    threatType: Elevation of Privilege, Repudiation
    impactDesc: |
      Complete compromise of privileged governance for deployment and administration.

      Concrete impact scenarios (in order of severity):

      - **Double spending (higher impact, likely):** Colluding signers approve a malicious program
        upgrade that bypasses uniqueness checks, enabling double-spend of assets on Corda via the
        Solana notary.

      - **Route bridging/unbridging to attacker accounts (higher impact, unlikely but TBC):**
        Colluding signers approve program logic changes or admin state modifications to redirect
        bridging or unbridging operations to their own or accomplice-controlled Solana accounts.

      - **Add unauthorized Corda network (lower impact):** Colluding signers use admin authority
        to authorize a rogue Corda network for illegitimate notarization.

      - Repudiation risk: colluding insiders may deny intent ("I thought I was approving a
        legitimate upgrade"), making attribution and accountability difficult without strong
        audit trails and formal acceptance records.

