analysis: |
  This section contains the analysis and considerations of the threats and the security objectives that are relevant 
  to the whole system. The result of this analysis is expressed as structured threats in the following sections.
   
   <h3>Distributed nature of the Ledger</h3>
   
   Traditionally Corda networks are distributed and while the ledger is not replicated across
    all nodes, the backchain of the unspent outputs is sent to the next node and the Notary centrally
   vigilates over double spending. Notary clusters and such techniques allow for scalability.
   The current DLT design for retail CBDC differs in the sense that the central party (the Central Bank) 
   maintains the UTXO database and of course the capability to issue coins to LFI participants. For this reason 
   there is no stringent need for backchain verification. While this central database of accounts simplifies the 
   tracking of unspent/spendable coins, it changes the nature of a distributed ledger technology in a series 
   of specific ways:

   <h4>1) Trust relationships</h4>

   While traditional Corda networks are trustless with aspects of centralization (e.g. network participant onboarding
   for regulated markets, centrally managed notarization for double spending etc.),
    the retail CBDC network is more trustful: 
   
    - The retail user needs to trust the LFI and cannot directly claim a coin value to the Central Bank.
   
    - The retail user needs to trust intermediaries and the Central Bank, because they can at any time: spend, credit or change the 
    ownership of the coins (confiscation) or prioritize one payment over others etc. 
    This is a trustful model that does not offer any of the characteristics of 
    cash notes in a digital form, instead, has most of the characteristics of a bank accounting system.
    Another effect of this paradigm is the fact that p2p participants cannot directly verify a TX by signatures, they need to rely 
    and trust the LFI/intermediary.

   - Another characteristic of cash is anonymity, by design this retail CBDC does not offer anonymity. Quite the
   opposite it enables trusted parties to inspect the flow of transactions. This data is valuable and concentrated.
   This mere fact that that data exists in the Central Bank (is easy to link wallet IDs to identities) creates an incentive for attackers, including antagonistic 
   international organizations, to compromise that data.
   For the retail user, traditional cash notes remain the sole form of Central Bank money that is anonymous and trustless.

   - Contract as business rules checks with trusted parties (need enforcement, trustful model)

   Contracts as thought in this solution design are not also classic Corda Contracts, which are a form of smart contract.
   Smart contracts allow for trustless execution of business rules. This solution differs in the fact that the rules:
   
   1) Need to be enforced by third parties, trusting one or more parties that are not the participants of a P2P
   transaction. This trustful model requires, for example, that the LFI is trusted to enforce the rules. 
    Even the central bank cannot verify that two colluding LFIs are not tampering, forging, or mishandling retail 
    transactions in general (maybe due to a system corruption or security exploit of some sort); again a trustless model of 
    smart contract does not have this 'need to trust intermediaries' characteristic.

   2) There are no examples of rules other than for blocking a transaction (by failing them).
   Instead, a full smart contract system may define conditional/additional transactions
   triggered by independently verifiable events, where it is assured that dependent transactions are executed by the 
     originating one. This is not the case in this solution as designed, so far.

     In summary:

     While the design refers to retail accounts as 'wallets', to the ledger technology as 'distributed', 
     to balances as 'coins', and to validation rules as 'smart contracts' not all the main 
     characteristics defining the used terminology are always present in the designed solution.
     The solution design can still implement the functional use-cases as per the functional requirement 
     (e.g. settle retail transactions with currency issued by the central bank preventing double spending),
     it does not meet all the non-functional security requirements that are implied by the terminology used 
     , and listed in this threat model in the security objectives.

   <h3>Operational Modes</h3>

   While the final solution is intended to be distributed in some nature, the initial 
   deployment is expected to be carried out by the central bank in a Central Bank-only accessed infrastructure.
   This is a security feature as it allows the Central Bank to have full control over the initial
    deployment and to ensure that the system is deployed in a secure manner.
   LFI are expected to own their software 'nodes' and services in the final solution and 
   not only to access the retail CBDC as a service (SaaS model); this is referred to in this threat model as:
   <code>LFI-Managed Software</code>
   Initial deployments of the developing solution are expected to be carried out by
    the central bank and having the LFI access it mostly as a service in a quasi-SaaS model.
   Threats that are not applicable to the initial SaaS are marked with the condition <code>LFI-Managed Software</code>
   <h3>LFI Signing Service Access</h3>

   In this design, the LFI signing service is also accessible by the Central Bank (CB).
   This introduces a potential repudiation issue, as the CB could theoretically sign transactions on behalf of the LFI
    without their consent. 
    This access model requires robust logging, monitoring, and auditing mechanisms to ensure that any such actions are 
    transparent and traceable. Additionally,
     it is crucial to implement strict access controls and authentication measures to mitigate the risk of unauthorized use
      of the signing service by the CB or any other party.
   Note: <b>While the <code>LFI-Managed Software</code> threats are relevant to the final solution,
    they are not considered in scope for the initial deployment.</b>

  <h3>Network topology</h3>

   Hub-Spoke network is considered an availability feature as it allows for lower latency. It 
   is still not to be considered a security feature in the final solution (<code>LFI-Managed Software</code>) 
   as it does not provide any confidentiality/integrity/observability guarantee per se:
    while the central bank can monitor the volume of the encrypted traffic* it cannot force a specific
     routing. For example, two LFIs could agree to define a custom internet routing that does not pass through the hub.
   
   <b>*NOTE:</b> The CB could monitor some unencrypted traffic if the CB abuses the CA private keys and carries on a MiTM 
   (man in the middle attack), but currently the CB is not classified as an attacker in scope for this threat model.


   
