threats:

  - ID: STN_UNAUTHORISED_NOTARISATION
    title: Unauthorised Notarisation
    attack: |
      A malicious Corda participant submits a notarisation request to the Solana Notary Program even with valid transaction parameters, but without being a legitimate Notary.

    threatType: Elevation of Privilege
    impactDesc: |
      TODO: evaluate the impact of this attack. (this would be a feature of trustless notary)
    impactedSecObj:
      - REFID: LEDGER_INTEGRITY # From parent
    assets:
      - REFID: SOLANA_NOTARY_PROGRAM
      - REFID: NOTARISED_TRANSACTION_ACCOUNT_PDA
      - REFID: COMMIT_INSTRUCTION_PARAMS
      - REFID: NOTARY_AUTHORIZATION_PDA
    attackers:
      - REFID: MALICIOUS_CORDA_PARTICIPANT_STN
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:N/I:H/A:N' # High integrity impact
    fullyMitigated: true
    countermeasures:
      - ID: STN_NOTARY_AUTHENTICATION
        title: Notary Authorization via Signed instructions
        description: |
          The `commit` instruction checks if the notary public key in the PDA (#SolanaTrustedNotary.NOTARY_AUTHORIZATION_PDA)[] matches the public key of the signer of the instruction.
          If they do not match, the instruction fails, preventing unauthorised notarisation.
          The Solana Notary Program should only be callable by the Corda Notary Node, 
          preventing arbitrary PDA creation by other accounts.
          This ensures that only the Notary Node can create PDAs for notarisation, 
          preventing front-running attacks and ensuring that PDAs are created in a controlled manner.
          The notary program do not allow for other callers (e.g. Other Notaries in different Corda Networks or other participant)
          to execute calls, even if only for verification purposes.
          This relates to the (STN_PROGRAM_SINGLE_CALLER)[#STN_PROGRAM_SINGLE_CALLER] assumption.
        inPlace: true
        public: true



  - ID: DENIAL_OF_STATE_VIA_SOLANA
    title: Denial of State via Solana Notary State Disclosure
    attack: |
      This special Denial of State attack is a easier exploitable version of the Denial of State 
      in the usual Corda model of non valiating notary.
      An attacker that participates in the Corda network can query the Solana Notary Program to discover 
      which states are currently spendable, and which are not. The attacker can then craft a transaction and send it to the Trusted
      Notary Program, which will flag the token as spent. 
    threatType: Denial of Service, Tampering
    impactDesc: |
      The attacker can prevent the legitimate owner of the state to use/spend it, by marking it as spent.
      This is a special case of Denial of Service, where the attacker can prevent the legitimate 
      owner to use their own states.
    # impactedSecObj:
    #   - REFID: SPENDABLE_STATE # From parent
    assets:
      - REFID: SOLANA_NOTARY_PROGRAM
      - REFID: NOTARISED_TRANSACTION_ACCOUNT_PDA
      - REFID: SPENT_STATE_BITSET
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:H'
    fullyMitigated: true
    ticketLink: https://r3-cev.atlassian.net/browse/ENT-14870
    countermeasures:
      - ID: NOTARY_STORE_HASHED_STATE_IDS
        title: Notary Store Hashed State IDs
        description: |
          The Solana Notary Program should store only the hash of the Corda StateRef (transaction_id, output_index) instead of the full StateRef.
          This prevents an attacker from discovering the full StateRef and its spendable status.
          This coutnermeasure reduces the attack surface, as most attackers cannot discover the full 
          StateRef and its spendable status. This is still to be considered a partial mitigation.
        inPlace: false
        public: true

      - ID: HASH_LOCK_STATES
        title: Hash-Locked States
        description: |
          Using hash-locks on states can prevent them from being consumed by a 
          malicious node, as they would require the pre-image to unlock the state.
        inPlace: false # CorDapp design choice
        public: true

      - ID: FULL_VALIDATING_NOTARY
        title: Full Validating Notary
        description: |
          Using a full validating notary can prevent this attack, as the notary would 
          verify the transaction before notarising it.
        inPlace: true # CorDapp design choice
        operational: true
        operator: Corda Network operator
        public: true

  - ID: STN_DOUBLE_SPEND_VIA_PROGRAM_FLAW
    title: Double Spend via Solana Notary Program Flaw
    attack: |
      A malicious actor (e.g., compromised Corda Notary Node or direct interaction if permitted) exploits a flaw in the `commit` instruction's logic or PDA state management.
      Examples:

      1. Bypassing the check for an existing `NotarisedTransactionAccount` PDA for a re-submitted transaction, allowing re-notarisation after states are spent.
      2. Incorrectly updating or checking the `uncommitted_states_*` bitset in the `NotarisedTransactionAccount` PDA, allowing a spent state to be marked as unspent or an unspent state to be ignored.
      3. Race conditions in PDA creation or updates if not handled atomically by Solana.
    threatType: Tampering
    impactDesc: |
      Successful double-spend, violating uniqueness consensus and corrupting Corda ledger integrity. Financial loss or invalid asset duplication.
    impactedSecObj:
      - REFID: LEDGER_INTEGRITY # From parent
    assets:
      - REFID: SOLANA_NOTARY_PROGRAM
      - REFID: NOTARISED_TRANSACTION_ACCOUNT_PDA
      - REFID: SPENT_STATE_BITSET
      - REFID: COMMIT_INSTRUCTION_PARAMS
    attackers:
      - REFID: COMPROMISED_CORDA_NOTARY_NODE_STN
      - REFID: MALICIOUS_CORDA_PARTICIPANT_STN # If they can influence notary node's input
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:N/I:H/A:N' # High impact, complex attack
    fullyMitigated: true
    countermeasures:
      - ID: STN_ATOMIC_PDA_OPERATIONS
        title: Atomic PDA Operations and Checks
        description: |
          The `commit` instruction must ensure that checks for existing PDAs (for idempotency) and updates to `NotarisedTransactionAccount` PDAs (marking states spent, creating new ones) are performed atomically as per Solana's transaction model.
          Input states' PDAs are checked for the specific `output_index` bit being 1 (unspent), and then set to 0 (spent).
          New output states' PDAs are initialized with bits set to 1 for valid indices.
        inPlace: true # Design intent
        public: true
      - ID: STN_IDEMPOTENCY_CHECK
        title: Idempotency Check via PDA Existence
        description: |
          If a `NotarisedTransactionAccount` PDA for the transaction ID already exists, `commit` returns success without reprocessing, preventing errors on resubmission and accidental re-spending.
        inPlace: true # Design intent
        public: true
      - ID: STN_TIME_WINDOW_VALIDATION
        title: Time Window Validation
        description: |
          The `commit` instruction verifies `Clock::get()?.unix_timestamp` is within the Corda transaction's `time_window`.
        inPlace: true # Design intent
        public: true

  - ID: STN_INVALID_CORDA_TX_NOTARISED
    title: Invalid Corda Transaction Parameters Notarised
    attack: |
      The Notary Still needs to validate the Merrkle tree of the tranasction before calling 'commit', for example:

      1. Mismatched `component_group_hashes` provided, leading to a derived transaction ID that doesn't match the actual Corda transaction.
      2. Invalid or insufficient `corda_signatures` provided, or signatures that don't verify against the (potentially incorrect) derived transaction ID.
      3. `inputs`, `references`, or `output_hashes` that are not part of the Merkle tree whose root is the claimed transaction ID.

    threatType: Tampering, Spoofing
    impactDesc: |
      The Solana Notary Program records states as notarised which are not backed by a valid Corda transaction, leading to ledger inconsistencies, potential theft, or repudiation issues.
    impactedSecObj:
      - REFID: LEDGER_INTEGRITY # From parent
    assets:
      - REFID: SOLANA_NOTARY_PROGRAM
      - REFID: COMMIT_INSTRUCTION_PARAMS
      - REFID: CORDA_TX_SIGNATURES_FOR_SOLANA
      - REFID: NOTARISED_TRANSACTION_ACCOUNT_PDA
    attackers:
      - REFID: COMPROMISED_CORDA_NOTARY_NODE_STN
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:N/I:H/A:L' # High integrity impact
    fullyMitigated: true
    countermeasures:
      - ID: STN_MERKLE_PROOF_VERIFICATION
        title: Transaction Merkle Proof Verification
        description: |
          The Trusted Notary reconstructs the Corda transaction ID by:

          1. Serializing and hashing `inputs`, `references`, `time_window`, `output_hashes` to get their respective component group hashes (or sub-Merkle roots).
          2. Verifying these match the provided `component_group_hashes` at the correct indices.
          3. Calculating the root of the `component_group_hashes` Merkle tree to derive the transaction ID.
        inPlace: true # Design intent
        public: true
      - ID: STN_CORDA_SIGNATURE_VERIFICATION
        title: Corda Signature Verification
        description: |
          The `commit` instruction verifies each Ed25519 `CordaSignature` in `corda_signatures` against the derived Corda transaction ID.
        inPlace: true # Design intent
        public: true

  - ID: STN_DOS_AGAINST_NOTARY_PROGRAM
    title: Denial of Service against Solana Notary Program
    attack: |
      An attacker attempts to make the Solana Notary Program unavailable or excessively costly to use.
      Examples:

      1. Flooding the `commit` instructions with numerous requests, consuming Solana compute units and potentially hitting rate limits or increasing fees for legitimate users.
      2. Creating many `NotarisedTransactionAccount` PDAs, leading to rent costs or clutter.
      3. Exploiting Solana's transaction size limits by crafting transactions that are difficult for the `commit_jumbo` mechanism to handle efficiently.
    threatType: Denial of Service
    impactDesc: |
      Legitimate Corda transactions cannot be notarised, halting network activity dependent on this notary. Increased operational costs.
    impactedSecObj:
      - REFID: AVAILABILITY
    assets:
      - REFID: SOLANA_NOTARY_PROGRAM
      - REFID: CORDA_NOTARY_NODE_SOLANA # As a vector for submitting requests
      - REFID: NOTARISED_TRANSACTION_ACCOUNT_PDA # If abused for storage
    attackers:
      - REFID: MALICIOUS_CORDA_PARTICIPANT_STN
      - REFID: COMPROMISED_CORDA_NOTARY_NODE_STN
      - REFID: ATTACKER_ON_SOLANA_NETWORK_STN
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:N/I:N/A:H'
    fullyMitigated: true
    countermeasures:
      - REFID: STN_NOTARY_AUTHENTICATION # Already mitigates unauthorised requests
      - ID: STN_SOLANA_FEES_COMPUTE_LIMITS
        title: Solana Transaction Fees and Compute Limits
        description: |
          Solana's native transaction fees and compute unit limits provide a baseline defense against spam by making attacks costly.
        inPlace: true # Solana platform feature
        public: true
      - ID: STN_GC_MECHANISM
        title: Garbage Collection Mechanism
        description: |
          Garbage collection instruction that allows an administrator to clean up fully spent and expired `NotarisedTransactionAccount` PDAs, reclaiming rent and reducing state bloat. `commit` may also GC.
        inPlace: false
        public: true
      - ID: STN_JUMBO_TRANSACTION_HANDLING
        title: Jumbo Transaction Handling
        description: |
          The `commit_jumbo` instruction with `JumboCommitParametersAccount` PDAs allows processing of large Corda transactions that would exceed single Solana transaction limits.
        inPlace: false # Design intent
        public: true

  - ID: STN_UNAUTHORISED_ADMIN_ACCESS
    title: Unauthorized Administrative Access to Notary Program
    attack: |
      An attacker gains unauthorized access to administrative functions of the Solana Notary Program.
      Examples:
      1. Compromising the private key of the program administrator (Network Operator or DAO).
      2. Exploiting a flaw in the program's access control logic for admin instructions (`initialize`, `authorize_notary`, `revoke_notary`).
    threatType: Elevation of Privilege, Tampering
    impactDesc: |
      Attacker can add rogue Corda Notary Node accounts, remove legitimate ones, change critical program parameters, or disable the service.
    impactedSecObj:
      - REFID: CORDA_NETWORK_AUTH
      - REFID: LEDGER_INTEGRITY
      - REFID: AVAILABILITY
    assets:
      - REFID: SOLANA_NOTARY_PROGRAM
      - REFID: STN_ADMIN_PRIVATE_KEY # The private key for the program administrator
      # - REFID: NOTARY_DAO # If DAO controls admin key
    attackers:
      - REFID: MALICIOUS_SOLANA_PROGRAM_ADMIN_STN # If admin key is stolen by another
      - REFID: ATTACKER_ON_SOLANA_NETWORK_STN # If they can exploit a program flaw
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:L/I:H/A:H' # High impact, assumes admin key compromise
    fullyMitigated: true
    countermeasures:
      - ID: AUTH_FOR_ADMIN_FUNCTIONS
        title: Key Access Control for Admin Functions
        description: |
          The Solana Notary Program implements checks ensuring that administrative instructions (e.g. authorize_notary) can only be invoked by the designated admin accounts.
          At the STN_PROGRAM deployment time, the program creates an `ADMIN_PDA` that holds the [#STN_ADMIN_PUBLIC_KEY].
          Only the [#STN_ADMIN_PRIVATE_KEY] can sign administrative transactions.
        inPlace: true # Design intent
        public: true
      - ID: STN_SECURE_ADMIN_KEY_MANAGEMENT
        title: Secure Admin Key Management
        description: |
          The private key for the program administrator must be securely managed (e.g., using a hardware wallet, multi-sig if DAO).
        inPlace: false # Operational responsibility
        operational: true
        operator: Corda Network operator
        public: true
