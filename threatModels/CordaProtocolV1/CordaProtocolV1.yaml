scope:
  description: |
    Threat model for the Corda Protocol MVP (V1), a Solana-based tokenized vault
    implementing investment and redemption flows with integrated on-chain compliance controls.

    **Key Changes from V0:**
    - On-chain wallet whitelisting via VaultWhitelistEntry PDAs
    - Vault-native whitelist enforcement in investment and redemption entrypoints
    - Admin instructions for whitelist and account freeze/thaw management

    **Core Architecture:**
    - Vault Program: Async investments/redemptions, batch snapshot settlement,
      oracle-wrapper-backed pricing, and emergency-stop controls
    - Batch pricing split: snapshots are now sealed first, then priced via
      `set_deposit_snapshot_totals` / `set_redemption_snapshot_totals`
      with on-chain oracle tolerance checks before batch settlement
    - vToken: Vault shares held by investors and escrowed during redemptions
    - Whitelist System: PDA-based access control for vToken recipients
    - Child model split: `AsyncInvestmentFlows` owns async deposit-side proposal,
      offboard, batch-deposit, and settlement flows; `AsyncRedemptionFlows`
      owns async redemption proposal, batch-redemption, cancel, matching, and
      settlement flows

    **Current Code State Note:**

    - The standalone Liquidity Program and related sync-swap routes were removed
      from `corda-protocol-mvp` in commit `a85d60c5`.

    **Repository:** corda-protocol-mvp

  securityObjectives:
    - ID: USER_FUNDS_SAFETY
      title: User Funds Safety and Custody
      description: |
        Ensure user deposits are properly accounted for and redemptions honor settlement terms.
      group: Data Security
      treeImage: false

    - ID: INTEGRITY
      title: System Integrity
      description: |
        Ensure all system components — infrastructure, programs, and data — operate
        as intended and have not been tampered with or unauthorised.
      group: System Integrity
      treeImage: false

    - ID: PROGRAM_INTEGRITY
      title: Program Integrity and Authorization
      description: |
        Only authorized programs and signers can execute critical operations.
        Prevent unauthorized state transitions and CPI attacks.
      group: System Integrity
      treeImage: false
      contributesTo:
        - REFID: INTEGRITY

    - ID: COMPLIANCE
      title: Regulatory Compliance and Access Control
      description: |
        Enforce KYC/AML controls via on-chain whitelist to prevent unauthorized participation.
      group: Legal and Compliance
      treeImage: false

    - ID: AVAILABILITY
      title: Availability of Core Operations
      description: |
        Ensure investment and redemption operations remain accessible under normal conditions.
      group: Operational Security
      treeImage: false

    - ID: AUDITABILITY
      title: Auditability and Traceability
      description: |
        Maintain verifiable on-chain audit trail for all critical operations.
      group: Legal and Compliance
      treeImage: false

    - ID: CONFIDENTIALITY
      title: Data and Credential Confidentiality
      description: |
        Protect secrets, credentials, keys, and sensitive data from unauthorised
        disclosure across all layers of the system.
      group: Data Security
      treeImage: false

    - ID: SIGNING_TRANSACTION_INTEGRITY
      title: Signing Transaction Integrity (WYSIWYS)
      description: |
        Ensure that the transaction content approved by each signer
        accurately reflects the intended action. What the signer sees
        (via verification tools) must match what the signer signs
        (the on-chain proposal payload).
      treeImage: false
      group: System Integrity
      contributesTo:
        - REFID: INTEGRITY

  attackers:
    - ID: EXTERNAL_ATTACKER
      description: |
        Unauthenticated adversary attempting to exploit program logic, bypass whitelist,
        or manipulate account state via crafted transactions.
      inScope: true

    - ID: MALICIOUS_USER
      description: |
        Authenticated but malicious user (e.g. investor) attempting to bypass whitelist controls,
        extract unauthorized value, or violate access controls.
      inScope: true

    # - ID: COMPROMISED_ADMIN
    #   description: |
    #     Vault administrator with compromised credentials attempting to abuse
    #     whitelist management or emergency controls.
    #   inScope: true

    - ID: COMPROMISED_TOKENIZER
      description: |
        The tokenizer (asset issuer) acting maliciously or failing to fulfil
        obligations. Controls aToken minting and PermanentDelegate burn authority.
        Could withhold USDC deposits, burn incorrect aToken amounts, or default
        on settlement obligations.
      inScope: true

    - ID: UPGRADE_AUTHORITY
      description: |
        Vault Upgrade Authority. Actions: program upgrade.
      inScope: true

    - ID: PROTOCOL_CONFIG_AUTHORITY
      description: |
        Authority responsible for protocol-level vault configuration. Actions:
        transfer vault ownership, appoint/change curator, add/remove guardians,
        set vault name and symbol, set timelocks.
      inScope: true
    
    - ID: PROTOCOL_MANAGER
      description: |
        Authority responsible for protocol operations. Actions: set protocol fees,
        trigger protocol fee collection, pause vault, resume vault,
        revoke pending time-locked actions, blacklist user.
      inScope: true

    - ID: VAULT_GUARD
      description: |
        Monitors the vault and responds to suspicious activity. Actions:
        pause vault, resume vault, revoke pending time-locked actions.
      inScope: true

    - ID: VAULT_MANAGER
      description: |
        Manages vault operations via RBAC permission grants. Actions:
        pause vault, resume vault, settle investments, settle redemptions,
        transfer to tokenizer, match deposit/redemption, batch snapshot
        operations.
      inScope: true

    - ID: CURATOR_CONFIG_AUTHORITY
      description: |
        Authority responsible for curator configuration. Actions:
        configure off-ramp destination.
      inScope: true

    - ID: CURATOR
      description: |
        Settlement/operations role granted per-instruction permissions via
        RBAC. Actions: settle investments/redemptions, reject proposals,
        transfer to offboard destination, match deposit/redemption, manage
        batch snapshots, pause vault.
      inScope: true

    - ID: ACL_AUTHORITY
      description: |
        Authority controlling wallet whitelist for vToken transfers. Actions:
        whitelist users.
      inScope: true

    - ID: FREEZE_AUTHORITY
      description: |
        Authority that can freeze token accounts in response to incidents.
        Actions: not yet specified.
      inScope: true

    - ID: UNFREEZE_AUTHORITY
      description: |
        Authority that can unfreeze previously frozen token accounts.
        Actions: not yet specified.
      inScope: true

    - ID: DEVELOPER
      description: |
        Compromised developer — either a malicious insider with legitimate repository
        access or an external attacker who has compromised a developer's credentials
        (GitHub account, SSH keys, workstation access). Can push code, review/approve
        PRs, trigger Jenkins builds, and potentially access CI/CD credentials.
      inScope: true

    - ID: TOKENIZER_ISSUER
      description: |
        Asset tokenizer/issuer role. Does not exist for soft/public launch.
        Actions: TODO.
      inScope: false
    
    - ID: LIQUIDITY_POOL_MANAGER
      description: |
        Legacy manager role for the removed Liquidity Program. Retained only as
        a historical attacker identifier for traceability.
      inScope: false

    - ID: SIGNER_COMMITTEE
      description: |
        Organisational body responsible for managing the humans behind
        multisig signing keys. Covers key custody, rotation ceremonies,
        signer onboarding/offboarding, succession planning, hardware
        wallet procurement, and signer identity protection. Not an
        on-chain entity — operates the governance layer above the
        individual signing roles.
      inScope: false

  assets:
    - ID: VAULT_PROGRAM
      type: system
      title: Vault Program
      description: |
        On-chain program managing proposal flows, settlements, whitelist controls,
        pause and emergency-stop state, and oracle-backed pricing consumption.
        Program ID: EMDZftqHQgUkj2WB5zGDsGdShWu2GKG8qkhq8AwwSGxa
      inScope: true

    - ID: VTOKEN_MINT
      type: credential
      title: vToken Mint (Vault Shares)
      description: |
        SPL token mint representing vault shares.
      inScope: true

    - ID: WHITELIST_ENTRY_PDA
      type: system
      title: VaultWhitelistEntry PDA
      description: |
        PDA storing whitelist status per (vtoken_mint, owner) pair.
        Seeds: ["vault_whitelist_entry", vtoken_mint, owner]
      inScope: true

    - ID: INVESTOR_VTOKEN_ACCOUNT
      type: system
      title: Investor vToken Account
      description: |
        SPL token account holding investor vault shares.
      inScope: true

    - ID: DF_INVESTMENT_SETTLEMENT
      type: dataflow
      title: Investment Settlement Flow
      description: |
        Curator settles an accepted investment proposal, minting vTokens to the
        whitelisted investor at the current vault price.
      inScope: true

    - ID: DF_WHITELIST_MANAGEMENT
      type: dataflow
      title: Whitelist Management Flow
      description: |
        Admin adds/removes wallets from vToken whitelist and can freeze/thaw accounts.
      inScope: true

    # --- Deployed Programs ---

    - ID: RBAC_PROGRAM
      type: system
      title: RBAC Program
      description: |
        On-chain program that mediates all privileged vault operations via a
        per-instruction permission table. Holds a VaultAuthority PDA that
        becomes the vault's sole `authority`. Each vault instruction discriminator
        maps to an allowed signer pubkey; the RBAC program verifies the signer
        then CPIs into the vault with PDA authority seeds.
        Program ID: 4nuAcGWtRWa6gTN1kc9jEX5u3HmbbnnZZ9u8wW8FKJPs
      inScope: true

    - ID: LIQUIDITY_PROGRAM
      type: system
      title: Liquidity Program (Removed)
      description: |
        Legacy on-chain program that previously provided instant sync swaps and
        vault CPI routing. Removed from `corda-protocol-mvp` in commit `a85d60c5`.
        Program ID: AYjrCpUAH2iPsyPykFvQhmPMcReotps8mX4moFY2DDkK
      inScope: false

    - ID: ORACLE_WRAPPER_PROGRAM
      type: system
      title: Oracle Wrapper Program
      description: |
        On-chain program that wraps the configured price feed and exposes
        `fetch_price` to vault instructions.
        Program ID: HExrWEj2rBHut6KJjsRSmP1WxWA1BtVRmSf3FmPcJcob
      inScope: true

    # --- Vault Program State (PDAs) ---

    - ID: VAULT_PDA
      type: system
      title: Vault PDA
      description: |
        Core vault state account holding all configuration: authority, mints,
        fee parameters, pause and emergency-stop flags, pinned fee and offboard
        destinations, oracle-wrapper addresses, pending balance tracking,
        compliance_authority, `price_tolerance_bps`, and monitoring counters.
        The `authority` field (formerly separate `admin`/`curator` fields) is
        expected to be set to the RBAC program's VaultAuthority PDA after
        bootstrap via `set_authority`.
        Seeds: [b"vault", usdc_mint]
      inScope: true

    - ID: VAULT_AUTHORITY_PDA
      type: system
      title: VaultAuthority PDA (RBAC)
      description: |
        Zero-copy PDA owned by the RBAC program. Stores the per-instruction
        permission table (`permissions: [Pubkey; 64]`), RBAC admin pubkey,
        and rent-destination address. Each vault instruction discriminator
        maps to one allowed signer.
        Seeds: [b"vault_authority", vault.key()]
      inScope: true

    - ID: ORACLE_WRAPPER_CONFIG_PDA
      type: system
      title: Oracle Wrapper Config PDA
      description: |
        Wrapper configuration account pinned from the vault at initialization.
        Stores the selected feed address, wrapper admin, test-mode flag, and
        staleness threshold used by `fetch_price`.
      inScope: true

    - ID: VTOKEN_PRICE_FEED_ACCOUNT
      type: system
      title: vToken Price Feed Account
      description: |
        Feed account read through the oracle wrapper for live vToken pricing.
        This may be a production oracle feed or a local test-mode feed account,
        depending on wrapper configuration.
      inScope: true

    - ID: INVESTMENT_PROPOSAL_PDA
      type: system
      title: InvestmentProposal PDA
      description: |
        Tracks investment proposal state (Pending → Accepted/Rejected → Settled/Cancelled).
        Seeds: [b"investment_proposal", vault, investor, proposal_id]
      inScope: true

    - ID: REDEMPTION_PROPOSAL_PDA
      type: system
      title: RedemptionProposal PDA
      description: |
        Tracks redemption state (Pending/Cancelled/Settled). vTokens are escrowed
        at creation and can be returned on cancellation while pending.
        Seeds: [b"redemption_proposal", vault, investor, proposal_id]
      inScope: true

    # --- Liquidity Pool State ---

    - ID: LIQUIDITY_POOL_PDA
      type: system
      title: LiquidityPool PDA (Removed)
      description: |
        Legacy liquidity pool state PDA from the removed Liquidity Program.
        Retained in the model only for historical traceability.
        Seeds: [b"pool", ...]
      inScope: false

    - ID: INVESTOR_SYNC_USAGE_PDA
      type: system
      title: InvestorSyncUsage PDA (Removed)
      description: |
        Formerly tracked rolling 24h per-investor daily sync swap limits.
        Removed — daily limit enforcement moved to the indexer.
        Seeds: [b"sync_usage", ...]
      inScope: false

    # --- Token Mints ---

    - ID: ATOKEN_MINT
      type: credential
      title: External Reference Asset Mint
      description: |
        Legacy reference to an external fund or underlying asset mint used by
        earlier vault designs. The current proposal-based flow does not custody
        this asset directly inside the vault program.
      inScope: false

    - ID: RECEIPT_TOKEN_MINT
      type: credential
      title: Legacy Receipt Token Mint
      description: |
        Legacy receipt-token mint from the superseded receipt-based investment
        flow. Current investment proposals do not mint receipt tokens.
      inScope: false

    - ID: USDC_MINT
      type: credential
      title: USDC Mint
      description: |
        Stablecoin mint used for investments and redemptions.
      inScope: false

    # --- Token Accounts (ATAs) ---

    - ID: USDC_VAULT_ATA
      type: system
      title: Vault USDC Account (ATA)
      description: |
        Vault's USDC token account. Receives investor deposits, sends USDC to
        tokenizer and to investors at redemption. MemoTransfer extension.
      inScope: true

    - ID: ATOKEN_VAULT_ATA
      type: system
      title: Legacy External Asset Account Reference
      description: |
        Legacy vault token-account reference from the earlier underlying-asset
        custody design. The current proposal-based flow does not use this
        account for settlement.
      inScope: false

    - ID: INVESTOR_RECEIPT_TOKEN_ACCOUNT
      type: system
      title: Legacy Investor Receipt Token Account (ATA)
      description: |
        Legacy investor token account from the superseded receipt-token flow.
        Current investment proposals no longer mint or freeze receipt tokens.
      inScope: false

    - ID: INVESTOR_USDC_ACCOUNT
      type: system
      title: Investor USDC Account (ATA)
      description: |
        Source for investments, destination for redemptions.
      inScope: true

    - ID: VTOKEN_VAULT_ATA
      type: system
      title: Vault vToken Escrow Account (ATA)
      description: |
        Vault's vToken escrow account. Holds investor vTokens locked during
        pending redemption proposals. vTokens are transferred here at proposal
        creation and burned at settlement.
      inScope: true

    - ID: TOKENIZER_USDC_ATA
      type: system
      title: Offboard Destination USDC Account (ATA)
      description: |
        External USDC token account pinned as `vault.offboard_destination`.
        `transfer_to_tokenizer` sends vault USDC only to this address.
        Pinning prevents a compromised authority from redirecting funds.
        Updated via `update_vault_config` (authority-gated).
      inScope: true

  assumptions:
    - ID: ADMIN_TRUST_BOUNDARY
      description: |
        Vault admin has authority to manage whitelist but is assumed to follow
        operational procedures. Compromise of admin keys is in-scope threat.

    - ID: TOKEN_PROGRAM_TRUST
      description: |
        SPL token program behavior is assumed correct.
        Bugs in token program internals are out of scope.

analysis: |
  This V1 threat model focuses on the newly implemented access control mechanisms:

  **Key Attack Surfaces:**
  1. Whitelist bypass attempts during settlement
  2. Unauthorized whitelist modification
  3. Whitelist PDA validation logic
  4. Admin credential compromise
  5. Freeze/thaw operational misuse

  **Analysis Approach:**
  - STRIDE analysis on whitelist management and settlement flows
  - Access control validation at each enforcement point
  - Admin privilege escalation scenarios

  **Architecture Diagrams**

  <a id="architecture"></a>
  **System Architecture Overview**

  <object type="image/svg+xml" data="img/architecture.svg" style="width:100%; height:auto;">
  <img src="img/architecture.svg"/>
  </object>

  <a id="vaultDataModel"></a>
  **Vault Data Model (Complete)**

  <object type="image/svg+xml" data="img/vaultDataModel.svg" style="width:100%; height:auto;">
  <img src="img/vaultDataModel.svg"/>
  </object>

  <a id="vaultDataModel"></a>
  **Vault Data Model: Curator Settle Redemption**

  <object type="image/svg+xml" data="img/vaultDataModel-curator-settleRedemption.svg" style="width:100%; height:auto;">
  <img src="img/vaultDataModel-curator-settleRedemption.svg"/>
  </object>

  **Flow Diagrams**

  <a id="investmentSettlement"></a>
  **Investment Settlement Flow (with Whitelist Enforcement)**

  This diagram shows the critical settlement flow where whitelist validation occurs.
  Note: whitelist is checked at **proposal creation time only** — it is NOT re-checked
  at settle, match, batch, or cancel. Removal after creation freezes the investor's
  vToken account via the ACL Gate mechanism.

  <object type="image/svg+xml" data="img/investmentSettlement.svg" style="width:100%; height:auto;">
  <img src="img/investmentSettlement.svg"/>
  </object>

  <a id="whitelistManagement"></a>
  **Whitelist Management Flow**

  Admin operations for adding and removing investors from the whitelist, including the
  freeze/thaw mechanics.

  <object type="image/svg+xml" data="img/whitelistManagement.svg" style="width:100%; height:auto;">
  <img src="img/whitelistManagement.svg"/>
  </object>

  <a id="aclGateValidation"></a>
  **Whitelist and Account Control Validation**

  Detailed view of whitelist entry validation and admin freeze/thaw controls
  in the current vault code path.

  <object type="image/svg+xml" data="img/aclGateValidation.svg" style="width:100%; height:auto;">
  <img src="img/aclGateValidation.svg"/>
