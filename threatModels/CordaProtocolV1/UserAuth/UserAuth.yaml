ID: UserAuth
schemaVersion: 2
title: RBAC and User Authorization
status: Draft
authors: |
  Security Research team at R3
parent: CordaProtocolV1
scope:
  description: |
    Threat model for the authorization and signing authority design of the
    Corda Protocol V1.

    This model focuses on the roles, their signature schemes, and the
    security trade-offs between availability and security in the multisig /
    timelock design.

    **On-Chain Enforcement — RBAC Program:**

    The vault program uses a single `authority` field (a PDA) rather than
    multiple embedded role fields. An external RBAC program
    (`4nuAcGWtRWa6gTN1kc9jEX5u3HmbbnnZZ9u8wW8FKJPs`) holds a
    VaultAuthority PDA with a `permissions[64]` table mapping each vault
    instruction discriminator to a specific allowed signer pubkey. The RBAC
    admin can grant/revoke per-instruction permissions, enabling fine-grained
    role separation at the program level.

    **Scope Boundary:**
    This model covers threats to the signing authorities themselves — key
    management, operational security, collusion, supply chain, and availability.
    Program-level vulnerabilities and on-chain logic bugs are covered in sibling
    models (SolanaProgramsLifecycle, AsyncInvestmentFlows, AsyncRedemptionFlows).

    **Approach:**
    Roles are modeled as credential assets with signature scheme properties.
    Cross-cutting threats are defined once by category and reference applicable
    roles. Role-specific threats are defined separately where the attack surface
    is materially unique.
  assets:
    - ID: VAULT_UPGRADE_AUTHORITY_KEYS
      type: credential
      title: Vault Upgrade Authority Signing Keys
      description: |
        Authority for program upgrades. Highest security tier.

        **Actions:** Program upgrade

        **Signature:** 4 out of 7; keys in cold storage; timelock not applicable
      inScope: true
      properties:
        threshold: 4 of 7
        storage: cold
        timelock: N/A
        actions: Program upgrade
    - ID: PROTOCOL_CONFIG_AUTHORITY_KEYS
      type: credential
      title: Protocol Config Authority Signing Keys
      description: |
        Authority for protocol-level vault configuration.

        **Actions:** Transfer vault ownership, appoint/change curator,
        add/remove guardians, set vault name and symbol, set timelocks

        **Signature:** 3 out of 5; 24h timelock
      inScope: true
      properties:
        threshold: 3 of 5
        storage: cold
        timelock: 24h
        actions: Transfer vault ownership, appoint/change curator, add/remove guardians, set vault name/symbol, set timelocks
    - ID: CURATOR_CONFIG_AUTHORITY_KEYS
      type: credential
      title: Curator Config Authority Signing Keys
      description: |
        Authority for curator configuration.

        **Actions:** Configure off-ramp destination

        **Signature:** 3 out of 5; 24h timelock
      inScope: true
      properties:
        threshold: 3 of 5
        storage: cold
        timelock: 24h
        actions: Configure off-ramp destination
    - ID: PROTOCOL_MANAGER_KEYS
      type: credential
      title: Protocol Manager Signing Keys
      description: |
        Authority for protocol operations. Mixed signature requirements per action.

        **Actions and Signatures:**

        - Set protocol fees: 2 out of 5; 1h timelock
        - Trigger protocol fee collection: single signature; no timelock
        - Pause vault: single signature; no timelock (break-glass)
        - Resume vault: 2 out of ?; timelock ?
        - Revoke pending time-locked actions: single signature; no timelock (break-glass)
        - Blacklist user: not specified
      inScope: true
      properties:
        thresholdRange: 1 to 2 of 5 (varies per action)
        storage: hot/warm
        timelockRange: 0 to 1h (varies per action)
        breakGlassActions: Pause vault, Revoke pending time-locked actions
    - ID: VAULT_MANAGER_KEYS
      type: credential
      title: Vault Manager Signing Keys
      description: |
        Manages vault operations and co-signs with Curator.

        **Actions and Signatures:**

        - Trigger offramp: single signature; no timelock
        - Blacklist user: not specified
        - Pause vault: single signature; no timelock (break-glass)
        - Resume vault: 2 out of ?; timelock ?
        - Settle subscription: 2 signatures (Curator + Vault Manager); 1h timelock; automated plausibility check
        - Settle redemption: 2 signatures; 1h timelock; automated plausibility check
        - Override settlement blocked by plausibility check: 2 out of 3; 4h timelock
      inScope: true
      properties:
        thresholdRange: 1 to 2 (varies per action; dual-sign with Curator for settlements)
        storage: hot/warm
        timelockRange: 0 to 4h (varies per action)
        breakGlassActions: Pause vault
        separationOfDuties: Dual-sign with Curator for settlements and overrides
    - ID: CURATOR_KEYS
      type: credential
      title: Curator Signing Keys
      description: |
        Manages curator operations and co-signs with Vault Manager.

        **Actions and Signatures:**

        - Set curator fees: 2 out of 5; 1h timelock
        - Trigger offramp: single signature; no timelock
        - Trigger curator fee collection: single signature; no timelock
        - Pause vault: single signature; no timelock (break-glass)
        - Settle subscription/redemption: 2 signatures (Curator + Vault Manager); 1h timelock; plausibility check
        - Override settlement blocked by plausibility check: 2 out of 3; 4h timelock
      inScope: true
      properties:
        thresholdRange: 1 to 2 of 5 (varies per action; dual-sign with Vault Manager for settlements)
        storage: hot/warm
        timelockRange: 0 to 4h (varies per action)
        breakGlassActions: Pause vault
        separationOfDuties: Dual-sign with Vault Manager for settlements, AUM updates, overrides
    - ID: VAULT_GUARD_KEYS
      type: credential
      title: Vault Guard Signing Keys
      description: |
        Monitors the vault and responds to suspicious activity.
        Primarily a reactive/emergency role.

        **Actions and Signatures:**

        - Pause vault: single signature; no timelock (break-glass)
        - Resume vault: 2 out of ?; timelock ?
        - Revoke pending time-locked actions: single signature; no timelock (break-glass)
      inScope: true
      properties:
        thresholdRange: 1 to 2 (varies per action)
        storage: hot/warm
        breakGlassActions: Pause vault, Revoke pending time-locked actions
        sla: reactive
    - ID: FREEZE_AUTHORITY_KEYS
      type: credential
      title: Freeze Authority Signing Keys
      description: |
        Can freeze token accounts in response to incidents.
        Action not specified in actions table.

        **Signature:** 1 of N; 4h SLA
      inScope: true
      properties:
        threshold: 1 of N
        storage: hot
        timelock: N/A
        sla: 4h
    - ID: UNFREEZE_AUTHORITY_KEYS
      type: credential
      title: Unfreeze Authority Signing Keys
      description: |
        Can unfreeze previously frozen token accounts.
        Action not specified in actions table.

        **Signature:** 2 of N (N >= 3); 72h SLA
      inScope: true
      properties:
        threshold: 2 of N (N >= 3)
        storage: cold
        timelock: N/A
        sla: 72h
    - ID: ACL_AUTHORITY_KEYS
      type: credential
      title: ACL Authority Signing Key
      description: |
        Controls wallet whitelist for vToken transfers.
        Online accessible key with manual vault unsealing fallback.

        **Actions:** Whitelist users

        **Signature:** 1 of 1; online accessible; manual vault unsealing
        with 1d SLA (multisign) or automated (role-limited)
      inScope: true
      properties:
        threshold: 1 of 1
        storage: online
        timelock: Azure Secret Manager, automatically unsealed
        sla: 1d (manual unsealing)
    - ID: RBAC_ADMIN_KEYS
      type: credential
      title: RBAC Admin Signing Keys
      description: |
        Authority controlling the VaultAuthority PDA's permission table.
        Can grant or revoke per-instruction permissions for any vault operation.

        **Actions:** set_vault_ix_permission, set_vault_authority_admin,
        set_rent_destination

        **Signature:** Single signer (expected to be rotated to a multisig
        or governance PDA)
      inScope: true
      properties:
        threshold: 1 of 1 (default; rotatable via set_vault_authority_admin)
        storage: hot/warm
        timelock: N/A
        actions: Grant/revoke per-instruction permissions, rotate RBAC admin
    - ID: VAULT_AUTHORITY_PDA_ASSET
      type: credential
      title: VaultAuthority PDA (RBAC Permission Table)
      description: |
        Zero-copy PDA owned by the RBAC program. Stores per-instruction
        permission grants (permissions[64] array), the RBAC admin pubkey,
        and rent-destination address. Acts as the vault's sole `authority`.

        Seeds: [b"vault_authority", vault.key()]
      inScope: true
      properties:
        location: On-chain PDA (RBAC program-owned)
        format: Zero-copy account (~2KB)
        permissionSlots: 64 (indexed by vault instruction discriminator)
  assumptions:
    - ID: SQUADS_V4_MULTISIG
      description: |
        All multisig roles in this model are assumed to be implemented using
        Squads Protocol v4 (Solana-native multisig).

        **Dual-Threshold System:**
        Squads v4 distinguishes two threshold types per multisig:

        - **Vault Threshold (Operational):** Governs asset movement, DeFi
          interactions, and general operational instructions.
        - **Config Threshold (Governance):** Governs changes to the multisig
          itself — adding/removing members, changing thresholds, upgrading
          the program. Typically set higher than the vault threshold.

        **Permissions and Roles:**
        Squads v4 supports granular per-member permissions:

        - **Proposer:** Can only create proposals.
        - **Voter:** Can vote on proposals.
        - **Executor:** Can execute a proposal once the threshold is met.
        - **Owner:** Holds all of the above permissions.

        This allows configurations where a broad group can propose and vote on
        operational spending, but only a subset with sufficient Config Threshold
        consensus can change the membership or governance rules.

        Squads v4 is assumed to execute correctly; bugs in the Squads program
        itself are out of scope for this model. However, the **configuration and
        operational use** of Squads (membership management, threshold choices,
        permission assignments, and access control over governance changes) are
        in scope.
analysis: |
  **Signing Authority Design Overview**

  The Corda Protocol V1 uses a role-based authorization model where different
  roles have different signature schemes (threshold, timelock, storage) based
  on the security-versus-availability trade-off for each action.

  **On-Chain RBAC Enforcement Layer:**

  The vault program itself holds a single `authority` field (expected to be
  the RBAC program's VaultAuthority PDA). The RBAC program
  (`4nuAcGWtRWa6gTN1kc9jEX5u3HmbbnnZZ9u8wW8FKJPs`) enforces per-instruction
  access control: each vault instruction discriminator (0–31) maps to a
  specific allowed signer in the `permissions[64]` table. When a privileged
  vault operation is requested, the RBAC program verifies
  `permissions[discriminator] == signer.key()` and then CPIs into the vault
  using PDA authority seeds. This fail-closed design (all permissions default
  to zero/uncallable) replaces the former embedded `admin`/`curator` role
  fields in the vault account.

  The RBAC admin (single key by default, rotatable via
  `set_vault_authority_admin`) is the governance authority that can assign
  different signers to different instruction slots. This enables mapping the
  logical role model (Protocol Manager, Curator, Vault Guard, etc.) to on-chain
  permissions without modifying the vault program.

  **Security Tiers:**

  - **Tier 1 — High Security / Low Availability:** Vault Upgrade Authority
    (4/7, cold), Protocol Config Authority (3/5, 24h timelock), Curator Config
    Authority (3/5, 24h timelock), Unfreeze Authority (2/N, 72h SLA)
  - **Tier 2 — Mixed:** Protocol Manager, Vault Manager, Curator — per-action
    signature requirements ranging from single-sig break-glass to 2-of-5 with
    timelocks
  - **Tier 3 — High Availability / Lower Security:** Vault Guard (reactive,
    break-glass), Freeze Authority (1/N, 4h SLA), ACL Authority (1/1, online)

  **Threat Modeling Approach:**

  Cross-cutting threats (key theft, wrong action, collusion, supply chain,
  etc.) are modeled once by category and reference all applicable role assets.
  Role-specific threats are added where the attack surface is materially unique
  (e.g., upgrade disclosure, settlement front-running, break-glass abuse).

  **Separation of Duties:**

  Settlement operations (subscribe, redeem) require dual
  signatures from both Curator and Vault Manager, providing separation of
  duties. Override of plausibility-check blocks requires 2-of-3 with 4h
  timelock.

  **Timelock + Monitoring Pattern:**

  High-impact configuration changes use timelocked signatures combined with
  external monitoring/alerting and manual circuit breakers (watchtowers). This
  pattern introduces its own attack surface (watchtower DoS/compromise)
  addressed in SIGNER_AVAILABILITY_DOS.

  **Multisig Platform — Squads Protocol v4:**

  All multisig roles use Squads v4, which provides a dual-threshold system:

  - **Vault Threshold (Operational):** Controls day-to-day actions (asset
    transfers, settlements, fee collection). Set per role based on the
    security tier.
  - **Config Threshold (Governance):** Controls membership changes, threshold
    modifications, and program upgrades. Should be set strictly higher than the
    vault threshold for every multisig to prevent operational-level compromise
    from escalating to governance takeover.

  Squads v4 also supports per-member permissions (Proposer, Voter, Executor,
  Owner), enabling fine-grained separation: e.g., operational staff can propose
  and execute but only Owners can vote on config changes. The correct
  configuration of these thresholds and permissions is critical — see
  MULTISIG_MEMBERSHIP_HIJACK.
threats:
  - ID: SIGNING_KEY_THEFT
    title: Signing Key Theft or Compromise
    attack: |
      Attacker obtains signing keys for one or more role holders through:

      - Physical theft of hardware wallet devices
      - PIN compromise via shoulder-surfing, social engineering, or hardware hacking
      - Seed phrase (24-word backup) exfiltration via phishing or physical theft
      - Compromise of key storage infrastructure (HSM, vault, encrypted storage)
      - Malware on signing devices capturing key material

      Risk varies by role storage model:

      - **Highest risk:** ACL Authority (online key, single signer) — single point of failure
      - **High risk:** Freeze Authority, Vault Guard (hot keys, low threshold)
      - **Medium risk:** Protocol Manager, Vault Manager, Curator (mixed hot/warm)
      - **Lower risk:** Vault Upgrade Authority, Protocol Config Authority, Curator Config Authority, Unfreeze Authority (cold storage, high thresholds)

      For multisig roles, stealing a single key is insufficient — attacker must
      compromise enough keys to meet threshold. For single-sig roles (ACL
      Authority, Freeze Authority for break-glass), one key theft is sufficient.
    threatType: Spoofing, Information Disclosure
    impactDesc: |
      Attacker can impersonate the role holder and execute any action permitted
      by that role. Impact severity depends on the role's blast radius:

      - **Vault Upgrade Authority:** Deploy malicious program upgrade (requires 4 keys)
      - **Protocol Config Authority:** Transfer vault ownership, change curator (requires 3 keys)
      - **Protocol Manager:** Pause vault (single key), set fees (2 keys)
      - **Vault Manager / Curator:** Trigger offramp (single key), manipulate settlements (2 keys)
      - **ACL Authority:** Whitelist unauthorized wallets for vToken transfers (single key)
      - **Freeze Authority:** Freeze legitimate user accounts (single key)
    impactedSecObj:
      - REFID: INTEGRITY
      - REFID: CONFIDENTIALITY
      - REFID: USER_FUNDS_SAFETY
    attackers:
      - REFID: EXTERNAL_ATTACKER
    assets:
      - REFID: VAULT_UPGRADE_AUTHORITY_KEYS
      - REFID: PROTOCOL_CONFIG_AUTHORITY_KEYS
      - REFID: CURATOR_CONFIG_AUTHORITY_KEYS
      - REFID: PROTOCOL_MANAGER_KEYS
      - REFID: VAULT_MANAGER_KEYS
      - REFID: CURATOR_KEYS
      - REFID: VAULT_GUARD_KEYS
      - REFID: FREEZE_AUTHORITY_KEYS
      - REFID: UNFREEZE_AUTHORITY_KEYS
      - REFID: ACL_AUTHORITY_KEYS
    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:N
    fullyMitigated: false
    ticketLink: https://r3-cev.atlassian.net/browse/PROT-854
    countermeasures:
      - ID: COLD_STORAGE
        title: Cold Storage for High-Value Keys
        description: |
          Store signing keys for high-security roles (Vault Upgrade Authority,
          Protocol Config Authority, Curator Config Authority, Unfreeze
          Authority) in offline/air-gapped hardware wallets.

          - Keys never touch internet-connected devices
          - QR code or SD card transfer for transaction signing
          - Eliminates remote key extraction attack vectors
        inPlace: true
        public: true
        operational: false
      - ID: HARDWARE_WALLETS
        title: Hardware Wallet Enforcement
        description: |
          All role signing keys must be stored on dedicated hardware wallets
          (e.g., Ledger, Trezor, Keystone). No software wallets or browser
          extensions.

          - PIN protection with limited retry attempts
          - Secure element for key storage
          - Tamper-evident physical design
        inPlace: true
        public: true
        operational: false
      - ID: MULTISIG_THRESHOLD
        title: Multisig Threshold Requirements
        description: |
          High-value roles require multiple signers to meet threshold, making
          single-key theft insufficient:

          - Vault Upgrade Authority: 4 of 7
          - Protocol Config / Curator Config Authority: 3 of 5
          - Unfreeze Authority: 2 of N (N >= 3)
          - Settlement operations: 2 signatures (Curator + Vault Manager)

          Single-key theft only compromises: ACL Authority, Freeze Authority,
          and break-glass actions (pause, revoke).
        inPlace: true
        public: true
        operational: false
      - ID: TSS_MPC_OPTIONAL
        title: Optional TSS/MPC for Online Keys
        description: |
          For roles with online keys (ACL Authority), consider Threshold
          Signature Schemes (TSS) or Multi-Party Computation (MPC) to eliminate
          single-key existence:

          - Key is sharded across parties; no single complete key ever exists
          - Hides signer identity and threshold on-chain
          - Reduces key theft surface for always-online signing
          - Trade-off: loses on-chain non-repudiation; requires off-chain audit trail
        inPlace: false
        public: true
        operational: false
  - ID: WRONG_ACTION_SIGNING
    title: Legitimate Signer Approves Incorrect or Malicious Action
    attack: |
      A legitimate signer signs an action that is wrong, malicious, or
      unintended due to:

      - **Phishing / compromised UI:** Attacker presents a fake transaction or
        modified UI that misrepresents the action being signed
      - **Mistake / approval overload:** Signer approves without adequate review
        due to fatigue, time pressure, or high volume of signing requests
      - **Opaque signatures:** Signer cannot understand what the transaction
        actually does (e.g., signing a hash without human-readable context)
      - **Long-lived multisig flows:** In multi-step multisig signing, the
        context or intent may drift between the first and last signer (see also
        STALE_SIGNATURE_CONTEXT)

      Affects all roles. Higher risk for roles with high action frequency
      (Vault Manager, Curator, Protocol Manager) and for single-signature
      actions where there is no second signer to catch errors.
    threatType: Tampering
    impactDesc: |
      Incorrect state change executed on-chain with legitimate authorization:

      - Wrong fee parameters set (Protocol Manager, Curator)
      - Incorrect AUM update affecting NAV calculations (Vault Manager + Curator)
      - Wrong off-ramp destination configured (Curator Config Authority)
      - Unauthorized wallet whitelisted (ACL Authority)
      - Vault paused unnecessarily, disrupting operations (any role with pause)
      - Wrong guardian appointed or removed (Protocol Config Authority)
    impactedSecObj:
      - REFID: INTEGRITY
      - REFID: USER_FUNDS_SAFETY
    attackers:
      - REFID: UPGRADE_AUTHORITY
      - REFID: PROTOCOL_CONFIG_AUTHORITY
      - REFID: PROTOCOL_MANAGER
      - REFID: VAULT_GUARD
      - REFID: VAULT_MANAGER
      - REFID: CURATOR_CONFIG_AUTHORITY
      - REFID: CURATOR
      - REFID: ACL_AUTHORITY
      - REFID: FREEZE_AUTHORITY
      - REFID: UNFREEZE_AUTHORITY
    assets:
      - REFID: VAULT_UPGRADE_AUTHORITY_KEYS
      - REFID: PROTOCOL_CONFIG_AUTHORITY_KEYS
      - REFID: CURATOR_CONFIG_AUTHORITY_KEYS
      - REFID: PROTOCOL_MANAGER_KEYS
      - REFID: VAULT_MANAGER_KEYS
      - REFID: CURATOR_KEYS
      - REFID: VAULT_GUARD_KEYS
      - REFID: FREEZE_AUTHORITY_KEYS
      - REFID: UNFREEZE_AUTHORITY_KEYS
      - REFID: ACL_AUTHORITY_KEYS
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:H/A:N
    fullyMitigated: false
    ticketLink: https://r3-cev.atlassian.net/browse/PROT-879
    countermeasures:
      - ID: TX_SIMULATION_PREVIEW
        title: Transaction Simulation and Human-Readable Preview
        description: |
          Before signing, display a decoded summary of the action including:

          - Human-readable description of state changes
          - Simulation of transaction effects (balance changes, account modifications)
          - Comparison with expected/intended outcome
          - Clear warning for high-impact actions

          Counters opaque signature attacks and reduces approval mistakes.
        inPlace: false
        public: true
        operational: false
      - ID: OFFCHAIN_AUDIT_TRAIL
        title: Off-Chain Audit Trail
        description: |
          Log and preserve for all signing operations:

          - Proposal justification and business context
          - Signer communication and approval rationale
          - Timestamps and sequence of approvals
          - Transaction simulation results at time of signing

          Complements on-chain transaction record for forensics,
          non-repudiation, and post-incident review. Required for TSS/MPC
          schemes which lack on-chain signer attribution.
        inPlace: false
        public: true
        operational: true
      - ID: TIMELOCKED_ACTIONS
        title: Timelocked Actions with Monitoring and Circuit Breaker
        description: |
          High-impact actions use timelocked signatures, providing a window for
          detection and intervention:

          - Protocol Config / Curator Config Authority: 24h timelock
          - Set fees (Protocol Manager, Curator): 1h timelock
          - Settlements / AUM updates: 1h timelock with automated plausibility check
          - Override blocked settlements: 4h timelock

          Combined with:

          - External monitoring/alerting for pending timelocked actions
          - Watchtower service to detect and alert on suspicious proposals
          - Manual circuit breaker (revoke pending actions via break-glass)
          - Redundant/anonymous watchtowers to avoid single point of failure
          - Dead-man's switch: if watchtower stops heartbeating, system freezes (fail-closed)
        inPlace: true
        public: true
        operational: true
      - ID: PLAUSIBILITY_CHECKS
        title: Automated Plausibility Checks for Settlements
        description: |
          Automated on-chain validation for settlement operations:

          - Settle subscription, settle redemption require passing
            plausibility checks before execution
          - Override of blocked settlements requires escalated threshold
            (2 of 3) and longer timelock (4h)
        inPlace: true
        public: true
        operational: false
      - ID: OUT_OF_BAND_TX_VERIFICATION
        title: Out-of-Band Transaction Verification on Separate Device
        description: |
          Before signing, each signer independently verifies the transaction
          on a separate device (e.g., mobile phone) that is not part of the
          signing workflow:

          - **Independent TX lookup:** Signer retrieves the transaction ID on a
            separate device and fetches the decoded transaction from an
            independent RPC endpoint
          - **Independent simulation:** Signer runs a transaction simulation on
            the separate device to verify expected state changes (balance deltas,
            account modifications, program interactions)
          - **Cross-check with signing UI:** Compare the decoded transaction and
            simulation results from the separate device against what the signing
            UI displays; any discrepancy indicates UI tampering
          - **Device diversity:** The verification device should be a different
            type (e.g., mobile vs. desktop) and different OS to reduce the
            chance that the same supply chain compromise affects both

          This counters compromised signing UIs, phishing overlays, and supply
          chain attacks on the primary signing tool. Even if the signing device
          or software is compromised, the separate verification device provides
          an independent view of the actual transaction content.
        inPlace: false
        public: true
        operational: true
        operator: Signer
  - ID: SIGNER_COLLUSION
    title: Signer Collusion to Bypass Trust Distribution
    attack: |
      Multiple signers within a multisig scheme collude to execute unauthorized
      actions while legitimately meeting the signature threshold. Collusion
      scenarios:

      - **Bribery:** External party bribes enough signers to meet threshold
      - **Shared interests:** Signers have undisclosed common financial interests
        or corporate control overlap
      - **Corporate control:** Multiple signer slots controlled by the same
        legal entity through subsidiaries or nominees
      - **Gradual corruption:** Signers corrupted one at a time over an
        extended period

      Applicable to all multisig roles:

      - Vault Upgrade Authority (4 of 7 — high threshold, harder to collude)
      - Protocol Config / Curator Config Authority (3 of 5)
      - Protocol Manager (2 of 5 for fee changes — lower threshold, easier)
      - Curator (2 of 5 for fee changes)
      - Unfreeze Authority (2 of N)
      - Vault Manager + Curator dual-sign (collusion between two parties)

      Not applicable to single-signer roles (ACL Authority, Freeze Authority,
      break-glass).
    threatType: Elevation of Privilege, Tampering
    impactDesc: |
      Colluding signers can execute any action within the role's permissions
      while appearing to follow proper governance procedures:

      - Unauthorized program upgrades (Vault Upgrade Authority)
      - Unauthorized vault ownership transfer (Protocol Config Authority)
      - Unauthorized fee manipulation (Protocol Manager, Curator)
      - Unauthorized settlement manipulation (Vault Manager + Curator)
      - Unauthorized offramp destination change (Curator Config Authority)

      Collusion is harder to detect than key theft because all signatures
      are legitimate.
    impactedSecObj:
      - REFID: INTEGRITY
      - REFID: USER_FUNDS_SAFETY
      - REFID: AUDITABILITY
    attackers:
      - REFID: UPGRADE_AUTHORITY
      - REFID: PROTOCOL_CONFIG_AUTHORITY
      - REFID: PROTOCOL_MANAGER
      - REFID: VAULT_MANAGER
      - REFID: CURATOR_CONFIG_AUTHORITY
      - REFID: CURATOR
      - REFID: UNFREEZE_AUTHORITY
    assets:
      - REFID: VAULT_UPGRADE_AUTHORITY_KEYS
      - REFID: PROTOCOL_CONFIG_AUTHORITY_KEYS
      - REFID: CURATOR_CONFIG_AUTHORITY_KEYS
      - REFID: PROTOCOL_MANAGER_KEYS
      - REFID: VAULT_MANAGER_KEYS
      - REFID: CURATOR_KEYS
      - REFID: UNFREEZE_AUTHORITY_KEYS
    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:H/UI:N/S:C/C:N/I:H/A:N
