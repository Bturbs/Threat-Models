analysis: |
  Authorization roles are as follows:
    - PDP: Policy Decision Point (OPA: Open Policy Agent)
    - PEP: Policy Enforcement Point (API Gateway, Backend Services)

  For the authorization part the analysis focuses on ensuring secure authentication mechanisms for accessing Vault services, 
  segregating authentication methods to follow the principle of least privilege, and providing a seamless process for updating credentials without downtime.

  <h5>Bundle policy</h5>
  Signed bundle policy lifecycle is not coherent with the actors in the threat model as the bundle creator is the same as the code creator.
  It is still a standard feature and if not detrimental to the security of the system.


