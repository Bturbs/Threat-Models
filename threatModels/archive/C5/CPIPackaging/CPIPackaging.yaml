    There are mainly 2 part in the scope:

     1. CorDapp CPI file internal structure
     2. CordDapp CPI file creation, verification and deployment    

    **CPI file internal structure:** 

    <img src="img/CPI-packaging.svg"/>

    How to create and distribute testing CPKs/CPBs and CPIs is out of scope.

    **Reference Documentation**

    * [REF: Build personas](https://github.com/corda/platform-eng-design/blob/master/core/corda-5/corda-5.0/packaging/build-personas.md)
    * [REF: Cordapp Packaging](https://github.com/corda/corda-runtime-os/wiki/CorDapp-Packaging)
    * [REF: Group Policy generation](https://github.com/corda/corda-runtime-os/blob/release/os/5.0/tools/plugins/mgm/README.md)
  assets:
    - ID: PLATFORM_ROLES
      title: platform Roles
      inScope: true
      type: configuration
      description: |
        Platform roles (mbm, notary, member) [REF](https://github.com/corda/platform-eng-design/blob/27c1a9074cff41ff7bdc6136dec5c61e7db80aee/core/corda-5/corda-5.0/identity-pki/network-data-structures.md#group-properties)
    # - ID: APPLICATION_ROLES
    #   inScope: true
    #   title: CordApp Roles
    #   type: configuration
    #   description: Application Roles for Members (defined in the CPI)

    - ID: PUBLISHER_KEYS1
      inScope: false
      title: CPI publisher key
      type: certificate
      description: Code-signing key for publishing CPIs. Corda validates that 
        uploaded CPIs are signed with a trusted key. Code-signing certificates 
        can be added to a node's trust store for this purpose.
      properties:
        location: CPI publisher (off-line)
        format: X.509
        length: 256
        type: Public signature verification key
      applicationRelated: true
      infrastructureRelated: false

    - ID: PUBLISHER_KEYS_CPB
      inScope: false
      title: CPB signing key
      type: certificate
      description: Code-signing key for publishing CPIs. Used by an application 
        publisher to sign an application bundle (CPB) before sending it to the 
        network operator.
      properties:
        location: Application publisher (off-line)
        format: X.509
        length: 256
        type: Public signature verification key
      applicationRelated: true
      infrastructureRelated: false

    - ID: PUBLISHER_KEYS_CPK
      inScope: false
      title: CPK signing key
      type: certificate
      description: Code-signing key for publishing CPKs. Used by an application 
        developer to sign an application package (CPK) before bundling it into a
        CPB.
      properties:
        location: Application publisher (off-line)
        format: X.509
        length: 256
        type: Public signature verification key
      applicationRelated: true
      infrastructureRelated: false

    - ID: CPI_TOOL
      inScope: false
      type: tool
      description: tool
      title: command line tool for CPI +Checks

    - ID: GRADLE_PLUGIN
      title: Gradle tool
      description: Tool used to sign and verify CPIs, it contains default 
        trusted credentials used for development
      type: configuration
      inScope: true

    - ID: CPI_VALIDATION_LIBRARY
      title: CPI validation library
      type: library
      description: |
        CPI validation library that runs validation in the DB processor
        [ref](https://r3-cev.atlassian.net/wiki/spaces/CB/pages/4091084940/Packaging+Validation+Checks)
        used inPlace:
         - CPI upload
         - command line tool
         Up to the caller to workflow the validation (TODO create assumption)
      inScope: true

    - ID: CPI_READING_LIBRARY
      type: library
      title: CPI reading library
      description: Up to the caller to workflow the validation (TODO create 
