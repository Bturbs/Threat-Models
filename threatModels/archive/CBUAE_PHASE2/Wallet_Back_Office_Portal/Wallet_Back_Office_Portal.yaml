ID: Wallet_Back_Office_Portal
schemaVersion: 2
parent: CBUAE_PHASE2
scope:
  description: |
    WORK IN PROGRESS

    This threat model focuses on the Wallet Back Office Portal, which is part of R3's Digital Currency suite.
     The Wallet Back Office Portal consists of the Back Office UI, the Back Office API Gateway, 
     and the Back Office Client Specific Backend (CSB). The UI is a Single Page Application (SPA)
      accessed by back-office users within a private network. 
      The CSB acts as a bridge between the UI and the Wallet Service,
       orchestrating calls and ensuring correct authorization.

    **Refs:** [LLD - 2 Wallet Back-Office Portal](#LLD), [LLD - 2.1 Wallet Back-Office Portal/Overview](#LLD)
  assets:
    - ID: BACK_OFFICE_UI
      type: application
      title: Back Office UI
      description: |
        The Back Office UI is a web application accessed by back-office users within a private network.

        **Refs:** [LLD - 2.3.3.1 Wallet Back-Office Portal/Solution design/Component diagram/Wallet Back Office UI](#LLD)
      inScope: true
    - ID: BACK_OFFICE_API_GATEWAY
      type: service
      title: Back Office API Gateway
      description: |
        Routes incoming traffic to various services within the application, 
        handling traffic management, load balancing, SSL termination, and so on.

        **Refs:** [LLD - 5.2 Corda Networks/API gateway](#LLD)
      inScope: true
    - ID: BACK_OFFICE_CSB
      type: service
      title: Back Office Client Specific Backend (CSB)
      description: |
        Mediates all interactions between the web client and the backend services, 
        ensuring correct authorization and data orchestration.

        **Refs:** [LLD - 2.3.3.2 Wallet Back-Office Portal/Solution design/Component diagram/Wallet Back Office CSB](#LLD)
      inScope: true
    - ID: DF_BO_UI_2_APIGW
      type: dataflow
      title: Back Office UI to API Gateway
      description: |
        Data flow representing user requests to the API Gateway.

        **Refs:** [LLD - 2.3.1 Wallet Back-Office Portal/Solution design/Architecture/context](#LLD)
      inScope: true
    - ID: DF_APIGW_2_BOCSB
      type: dataflow
      title: API Gateway to Back Office CSB
      description: |
        Data flow representing requests from the API Gateway to the Back Office CSB.

        **Refs:** [LLD - 2.3.1 Wallet Back-Office Portal/Solution design/Architecture/context](#LLD)
      inScope: true
    - ID: DF_BACKOFFICE_TO_WALLET
      type: dataflow
      title: Back Office CSB to Wallet Service
      description: |
        Data flow representing requests from the Back Office CSB to the Wallet Service.

        **Refs:** [LLD - 2.4 Wallet Back-Office Portal/Implementation](#LLD)
      inScope: true
    - ID: DF_BO_UI_2_SSO
      type: dataflow
      title: Back Office UI to SSO
      description: |
        Data flow representing user requests to the Single Sign-On (SSO) service (Keycloak).

