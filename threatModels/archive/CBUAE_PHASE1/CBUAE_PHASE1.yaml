analysis: |
  Given the security architectural security objectives (defense in Depth, minimizing attack surface and zero trust)
   the application in scope would have to provide security features, in articular authentication authorization and
    integrity check within the application itself. Also the trust levels of the components is not the same across the solution.
     In accordance with the security architectural objectives, as indicated bby BIS project Polaris REF,  
     component interaction should be protected within the application and not solely rely on infrastructure hardening 
     operationally added on top of the applications. 
   The Java applications will provide security features protecting its application payloads and its direct communication protocols 
   (JDBC, Kafka, Logs...), network and infrastructure hardening is required but may not be in scope of the application
    threat modeling. To implement the security architecture objectives those countermeasures are advised:
     - HMAC on app payloads (internal Kafka messages and database objects), this will minimize the attack surface for the main business sec objectives (monetary stability)


