threats:

  - ID: UNAUTH_SERVICE_CALLS
    title: Unauthorized service calls
    attackers:
      - REFID: ANONYMOUS
    attack: |
      An ANONYMOUS unauthorized user can make successful unauthorized service calls to services 
      such as the Wallet Service once internal network access is gained.

      **Refs:** [LLD - 12.11 Identity and Access Management (IAM)/Authorization services](#LLD)
    impactDesc: |
      - Unauthorized access to sensitive data.
      - Unauthorized access to sensitive services that lead to 
      fraudulent transactions and loss of funds.

      **Refs:** [LLD - 12.11.1 Identity and Access Management (IAM)/Authorization services/Overview](#LLD)
    impactedSecObj:
      - REFID: ZERO_TRUST
      - REFID: DEFENSE_IN_DEPTH
      - REFID: PRINCIPLE_LEAST_PRIVILEGE
    fullyMitigated: true
    CVSS:
      vector: CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:L
    threatType: Spoofing
    public: true
    countermeasures:
      - ID: PEP_ON_CSP
        title: Policy Enforcement Point on CSB
        description: |
          Implement a Policy Enforcement Point (PEP) on the CSB (Client Specific Backend) to enforce the policy
          and deny unauthorized service calls. 
          Basically, enforcing the policy in the service as well (duplicating it: see Defence in Depth).

          **Refs:** [LLD - 12.11.3.2 Identity and Access Management (IAM)/Authorization services/Solution design/Sequence and interactions](#LLD)
        inPlace: true
        public: true
      - ID: CS_MTLS_MESH
        title: CSB to Service auth with Mutual TLS Service Mesh
        description: |
          Implement a CSB client Authentication on the Service so that only CSB processes (K8s Pods), not any process in the same 
          trust zone (Kubernetes namespace) can perform calls.
          Using a service mesh implementation this is done by allow-listing only the specific CSB client in the
          service (e.g. Wallet Service).

          **Refs:** [LLD - 5.3 Corda Networks/Service mesh](#LLD), [LLD - 13 Network Identity Detailed Design](#LLD)
        inPlace: true
        public: true

      - ID: IN_SERVICE_TOKEN_AUTHZ
        title: In Service Endpoint Authorization enforcement
        description: |
          Implement in-service-process endpoint authorization enforcement ensuring
          that only authorized callers can access the specific service endpoints and APIs

          This is achieved with SVID JTW tokens.
          Service endpoints can only be called with an SVID JWT signed by an entity that the service expects
           to receive requests from for a particular API. 
           For example, a wallets API might be exposed to other LFIs wallets applications.
           When this wallets API is called, an authorization policy checks:

           - That the identity of the certificate used to verify the signature matches the "sub" field of the token
           - That the certificate has a known trust anchor (i.e. a root certificate this LFI trusts)
           - The incoming request is from a type of application it expects - 
           in this case another wallets application - this can be determined from the SPIFFE Id of the "sub" from the token.
           - The specifc endpoint/HTTP verb is expecting the call from that identity (e.g. different LFI). This is necessary as CSB calls
           are enforcing fine grained authorization decisions before the call, that means are more trusted. The less trusted calls 
            are the ones that are not enforced by the CSB, but by the service itself.

          **Refs:** [LLD - 13.3 Network Identity Detailed Design/SPIFFE identity format](#LLD), [LLD - 13.4 Network Identity Detailed Design/Exchanging application identity via tokens](#LLD)
        inPlace: true
        public: true
      - ID: API_GW_MINIMAL_ACCESS
        title: API Gateway Minimal Access
        description: |
          Minimal access allowed to specific services (service to service communication) 
          endpoints and APIs in the API Gateway. This control contributes to [DEFENSE_IN_DEPTH](#DEFENSE_IN_DEPTH).

          **Refs:** [LLD - 5.2 Corda Networks/API gateway](#LLD)
        inPlace: true
        public: true

  - ID: INSECURE_KEYCLOAK_SIGNING
    ticketLink: https://r3-cev.atlassian.net/browse/R3SOL-4243
    title: Insecure JWT Signing
    assets:
      - REFID: KEYCLOAK
    attack: |
      An attacker can gain unauthorized access to the Keycloak server and obtain the JWT signing key, 
      allowing them to sign arbitrary JWT tokens and impersonate legitimate users.

      **Refs:** [LLD - 12.9.4 Identity and Access Management (IAM)/Securing the identity provider/Certificate and key management](#LLD)
    impactDesc: |
      - Unauthorized access to the JWT signing key.
      - Impersonation of legitimate users.

      **Refs:** [LLD - 12.7.4.5 Identity and Access Management (IAM)/Identity management system fundamentals/Solution design/Scopes and tokens](#LLD)
    impactedSecObj:
      - REFID: ZERO_TRUST
      - REFID: DEFENSE_IN_DEPTH
      - REFID: PRINCIPLE_LEAST_PRIVILEGE
    fullyMitigated: false
    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H
    threatType: Spoofing
    public: false
    countermeasures:
      - ID: KEYCLOAK_SPI_VAULT_TRANSIT
        title: Keycloak SPI Plugin for Vault Transit
        description: |
          Develop a Java SPI plugin for Keycloak to integrate with Vault Transit for private key management. 
          This ensures that private keys are securely managed and stored in Hashicorp Vault, reducing the risk of key compromise.

            - **Integration with Vault Transit:**
              - The SPI plugin will use Vault Transit to handle cryptographic operations, ensuring that private keys are never exposed to the signer.
            - **Security Benefits:**
              - By using Vault Transit, private keys are securely stored and managed, reducing the risk of key compromise.
              - The integration ensures that Keycloak can perform cryptographic operations without directly handling private keys.

          **Refs:** [LLD - 10.6 Cryptography and Public Key Infrastructure/Cryptographic key management](#LLD), [LLD - 12.9.5 Identity and Access Management (IAM)/Securing the identity provider/Secrets management](#LLD)
        inPlace: false
        public: true
        operational: false

  - ID: UNAUTHORIZED_KEYCLOAK_ADMIN_CONSOLE_ACCESS
    title: Unauthorized Admin Console Access
    attack: |
      An attacker can gain unauthorized access to the
        Keycloak admin console by bypassing network restrictions or exploiting 
        vulnerabilities in the admin console.

      **Refs:** [LLD - 12.9.8.1 Identity and Access Management (IAM)/Securing the identity provider/Hardening/Admin console access](#LLD)
    impactDesc: |
      - Unauthorized access to Keycloak admin console.
      - Potential modification of realm configurations, user data, and security settings.

      **Refs:** [LLD - 12.9.6 Identity and Access Management (IAM)/Securing the identity provider/Network security](#LLD)
    impactedSecObj:
      - REFID: ZERO_TRUST
      - REFID: DEFENSE_IN_DEPTH
      - REFID: PRINCIPLE_LEAST_PRIVILEGE
      - REFID: FULL_CIA
    fullyMitigated: true
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H
    threatType: Elevation of Privilege
    public: true

    countermeasures:
      - ID: RESTRICT_ADMIN_CONSOLE_ACCESS
        title: Restrict Admin Console Access
        description: |
          Restrict access to the Keycloak admin console to whitelisted IP addresses, networks, or CIDRs, and/or via MPLS-based networks.
          This limits the exposure of the admin console to only trusted networks and reduces the risk of unauthorized access.

          **Refs:** [LLD - 12.9.8.1 Identity and Access Management (IAM)/Securing the identity provider/Hardening/Admin console access](#LLD)
        inPlace: true
        public: true

      - ID: USE_REALM_SPECIFIC_ADMIN_USERS
        title: Use Realm-Specific Admin Users
        description: |
          Use multiple realm-specific admin console users with selective privileges to perform specific operations in the admin console.
          This limits the blast radius of any compromised admin account and ensures that only necessary privileges are granted.

          **Refs:** [LLD - 12.7.4.1 Identity and Access Management (IAM)/Identity management system fundamentals/Solution design/Realms](#LLD)
        inPlace: true
        public: true

      - ID: ENABLE_AUDIT_TRAIL
        title: Enable Audit Trail
        description: |
          Enable audit trail of operations performed in the Keycloak admin console and monitor them in a centralized monitoring solution.
          This ensures that all admin activities are logged and can be reviewed for any suspicious or unauthorized actions.

          **Refs:** [LLD - 12.12 Identity and Access Management (IAM)/Security information and event management (SIEM), monitoring and alerting](#LLD)
        inPlace: true
        public: true

      - ID: KEYCLOAK_HARDENING
        title: Keycloak Hardening
        description: |
          Execute configuration Hardening and specific security testing on Keycloak, also as described in the detailed design documents.

          **Refs:** [LLD - 12.9.8 Identity and Access Management (IAM)/Securing the identity provider/Hardening](#LLD), [LLD - 12.9.10 Identity and Access Management (IAM)/Securing the identity provider/Security testing](#LLD)
        public: true
        inPlace: true

  - ID: CLIENT_REQUEST_DOS1
    title: Client Request Denial of Service
    attack: |
      An attacker can perform a denial-of-service attack by sending a large number of
       requests to the authorization service, causing it to become unresponsive.

      **Refs:** [LLD - 12.10 Identity and Access Management (IAM)/Identity management performance, scalability & resiliency](#LLD)
    impactedSecObj:
      - REFID: AVAILABILITY
    fullyMitigated: true
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H
    threatType: Denial of Service
    public: true
    countermeasures:
      - ID: APIGW_URL_FILTERING
        title: API Gateway URL Filtering
        description: |
          Implement URL filtering to block requests that are not allowed at the API_GATEWAY and not in subsequent
          services that also perform enforcement of policies and authorization in a more granular way.

          **Refs:** [LLD - 5.2 Corda Networks/API gateway](#LLD)
        inPlace: true
        public: true

  - ID: NETWORK_SCANNING
    attack: |
      An attacker can perform network scanning by requesting internal unauthorized endpoints.
      Even if an error is generated and a mitigation is in place on an internal endpoint, 
      there is still information leakage (including response time delays and other side channel info) that can be useful to escalate attacks.

      **Refs:** [LLD - 12.9.6 Identity and Access Management (IAM)/Securing the identity provider/Network security](#LLD)
    impactedSecObj:
      - REFID: CONFIDENTIALITY
    fullyMitigated: true
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:N
    threatType: Information Disclosure
    public: true
    title: Network Scanning
    countermeasures:
      - REFID: APIGW_URL_FILTERING

##Authorization threats

  - ID: APIGW_AUTHORIZATION_DOS1
    title: API Gateway & Authorization Denial of Service
    attack: |
      An attacker can perform a denial-of-service attack by sending a large number of
       requests to the authorization service, causing it to become unresponsive.
      If for every request the API Gateway has to communicate with OPA for authorization decisions,
       this can lead to a bottleneck and potential DoS situation (VS in process JWT signature/claim verification is much faster).

      **Refs:** [LLD - 12.10 Identity and Access Management (IAM)/Identity management performance, scalability & resiliency](#LLD)
    impactDesc: |
      - Denial-of-service attack can cause the authorization service to become unresponsive.
      - Legitimate users will be unable to access resources or perform actions that require authorization.

      **Refs:** [LLD - 12.11.4.5 Identity and Access Management (IAM)/Authorization services/Component 1 - Policy Decision Service/Availability guarantees](#LLD)
    impactedSecObj:
      - REFID: AVAILABILITY
    fullyMitigated: false
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H
    threatType: Denial of Service
    public: false

    ticketLink: https://r3-cev.atlassian.net/browse/R3SOL-4246
    countermeasures:
      - ID: OFFLINE_JWT_CLAIMS_ENFORCEMENT
        title: Offline JWT Claims Validation
        description: |
          Enforce offline JWT claims validation to prevent DoS attacks.
          One of the main features of JWT is that it is self-contained and can be used offline.

          **Refs:** [LLD - 12.7.4.5 Identity and Access Management (IAM)/Identity management system fundamentals/Solution design/Scopes and tokens](#LLD)
        inPlace: false
        public: true
      - ID: OPA_SIDECAR
        title: OPA Sidecar in APISIX Pods
        description: |
          Implement an OPA sidecar in APISIX Kubernetes Pods to resolve coarse grained authorization decisions locally.
          This will reduce the load on the API Gateway to OPA communication.

          **Refs:** [LLD - 12.11.4 Identity and Access Management (IAM)/Authorization services/Component 1 - Policy Decision Service](#LLD)
        inPlace: false
        public: true

