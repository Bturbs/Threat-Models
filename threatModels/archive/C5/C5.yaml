    - ID: CLUSTER_DB
      type: database
      title: Cluster database
      description: |
        Corda Cluster main databases including:
           - Config DB
           - RBAC for REST APIs
      inScope: true

    - ID: WORKER_PROCESS
      title: Any worker process
      type: process
      description: Any worker process part of the Cluster. Process are typically
        Java running in Docker containers.
      inScope: true

    - ID: CRYPTO_WORKER
      type: Java process
      title: Crypto Worker/Library
      description: Manages keys on behalf of members as well as the cluster 
        itself 
        [ref](https://github.com/corda/corda-runtime-os/wiki/Crypto-library)
      inScope: true
    - ID: LINK_MANAGER
      type: process
      title: Link manager
      description: |
        This component is responsible for link session establishment, peer authentication,
        secure & reliable transport of messages. Messages might be delivered out-of-order and potentially even duplicated
        This component will create relatively long-lived authenticated link sessions with peers. The clients (flow workers) will 
        be unaware for these sessions. It will also provide the ability for unauthenticated message exchange, which can be used in 
        cases where there is no need for authentication or there is a need for a custom form of authentication
         (e.g. registration process is a concrete use-case of this).
          [REF](https://github.com/corda/platform-eng-design/blob/a6151195196bcfa20daf6f6a7f0901a73ab2da6f/core/corda-5/corda-5.0/p2p-ha/p2p-architecture.md)
      inScope: true
    - ID: P2P_GATEWAY
      type: process
      title: P2P Gateway
      description: |
        Process deployed in an external/intermediary network segment and communicates with gateways in other clusters using HTTPS.
      inScope: true
    - ID: HTTP_GATEWAY
      type: process
      title: HTTP_GATEWAY (A.K.A. REST_WORKER)
      description: |
        The HTTP RPC Gateway a component service of a Corda 5 node that exposes a variety of API endpoints that enable
        control of a Corda node.
      inScope: true

    - ID: MGM_VNODE
      title: MGM Node
      type: software system
      description: Membership Group Manager VNode
      inScope: true

    - ID: FLOW_MAPPER_WORKER
      inScope: true
      type: process
      title: Flow Mapper Worker
      description: The flow mapper will be separated from the flow worker, 
        further un-bloating the critical-path flow code.
      appliesToVersions: ">=5.1"

    - ID: PERSISTENCE_WORKER
      title: Persistence Worker
      appliesToVersions: ">=5.1"
      inScope: true
      type: process
      description: |
        Flow and ledger persistence operating within the DB sandbox. 
        (The LedgerPersistenceService and FlowPersistenceService are removed from the DB worker as in 5.0).

    - ID: TOKEN_SELECTION_WORKER
      title: Token Selection Worker
      appliesToVersions: ">=5.1"
      inScope: true
      type: process
      description: |
        The TokenCacheProcessor will also be removed from the DB worker, leaving the DB worker to handle DB configuration and management.

    - ID: UNIQUENESS_WORKER
      title: Uniqueness Worker
      appliesToVersions: ">=5.1"
      inScope: true
      type: process
      description: |
        Providing fixed-function checking for spent input and reference states, and time window validation.

    - ID: VERIFICATION_WORKER
      title: Verification Worker
      appliesToVersions: ">=5.1"
      inScope: true
      type: process
      description: |
        Verification of ledger transactions within the ledger sandbox.

    - ID: TOKEN_SELECTION_WORKER
      title: Token Selection Worker
      appliesToVersions: ">=5.1"
      inScope: true
      type: process
      description: |
        Handles the tokenization service within flows.

    - ID: PERSISTENCE_WORKER
      title: Persistence Worker
      appliesToVersions: ">=5.1"
      inScope: true
      type: process
      description: |
        Flow and ledger persistence operating within the DB sandbox.

    - ID: STATE_MANAGER_LIB
      title: State Manager library
      appliesToVersions: ">=5.1"
      inScope: true
