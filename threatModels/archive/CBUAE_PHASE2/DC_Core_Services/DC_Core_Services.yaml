  **Refs:** [HLD - 4.2.1 Solution Design/Key business flows](#HLD), [HLD - 4.2.1.1 Solution Design/Key business flows/Issuance flow](#HLD), [HLD - 4.2.1.6 Solution Design/Key business flows/Redeem flow](#HLD)

threats:
  - ID: UNAUTHORIZED_DCCS_CLIENT_REQ
    title: Unauthorized DCCoreServices Client Request
    attack: |
      An attacker with gained access to backend network or any of its processes (e.g. SSRF attack) 
      can escalate unauthorized client requests to the Digital Currency Core Services (DCCS) API, 
      potentially leading to unauthorized access to sensitive operations
       such as issuance, redemption, and transfer of digital currencies.

      **Refs:** [LLD - 1.4.3 Wallet Service implementation/Authorization and access control](#LLD), [LLD - 12.11 Identity and Access Management (IAM)/Authorization services](#LLD)
    impactDesc: |
      - Unauthorized access to sensitive digital currency operations.
      - Potential for fraudulent transactions and financial loss.

      **Refs:** [HLD - 4.2.1.1 Solution Design/Key business flows/Issuance flow](#HLD), [HLD - 4.2.1.2 Solution Design/Key business flows/Transfer flow](#HLD)
    impactedSecObj:
      - REFID: ZERO_TRUST
      - REFID: DEFENSE_IN_DEPTH
      - REFID: PRINCIPLE_LEAST_PRIVILEGE
    fullyMitigated: false
    CVSS:
      vector: CVSS:3.1/AV:L/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    threatType: Elevation of Privilege
    public: false
    ticketLink: https://r3-cev.atlassian.net/browse/R3SOL-4236
    countermeasures:
      - REFID: IN_SERVICE_TOKEN_AUTHZ

  - ID: CMS_TO_LEDGER_INCONSISTENCEY
    title: Flexcube to retail Corda Ledger Inconsistency
    attack: |
      Inconsistency and lack of consensus between the Flexcube and Corda ledgers can lead to discrepancies in the collateral management system. 
      This can result in the issuance of digital currency without the corresponding collateral movements.

      **Refs:** [HLD - 5.3.18 Solution Analysis/Design decisions/Central reserve ledger (FlexCube)](#HLD), [LLD - 7.3.5 Corda Distributed Ledger Technology/Solution design/Finality & consensus](#LLD), [LLD - 1.5.2 Wallet Services/Non-functional considerations/Data consistency](#LLD)
    impactDesc: |
      Discrepancies between Flexcube and Corda ledgers can compromise the integrity of the monetary base, 
      leading to issuance without proper collateral backing, which undermines trust in the digital currency system.

      **Refs:** [HLD - 4.2.1.1 Solution Design/Key business flows/Issuance flow](#HLD), [LLD - 7.3.8 Corda Distributed Ledger Technology/Solution design/Data storage & management](#LLD)
    impactedSecObj:
      - REFID: MONETARY_BASE_INTEGRITY
      - REFID: COIN_OWNERSHIP_GUARANTEE
    fullyMitigated: false
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    threatType: Data Integrity
    public: false
    ticketLink: https://r3-cev.atlassian.net/browse/R3SOL-4234
    countermeasures:

      - ID: TWO_PHASE_COMMIT_LEDGERS
        title: Two-Phase Commit for Flexcube and Corda Ledger and LFI's customer
          wallet DBs
        description: |
          Implement a [two-phase commit 2PC](https://en.wikipedia.org/wiki/Two-phase_commit_protocol) (or three-phase commit 3PC) protocol logic between Flexcube
           and Corda ledger to ensure that the collateral movements are consistent with the digital currency issuance.

          **Refs:** [LLD - 1.5.2 Wallet Services/Non-functional considerations/Data consistency](#LLD), [LLD - 7.3.10 Corda Distributed Ledger Technology/Solution design/Resilience and disaster recovery](#LLD)
        inPlace: false
        public: true

      - ID: FLEXCUBE_DLT_EVENTUALLY_CONSISTENT
        title: Flexcube, DLT and LFI customer DBs Eventual Consistency
        description: |
          Implement eventual consistency between Flexcube and Corda ledger 
          to ensure that the collateral movements are consistent with the digital currency issuance.

          **Refs:** [LLD - 1.5.2 Wallet Services/Non-functional considerations/Data consistency](#LLD), [LLD - 7.3.5.3 Corda Distributed Ledger Technology/Solution design/Finality & consensus/Finality](#LLD)
        inPlace: false
        public: true

      - ID: FLEXCUBE_LDT_RECONCILIATION
        title: Flexcube Ledger Reconciliation
        description: |
          Implement a reconciliation process between Flexcube and Corda ledger and LFI's Customers DBs to 
          ensure that the collateral movements are consistent with the digital currency issuance.

          **Refs:** [HLD - 5.3.18 Solution Analysis/Design decisions/Central reserve ledger (FlexCube)](#HLD), [LLD - 1.4.6.3 Wallet Service implementation/Transfer workflow/Error handling](#LLD)
        inPlace: false
        public: true


