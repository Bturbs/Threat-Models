# Generated from HAR/.indexHAR.yaml. Refine with an LLM or by hand.
# participants: the primary editing surface. Move domains between participants, trust boundaries, and collapse targets over time.
# Diagram/view granularity is a tool option, not part of the semantic config.
#
# Top discovered hosts by request count:
# - static.sumsub.com: 53
# - corda-rr.vercel.app: 33
# - api.sumsub.com: 26
# - fonts.gstatic.com: 7
# - fonts.googleapis.com: 2
browserParticipant: Browser
excludePaths: []
messagePrefixes:
  GET: 'REQ '
  POST: 'AUTH '
  PUT: 'PUT '
  PATCH: 'PATCH '
  DELETE: 'DEL '
trustBoundaries:
  - ID: FIRST_PARTY
    title: First-Party Boundary
    color: '#D7F3E3'
  - ID: THIRD_PARTY
    title: Third-Party Boundary
    color: '#F5F5F5'
participants:
  - ID: CORDA_RR_VERCEL_APP
    title: corda-rr.vercel.app
    domains:
      - corda-rr.vercel.app
    trustBoundary: FIRST_PARTY
    inScope: true
    properties:
      authentication: invite-gated session via signed JWT-style cookies (corda_invite, corda_terms); no user login/password
      authorization: server-side gating (geo/invite/terms/KYC); brokers Sumsub access token via GET /api/kyc/token
      dataSensitivity: high (KYC onboarding state, session tokens)
      owner: first-party
      notes:
        - POST /api/auth/accept-terms uses Idempotency-Key header
  - ID: GOOGLE_EDGE_CDN
    title: Google Edge/CDN
    domains:
      - fonts.googleapis.com
      - fonts.gstatic.com
    trustBoundary: THIRD_PARTY
    inScope: true
    properties:
      authentication: none
      authorization: public asset delivery
      dataSensitivity: low
      owner: third-party
  - ID: SUMSUB_COM
    title: sumsub.com
    domains:
      - api.sumsub.com
      - static.sumsub.com
    trustBoundary: THIRD_PARTY
    inScope: true
    properties:
      authentication: Sumsub WebSDK JWT access token (_act-sbx-jwt-...) minted server-side, passed into iframe; SDK adds X-Client-Id, accessToken, X-Session-Id, applicantId, device-fingerprint headers
      authorization: vendor-scoped to applicant via access token; refresh via expirationHandler re-calling /api/kyc/token
      dataSensitivity: high (PII / identity documents - KYC)
      owner: third-party (Sumsub KYC/identity vendor)
      notes:
        - access token brokered by first-party GET /api/kyc/token
