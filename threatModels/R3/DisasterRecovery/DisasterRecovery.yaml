parent: R3
ID: DisasterRecovery
schemaVersion: 2
title: Disaster Recovery
version: '1.0'
authors: |
  R3 Security Team

scope:
  description: |-
    This threat model establishes a framework for disaster recovery within R3, ensuring
    uninterrupted operations and regulatory compliance. It covers scenarios that can impact
    ICT, information security, and business continuity across all operational locations.
    The model focuses on effective communication, data protection, damage mitigation,
    preservation of business functions, timely recovery, and return to normal operations.
  assumptions:
    - ID: BASELINE_BACKUPS
      description: |
        All critical assets are backed up in accordance with established backup policies.
    - ID: CLOUD_HOSTING
      description: |
        Critical systems are primarily hosted on geographically diverse cloud environments.
    - ID: PREDEFINED_RTO
      description: |
        Recovery Time Objectives (RTOs) are defined and agreed upon by top management.

  attackers:
#   # - ID: MALICIOUS_INSIDER
#   #   description: |
#   #     Insiders with authorized access who may intentionally disrupt recovery operations.
#   #   inScope: true
#   # - ID: EXTERNAL_CYBER_ATTACKER
#   #   description: |
#   #     External threat actors leveraging cyberattack methods (e.g. ransomware, unauthorized access) to disrupt services.
#   #   inScope: true
    - ID: NATURAL_DISASTER
      description: |
        Events such as floods, earthquakes, fires, or chemical spills that physically disrupt operations.
      inScope: true
  securityObjectives:
    - ID: CONTINUITY
      title: Business Continuity and Disaster Recovery
      description: |-
        Ensure uninterrupted operations and rapid recovery of critical systems following disruptive events.
      group: Operational Security
    - ID: DATA_PROTECTION
      title: Data Protection and Preservation
      description: |-
        Safeguard all critical and sensitive data by enforcing robust backup and encryption measures.
      group: Data Security
    - ID: COMMUNICATION_EFFECTIVENESS
      title: Effective Communication and Coordination
      description: |-
        Facilitate prompt and clear communications to enable rapid activation of recovery teams and stakeholder updates.
      group: Access Management
    - ID: DAMAGE_MITIGATION
      title: Damage Mitigation and Impact Reduction
      description: |-
        Quickly reduce physical and operational damages to minimize financial and reputational impact.
      group: System Integrity
    - ID: REGULATORY_COMPLIANCE
      title: Regulatory Compliance and Reporting
      description: |-
        Ensure recovery processes satisfy legal requirements and protect personally identifiable information (PII).
      group: Governance & Compliance

  assets:
    - ID: CRITICAL_DATA
      type: data
      title: Critical Data and Information Assets
      description: |
        Includes system backups, operational data, and personal information needed for business continuity.
      inScope: true
    - ID: IT_INFRASTRUCTURE
      type: system
      title: IT Systems and Infrastructure
      description: |
        Cloud servers, hardware, networks, and backup systems that support critical business operations.
      inScope: true
    - ID: COMMUNICATION_SYSTEMS
      type: system
      title: Communication Systems
      description: |
        Email services, messaging platforms, and conferencing systems needed for effective coordination.
      inScope: true
    - ID: RECOVERY_TEAM
      type: people
      title: Disaster Recovery Team
      description: |
        Key personnel responsible for planning and executing disaster recovery operations.
      inScope: true



analysis: |
  This threat model evaluates potential disruption scenarios for R3’s disaster recovery strategy.
  It examines the impact of various internal and external events—from cyberattacks to natural disasters—
  and defines countermeasures to ensure rapid recovery, continuity of operations, and compliance with legal and privacy regulations.

threats:
  - ID: FIRE_POWER_OUTAGE
    title: Fire and Power Outage Disruption
    attack: |
      A fire or power outage strikes an R3 facility, impacting IT infrastructure and physical access.
    threatType: Physical Disruption
    impactDesc: |
      Damage to security systems, loss of power affecting access controls, and inability for staff to reach the workplace.
    impactedSecObj:
      - REFID: CONTINUITY
      - REFID: DATA_PROTECTION
    attackers:
      - REFID: NATURAL_DISASTER
    CVSS:
      vector: CVSS:3.1/AV:P/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H
    fullyMitigated: false
    compliance:
      - ISO27701:
          - ref: 6.3.1.1 (PIMS objectives for business continuity)
          - ref: 6.12.1.1 (Backup of PII)
          - ref: 7.4.8 (PII availability, integrity and resilience)
      - ISO27001:
          - ref: A.5.29 (Information security during disruption)
          - ref: A.5.30 (ICT readiness for business continuity)
          - ref: A.7.5 (Protecting against physical and environmental threats)
          - ref: A.8.13 (Information backup)
    ticketLink: https://r3-cev.atlassian.net/browse/RR-650
    countermeasures:
      - ID: FIRE_DRILLS_BACKUPS
        title: Regular Fire Drills and Backup Infrastructure
        description: |
          Conduct periodic fire drills and maintain offsite/cloud-based backup systems to allow remote operations during fire or power outages.
        inPlace: true
        public: true

  - ID: RANSOMWARE_CYBERATTACK
    title: Ransomware and Cyberattack Disruption
    attack: |
      Cyber attackers deploy ransomware or breach systems, compromising critical IT assets and data.
    threatType: Cyber Attack, Data Breach
    impactDesc: |
      Loss of data confidentiality and integrity, disruption of service continuity, and potential non-compliance with GDPR.
    impactedSecObj:
      - REFID: DATA_PROTECTION
      - REFID: CONTINUITY
    attackers:
      - REFID: EXTERNAL_ATTACKER
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
    fullyMitigated: false
    compliance:
      - ISO27701:
          - ref: 6.9.4.1 (Protection of PII in development, test and production)
          - ref: 6.12.1.1 (Backup of PII)
          - ref: 6.13.1.1 (Incident management for PII)
          - ref: 7.2.6 (Notification of PII breaches)
      - ISO27001:
          - ref: A.5.24 (Information security incident management planning and 
              preparation)
          - ref: A.5.26 (Response to information security incidents)
          - ref: A.8.13 (Information backup)
          - ref: A.8.7 (Protection against malware)
          - ref: A.8.8 (Management of technical vulnerabilities)
    ticketLink: https://r3-cev.atlassian.net/browse/RR-628
    countermeasures:
      - ID: RANSOMWARE_PROTECTION
        title: Deploy Advanced Ransomware Protection
        description: |
          Utilize robust antivirus, endpoint detection, and continuous SOC monitoring to identify and neutralize ransomware threats.
        inPlace: false
        public: true
  - ID: OFFICE_ACCESS_DISRUPTION
    title: Building Accessibility and Office Disruption
    attack: |
      A disruption renders R3 office locations inaccessible due to structural damage or security incidents.
    threatType: Physical/Operational Disruption
    impactDesc: |
      Loss of on-premise operations forces reliance on remote work, potentially delaying business continuity actions.
    impactedSecObj:
      - REFID: CONTINUITY
      - REFID: COMMUNICATION_EFFECTIVENESS
    attackers:
      - REFID: NATURAL_DISASTER
    CVSS:
      vector: CVSS:3.1/AV:P/AC:H/PR:N/UI:N/S:U/C:N/I:N/A:H
    fullyMitigated: false
    compliance:
      - ISO27701:
          - ref: 6.4.1.1 (Remote working policy for PII)
          - ref: 6.3.1.1 (PIMS objectives for business continuity)
      - ISO27001:
          - ref: A.5.29 (Information security during disruption)
          - ref: A.5.30 (ICT readiness for business continuity)
          - ref: A.6.7 (Remote working)
          - ref: A.7.3 (Securing offices, rooms and facilities)
    ticketLink: https://r3-cev.atlassian.net/browse/RR-655
    countermeasures:
      - ID: REMOTE_WORK_POLICY
        title: Implement Robust Remote Work Capabilities
        description: |
          Establish secure VPN and remote work policies along with alternate backup locations to ensure operational continuity.
        inPlace: false
        public: true
  - ID: NETWORK_OUTAGE
    title: Network Outage or Critical System Failure
    attack: |
      A network breakdown or critical software/hardware failure results in loss of access to essential services.
    threatType: Service Disruption
    impactDesc: |
      Inability to access the internet or key systems, leading to delays in recovery actions and service disruptions.
    impactedSecObj:
      - REFID: CONTINUITY
      - REFID: DATA_PROTECTION
    attackers:
      - REFID: EXTERNAL_ATTACKER
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:H
    fullyMitigated: false
    compliance:
      - ISO27701:
          - ref: 6.3.1.1 (PIMS objectives for business continuity)
          - ref: 7.4.8 (PII availability, integrity and resilience)
      - ISO27001:
          - ref: A.5.29 (Information security during disruption)
          - ref: A.5.30 (ICT readiness for business continuity)
          - ref: A.8.14 (Redundancy of information processing facilities)
    ticketLink: https://r3-cev.atlassian.net/browse/RR-639
    countermeasures:
      - ID: NETWORK_REDUNDANCY
        title: Implement Redundant Network Links
        description: |
          Maintain backup internet connections and mobile hotspot options along with cloud-based resiliency certifications.
        inPlace: false
        public: true
  - ID: PRODUCT_SECURITY_FAILURE
    title: Critical Product or Security Function Failure
    attack: |
      A failure in product functionality or a security control results in impaired service delivery.
    threatType: Operational Failure
    impactDesc: |
      Inability to deliver products or services securely, risking client obligations and reputational damage.
    impactedSecObj:
      - REFID: CONTINUITY
      - REFID: DAMAGE_MITIGATION
    attackers:
      - REFID: MALICIOUS_INSIDER
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:H/A:H
    fullyMitigated: false
    compliance:
      - ISO27701:
          - ref: 7.4.2 (Privacy by design and by default)
          - ref: 6.9.1.1 (Secure development policy for PII)
          - ref: 6.9.2.1 (System security testing for PII)
      - ISO27001:
          - ref: A.8.21 (Secure development policy)
          - ref: A.8.22 (System security testing)
          - ref: A.8.25 (Secure development life cycle)
          - ref: A.8.32 (Change management)
    ticketLink: https://r3-cev.atlassian.net/browse/RR-634
    countermeasures:
      - ID: PRODUCT_TESTING
        title: Enforce Rigorous Testing Protocols
        description: |
          Perform comprehensive testing of product functionality and security controls prior to deployment.
        inPlace: false
        public: true
  - ID: MANMADE_DISRUPTION
    title: Manmade or Targeted Disruption
    attack: |
      Deliberate sabotage or targeted disruptions by insiders or external threat actors.
    threatType: Insider Threat, Sabotage
    impactDesc: |
      Significant operational disruption, potential financial and reputational damages, and prolonged downtime.
    impactedSecObj:
      - REFID: DAMAGE_MITIGATION
      - REFID: CONTINUITY
    attackers:
      - REFID: MALICIOUS_INSIDER
      - REFID: EXTERNAL_ATTACKER
    CVSS:
      vector: CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H
    fullyMitigated: false
    compliance:
      - ISO27701:
          - ref: 6.2.2.1 (Security awareness, education and training on PII)
          - ref: 6.3.1.1 (PIMS objectives for business continuity)
      - ISO27001:
          - ref: A.6.3 (Information security awareness, education and training)
          - ref: A.5.29 (Information security during disruption)
          - ref: A.5.30 (ICT readiness for business continuity)
    ticketLink: https://r3-cev.atlassian.net/browse/RR-647
    countermeasures:
      - ID: SECURITY_TRAINING
        title: Regular Security and Compliance Training
        description: |
          Conduct ongoing security awareness and insider threat training for all employees.
        inPlace: false
        public: true
  - ID: REMOTE_WORK_LIMITATION
    title: Remote Work Capability Disruption
    attack: |
      Factors that limit the effectiveness of remote work (e.g. inadequate IT support or alternative communication channels).
    threatType: Operational Inefficiency
    impactDesc: |
      Reduced workforce productivity and delayed recovery efforts due to insufficient remote work provisions.
    impactedSecObj:
      - REFID: COMMUNICATION_EFFECTIVENESS
      - REFID: CONTINUITY
    attackers:
      - REFID: ACCIDENTAL_INSIDER
    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:N/I:L/A:L
    fullyMitigated: false
    compliance:
      - ISO27701:
          - ref: 6.4.1.1 (Remote working policy for PII)
          - ref: 6.3.1.1 (PIMS objectives for business continuity)
      - ISO27001:
          - ref: A.6.7 (Remote working)
          - ref: A.5.29 (Information security during disruption)
          - ref: A.5.30 (ICT readiness for business continuity)
    ticketLink: https://r3-cev.atlassian.net/browse/RR-653
    countermeasures:
      - ID: REMOTE_WORK_ENHANCEMENT
        title: Strengthen Remote Work Infrastructure
        description: |
          Upgrade remote access tools and increase IT support to ensure efficient work-from-home operations.
        inPlace: false
        public: true
  - ID: NATURAL_DISASTER_EVENT
    title: Natural Disaster Impact on Operations
    attack: |
      A natural disaster, including floods, earthquakes, or chemical spills, causes widespread disruption.
    threatType: Natural Disaster
    impactDesc: |
      Extensive physical damage, loss of critical systems, and potential safety hazards for employees.
    impactedSecObj:
      - REFID: CONTINUITY
      - REFID: DAMAGE_MITIGATION
      - REFID: DATA_PROTECTION
    attackers:
      - REFID: NATURAL_DISASTER
    CVSS:
      vector: CVSS:3.1/AV:P/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:H
    fullyMitigated: false
    compliance:
      - ISO27701:
          - ref: 6.3.1.1 (PIMS objectives for business continuity)
          - ref: 6.12.1.1 (Backup of PII)
          - ref: 6.5.1.1 (Physical security for PII)
          - ref: 7.4.8 (PII availability, integrity and resilience)
      - ISO27001:
          - ref: A.5.29 (Information security during disruption)
          - ref: A.5.30 (ICT readiness for business continuity)
          - ref: A.7.5 (Protecting against physical and environmental threats)
          - ref: A.8.13 (Information backup)
    ticketLink: https://r3-cev.atlassian.net/browse/RR-646
    countermeasures:
      - ID: EVACUATION_PLAN
        title: Adopt Comprehensive Evacuation and Response Plans
        description: |
          Regularly update and drill evacuation procedures, ensure staff can safely evacuate and access remote work options.
        inPlace: false
        public: true
      - ID: REMOTE_ACCESS_SETUP
        title: Ensure Secure Remote Access
        description: |
          Configure secure VPN and remote access solutions to maintain critical system availability during natural disasters.
        inPlace: false
        public: true
      - ID: SUPPLIER_CONTINGENCY
        title: Establish Backup Supplier Agreements
        description: |
          Regularly review SLAs with critical service providers to mitigate supply chain disruptions during natural disasters.
        inPlace: false
        public: true
  - ID: REGULATORY_CHANGE_RISK
    title: Regulatory or Compliance Change Impact
    attack: |
      Changes in legal or regulatory requirements affect the current disaster recovery processes.
    threatType: Compliance Risk
    impactDesc: |
      Failure to meet updated contract or compliance requirements, resulting in legal penalties and operational disruptions.
    impactedSecObj:
      - REFID: REGULATORY_COMPLIANCE
      - REFID: COMPLIANCE
    attackers:
      - REFID: ACCIDENTAL_INSIDER
    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:N/I:L/A:L
    fullyMitigated: false
    compliance:
      - ISO27701:
          - ref: 5.2.1 (Identifying applicable legislation and contractual 
              requirements for PII)
          - ref: 5.4.1.2 (Documented PIMS roles, responsibilities and 
              authorities)
          - ref: 7.5.1 (Review of PIMS)
      - ISO27001:
          - ref: A.5.31 (Legal, statutory, regulatory and contractual 
              requirements)
          - ref: A.5.36 (Compliance with policies, rules and standards for 
              information security)
          - ref: A.5.35 (Independent review of information security)
    ticketLink: https://r3-cev.atlassian.net/browse/RR-654
    countermeasures:
      - ID: LEGAL_REVIEW
        title: Conduct Regular Legal and Compliance Reviews
        description: |
          Periodically assess contracts, regulations, and internal policies with legal teams to promptly adjust disaster recovery plans.
        inPlace: false
        public: true
  - ID: PANDEMIC_OUTBREAK
    title: Pandemic or Widespread Health Crisis
    attack: |
      A global health crisis disrupts normal business operations and reduces on-site workforce availability.
    threatType: Health Crisis, Operational Disruption
    impactDesc: |
      Significant limitations on physical operations causing delays in recovery and reduced incident response capability.
    impactedSecObj:
      - REFID: CONTINUITY
      - REFID: INCIDENT_RESPONSE_CAPABILITY
    attackers:
      - REFID: ACCIDENTAL_INSIDER
    CVSS:
      vector: CVSS:3.1/AV:P/AC:H/PR:N/UI:N/S:C/C:N/I:N/A:H
    fullyMitigated: false
    compliance:
      - ISO27701:
          - ref: 6.3.1.1 (PIMS objectives for business continuity)
          - ref: 6.4.1.1 (Remote working policy for PII)
          - ref: 7.2.1 (Conditions for collection and processing of PII)
      - ISO27001:
          - ref: A.5.29 (Information security during disruption)
          - ref: A.5.30 (ICT readiness for business continuity)
          - ref: A.6.7 (Remote working)
    ticketLink: https://r3-cev.atlassian.net/browse/RR-652
    countermeasures:
      - ID: HEALTH_GUIDELINES
        title: Implement Health and Safety Protocols
        description: |
          Adopt and enforce comprehensive health measures and remote work support in line with public health guidelines.
        inPlace: false
        public: true
  - ID: EMPLOYEE_STRIKE_DISRUPTION
    title: Employee Strikes or Work Stoppages
    attack: |
      Organized industrial actions or union strikes disrupt regular business processes.
    threatType: Operational Disruption
    impactDesc: |
      Loss of productivity and prolonged service disruption due to reduced workforce and delayed operations.
    impactedSecObj:
      - REFID: CONTINUITY
      - REFID: DAMAGE_MITIGATION
    attackers:
      - REFID: ACCIDENTAL_INSIDER
    CVSS:
      vector: CVSS:3.1/AV:P/AC:H/PR:N/UI:N/S:U/C:N/I:N/A:H
    fullyMitigated: false
    compliance:
      - ISO27701:
          - ref: 6.3.1.1 (PIMS objectives for business continuity)
          - ref: 6.2.1.1 (Management responsibilities for PII)
      - ISO27001:
          - ref: A.5.29 (Information security during disruption)
          - ref: A.5.30 (ICT readiness for business continuity)
          - ref: A.6.5 (Responsibilities after termination or change of 
              employment)
    ticketLink: https://r3-cev.atlassian.net/browse/RR-656
    countermeasures:
      - ID: STAFFING_CONTINGENCY
        title: Develop Robust Staffing and Contingency Plans
        description: |
          Prepare backup staffing and cross-training programs to maintain operations during labor disruptions.
        inPlace: false
        public: true
