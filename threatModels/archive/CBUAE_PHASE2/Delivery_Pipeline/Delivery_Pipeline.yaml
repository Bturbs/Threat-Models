ID: Delivery_Pipeline
schemaVersion: 2
parent: CBUAE_PHASE2

scope:
  description: |
    This threat model focuses on the delivery pipeline, considering its unique architecture and security trade-offs.

    **Refs:** [LLD - 9 Solution Delivery](#LLD)

  assets:
    - ID: CI_CD_PIPELINE
      title: CI/CD Pipeline
      type: process
      description: |
        The CI/CD pipeline automates the process of building, testing, and deploying code changes. Currently orchestrated by Jenkins.

        **Refs:** [LLD - 9.2 Solution Delivery/Solution promotion](#LLD)
      inScope: true
    - ID: SOURCE_CODE_REPOSITORY
      title: Source Code Repository
      type: data
      description: |
        The source code repository stores the codebase and version history.

        **Refs:** [LLD - 9.2.2.5 Solution Delivery/Solution promotion/Solution design/GitOps](#LLD)
      inScope: true
    - ID: SOLUTUION_ARTIFACT
      title: SOLUTUION_ARTIFACT
      type: data
      description: |
        Solution artifacts are the compiled binaries and other files generated during the build process.

        **Refs:** [LLD - 9.2.2.4 Solution Delivery/Solution promotion/Solution design/Artifact storage](#LLD)
      inScope: true
    - ID: DF_SYNC_ARTIFACT
      title: Artifact synchronization with the CB environments
      type: dataflow
      description: |
        The synchronization of artifacts with the CB environments. The current proposal leverages GlobalScape Workspaces using Jenkins on both ends 
        for this purpose.

        **Refs:** [LLD - 9.3.3.1 Solution Delivery/Artifact syncing/Proposed solution/Artifact syncing](#LLD)
      inScope: true
    - ID: GLOBALSCAPE_CREDENTIALS
      title: GlobalScape Credentials
      type: credentials
      description: |
        GlobalScape credentials are used to authenticate and authorize access to the GlobalScape Workspaces from R3's Jenkins.

        **Refs:** [LLD - 9.3.3.1 Solution Delivery/Artifact syncing/Proposed solution/Artifact syncing](#LLD), [LLD - 11 Secrets Management](#LLD)
      properties:
        location: |
          Jenkins credentials store (RFI: Jenkins credentials store for GlobalScape  @Ronan ?)
          Scope 
        type: password
      applicationRelated: false
      infrastructureRelated: true
      inScope: true
    - ID: JENKINS_STORED_CREDENTIALS
      title: Credentials stored in Jenkins
      type: credentials
      description: |
        Jenkins credentials are used to authenticate and authorize access to the source code
         repository, binaries and other services.

        **Refs:** [LLD - 11 Secrets Management](#LLD)
      applicationRelated: false
      infrastructureRelated: true
      inScope: true

analysis: |
  The delivery pipeline automates the process of building, testing, and deploying code changes.
   While it improves efficiency and consistency, it is considered part of the attack surface due to its access to the source code repository
    and deployment environments.

    **Refs:** [LLD - 9 Solution Delivery](#LLD), [LLD - 9.2 Solution Delivery/Solution promotion](#LLD)

    <img src="img/delivery_pipeline1.svg"/>

    <img src="img/delivery_pipeline2.svg"/>

threats:

  - ID: UNAUTHORIZED_SOURCE_AUTHORSHIP
    title: Unauthorized source code authorship
    attack: |
      An attacker may gain unauthorized access to the source code repository and inject malicious code (backdoors).

      **Refs:** [LLD - 9.2.2.5 Solution Delivery/Solution promotion/Solution design/GitOps](#LLD)
    impactDesc: |
      Unauthorized access to the source code repository can compromise the integrity and confidentiality of the codebase, 
      leading to potential security vulnerabilities and data breaches.

      **Refs:** [LLD - 9.1 Solution Delivery/Source and binary scanning](#LLD)
    impactedSecObj:
      - REFID: FULL_CIA
    threatType: Spoofing, Tampering, Information Disclosure
    CVSS:
      vector: CVSS:3.1/AV:A/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:H
    public: true
    fullyMitigated: true
    pentestTestable: true
    countermeasures:
      - ID: SOURCE_ARTIFACTS_ACCESS_CONTROL
        title: Source code and artifacts access control
        description: |
          Access to source code and artifacts repositories mandates SSO and RBAC.
          The Corda GitHub Organisation mandates SSO (using individuals R3.com account linked to their GitHub account) for non-public repos access.
          Access requests (including GitHub account) are recorded via IT Service desk requiring details of requested permission / team membership and approval before actioning.
          Account offboarding steps include removal from GitHub (as well as R3.com account).
          User sign in and R3 laptop operating system / AV logs are monitored through SIEM / 24x7x365 SOC.

          **Refs:** [LLD - 9.2.2.5 Solution Delivery/Solution promotion/Solution design/GitOps](#LLD), [LLD - 12 Identity and Access Management (IAM)](#LLD)
        inPlace: true
        public: true
      - ID: ENFORCED_CODE_REVIEWS
        title: Enforced Code Reviews
        description: |
          Enforce code reviews for all changes as pull requests to the source code repository 
          to detect and prevent unauthorized changes.
          (RFI: is this in place? @Ronan)

          **Refs:** [LLD - 9.2.2.5 Solution Delivery/Solution promotion/Solution design/GitOps](#LLD)
        inPlace: true
        public: true

  - ID: INTELLECTUAL_PROPERTY_DISCLOSURE
    title: Intellectual Property Disclosure
    attack: |
      An attacker may gain unauthorized access to the source code repository or exploit vulnerabilities in additional pipeline tools, leading to the disclosure of intellectual property.

      **Refs:** [LLD - 9.2.2.5 Solution Delivery/Solution promotion/Solution design/GitOps](#LLD)
    impactDesc: |
      Unauthorized access to the source code can result in the disclosure of proprietary algorithms, business logic, and other sensitive information, potentially leading to competitive disadvantage and financial loss.

      **Refs:** [LLD - 9.1 Solution Delivery/Source and binary scanning](#LLD)
    impactedSecObj:
      - REFID: CONFIDENTIALITY
    threatType: Information Disclosure
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:L/I:N/A:N
    public: true
    fullyMitigated: true
    pentestTestable: true
    countermeasures:
      - REFID: SOURCE_ARTIFACTS_ACCESS_CONTROL

      - ID: SECURITY_MONITORING
        title: Security Monitoring
        description: |
          Implement continuous security monitoring to detect and respond to unauthorized access
           attempts and vulnerabilities in pipeline tools.

          **Refs:** [LLD - 5.5 Corda Networks/Observability](#LLD)
        inPlace: false
        public: true


  - ID: MALICIOUS_BUILD_ARTIFACTS
    title: Malicious Build Artifacts
    attack: |
      An attacker may inject malicious code into the build artifacts.

      **Refs:** [LLD - 9.1.2 Solution Delivery/Source and binary scanning/Solution design](#LLD)
    impactDesc: |
      Malicious build artifacts can compromise the integrity and security of the deployed applications, 
      leading to potential data breaches and unauthorized access.

      **Refs:** [LLD - 9.2.2.4 Solution Delivery/Solution promotion/Solution design/Artifact storage](#LLD)
    impactedSecObj:
      - REFID: FULL_CIA
    threatType: Tampering, Information Disclosure
    CVSS:
      vector: CVSS:3.1/AV:A/AC:H/PR:H/UI:N/S:C/C:H/I:H/A:H
    public: true
    fullyMitigated: true
    pentestTestable: true
    countermeasures:
      - ID: CODE_SIGNING
        title: Code Signing
        description: |
          Implement code signing to ensure the authenticity and integrity of the build artifacts.

          **Refs:** [LLD - 10 Cryptography and Public Key Infrastructure](#LLD)
        inPlace: false
        public: true
      - ID: SECURE_ARTIFACT_TRANSFER_REST
        title: Secure Artifact transfer and storing
        description: |
          Implement secure artifact transfer and storage mechanisms to prevent tampering.

          **Refs:** [LLD - 9.3.3.1 Solution Delivery/Artifact syncing/Proposed solution/Artifact syncing](#LLD)
        inPlace: true
        public: true
      - ID: SEGREGATED_ARTIFACT_STORAGE
        title: Segregated Artifact Storage
        description: |
          Implement segregated storage for production,
           development, and testing artifacts to ensure that only the build 
           pipeline has access to production artifacts, while developers can only
            access development and testing artifacts.
            (RFI: SEGREGATED_ARTIFACT_STORAGE in place? @Ronan)

          **Refs:** [LLD - 9.2.2.4 Solution Delivery/Solution promotion/Solution design/Artifact storage](#LLD)
        inPlace: false
        public: true

  - ID: DEPLOYMENT_PIPELINE_TAMPERING
    title: Deployment Pipeline Tampering
    assets:
      - REFID: JENKINS_STORED_CREDENTIALS
    attack: |
      An attacker may tamper with the deployment pipeline to deploy unauthorized or
       malicious code to the production environment.

      **Refs:** [LLD - 9.4 Solution Delivery/Solution deployment](#LLD)
    impactDesc: |
      Tampering with the deployment pipeline can compromise the integrity and security of the deployed applications, 
      leading to potential data breaches and unauthorized access.

      **Refs:** [LLD - 9.4.2.4 Solution Delivery/Solution deployment/Solution design/Solution deployment process](#LLD)
    impactedSecObj:
      - REFID: FULL_CIA
    threatType: Tampering, Information Disclosure
    CVSS:
      vector: CVSS:3.1/AV:A/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:H
    public: false
    fullyMitigated: false
    pentestTestable: true
    ticketLink: https://r3-cev.atlassian.net/browse/R3SOL-4237

    countermeasures:
      - ID: PIPELINE_INTEGRITY_CHECKS
        title: Pipeline Integrity Checks
        description: |
          Implement integrity checks to detect and prevent tampering with the deployment pipeline.
          Implement also code owner controls within GitHub to restrict access to pipelines definition.
           (RFI: what are our current PIPELINE_INTEGRITY_CHECKS : @Ronan?  )

          **Refs:** [LLD - 9.2.2.5 Solution Delivery/Solution promotion/Solution design/GitOps](#LLD)
        inPlace: true
        public: true
      - REFID: ENFORCED_CODE_REVIEWS
      - ID: JENKINGS_STORED_CREDENTIAL_PROTECTION
        title: Jenkins Stored Credentials Protection
        description: |
          Protect Jenkins stored credentials to prevent unauthorized access to the deployment pipeline.
          (RFI: what are our current Jenkins Stored Credentials Protection : @Ronan?  )

          **Refs:** [LLD - 11 Secrets Management](#LLD)
        inPlace: false
        public: true
      - ID: SEGREGATED_JENKINGS
        title: Segregated Jenkins instance for solution artifact promotion
        description: |
          Implement segregated (from dev/test) Jenkins instance for different environments to
           prevent unauthorized access to the deployment pipeline.

          **Refs:** [LLD - 9.2.2.1 Solution Delivery/Solution promotion/Solution design/Environments and activities](#LLD)
        inPlace: false
        public: true
  - ID: INSUFFICIENT_TESTING
    title: Insufficient Testing
    attack: |
      Insufficient testing in the CI/CD pipeline may allow vulnerabilities to be deployed to production.

      **Refs:** [LLD - 9.1 Solution Delivery/Source and binary scanning](#LLD)
    impactDesc: |
      Insufficient testing can lead to the deployment of vulnerable code, compromising the security and stability of the application.

      **Refs:** [LLD - 9.1.2 Solution Delivery/Source and binary scanning/Solution design](#LLD)
    impactedSecObj:
      - REFID: FULL_CIA
    threatType: STRIDE
    CVSS:
      vector: CVSS:3.1/AV:A/AC:H/PR:N/UI:N/S:C/C:L/I:L/A:H
    public: true
    fullyMitigated: true
    pentestTestable: true
    countermeasures:
      - ID: FITNESS_FUNCTION_TOOLING
        title: Fitness Function Tooling
        description: |
          Fully implement comprehensive automated testing to ensure that code changes are thoroughly tested before deployment.
          Key features include:

          - Load injection for evaluating software behavior under different conditions.
          - Fault injection for testing system resilience.
          - Security scanning for identifying vulnerabilities.
          - Monitoring and dashboards for real-time observability.
          - Programmatic access to observability data.
          - Execution of fitness functions both locally and through CI servers, with results in machine-readable formats.

          **Refs:** [LLD - 9.1.2 Solution Delivery/Source and binary scanning/Solution design](#LLD), [LLD - 5.5 Corda Networks/Observability](#LLD)
        inPlace: true
        public: true

  - ID: STATIC_ANALYSIS_MISSESS
    title: Static Analysis misses/false negatives
    attack: |
      Static analysis tools may miss certain vulnerabilities.

      **Refs:** [LLD - 9.1.2 Solution Delivery/Source and binary scanning/Solution design](#LLD)
    impactDesc: |
      Missing vulnerabilities can lead to the deployment of insecure code, compromising the security and stability of the application.

      **Refs:** [LLD - 9.1.2 Solution Delivery/Source and binary scanning/Solution design](#LLD)
    impactedSecObj:
      - REFID: FULL_CIA
      - REFID: COMPLIANCE
    threatType: STRIDE
    CVSS:
      vector: CVSS:3.1/AV:A/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:H
    public: true
    fullyMitigated: true
    pentestTestable: true
    countermeasures:
      - ID: MULTIPLE_STATIC_ANALYSIS_TOOLS
        title: Use Multiple Static Analysis Tools
        description: |
          Use multiple static analysis tools to increase the likelihood of detecting vulnerabilities and reduce false positives.
          > Snyk Gradle plugin is used locally by developers. The CLI tool is used on Jenkins pipeline to scan for security vulnerabilities. 
          Once scanned, Snyk reports are generated and sent to the Snyk server to be analyzed. 
          These Snyk reports are monitored and results refreshed to check that no new vulnerabilities have been discovered. 
          Alerts are set up for any new vulnerabilities found. R3 uses a number of Snyk products
          Tools include:
            - Snyk Code
            - Snyk Open Source
            - Snyk IaC
            - Snyk Container

          **Refs:** [LLD - 9.1.2 Solution Delivery/Source and binary scanning/Solution design](#LLD)
        inPlace: true
        public: true
      - ID: FAIL_BUILD_ON_VULNERABILITIES
        title: Fail Build on new Vulnerabilities
        description: |
          Automatically fail the build if new vulnerabilities are detected by the security analysis tools and based
          on the policies defined on severity of the vulnerabilities.

          **Refs:** [LLD - 9.1.2 Solution Delivery/Source and binary scanning/Solution design](#LLD)
        inPlace: false
        public: true

  - ID: PROMOTION_PIPELINE_TAMPERING
    title: Promotion Pipeline Tampering
    attack: |
      An attacker may tamper with the promotion pipeline to promote unauthorized or
       malicious code to higher environments.

      **Refs:** [LLD - 9.2.2.6 Solution Delivery/Solution promotion/Solution design/Artifact promotion into the client registry](#LLD)
    impactDesc: |
      Tampering with the promotion pipeline can compromise the integrity and security of the deployed applications,
       leading to potential data breaches and unauthorized access.

      **Refs:** [LLD - 9.2.2.3 Solution Delivery/Solution promotion/Solution design/Environment promotion policy](#LLD)
    impactedSecObj:
      - REFID: FULL_CIA
    threatType: Tampering, Information Disclosure
    CVSS:
      vector: CVSS:3.1/AV:A/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:H
    public: false
    fullyMitigated: false
    pentestTestable: true
    ticketLink: https://r3-cev.atlassian.net/browse/R3SOL-4238

    countermeasures:
      - ID: PROMOTION_PIPELINE_INTEGRITY_CHECKS
        title: Promotion Pipeline Integrity Checks
        description: |
          Implement integrity checks to detect and prevent tampering with the promotion pipeline. 
          (RFI: what are our current PROMOTION_PIPELINE_INTEGRITY_CHECKS ? )

          **Refs:** [LLD - 9.2.2.3 Solution Delivery/Solution promotion/Solution design/Environment promotion policy](#LLD)
        inPlace: true
        public: true
  - ID: PIPELINE_CREDENTIAL_EXFILTRATION
    title: Pipeline Credential Exfiltration
    assets:
      - REFID: JENKINS_STORED_CREDENTIALS
      - REFID: GLOBALSCAPE_CREDENTIALS
    attack: |
      An attacker may exfiltrate credentials stored in the pipeline by executing pipeline code defined in repository
      configurations to gain unauthorized access.

      **Refs:** [LLD - 9.2.2.5 Solution Delivery/Solution promotion/Solution design/GitOps](#LLD), [LLD - 11 Secrets Management](#LLD)
    impactDesc: |
      Exfiltration of pipeline credentials can lead to unauthorized access to sensitive data,
       source code, and deployment environments, compromising the security and integrity of the system.

      **Refs:** [LLD - 11 Secrets Management](#LLD)
    impactedSecObj:
      - REFID: FULL_CIA
    threatType: Information Disclosure
    CVSS:
      vector: CVSS:3.1/AV:A/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:H
    public: false
    fullyMitigated: false
    pentestTestable: true
    ticketLink: https://r3-cev.atlassian.net/browse/R3SOL-4239
    countermeasures:
      - REFID: SEGREGATED_JENKINGS
title: Delivery Pipeline
