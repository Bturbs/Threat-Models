ID: InvestorBFF
schemaVersion: 2
title: Investor Backend BFF

authors: |
  Security Research team at R3

parent: CordaProtocolV1

scope:
  description: |
    Threat model for the **Investor Backend BFF** — a Rust/Axum HTTP service
    (`apps/investor-backend`) that sits between the `corda-rr` investor UI and
    the Solana vault program and third-party services.

    **Three security-critical functions:**

    1. **Compliance attestation signing** — produces borsh-serialised
       `ComplianceAttestationMessage` objects signed with an Ed25519 keypair
       whose public key is configured on-chain as `vault.compliance_authority`.
       A valid attestation is a pre-instruction required by every
       investment/redemption proposal. **This service does not perform
       Hypernative AML screening** — it is a signing-only path. The Kotlin
       InvestorGateway (`services/investor-gateway`) is the screened path.

    2. **Legal-agreement acceptance** — records investor acceptance of Terms
       and SLA agreements onto Privy `customMetadata` using the Privy app
       secret (write-API credential). The `corda-rr` UI gates vault access
       on this metadata being set at the current version; forging it bypasses
       the legal agreement enforcement gate.

    3. **Vault and rewards data proxy** — reads vault account state directly
       from Solana RPC (using compiled `vault_core` types) and proxies rewards
       data to/from the Fuul leaderboard API, shielding third-party API keys
       from the browser.

    **Repository:** `corda-protocol-mvp/apps/investor-backend`

    **Trust boundaries crossed:**

    - Browser → investor-backend (cross-origin, for agreement acceptance only;
      `INVESTOR_BACKEND_CORS_ALLOWED_ORIGINS` controls which origins are allowed)
    - `corda-rr` server → investor-backend (server-to-server, for attestation
      and vault reads; no shared auth token — network isolation is the only
      control)
    - investor-backend → Privy API (HTTPS; uses app secret for metadata writes,
      public JWKS for token verification)
    - investor-backend → Fuul API (HTTPS; uses `FUUL_API_KEY` bearer token)
    - investor-backend → Solana RPC (HTTPS; read-only)

  assets:
    - ID: IB_SERVICE
      type: system
      title: Investor Backend BFF Service
      description: |
        Rust/Axum HTTP service. Holds secrets in process memory at runtime.
        Loads the attestation signer keypair from a filesystem path at startup
        (`ATTESTATION_SIGNER_KEYPAIR_PATH`). Binds to port 8380 by default.
      inScope: true

    - ID: IB_ATTESTATION_SIGNER_KEYPAIR
      type: credential
      title: Ed25519 Compliance Attestation Signer Keypair
      description: |
        Ed25519 keypair whose public key matches `vault.compliance_authority`
        on-chain. Used to sign borsh-serialised `ComplianceAttestationMessage`
        objects for every investment and redemption proposal.

        Loaded from a JSON keypair file at process startup
        (`ATTESTATION_SIGNER_KEYPAIR_PATH`). After loading the keypair is held
        in process memory only; the private key bytes are not accessible via
        any API route. Possession of the private key is equivalent to authority
        to approve any investment or redemption transaction the vault will accept.
      inScope: true
      properties:
        location: Filesystem at startup (JSON file), then process memory only
        format: 64-byte Solana keypair (seed ‖ pubkey), JSON byte-array
        publicKeyLength: 256 bits
        privateKeyLength: 256 bits
      applicationRelated: true
      infrastructureRelated: true

    - ID: IB_PRIVY_APP_SECRET
      type: credential
      title: Privy App Secret
      description: |
        Privy application secret (`PRIVY_APP_SECRET`) that authorises
        management-API calls to write `customMetadata` on any Privy user
        in the application. Used exclusively by the `/v1/auth/accept-agreement`
        route to stamp which legal-agreement versions the investor has accepted.

        The `corda-rr` UI reads back `customMetadata` (via the Privy access
        token) to decide whether the legal-agreement gate has been cleared.
        Writing this metadata for arbitrary users requires only the app secret,
        not the user's own credentials.
      inScope: true
      properties:
        location: Environment variable `PRIVY_APP_SECRET`
        format: Opaque string credential issued by Privy dashboard
      applicationRelated: true
      infrastructureRelated: false

    - ID: IB_FUUL_API_KEY
      type: credential
      title: Fuul Rewards API Key
      description: |
        Bearer token (`FUUL_API_KEY`) authorising calls to `api.fuul.xyz`
        leaderboard and points endpoints. Shields the key from the browser —
        `corda-rr` calls the investor-backend proxy routes rather than
        Fuul directly.
      inScope: true
      properties:
        location: Environment variable `FUUL_API_KEY`
        format: Opaque bearer token issued by Fuul dashboard
      applicationRelated: true
      infrastructureRelated: false

    - ID: DF_BROWSER_TO_IB
      type: dataflow
      title: Browser → Investor Backend (Agreement Acceptance)
      description: |
        Cross-origin HTTPS call from the investor's browser (running `corda-rr`)
        directly to the investor-backend `/v1/auth/accept-agreement`.
        The investor's Privy access token (ES256 JWT) is sent in the
        `Authorization: Bearer` header. CORS is controlled by
        `INVESTOR_BACKEND_CORS_ALLOWED_ORIGINS`.

        This is the only route exposed directly to the browser;
        all other routes are called server-to-server.
      inScope: true

    - ID: DF_CORDARR_TO_IB
      type: dataflow
      title: corda-rr server → Investor Backend (Attestation and Vault Reads)
      description: |
        Server-to-server HTTPS calls from the `corda-rr` SSR layer to the
        investor-backend for:

        - `POST /v1/attestation/{action}` — compliance attestation signing
        - `GET /v1/vault/{vault_id}` — vault account state reads

        No shared authentication token. Network-level isolation is the
        only access control between these two services.
      inScope: true

    - ID: DF_IB_TO_PRIVY
      type: dataflow
      title: Investor Backend → Privy API
      description: |
        HTTPS calls from the investor-backend to `auth.privy.io`:

        - JWKS fetch (public, unauthenticated) — to obtain verification keys
          for validating investor access tokens
        - User metadata write (`PATCH /api/v1/users/{did}`) — to stamp
          agreement acceptance, authenticated with `PRIVY_APP_SECRET`
      inScope: true

    - ID: DF_IB_TO_FUUL
      type: dataflow
      title: Investor Backend → Fuul API
      description: |
        HTTPS calls from the investor-backend to `api.fuul.xyz` to proxy
        leaderboard and points data. Authenticated with `FUUL_API_KEY`.
      inScope: true

  assumptions:
    - ID: NETWORK_ISOLATION
      description: |
        The investor-backend attestation and vault-read routes
        (`/v1/attestation/*`, `/v1/vault/*`) are not reachable from the
        public internet. Network perimeter (VPC, firewall rules) restricts
        access to the `corda-rr` server process only. The agreement route
        (`/v1/auth/accept-agreement`) is the only one intended to accept
        browser connections, gated by CORS.

    - ID: PRIVY_JWKS_INTEGRITY
      description: |
        The Privy JWKS endpoint (`https://auth.privy.io/api/v1/apps/{id}/jwks`)
        is assumed authentic and not under attacker control during normal
        operations. Compromise of Privy's JWKS infrastructure is out of scope.

    - ID: KEYPAIR_FILE_PROVISIONING
      description: |
        The keypair file provisioned at `ATTESTATION_SIGNER_KEYPAIR_PATH`
        is assumed to have been provisioned securely by the operations team.
        Key generation, transport, and initial provisioning processes are
        modeled in the SignOps child model.

  attackers:
    - REFID: EXTERNAL_ATTACKER
    - REFID: MALICIOUS_USER
    - REFID: DEVELOPER

analysis: |
  The Investor Backend BFF is a **dual-trust** service: it holds credentials
  that authorize on-chain vault operations (attestation signer) and off-chain
  legal-gate enforcement (Privy app secret) simultaneously. Compromise of
  either has systemic effect across all investors and all vault operations.

  **Critical design asymmetry — attestation without AML screening:**

  The `corda-rr` attestation resource route supports three modes in priority
  order: (1) investor-backend proxy, (2) local TS signer, (3) upstream Kotlin
  InvestorGateway. Only Mode 3 performs Hypernative AML screening. Modes 1
  and 2 sign attestations unconditionally for any investor pubkey. If `corda-rr`
  is deployed with `INVESTOR_BACKEND_URL` set (enabling Mode 1), compliance
  screening is silently bypassed for every deposit and redemption, and
  sanctions-listed wallets can transact freely.

  **Key attack surfaces:**

  1. Keypair file on the host filesystem — lower protection than HSM or
     secrets-manager paths; any host-level read access yields the signing key.
  2. Unauthenticated attestation endpoint — the service relies on network
     isolation rather than request-level auth; SSRF or network misconfig
     gives any caller signing authority.
  3. Privy app secret in env var — process-level access (any container escape,
     `/proc/self/environ` read, log capture) yields write authority over all
     user agreements.
  4. CORS configuration — the agreement route is intentionally cross-origin;
     a misconfigured allowlist widens the attack surface to arbitrary origins.

threats:
  - ID: ATTESTATION_SIGNER_KEY_COMPROMISE
    title: Attestation signer keypair exfiltrated from host filesystem
    attack: |
      The Ed25519 attestation signer keypair is loaded at startup from a JSON
      file on the host filesystem (`ATTESTATION_SIGNER_KEYPAIR_PATH`). An
      attacker who gains host-level read access can exfiltrate the file via:

      - Directory traversal or path injection in any co-located service
      - Container escape to host filesystem
      - Kubernetes secret/configmap misconfiguration exposing the file path
      - Snapshot or backup of the host volume containing the keypair file
      - Insider with filesystem access on the deployment host

      Unlike the Kotlin InvestorGateway (which also holds this keypair in
      process memory), the Rust service reads from a **named filesystem path**,
      making the key's location predictable and discoverable via environment
      variable inspection (`ATTESTATION_SIGNER_KEYPAIR_PATH`).

    threatType: Information Disclosure, Elevation of Privilege
    impactDesc: |
      Possession of the private key is equivalent to `vault.compliance_authority`
      on-chain. The attacker can:

      - Sign compliance attestations for any investor pubkey, any amount,
        any action (investment or redemption)
      - Bypass Hypernative AML screening entirely — no API call is required
      - Create attestations with future `expires_at` values for unlimited
        operational window
      - Enable investments or redemptions by sanctioned or non-KYC'd wallets
      - The on-chain vault program cannot distinguish legitimate from forged
        attestations — both verify identically against `compliance_authority`

    impactedSecObj:
      - REFID: COMPLIANCE
      - REFID: USER_FUNDS_SAFETY
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: DEVELOPER
    assets:
      - REFID: IB_ATTESTATION_SIGNER_KEYPAIR
      - REFID: IB_SERVICE
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:N'
    pentestTestable: true
    fullyMitigated: false
    countermeasures:
      - ID: IB_KEYPAIR_SECRETS_MANAGER
        title: Move attestation keypair to a secrets manager or HSM
        description: |
          Replace the filesystem keypair file with a secrets-manager-backed
          path (e.g., AWS Secrets Manager, Azure Key Vault, HashiCorp Vault)
          or a hardware security module so the private key bytes are never
          written to the host filesystem and are not recoverable via file-read
          attacks. The signing operation would be delegated to the HSM/manager
          rather than performed locally with an in-memory key.
        inPlace: false
        public: true

      - ID: IB_KEYPAIR_FILE_PERMISSIONS
        title: Restrict keypair file to process user with minimal permissions
        description: |
          Ensure the keypair file is owned by the service account with mode
          `0400` (owner read-only, no group or world access). Mount it via
          a Kubernetes secret volume rather than a persistent host path.
          Rotate the key and update `vault.compliance_authority` if the
          host is ever suspected compromised.
        inPlace: false
        public: true
        operational: true
        operator: Platform Security Team

  - ID: ATTESTATION_NO_AML_SCREENING
    title: Attestation signing path bypasses Hypernative AML screening
    attack: |
      The `corda-rr` attestation resource route (`api.attestation.$action.ts`)
      selects one of three signing modes in priority order:

      1. **investor-backend proxy** (`INVESTOR_BACKEND_URL` set) — signs via
         this service; **no AML screening performed**
      2. Local TS signer (`GATEWAY_SIGNER_KEYPAIR` set) — signs in the SSR
         process; **no AML screening performed**
      3. Kotlin InvestorGateway (`GATEWAY_URL` set) — the only path that
         screens the investor wallet against Hypernative before signing

      If `corda-rr` is deployed with `INVESTOR_BACKEND_URL` set (Mode 1,
      documented as "preferred"), every investment and redemption proposal
      receives a compliance attestation with zero AML/sanctions checking.
      A sanctions-listed wallet transacts identically to a cleared wallet
      from the on-chain program's perspective.

      The `corda-rr` code comment labels Mode 1 as "preferred" because it
      shares a Rust type with the on-chain verifier, eliminating byte-layout
      drift. This technical advantage is achieved at the cost of silently
      removing the compliance screening step.

    threatType: Elevation of Privilege
    impactDesc: |
      Compliance screening becomes a no-op for any deployment where
      `INVESTOR_BACKEND_URL` is configured:

      - Sanctions-listed wallets (OFAC, EU) receive valid attestations and
        can invest or redeem without restriction
      - KYC/AML obligations are violated at the protocol level, not just
        for individual investors
      - Regulatory enforcement risk for the protocol operator
      - The on-chain whitelist enforcement remains active, but the
        attestation gate — the second layer of AML defence — is absent

    impactedSecObj:
      - REFID: COMPLIANCE
      - REFID: INTEGRITY
    attackers:
      - REFID: MALICIOUS_USER
      - REFID: EXTERNAL_ATTACKER
    assets:
      - REFID: IB_SERVICE
      - REFID: DF_CORDARR_TO_IB
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:H/A:N'
    pentestTestable: true
    fullyMitigated: false
    countermeasures:
      - ID: IB_ATTESTATION_ADD_SCREENING
        title: Add Hypernative screening to the investor-backend attestation path
        description: |
          Before signing an attestation, the investor-backend should call the
          Hypernative reputation API (or another AML screening provider) to
          verify the investor wallet is not sanctions-listed. The response
          should gate signing: a rejected wallet gets a 403 with no signature.

          Until this is implemented, the Kotlin InvestorGateway (`GATEWAY_URL`
          mode) must be used as the attestation provider in any production or
          compliance-relevant environment.
        inPlace: false
        public: true

      - ID: IB_ATTESTATION_MODE_DOCUMENTED
        title: Operational runbook specifying which attestation mode to use per environment
        description: |
          Document per-environment requirements for the `corda-rr` attestation
          mode selection. Production environments must set `GATEWAY_URL` (Mode 3)
          rather than `INVESTOR_BACKEND_URL` (Mode 1) until Mode 1 integrates
          AML screening. This constraint must be enforced in deployment config
          review and checked in CI pipeline configuration.
        inPlace: false
        public: true
        operational: true
        operator: Platform Security Team

  - ID: UNAUTHENTICATED_ATTESTATION_ENDPOINT
    title: Attestation endpoint carries no request-level authentication
    attack: |
      `POST /v1/attestation/{action}` accepts any well-formed JSON body and
      returns a signed compliance attestation. There is no bearer token,
      API key, mTLS, or other request-level authentication on this route.
      The only access control is **network-level isolation** (the service is
      not intended to be internet-facing).

      An attacker who can reach the investor-backend on port 8380 — via:

      - Server-Side Request Forgery (SSRF) in any co-located service
      - Network misconfiguration that exposes the port to untrusted networks
      - Lateral movement after initial compromise of another service in the
        same network segment

      can request attestations for any investor pubkey and any amount,
      including sanctions-listed wallets, without triggering any alert.

    threatType: Elevation of Privilege
    impactDesc: |
      Any reachable caller becomes a legitimate attestation requester:

      - Signed attestations for arbitrary investor pubkeys without KYC/AML
        checks
      - Effectively the same impact as `ATTESTATION_SIGNER_KEY_COMPROMISE`
        without needing the private key — the service acts as an oracle
      - SSRF from any co-located service (e.g., indexer, corda-rr) is
        sufficient if those services can make outbound HTTP calls

    impactedSecObj:
      - REFID: COMPLIANCE
      - REFID: USER_FUNDS_SAFETY
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: MALICIOUS_USER
    assets:
      - REFID: IB_SERVICE
      - REFID: IB_ATTESTATION_SIGNER_KEYPAIR
      - REFID: DF_CORDARR_TO_IB
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:N/I:H/A:N'
    pentestTestable: true
    fullyMitigated: false
    countermeasures:
      - ID: IB_ATTESTATION_API_KEY
        title: Add shared secret or mTLS authentication to the attestation route
        description: |
          Protect `/v1/attestation/{action}` with a shared API key in an
          `Authorization` header (or mTLS between `corda-rr` and the
          investor-backend). Only `corda-rr` should possess the key. This
          ensures SSRF from other services cannot obtain attestations even if
          the port is reachable.
        inPlace: false
        public: true

      - ID: IB_NETWORK_ISOLATION
        title: Enforce network-level isolation — attestation port not internet-reachable
        description: |
          Ensure port 8380 (or whichever port the service binds) is blocked
          at the network perimeter and not exposed via any load balancer or
          ingress. Only the `corda-rr` server's network identity (VPC security
          group, Kubernetes NetworkPolicy) should be able to establish connections.
        inPlace: false
        public: true
        operational: true
        operator: Platform Security Team

  - ID: PRIVY_APP_SECRET_COMPROMISE
    title: Privy app secret exfiltrated — agreement gate forged for any user
    attack: |
      The Privy app secret (`PRIVY_APP_SECRET`) is loaded from an environment
      variable and held in process memory. It authorises write calls to
      `PATCH /api/v1/users/{did}` on Privy's management API, which sets
      `customMetadata` on any user in the application.

      An attacker who obtains the secret — via:

      - `/proc/self/environ` read (container escape or SSRF to metadata endpoint)
      - Environment variable leak in application logs or error traces
      - Kubernetes secret exfiltration (if stored as a K8s Secret without
        encryption-at-rest)
      - Insider with deployment access

      can stamp any investor's `customMetadata` as having accepted the current
      Terms (`termsVersion: "1.0"`) and SLA (`slaVersion: "1.0"`) without the
      investor performing any action. Bumping the agreement versions in the
      codebase is the only revocation mechanism.

    threatType: Tampering, Elevation of Privilege
    impactDesc: |
      The legal-agreement gate in `corda-rr` is controlled entirely by
      `customMetadata` written via this secret. An attacker who holds the
      secret can:

      - Grant vault access to any investor who has not completed the agreement
        flow (including non-KYC'd investors if the KYC gate is also bypassed)
      - Silently pre-accept future agreement versions before they are published,
        preventing the re-prompt mechanism from working
      - Operate undetected — Privy metadata writes are not audited on-chain

    impactedSecObj:
      - REFID: COMPLIANCE
      - REFID: INTEGRITY
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: DEVELOPER
    assets:
      - REFID: IB_PRIVY_APP_SECRET
      - REFID: IB_SERVICE
      - REFID: DF_IB_TO_PRIVY
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:N/I:H/A:N'
    pentestTestable: true
    fullyMitigated: false
    countermeasures:
      - ID: IB_PRIVY_SECRET_IN_SECRETS_MANAGER
        title: Store Privy app secret in a secrets manager, not an env var
        description: |
          Move `PRIVY_APP_SECRET` from an environment variable to a
          secrets-manager-backed reference (AWS Secrets Manager, Azure Key Vault,
          HashiCorp Vault). Rotate the secret periodically and alert on
          unexpected Privy management API calls via Privy's audit log.
        inPlace: false
        public: true

      - ID: IB_PRIVY_AUDIT_LOG_MONITORING
        title: Monitor Privy audit log for unexpected metadata writes
        description: |
          Enable Privy audit logging and alert on metadata writes that do not
          correspond to an investor completing the agreement flow in `corda-rr`.
          Anomalous bulk writes or writes at unexpected times are indicators of
          secret compromise.
        inPlace: false
        public: true
        operational: true
        operator: Security Team

  - ID: PRIVY_JWT_VERIFICATION_BYPASS
    title: Privy access token replay or verification bypass enables agreement forgery
    attack: |
      The `/v1/auth/accept-agreement` route verifies the caller's identity by
      validating the Privy access token (ES256 JWT) sent in the
      `Authorization: Bearer` header. The token's `sub` claim (Privy DID) is
      used as the user identity — the request body contains only the agreement
      name, not the user identifier, so a forged or replayed token is sufficient
      to stamp a different user's agreements.

      Attack vectors:

      - **Token replay**: a valid Privy access token stolen from one session
        (e.g., via XSS in `corda-rr`, network interception, or log capture)
        can be sent to this endpoint to stamp that user's agreements.
      - **JWKS cache miss exploitation**: the service fetches Privy's JWKS
        lazily and caches by `kid`. A token with an unknown `kid` triggers a
        JWKS re-fetch. If an attacker can MITM the JWKS fetch (e.g., via DNS
        poisoning or Privy infrastructure compromise), a malicious verification
        key could be injected.
      - **Algorithm confusion**: if token validation does not explicitly pin the
        `alg` to `ES256`, an attacker might present an `HS256` token using the
        JWKS public key bytes as the HMAC secret.

    threatType: Spoofing, Tampering
    impactDesc: |
      A stolen or bypassed Privy access token allows the attacker to stamp
      agreements for the token's owner without their consent. Combined with
      a stolen `PRIVY_APP_SECRET`, an attacker can stamp agreements for any
      user at any time.

    impactedSecObj:
      - REFID: COMPLIANCE
      - REFID: INTEGRITY
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: MALICIOUS_USER
    assets:
      - REFID: DF_BROWSER_TO_IB
      - REFID: IB_SERVICE
      - REFID: DF_IB_TO_PRIVY
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:N/I:H/A:N'
    pentestTestable: true
    fullyMitigated: false
    countermeasures:
      - ID: IB_PRIVY_JWT_ALG_PIN
        title: Pin JWT algorithm to ES256 in validation configuration
        description: |
          Ensure the `jsonwebtoken` validation configuration explicitly sets
          `algorithms: [Algorithm::ES256]` and rejects tokens with any other
          `alg` header value. This prevents algorithm-confusion attacks.
        inPlace: true
        public: true

      - ID: IB_PRIVY_TOKEN_SHORT_TTL
        title: Rely on Privy access token short TTL to limit replay window
        description: |
          Privy access tokens are short-lived (minutes). The replay window is
          bounded by the token TTL. The investor-backend does not maintain a
          token replay cache — revoked or expired tokens are rejected by the
          `exp` claim check in JWT validation.
        inPlace: true
        public: true

  - ID: CORS_MISCONFIGURATION
    title: Overly broad CORS allows cross-origin agreement stamping
    attack: |
      The `/v1/auth/accept-agreement` route is intentionally accessible
      cross-origin from the investor's browser. CORS is configured via
      `INVESTOR_BACKEND_CORS_ALLOWED_ORIGINS` (comma-separated list). If this
      is set to a wildcard (`*`), an overly broad pattern, or if an
      attacker-controlled origin is inadvertently included, a malicious website
      can:

      - Trick an authenticated investor into visiting a page that makes a
        cross-origin POST to the agreement endpoint using the investor's Privy
        access token (stored in `corda-rr`'s Privy SDK context or as a cookie)
      - Stamp the victim's agreements without their knowledge

      The mechanism requires that the attacker can obtain or trigger use of
      the victim's Privy access token from the malicious origin, which is
      possible if the Privy SDK's `getAccessToken()` is callable cross-origin
      or if the token is stored in non-HttpOnly cookies.

    threatType: Elevation of Privilege
    impactDesc: |
      An investor's legal agreements are recorded without their informed
      consent. Combined with other bypasses (e.g., KYC mock), this could
      enable a malicious actor to coerce investors into the protocol.

    impactedSecObj:
      - REFID: COMPLIANCE
      - REFID: INTEGRITY
    attackers:
      - REFID: EXTERNAL_ATTACKER
    assets:
      - REFID: DF_BROWSER_TO_IB
      - REFID: IB_SERVICE
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:N/I:L/A:N'
    pentestTestable: true
    fullyMitigated: false
    countermeasures:
      - ID: IB_CORS_STRICT_ALLOWLIST
        title: Restrict CORS origins to exact corda-rr deployment URLs
        description: |
          Set `INVESTOR_BACKEND_CORS_ALLOWED_ORIGINS` to the exact origin(s)
          of the `corda-rr` deployment (e.g., `https://app.corda.io`). Never
          use wildcard. Validate the list as part of deployment configuration
          review. The service defaults to no CORS (same-origin only) when the
          variable is unset, which is safe for server-to-server environments.
        inPlace: false
        public: true
        operational: true
        operator: Platform Security Team

  - ID: FUUL_API_KEY_COMPROMISE
    title: Fuul rewards API key exfiltrated
    attack: |
      The Fuul rewards API key (`FUUL_API_KEY`) is loaded from an environment
      variable. An attacker who reads the process environment (via container
      escape, SSRF to the metadata endpoint, or log capture) obtains the key
      and gains direct access to the Fuul leaderboard API.

    threatType: Information Disclosure
    impactDesc: |
      With a compromised Fuul API key an attacker can:

      - Enumerate all investor wallet addresses and their points/rank
        (leaderboard intelligence)
      - Depending on Fuul API permissions, potentially manipulate points
