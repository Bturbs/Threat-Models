  assumptions:
    - ID:
      description: |
        A Corda cluster may host several identities. Identities trust the Cluster.   
        > *It is worth highlighting that the Holding Identity has a trusting relationship with the Node 
        and does not require any defensive measures to ensure privacy.* 
        [REF](https://github.com/corda/platform-eng-design/blob/jmac/c5-identity/core/corda-5/corda-5.0/the-host/corda-identity.md)

        The Cluster then has an higher level of trust than the identity: **the Corda cluster does not trust the identity.**  


  attackers:
    - ID: ANONYMOUS
      title: Anonymous Internet User
      description: |
        Any anonymous internet user
        Can call APIs: [post_hello](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/Hello-RPC-API/operation/post_hello) and 
        [get_hello_getprotocolversion](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/Hello-RPC-API/operation/get_hello_getprotocolversion)
        Can also connect to externally exposed endpoints e.g. [DF_P2P](#DF_P2P)
      inScope: true

    - ID: INFRASTRUCTURE_OPERATOR
      title: Infrastructure Operator
      description: |
        Personnel delegated to install/deploy and maintain the Corda5 Cluster Infrastructure. Has access to basically all hardware/
        software and infrastructure on the Corda 5 Cluster.

        **Main use cases:**

        - Install cluster:
          - install Kafka
          - install VNode DB
          - install cluster DB
          - Install K8s workers
          - load balancers
          - Proxies
          -...
        - Access K8 APIs, DBs networks,  hardware...
        - **Do not** Authenticates as Coda user (does not use RPC APIs)

      inScope: false
    - ID: CORDAPP_PUBLISHER
      title: CorDapp developer and publisher
      description: |
        Any user/entity that creates and signs CPKs and CPBs
        **Main use cases:**

          - Distribute his public key/sign certificate
          - Signs and publish CPKs and CPBs
#           - Distribute his public key/sign certificate (R.F.I.: pls confirm CORDAPP_PUBLISHER identity verification)

      inScope: true

    - ID: VNODE_OPERATOR
      title: VNode Operator
      description: |
        Acts as the legal entity accountable for running a CPI/Cordapp/Flows

        **Main use cases:**

          - Joins an Application Network:
              - Retrieves the group policy from the MGM required to join the membership group [API doc](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/MGM-API/operation/get_mgm__holdingidentityshorthash__info) 
              - checks the statuses of all registration requests for a specified holding identity [API doc](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/Member-Registration-API/operation/get_membership__holdingidentityshorthash_)
              - checks the status of the specified registration request for a holding identity [API doc](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/Member-Registration-API/operation/get_membership__holdingidentityshorthash___registrationrequestid_)
              - configures a holding identity as a network participant by setting properties required for P2P messaging. 
              [API doc](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/Network-API/operation/put_network_setup__holdingidentityshorthash_)
              
          - Discovers Application Network members: 
              - Retrieves a list of all active and pending members in the membership group.
              [API doc](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/Member-Lookup-API/operation/get_members__holdingidentityshorthash_)    

        It is also referred as:
          - **Group member** (after VNode onboarding)
          - **Peer member** 
          - **Counterparty** 

      inScope: true

    - ID: NOTARY_OPERATOR
      title: Notary Operator
      description: |
        An user operator of a Notary VNode of the Corda network.

      inScope: true

    - ID: NETWORK_OPERATOR
      title: Network Operator (MGM)
      description: |
        Initialize and maintain a Application Network: signs CPIs, accepts member requests, etc

        **Main use cases:**      
        - Uploads its own Session/Identity certificate for P2P communications 
        - request the CSR (certificate signing request for its own identity) 
        -  generate a certificate signing request (CSR) for a tenant [API doc](https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/Certificates-API/operation/post_certificates__tenantid___keyid_)

        It is also referred as:
          - **MGM** (Membership Group Manager) 
