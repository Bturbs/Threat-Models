scope:
  securityObjectives:
    - ID: FULL_CIA
      title: Confidentiality Integrity and availability of the Central Bank 
        Digital Currency network.
      description: |
        Ability to maintain fundamental confidentiality
        integrity and availability of the CBDC or of a specific cluster
      group: General security Objectives

    - ID: INTEGRITY
      title: Data integrity
      description: |
        Ability to maintain fundamental integrity of the CBDC network or of a specific cluster data 
      contributesTo:
        - REFID: FULL_CIA
      group: General security Objectives

    - ID: CONFIDENTIALITY
      title: Data confidentiality
      description: |
        Ability to maintain fundamental confidentiality of the CBDC network or of a specific cluster data
      contributesTo:
        - REFID: FULL_CIA
      group: General security Objectives

    - ID: AVAILABILITY
      title: System availability
      description: |
        Ability to maintain fundamental availability of the CBDC network or of a specific cluster
      contributesTo:
        - REFID: FULL_CIA
      group: General security Objectives

    - ID: COMPLIANCE
      title: Corda 5 compliance
      description: |
        Ability to obtain and maintain maintain compliance with required regulations
      # failureImpact: Non compliance, legal repercussions, business monetary
      #    loss, non adequacy for regulated markets 
      contributesTo:
        - REFID: AVAILABILITY
      group: Business specific
    - ID: NON_REPUDIATION
      title: Non repudiation of CBDCs events
      description: |
        Non repudiation of CBDCs issuance and redemptions workflows events 
      contributesTo:
        - REFID: INTEGRITY
        - REFID: COMPLIANCE
      group: Business specific

    - ID: MEMBERSHIP_CONTROL
      title: Membership Control
      description: The CB should have a membership control. This comprises; 
        Onboarding participants, manage participants access and manage currency 
        usage rights
      contributesTo:
        - REFID: FULL_CIA
      group: Business specific

    - ID: CURRENCY_CONFIGURATION
      title: Currency Configuration Control
      description: The CB should have a currency configuration control. This 
        comprises; currency definition, currency controls, and domestic CBDC 
        programmable constraints.
      contributesTo:
        - REFID: INTEGRITY
        - REFID: AVAILABILITY
      group: Business specific


    - ID: ISSUANCE_REDEMPTION_CONTROL
      title: Token Issuance and Redemption Control
      description: The Central bank should have control over token issuance and 
        redemption. This comprises; mBridge issuance, wholesale issuance, and 
        domestic retail issuance
      contributesTo:
        - REFID: INTEGRITY
        - REFID: AVAILABILITY
      group: Business specific


    - ID: REPORTING_MONITORING
      title: Reporting and monitoring
      description: The central bank should have monitoring control. This 
        comprises; monitor issuance and redemption requests status, reporting 
        and reconciliation, and  data analytics dashboard
      contributesTo:
        - REFID: INTEGRITY
      group: Business specific

    - ID: MONETARY_INTEGRITY
      title: Reliable monetary base
      description: Monetary base is as expected according to the Central Bank 
        policies
      contributesTo:
        - REFID: INTEGRITY
        - REFID: AVAILABILITY
      group: Business specific

    - ID: DEFENSE_IN_DEPTH
      title: Defense in depth, multiple layers
      description: |
        Preventative defence measures should be implemented at multiple layers, 
        for example across the network, application and data access layers.
      contributesTo:
        - REFID: COMPLIANCE
      group: Architectural

    - ID: ZERO_TRUST
      title: Zero trust
      description: |
        Zero-trust security practices including strong authentication, 
        least privilege, network segmentation, and continuous validation of 
        identity and trust, etc.
      contributesTo:
        - REFID: COMPLIANCE
      group: Architectural

    - ID: MINIMAL_RISK_SURFACE
      title: Minimal risk surface / de-scope
      description: |
        The central bank has designed the CBDC
        architecture in such a way as to minimise the
        attack surface for sensitive data and CBDC
        value, for example by reducing the number of
        parties in the ecosystem to hold financial value
        or store/process unencrypted sensitive data.
      contributesTo:
        - REFID: COMPLIANCE
      group: Architectural

    - ID: ADMIN_ATTACK_RESILIENCE
      title: Admin attack resilience
      description: |
        The system is designed in a way that an insider user with administrative privileges is not able to compromise the security of the system 
        (other than partial AVAILABILITY). For example it cannot impersonate other users, tamper the data, etc. 
      contributesTo:
        - REFID: MINIMAL_RISK_SURFACE
      group: Architectural


    - ID: DATA_TAMPER_RESILIENCY
      title: Data stored is resilient to tampering
      description: |
        Any tampering attack (compromising data integrity) performed in a data Storage 
        (e.g. Kafka, Database ...) is detected by design by the application. For example the data is cryptographically 
        signed with keys that are not in the data storage.
      contributesTo:
        - REFID: DEFENSE_IN_DEPTH
        - REFID: MINIMAL_RISK_SURFACE
      group: Architectural

    - ID: DATA_LEAK_RESILIENCY
      title: Data stored is resilient to disclosure
      description: |
        A leak of stored data may compromise confidentiality but do not compromise Integrity a availability or allow to use
         that data to perform specific attacks on the system.  
        For example some of the data, specifically the most sensitive, for example authentication/signature keys, is cryptographically 
        encrypted with keys that are not in the data storage.
      contributesTo:
        - REFID: DEFENSE_IN_DEPTH
        - REFID: MINIMAL_RISK_SURFACE
      group: Architectural

    - ID: SECURE_DEPLOYMENT
      title: Secure deployment and DevSecOps practices
      description: |
        Using DevSecOps to streamline and automate the process to build, test, deploy
        and operate software, to achieve agility without compromising quality control
      contributesTo:
        - REFID: FULL_CIA
      group: Operational

    - ID: APP_LOGIC_MONITORING
      title: Application logic anomaly detection
      description: |
        A real-time monitoring and risk-based decision capability to identify suspicious
        or anomalous CBDC transactions or compromised digital wallets and take
        appropriate actions such as blocking a wallet, adjusting transaction limits or other
        risk management parameters.
      contributesTo:
        - REFID: FULL_CIA
      group: Operational

    - ID: WALLET_BLOCKING
      title: Wallet blocking capabilities
      description: |
        The CBDC system has implemented
        capabilities to block certain CBDC wallets
        (online or offline) that have shown suspicious
        behaviour so that they can no longer be used
        to receive CBDCs or make CBDC payments
        until the suspicion is resolved
      contributesTo:
        - REFID: FULL_CIA
      group: Operational

    - ID: MULTI_FACTOR_AUTH
      title: Multi factor authentication
      description: |
        The central bank has implemented multifactor
        authentication for all internal users' access to its
        financial systems, including hardware-based
        multifactor authentication for its privileged
        users. 
      contributesTo:
        - REFID: FULL_CIA
      group: Operational



