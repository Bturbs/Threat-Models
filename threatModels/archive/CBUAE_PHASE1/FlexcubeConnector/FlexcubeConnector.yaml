threats:

  - ID: FLEXCUBE_CONNECTION_ERROR
    title: Failure in connection to Flexcube
    assets:
      - REFID: DF4_FC_JMS_FCC
    # attackers:
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:L
    threatType: DoS
    attack: |
      For undefined technical reasons, there may be a failure in the connection to Flexcube.
    impactDesc: Issuance or redemption requests may not be executed or not 
      executed timely.
    impactedSecObj:
      - REFID: AVAILABILITY
    public: true
    fullyMitigated: true
    countermeasures:
      - ID: CONNECTOR_RETRY
        title: Connector Retry
        description: |
          Flexcube connector will be configured to retry to connect to this service for predefined x number of times for 
          y minutes. This will be configurable.
        operational: false
        inPlace: true
        public: true



  - ID: KAFKA_CONNECTION_VULNERABILITIES
    title: Attacks against unsecure Kafka connection
    assets:
      - REFID: DF3_FC_KAFKA_CBCC
    # attackers:
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:L
    threatType: Spoofing, Tampering, Repudiation, Information disclosure, DoS, 
      Elevation of privilieges
    attack: |
      Misconfiguring or not securing the Kafka connection between the Flexicube connector and the issuance platform can expose the 
      data in transit to a wide number of attacks including; forging and tampering issuance and redemption requests and responses, disclosing 
      data, and even affecting the availability of communication.
    impactDesc: Issuance or redemption requests may not be executed or not 
      executed timely.
    impactedSecObj:
      - REFID: FULL_CIA
    public: true
    fullyMitigated: true
    countermeasures:
      - ID: TLS_KAFKA_CONNECTION
        title: TLS Connection between Kafka broker and clients
        description: |
          The Kafka broker is configured to accept connections from clients only over SSL / TLS 
           which ensures encrypted data communication.
        operational: false
        inPlace: true
        public: true
      - ID: Access_Tokens_Authentication
        title: Access tokens authentication
        description: |
          The connection to Kafka is authenticated using SASL mechanism using access tokens that 
          are provided by the Secrets service i.e., Hashicorp.
        operational: false
        inPlace: true
        public: true
      - ID: ACCESS_CONTROL_KAFKA_TOPIC
        title: Apply Access control for Kafka topic
        description: |
          Configure Kafka topic for the sole communication between the issuance platform and the Flexicube Connector.
          Apply access controls to prevent other entities from accessing these topics. 
        operational: false
        inPlace: true
        public: true



