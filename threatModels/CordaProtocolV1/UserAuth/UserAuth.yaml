          of coercing a signer, reducing attacker motivation before an attack
          is attempted:

          - Publish documentation explaining that redemptions are only possible
            to the investor's own registered USDC ATA — a coerced signer cannot
            redirect funds to an attacker-controlled account
          - Disclose that multi-sig thresholds and cold-storage requirements
            mean no single compromised signer can authorise a transaction
          - Include these guarantees in auditor reports and public-facing
            security documentation so the constraints are credibly verifiable
        inPlace: false
