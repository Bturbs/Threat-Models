  - ID: MULTISIG_LIVENESS_FAILURE
    title: Multisig Liveness Failure for Urgent Operations
    attack: |
      Operational failures (lost devices, unavailable operators, incident response delays, or
      simultaneous signer outages) prevent reaching 3-of-5 quorum in required time for emergency upgrade
      rollback or urgent admin action.
    threatType: Denial of Service
    impactDesc: |
      Authorized emergency operations cannot be executed in time, increasing incident impact.

      Concrete impact scenarios:

      - **Cannot add a new Corda network:** Blocked admin operations prevent onboarding
        new Corda networks. Mitigable via redeployment to a new ProgramID and configuration
        update on the Corda Notary Node (see REDEPLOYMENT_AS_RECOVERY), but this incurs
        downtime and operational overhead.

      - **Cannot fix a bug timely:** If a critical vulnerability is discovered in the notary
        program, inability to reach multisig quorum delays the upgrade, leaving the system
        exposed to known exploits for an extended window.

      - Delayed incident containment and prolonged exposure to known vulnerabilities
      - Service disruption if admin actions are blocked

