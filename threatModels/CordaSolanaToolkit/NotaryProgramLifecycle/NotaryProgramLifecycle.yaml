      - ID: SIGNER_SELECTION_RULES
        title: Formal Signer Selection Criteria and Approval Process
        description: |
          Define documented, version-controlled rules for who qualifies as a multisig signer
          and a multi-person approval process for signer appointments.

          **Mandatory selection criteria:**

          - Geographic diversity: no quorum of signers in the same jurisdiction or physical location
          - Organizational independence: no quorum of signers in the same management chain or team
          - Technical competence: demonstrated ability to operate signing tools (wallet setup,
            transaction review, key backup procedures)
          - Operational availability: committed SLA for signing response (e.g., 4-hour response
            for routine, 1-hour for emergency)
          - Identity verification: verified by at least two existing signers or governance authority
          - Conflict of interest disclosure: signed declaration of no undisclosed relationships
            with other signers
          - Key custody commitment: acceptance of hardware wallet migration timeline and
            custody responsibilities

          **Approval process:**

          - Signer nomination must be proposed with documented justification
          - At least two independent reviewers (not the nominee) must approve
          - Security team sign-off required for diversity and competence assessment
          - Approval record stored in governance log

          **Periodic recertification:**

          - Review signer eligibility at least annually or upon organizational changes
          - Verify geographic, organizational, and technical criteria still met
          - Trigger replacement process if criteria are no longer satisfied
        inPlace: false
        public: false
        operational: true
        operator: Platform Operations and Security team

      - ID: SIGNER_SELECTION_REPORT
        title: Signer Selection Evidence Report
        description: |
          Produce a documented report for each signer selection round that provides
          auditable evidence of the process being followed.

          **Report contents:**

          - List of candidates considered and selection rationale
          - Diversity assessment: geographic locations, organizational affiliations,
            and management chain analysis for the full signer set
          - Competence verification evidence (e.g., test signing drill results)
          - Identity verification records (method used, verifiers involved)
          - Conflict of interest declarations collected
          - Approval signatures from reviewers and security team
          - Final signer roster with public keys, locations, and roles

          **Retention and access:**

          - Store report in governance repository with version control
          - Make available to auditors and compliance reviewers on request
          - Update report when signer set changes (additions, removals, recertification)
        inPlace: false
        public: false
        operational: true
        operator: Platform Operations and Security team

      - ID: SIGNER_ACCEPTANCE
        title: Formal Signer Responsibility Acceptance
        description: |
          Each selected signer must formally accept their role and responsibilities
          before being registered in the multisig.

          **Acceptance requirements:**

          - Sign a signer responsibility agreement covering:
            - Key custody obligations (secure storage, no sharing, hardware migration timeline)
            - Availability commitments (response SLA for routine and emergency operations)
            - Succession obligations (cooperate with replacement if departing)
            - Incident reporting duty (report suspected compromise immediately)
            - Confidentiality of signing operations and proposal details
          - Acknowledge understanding of the break-glass process and drill participation
          - Confirm geographic location and organizational independence declarations
          - Provide emergency contact information for out-of-band coordination

          **Ongoing obligations:**

          - Participate in scheduled signing drills (DRILLS)
          - Notify governance team of any changes to location, role, or availability
          - Cooperate with annual recertification (SIGNER_SELECTION_RULES)

          **Records:**

          - Signed acceptance stored in signer registry alongside public key and identity evidence
          - Acceptance must be renewed upon key rotation or role change
        inPlace: false
        public: false
        operational: true
