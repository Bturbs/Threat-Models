      - ID: SEPARATION_OF_DUTIES
        title: Separation of Duties (Dual-Sign Pattern)
        description: |
          Settlement operations require signatures from both Curator AND Vault
          Manager, ensuring no single party can manipulate settlements alone.
          These are distinct organizational roles with separate key holders.

          - Settle subscription: Curator + Vault Manager
          - Settle redemption: Curator + Vault Manager
          - Override blocked: 2 out of 3 (escalated)
        inPlace: true
        public: true
        operational: false
  - ID: SINGLE_ADMIN_KEY_ALL_ROLES
    title: Most privileged operations collapse into one admin keypair
    attack: |
      **Historical (pre-RBAC):** The on-chain Vault Program previously used a
      single `admin` keypair stored in the Vault PDA for most administrative
      operations: pause/resume, whitelist management, vault configuration, fee
      and offboard destination updates, freeze/thaw, and lifting the emergency
      stop. All defined privileged roles mapped to this single `admin` signer.

      **Current (post-RBAC):** The vault now uses a single `authority` field
      which is set to the RBAC program's VaultAuthority PDA. The RBAC program
      provides per-instruction permission separation via `permissions[64]`.
      Different vault instruction discriminators can be assigned to different
      signers, enabling the logical role model to be enforced on-chain.

      The residual risk is that the RBAC admin (a single key by default) can
      reassign all permissions — see RBAC_ADMIN_PERMISSION_ABUSE.
    threatType: Elevation of Privilege
    impactDesc: |
      **Mitigated by RBAC program.** The per-instruction permission table now
      enables separation of duties at the on-chain level. Each vault operation
      can be assigned to a distinct signer, preventing a single key compromise
      from granting access to all privileged operations simultaneously.

      Residual risk: the RBAC admin key itself becomes the governance
      bottleneck — addressed separately in RBAC_ADMIN_PERMISSION_ABUSE.
    impactedSecObj:
      - REFID: INTEGRITY
      - REFID: AUDITABILITY
      - REFID: USER_FUNDS_SAFETY
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: PROTOCOL_CONFIG_AUTHORITY
      - REFID: CURATOR
    assets:
      - REFID: PROTOCOL_CONFIG_AUTHORITY_KEYS
      - REFID: PROTOCOL_MANAGER_KEYS
      - REFID: VAULT_MANAGER_KEYS
      - REFID: CURATOR_KEYS
      - REFID: VAULT_GUARD_KEYS
      - REFID: FREEZE_AUTHORITY_KEYS
      - REFID: UNFREEZE_AUTHORITY_KEYS
      - REFID: ACL_AUTHORITY_KEYS
    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:C/C:H/I:H/A:H
    fullyMitigated: true
    ticketLink: https://r3-cev.atlassian.net/browse/PROT-920
    countermeasures:
      - ID: ROLE_BASED_ACCESS_CONTROL
        title: On-Chain Role-Based Access Control with Separate Keys
        description: |
          Implemented via the RBAC program (`4nuAcGWtRWa6gTN1kc9jEX5u3HmbbnnZZ9u8wW8FKJPs`).
          The vault's single `authority` field points to the RBAC VaultAuthority
          PDA, which holds a `permissions[64]` table mapping each vault
          instruction discriminator to a specific allowed signer pubkey.

          The RBAC admin grants permissions via `set_vault_ix_permission`,
          enabling the logical role model:

          - Protocol Manager → pause/resume/fee discriminators
          - Vault Manager → settlement/snapshot discriminators
          - ACL Authority → whitelist/freeze/thaw discriminators
          - Vault Guard → emergency stop discriminators

          Each instruction's permission is verified independently before the
          RBAC program CPIs into the vault with its PDA authority. This enables
          fine-grained key rotation and role revocation without affecting other
          operations.
        inPlace: true
        public: true
        operational: false
      - ID: MULTISIG_ADMIN_AUTHORITY
        title: Implement multisig for RBAC admin operations
        description: |
          The RBAC admin key (which can grant/revoke all permissions) should
          itself be a multisig authority (e.g., Squads) to prevent single-key
          compromise from reassigning the entire permission table.

          - Require M-of-N signatures for permission changes
          - Use time-delayed execution for admin rotation
          - Apply monitoring/alerting on permission table changes

          This limits the impact of any single signer compromise at the
          governance layer.
        inPlace: false
        public: true
        operational: true
        operator: Signer Committee
  - ID: RBAC_ADMIN_PERMISSION_ABUSE
    title: RBAC admin reassigns permissions to gain all vault capabilities
    attack: |
      The RBAC program's VaultAuthority PDA has a single `admin` field that
      controls the entire permission table. If the RBAC admin key is
      compromised (or if the admin acts maliciously), the attacker can:

      - Call `set_vault_ix_permission` to assign their own pubkey to every
        vault instruction discriminator (0–31)
      - Once all permissions point to the attacker, invoke every privileged
        vault operation via the RBAC proxy instructions
      - Reassign `rent_destination` to drain excess lamports from the
        VaultAuthority account

      The RBAC admin key is a single signer by default (rotatable via
      `set_vault_authority_admin` which requires co-signature from both
      current and new admin). If it is not itself protected by a multisig,
      it becomes the single point of governance failure.

      The attack is silent — permission table changes emit no events in the
      current implementation — and takes effect immediately (no timelock on
      `set_vault_ix_permission`).
    threatType: Elevation of Privilege
    impactDesc: |
      Complete takeover of all vault privileged operations:

      - Attacker becomes the sole operator for every vault instruction
      - Can pause/resume, settle investments/redemptions, manipulate
        whitelist, engage/lift emergency stop, transfer to tokenizer
      - Can reassign the RBAC admin to lock out legitimate governance
      - Equivalent to pre-RBAC single-admin-key scenario but at the RBAC
        governance layer rather than inside the vault program

      Unlike direct vault key theft, this attack persists across all future
      transactions until the vault's `authority` is rotated away from the
      compromised VaultAuthority PDA (requires the vault's current authority
      — i.e., the PDA itself — to co-sign `set_authority`).
    impactedSecObj:
      - REFID: INTEGRITY
      - REFID: USER_FUNDS_SAFETY
      - REFID: AUDITABILITY
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: PROTOCOL_CONFIG_AUTHORITY
    assets:
      - REFID: RBAC_ADMIN_KEYS
      - REFID: VAULT_AUTHORITY_PDA_ASSET
    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:H/UI:N/S:C/C:H/I:H/A:H
    fullyMitigated: false
    countermeasures:
      - ID: RBAC_ADMIN_MULTISIG
        title: Protect RBAC admin with multisig governance
        description: |
          The RBAC admin key should be a Squads multisig (or equivalent)
          with high threshold (e.g., 3 of 5) and governance timelock:

          - Prevents single-key compromise from reassigning permissions
          - Timelock on `set_vault_ix_permission` calls provides detection
            window
          - Config Threshold > Vault Threshold for admin rotation

          Additionally, rotate the RBAC admin to a multisig PDA immediately
          after initial bootstrap deployment.
        inPlace: false
        public: true
        operational: true
        operator: Signer Committee
      - ID: PERMISSION_CHANGE_MONITORING
        title: On-chain monitoring for permission table changes
        description: |
          Deploy real-time monitoring of VaultAuthority account state:

          - Alert on any `set_vault_ix_permission` transaction
          - Diff current vs. expected permission table after each change
          - Alert on `set_vault_authority_admin` (admin rotation)
          - Alert on `set_rent_destination` changes
          - Integrate with watchtower/circuit-breaker to auto-pause vault
            on unexpected permission changes
        inPlace: false
        public: true
        operational: true
        operator: Security Team
      - ID: PERMISSION_CHANGE_TIMELOCK
        title: Timelock on permission table modifications
        description: |
          Wrap `set_vault_ix_permission` and `set_vault_authority_admin`
          calls behind a timelocked execution mechanism (e.g., Squads
          time-delay or a custom timelock program):

          - 24h delay before permission changes take effect
          - Provides window for monitoring to detect and watchtower to
            revoke malicious proposals
          - Break-glass revocation path for emergency rollback
        inPlace: false
        public: true
        operational: false
  - ID: SUPPLY_CHAIN_SIGNING_TOOLS
    title: Supply Chain Compromise of Signing Infrastructure
    attack: |
      Attacker compromises the signing tool supply chain to exfiltrate keys or
      manipulate signatures:

      - **Hardware wallet tampering:** Modified firmware installed before
        delivery (intercepted shipment) or via malicious firmware update
      - **Malicious signing software:** Compromised SDKs, libraries, or CLI
        tools used in the signing workflow
      - **Dependency attacks:** Malicious packages injected into the dependency
        tree of custom signing tools (npm, cargo supply chain attacks)

