      inScope: true
    - ID: DF_REVIEW_REGISTRATIONS_REQ1
      title: Review registration request API
      type: data flow
      description: |
        Approve or Decline a JOINER request [REF](https://github.com/corda/platform-eng-design/blob/master/core/corda-5/corda-5.0/the-host/manual-approval.md#review-approvedecline-a-pending-request)
      inScope: true
    - ID: DF_P2P_APPROVED_MSG
