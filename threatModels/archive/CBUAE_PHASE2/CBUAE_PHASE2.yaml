    - ID: TRUSTLESS_CONTRACTS_EXECUTION
      title: Trustless execution of contracts
      description: |
        Contract rules cannot be circumvented by any system personae.
        This objective gives assurance that a predetermined logical outcome (known as a contract) will be included in the transaction 
        outcome when all parties accept—typically by signing—the transaction, without needing to rely on 
        the goodwill or capability of any other party (referred to as *trustless* or operating without 
        counterparty risk). The transaction may fail if another party does not agree (agreement 
        is binding and non-repudiable, such as signing with a private key).
        The system also ensures that the transaction and contract logic either completes 
        entirely or does not execute at all, maintaining *atomicity*.
      contributesTo:
        - REFID: AVAILABILITY
      group: Business specific


    - ID: NON_REPUDIATION
      title: Non-repudiation of CBDCs events
      description: |
        CBDC issuance and redemption workflows events cannot be repudiated. 
      contributesTo:
        - REFID: COMPLIANCE
      group: Business specific

