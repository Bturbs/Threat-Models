  - ID: NOTARY_DENIAL_OF_STATE_TOKENDEF
    title: Unauthorized Token Definition consumption via notary Denial of State
    assets:
      - REFID: DF_UPDATE_TOKEN_DEF_FINALIZE_LFI
    attackers:
      - REFID: TokenIssuingEntity
      - REFID: Bank
      - REFID: Auditor
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:H
    threatType: Denial of service
    attack: |
      The attacker forms a transaction whose inputs are `token definition id` i.e. reference state. 
      The attacker sends the filtered transaction in the payload to the non-validating notary over P2P.
      The non validating contract notary notarises the transaction and mark its inputs as spent (even if it is a TokenDefinition state that should only evolve to a new version)
      This would effectively result that notarisation of any future transaction that uses that reference state (transaction-id)
       will fail, because its token-definition-id -reference state- is marked at the notary as spent.
      [REF](https://r3-cev.atlassian.net/wiki/spaces/DC/pages/4480958571/Share+Token+Definition+state+updates)


    impactDesc: The whole currency network stop working. Any transaction that 
      uses that token tokenDefinitionIds will fail notarisation. All token 
      transfer, redemption and issuing will fail.
    impactedSecObj:
      - REFID: AVAILABILITY
    public: false
    fullyMitigated: false
    countermeasures:
      - ID: VALIDATION_NOTARY
        title: The Notary validates the transaction contract/transaction/command
        description: |
          The notary knows that only the Central bank Identity (TokenDefinition.author) can update Token Definitions states, 
          and does not notarize any token definition spending by other parties.
        operational: false
        inPlace: false
        public: false




  - ID: NOTARY_DENIAL_OF_TOKEN_STATE
    title: Unauthorized Token consumption via notary Denial of State
    assets:
      - REFID: DF_UPDATE_TOKEN_DEF_FINALIZE_LFI
    attackers:
      - REFID: TokenIssuingEntity
      - REFID: Bank
      - REFID: Auditor
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:L
    threatType: Denial of service
    attack: |
      The attacker forms a transaction whose inputs are `token id` it knows i.e. Token state after minting or spending the token.
      The attacker sends the filtered transaction in the payload to the non-validating notary over P2P.
      The non validating contract notary notarises the transaction and mark its inputs as spent (even if it is a TokenDefinition state that should only evolve to a new version)
      This would effectively result that notarisation of any future transaction that uses that reference state (transaction-id)
       will fail, because its token-definition-id -reference state- is marked at the notary as spent.
      [REF](https://r3-cev.atlassian.net/wiki/spaces/DC/pages/4480958571/Share+Token+Definition+state+updates)


    impactDesc: Tokens can be burn by some unauthorized party after being spent 
      or minted
    impactedSecObj:
      - REFID: AVAILABILITY
      - REFID: MONETARY_INTEGRITY
    public: false
    fullyMitigated: false
    countermeasures:
      - ID: VALIDATION_NOTARY
        title: The Notary validates the transaction contract/transaction/command
        description: |
          The notary knows that only the owner (Token.owner) can update spend the token state 
          and does not notarize any token state consumption by other parties.
        operational: false
        inPlace: false
        public: false
