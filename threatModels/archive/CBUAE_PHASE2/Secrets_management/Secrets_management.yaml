ID: Secrets_management
schemaVersion: 2
parent: CBUAE_PHASE2
description: |
  Vault KV service for credentials initialization and rotation 


  **Refs:** [LLD - 11 Secrets Management](#LLD)

scope:
  description: |
    This threat model covers the secure authentication with HashiCorp Vault for various purposes including
     accessing credentials stored as secrets, signing via the Transit engine,
      key management, and pushing certificates to the central certificate store.
       The model ensures secure storage and management of credentials, and provides a process for updating credentials without
        downtime.

    **Refs:** [LLD - 11.1 Secrets Management/Overview](#LLD), [LLD - 10.12 Cryptography and Public Key Infrastructure/Authentication with Vault](#LLD)
  assets:
    - ID: VAULT_KV_ENGINE
      type: service
      title: Vault KV Engine
      description: |
        Stores and retrieves secrets securely using Kubernetes authentication.

        **Refs:** [LLD - 11.6 Secrets Management/Secrets management service](#LLD), [LLD - 10.9.4 Cryptography and Public Key Infrastructure/Certificate propagation: platform operator and local certificate store/Component 1: Back-end Vault KV store](#LLD)
      inScope: true

    - ID: VAULT_TRANSIT_ENGINE
      type: service
      title: Vault Transit Engine
      description: |
        Provides signing and key management services

        **Refs:** [LLD - 10.6.4.1 Cryptography and Public Key Infrastructure/Cryptographic key management/Implementation components/Component 1 - HashiCorp Vault Transit secrets engine](#LLD)
      inScope: true

    - ID: VAULT_PKI_ENGINE
      type: service
      title: Vault PKI Engine
      description: |
        Manages certificates and provides secure access to certificate chains.

        **Refs:** [LLD - 10.8 Cryptography and Public Key Infrastructure/Certificate authority, certificate trust chain, and validation](#LLD)
      inScope: true

    - ID: KUBERNETES_SERVICE_ACCOUNT
      type: identity
      title: Kubernetes Service Account
      description: |
        Used for authenticating with Vault to retrieve secrets at pod startup.

        **Refs:** [LLD - 10.12.2.3 Cryptography and Public Key Infrastructure/Authentication with Vault/Solution design/Component 1 - Kubernetes authentication for secrets retrieval](#LLD)
      inScope: true

    - ID: APPLICATION_CREDENTIALS
      type: credentials
      title: Application Credentials
      description: |
        Credentials used by applications to access Vault Transit and PKI engines.

        **Refs:** [LLD - 10.12.2.4 Cryptography and Public Key Infrastructure/Authentication with Vault/Solution design/Component 2 - Username/password authentication for signing operations](#LLD)
      inScope: true
      applicationRelated: true
      properties:
        type: JWT

    - ID: VAULT_JWT_VERIFICATION_ENDPOINT
      type: credentials
      title: Vault JWT Verification Endpoint
      description: |
        Verifies Kubernetes JWT tokens for authentication with Vault.
        It is treated as a credential as it is used for authentication. Its manipulation can
         lead to unauthorized access to Vault compromising the whole system security.

        **Refs:** [LLD - 10.12.2.3 Cryptography and Public Key Infrastructure/Authentication with Vault/Solution design/Component 1 - Kubernetes authentication for secrets retrieval](#LLD)
      inScope: true
      properties:
        type: HOSTNAME:PORT
        connectionType: HTTPS

analysis: |
  The analysis focuses on ensuring secure authentication mechanisms for accessing Vault services, 
  segregating authentication methods to follow the principle of least privilege, and providing a seamless process for updating credentials without downtime.

  **Refs:** [LLD - 11.2 Secrets Management/Architecture/context](#LLD), [LLD - 11.3 Secrets Management/Sequence and interactions](#LLD)

  <img src="img/secrets_init_sequence1.svg"/>

threats:

  - ID: SECRET_DISCLOSURE_ON_DATAFLOW
    title: Disclosure of Secrets on Data Flow (transit)
    attack: |
      An attacker gains access to secrets during data flow between the application and Vault.

      **Refs:** [LLD - 11.6.1.3 Secrets Management/Secrets management service/Implementation components](#LLD)
    impactDesc: |
      Allows the attacker to retrieve secrets and compromise the security of the platform.

      **Refs:** [LLD - 10.9.4.4 Cryptography and Public Key Infrastructure/Certificate propagation: platform operator and local certificate store/Component 1: Back-end Vault KV store/Security guarantees](#LLD)
    impactedSecObj:
      - REFID: FULL_CIA
    fullyMitigated: true
    threatType: Elevation of Privilege
    pentestTestable: true
    public: true
    CVSS:
      vector: CVSS:3.1/AV:A/AC:H/PR:L/UI:N/S:C/C:H/I:N/A:H
    countermeasures:
      - ID: ENCRYPTED_COMMUNICATION
        title: Encrypted Communication
        description: |
          Use TLS for encrypting communication between the application and
           Vault to prevent eavesdropping.

          **Refs:** [LLD - 11.6.1.3 Secrets Management/Secrets management service/Implementation components](#LLD)
        inPlace: true
        public: true

  - ID: VAULT_AT_REST_DISCLOSURE
    title: Disclosure of Secrets at Rest
    attack: |
      An attacker gains access to secrets stored in Vault by accessing the underlying storage system.

      **Refs:** [LLD - 11.8.3 Secrets Management/Resiliency and recovery/Cross-site replication](#LLD)
    impactDesc: |
      Allows the attacker to retrieve secrets and compromise the security of the platform.

      **Refs:** [LLD - 10.9.4.4 Cryptography and Public Key Infrastructure/Certificate propagation: platform operator and local certificate store/Component 1: Back-end Vault KV store/Security guarantees](#LLD)
    impactedSecObj:
      - REFID: FULL_CIA
    fullyMitigated: true
    threatType: Elevation of Privilege
    pentestTestable: true
    public: true
    CVSS:
      vector: CVSS:3.1/AV:A/AC:H/PR:L/UI:N/S:C/C:H/I:N/A:H
    countermeasures:
      - ID: ENCRYPTED_STORAGE
        title: Encrypted Storage
        description: |
          Use encryption to store secrets in Vault to prevent unauthorized access.

          **Refs:** [LLD - 11.6.1.3 Secrets Management/Secrets management service/Implementation components](#LLD)
        inPlace: true
        public: true
      - ID: OFFLINE_ROOT_ENCRYPTION_KEY
        title: Offline Root Encryption Key
        description: |
          Vault uses a root encryption key stored in a different security domain,
           such as an HSM, to encrypt the data at rest.

          **Refs:** [LLD - 10.6.4.1 Cryptography and Public Key Infrastructure/Cryptographic key management/Implementation components/Component 1 - HashiCorp Vault Transit secrets engine](#LLD)
        inPlace: true
        public: true

  - ID: UNAUTHORIZED_ACCESS_VAULT
    title: Unauthorized Access to Vault
    attack: |
      An attacker gains unauthorized access to Vault using stolen credentials or exploiting vulnerabilities in the authentication mechanism.

      **Refs:** [LLD - 10.12.1 Cryptography and Public Key Infrastructure/Authentication with Vault/Overview](#LLD)
    impactDesc: |
      Leads to unauthorized retrieval of secrets, signing operations, or certificate issuance, compromising the security of the platform.

      **Refs:** [LLD - 11.9 Secrets Management/Security information and event management (SIEM), monitoring and alerting](#LLD)
    impactedSecObj:
      - REFID: CONFIDENTIALITY
      - REFID: INTEGRITY
    fullyMitigated: true
    threatType: Elevation of Privilege
    pentestTestable: true
    public: true
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N
    countermeasures:
      - ID: KUBERNETES_AUTHENTICATION
        title: Kubernetes Authentication for Secrets Retrieval
        description: |
          Use Kubernetes JWT tokens for initial secret retrieval at pod startup, ensuring tokens are short-lived and discarded after use.

          **Refs:** [LLD - 10.12.2.3 Cryptography and Public Key Infrastructure/Authentication with Vault/Solution design/Component 1 - Kubernetes authentication for secrets retrieval](#LLD)
        inPlace: true
        public: true

      - ID: USERNAME_PASSWORD_AUTHENTICATION
        title: Username/Password Authentication for Vault Operations
        description: |
          Use username/password authentication for accessing the Vault Transit and PKI engines, ensuring tokens are not reused across different services.

          **Refs:** [LLD - 10.12.2.4 Cryptography and Public Key Infrastructure/Authentication with Vault/Solution design/Component 2 - Username/password authentication for signing operations](#LLD)
        inPlace: true
        public: true

      - ID: CREDENTIAL_ROTATION_PROCESS
        title: Credential Rotation Process
        description: |
          Implement a process for updating credentials without downtime by creating new credentials,
           updating the secret store, and performing a rolling restart of pods.

          **Refs:** [LLD - 12.9.5.1 Identity and Access Management (IAM)/Securing the identity provider/Secrets management/Secret rotation](#LLD)
        inPlace: true
        public: true

  - ID: K8S_TOKEN_THEFT
    title: Theft of Kubernetes JWT Tokens
    attack: |
      An attacker steals Kubernetes JWT tokens from the filesystem or memory to gain unauthorized access to Vault.

      **Refs:** [LLD - 10.12.2.3 Cryptography and Public Key Infrastructure/Authentication with Vault/Solution design/Component 1 - Kubernetes authentication for secrets retrieval](#LLD)
    impactDesc: |
      Allows the attacker to retrieve secrets or perform unauthorized operations in Vault, compromising the security of the platform.

      **Refs:** [LLD - 11.9 Secrets Management/Security information and event management (SIEM), monitoring and alerting](#LLD)
    impactedSecObj:
      - REFID: CONFIDENTIALITY
      - REFID: INTEGRITY
    fullyMitigated: true
    threatType: Information Disclosure
    pentestTestable: true
    public: true
    CVSS:
      vector: CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:N
    countermeasures:

      - ID: K8S_BOUND_TOKENS
        title: Use of Bound Tokens
        description: |
          Ensure Kubernetes JWT tokens are bound to specific pods and are validated using the TokenReview API, making them harder to use if stolen.

          **Refs:** [LLD - 10.12.2.3 Cryptography and Public Key Infrastructure/Authentication with Vault/Solution design/Component 1 - Kubernetes authentication for secrets retrieval](#LLD)
        inPlace: true
        public: true

      - ID: SHORT_TOKEN_EXPIRATION
        title: Short-Lived Tokens
        description: |
          Use short-lived Kubernetes JWT tokens that are discarded after use, reducing the risk of token theft.

          - [REF1](https://developer.hashicorp.com/vault/docs/auth/kubernetes)

          - [REF2](https://developer.hashicorp.com/vault/docs/auth/kubernetes#how-to-work-with-short-lived-kubernetes-tokens)

          **Refs:** [LLD - 10.12.2.3 Cryptography and Public Key Infrastructure/Authentication with Vault/Solution design/Component 1 - Kubernetes authentication for secrets retrieval](#LLD)
        inPlace: true
        public: true


  - ID: CREDENTIAL_EXPIRATION
    title: Expired Credentials for Vault Operations
    attack: |
      Applications fail to renew expired credentials, leading to service disruptions and inability to access Vault services.

      **Refs:** [LLD - 12.9.5.1 Identity and Access Management (IAM)/Securing the identity provider/Secrets management/Secret rotation](#LLD)
    impactDesc: |
      Causes downtime and inability to perform critical operations such as signing and certificate issuance.

      **Refs:** [LLD - 11.8 Secrets Management/Resiliency and recovery](#LLD)
    impactedSecObj:
      - REFID: AVAILABILITY
      - REFID: 24_7_CDBC_AVAILABILITY
      - REFID: COMPLIANCE
    fullyMitigated: true
    threatType: Denial of Service
    pentestTestable: true
    public: true
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:H
    countermeasures:
      - ID: TOKEN_RENEWAL
        title: Token Renewal Process
        description: |
          Implement a process for renewing tokens upon expiration using the same username/password credentials, ensuring continuous access to Vault services.

          **Refs:** [LLD - 10.12.2.4 Cryptography and Public Key Infrastructure/Authentication with Vault/Solution design/Component 2 - Username/password authentication for signing operations](#LLD)
        inPlace: true
        public: true
      - ID: MULTIPLE_OVERLAPPING_CREDENTIAL
        title: Multiple Overlapping Credentials
        description: |
          Create multiple overlapping credentials for applications to use, allowing for a seamless transition between old and new credentials.
          After the credential rotation process, revoke the old credentials to prevent unauthorized access and maintain compliance

          **Refs:** [LLD - 12.9.5.1 Identity and Access Management (IAM)/Securing the identity provider/Secrets management/Secret rotation](#LLD)
        inPlace: true
        public: true
      - ID: MONITORING_ALERTING
        title: Monitoring and Alerting
        description: |
          Monitor the status of credentials and set up alerts for expired or soon-to-expire credentials to ensure timely renewal.

          **Refs:** [LLD - 11.9 Secrets Management/Security information and event management (SIEM), monitoring and alerting](#LLD)
        inPlace: true
        public: true

  - ID: VAULT_KEYVALUE_WIDE_ACCESS
    title: Wide Access to Vault Key-Value Engine
    attack: |
      An attacker compromising a single POD/Application can escalate to access the 
      Vault Key-Value engine, leading to unauthorized retrieval of secrets.

      **Refs:** [LLD - 11.7 Secrets Management/Secrets management client](#LLD)
    impactDesc: |
      Leads to unauthorized retrieval of secrets, compromising the security of the platform.

      **Refs:** [LLD - 10.9.4.4 Cryptography and Public Key Infrastructure/Certificate propagation: platform operator and local certificate store/Component 1: Back-end Vault KV store/Security guarantees](#LLD)
    impactedSecObj:
      - REFID: FULL_CIA
      - REFID: PRINCIPLE_LEAST_PRIVILEGE
    fullyMitigated: true
    threatType: Elevation of Privilege
    pentestTestable: true
    public: true
    CVSS:
      vector: CVSS:3.1/AV:A/AC:H/PR:L/UI:N/S:C/C:H/I:N/A:H
    countermeasures:
      - ID: SEGREGATED_ACCESS
        title: Segregated Access to Vault Engines
        description: |
          Ensure that applications only have access to the Vault engines necessary for their function, 
          such as the Transit and PKI engines, and restrict access to the Key-Value engine.

          **Refs:** [LLD - 10.12 Cryptography and Public Key Infrastructure/Authentication with Vault](#LLD)
        inPlace: true
        public: true

      - ID: VAULT_ACL_POLICIES
        title: Minimal ACL Policies for Role-Based Access Control
        description: |
          Implement role-based access control (RBAC) to ensure 
          that applications only have access to the secrets necessary for 
          their function, minimizing the risk of unauthorized access.

          **Refs:** [LLD - 11.6.1.3 Secrets Management/Secrets management service/Implementation components](#LLD)
        inPlace: true
        public: true

      - ID: AVOID_SECRET_REUSE
        title: Avoid Secret Reuse
        description: |
          Different secrets are created for each use case 
          avoiding reusing secrets across different services to prevent unauthorized access.

          **Refs:** [LLD - 12.9.5 Identity and Access Management (IAM)/Securing the identity provider/Secrets management](#LLD)
        inPlace: true
        public: true

  - ID: APPLICATION_CREDENTIALS_LEAK1
    title: Leakage of Application Credentials in POD environment
    attack: |
      An attacker gains access to application credentials stored in
       POD environment because it is leaky or not well protected.

      **Refs:** [LLD - 11.7.4.1 Secrets Management/Secrets management client/Implementation components/Component 1 - Vault Agent Injector](#LLD)
    impactDesc: |
      Allows the attacker to retrieve secrets and compromise the security of the platform.

      **Refs:** [LLD - 11.9.5 Secrets Management/Security information and event management (SIEM), monitoring and alerting/Log analytics](#LLD)
    impactedSecObj:
      - REFID: FULL_CIA
      - REFID: PRINCIPLE_LEAST_PRIVILEGE
    fullyMitigated: true
    threatType: Elevation of Privilege
    pentestTestable: true
    public: true
    CVSS:
      vector: CVSS:3.1/AV:A/AC:H/PR:L/UI:N/S:C/C:H/I:N/A:H
    countermeasures:
      - ID: DISABLE_JAVA_MEMORY_DUMP
        title: Disable Java Memory Dump
        description: |
          Disable Java memory dumps in the application pods 
          to prevent the leakage of application credentials from memory.

          **Refs:** [LLD - 11.7.4.1 Secrets Management/Secrets management client/Implementation components/Component 1 - Vault Agent Injector](#LLD)
        inPlace: true
        public: true
      - ID: STORE_CRED_IN_VOLATILE_MEMORY
        title: Store Credentials in Volatile Memory
        description: |
          Store application credentials in volatile memory.
          > Secrets are copied into Pod environment variables or a RAM based configuration file.
          Currently the system use of environment vars rather than files.

          **Refs:** [LLD - 11.7.4.1 Secrets Management/Secrets management client/Implementation components/Component 1 - Vault Agent Injector](#LLD)
        inPlace: true
        public: true
      - ID: DELETE_INJECTED_INIT_CREDENTIAL
        title: Delete Injected Init Container credentials
        description: |
          Delete the injected init container credentials from the disk after the application has started.
          For example read to memory the credentials form the injected volume and delete the volume.

          **Refs:** [LLD - 11.7.4.1 Secrets Management/Secrets management client/Implementation components/Component 1 - Vault Agent Injector](#LLD)
        inPlace: true
        public: true
      - ID: DESTROY_INITCONTAINER
        title: Destroy Init Container
        description: |
          Destroy the init container after the application has 
          started to prevent unauthorized access to the credentials.

          **Refs:** [LLD - 11.7.4.1 Secrets Management/Secrets management client/Implementation components/Component 1 - Vault Agent Injector](#LLD)
        inPlace: true
        public: true
      - ID: FILTER_OUT_CREDENTIALS_IN_LOGS
        title: Filter Out Credentials in Logs
        description: |
          Filter out application credentials from logs to prevent unauthorized access to the credentials.

          **Refs:** [LLD - 11.9.5 Secrets Management/Security information and event management (SIEM), monitoring and alerting/Log analytics](#LLD)
        inPlace: true
        public: true

  - ID: CREDENTIAL_ROTATION_FAILURE
    title: Failure in Credential Rotation Process
    attack: |
      The credential rotation process fails, leading to downtime and inability to access services.

      **Refs:** [LLD - 12.9.5.1 Identity and Access Management (IAM)/Securing the identity provider/Secrets management/Secret rotation](#LLD)
    impactDesc: |
      Causes downtime and inability to perform critical operations such as signing and certificate issuance.

      **Refs:** [LLD - 11.8 Secrets Management/Resiliency and recovery](#LLD)
    impactedSecObj:
      - REFID: AVAILABILITY
      - REFID: 24_7_CDBC_AVAILABILITY
    fullyMitigated: false
    threatType: Denial of Service
    pentestTestable: true
    public: false
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:H

    ticketLink: https://r3-cev.atlassian.net/browse/R3SOL-4248
    countermeasures:
      - ID: MIN_PODS_COUNT_2
        title: Minimum of 2 PODs
        description: |
          Ensure that there are at least 2 PODs running to implement a gradual
           pod restart process for credential rotation.

          **Refs:** [LLD - 11.8.2 Secrets Management/Resiliency and recovery/Service instances and availability](#LLD)
        inPlace: true
        public: true

      - ID: GRADUAL_PODS_RESTART
        title: Gradual Pod Restart
        description: |
          Implement a gradual pod restart process to update credentials without downtime.
          There will need to be at least 2 PODs. Rotate credential in only one pod at a time.
          If the first pod is successfully rotated, then rotate the second pod, etc.

          **Refs:** [LLD - 12.9.5.1 Identity and Access Management (IAM)/Securing the identity provider/Secrets management/Secret rotation](#LLD)
        inPlace: false
        public: true

      - ID: POD_STARTUP_HEALT_CHECK_AND_ROLLBACK
        title: Pod Startup Health Check
        description: |
          Implement a health check mechanism to ensure that 
          the new credentials are successfully loaded before the pod is marked as healthy.
          The pod will need for example to dummy try the services and to retrieve root of trust(s) for PKIs.
          **EXAMPLE:**

          Implement additional initialization and health check steps to ensure secure key rotation:
              
              1. Fetch Postgres credentials from VaultSecretStore.
              2. Test Postgres connection.
              3. Fetch Root of Trust(s) for PKI from VaultSecretStore.
              4. Fetch Transit keys from VaultSecretStore.
              5. Test successful signature service with TransitSigningEngine using a well-known or empty message.
              6. Test signature verification with Root of Trust for PKI.
              7. Fetch intermediate CA certificates from VaultPKI.
              8. Use intermediate CA certificates to verify previously signed dummy message.
              9. Set Health check to OK.

          The key ration process need to orchestrate and check the heatl after every pod initialization.

            if the health check fails:
              1. the pod needs to be restarted with the old credentials (rollback)
              2. Generate an alert to investigate the root cause of the failure.

          **Refs:** [LLD - 11.9.4 Secrets Management/Security information and event management (SIEM), monitoring and alerting/Kubernetes health checks](#LLD)
        inPlace: false
        public: true
      - ID: MONITORING_ALERTING
        title: Monitoring and Alerting
        description: |
          Monitor the status of the credential rotation process and set up alerts for failures to ensure timely resolution.

          **Refs:** [LLD - 11.9 Secrets Management/Security information and event management (SIEM), monitoring and alerting](#LLD)
        inPlace: true
        public: true
title: Secrets Management
