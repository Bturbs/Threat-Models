ID: CordaProtocolV0
schemaVersion: 2
title: Corda Protocol V0
version: '1.0'
children:
  - REFID: WEB_UI

authors: |
  Security Research team at R3 

scope:
  description: |
    This document baselines the threat model for the R3 Protocol Vault, a Solana-based
    tokenized fund leveraging an on-chain Vault program to accept USDC deposits and mint
    vault shares, and to redeem shares back to USDC. Core interactions involve:

      - Vault Program (on-chain program, PDA signing)
      - SPL Token Program (mint/burn/transfer-checked)
      - Jupiter aggregator (DEX aggregation via CPI)
      - User and Vault token accounts (USDC, investment token, share accounts)

    The operational scope focuses on deposit and redeem flows (DF_*), minting/burning of
    shares, Jupiter swaps via CPI, and PDA authorization. Infrastructure and off-chain
    routing logic are out-of-scope except where they materially affect DF_*.

  securityObjectives:
    - ID: USER_FUNDS_SAFETY
      title: User Funds Safety (Custody & Redemption)
      description: |

        Ensure redemptions honor user-defined minimum out (slippage bound).
      group: Data Security
      treeImage: false

    - ID: PROGRAM_INTEGRITY
      title: Program Integrity and Determinism
      description: |
        Only intended programs (Vault, SPL Token, Jupiter) execute; CPI is restricted
        and parameters validated (mints, programs, nonces, amounts). Prevent tampering and
        unintended state transitions across all DF_*.
      group: System Integrity
      treeImage: false

    - ID: SWAP_SAFETY
      title: Swap Safety and Price Protection
      description: |
        Minimize value loss during swaps via min-out constraints and validate expected
        pre/post balances (spent/received checks). Ensure no hidden value extraction.
      group: Operational Security
      treeImage: false

    - ID: AUDITABILITY
      title: Auditability and Non-Repudiation
      description: |
        Emit consistent events and maintain verifiable on-chain traces for deposits and
        redemptions to enable incident analysis and compliance reporting.
      group: Legal and Compliance
      treeImage: true

    - ID: AVAILABILITY
      title: Availability of Core Flows
      description: |
        Ensure deposit and redeem operations are reliably executable without undue
        failure modes, preserving liveness under expected network conditions.
      group: Operational Security
      treeImage: true

    - ID: COMPLIANCE
      title: Regulatory Compliance
      description: |
        Enforce KYC/AML controls for vault participation to prevent sanctioned or
        illicit actors from depositing or redeeming funds.
      group: Legal and Compliance
      treeImage: true

  # Optional baseline attackers for later use (not referenced by threats yet)
  attackers:
    - ID: EXTERNAL_ATTACKER
      description: |
        Unauthenticated adversary attempting to exploit program logic or account
        substitution via crafted transactions.
      inScope: true
    - ID: MALICIOUS_USER
      description: |
        Authorized user attempting to manipulate DF_* to extract value, bypass slippage,
        or mint/burn incorrectly.
      inScope: true
    - ID: ROGUE_CPI_TARGET
      description: |
        A substituted CPI target/program or malicious route component attempting to
        misdirect swaps or drain accounts.
      inScope: true

  assets:
    # Programs / Systems
    - ID: VAULT_PROGRAM
      type: system
      title: Vault Program
      description: |
        On-chain program implementing deposit/redeem, CPI to Jupiter, PDA signing,
        validations (mints, program IDs, amounts), and event emission.
      inScope: true

    - ID: SPL_TOKEN_PROGRAM
      type: system
      title: SPL Token Program
      description: |
        Token mint/burn/transfer-checked operations for shares, USDC, and investment tokens.
      inScope: true

    - ID: JUPITER_AGGREGATOR
      type: system
      title: Jupiter Aggregator
      description: |
        DEX aggregation invoked via CPI for USDC <-> investment token swaps.
      inScope: true

    # Accounts
    - ID: USER_USDC_ACCOUNT
      type: system
      title: User USDC Account
      description: SPL token account holding user USDC.
      inScope: true

    - ID: USER_SHARE_ACCOUNT
      type: system
      title: User Share Account
      description: SPL token account holding minted vault shares.
      inScope: true

    - ID: VAULT_USDC_ACCOUNT
      type: system
      title: Vault USDC Account
      description: SPL token account used as the vault USDC custody.
      inScope: true

    - ID: VAULT_INVESTMENT_ACCOUNT
      type: system
      title: Vault Investment Account
      description: SPL token account holding the investment token.
      inScope: true

    # Dataflows from PlantUML (Deposit)
    - ID: DF_INVOKE_DEPOSIT
      type: dataflow
      title: Invoke Deposit
      description: User invokes deposit on Vault Program to deposit USDC and 
        mint shares.
      inScope: true

    - ID: DF_INVOKE_JUPITER
      type: dataflow
      title: Invoke Jupiter Swap (Deposit)
      description: Vault CPI to Jupiter aggregator to swap USDC -> investment 
        token.
      inScope: true

    - ID: DF_JUPITER_RETURN
      type: dataflow
      title: Jupiter Deduct USDC
      description: Post-swap deduction from Vault USDC account.
      inScope: true

    - ID: DF_JUPITER_CREDIT
      type: dataflow
      title: Jupiter Credit Investment Token
      description: Post-swap credit to Vault Investment account.
      inScope: true

    - ID: DF_JUPITER_COMPLETE
      type: dataflow
      title: Jupiter Swap Complete (Deposit)
      description: Completion/callback semantics for deposit swap CPI.
      inScope: true

    - ID: DF_DEPOSIT_EVENT_COMPLLETE
      type: dataflow
      title: Deposit Event Emission (as labeled)
      description: Event emission indicating deposit completion.
      inScope: true

    - ID: JUPITER_SWAP_DATA
      type: data
      title: Jupiter Swap Data
      description: |
        Opaque, pre-serialized Jupiter instruction provided by user for swap CPI.
        The vault program treats this as an untrusted byte array and does NOT
        deserialize or validate its internal structure. Security is enforced via:

          - Jupiter program ID validation before CPI
          - Pre/post SPL balance measurement (not instruction parsing)
          - Custody account binding to prevent misdirection

        The instruction format is implementation-specific to Jupiter V6 and subject
        to change. The vault's security model is balance-based, not instruction-based.

      inScope: true

    # Dataflows from PlantUML (Redeem)
    - ID: DF_INVOKE_REDEEM
      type: dataflow
      title: Invoke Redeem
      description: User invokes redeem on Vault Program to burn shares and 
        receive USDC.
      inScope: true

    - ID: DF_JUPITER_REDEEM_SWAP_CALL
      type: dataflow
      title: Invoke Jupiter Swap (Redeem)
      description: Vault CPI to Jupiter aggregator to swap investment token -> 
        USDC.
      inScope: true

    - ID: DF_JUPITER_REDEEM_SWAP_REDEEM
      type: dataflow
      title: Jupiter Deduct Investment Token
      description: Post-swap deduction from Vault Investment account.
      inScope: true

    - ID: DF_JUPITER_REDEEM_SWAP_CREDIT
      type: dataflow
      title: Jupiter Credit USDC
      description: Post-swap credit to Vault USDC account.
      inScope: true

    - ID: DF_JUPITER_REDEEM_SWAP_COMPLETE
      type: dataflow
      title: Jupiter Swap Complete (Redeem)
      description: Completion/callback semantics for redeem swap CPI.
      inScope: true

    - ID: DF_REDEEM_COMPLETE
      type: dataflow
      title: Redeem Complete Event
      description: Event emission indicating redeem completion.
      inScope: true

  assumptions:
    - ID: TAMPERABLE_TRANSACTION
      description: |
        An attacker can construct raw transactions and tamper the instruction data including opaque swap data.

    - ID: MULTI_INSTRUCTION_TX
      description: |
        Solana allows arbitrary composition of instructions in a single transaction. A user
        (or attacker) can atomically invoke both `deposit` and `redeem` instructions of the
        Vault Program in the same transaction, as well as combine them with direct SPL
        token transfers or Jupiter CPIs, provided all required accounts are supplied and
        the program does not explicitly forbid such sequencing. Threats must consider these
        atomic multi-step flows, not only single-instruction transactions.

analysis: |
  Approach: STRIDE-by-dataflow for DF_* to systematically identify Spoofing, Tampering,
  Repudiation, Information Disclosure, Denial of Service, and Elevation of Privilege risks.

  DF list (from diagrams) to be analyzed:

    - DF_INVOKE_DEPOSIT
    - DF_INVOKE_JUPITER
    - DF_JUPITER_RETURN
    - DF_JUPITER_CREDIT
    - DF_JUPITER_COMPLETE
    - DF_DEPOSIT_EVENT_COMPLLETE
    - DF_INVOKE_REDEEM
    - DF_JUPITER_REDEEM_SWAP_CALL
    - DF_JUPITER_REDEEM_SWAP_REDEEM
    - DF_JUPITER_REDEEM_SWAP_CREDIT
    - DF_JUPITER_REDEEM_SWAP_COMPLETE
    - DF_REDEEM_COMPLETE

  For each DF_* we will consider:

    - Spoofing: signer/PDA misuse, program ID substitution, account ownership checks
    - Tampering: amount/mint manipulation, CPI param forging, pre/post-balance invariants
    - Repudiation: event completeness/consistency, deterministic logging
    - Information Disclosure: unintended account/mint leakage, event data exposure
    - Denial of Service: CPI reverts, account state locks, liveness under expected load
    - Elevation of Privilege: unauthorized CPI targets, arbitrary signer escalation


