scope:
  description: |2

    This threat model analyses the final version of the released Corda 5 design configured for a production environment, 
    e.g. GA version; it is not providing any intermediate version analysis before GA, or any test configuration (e.g. `static network mode`) 

    <h5> P2P Sessions </h5>

      The P2P sessions in scope of analysis are those highlighted in the CorDapp lifecycle (purple). 
      Specific uses of P2P session in `Network Participants info distribution` are not in the scope of  this threat model. 

      <strong>P2P sessions in scope of analysis</strong><br/>
      <img src="img/corda5-e2e_scope1.svg"/>

     (suggested edit: end-to-end authentication model... does it provide other security features: reliable delivery, encryption?)
            
    ### End-to-end authentication protocol (SIGMA-R)

    #### Handshake option 1: SIGMA-R (TLS style)

    ECDHE x25519, AEAD_AES_256_GCM (32-byte key, 12-byte nonce), HMAC-SHA256 (32-byte key).
    <blockquote markdown="block">
    *Message 1*: </br>
     &emsp;&emsp;ClientHello = {CommonHeader, g<sup>a</sup>, encMethodList, {SHA256(A<sub>pub</sub>), groupId<sub>A</sub>}}<br/>
     A&ensp;----------------------------------------------------------------------------------------> B<br/>
     <hr/>
     *Message 2*: </br>
     &emsp;&emsp;ServerHello = {CommonHeader, g<sup>b</sup>, encMethod}<br/>
     &emsp;<----------------------------------------------------------------------------------------<br/>
     <hr/>
     *Message 3 (InitiatorHandshake)*: </br>
     &emsp;&emsp;ClientRecordHeader = CommonHeader,<br/>
     &emsp;&emsp;{ClientEncryptedData, ClientAuthTag} = AEAD_ENC(K<sub>eA</sub>, nonce = IV<sub>eA</sub>, aad = ClientRecordHeader,<br/>
     &emsp;&emsp;&emsp;&emsp;ClientEncryptedExtensions = {SHA256(B<sub>pub</sub>), groupId<sub>B</sub>, certificate<sub>A</sub>} || <br/>
     &emsp;&emsp;&emsp;&emsp;ClientParty = {} || <br/>
     &emsp;&emsp;&emsp;&emsp;ClientPartyVerify = SIG(A, sigPad<sub>A</sub> || SHA256(ClientHello..ClientParty)) ||<br/>
     &emsp;&emsp;&emsp;&emsp;ClientFinished = HMAC(K<sub>mA</sub>, SHA256(ClientHello..ClientPartyVerify))<br/>
     &emsp;&emsp;)<br/>
     &emsp;----------------------------------------------------------------------------------------><br/>
     <hr/>
     *Message 4 (ResponderHandshake)*: </br>
     &emsp;&emsp;ServerRecordHeader = CommonHeader,<br/>
     &emsp;&emsp;{ServerEncryptedData, ServerAuthTag} = AEAD_ENC(K<sub>eB</sub>, nonce = IV<sub>eB</sub>, aad = ServerRecordHeader,<br/>
     &emsp;&emsp;&emsp;&emsp;ServerEncryptedExtensions = {certificate<sub>B</sub>} || <br/>
     &emsp;&emsp;&emsp;&emsp;ServerParty = {SHA256(B<sub>pub</sub>), groupId<sub>B</sub>} || <br/>
     &emsp;&emsp;&emsp;&emsp;ServerPartyVerify = SIG(B, sigPad<sub>B</sub> || SHA256(ClientHello..ServerParty)) ||<br/>
     &emsp;&emsp;&emsp;&emsp;ServerFinished = HMAC(K<sub>mB</sub>, SHA256(ClientHello..ServerPartyVerify))<br/>
     &emsp;&emsp;)<br/>
     &emsp;<----------------------------------------------------------------------------------------<br/>
    </blockquote>

    where: 


    - encMethod - method for data message encryption:
      - AUTHENTICATION_ONLY - authentication only (no encryption)
      - AUTHENTICATED_ENCRYPTION - authenticated encryption
    - encMethodList -  list of encMethod provided by client. Negotiation would be successful only if server supports one of the client-specified modes. If multiple modes are supported both by server and client, the server will select mode with the higher priority, which is AUTHENTICATED_ENCRYPTION.
    - ClientEncryptedExtensions/ServerEncryptedExtensions - additional data, the format may evolve. At present, it contains desired reponder's identity (only for initiator) and optionally, a certificate.
    - ClientParty - implicitly calculated as {SHA256(A<sub>pub</sub>), groupId<sub>A</sub>} from ClientHello.
    - ClientHello..ClientParty - concatenation of all messages from ClientHello to ClientParty (or any other specified). Similarly to TLS, messages are ordered, as they appear in a handshake: {ClientHello, ServerHello, ClientEncryptedExtensions, ClientParty, ClientPartyVerify, ClientFinished, ServerEncryptedExtensions, ServerParty, ServerPartyVerify, ServerFinished}
    - sigPad<sub>A</sub> = <64 space characters (0x20)> || "Corda, client signature verify" || 0x00
    - sigPad<sub>B</sub> = <64 space characters (0x20)> || "Corda, server signature verify" || 0x00
    - groupId<sub>A</sub>, groupId<sub>B</sub> - identifiers of membership groups

    [REF: e2e-authentication-overview](https://github.com/corda/platform-eng-design/blob/master/core/corda-5/corda-5.0/p2p-ha/e2e-authentication-overview.md)



    [REF: End-to-end authentication protocol](https://github.com/corda/platform-eng-design/blob/master/core/corda-5/corda-5.0/p2p-ha/e2e-authentication-protocol.md)

    [REF: P2P Design - Starfish](https://github.com/corda/platform-eng-design/blob/a6151195196bcfa20daf6f6a7f0901a73ab2da6f/core/corda-5/corda-5.0/p2p-ha/p2p-architecture.md)

    The SIGMA protocol ('SIGn-and-MAc') is an Authenticated Diffie-Hellman key exchange protocol 
    [REF](https://link.springer.com/content/pdf/10.1007/978-3-540-45146-4_24.pdf?pdf=inline%20link)
    a Diffie Helmann like protocol to securely exchange key in a channel visible from a potential attacker. 
    DH algorithm does not prevent MITM (man in the middle) attacks where the attacker can also tamper the communication. 
    For this last purpose (authenticity/authentication) also an HMAC signature is present in the custom protocol 
    combination, see specific threat and countermeasures.


