      #   title: Query the notary spent status of a state by reference
      #   description: |
      #     A counterparty can query a notary for a particular UTXO is spent or not. 
      #     A query uses only the reference i.e. TxID | index.
      #     This allows a counterparty to know if a particular state is spent or unspent.
      #     If the queried state is unspent the notary response is true,
      #     otherwise (spent or unfound) it returns null.  
      #     (RFI: Careful consideration is needed here for the response logic not to disclose information? ) 

      #   operational: true
      #   inPlace: false
      #   public: true

  - ID: NOTARY_OFFLINE
    lastReview: 2024-04-23
    title: Denial of service attack against the notary
    impactDesc: |
      This affects the ability of the whole network to notarise any transaction, effectively preventing any transaction to finalise.
    impactedSecObj:
      - REFID: AVAILABILITY
    assets:
      - REFID: Transactions
    attackers:
      - REFID: ANONYMOUS
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H/E:U/RL:W/RC:U
    threatType: Denial of service
    attack: |
      Due to a DDOS The notary is offline.
    public: true
    fullyMitigated: true
    countermeasures:
      - ID: HIGH_AVAILABILITY_NOTARY_ARCHITECTURE
        title: Corda 5 architecture ensures highly available notary service
        description: |
          Corda 5 Notary service architecture and Cluster is designed to ensure that the service is highly available. 
        operational: true
        operator: INFRASTRUCTURE_OPERATOR
        inPlace: true
        public: true

      - ID: NETWORK_DETECTION_PREVENTION_TOOLS
        title: Deploy attack detection and protection tools.
        description: |
          To prevent and detect DoS attacks the Notary Cluster deployment includes firewalls, network and applications
           monitoring tools. These tools should be incorporated in any notary deployment. 
        operational: true
        inPlace: true
        public: true
        operator: INFRASTRUCTURE_OPERATOR

  - ID: NOTARY_LOSES_STATES_LIST
    lastReview: 2024-04-23
    title: Notary loses list of spent states
    impactDesc: |
      Losing the state list would lead to a denial of state scenario.
    impactedSecObj:
      - REFID: AVAILABILITY
    assets:
      - REFID: UTXO
    attackers:
      - REFID: VNODE_OPERATOR

    CVSS:
      vector: CVSS:3.1/AV:A/AC:H/PR:H/UI:N/S:C/C:N/I:L/A:H
    threatType: Tampering, Denial of service
    attack: |
      The notary in Corda 5 keeps a list of unspent states. 
      If a successful attack or incident deletes this list goes undetected, it would cause a denial of state scenario.
      Even if the deletion is detected but the notary is unable to retrieve lost entries, 
      the notary will not be able to provide its state uniqueness checking service.   
               
    public: true
    fullyMitigated: true
    countermeasures:
      - ID: BACKUP_STATE_LIST
        title: Use backup of spent state list
        description: |
          The Notary Cluster should preserve a backup of the spent list. 
        operational: true
        operator: INFRASTRUCTURE_OPERATOR
        inPlace: true
        public: true

      - ID: ROLE_BASED_ACCESS_CONTROL
        title: RBAC of the state list should allow limited editing access.
        description: |
          Access control of the spent state list should allow limited access. 
          Modification is required to update a state from being unspent to spend. 
            Thus only fields corresponding to spend status can be edited.
          Deletion is also required for archiving purposes. 
          However, RBAC in the DB could ensure that this privilege is limited to a specific user 
          that is used for archiving purposes, and this is distinct from the user 
          which is used as part of the uniqueness processor which inserts and updates states.
        operational: false
        inPlace: true
        public: true

      - ID: INTEGRITY_VERIFICATION
        title: Hash-based verification.
        description: |
          Hash functions could be used to check the integrity of the spent state list. 
        operational: false
        inPlace: false
        public: true



