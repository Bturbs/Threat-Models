ID: CBDC_Mobile_Application
schemaVersion: 2
parent: CBUAE_PHASE2
title: CBDC Mobile Application
scope:
  description: |
    Threat model for the Mobile Application architecture. It covers essential wallet features 
    such as viewing the wallet, transferring funds, and updating wallet details. Authentication 
    and authorization are handled by third-party IAM solutions, while a Mobile CSB 
    orchestrates interactions with the Wallet Service and external notification providers.

  securityObjectives:
    - ID: OWASP_MOBILE_TOP_10
      title: OWASP Mobile Top 10
      description: |
        Address the OWASP Mobile Top 10 risks, including
        insecure data storage, weak server-side controls, and insufficient transport layer protection.
      group: Mobile Specific
      inScope: true
      treeImage: true

    - ID: PHISHING_RESISTANCE
      title: Phishing Resistance
      description: |
        Implement measures to resist phishing attacks, such as using strong authentication methods and educating users.
      inScope: true
      treeImage: false
      group: Mobile Specific

    # - ID: TRUSTED_DEVICE
    #   title: Trusted Device
    #   description: |
    #     Ensure the integrity and trustworthiness (real ownership) of the mobile device using device attestation techniques.
    #   inScope: true
    #   treeImage: true
    #   group: Mobile Specific


  assets:
    - ID: MOBILE_APP
      type: application
      title: Mobile Application
      description: |
        Native mobile app allowing users to view, transfer, and update wallet details. 
        Out of scope features include biometrics, QR code, push notifications, and offline capabilities.
      inScope: true

    - ID: MOBILE_GATEWAY
      type: process
      title: Mobile Gateway
      description: |
        Routes incoming traffic to various services within the application, handling traffic management, SSL termination, and so on.
      inScope: true

    # - ID: MOBILE_CSB
    #   type: process
    #   title: Mobile Client Specific Backend (CSB)
    #   description: |
    #     Backend layer mediating interactions between the Mobile App and the Wallet Service. 
    #     Integrates with external notification providers for push notifications.
    #   inScope: true

    # - ID: WALLET_APP
    #   type: service
    #   title: Wallet Service
    #   description: |
    #     Core wallet service responsible for wallet management, 
    #     including balance tracking, transaction history, and sub-wallets.
    #   inScope: true

    - ID: AUTHENTICATION_SERVICE
      type: service
      title: Authentication Service
      description: |
        Authenticates users to grant access to the Mobile App and its core features.
      inScope: true

    # - ID: AUTHORIZATION_SERVICE
    #   type: service
    #   title: Authorization Service
    #   description: |
    #     Authorizes users to access endpoints and resources within the Mobile CSB and Wallet Service.
    #   inScope: true

    - ID: THIRD_PARTY_NOTIFICATION
      type: service
      title: Third-Party Cloud Notification Provider
      description: |
        Provides push notifications for real-time events (for example, updates and transfers).
      inScope: true

    - ID: DF_UI_TO_CSB
      type: dataflow
      title: UI to CSB
      description: |
        Data flow of user requests (view, transfer, update) from the Mobile App to the Mobile CSB.
      inScope: true

    - ID: DF_CSB_TO_WALLET
      type: dataflow
      title: CSB to Wallet App
      description: |
        Data flow of requests from the CSB to the Wallet Service to perform wallet-related operations.
      inScope: true

    - ID: DF_CSB_TO_NOTIFICATION
      type: dataflow
      title: CSB to Notification Provider
      description: |
        Data flow to send push notifications to the Third-Party Cloud Notification Provider.
      inScope: true

analysis: |
  Security considerations focus on protecting sensitive user and transaction data 
  across authentication, authorization, and interactions with the Mobile CSB and Wallet App. 

threats:

  - ID: MOBILE_UNAUTHORIZED_ACCESS
    title: Unauthorized Access
    attack: |
      An attacker may attempt to access the mobile architecture (Mobile CSB, Wallet Service) 
      without valid credentials.
    impactDesc: |
      Leads to potential data breaches or fraudulent transactions.
    impactedSecObj:
      - REFID: OWASP_MOBILE_TOP_10
    fullyMitigated: true
    threatType: Spoofing
    pentestTestable: true
    public: true
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:L
    countermeasures:
      - ID: DEFENSE_IN_DEPTH_AUTH
        title: Defense-in-Depth Authentication and authorization
        description: |
          There are multiple layers of authentication and authorization mechanisms in place that prevent unauthorized
          access as well as DoS and endpoints enumerations and other form of information disclosure:

            - **API Gateway**: Checks token validity (signature) and enforces access control policies on requested services/URLs.
            - **IAM**: Uses IAM solutions to manage user identities and access to services.
            - **Wallet Service**: Validates the specific request and conditions to perform the requested operation.
        inPlace: true
        public: true

  - ID: MOBILE_CONNECTION_TAMPERING
    title: Connection Tampering
    attack: |
      An attacker may intercept or modify in-transit data flows 
      (for example, DF_UI_TO_CSB, DF_CSB_TO_WALLET).

    impactDesc: |
      Compromises integrity of wallet balances or transaction details, 
      resulting in unauthorized transfers or false wallet data.
    impactedSecObj:
      - REFID: OWASP_MOBILE_TOP_10
    fullyMitigated: true
    threatType: Tampering
    pentestTestable: true
    public: true
    CVSS:
      vector: CVSS:3.1/AV:A/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:L
    countermeasures:
      - ID: TLS_ENCRYPTION
        title: TLS Encryption in Transit
        description: |
          Use secure communication channels (HTTPS/TLS) at every hop between the Mobile App,
           CSB (or gateway), and Notification Provider.
        inPlace: true
        public: true
      - ID: APPLICATION_PAYLOAD_ENCRYPTION
        title: Application-Level Payload Encryption
        description: |
          Encrypt sensitive data at the application level to ensure confidentiality and integrity, 
          even if transport layer security is compromised.
          *Note:* this is currently not a chosen approach for application payload encryption due to the below considerations.
          Considerations for Application level payload encryption (VS transport level): 
            - Non standards based
            - We have always encryption (service mesh)
            - incompatible with current WAF security controls
        inPlace: false
        public: true

  - ID: MOBILE_TOKEN_THEFT
    title: Stolen Authentication Token
    attack: |
      An attacker may steal or reuse tokens from a legitimate user to gain
       unauthorized access to wallet operations.
    impactDesc: |
      Allows malicious actors to view or transfer funds without the user’s consent.
    impactedSecObj:
      - REFID: OWASP_MOBILE_TOP_10
      - REFID: PHISHING_RESISTANCE
      # - REFID: TRUSTED_DEVICE
    fullyMitigated: true
    threatType: Spoofing, Information Disclosure
    pentestTestable: true
    public: true
    CVSS:
      vector: CVSS:3.1/AV:L/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:L
    countermeasures:
      - ID: SECURE_TOKEN_STORAGE
        title: Secure Token Storage
        description: |
          Store tokens using encrypted storage mechanisms on the device.
          secure storage mechanisms:

          - **Android**: EncryptedSharedPreferences and Secure Storage.
          - **iOS: Keychain** Services for storing tokens and sensitive data.
        inPlace: true
        public: true

      - ID: SHORT_LIVED_MOBILE_TOKENS
        title: Short-Lived Tokens with Robust Refresh Flows
        description: |
          Implement short-lived tokens that expire quickly and require secure refresh mechanisms to obtain new tokens.
        inPlace: false
        public: true

      - ID: IN_MEMORY_ONLY_TOKENS
        title: Tokens Stored in Memory Only
        description: |
          Ensure tokens are stored only in volatile memory and not persisted to disk to 
          reduce the risk of token theft.
        inPlace: false
        public: true

  - ID: INSECURE_MOBILE_NOTIFICATIONS
    title: Insecure Push Notifications
    assets:
      - REFID: THIRD_PARTY_NOTIFICATION
      - REFID: DF_CSB_TO_NOTIFICATION
    attack: |
      An attacker may exploit the Third-Party Cloud Notification Provider or the Mobile
       CSB to send fraudulent alerts or prompts.
    impactDesc: |
      Users may act on misleading notifications, resulting in unauthorized transfers or data exposure.
    impactedSecObj:
      - REFID: PHISHING_RESISTANCE
    fullyMitigated: true
    threatType: Spoofing, Tampering
    pentestTestable: false
    public: true
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:H/UI:R/S:U/C:L/I:H/A:L
    ticketLink: https://r3-cev.atlassian.net/browse/R3SOL-4250
    countermeasures:
      - ID: SIGNED_NOTIFICATIONS
        title: Signed Push Notifications
        description: |
          Sign notifications or use secure channels to ensure authenticity of the sender.
        inPlace: true
        public: true
      - ID: DEEP_LINKING_VALIDATION
        title: Deep Linking Validation
        description: |
          When special links to the app are enabled, validate deep links (App Links) correctness (syntactic and semantic)
           to ensure they direct users only to legitimate app screens and targets.
          In the current design only UAEPASS App flow links are enabled and validated.
        inPlace: true
        public: true

  - ID: EXCESSIVE_MOBILE_PRIVILEGES
    title: Excessive Permissions in the Mobile App
    assets:
      - REFID: MOBILE_APP
    attack: |
      The Mobile App may request unnecessary permissions (for example, camera or location) leading 
      to potential misuse if the app is compromised or reverse-engineered.
    impactDesc: |
      Privacy violations and increased attack surface for malicious data collection.
    impactedSecObj:
      - REFID: OWASP_MOBILE_TOP_10
    fullyMitigated: true
    threatType: Information Disclosure
    pentestTestable: true
    public: true
    CVSS:
      vector: CVSS:3.1/AV:A/AC:H/PR:H/UI:N/S:U/C:H/I:L/A:N
    countermeasures:
      - ID: LEAST_PRIVILEGE_PERMISSIONS
        title: Least Privilege Permissions
        description: |
          Request only essential permissions. Justify permissions to users and handle sensitive data 
          in secure contexts.
        inPlace: true
        public: true

  - ID: MOBILE_REVERSE_ENGINEERING
    title: Mobile App Reverse Engineering
    assets:
      - REFID: MOBILE_APP
    attack: |
      Attackers may decompile or reverse-engineer the application to discover sensitive logic, tokens, or keys.
    impactDesc: |
      Revelations of proprietary logic or secret data can enable further attacks against the ecosystem.
    impactedSecObj:
      - REFID: OWASP_MOBILE_TOP_10
    threatType: Information Disclosure
    pentestTestable: false
    public: true
    fullyMitigated: false
    CVSS:
      vector: CVSS:3.1/AV:A/AC:L/PR:L/UI:N/S:U/C:L/I:N/A:N
    ticketLink: https://r3-cev.atlassian.net/browse/R3SOL-4253

    countermeasures:
      - ID: CODE_OBFUSCATION
        title: Code Obfuscation and Hardening
        description: |
          Use techniques (for example, ProGuard) to deter static analysis, 
          and employ runtime checks for tampering or debugging attempts.
        inPlace: true
        public: true
  - ID: JAILBREAK_ROOT_EXPLOITATION
    title: Jailbreak/Root exploitation
    attack: |
      An attacker may use or exploit a rooted or jailbroken device to
        bypass security controls and gain unauthorized access to sensitive data and actions.
    impactDesc: |
      Increases the risk of unauthorized access, data breaches, and other malicious activities.
    impactedSecObj:
      - REFID: OWASP_MOBILE_TOP_10
      # - REFID: TRUSTED_DEVICE
      - REFID: PHISHING_RESISTANCE
    fullyMitigated: true
    threatType: Information Disclosure, Tampering
    pentestTestable: true
    public: true
    CVSS:
      vector: CVSS:3.1/AV:P/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:N
    countermeasures:
      - ID: DETECT_JAILBREAK_ROOT
        title: Detect Jailbreak/Root
        description: |
          Implement mechanisms to detect if the device is rooted (Android) or jailbroken (iOS).
            If detected, restrict access to sensitive actions and show warnings to alert users of
            potential risks.
        inPlace: true
        public: true

  - ID: NON_COMPLIANT_MOBILE_SOLUTION
    title: Non-Compliant Solution
    attack: |
      The solution may not adhere to industry standards and regulatory requirements (for example, PCI-DSS).
    impactDesc: |
      Non-compliance can lead to legal penalties, loss of customer trust, and potential security vulnerabilities.
    impactedSecObj:
      - REFID: COMPLIANCE
    fullyMitigated: true
    threatType: Denial of Service
    pentestTestable: false
    public: true
    CVSS:
      vector: CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H
    countermeasures:
      # - ID: MOBILE_PCI_DSS_COMPLIANCE
      #   title: PCI-DSS Compliance
      #   description: |
      #     Ensure the solution complies with PCI-DSS standards by implementing required security controls, 
      #     conducting regular audits, and maintaining proper documentation.
      #   inPlace: true
      #   public: true
      - ID: OWASP_MOBILE_TOP_10_COMPLIANCE
        title: OWASP Mobile Top 10 Compliance
        description: |
          Regularly review and address the OWASP Mobile Top 10 risks to ensure the mobile application adheres to best security practices.
        inPlace: true
        public: true
      - ID: SECDEV_MOBILE_PREACTICES
        title: Secure Development Practices
        description: |
          Assure that the development team follows secure development lifecycle practices, 
          including threat modeling, code reviews, and security testing. This will contribute toward compliance 
          with most industry standards e.g. PCI-DSS, OWASP Mobile Top 10, and others.
        inPlace: true
        public: true

  - ID: OIDC_REDIRECT_SNIFFING
    title: OIDC Redirect Sniffing
    attack: |
      A malicious application on the same device may intercept OIDC redirects to steal authorization codes or JWTs, 
      allowing unauthorized access to the user's wallet operations.
    impactDesc: |
      Allows attackers to impersonate the user and perform unauthorized actions, such as viewing or transferring funds.
    impactedSecObj:
      - REFID: PHISHING_RESISTANCE
      - REFID: OWASP_MOBILE_TOP_10
    fullyMitigated: true
    threatType: Spoofing, Information Disclosure
    pentestTestable: true
    public: true
    CVSS:
      vector: CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:L
    countermeasures:
      - ID: CUSTOM_URI_SCHEME_OR_APP_LINKS
        title: Use Custom URI Schemes or App Links
        description: |
          Use *Android App Links* (HTTPS-based deep links) and the equivalent iOS
          *Universal links* to ensure 
          OIDC redirects are handled exclusively by the legitimate app. App Links require domain verification, 
          preventing malicious apps from intercepting the redirect.
        inPlace: true
        public: true
      - ID: PKCE_FOR_OIDC
        title: Implement PKCE (Proof Key for Code Exchange)
        description: |
          Use PKCE to bind the authorization code to the client that initiated the request. This prevents 
          authorization code interception and misuse by malicious apps.
        inPlace: false
        public: true
      - ID: STATE_AND_NONCE_VALIDATION
        title: Enforce State and Nonce Validation
        description: |
          Use the `state` parameter to prevent CSRF attacks and the `nonce` parameter to prevent replay attacks. 
          Validate these parameters during the OIDC flow to ensure the integrity of the authentication process.
        inPlace: true
        public: true
      - ID: SYSTEM_BROWSER_FOR_OIDC
        title: Use System Browser for OIDC Flows
        description: |
          Perform OIDC authentication in the system browser (for example, Chrome Custom Tabs) instead of in-app WebViews. 
          The system browser is isolated from other apps, reducing the risk of redirect interception.
        inPlace: false
        public: true
      - ID: TOKEN_MONITORING_AND_REVOCATION
        title: Monitor and Revoke Tokens
        description: |
          Implement monitoring to detect suspicious token usage (such as unusual IP addresses or devices). 
          Provide a mechanism to revoke tokens if they are compromised.
        inPlace: false
        public: true

  - ID: UNAUTHORIZED_SENSITIVE_OPERATIONS
    title: Unauthorized Sensitive Operations
    attack: |
      An attacker may exploit weak or missing step-up authentication mechanisms to perform 
      sensitive operations (such as high-value transfers, account modifications, or credential 
      changes) without proper user verification.
    impactDesc: |
      Allows malicious actors to perform unauthorized sensitive operations, leading to 
      financial loss, data breaches, and reputational damage.
    impactedSecObj:
      - REFID: PHISHING_RESISTANCE
    fullyMitigated: true
    threatType: Spoofing, Tampering, Privilege Escalation
    pentestTestable: true
    public: true
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:L
    countermeasures:
      - ID: STEP_UP_AUTHENTICATION
        title: Implement Step-Up Authentication
        description: |
          Require additional authentication factors (such as biometrics, OTP, or PIN) for 
          sensitive operations such as high-value transfers, account changes, or credential 
          updates. This ensures that only authorized users can perform critical actions.

          Some options:

          **Use OIDC for Step-Up Authentication**

          Integrate OpenID Connect (OIDC) to manage step-up authentication flows. OIDC can 
          trigger additional authentication factors (for example, MFA) based on the sensitivity of 
          the operation.

          **Use FIDO for Strong Authentication e.g. Passkeys**  

          Integrate FIDO2/WebAuthn for passwordless, phishing-resistant step-up authentication.
          FIDO leverages biometrics or hardware security keys to verify the user’s identity
           during sensitive operations.

        inPlace: false
        public: true

      - ID: RISK_BASED_AUTHENTICATION
        title: Risk-Based Authentication
        description: |
          Use risk-based authentication to dynamically assess the risk level of an operation 
          (for example, based on transaction amount, user location, or device). Trigger step-up 
          authentication for high-risk operations.
        inPlace: false
        public: true

      - ID: TRANSACTION_AND_OPERATION_LIMITS
        title: Enforce Transaction and Operation Limits
        description: |
          Implement limits for sensitive operations (for example, daily transfer limits, maximum 
          account changes per day). Require step-up authentication for operations exceeding 
          these limits and/or validation rules.
        inPlace: true
        public: true

      - ID: REAL_TIME_USER_NOTIFICATIONS
        title: Real-Time User Notifications
        description: |
          Notify users in real-time (via push notifications) for all 
          sensitive operations. Allow users to approve or reject the operation before it is 
          finalized.
        inPlace: false
        public: true

      - ID: SESSION_TIMEOUT_FOR_SENSITIVE_OPS
        title: Enforce Session Timeout for Sensitive Operations
        description: |
          Implement short session timeouts for sensitive operations. Require re-authentication 
          if the session expires or if the user is inactive for a specified period.
        inPlace: false
        public: true

      # - ID: MULTI_FACTOR_AUTHENTICATION
      #   title: Require Multi-Factor Authentication (MFA)
      #   description: |
      #     Enforce multi-factor authentication (MFA) for all sensitive operations. Combine 
      #     something the user knows (for example, their password), something the user has (for example, OTP), and 
      #     something the user is (for example, biometrics) for enhanced security.
      #   inPlace: true
      #   public: true

      - ID: AUDIT_LOGS_FOR_SENSITIVE_OPS
        title: Maintain Audit Logs for Sensitive Operations
        description: |
          Log all sensitive operations (such as transfers or account changes) with details such as 
          user, timestamp, and operation type. Regularly review logs for suspicious activity.
        inPlace: true
        public: true

  - ID: SUCCESSFUL_PHISHING_EXPLOITATION
    title: Successful Phishing Exploitation
    attack: |
      An attacker may use phishing techniques (for example, fake apps, malicious links, or social engineering) 
      to trick users into revealing sensitive information (such as credentials or tokens) or performing 
      unauthorized actions.
    impactDesc: |
      Leads to unauthorized access, data breaches, and financial loss.
    impactedSecObj:
      - REFID: PHISHING_RESISTANCE
    fullyMitigated: true
    threatType: Social Engineering
    pentestTestable: false
    public: true
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:H/A:L
    countermeasures:

      - ID: USER_EDUCATION_AND_AWARENESS
        title: User Education and Awareness
        description: |
          Conduct regular training sessions to educate users about phishing risks and how to recognize and avoid phishing attempts.
        inPlace: false
        public: true

      - ID: PHISHING_RESISTANT_AUTHENTICATION
        title: Implement Phishing-Resistant Authentication Methods
        description: |
          Use strong authentication methods based on UAEPASS mobile flow (not web flow).
        inPlace: true
        public: true

      - ID: DEVICE_REGISTRATION
        title: Device Registration and Trust
        description: |
          Implement device registration to ensure that only trusted 
          devices can access the mobile application.
        inPlace: false
        public: true

      - ID: DEVICE_AUTHENTICATION_VIA_UAEPASS_MOBILEFLOW_ONLY
        title: Device Authentication via UAEPASS Mobile Flow only
        description: |
          UAEPASS Mobile Flow only login implies a Trusted Device that also uses PIN, TouchID, or FaceID.
          Use UAEPASS mobile flow implies that the device is trusted and authenticated as part of the UAEPASS registration process.
          This is in contrast with the webflow: Web Flow Involves an Untrusted Device where 
          the actual approval is then securely pushed to your trusted mobile device via a notification.
        inPlace: true
        public: true

      - ID: DEVICE_INTEGRITY_CHECKS
        title: Device Integrity Checks
        description: |
          Implement integrity checks (Play Integrity API for Android, and Apple "Device Attestation" for iOS) 
          that checks to detect also if the device is rooted or jailbroken and restrict access to operations on compromised devices.
        inPlace: true
        public: true

      - REFID: REAL_TIME_USER_NOTIFICATIONS

      - ID: SINGLE_SESSION_ENFORCEMENT
        title: Single Session Enforcement
        description: |
          Enforce single active session per user to prevent session hijacking and unauthorized access from multiple devices.
          This control should be excluded only if business requirements dictate otherwise
        inPlace: true
        public: true

      - ID: SINGLE_DEVICE_ENFORCEMENT
        title: Single Device Enforcement
        description: |
          Enforce single active device per user to prevent unauthorized access from multiple devices.
          This control should be excluded only if business requirements dictate otherwise
        inPlace: false
        public: true
