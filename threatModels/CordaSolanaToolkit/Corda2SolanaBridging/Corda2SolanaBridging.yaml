  - ID: REDEMPTION_HIJACKING
    title: Redemption Hijacking via Front-Running
    attack: |
      A malicious Corda participant observes a deposit to a redemption address on Solana that is 
      not their own.
       They then front-run the legitimate owner by creating a Corda transaction (forging a syntactically valid tampered Redeem flow TX) to
        "un-bridge" one of their own locked assets, consuming the deposited Solana tokens and 
        effectively stealing the redemption value.
    pentestTestable: true
    threatType: Tampering
    impactDesc: |
      The legitimate redeemer loses their funds on Solana, while the attacker successfully redeems their own asset using someone else's deposit. This breaks the 1:1 peg and trust in the redemption process.
    impactedSecObj:
      - REFID: ASSET_INTEGRITY
    attackers:
      - REFID: BRIDGING_PARTY
    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:L/I:H/A:N
    fullyMitigated: true
    countermeasures:
      - ID: BIND_REDEMPTION_TO_DEPOSIT
        title: Bind Redemption to Specific Deposit
        description: |
          The redemption process must cryptographically link the Corda "un-bridge" transaction to a specific 
          deposit event on Solana. 
          The configuration maps redemption wallet accounts to specific Corda holders 
          (redemptionWalletAccountToHolder), but this must be enforced atomically during the burn-and-unlock
           process.
        inPlace: true
        public: true
      - ID: RESTRICT_REDEMPTION_FLOW_INITIATORS
        title: Restrict Redemption Flow Initiators
        description: |
          Only allow the Bridge Authority to initiate the redemption flow.
        inPlace: true
        public: true

  - ID: UNFINALIZED_REDEMPTION1
    title: Redemption finality not delivered to redeemer
    attack: |
      The redemption is first committed on Solana and then finalized on Corda. In DFC2S_FINALITY_REDEEM,
      a network or node issue can block the whole transactional workflow. The Solana burn is final,
      but the redeemer does not receive the updated Corda state in their vault, creating an availability
      and reconciliation gap.
    threatType: Denial of Service
    pentestTestable: true
    impactDesc: |
      The redeemer cannot observe or use the redeemed Corda asset despite a successful burn on Solana.
      This causes operational disputes and delays in settlement reconciliation.
    impactedSecObj:
      - REFID: AVAILABILITY
      - REFID: ASSET_INTEGRITY
    attackers:
      - REFID: NETWORK_ATTACKER
    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:N/I:L/A:L
    fullyMitigated: true
    countermeasures:
      - ID: BA_TX_RECOVERY
        title: Bridge Authority Transaction and worflow Recovery
        description: |
          Retry and recovery mechanisms are implemented in the Bridge Authority for completing transactions.
          If delivery to the redeemer fails, the BA queue and retry until successful.
        inPlace: true
        public: true

