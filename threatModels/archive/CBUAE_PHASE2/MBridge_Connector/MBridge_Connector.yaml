  - ID: MISCONFIGURED_RECONCILIATION
    title: Reconciliation Failures Between Local Systems and MBridge Ledger
    attack: |
      System or process misconfigurations result in inconsistent states between 
      internal ledgers and MBridge. Attackers could exploit this discrepancy to conceal fraudulent transactions.
    impactDesc: |
      Delayed settlement, missing or duplicated transactions, 
      or inaccurate reporting undermines trust in cross-border payment flows.
    impactedSecObj:
      - REFID: INTEGRITY
      - REFID: AVAILABILITY
    fullyMitigated: true
    threatType: Tampering
    pentestTestable: false
    public: true
    CVSS:
      vector: CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:U/C:L/I:H/A:L
    countermeasures:
      - ID: PERIODIC_LEDGER_RECONCILIATION
        title: Routine Transaction Audit & Reconciliation
        description: |
          Perform scheduled comparisons of local transaction logs 
          with mBridge ledger records to detect mismatches promptly, 
          triggering alerts for suspicious discrepancies.
        inPlace: false
        public: true

      - ID: MBRIDGE_CONNECTOR_STATELESS_LOGIC
        title: Stateless Logic for MBridge Connector
        description: |
          Implement stateless processing logic in the connector to ensure 
          consistent transaction handling and avoid state misalignments.
        inPlace: true
        public: true


