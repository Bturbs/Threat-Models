# parent: CordaSolanaToolkit

scope:
  description: |
    This threat model covers key management for Solana Notary Program deployment and administration.

    The deployment uses Squads multisig with a 3-of-5 threshold for two privileged authorities:

    - Upgrade Authority (program upgrade operations)
    - Notary Admin (administrative operations such as authorize/revoke notary)

    **Implementation Reference (TODO verify code):**

    The following SDK snippet is treated as an illustrative reference for setup flow only.
    It is not validated in this threat model and must be verified against the currently supported
    Squads v4 SDK/API before production use.

    ```typescript
    import * as multisig from "@sqds/multisig";
    import { Connection, Keypair, PublicKey } from "@solana/web3.js";
    import { Permissions } from "@sqds/multisig/types";

    async function createSquad() {
      const connection = new Connection("https://api.mainnet-beta.solana.com");

      const creator = Keypair.generate();
      const createKey = Keypair.generate();
      const [multisigPda] = multisig.getMultisigPda({
        createKey: createKey.publicKey,
      });

      const members = [
        {
          key: creator.publicKey,
          permissions: Permissions.all(),
        },
        {
          key: new PublicKey("SECOND_MEMBER_PUBKEY"),
          permissions: Permissions.all(),
        }
      ];

      const signature = await multisig.rpc.multisigCreateV2({
        connection,
        createKey,
        creator,
        multisigPda,
        configAuthority: null,
        timeLock: 0,
        threshold: 2,
        members,
        memo: "My Team Multisig",
      });

      console.log("Multisig Created! PDA:", multisigPda.toBase58());
      console.log("Transaction Signature:", signature);
    }
    ```

