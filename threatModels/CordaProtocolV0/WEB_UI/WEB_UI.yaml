ID: WEB_UI
schemaVersion: 2
title: Web UI (Next.js) Threat Model
version: '1.0'
authors: |
  Security Research team at R3
parent: CordaProtocolV0

scope:
  description: |
    Threat model for the Next.js Web UI that interacts with the Corda Protocol
    vault. The Web UI performs user onboarding, wallet connection, and submission
    of deposit/redeem requests. It integrates with third-party compliance and
    telemetry services (e.g., AML screening) and relays results to the backend.

    Third-party services are treated as out of scope, while the dataflows to
    those services remain in scope.

  assets:
    - ID: WEB_UI_APP
      type: system
      title: Web UI Application
      description: |
        Next.js application responsible for onboarding and transaction intent
        submission.
      inScope: true

    - ID: USER_BROWSER
      type: endpoint
      title: User Browser
      description: |
        User agent running the Web UI and signing requests.
      inScope: false

    - ID: BACKEND_API
      type: system
      title: Backend API Service
      description: |
        Backend API used by the Web UI for compliance checks and transaction
        submission.
      inScope: false

    - ID: AML_SCREENING_SERVICE
      type: system
      title: AML Screening Service
      description: |
        Third-party AML screening provider used for sanctions and risk checks.
      inScope: false

    - ID: KYC_IDV_PROVIDER
      type: system
      title: KYC Identity Verification Provider
      description: |
        Third-party identity verification service for onboarding.
      inScope: false

    - ID: ANALYTICS_SERVICE
      type: system
      title: Analytics and Telemetry Service
      description: |
        Third-party telemetry provider for usage analytics.
      inScope: false

    - ID: USER_PII
      type: data
      title: User PII
      description: |
        User identity data submitted during onboarding.
      inScope: true

    - ID: AML_RESULT_DATA
      type: data
      title: AML Screening Results
      description: |
        AML screening decision and risk metadata returned by the provider.
      inScope: true

    - ID: DF_WEB_UI_TO_AML
      type: dataflow
      title: AML Screening Request
      description: |
        Web UI submits user identity and risk metadata to AML provider.
      inScope: true

    - ID: DF_AML_TO_WEB_UI
      type: dataflow
      title: AML Screening Response
      description: |
        AML provider returns screening outcome and risk flags.
      inScope: true

    - ID: DF_WEB_UI_TO_KYC
      type: dataflow
      title: KYC Verification Request
      description: |
        Web UI submits user identity data and documents to KYC provider.
      inScope: true

    - ID: DF_KYC_TO_WEB_UI
      type: dataflow
      title: KYC Verification Response
      description: |
        KYC provider returns identity verification result.
      inScope: true

    - ID: DF_WEB_UI_TO_ANALYTICS
      type: dataflow
      title: Analytics Event Submission
      description: |
        Web UI sends anonymized usage events to analytics service.
      inScope: true

analysis: |
  Key focus areas include client-side integrity, third-party dependency risk,
  and protection of sensitive onboarding data.

  **Web UI Integrations**

  <object type="image/svg+xml" data="img/web_ui_integrations.svg" style="width:100%; height:auto;">
  <img src="img/web_ui_integrations.svg"/>
  </object>

threats:
  - ID: AML_BYPASS_VIA_CLIENT_TAMPERING
    title: Client Tampering to Bypass AML/KYC
    attack: |
      An attacker modifies the Web UI (e.g., via devtools, custom scripts, or
      direct API calls) to skip AML/KYC requests or to falsify results before
      submission to the backend. The attacker relies on client-side logic being
      treated as authoritative.
    threatType: Spoofing
    impactDesc: |
      Compliance checks are bypassed, allowing sanctioned or high-risk users to
      initiate deposits or redemptions.

      - Regulatory violations and audit failures
      - Exposure to illicit funds and sanctions risk
      - Loss of trust and potential legal penalties

    impactedSecObj:
      - REFID: COMPLIANCE
    attackers:
      - REFID: MALICIOUS_USER
      - REFID: EXTERNAL_ATTACKER
    assets:
      - REFID: WEB_UI_APP
      - REFID: DF_WEB_UI_TO_AML
      - REFID: DF_WEB_UI_TO_KYC
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:N'
    pentestTestable: true
    fullyMitigated: false
    countermeasures:
      - ID: SERVER_SIDE_COMPLIANCE_ENFORCEMENT
        title: Enforce AML/KYC on Backend
        description: |
          Require server-side AML/KYC validation before any transaction intent
          is accepted. The backend should verify compliance tokens or provider
          signatures, not client-provided flags.
        inPlace: false
        public: true

      - ID: AML_PROVIDER_ATTESTATION
        title: Validate Provider Attestations
        description: |
          Use signed AML/KYC attestations from the provider with nonce and
          expiration checks to prevent replay or forgery.
        inPlace: false
        public: true

  - ID: PII_EXPOSURE_VIA_ANALYTICS
    title: PII Exposure via Analytics or Telemetry
    attack: |
      The Web UI forwards user identifiers or sensitive onboarding data to the
      analytics provider through misconfigured event payloads or accidental
      logging of form fields.
    attackers:
      - REFID: EXTERNAL_ATTACKER
    threatType: Information Disclosure
    impactDesc: |
      User PII is disclosed to a third party outside approved data handling
      boundaries, leading to privacy violations and regulatory exposure.
    impactedSecObj:
      - REFID: COMPLIANCE
    # attackers:
      # - REFID: MALICIOUS_THIRD_PARTY
    assets:
      - REFID: ANALYTICS_SERVICE
      - REFID: USER_PII
      - REFID: DF_WEB_UI_TO_ANALYTICS
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N'
    pentestTestable: true
    fullyMitigated: false
    countermeasures:
      - ID: ANALYTICS_PII_REDACTION
        title: Redact PII from Analytics Events
        description: |
          Enforce a strict analytics schema with allowlisted fields and strip
          identifiers before transmission. Add CI checks to prevent PII fields
          from being logged.
        inPlace: false
        public: true

      - ID: CLIENT_SIDE_EVENT_FILTER
        title: Client Event Filtering
        description: |
          Filter or disable analytics events until consent is recorded and
          sensitive workflows are completed.
        inPlace: false
        public: true
