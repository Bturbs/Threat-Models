ID: CBDC_DeploymentPipeline
schemaVersion: 2
title: CBDC Deployment Pipeline
parent: CBUAE_PHASE1

scope:
  description: |
    The scope of this threat model is the build and deployment pipeline. 
    An issuance delivery process is shown below.
    <img src="img/R3IssuanceDeliveryProcess.png"/><br/>
    All the following RFIs refer to the figure:

    (RFI: Step E Push remote requests goes to remote, with an arrow from Jenkins-in-cloud-A to Remote-1-in-Cloud-B; what is it actually being pushed? What does it mean 'Just instructions'? Could you please clarify?)
    (RFI: Should not there be an arrow between JFrog and Remote1? )
    (RFI: Are Remotes 1, 2 and 3 GitHub clouds? )
    (RFI: What are the credentials represented by the key at Remot1 ? What is it used for? )
    (RFI: What are the credentials represented by the key at Jenkins-in-Cloud-B ? What is it used for? )
    (RFI: The following list of command will be supported CICD-8, Wire_commit, deploy and debug for commiting, deploying and debigging code into G42 repo. How are authentication and authorisation enforced? )
    R3 runs a multi-cloud development and deployment model. 
    This means essentially that critical parts of the Issuance Platform Code are on one private cloud model (A) in AWS, 
    and the infrastructure that supports it running on Azure (B). 

    We also have the G42 Dedicated Cloud environment to consider (C) (Lower). 
    Each environment has a remote GIT Repo; Remote 1 is Azure R3 IAC, Remote 2 is G42 Cloud and Remote 3 is R3 Platform GIT Repo.
    Due to IP issues as well, it is important to keep the source code from one away from the other. 
    So, whilst development of the infrastructure related code can happen in B, it cannot see the source code of A, neither can C.
    (RFI: I think this statemenet should instead say that source code developed in B should not be seen A. )
        
  # (RFI: Is there difference in the trust zone, between A, B and C? Different access control for each zone. ) 
  # (RFI: To protect IP, it means that source codes and builds for CBUAE projects are categorsied into two; those under IP and else. Both builds and source code must be confidential in the first case. Access control on repo must be enforced with need to know and least privilege principels applied, running code on private network is also another measure. )

  securityObjectives:
    - ID: PRIVATE_BUILD
      title: The build pipeline is not public.
      description: |
        Build pipelines must not be exposed to the internet. The build subnet is private not public.
      contributesTo:
        - REFID: SECURE_DEPLOYMENT
      group: Operational

    - ID: CONTROLLED_BUILD_PROMOTION
      title: Controlled build promotion
      description: |
        Promotion of build artifacts through pipelines must be restricted to authorised individuals. 
        Specifically authorizing builds for release and production environmemnts must be tightly controlled. 
      contributesTo:
        - REFID: SECURE_DEPLOYMENT
      group: Operational

    - ID: BUILD_RESILIENCE
      title: Build resilience
      description: |
        Promoted builds should be free from vulnerabilities. Automated security tooling in combination with 
         manual code reviewing must be enforced to all builds. 
      contributesTo:
        - REFID: SECURE_DEPLOYMENT
      group: Operational

    - ID: CODE_AUTHENTICATION_VERIFICATION
      title: Verifying Code Authenticity
      description: |
        The authenticity of all published binaries and build aritifacts must be verifiable.
        Specifically jar files, docker images and helm charts must all be digitally signed. 
        Signature verification must be carried prior to deployment in the production environment.     
      contributesTo:
        - REFID: SECURE_DEPLOYMENT
      group: Operational

    - ID: PROTECTING_SOURCE_CODE_IP
      title: Protecting Customer specific Source code IP
      description: |
        Customer specific source code and their related builds must have their IP protected.  
        Source code specific to the CBUAE project must not be co-mingled with general R3 projects. 
      contributesTo:
        - REFID: SECURE_DEPLOYMENT
      group: Operational



  assets:

    - ID: BUILD_SYSTEM
      type: system
      title: Build System
      description: |
        This is the system of converting source code files into standalone software artifacts that can be run on a computer.  
      inScope: true

    - ID: SOURCE_CODE
      type: source code
      title: Source code
      description: |
        Code produced by the programmer.  
      inScope: true

    - ID: PASSWORDS_AND_CREDENTIALS
      type: Secret
      title: Passwords and credentials
      description: |
        Secrets including Passwords and credentials.  
      inScope: true

    - ID: DEPENDENCIES
      type: Dependencies
      title: Dependencies
      description: |
        TODO.  
      inScope: true

    - ID: BINARY_ARTIFACTS
      type: Binary artifact
      title: Binary artifacts
      description: |
        Outcome of the build processes.  
      inScope: true

  attackers:
    - ID: INTERNAL_DEVELOPER
      title: Internal Developer
      description: |
        A Developer in R3 who has credentials to develop and commit code to the R3 internal repository. 

      inScope: true

    - ID: public_DEVELOPER
      title: Public Developer
      description: |
        A Developer that is not authorised to commit code to R3 internal repository. It can contribute to open-source code by making 
        git requests. 

      inScope: true

    - ID: R3_RELEASE_MANAGER
      title: R3 Release Manager
      description: |
        An R3 employee authorized to to initiate security-critical builds such as 'final release' or 'release candidate' and 
        releases for production environment.   

      inScope: false

analysis: |2

  The main security objective in this T.M is to ensure the integrity of the code; against tampering and unauthorised releases.
  The most dangerous threats come from attackers with insider developer credentials, introducing malicious payload into the code 
  and ending up being in a final release or in production environment.  


threats:

  - ID: UNAUTHORISED_BUILD_PROMOTED
    title: Promotion of unauthorised builds
    assets:
      - REFID: BINARY_ARTIFACTS

    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:N/I:H/A:L
      # CVSS:3.1/AV:A/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:H --alternative cvss
    threatType: Tampering
    attack: |
      An attacker, with R3 developer credentials, is able to promote a vulnerable build directly to production environemnt 
      (G42 Cloud C in the R3 Issuance_Delivery_Process diagram), circumventing code reviews and testing.   

    impactDesc: Build artifacts might contain malicious payloads or backdoors 
      that are published for distribution to customer production systems, 
      enabling future compromise.

    impactedSecObj:
      # - REFID: ISSUANCE_REDEMPTION_CONTROL
      - REFID: BUILD_RESILIENCE
      - REFID: CONTROLLED_BUILD_PROMOTION


    public: true
    fullyMitigated: true
    countermeasures:
      # - ID: BUILD_PIPELINE_SEGREGATION
      #   title: Segregation of Build pipelines
      #   description: |
      #     Pipeline 
      #   operational: false
      #   inPlace: true
      #   public: true

      - ID: LIMIT_RBAC_BUILD_PIPELINE
        title: Strict Role based access control of the Build pipelines
        description: |
          Builds for production environments should be initiated by a limited number of authorised persons (Release manager and its deputy).
           They should be able to select which branches are to be included as a release candidate.
            
        operational: false
        inPlace: false
        public: true

      - ID: LIMIT_RBAC_BUILD_PIPELINE_CONFIGURATION
        title: Strict Role based access control of the Build pipelines 
          configuration
        description: |
          The integrity of the build pipeline must be protected. Pipeline configuration such as Jenkins files and github actions/workflows
          must have tightly enforced access controls.  
        operational: false
        inPlace: false
        public: true

      - ID: LIMIT_RBAC_JUMP_SERVER
        title: Strict RBAC of the Jump server
        description: |
          The Jump server used to send promoted builds to the G42 Cloud (customer) is strictly controlled. 
          Only authorised individuals can access that server. 
        operational: false
        inPlace: false
        public: true


      - ID: AUDIT_LOG_JUMP_SERVER
        title: Audit log of the Jump server
        description: |
          All access to the Jump server and all commands executed on that server must be 
          auditable. All logs must go to centralised logging service.
        operational: false
        inPlace: false
        public: true



  - ID: CODE_TAMPERING_IN_BUILD_TEST
  # Injecting malicious code into the build ;
    title: Injecting malicious code into the build
    assets:
      - REFID: SOURCE_CODE

    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:N/I:H/A:L
    threatType: Tampering, Repudiation, Spoofing
    attack: |
      Malicious code is injected during the build process. This might be done via different means;  hijacked build scripts or
       maliciuos unit tests, for example.

    impactDesc: Build artifacts contain malicious payloads or backdoors that are
      published for distribution to customer production systems, enabling future
      compromise.

    impactedSecObj:
      - REFID: BUILD_RESILIENCE
      - REFID: CONTROLLED_BUILD_PROMOTION

    public: true
    fullyMitigated: true
    countermeasures:
      - ID: BUILD_PIPELINE_SEGREGATION
        title: Segregation of Build pipelines
        description: |
          Build pipelines for customer releases should be segregated from pipelines used for general development.
        operational: false
        inPlace: true
        public: true

      - REFID: LIMIT_RBAC_BUILD_PIPELINE_CONFIGURATION

      - ID: STATIC_MANUAL_CODE_REVIEW
        title: Static manual code review
        description: |
          All pull requests (PR) must have manual code reviewing enforced.
           
        operational: false
        inPlace: true
        public: true

      - ID: SIGN_COMMITS
        title: Sign all commits
        description: |
          Requiring developers to sign their commits mitigates the potential for a developer to hide their tracks when including 
           deliberately malicious behaviour 
        operational: false
        inPlace: false
        public: false

      - ID: GIT_CODE_OWNER
        title: GitHub Code Owner
        description: |
          The 'code owner' feature in GitHub provides greater control and visibility of changes on critically important files (such as 
           build.gradle, build configurations, security-sensitive libraries and modules)  
        operational: false
        inPlace: true
        public: true



  - ID: SECRET_CREDENTIALS_THEFT
    title: Secret Credentials Theft during build
    assets:
      - REFID: PASSWORDS_AND_CREDENTIALS

    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:L/UI:R/S:U/C:H/I:N/A:N
    threatType: Information Disclosure
    attack: |
      TODO (RFI: Securing credentials used by Jenkins, are credentials stored as environment variables even when they are managed by Jenkins used best practice? and are they subsequently exposed to builds).

    impactDesc: Theft of credentials results in an unauthorized access to 
      related source repositories.

    impactedSecObj:
      - REFID: PROTECTING_SOURCE_CODE_IP
      - REFID: CONTROLLED_BUILD_PROMOTION
      - REFID: CODE_AUTHENTICATION_VERIFICATION
      # - REFID: CONFIDENTIALITY
      # - REFID: INTEGRITY
      # - REFID: REPORTING_MONITORING

    public: true
    fullyMitigated: true
    countermeasures:

      - ID: DEFINE_SECRETS_SCOPE
        title: Define the scope of secrets
        description: |
          TODO (RFI: Is it possible to scope credentials based on stage in a build pipeline?)
          (RFI: what are other possible countermeasures?)
          (RFI: What is Keycloak used for?)
        operational: false
        inPlace: false
        public: true

      - ID: VAULT
        title: Credentials can be stored in HashiCorp Vault
        description: |
          The credentials can be stored in HashiCorp Vault. This should secure credentials at rest.
        operational: false
        inPlace: true
        public: true



