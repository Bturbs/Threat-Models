  **Refs:** [LLD - 10.8.3 Cryptography and Public Key Infrastructure/Certificate authority, certificate trust chain, and validation/Timestamping](#LLD)

  <h4>Notary Key rotation</h4>
  Given the backchain TXs validation is required in token transfer (an entity trying to validate backchain transaction signatures must have access to all ledger keysused), that backchain at some point will be signed with expired or rotated notary keys, plus it will be the first time an entity (for example, the PAYEE) sees this backchain signature. 
  that backchain at some point will be signed with expired/rotated Notary keys AND it will be the first time an entity (e.g. PAYEE) sees this backchain signatures.
  There's no way to distinguish and verify an old expired backchain Notary signature from a new signature with a compromised/rotated key.
  The assumptions is that any timestamping trusted party will rotate their PKI identity keys. 
  If the mitigation for this non-ability to verify backchain signatures is that any new TX 
  will need anyway to go through Notary validation again, then the existence of the backchain (and related information disclosure threats) may not be necessary.

  **Refs:** [LLD - 10.10.3.2 Cryptography and Public Key Infrastructure/Certificate and asymmetric key lifecycle/Solution design/Certificate expiry](#LLD), [LLD - 10.9.4 Cryptography and Public Key Infrastructure/Certificate propagation: platform operator and local certificate store/Component 1: Back-end Vault KV store](#LLD)

