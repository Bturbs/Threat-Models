        https://github.com/corda/corda-runtime-os/tree/release/os/5.0/libs/packaging
      inScope: true
    - ID: DF_CPK_DISTRIBUTION
      type: dataflow
      title: CPK distribution to CORDAPP_PUBLISHER
      description: CPK distribution to CORDAPP_PUBLISHER
      inScope: false
    - ID: DF_CPB_VERIFY
      type: dataflow
      title: CPB verification
      description: Group Network Operator checks the validity
