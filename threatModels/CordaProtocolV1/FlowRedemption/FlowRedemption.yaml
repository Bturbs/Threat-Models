ID: FlowRedemption
schemaVersion: 2
title: Redemption Flow
version: '0.2'
status: Draft
parent: CordaProtocolV1

authors: |
  Security Research team at R3
  Updated: 2026-05-14

scope:
  description: |
    Child threat model covering the current redemption flow in the Vault Program.
    The live code uses escrowed vTokens plus optional internal matching against
    pending deposits; it no longer depends on tokenizer aToken burns as the
    primary redemption mechanism.

    This flow usually involves these steps:

    1. **Tx 1** — Investor calls `create_redemption_proposal`. vTokens are moved
       from the investor account into the vault's pinned `vtoken_vault` escrow and
       an expected USDC amount is recorded on the proposal.
    2. **Optional Tx 2** — Curator calls `match_deposit_redemption` to cross part
       of the redemption against a pending `InvestmentProposal`. The depositor
       receives escrowed vTokens, the redeemer receives USDC from `usdc_vault`,
       and fee transfers go to the pinned `fee_recipient`.
    3. **Optional Tx 3** — If the proposal remains completely unmatched, curator
       may call `cancel_redemption_proposal` to return escrowed vTokens.
    4. **Tx 4** — Curator calls `settle_redemption` for any remaining unmatched
       vTokens, paying USDC to the investor, transferring exit fees to
       `fee_recipient`, and burning the remaining escrowed vTokens.

    Pricing is based on the vault's live oracle-wrapper-backed price. Both
    matching and settlement can optionally consume sealed snapshot accounts to
    price-lock a cycle.

    <img src="img/Redemption-flowSEQ1.svg" alt="Redemption Flow Sequence Diagram"/>

  assets:
    - ID: DF_MATCH_DEPOSIT_REDEMPTION
      type: dataflow
      title: Deposit and Redemption Matching Dataflow
      description: |
        `match_deposit_redemption` crosses a pending investment proposal against a
        pending redemption proposal at a chosen price anchor, moving vTokens from
        `vtoken_vault` to the depositor and USDC from `usdc_vault` to the redeemer.
      inScope: true

    - ID: DF_REDEMPTION_SETTLEMENT
      type: dataflow
      title: Redemption Settlement Payout and Fee Transfer
      description: |
        `settle_redemption` transfers investor payout and exit fee out of the
        vault's USDC account and burns the remaining escrowed vTokens.
      inScope: true

  assumptions:
    - ID: RD_CURATOR_AUTHORIZED
      description: |
        The curator controls `match_deposit_redemption`, `settle_redemption`, and
        unmatched `cancel_redemption_proposal`. Abuse of this authority is in scope.

    - ID: RD_SNAPSHOT_OPTIONAL
      description: |
        Snapshot accounts are optional inputs. If omitted, the live price from
        `vault.get_vtoken_price(...)` is used for matching and settlement.

analysis: |
  The current redemption flow is a custody and timing problem rather than a
  tokenizer clawback problem. The main attack surface is now:

  - vTokens are escrowed before the investor receives USDC
  - curator controls whether a proposal is matched, cancelled, or settled
  - price-locking exists, but sealed snapshots are optional rather than mandatory
  - fees are paid to a pinned recipient, making recipient governance a custody control

  **Key Attack Surface**

  - Curator-controlled cancellation and settlement timing
  - Optional rather than mandatory snapshot-based price locking
  - Internal crossing between deposits and redemptions
  - Pinned fee recipient as a configuration-critical payout destination

threats:
  - ID: RD_CURATOR_LOCKS_ESCROWED_FUNDS
    title: Curator delays settlement or refuses cancellation of escrowed redemption
    attack: |
      After `create_redemption_proposal`, the investor's vTokens are locked in
      `vtoken_vault`. The curator can then delay both matching and settlement, or
      refuse to call `cancel_redemption_proposal` while the proposal remains
      unmatched.

      The investor has no unilateral on-chain cancel path even when the proposal
      is still fully unmatched.

    threatType: Denial of Service
    impactDesc: |
      The investor's vTokens remain escrowed and unusable.

      - The investor cannot transfer or redeem those shares elsewhere
      - Exit timing depends on curator responsiveness
      - Operational outages can extend lockup indefinitely

    impactedSecObj:
      - REFID: USER_FUNDS_SAFETY
      - REFID: AVAILABILITY
    attackers:
      - REFID: CURATOR
      - REFID: VAULT_MANAGER
    assets:
      - REFID: REDEMPTION_PROPOSAL_PDA
      - REFID: VTOKEN_VAULT_ATA
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:N/I:N/A:H'
    fullyMitigated: false
    countermeasures:
      - ID: RD_CURATOR_CANCEL_EXISTS
        title: Curator can cancel unmatched proposals
        description: |
          The code supports `cancel_redemption_proposal` when `matched_vtokens == 0`.
          This reduces indefinite lock risk but does not help if the curator is the
          failing or malicious party.
        inPlace: true
        public: true

      - ID: RD_INVESTOR_SELF_CANCEL_TIMEOUT
        title: Investor self-cancel or timeout path
        description: |
          Add an investor-invokable timeout or self-cancel path for unmatched
          proposals so escrowed vTokens can be recovered without curator action.
        inPlace: false
        public: true

  - ID: RD_OPTIONAL_SNAPSHOT_PRICE_MANIPULATION
    title: Curator exploits live price timing when snapshots are omitted
    attack: |
      `match_deposit_redemption` and `settle_redemption` accept optional snapshot
      accounts, but they can also execute against the live oracle-wrapper-backed
      price returned by `vault.get_vtoken_price(...)`.
      A malicious curator can choose when to match or settle after an adverse
      feed movement, or omit a sealed snapshot entirely to preserve timing
      discretion.

    threatType: Tampering
    impactDesc: |
      Investors can receive less favorable pricing than expected.

      - Redeemers may receive lower USDC payouts
      - Depositors may receive fewer vTokens than intended
      - Timing discretion becomes a hidden source of value extraction

    impactedSecObj:
      - REFID: USER_FUNDS_SAFETY
      - REFID: AUDITABILITY
    attackers:
      - REFID: CURATOR
      - REFID: VAULT_MANAGER
    assets:
      - REFID: REDEMPTION_PROPOSAL_PDA
      - REFID: INVESTMENT_PROPOSAL_PDA
      - REFID: VAULT_PDA
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:H/UI:N/S:U/C:N/I:H/A:N'
    fullyMitigated: false
    countermeasures:
      - ID: RD_OPTIONAL_SEALED_SNAPSHOTS
        title: Snapshot accounts supported by code
        description: |
          `settle_redemption` can consume a sealed `RedemptionSnapshot` and
          `match_deposit_redemption` can consume a sealed `DepositSnapshot` to
          freeze pricing for a cycle.
        inPlace: true
        public: true

      - ID: RD_MANDATORY_SNAPSHOT_POLICY
        title: Require sealed snapshots for matching and settlement
        description: |
          Make sealed snapshots mandatory for curator-driven matching and
          redemption settlement so price timing cannot be chosen opportunistically.
        inPlace: false
        public: true

  - ID: RD_MATCHING_ACCOUNTING_ERROR
    title: Matching logic misallocates value between depositor and redeemer
    attack: |
      A defect in `match_deposit_redemption` or a malformed curator invocation
      could attempt to overmatch either side of the trade, miscompute fees, or
      move more vTokens or USDC than the remaining proposal balances allow.

    threatType: Tampering
    impactDesc: |
      Incorrect crossing could transfer value between investors incorrectly.

      - Depositor could receive too many or too few vTokens
      - Redeemer could receive too much or too little USDC
      - Proposal bookkeeping could become inconsistent across the pair

    impactedSecObj:
      - REFID: USER_FUNDS_SAFETY
      - REFID: INTEGRITY
    attackers:
      - REFID: CURATOR
      - REFID: VAULT_MANAGER
    assets:
      - REFID: DF_MATCH_DEPOSIT_REDEMPTION
      - REFID: REDEMPTION_PROPOSAL_PDA
      - REFID: INVESTMENT_PROPOSAL_PDA
      - REFID: VTOKEN_VAULT_ATA
      - REFID: USDC_VAULT_ATA
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:H/UI:N/S:U/C:N/I:H/A:N'
    fullyMitigated: true
    countermeasures:
      - ID: RD_REMAINING_AMOUNT_BOUNDS
        title: Remaining amount bounds enforced on both proposals
        description: |
          The instruction bounds `usdc_amount` by deposit remaining capacity and
          bounds the derived vToken count by redemption remaining capacity.
          Proposal counters (`netted_usdc`, `matched_vtokens`) are updated using
          checked arithmetic.
        inPlace: true
        public: true

      - ID: RD_FULLY_MATCHED_CLOSEOUT
        title: Fully matched redemption proposal closes immediately
        description: |
          When the redemption proposal is fully matched, the PDA is closed and
          cannot later be settled again for a duplicate payout.
        inPlace: true
        public: true

  - ID: RD_FEE_RECIPIENT_DIVERSION
    title: Fee recipient misconfiguration diverts exit fees
    attack: |
      `settle_redemption` and `match_deposit_redemption` both route fees to the
      vault's pinned `fee_recipient`. If that field is misconfigured or changed to
      an attacker-controlled account, every redemption routes fees to the wrong
      destination while still passing account validation.

    threatType: Tampering, Elevation of Privilege
    impactDesc: |
      Exit fees are diverted from the intended treasury or operations account.

      - Fee revenue is lost or stolen
      - Accounting and audit expectations are violated
      - Misconfiguration persists across all future settlements until corrected

    impactedSecObj:
      - REFID: INTEGRITY
      - REFID: AUDITABILITY
    attackers:
      - REFID: CURATOR
      - REFID: PROTOCOL_CONFIG_AUTHORITY
      - REFID: VAULT_MANAGER
    assets:
      - REFID: DF_REDEMPTION_SETTLEMENT
      - REFID: VAULT_PDA
      - REFID: USDC_VAULT_ATA
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:N/I:H/A:N'
    fullyMitigated: false
    countermeasures:
      - ID: RD_PINNED_FEE_RECIPIENT_CHECK
        title: Fee recipient is pinned and validated on-chain
        description: |
          Settlement instructions require the supplied fee recipient account to
          match `vault.fee_recipient`, preventing a compromised curator from
          substituting an arbitrary payout account per transaction.
        inPlace: true
        public: true

      - ID: RD_FEE_RECIPIENT_GOVERNANCE
        title: Governance review for fee recipient changes
        description: |
          Changes to `fee_recipient` should require multi-party review, monitoring,
          and an operational approval trail because the field is a custody-critical
          destination for every redemption fee.
        inPlace: false
        public: true
        operational: true
        operator: Vault Admin Team
