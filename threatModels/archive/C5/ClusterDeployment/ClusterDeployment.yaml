  - ID: UNTRUSTED_P2PGW_ROUTING
    appliesToVersions: ">=5.0"
    title: |
      Internet exposed P2P_GATEWAY 
    impactedSecObj:
      - REFID: FULL_CIA
    attack: |
      Remote code execution and other attacks (IDOR) attacks may be attempted and be potentially successful,
       gaining complete access to the cluster endpoints and Kubernetes worker node (kernel exploit) and infrastructure.
    assets:
      - REFID: WORKER_PROCESS
      - REFID: P2P_GATEWAY
    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H/E:U/RC:U
    threatType: Elevation of privileges with complete confidentiality integrity 
      and availability loss
    public: true
    fullyMitigated: true
    countermeasures:
      - ID: P2P_GATEWAY_DMZ
        appliesToVersions: ">=5.0"
        title: P2P_GATEWAY dedicated DMZ
        description: |
          P2P_GATEWAY networking is limited and segregated from the other WORKER_PROCESS (no routing). P2P_GATEWAY can only try to access KAFKA.
        inPlace: false
        public: true
        operational: true
        operator: INFRASTRUCTURE_OPERATOR
      - ID: P2P_GATEWAY_SEPARATE_NODE
        title: P2P_GATEWAY dedicated worker node
        description: |
          P2P_GATEWAY runs on it own Kernel and/or Hardware.
          P2P_GATEWAY do not share the same OS (running above Hypervisor access) with other Kubernetes Working nodes.
        inPlace: false
        operational: true
        operator: INFRASTRUCTURE_OPERATOR
        public: true
      - REFID: P2P_GATEWAY_MINIMAL_KAFKA_ACCESS
      - REFID: P2P_GATEWAY_DEDICATED_TOPICS


  - ID: INSECURE_INTERNAL_REST_ENDPOINT
    appliesToVersions: ">=5.1"
    title: |
      Internal APIs may expose unprotected sensitive data or allow attacks escalations
    impactedSecObj:
      - REFID: FULL_CIA
    attack: |
      An attacker that gain access to the Workers network (for example with a SSRF attack)
       can spawn calls without Authentication to any Worker REST service in [DF_INTERNAL_REST_APIS](#DF_INTERNAL_REST_APIS)

    assets:
      - REFID: DF_INTERNAL_REST_APIS
    CVSS:
      vector: CVSS:3.1/AV:A/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:L
    threatType: Elevation of privileges
    public: true
    fullyMitigated: false
    countermeasures:
      - ID: ISTIO_SERVICE_MESH
        appliesToVersions: ">=5.2"
        title: ISTIO Secure Service Mesh
        description: |
          Secure service-to-service communication in a cluster with TLS encryption, strong identity-based authentication and authorization
            
             - Automatic load balancing for HTTP, gRPC, WebSocket, and TCP traffic
             - Fine-grained control of traffic behavior with rich routing rules, retries, failovers, and fault injection
             - A pluggable policy layer and configuration API supporting access controls, rate limits and quotas
             - Automatic metrics, logs, and traces for all traffic within a cluster, including cluster ingress and egress

          [Internal REF](https://github.com/corda/platform-eng-design/blob/main/ADR/decisions/0010-istio-for-http-security-layer.md)
          (RFI: David C, we should add a guide to flag this is in place, right?)
        inPlace: false
        public: true
        operational: true
        operator: INFRASTRUCTURE_OPERATOR


# In 5.2, service mesh and Istio is used to provide security on the link between the Link manager and the gateway
# Without Istio this is a plaintext between two entities in two different trust zones. 
# Threat : misconfigured polcy, can result into complete deny of service for comunication between he LM and GW.
# CM: Authemticatiuon and Authorisation in place for setting policies of Istio
# Threat: access to metrics gathered by Istio
# CM: Authentication and authorisation 
# Threat: Because all Corda workers are beingh injected by Istio, this can affect performance
# CM: Istio is used for security and is needed only on the communication between Linkmanager and the gateway that does not use Kafka. 
#     If the performance is afected by Istio, it can be enabled only on that link (Gateway-toLinkManager) that does not use Kafka.
# Threat : Unsecured HTTP connection between the LinkManager (Internal network) and the Gateway (In DMZ) exposes that link. 
#  This is 5.2 as a result of removing Kafka from this link. 
# CM: Use of service mesh with secure mutual TLS enabled - e.g Istio 
title: Clusterdeployment
