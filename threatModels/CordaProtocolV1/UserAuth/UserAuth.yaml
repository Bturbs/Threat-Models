            including key generation ceremony, multisig membership update, and
            old key destruction
          - **Periodic rotation:** Key rotation policy (e.g., annually) even
            without a triggering event
          - **Emergency revocation:** Pre-agreed fast-track process to remove a
            signer upon suspected compromise (within hours, not days)
          - **Membership audits:** Regular review of active signers vs.
            authorized personnel (quarterly minimum)
          - **Automated monitoring:** Alerts on on-chain multisig membership
            changes
