  - ID: BOOTSTRAP_PROC1
    title: Bootstrap Process credential leak
    assets:
      - REFID: KAFKA_CREDENTIALS
      - REFID: CLUSTER_DB
    CVSS:
      vector: CVSS:3.1/AV:L/AC:H/PR:H/UI:N/S:U/C:H/I:H/A:H
    threatType: Elevation of Privileges
    pentestTestable: true
    attack: |
      An attacker can read installation data leftovers (Kubernetes Bootstrap processes/pods) gaining elevated privileges to create topics and ACLs. 
    impactedSecObj:
      - REFID: FULL_CIA
    # impact: Attackers can attempt flows (TBC), consume resources, pollute logs.
    # public: true
    # fullyMitigated: true
    fullyMitigated: false


    countermeasures:
      - ID: SECURE_MANUAL_BOOTSTRAP
        title: Bootstrapping can be performed manually so that the secret is not
          required
        description: |
          Bootstrapping can be performed manually, without processes, so that the secrets are not required
        inPlace: yes
        public: true
        operational: true
        operator: INFRASTRUCTURE_OPERATOR
      - ID: AUTO_BOOTSTRAP_CLEAN
        title: Post bootstrap cleanup
        description: |
          The INFRASTRUCTURE_OPERATOR removes The bootstrap user and processes and secrets post-installation.
          Latest versions od HELM chats perform automatically part of the tasks.  
        inPlace: false
        public: true
        operator: INFRASTRUCTURE_OPERATOR
