ID: Infrastructure
schemaVersion: 2
title: Runtime Infrastructure
version: '0.1'
status: Draft

authors: |
  Security Research team at R3
  Updated: 2026-03-13

parent: CordaProtocolV1

scope:
  description: |
    Threat model for the **runtime cloud infrastructure** hosting the Corda Protocol V1 services.

    **In Scope:**

    - Cloud hosting environment (AWS or Azure) — compute, networking, storage used at runtime
    - Kubernetes cluster hosting application workloads (hardening, RBAC, network policies)
    - Secrets management solution (cloud-native such as AWS Secrets Manager / Azure Key Vault,
      or self-hosted such as HashiCorp Vault)
    - Cloudflare CDN / reverse proxy fronting public-facing endpoints
    - Runtime network architecture (VPC, subnets, security groups, load balancers)

    **Out of Scope:**

    - CI/CD deployment pipeline (Jenkins, build agents, artifact storage) — separate threat model
    - Infrastructure operator role and procedures — to be added to parent threat model
    - Solana RPC nodes (not operated by this team)
    - On-chain program logic (covered by parent and sibling threat models)

    **NOTE:** This is a high-level threat model with placeholder threats to be refined once the
    infrastructure design is more mature. Specific cloud provider, Kubernetes distribution, and
    secrets manager solution are not yet finalised.

  assets:
    # ── Cloud Hosting ──
    - ID: CLOUD_ENVIRONMENT
      type: system
      title: Cloud Hosting Environment
      description: |
        The cloud account and region(s) hosting the runtime workloads (AWS or Azure).
        Includes VPC/VNet, subnets, IAM/Entra roles, and cloud-native services.
      inScope: true

    # ── Kubernetes ──
    - ID: K8S_CLUSTER
      type: system
      title: Kubernetes Cluster
      description: |
        Managed Kubernetes cluster (EKS, AKS, or equivalent) running application
        pods, ingress controllers, and platform services.
      inScope: true

    - ID: K8S_WORKLOADS
      type: system
      title: Application Workloads (Pods)
      description: |
        Container workloads deployed on Kubernetes serving the Corda Protocol runtime
        (API services, backend workers, monitoring).
      inScope: true

    - ID: K8S_RBAC
      type: system
      title: Kubernetes RBAC Configuration
      description: |
        Role-based access control policies governing who and what can interact with
        the Kubernetes API and cluster resources.
      inScope: true

    # ── Secrets Manager ──
    - ID: SECRETS_MANAGER
      type: system
      title: Secrets Management Solution
      description: |
        Centralised secrets storage and retrieval service. May be cloud-native
        (AWS Secrets Manager, Azure Key Vault) or self-hosted (HashiCorp Vault).
        Stores API keys, database credentials, signing keys, and TLS certificates
        consumed by application workloads at runtime.
      inScope: true

    - ID: RUNTIME_SECRETS
      type: credential
      title: Runtime Secrets and Credentials
      description: |
        Credentials consumed by application workloads at runtime, including database
        passwords, API tokens, signing keys, and TLS private keys.
      inScope: true
      properties:
        storageLocation: Secrets management solution (to be determined)
        rotationPolicy: To be defined

    # ── Cloudflare ──
    - ID: CLOUDFLARE_CDN
      type: system
      title: Cloudflare CDN / Reverse Proxy
      description: |
        Cloudflare service fronting public-facing endpoints, providing DDoS protection,
        TLS termination, WAF, and caching. Not built by this team but configured by it.
      inScope: true

    # ── Dataflows ──
    - ID: DF_INTERNET_TO_CLOUDFLARE
      type: dataflow
      title: Internet to Cloudflare
      description: |
        Public internet traffic reaching Cloudflare edge. Subject to DDoS, bot traffic,
        and application-layer attacks before Cloudflare rules apply.
      inScope: true

    - ID: DF_CLOUDFLARE_TO_ORIGIN
      type: dataflow
      title: Cloudflare to Origin (Kubernetes Ingress)
      description: |
        HTTPS connection from Cloudflare to the cloud-hosted Kubernetes ingress.
        Must be authenticated to prevent origin bypass.
      inScope: true

    - ID: DF_WORKLOAD_TO_SECRETS
      type: dataflow
      title: Workload to Secrets Manager
      description: |
        Communication channel from application pods to the secrets management
        solution for credential retrieval at runtime.
      inScope: true

    - ID: DF_INTERNAL_CLUSTER
      type: dataflow
      title: Intra-Cluster Network Traffic
      description: |
        Pod-to-pod and pod-to-service traffic within the Kubernetes cluster.
      inScope: true

    # ── Out-of-scope external systems ──
    - ID: SOLANA_RPC
      type: system
      title: Solana RPC Endpoint
      description: |
        External Solana RPC nodes used by application workloads. Not operated by
        this team.
      inScope: false

    - ID: CI_CD_PIPELINE
      type: system
      title: CI/CD Pipeline (Jenkins)
      description: |
        Build and deployment pipeline. Out of scope for this infrastructure
        threat model.
      inScope: false

  assumptions:
    - ID: CLOUD_PROVIDER_RESPONSIBILITY
      description: |
        The cloud provider (AWS or Azure) is responsible for physical security,
        hypervisor isolation, and underlying hardware. These are out of scope
        per the shared responsibility model.

    - ID: CLOUDFLARE_OPERATIONAL_INTEGRITY
      description: |
        Cloudflare's platform operates correctly and is not itself compromised.
        Misconfiguration of Cloudflare rules by this team IS in scope.

    - ID: DESIGN_NOT_FINALISED
      description: |
        The specific cloud provider, Kubernetes distribution, and secrets management
        solution have not been finalised. Threats are modelled at a generic level
        and must be refined once architecture decisions are made.

  attackers:
    - ID: INFRA_COMPROMISED_WORKLOAD
      title: Compromised Workload (Lateral Movement)
      description: |
        An application pod or container that has been compromised (e.g., via
        dependency vulnerability, code injection) and is used as a pivot point
        to attack other cluster resources, secrets, or cloud services.
      inScope: true

    - ID: INFRA_OPERATOR
      title: Infrastructure Operator
      description: |
        Team member or service account with administrative access to the cloud
        environment or Kubernetes cluster. Malicious or compromised operator.
      inScope: false

analysis: |
  This is a **high-level, placeholder threat model** for the runtime infrastructure layer.
  It is intended to capture the key attack surfaces early and be refined incrementally
  as the infrastructure design matures.

  **Key Attack Surfaces:**

  1. **Cloud account and IAM** — over-privileged roles, credential leakage, metadata service abuse
  2. **Kubernetes cluster** — RBAC misconfiguration, container escapes, network segmentation gaps
  3. **Secrets management** — unauthorised access, weak rotation, injection into workloads
  4. **Cloudflare / edge layer** — origin bypass, WAF evasion, TLS misconfiguration
  5. **Network architecture** — lateral movement, egress controls, monitoring blind spots

  **Maturity Note:**
  Threats below are intentionally high-level. Each should be decomposed into specific
  attack scenarios once the technology stack is selected and deployment architecture is defined.

threats:
  - ID: ORIGIN_BYPASS
    title: Direct Access to Origin Bypassing Cloudflare
    attack: |
      Attacker discovers the origin IP address or hostname of the Kubernetes ingress and
      sends requests directly, bypassing Cloudflare's DDoS protection, WAF rules, and
      rate limiting.

      Discovery methods include:

      - DNS history or certificate transparency logs exposing origin IP
      - Misconfigured DNS records leaking origin address
      - Information disclosure in error pages or HTTP headers

    threatType: Tampering
    impactDesc: |
      Bypassing Cloudflare removes a critical defensive layer:

      - DDoS protection no longer applies to direct traffic
      - WAF rules and bot mitigation are circumvented
      - Rate limiting is ineffective
      - Attacker can directly probe origin for vulnerabilities

    impactedSecObj:
      - REFID: INTEGRITY
      - REFID: AVAILABILITY
    attackers:
      - REFID: EXTERNAL_ATTACKER
    assets:
      - REFID: CLOUDFLARE_CDN
      - REFID: DF_CLOUDFLARE_TO_ORIGIN
      - REFID: K8S_CLUSTER
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:H'
    fullyMitigated: false
    countermeasures:
      - ID: ORIGIN_IP_RESTRICTION
        title: Restrict origin ingress to Cloudflare IP ranges
        description: |
          Configure cloud security groups / firewall rules to only accept inbound
          HTTPS traffic from Cloudflare's published IP ranges. Reject all other
          public traffic to the origin.

          - Cloudflare publishes IP ranges at https://www.cloudflare.com/ips/
          - Automate security group updates when ranges change

        inPlace: false
        public: true

      - ID: CLOUDFLARE_AUTHENTICATED_ORIGIN
        title: Cloudflare Authenticated Origin Pulls
        description: |
          Enable Cloudflare Authenticated Origin Pulls (mutual TLS) so the origin
          only accepts connections presenting a valid Cloudflare client certificate.
          Requests without the certificate are rejected even if they reach the origin IP.

        inPlace: false
        public: true

  - ID: K8S_RBAC_MISCONFIGURATION
    title: Kubernetes RBAC Misconfiguration Allowing Privilege Escalation
    attack: |
      Overly permissive RBAC policies allow a compromised workload or low-privilege
      service account to escalate privileges within the cluster:

      - Default service account tokens mounted in pods with excessive permissions
      - ClusterRoleBindings granting broad access (e.g., cluster-admin)
      - Ability to create pods, exec into containers, or read secrets across namespaces

    threatType: Elevation of Privilege
    impactDesc: |
      RBAC misconfiguration enables lateral movement and privilege escalation:

      - Read secrets from other namespaces
      - Deploy malicious workloads
      - Modify network policies or RBAC rules
      - Access the Kubernetes API server as cluster-admin

    impactedSecObj:
      - REFID: INTEGRITY
      - REFID: CONFIDENTIALITY
    attackers:
      - REFID: INFRA_COMPROMISED_WORKLOAD
    assets:
      - REFID: K8S_RBAC
      - REFID: K8S_CLUSTER
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H'
    fullyMitigated: false
    countermeasures:
      - ID: LEAST_PRIVILEGE_RBAC
        title: Implement least-privilege RBAC policies
        description: |
          Apply principle of least privilege to all Kubernetes RBAC:

          - Disable automounting of service account tokens where not needed
          - Use namespace-scoped Roles instead of ClusterRoles
          - Audit RBAC bindings regularly
          - No default service account usage for application pods

          **Placeholder:** Specific RBAC policies to be defined once workload architecture is finalised.

        inPlace: false
        public: true

  - ID: K8S_NETWORK_SEGMENTATION_GAP
    title: Missing Network Policies Enabling Lateral Movement
    attack: |
      Default Kubernetes networking allows unrestricted pod-to-pod communication.
      A compromised workload can reach any other service in the cluster:

      - Probe internal services (databases, secrets manager, monitoring)
      - Exploit internal APIs not designed for untrusted callers
      - Exfiltrate data via unrestricted egress

    threatType: Information Disclosure
    impactDesc: |
      Lack of network segmentation allows a compromised pod to:

      - Access secrets manager directly
      - Reach databases and internal APIs
      - Move laterally across namespaces
      - Exfiltrate data without restriction

    impactedSecObj:
      - REFID: CONFIDENTIALITY
      - REFID: INTEGRITY
    attackers:
      - REFID: INFRA_COMPROMISED_WORKLOAD
    assets:
      - REFID: DF_INTERNAL_CLUSTER
      - REFID: K8S_WORKLOADS
      - REFID: SECRETS_MANAGER
    CVSS:
      vector: 'CVSS:3.1/AV:A/AC:L/PR:L/UI:N/S:C/C:H/I:L/A:N'
    fullyMitigated: false
    countermeasures:
      - ID: NETWORK_POLICIES
        title: Implement default-deny NetworkPolicies per namespace
        description: |
          Deploy default-deny ingress and egress NetworkPolicies in every namespace,
          then add explicit allow rules for known communication paths:

          - Application pods → secrets manager
          - Ingress controller → application pods
          - Application pods → external APIs (restricted egress)
          - Deny all other cross-namespace traffic

          **Placeholder:** Specific policies to be defined once service topology is known.

        inPlace: false
        public: true

  - ID: SECRETS_UNAUTHORISED_ACCESS
    title: Unauthorised Access to Secrets Management Solution
    attack: |
      Attacker gains access to the secrets manager through:

      - Exploiting overly permissive IAM/RBAC policies on the secrets manager
      - Leveraging cloud instance metadata (e.g., IMDSv1) to obtain credentials
      - Compromised workload using its service identity to read secrets beyond its scope
      - Misconfigured secrets manager policies allowing broad read access

    threatType: Information Disclosure
    impactDesc: |
      Unauthorised secrets access exposes:

      - Database credentials
      - API keys for external services
      - Signing keys used for on-chain operations
      - TLS private keys

      This can lead to full application compromise, data breach, and loss of funds
      if signing keys are exposed.

    impactedSecObj:
      - REFID: CONFIDENTIALITY
    attackers:
      - REFID: INFRA_COMPROMISED_WORKLOAD
      - REFID: EXTERNAL_ATTACKER
    assets:
      - REFID: SECRETS_MANAGER
      - REFID: RUNTIME_SECRETS
      - REFID: DF_WORKLOAD_TO_SECRETS
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:N'
    fullyMitigated: false
    countermeasures:
      - ID: SECRETS_LEAST_PRIVILEGE
        title: Apply least-privilege policies on secrets manager
        description: |
          Each workload should only have access to the specific secrets it requires:

          - Use workload identity (IRSA / Workload Identity) for authentication
          - Scope secrets manager policies to specific secret paths per service
          - Enable audit logging on all secrets access
          - Enforce IMDSv2 on compute instances to prevent metadata credential theft

          **Placeholder:** Specific policies depend on chosen secrets manager and workload architecture.

        inPlace: false
        public: true

      - ID: SECRETS_ROTATION
        title: Implement automated secrets rotation
        description: |
          Define rotation schedules for all runtime credentials:

          - Database passwords: 30-90 day rotation
          - API keys: 90 day rotation
          - TLS certificates: auto-renewal before expiry
          - Signing keys: rotation policy based on risk assessment

          **Placeholder:** Rotation strategy to be defined based on secrets manager capabilities.

        inPlace: false
        public: true

  - ID: CONTAINER_ESCAPE
    title: Container Escape to Host or Cluster
    attack: |
      Attacker exploits a vulnerability in the container runtime, kernel, or
      misconfigured pod security settings to escape the container sandbox:

      - Privileged containers or excessive Linux capabilities
      - Mounted host paths (hostPath volumes)
      - Unpatched container runtime (containerd, CRI-O)
      - Exploitable kernel vulnerabilities via unconfined seccomp/AppArmor

    threatType: Elevation of Privilege
    impactDesc: |
      Container escape grants host-level access:

      - Read all secrets from all pods on the node
      - Access the kubelet API and impersonate any pod
      - Pivot to cloud metadata service for IAM credentials
      - Compromise other nodes via cluster networking

    impactedSecObj:
      - REFID: INTEGRITY
      - REFID: CONFIDENTIALITY
    attackers:
      - REFID: INFRA_COMPROMISED_WORKLOAD
    assets:
      - REFID: K8S_WORKLOADS
      - REFID: K8S_CLUSTER
    CVSS:
      vector: 'CVSS:3.1/AV:L/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H'
    fullyMitigated: false
    countermeasures:
      - ID: POD_SECURITY_STANDARDS
        title: Enforce Pod Security Standards (restricted profile)
        description: |
          Apply Kubernetes Pod Security Standards at the namespace level:

          - Enforce "restricted" profile (no privileged, no hostPath, drop all capabilities)
          - Require non-root containers
          - Require read-only root filesystem where possible
          - Enable seccomp and AppArmor profiles

          **Placeholder:** Pod Security Admission configuration to be defined per namespace.

        inPlace: false
        public: true

      - ID: NODE_PATCHING
        title: Maintain patched container runtime and OS
        description: |
          Ensure worker nodes run patched operating systems and container runtimes:

          - Enable automatic OS security updates or managed node groups with auto-upgrade
          - Monitor CVEs for containerd / CRI-O
          - Rebuild and rotate node images regularly

        inPlace: false
        public: true
        operational: true

  - ID: CLOUD_IAM_OVEREXPOSURE
    title: Overly Permissive Cloud IAM Policies
    attack: |
      Cloud IAM roles attached to Kubernetes nodes or workload identities have
      excessive permissions beyond what is required:

      - Wildcard actions (e.g., `*` on all resources)
      - Broad resource scope (e.g., `Resource: "*"`)
      - Missing condition constraints (e.g., no source IP or tag restrictions)
      - IAM roles allowing cross-account access unintentionally

    threatType: Elevation of Privilege
    impactDesc: |
      Overly permissive IAM policies amplify the blast radius of any compromise:

      - Compromised pod can access unrelated cloud resources
      - Escalation to other AWS/Azure services (S3, RDS, KMS)
      - Data exfiltration via cloud service APIs
      - Account-level impact if admin-equivalent role is assumed

    impactedSecObj:
      - REFID: INTEGRITY
      - REFID: CONFIDENTIALITY
    attackers:
      - REFID: INFRA_COMPROMISED_WORKLOAD
    assets:
      - REFID: CLOUD_ENVIRONMENT
      - REFID: K8S_CLUSTER
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:L'
    fullyMitigated: false
    countermeasures:
      - ID: IAM_LEAST_PRIVILEGE
        title: Apply least-privilege IAM with workload identity
        description: |
          Assign fine-grained IAM roles to Kubernetes workloads using workload
          identity federation (IRSA on AWS, Workload Identity on Azure):

          - One IAM role per service, scoped to specific resource ARNs
          - No wildcard actions or resources
          - Enable IAM Access Analyzer to detect over-privileged policies
          - Enforce IMDSv2 with hop limit 1 on all instances

          **Placeholder:** IAM policies to be defined per workload once service architecture is known.

        inPlace: false
        public: true

  - ID: INSECURE_INGRESS_TLS
    title: TLS Misconfiguration on Ingress or Origin
    attack: |
      Weak or misconfigured TLS on the Kubernetes ingress or between Cloudflare and
      origin allows traffic interception:

      - TLS termination at Cloudflare with plain HTTP to origin
      - Expired or self-signed certificates on origin
      - Weak cipher suites or deprecated TLS versions (TLS 1.0/1.1)
      - Missing HSTS headers

    threatType: Information Disclosure
    impactDesc: |
      TLS misconfiguration enables:

      - Eavesdropping on traffic between Cloudflare and origin
      - Man-in-the-middle attacks on internal connections
      - Credential theft from unencrypted traffic
      - Downgrade attacks

    impactedSecObj:
      - REFID: CONFIDENTIALITY
    attackers:
      - REFID: EXTERNAL_ATTACKER
    assets:
      - REFID: DF_CLOUDFLARE_TO_ORIGIN
      - REFID: DF_INTERNET_TO_CLOUDFLARE
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N'
    fullyMitigated: false
    countermeasures:
      - ID: END_TO_END_TLS
        title: Enforce end-to-end TLS (Cloudflare Full Strict mode)
        description: |
          Configure Cloudflare in Full (Strict) SSL mode requiring a valid, trusted
          certificate on the origin:

          - Use Cloudflare Origin CA or Let's Encrypt certificates on ingress
          - Enforce TLS 1.2+ with strong cipher suites
          - Enable HSTS with long max-age
          - Automate certificate renewal

          **Placeholder:** Certificate management approach to be defined based on infrastructure choices.

        inPlace: false
        public: true

  - ID: INSUFFICIENT_MONITORING
    title: Insufficient Runtime Monitoring and Logging
    attack: |
      Lack of comprehensive logging and monitoring creates blind spots that allow
      attackers to operate undetected:

      - No VPC flow logs or network-level visibility
      - Missing Kubernetes audit logs
      - No secrets access audit trail
      - Absent alerting on anomalous behaviour

    threatType: Repudiation
    impactDesc: |
      Without adequate monitoring:

      - Intrusions go undetected for extended periods
      - Incident response lacks forensic evidence
      - Compliance audit requirements are unmet
      - Root cause analysis is impossible after incidents

    impactedSecObj:
      - REFID: AUDITABILITY
      - REFID: AVAILABILITY
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: INFRA_COMPROMISED_WORKLOAD
    assets:
      - REFID: CLOUD_ENVIRONMENT
      - REFID: K8S_CLUSTER
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:N'
    fullyMitigated: false
    countermeasures:
      - ID: COMPREHENSIVE_LOGGING
        title: Enable comprehensive logging across all layers
        description: |
          Implement logging and monitoring at each infrastructure layer:

          - Cloud layer: VPC flow logs, CloudTrail / Activity Log, GuardDuty / Defender
          - Kubernetes: API server audit logs, pod logs aggregation
          - Secrets manager: Access audit logs with alerting
          - Network: Ingress/egress traffic analysis

          Centralise logs with minimum 90-day retention.

          **Placeholder:** Logging stack and SIEM integration to be defined.

        inPlace: false
        public: true
        operational: true
