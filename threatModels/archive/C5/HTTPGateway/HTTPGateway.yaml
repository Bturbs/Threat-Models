parent: C5
ID: HTTPGateway
schemaVersion: 2
title: HTTP RPC Gateway

gantt:
  startDate: 2022-09-01
  endDate: 2022-12-31
  status: done

scope:
  description: |
    The HTTP RPC Gateway a component service of a Corda 5 node that exposes a variety of API endpoints that enable
    control of a Corda cluster.

    The Gateway service and its transport mechanism is considered here as the subject
    of this threat-model; individual API endpoints are out-of-scope and are subject to their
    specific threat-models.

    Inbound connections are authenticated by the HTTP Gateway using HTTP Basic. User
    credentials (passwords) are salted and hashed using a secure password-based
    key derivation function (PBKDF2), and stored in an external database. A 
    volatile in-memory cache of password hashes (SHA2) is used to speed up the 
    authentication of repeated clients requests.  

  attackers: #imported from C5 Threat model TBD hot to reference them in here e.g. C5.cordApp_user
    # - ID: UserManager
    #   description: Creates user roles and manages permissions for all Virtual Nodes
    #     in the cluster
    #   inScope: true

  assumptions:
    - ID: 1
      description: |
        HTTP Gateway will be operated in an environment that prohibits direct connections from the Internet.
        Only connections from an internal/trusted private network will be possible.
        TBC that this is the case also in a B2C cordapp.
    - ID: 2
      description: |
        All incoming HTTP requests are over a secure TLS connection, authenticated using a server
        Client authentication is currently performed using HTTP Basic.
        The server authentication is performed via a DNS-linked certificate issued by a trusted PKI
        ( TBC public root CA, same as the browsers?). Certificate pinning is not used by gateway clients.
        Self-signed certificates will only be used in testing and development scenarios, and never in a production 
        environment.
    - ID: 3
      description: |
        The deployment of workers are in separated processes/PODs


  assets:

    - ID: CACHED_PASSWORD
      inScope: true
      title: In memory cached user password
      type: credentials
      description: In memory cached user password. A volatile in-memory cache of
        password hashes (SHA2) is used to speed up the authentication of 
        repeated clients requests.
      properties:
        location: HTTP_GATEWAY Java process memory
        type: Hashed password
        format: AES
        length: 256
      applicationRelated: true
      infrastructureRelated: false

    - ID: DF_REST_STATE
      type: DataFlow
      title: State Manager DB connection for [REST_WORKER]
      description: |
        Flow status storage updates [REF](https://github.com/corda/platform-eng-design/blob/main/core/corda-5/corda-5.2/flow/flow-status-storage/flow-status-storage.md)
        The FlowStatus contains:

          - key: FlowKey
          - initiatorType: FlowInitiatorType
          - flowId: String
          - flowClassName: String
          - flowStatus: FlowStates
          - result: String
          - error: ExceptionEnvelope
          - processingTerminatedReason: String
          - createdTimestamp: Instant
          - lastUpdateTimestamp: Instant
      inScope: true

    - ID: DF_ALL_HTTP_ENDP
      type: DataFlow
      title: API endpoints
      description: |
        Generic HTTPS calls/responses from CordApp clients to API endpoints. This is an encrypted TLS channel (non mutual by default)
      inScope: true

    - ID: DF_adminPolicyEndP1
      type: DataFlow
      title: admin APIs endpoints
      description: |
        HTTPS calls/response from Cluster Operator to manage users and permissions
      specifies: DF_ALL_HTTP_ENDP
      authentication: >
        One of:

        - **HTTP Basic Auth**:
         may be provisioned at installation time by
        the superuser. CLI tools are used
        to setup the initial "Admin" password is
        provided at installation time, stored in the DB1 (Slow hash is BCrypt TBC)    -
        **SSO**:
        preferred, OAuth2 (credential storage depends on installation/Out Of Scope),
        - **SAML**:
        this is also an option

        Communication is over TLS with server authentication (non mutual)
      inScope: true
    - ID: DF_anonEndP1
      type: DataFlow
      specifies: DF_ALL_HTTP_ENDP
      title: Anonymous endpoints
      description: |
        HTTPS calls/responses from anonymous unauthenticated users. Exposed functionality
        is limited to the minimum functionality required to enable a basic level of 
        service to node clients. e.g. `GetProtocolVersion()` and `OpenApi()` Swagger files.
      inScope: true
    - ID: DF_VNodeAnyEndP
      type: DataFlow
      title: VNode APIs endpoints
      specifies: DF_ALL_HTTP_ENDP
      description: |
        Generic HTTPS calls/responses from VNode operators (any API exposed endpoint).
        The VNode operator user account is created by CLUSTER_OPERATOR and given the role `VNodeOperator`. 
        Roles are checked by HTTP_GATEWAY (RBAC). User IDs will be email addressed for SSO users (OAuth2/SAML).
        Same authentication/credentials and credential storage as Admin. 
      inScope: true

    - ID: DF_CRUDIntPol1
      title: Update policy internal
      type: Internal call (TBC)
      description: Internal call to the RBAC component(library) from the API 
        server endpoint code
      inScope: false
    - ID: DF_CRUD_Pol2
      type: DataFlow
      title: Policy update Kafka message
      description: Kafka Message to update RBAC policy definition
      inScope: true
    - ID: DF_TLS_HSM1
      type: dataFlow
      title: HSM link
      description: Connection to the HSM which manages the private TLS key
      inScope: true
    - ID: HTTP_GATEWAY_TLS_KEY
      type: key
      title: REST Gateway TLS key
      description: TLS key for REST API / HTTP Gateway connections
      inScope: true
      properties:
        location: TBD
        type: Private authentication key
        format: ECDSA private key
        length: 256
      applicationRelated: false
      infrastructureRelated: true


    - ID: DF_StartupCredentials1
      type: DataFlow
      title: Configured credentials
      description: Credentials passed to the Gateway Worker at start time
      inScope: false
    - ID: DF_GenericMSGtoWorker
      type: DataFlow
      title: Any Kafka message
      description: |
        Generic Kafka message sent form a configured API endpoint (server-side code) to another internal component/worker.
        *<br>TODO** channel protocol (TLS/HTTP, SSH), auth protocol (BASIC, client cert...), 
         credential storage (config file, salted hash, HSM...) and how they are trusted (root of trust key, delegation to MGM/Flow, pinned certificates...)
      inScope: false
    - ID: RBAC_component
      type: library
      title: RBAC
      description: internal java library responsible for enforcing the RBAC 
        policies and read/update/store them
      inScope: true
    - ID: Configured_API_endpoints
      type: java library
      title: APIs configuration
      description: web controller (MVC) configured at runtime connecting the API
        to the correct logic/implementation
      inScope: true
    - ID: TLS_LIBRARY
      type: java library
      title: TLS lib
      description: Javalin internal implementation; Jetty/Netty TLS default 
        library and its configuration
      inScope: true
    - ID: KAFKA_CREDENTIALS
      type: environment variable
      title: Kafka credentials
      description: credentials used to connect to Kafka
      inScope: false
    - ID: DF_StartupConf1
      type: DataFlow
      title: APIs config (java annotated classes)
      description: |
        Configuration of HTTP APIs endpoints by annotation in Java classes
      inScope: true
    - ID: DF_UsrMngAnyEndP
      title: User Manager APIs endpoints
      description: all HTTP calls to user manager APIs endpoints
      type: DataFlow
      inScope: true
    - ID: cred_db
      title: credentials stored in DB
      description: |
        Credentials stored in the CLUSTER_DB or the trusted SSO provider 
        (authorization server) according to [OAuth2 RFC roles](https://www.rfc-editor.org/rfc/rfc6749#section-1.1)
        for example Azure Active Directory credentials (RFI: what Azure credentials: API keys?) or SAML 

        (RFI: what SAML credentials?) 


        (RFI: how are they encrypted at rest? -> this will likely be part of another Threat model for workers configurations)
      type: credential
      inScope: false
      icon: img/corda5-HTTP-RPC-worker_SSO_CREDENTIALS.svg
    - ID: SSO_cred
      title: SSO config credentials
      description: |
        SSO credentials living inside the HTTP Gateway process. The credential is currently an API_ID 
        (long randon string) provided by Azure AD. It is retrieved at startup by ... 
        (RFI:configuration service name? K8s secret?)
      type: credential
      inScope: true

