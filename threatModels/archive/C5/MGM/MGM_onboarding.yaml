scope:
  description: >
    The process of on-boarding an MGM is also known as the process of creating  the
    membership group.  During MGM on-boarding you are defining the parameters which
    all members  must adhere to in order to participate in a group.
        [REF](https://r3-cev.atlassian.net/wiki/spaces/CB/pages/3934879814/Membership+Groups+High+Level+Overview)
    

    The scope of analysis of this Corda 5 Threat Model section considers the following
    use cases:

    - Data distribution
    - synchronisation
    - Membership suspension and activation



title: Mgm Onboarding
