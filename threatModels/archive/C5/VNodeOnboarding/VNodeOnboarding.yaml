scope:
  description: |
    The main reference is 
    https://github.com/corda/corda-runtime-os/wiki/Member-Onboarding-(Dynamic-Networks)
    (RFI: registration context have key IDS...why? what do they mean to the MGM?)

    Every Corda Application network has an optional PKI mode for managing the VNodes identity SESSION_KEYS ([REF](https://github.com/corda/corda-runtime-os/wiki/Session-Certificates)):
    the `corda.group.pki.session` option in the CPI's groupPolicy.js  can be `Standard` instead of `NoPKI`.
    With `Standard` `corda.group.pki.session` there will be a SESSION_KEY certificate check (PKI).
    With `NoPKI` there will be ot certificate creation and verification.

    **MGM manual approval**
    ref: https://github.com/corda/platform-eng-design/blob/master/core/corda-5/corda-5.0/the-host/manual-approval.md

    Manual approval is optional and determined by configured matching rules in the DB. 
    The default for no matching or configured rule is `automatic approval`

    TODO: how pre-auth token may be incompatible with the security scope definition of the `Ultimate` crypto operational mode as it 
    allows spoofing from the INFRASTRUCTURE_OPERATOR: signed PREAUTH_TOKEN may be an option (also against registration repudiation)



    **Re-registration**
    (RFI: what are the use cases for re-registration: upgrade CPI, renew SESSION_KEY ... ?)

    Possible registration status: `"NEW" "PENDING_MEMBER_VERIFICATION" "PENDING_APPROVAL_FLOW" "PENDING_MANUAL_APPROVAL" "PENDING_AUTO_APPROVAL" "DECLINED" "APPROVED"`
    onboarding_PREAUTHTOKEN_SEQ.svg
    **Pre Authorization Token Sequence**
    <img src="img/onboarding_PREAUTHTOKEN_SEQ.svg"><br/>
    <img src="diagrams/04_PRE_AUTH_TOKEN_REGISTRATION.svg"><br/>
