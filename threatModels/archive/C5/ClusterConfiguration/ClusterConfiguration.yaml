parent: C5
ID: ClusterConfiguration
schemaVersion: 2
title: Cluster Configuration

# gantt:
#   startDate: 2022-11-18
#   endDate: 2023-04-11
#   status: active

scope:
  description: |
    End-to-end process for creating or updating the configuration of a Corda cluster
     [REF:](https://github.com/corda/corda-runtime-os/wiki/Cluster-configuration)

       <img src="img/corda5-Configuration.svg"/>
       <img src="diagrams/07_StartupAndConfigurationMGMCluster.svg"/>

       <img src="img/corda5-Configuration2.png"/>

       (RFI: what configuration and how are passed for workers bootstrapping?)

  attackers:
  assumptions:
    - ID: SENSITIVE_CONF_VALUES
      description: |
        The configurations values are also secrets and credentials (Auth/SSO API keys, private TLS certificates, etc)

  assets:
    - ID: CONFIG_API
      inScope: true
      title: Configuration API endpoint
      type: data flow
      description: /api/v1/config RCP HTTP Gateway endpoint

    - ID: CONFIG_DB_TABLES
      inScope: true
      title: CLUSTER_DB table for config values and historical configuration
      type: table
      description: |
        The DB worker uses two tables in the cluster database to manage configuration, `config` and `configAudit`

analysis: |
  <img src="img/corda5-Configuration_analysis1.svg"/>

threats:

  - ID: INSECURE_DESERIALIZATION_CONF
    title: Insecure client parameters deserialization
    threatType: Elevation of Privileges
    assets:
      - REFID: CONFIG_API
    pentestTestable: true
    attack: |
      A malicious CLUSTER_OPERATOR or compromised accont can craft a special parameters that exploits Java deserialization vulnerabilities in 
       that results in arbitrary remote code execution. 
      The `/api/v1/config` endpoint's request format, on top of the usual JSON object deserialization of the request body format,
       performs a deserialization of a nested, JSON/HOCONF encoded in JSON data object. 
       This additional deserialization could be exploited if not implemented securely.
    impactedSecObj:
      - REFID: FULL_CIA
    public: true
    fullyMitigated: true
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H/E:U/RC:U
    countermeasures:
      - ID: CONF_SECURE_DESERIALIZATION
        title: Secure deserialization of nested objects
        description: |
          Restricted deserialization of nested parameters to object only to expected Java types,
           with allowlist and pre-validation of request data size
           (RFI: pls confirm deserialization mechanisms and countermeasure)
        inPlace: true
        public: true

  - ID: CONF_PROPAGATION
    title: Temporary misalignment during configuration propagation
    threatType: Non repudiation, Integrity, DoS
    attack: |
      Multiple workers/services will need to read the same configuration topic, during the time of this message consumption 
      different workers may behave in misaligned and unexpected ways.
    impactDesc: Integrity
    impactedSecObj:
      - REFID: INTEGRITY
    CVSS: #low
      vector: CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:N/I:L/A:L
    public: true
    fullyMitigated: false
    countermeasures:
      - ID: ATOMIC_CONF_PROPAGATION1
        title: Configuration activation atomicity
        description: |
          Atomically activate the configuration in all cluster workers
        inPlace: false
        public: true

  - ID: CONF_PROPAGATION_CONFIRMATION
    threatType: Non repudiation
    attack: |
      Unintended Configuration mismatch and unexpected workers behavior.
      The success response on the applied configuration may not reflect the fact that some or all WORKER_PROCESS have 
      already received the new configuration.
      This is due to the asynchronous nature of the Kafka messaging.
    CVSS: #low
      vector: CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:N/I:L/A:L
    impactDesc: Unexpected system behavior.
    impactedSecObj:
      - REFID: FULL_CIA
    public: true
    fullyMitigated: false
    title: Conf Propagation Confirmation
    countermeasures:
      - ID: DEC_CONF_PROPAGATION
        title: Better documentation
        description: |
          Describe in the documentation the fact that old configuration may persist for a period of time.
        inPlace: false
        public: true
      - ID: CONF_PROPAGATION_SYNC
        title: Implement synchronization
        description: |
          Wait for all workers to apply the new configuration prior to send the success response.
        inPlace: false
        public: true
      - ID: CONF_PROPAGATION_API
        title: Implement configuration effectiveness query API
        description: |
          Implement configuration effectiveness query API, for example be request ID (similar to registration status...)
        inPlace: false
        public: true


  - ID: CONF_DB_TO_KAFKA_SYNC
    title: Distributed Transactions failure in configurations runtime
    threatType: Denial of Service, Repudiation
    assets:
      - REFID: CLUSTER_DB
    attack: |
      An exception occurring after the update configuration table in the database can fail the Kafka 
      configuration topic message. In this case the value in the database will not reflect the effective configuration of the workers.
    impactDesc: Loss of Integrity and Availability of the Corda cluster. 
      Configurations in the Corda Cluster DB and in workers are misaligned.
    impactedSecObj:
      - REFID: FULL_CIA
    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:H/UI:N/S:U/C:H/I:H/A:H
    public: true
    fullyMitigated: true
    countermeasures:
      - ID: CONF_RECONCILIATION
        title: Reconciliation feature
        description: |
          The DB_WORKER reconcile the Kafka state and the CONFIG_DB_TABLES states periodically 
          (e.g. every 30 seconds by default and is configurable)
        inPlace: true
        public: true

  - ID: SENSITIVE_CONFIGURATION_DATA_DISC
    title: Disclosure of credential and secret used in configurations values
    threatType: Information disclosure, Elevation of Privileges
    assets:
      - REFID: CLUSTER_DB
    attack: |
      Any attacker that can read database data will be able to escalate attacks to the cluster and/or Network.
      Sensitive data and credential as configurations are expected by design e.g.
       API keys are still used as part of the configuration parameters.
      Those values are not always protected with the proper encryption at rest in the DB. 
    impactDesc: Leaked confidential configuration data.
    impactedSecObj:
      - REFID: FULL_CIA
    public: true
    fullyMitigated: true
    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H
    countermeasures:
      - ID: CON_ENCRYPTION_REST
        title: Encryption at rest of configuration data
        description: |
          Encryption at rest of configuration database.
          Corda 5 OS provides one, the default, implementation of this service in the form of a
           service that uses symmetric encryption so that the value can be stored encrypted at rest and decrypted with a
            key derived from a configured salt and passphrase (passed in as start-up parameters: 
            -s salt=<salt> -s passphrase=<passphrase>) when needed.
          [REF](https://r3-cev.atlassian.net/wiki/spaces/CB/pages/4295163929/Corda+Configuration#Secrets)
        inPlace: true
        public: true
        operational: false
      - ID: OPTIONAL_CONF_ENCRYPTION_VERIFICATION
        title: Cluster prevents non-encryption of sensitive configurations
        description: |
          Encryption by default and allow-list (better) or deny-list validation for non-encrypted configurations
        inPlace: false
        public: true
      - ID: NO_SENSITIVE_CONF_DATA
        title: Expected configuration values are not sensitive
        description: |
          No expected configuration value is sensitive/secret/credential. This would include private Keys, TLS, etc.
          (RFI: pls confirm non secret configuration data)
           Also the documentation explains what is expected as a configuration value and advise what sensitivity of data
           is expected.
          There are also viable ways to manage expected secrets (e.g. INFRASTRUCTURE_OPERATOR configuration non via HTTP REST APIs)
           so that users are not induced to use the configuration API with unexpected sensitive data. 
        inPlace: false
        public: true

#TODO step down security: java security manager rules for sandboxes

  - ID: NON_AUDITABLE_CONF
    title: Configuration history is not auditable
    threatType: Repudiation
    assets:
      - REFID: CONFIG_DB_TABLES
    pentestTestable: true
    attack: |
      An attacker with CLUSTER_OPERATOR credentials (legit or spoofed) could change configuration to execute an attack and then 
      restore them hiding traces. Also, since audit are not auditable, an legit user can claim that some configuration had 
      changes while this is not happened.
      It is not possible to demonstrate audit and to have forensic evidence of the history of the configuration.
    impactDesc: Compliance breach and repudiation of configuration
    impactedSecObj:
      - REFID: COMPLIANCE
      - REFID: NON_REPUDIATION
    public: true
    fullyMitigated: true
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:L/A:L
    countermeasures:
      - ID: AUDITABLE_CONF
        title: Auditable configuration history
        description: |
          The config table contains a version column, which the database automatically increments for each successful update.
          `configAudit` CLUSTER_DV table contains previous configurations values.
        inPlace: true
        public: true

