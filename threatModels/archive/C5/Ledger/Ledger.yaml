scope:
  description: |
    The scope of analysis of this Corda 5 Threat Model section is composed of:

    - States
    - Transactions
    - Smart contracts
    - The Vault

    <strong>Transaction backchains</strong><br/>
      <img src="img/tx-chain.png" width="50%">

    <strong>Transaction components</strong><br/>
      <img src="img/full-tx.png" width="50%">

    <strong>Full Merkle Tree Notary</strong><br/> 
      The Merkle tree diagram is for demonstration and does not reflect the current Corda 5 implementation. 
      It should be noted that inputs in a transaction are given by input state references (StateRefs), which consists of 
      the hash of the transaction that created that input and that input's index. The input state object itself is not part of the transaction.
      The diagram also does not show reference states https://r3-cev.atlassian.net/wiki/spaces/CB/pages/4304077197/States#Reference-states , 
      which is also a component of the transaction.       
      <img src="img/merkleTreeFull.png"/>

    <strong>SubMerkle Tree Notary</strong><br/>
     The following diagram shows transaction fields that are disclosed to a standard non-validating notary. This is known as transaction tear-offs, 
     and is used to hide components of the transaction for privacy purposes. Transaction fields and data disclosed to a standard non-validating notary are:

       - Transaction hash (root of the Merkle Tree)
       - Input state references
       - Notary, which is used to identify the notary
       - Time window bounds, which is used to specify the time range to validate the transaction
       - Number of output states (not shown in the diagram)
       - Reference states (not shown in the diagram) 
      <img src="img/SubMerkleTree_Notary.png"/>




