analysis: |
  **CPI packaging nested structure**
  <img src="img/corda5-Packaging CPI_analysis1.svg" width="90%"/>

  **Annotated High level abstraction of a production (non test) CordApp lifecycle development and deployment**

  <img src="img/corda5-Packaging CPI_analysis2.png" width="90%"/>

  Based on the analysis of the scope two main wide areas of secure design concern emerged, 
  every are can be expanded in several design threats. Mainly S.T.R.I.D.E. 
  security taxonomy is applied to the scope to identify potential threats:

  **1. Implications of untrusted (previous) packages provider**

  Within the context of nested signed packages there is an implied chain of trust where signer the outer package has implicitly trusted the contained packages.
  It resembles more a reversed graph structure in the final party verifies all the Nodes. Even if verifying (and re-verifying, following the supply chain of CPK-CPBs etc)
  may seem to apply the *defense in depth* principle, and in some sort it is, it creates a whole category of potential threats:
    
    * **Signature pollution** (repudiation, tampering, spoofing, elevation of privileges), having to trust several parties there are trust overlaps, 
    this can threat the origin of CordApp artifacts and associated properties. Also the non standard nested verification process is prone to design and implementation security bugs and vulnerabilities.
    * **Unclear accountability** (repudiation, Denial of Service): a failed verification of a nested artifact is difficult to attribute 
    to one party. For example does a tampered 
    CPK resulting in signature verification failure is the responsibility of the CPK author or the Application Publisher or the Network
     Operator? 
    a failed verification is difficult to attribute to one party. Few example: Is the packager using a outdated signature? who is responsible for fails in nested verification over time? 
      The Final CPI provider? the library developer?

  Here are two extracts from the sequence diagram annotated with relations of trust (pink arrows):

  **Trusting and verifying all package provider provider in the supply chain (current design):**
  <img src="img/CPI_trust_all.png"/>

  **Trusting and verifying only the last package provider provider in the supply chain (alternative design):**
  <img src="img/CPI_trust_last_provider.png"/>


  **2. CPI Zip file format malleability**

    Every signature verification, by design, is a *jar-signer* like verification. 
    This is a non standard (other than used in some Java ecosystem supply chain) 
    schema for artifact verification as opposed to code signature schemas and PGP.
    The jar-signer schema suffers from a variety of teh issues of the previous 'Untrusted provider' category and also from the fact that the verified material is sparse inside an zIP archive 
    that is not itself verified. The categories of threat that emerges from this design are all the threats of the ZIP file category (zip bombs, Denial of Services, path traversal, ZIP client vulnerabilities exploits)


threats:

  - ID: ZIP_MALLEABILITY
    threatType: Tampering, Elevation of Privileges
    title: Wrong CPI validation design and implementation
    assets:
      - REFID: DF_CPI_UPLOAD
    impactDesc: Remote code upload vector
    impactedSecObj:
      - REFID: FULL_CIA
    pentestTestable: true
    attack: |
      An attacker can tamper the CPI and still have it validated by the NEtwork participants. This is due to the Jarsigner non-strict validation default logic.
      The signature inside the CPI does not cover the containing ZIP/CPI itself (chicken-egg problem). 
      It is possible for an attacker to repackage a ZIP file, for example adding files while the signatures are still valid
      [REF](https://www.crowdstrike.com/blog/how-to-prevent-zip-file-exploitation/)

       > From Oracle jarsigner doc:

       >   *JAR File Verification
          A successful JAR file verification occurs when the signatures are valid, and none of 
          the files __that were in the JAR__ file when the signatures were generated have changed since then.*
          [REF](https://docs.oracle.com/javase/7/docs/technotes/tools/windows/jarsigner.html)
          
      Attacks like [Zip Bomb](https://en.wikipedia.org/wiki/Zip_bomb) or [Zip Slip](https://security.snyk.io/research/zip-slip-vulnerability)
      are also possible.

    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:H/UI:N/S:U/C:H/I:H/A:H/E:U/RL:U/RC:R
    public: true
    fullyMitigated: true
    countermeasures:
      - ID: SIGNATURE_EXTERNAL_TO_FILE
        title: Signature external to the CPI zip package
        description: |
          Create a signature external to the CPI zip package, ensuring the integrity on the overall CPI(ZIP) file, for example, using PGP signatures.
        public: false
        inPlace: false

      - ID: JARSIGNER_IMPL
        title: Jarsigner logic re-implementation
        description: |
          Re-Implement a `jarsigner` logic in the Corda cluster.
          This implementation will be stricter than the `jarsigner` tool. 
          By default it doesn't not allow unsigned files (same as  `-strict` option in `jarsigner`).
        public: true
        inPlace: true

      - ID: PRE_CPI_INSTALL_CHECK
        title: Check the CPI safety prior uploading it to the cluster
        description: |
          Before uploading the CPI the CLUSTER_OPERATOR checks for:

            - Normal unzipped file size, to prevent [Zip Bomb](https://en.wikipedia.org/wiki/Zip_bomb)
            - Valid code signatures (`jarsigner` like tool)
            - Absence of dangerous [Zip Slip](https://security.snyk.io/research/zip-slip-vulnerability) files that should not belong to the CPIs.

        public: true
        inPlace: true
        operational: true
        operator: CLUSTER_OPERATOR

  - ID: ROLE_NAME_COLLISION
    title: Role name collision in CPI metadata
    attackers:
      - REFID: CORDAPP_PUBLISHER
    threatType: Tampering, Elevation of Privileges
    impactedSecObj:
      - REFID: FULL_CIA
    attack: |
      An Application Publisher can upload a CPI containing application roles that collide 
      with platform roles gaining unintended privileges.
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H/E:U/RL:U/RC:R
    fullyMitigated: true

    countermeasures:
      - ID: CPI_ROLE_DEF_VALIDATION
        title: Validate CPI role names
        description: |
          Check that the application role names must not collide with the platform role names. 
          This check is performed by (RFI: are CPI roles even implemented or in the design anymore?)
        inPlace: true
        public: true
  - ID: GRADLE_DEFAULT_CPI_CRED
    title: CPI Tampering via Development CPI signing credentials accepted in 
      production
    threatType: Elevation of privileges
    attack: An attacker can produce a fake and still trusted CPI signature using
      DEV gradle trusted private key
    # impact: Forging signature and attacks on the Clusters with malicious code
    pentestTestable: true
    impactedSecObj:
      - REFID: FULL_CIA
    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:H/I:H/A:L
    fullyMitigated: true
    countermeasures:
      - ID: DENY_DEV_CRED_IN_PROD
        title: Deny DEV signature by default
        description: validation against denyList of public gradle credential in 
          production
        inPlace: false
        public: true
      - ID: DO_NOT_RELEASE_REV_KEYS
        title: Do not release with DEV trusted keys
        description: Delete the gradle default verification key at all. This is 
          performed by a specific at release time
        inPlace: false
        public: true
      - ID: MANUALLY_REVOKE_DEV_KEYS
        title: Manually remove trusted development key
        description: |
          Manually remove DEV gradle trusted CPI signing key from trusted
          configuration used for developing and testing purposes. This can be done via API (RFI: @Bassem could you pls add an API call example?)
        inPlace: true
        public: true
        operational: true
        operator: CLUSTER_OPERATOR

