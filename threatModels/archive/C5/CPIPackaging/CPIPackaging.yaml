  - ID: CPI_SIGNER_SET
    title: CPB re-signing by different trusted CORDAPP_PUBLISHER
    threatType: Elevation of Privileges
    assets:
      - REFID: DF_CPI_UPLOAD
    attackers:
      - REFID: CORDAPP_PUBLISHER
    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:H/UI:N/S:U/C:H/I:H/A:L/E:U/RL:U/RC:R
    attack: |
      A malicious CORDAPP_PUBLISHER tampers a CPB from another CORDAPP_PUBLISHER: 
      it stripes out all signatures and re-sign CPKs/CPBs with a
       key that is also trusted but different from the original one of the original CPK.
    pentestTestable: true
    impactDesc: Execution of malicious flow and contract code from CPI, 
      ultimately able to disclose sensitive data and forge signatures.
    impactedSecObj:
      - REFID: FULL_CIA
    fullyMitigated: false
    countermeasures:
      - ID: CPI_SAME_SIGNATURE_SET
        title: Enforce same signer per package on upgrades
        description: |
          When attempting upload CPI there is a validation on the signatures:
            - same set of signer across the all CPB files
        inPlace: false
        public: true
      - ID: CPI_PER_DOMAIN_SIGNER
        title: Trusted CPI signing keys per domain
        description: |
          Trusted CPI signing keys are associated with classes domain/packages.
          [REF OSGi signer](https://docs.osgi.org/specification/osgi.core/7.0.0/framework.security.html#framework.security.filterbasedpermissions)
           (RFI: is it the case in CPI verification?)
        inPlace: false
        public: true
      - ID: ONLY_TRUST_MGM
        title: Verify only MGM's outer CPI signature
        description: |
          Only verify outer CPI signature form the MGM. This would have several effects and needs to be vastly analyzed, some effects are:
           - Clearly delegates the role of due diligence (trusted source of CordApps/CPIs to the MGM)
           - Reduces the need to multiple roots of trusts (every root of trust added is an additional 
             potential point of failure in the whole supply chain, that is not controlled by the cluster). 
             In this sense contributing toward `Full multi-tenancy` operational mode security model and compliance.
           - Effectively reduces the implementation complexity and potential for bugs in verification logic
           - Reduces the operational cost of maintaining up to date set of trusted root certificates on the cluster
        inPlace: false
        public: true
