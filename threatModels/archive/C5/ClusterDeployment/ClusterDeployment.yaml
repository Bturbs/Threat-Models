scope:
  description: |
    Corda 5 uses Kubernetes as the target deployment platform. Corda is unopinionated (out of scope of this analysis) about the way in which Kubernetes is
     configured and the details of how to deploy and administer Kubernetes securely are beyond the scope of this document.
    Corda runs within a single Kubernetes namespace without any cluster-level permissions. Helm is used as the deployment mechanism. 
    This scope only considers the cluster database (VNode databases are created via API at VNode deployment time)
    Required inputs to the deployment process are the PostgreSQL host/port and a username/password. These credentials may be passed directly 
    as Helm overrides, or via a Kubernetes secret.
    Intercommunication between Corda components is performed via Kafka. Again, Corda attempts to be unopinionated (out of scope of this analysis) about the means by 
    which Kafka is provided. The list of Kafka bootstrap servers is a required input to the deployment process. 
    TLS can be used for the connection to Kafka and, if necessary, a trust store specified via a Kubernetes secret. 
    Corda supports the use of SASL SCRAM for authentication. Username/password pairs can be specified for each Corda worker and, if required, for automatic bootstrapping.
     Authentication via mutual TLS is not currently supported. 

    **Kubernetes runtime**

     <img src="img/kubernetes_diagram1.png"/>

    **Bootstrapping** 

    Initial configuration of the DB, Kafka, and Corda, needs to be performed as part of installing Corda. 
    This step is referred to as bootstrapping. Bootstrapping can be performed automatically as part of the Helm install or manually by an administrator.
    Automatic bootstrapping should be considered production-ready (in scope of this analysis) but involves giving elevated permissions to the Corda deployment process.
    Customers may therefore choose to perform bootstrapping manually to reduce their exposure, or because their processes require manual intervention.

    **Kafka bootstrapping**

    Kafka bootstrapping is performed prior to Corda workers startup and creates the topics needed for intercommunication between the components. 
    Given a set of users, the bootstrapping also sets up the required read and write permissions for each topic via Kafka ACLs. 
    If performed automatically, the Kafka bootstrap uses a direct connection to the Kafka API to perform the setup. 
    When done manually via the Corda CLI there is also the option to generate a script that utilises the kafka-topics and kafka-acls
     scripts provided as part of a Kafka install. 
    This script can then be reviewed before execution. 

    **Cluster Database bootstrapping**

    Bootstrapping of the database is also performed prior to Corda startup. 
    Inputs to the process are the host/port for the PostgreSQL instance and the database name to be used for the cluster, RBAC, and crypto schema.
    The database bootstrapping consists of several steps: 

    1. Creating the DB schema for the cluster, RBAC, and crypto 

    2. Creating the DB users (RFI: what DB users? pls list) for RBAC and crypto and granting them access to the corresponding schema 

    3. Populating the details for the RBAC and crypto databases into the cluster database 

    4. Inserting the initial admin (TODO: rename initial admin to cluster operator) user credentials into the RBAC database 

    5. Inserting initial configuration into the crypto database (RFI: what data into 'initial configuration' for crypto database? )

    When performed automatically as part of the Helm install (TODO: define if this is for dev or production),
     the Corda CLI is used to generate the required DDL/DML and then psql is used to
     apply it to the cluster database using the provided credentials. (CORE-9318 exists to support the separation of the credentials used for
      bootstrapping from those that Corda uses as runtime for minimum permissions)
       When automatic bootstrapping is disabled (TODO define if this is prod version), 
       an administrator can review the generated DDL/DML prior to applying it to the database. 

    For automatic bootstrapping, the credentials to use for the RBAC and crypto database users can be specified via a Kubernetes secret or generated as part of
     the deployment. Similarly, the Corda REST API credentials created for the initial admin user may be specified via secret or generated as 
     part of the deployment. Note that these credentials continue to exist in Kubernetes secrets post-install but are not used by the runtime
      and are not kept in-sync with any changes made subsequently via the REST API. 

    Once the Corda workers have started (see next section), an optional last step is performed to configure the default roles for Corda RBAC via 
    calls to the Corda REST API. For automatic bootstrapping, the initial admin user credentials are used to perform this action. 
    The initial self-signed TLS certficate for the REST API is hard-coded in the REST worker.


    **Cluster Runtime**
    Runtime 

    After Kafka and the database have been initialised, the Corda workers are started. 
    There are seven types of Corda worker, and each run as a stateless Kubernetes deployment with one or more replicas configured according to the requirements 
    for availability and scalability.
    The worker containers run as non-root users and are not permitted to escalate their privileges (TODO: describe it as mitigation). 
    All the workers are provided bootstrap servers for Kafka and, if supplied, the Kafka credentials and trust store to use. 
    The workers are also provided with the salt/passphrase to decrypt secrets stored in Corda configuration.
    The DB and crypto workers are provided with the endpoint and credentials for accessing the cluster database.

    **RPC REST API worker access**

    The REST worker defines a Kubernetes service for the REST API that can be exposed outside of a cluster via a node port or 
    load balancer as is standard practice with Kubernetes.

    The Helm chart supports the provision of annotations on the load balancer configuration to provide additional direction to the cloud platform. 
    This can, for example, be used to determine whether a network load balancer terminates TLS, 
    or whether the connection is passed through and terminates at the REST worker.

    **Logs**

    As is typical in Kubernetes deployments, logs are routed to stdout/err by default.
    Subsequent collection and aggregation of logs is down to the configuration of the Kubernetes cluster.


