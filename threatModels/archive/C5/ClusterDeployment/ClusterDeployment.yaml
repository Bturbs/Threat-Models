  assets:

    - ID: DF_RELEASE_CERT_ACQUISITION
      type: dataflow
      title: |
        Certificate acquisition for Corda releases
      description: Acquisition and configuration of the trusted certificates for
        binary Corda Release verification
      inScope: false


    - ID: RELEASE_CERT
      type: certificate
      title: |
        Certificate for Corda releases
      description: trusted certificates for binary Corda Release verification
      inScope: false
      properties:
        location: TBD/out of band/location not in scope,  used by 
          INFRASTRUCTURE_OPERATOR
        format: X.509
        length: 256
      applicationRelated: false
      infrastructureRelated: true

    - ID: ISTIO_CLUSTER_ROT
      appliesToVersions: ">=5.2"
      type: certificate
      title: |
        Certificate (and key) for Istio to act as an CA for creating mTLS with its
         reverse proxies in injected K8s PODs sidecars
      description: trusted certificates and keys for ISTIO mTLS Cert Authority
      inScope: false
      properties:
        location: TBD/out of band/location not in scope, used by 
          INFRASTRUCTURE_OPERATOR
        format: X.509/PEM
        length: 256
      applicationRelated: false
      infrastructureRelated: true

    - ID: ISTIO_PROXY_CERT
      type: certificate
      appliesToVersions: ">=5.2"
      title: |
        Certificates (and key) for any Istio PROXY injected K8s PODs as sidecars
      description: trusted certificates and keys for ISTIO mTLS proxies
      inScope: true
      properties:
        location: worker, K8s PODs
        format: X.509/PEM
        length: 256
      applicationRelated: false
      infrastructureRelated: true

    - ID: DF_CORDA_RELEASE_ACQUISITION
      type: dataflow
      title: |
        Corda release acquisition
      description: Acquisition/downloading of the signed Corda Cluster release 
        binary
      inScope: false

    - ID: CODE_SIGN_VERIFICATION
      type: process
      title: |
        Corda release code signature verification 
      description: Verification of the downloaded Corda software for 
        authenticity (code signing check)
      inScope: false

    - ID: INSTALL_SECRETS_CREATION
      type: credential
      title: |
        Installation credentials creation
      description: |
        Creation of the installation credentials with enough entropy (RFI: pls list secrets pd password etc..)
      inScope: false
      properties:
        location: Kubernetes etcd/HELM chart and/or other vault
        format: passphrase and salt (TBC) used for key derivation and CLUSTER_DB
          secret encryption
      applicationRelated: true
      # infrastructureRelated: false

    - ID: KAFKA_CLIENT_CRED
      type: credential
      title: |
        Client Kafka credentials for a specific worker
      description: |
        Kafka credentials (username and password)
        Kafka client credentials are created at deployment time and stored by default in Kubernetes ETCD as secret configuration.
        This value is passed to worker pods memory at runtime.
      inScope: true
      properties:
        location: Kubernetes etcd/HELM chart and/or other vault
        format: unencrypted string
        length: high entropy string
      applicationRelated: false
      infrastructureRelated: true

    - ID: CLUSTER_DB_CRED
      type: credential
      title: |
        Cluster DB credentials
      description: |
        Cluster DB credentials
      inScope: true
      properties:
        location: Kubernetes etcd/HELM chart and/or other vault
        format: unencrypted string
        length: high entropy string
      applicationRelated: false
      infrastructureRelated: true

    - ID: SALT_PASSPHRASE_KEY_DERIV
      type: credential
      title: |
        Sensitive config SALT and PASSPHRASE.
      description: |
        SALT and PASSPHRASE to derive a symmetric AES key to decrypt sensitive values encrypted at rest (e.g. Database or Kafka)
      inScope: true
      properties:
        location: Kubernetes etcd/HELM chart and/or other vault
        format: unencrypted string
        length: high entropy strings
      applicationRelated: true
      infrastructureRelated: false

    - ID: DB_SECRET_DECRYPTION_KEY
      type: key
      title: |
        Sensitive config key
      description: |
        Symmetric encryption key derived from [#SALT_PASSPHRASE_KEY_DERIV] to decrypt sensitive values encrypted at rest (e.g. Database or Kafka)
      inScope: true
      properties:
        location: In memory
        format: AES
        length: 256
        type: Symmetric data encryption key
      applicationRelated: true
      infrastructureRelated: false



    - ID: KAFKA_TRUSTSTORE
      type: certificate
      title: |
        Kafka truststore
      description: |
        Kafka truststore for server authentication (TLS)      
      inScope: true
      properties:
        location: Kubernetes ETCD
        format: jks
      applicationRelated: false
      infrastructureRelated: true

    - ID: DF_K8S_SECRET_CONFIG
      type: credential
      title: |
        Kubernetes secrets creation via API
      description: |
        The Infrastructure operator creates the secrets in the Kubernetes (etcd) to be used by the installation scripts (helm charts).
        This is executed optionally when Helm charts overrides are not used in alternative.
      inScope: true

    - ID: SECRETS_IN_HELM_CHART
      type: credential
      title: |
        Kubernetes secrets configured in Helm charts
      description: |
        Secrets are configured (overrides) inside helm charts; using this as an alternate option to DF_K8S_SECRET_CONFIG.
      inScope: true

    - ID: DF_APPLY_HELM_CHARTS
      type: credential
      title: |
        HELM chart execution
      description: |
        Corda cluster installation HELM chart execution targeting a Kubernetes environment
      inScope: true

    - ID: DF_IN_HELMC_SECRETS_CREATION
      type: credential creation
      title: |
        HELM credential creation
      description: |
        Credential creation during the Heml chart execution (RFI: pls confirm this exist...)
      inScope: true

    - ID: CLUSTER_OP_CRED
      type: credential
      title: |
        CLUSTER_OPERATOR (a.k.a. Admin) user credentials
      description: Cluster operator user credentials
      inScope: true
      properties:
        location: CLUSTER_DB
        format: secure salted/hashed password
        length: 256
      applicationRelated: true
      infrastructureRelated: false

    - ID: DF_BOOTSTRAP_PODS_CREATION
      type: dataflow/process
      title: |
        Creation of Bootstrap processes
      description: Creation of Bootstrap processes as part of the Corda 
        installation
      inScope: true

    - ID: DF_BOOTSTRAP_TO_KAFKA
      type: dataflow/process
      title: |
        Bootstrap processes targeting Kafka
      description: |
        Bootstrap processes targeting Kafka: 

          - creates the topics needed for intercommunication between the components. 
          - Given a set of users, the bootstrapping also sets up the required read and write permissions for each topic via Kafka ACLs.

        These operations require more privileges (admin like) credentials for accessing and configuring Kafka.
      inScope: true

    - ID: DF_BOOTSTRAP_TO_DB
      type: dataflow/process
      title: |
        Bootstrap processes targeting the Cluster DB
      description: |
        Bootstrap processes targeting the Cluster DB:
        The database bootstrapping consists of several steps: 

          1. Creating the DB schema for the cluster, RBAC, and crypto 
          2. Creating the DB users for RBAC and crypto (names default to `rbac_user` and `crypto_user` but can be overridden by configuration (RFI: what are: rbac_user and crypto_user used for?)) and granting them access to the corresponding schema 
          3. Populating the details for the RBAC and crypto databases into the cluster database 
          4. Inserting the initial admin (Cluster Operator) user credentials into the RBAC database 
          5. Inserting initial configuration into the crypto database (salt and passphrase for config encryption, salt and passphrase for SOFT HSM root wrapping key, plus other default configuration for database and Kafka connectivity, and the SOFT HSM)
      inScope: true

    - ID: DF_WORKER_PODS_CREATION
      type: dataflow/process
      title: |
        Worker pods creation
      description: |
        Creation of the worker pods and their networking definition (accessibility). 
        RPC API Gateway and P2P_GATEWAY are the workers that have connection outside of the Cluster.
      inScope: true

    - ID: DF_SETUP_CLUSTER_OP_USER
      type: dataflow
      title: |
        Setup of initial API Cluster Operator user 
      description: |
        Secure creation fo the initial API Cluster Operator user and provisioning communication to that specific person.
      inScope: true
    - ID: KAFKA_CREDENTIALS
      type: environment variable
      title: Kafka credentials
      description: credentials used to connect to Kafka
      inScope: true

    - ID: DF_KAFKA_WORKERS
      type: dataflow
      description: Any connection from WORKER_PROCESS to KAFKA (a.k.a. DF_KAFKA1
        in diagrams)
      inScope: true


  assumptions:

  attackers:


