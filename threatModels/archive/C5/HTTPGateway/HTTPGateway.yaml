threats:


  - ID: VNodeAPICallsRepudiation
    assets:
      - REFID: DF_VNodeAnyEndP
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:N/I:L/A:L
    threatType: Repudiation
    impactedSecObj:
      - REFID: NON_REPUDIATION
    conditional: |
      non `Single tenant` Cluster operational modes
    attack: |
      In the case of ``Multiple tenants with trusted CPIs`` and ``Full multi-tenancy`` operation model of the Cluster
      One or more of the following could happen:

        - A VNODE_OPERATOR claims not executing the request while executing it
        - A VNODE_OPERATOR claims executing the request while not executing it
        - A CLUSTER_OPERATOR claims not receiving the request while receiving it
        - A CLUSTER_OPERATOR claims receiving a request while not receiving it

      This is likely not a problen for ``Single tenant`` Cluster operation mode.
    public: true
    fullyMitigated: false
    title: Vnodeapicallsrepudiation
    countermeasures:
      - ID: API_SGNATURES
        title: Signed API request and responses
        description: |
          Both parties in the DataFlow, the VNODE_OPERATOR and the HTTP_GATEWAY (or in general the Cluster) sign the request/hash with a trusted 
          key (e.g. identity key for VNODE_OPERATOR). 
          Both actors can collect those signatures as self living evidence: proof of request (collected by the Cluster) and proof of response (receipt).
        inPlace: false
        operational: false
        public: true
      - ID: AUDITABLE_API_CALLS
        title: Auditable API calls
        description: |
          Every API call is logged and auditable including changes in critical configurations, 
          this is also the case when the call is performed by CLUSTER_OPERATOR or VNODE_OPERATOR.
          Logs are auditable, persistant and not tamperable (e.g. signed and timestamped)
        operational: true
        operator: INFRASTRUCTURE_OPERATOR
        inPlace: false
        public: true

