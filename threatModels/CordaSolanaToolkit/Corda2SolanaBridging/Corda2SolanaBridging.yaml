  - ID: SENDER_ATA_REPUDIATION
    title: Sender repudiates the intended Solana ATA
    attack: |
      In DFC2S_TRANSFER_STATE, the transfer and bridge token transaction does not include the sender's
      Solana associated token account (ATA). Instead, the Bridge Authority (BA) uses a static ATA from
      node configuration to mint/transfer the Solana reference asset. A sender can later repudiate that
      this was the intended destination and claim they requested a different ATA, creating a dispute
      over the beneficiary address.
    threatType: Repudiation
    impactDesc: |
      Disputes over the intended Solana destination can lead to loss claims, operational escalation,
      and regulatory/compliance exposure. The bridge lacks cryptographic proof tying the sender's intent
      to a specific ATA.
    impactedSecObj:
      - REFID: AUDITABILITY
      - REFID: REGULATORY_COMPLIANCE
    attackers:
      - REFID: BRIDGING_PARTY
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:L/A:N
    fullyMitigated: true
    countermeasures:
      - ID: INCLUDE_ATA_IN_TX_METADATA
        title: Include ATA in bridging transaction metadata
        description: |
          Extend the bridging CorDapp to embed the destination ATA in the Corda transaction metadata
          or state, signed by the initiator. This provides durable cryptographic proof of the sender's
          intent for the specific Solana address.
        operational: true
        operator: Cordapp Developer
        inPlace: false
        public: true
      - ID: ATA_DISCLOSURE_FLOW
        title: Additional flow to submit ATA to BA
        description: |
          Add a dedicated Corda flow/transaction where the initiator submits the ATA to the Bridge
          Authority and signs it. The BA must reference this signed submission when minting on Solana.
        operational: true
        inPlace: false
        operator: Cordapp Developer
        public: true

