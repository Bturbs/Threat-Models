  - ID: SPOOFING_MBC_MB
    title: Spoofing MBridge Connector or MBridge over their connection
    assets:
      - REFID: DF1_MBRIDGECON_MB
    attackers:
      - REFID: ANONYMOUS

    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:L/A:L
    threatType: Spoofing, tampering
    attack: |
      An attacker is able to spoof the MBridge or MBridge Connector and send messages
    impactDesc: Attackers can send redemption requests, responses and 
      acknowledgments for the MBC or the MB to consume
    impactedSecObj:
      - REFID: FULL_CIA

    public: true
    fullyMitigated: true
    countermeasures:

      - ID: TLS_CONNECTION_MB_MBC
        title: TLS Connection between the MBridge connector and the  MBridge
        description: |
          This connection uses TLS to ensure authentication, integrity and confidentiality.

        operational: false
        inPlace: true
        public: true

      - ID: SIGNATURE_VERIFICATION_MECHANSIM
        title: Signature verification mechanism
        description: |
          The message integrity is handled by a signature verification mechanism. 
           The signature is calculated by the sender by creating a hash of the entire XML body of the 
           message and then signing this hash with the sender private key. The signed hash is set in the
            HTTP request header. 
           The receiver extracts  and verifies the signature 
           using the corresponding public key stored in its keystore.
           There are two types of digital signaures deployed; Message layer Signature and Core element signature.
           The latter is used for certain important smart contract fields.

        operational: false
        inPlace: true
        public: true



  - ID: REPUDIATION_MBC_MB_DF
    title: Repudiation by the participants on the MB and MBC dataflow
    assets:
      - REFID: DF1_MBRIDGECON_MB

    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:L/A:N
    threatType: Repudiation
    attack: |
      Participants on the dataflow between the MBridge and MBridge Connector repudiate their messages.
    impactDesc: Attackers can repudiate sending messages
    impactedSecObj:
      - REFID: ZERO_TRUST
      - REFID: DEFENSE_IN_DEPTH
      - REFID: MINIMAL_RISK_SURFACE

    public: true
    fullyMitigated: true
    countermeasures:
      - ID: SIGNATURE_VERIFICATION_MECHANSIM
        title: Signature verification mechanism
        operational: false
        inPlace: true
        public: true
        description: SIGNATURE_VERIFICATION_MECHANSIM
  - ID: SNIFFING_MBC_MB_DF
    title: Sniffing dataflow between the MBridge Connector and the MBridge
    assets:
      - REFID: DF1_MBRIDGECON_MB
    attackers:
      - REFID: ANONYMOUS

    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:N/A:N
    threatType: Information disclosure
    attack: |
      An attacker is able to read the communication between the MBridge connector and MBridge
    impactDesc: Attackers can view issuance requests, responses and 
      acknowledgments between the MBC and the MB
    impactedSecObj:
      - REFID: CONFIDENTIALITY

    public: true
    fullyMitigated: true
    countermeasures:
