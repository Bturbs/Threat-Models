parent: #Id of the parent TM, for example "cluster"
ID: #specific ID, for example "HTTPGateway", must be unique
prefix:  #deprecated, use "ID" instead 

#Note: all the data fields are considered Markdown (this includes <iframe> and other HTML tags), see below
#Note: Most data and fields are OPTIONAL, main data structures being: "parent", "ID", "scope"->"assets"->inScope, "threats" -> "countermeasures".
# Most elements rely on "ID" and "description" fields, see examples below
scope:
  diagram: # rerefence diagrams of the TM
   # <iframe src="https://r3-cev.atlassian.net/wiki/...">DOC</iframe>
  description:  #Description of the scope of analysis, foe example: ref. https://github.com/corda/platform-eng-design/blob/master/core/corda-5/...DOC.md
  
  assets: #Array of assets
    - ID: e # short ID value, for example "RPC_Management_Service"
      type: #type of the asset, it cna by any value, for example here are some conventions: library/data flow/secret data/confidential data
      description: #description of what is the asset and how it is used...
      inScope: #boolean value true/false indicating if it is in the scope of analysis, it loosely answer the question:
              # "it is something that we are building?", also asset can be out os scope because part of another TM, team etc
  attackers:
    - ID: #unique ID of the attacker TODO how to reference parent element included in scope
      description: #example: anonymous internet user
      
      in scope: #true/false
    # - ID: system operator
    #   description: delegate to install and maintain the corda5 cluster
    #   in scope: false

  assumptions:  #Array of assumptions
    - ID: 1
      description: #assumptions description, usually gathered during analysis and usually necessary 
                  # for making some information explicit. Example: "Kubernetes does not allow direct IP 
                  # communication between PODs in different namespaces", this info may integrate architecture and implementation
                  # refactoring checklists
  
threat analysis: # OPTIONAL analysis section of the TM, this is also considered markdown
  #  ### STRIDE

  #  #### HoldingID: 

  #     + **Spoofing**: yes (VNode1.HoldingID.1)
  #     + **Tampering**: no 
  #     + **Repudiation**: yes (same as spoofing), final user can claim another x500 actor had the same HoldingID
  #     + **Info disclosure**: no (TBC HoldingID is not a secret/sensitive data)
  #     + **DoS**: no
  #     + **ElevationOfPrivileges**: yes, due to Spoofing


threats:
  - ID: #identifier of the threat, can be a sequential, for example "1" or a more descriptive ID, will inherit the main TM id as prefix
    assets: #array of IDs of the asset involved
      - ID: #IDs of the assets involved in the Threat, for example "FlowXYZ"
    CVSS: #optional
      vector: #example: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H/MC:H/MI:H/MA:H
    threatType: #optional, example: Spoofing (caused by HoldingID collision)
    description: #description of the Threat, answer the question "what can go wrong?"
    public: #boolean true/false value controlling the visibility of the threat
    fullyMitigated: #boolean true/false value indicating that there's not residual risk
    countermeasures: #array of countermeasures mitigating the threat 
      - ID: #unique ID of the countermeasure
        description: #answer the question: what are we doing to prevent the parent threat? example:
          # Use a full SHA-256 hash (suggested) or at least a length than makes creating a collision identity un-economical for the attacker
        inPlace: # true/false value indicating if the mitigation is in implemented and operational etc...
        vulnManagementLink: #optional, useful link to Jira or other tracking system
        public: #optional, true/false value indicating if the issue can be disclosed

