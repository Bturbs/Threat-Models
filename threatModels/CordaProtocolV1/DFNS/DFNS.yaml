ID: DFNS
schemaVersion: 2
title: DFNS Wallet Infrastructure — Vault Management

authors: |
  Security Research team at R3

parent: CordaProtocolV1

scope:
  description: |
    Threat model for the DFNS MPC wallet integration used by vault management
    roles (Admin, Curator, Protocol Manager, Vault Guard) to sign on-chain
    transactions for the Corda Protocol V1.

    This model does **not** cover investor-facing signing flows; those are handled
    by the InvestorBFF child model. The scope is limited to privileged operational
    roles that control vault lifecycle, configuration, and settlement operations.

    **Deployment Configuration:**

    Full cloud deployment — DFNS manages all key shares in its cloud MPC network
    (no mixed or on-premises signers). Mixed and on-premises deployment models
    are out of scope for this baseline.

    **DFNS Role in the Protocol:**

    Privileged protocol roles (Curator, Vault Manager, Protocol Config Authority,
    etc.) hold their signing keys as DFNS wallets. When a vault operation requires
    a signature, the Admin UI or Curator BFF calls the DFNS API, which coordinates
    MPC signing across DFNS key share nodes. The resulting signature is then
    broadcast to the Solana RPC.

    **Authentication Model:**

    DFNS supports multiple authentication methods. For R3 operational staff, the
    assumed configuration is Microsoft SSO (Azure AD / Entra ID) federated to
    DFNS via OIDC, combined with DFNS-native WebAuthn (passkey / FIDO2) for
    high-privilege signing approvals.

    **DFNS Policy Engine:**

    DFNS enforces signing policies (approvals, spending limits, allowed
    destinations) configured per wallet. Policy changes themselves require
    authorised API calls and are subject to change-management controls.

    **Sequence Diagrams:**
    <img src="img/DFNS_CuratorSigning.svg" alt="DFNS Curator Runtime Signing Flow"/>

  securityObjectives:
    # - ID: DFNS_KEY_CUSTODY
    #   title: DFNS Key Share Custody Integrity
    #   description: |
    #     Ensure that DFNS MPC key shares used for privileged vault operations
    #     cannot be exfiltrated, misused, or reconstructed outside of the intended
    #     signing ceremony, and that all signing events are authorised.
    #   group: Data Security
    #   treeImage: false
    #   contributesTo:
    #     - REFID: CONFIDENTIALITY
    #     - REFID: SIGNING_TRANSACTION_INTEGRITY

  assets:
    - ID: DFNS_SERVICE_CREDENTIAL
      type: credential
      title: DFNS Service Account Credential
      description: |
        API key or service credential used by the Admin BFF / Curator BFF to
        authenticate to the DFNS API and initiate signing requests on behalf of
        privileged roles. Compromise allows an attacker to trigger MPC signing
        without user interaction.
      inScope: true
      properties:
        location: Stored in server-side secret manager (e.g., Azure Key Vault)
        format: DFNS API key + private key pair (Ed25519 or P-256)

    - ID: DFNS_USER_CREDENTIAL
      type: credential
      title: DFNS User Account Credential
      description: |
        WebAuthn / passkey credential registered by an Admin or Curator in DFNS.
        Used for interactive signing approvals and DFNS account authentication.
        Bound to a physical authenticator (FIDO2 security key or platform authenticator).
      inScope: true
      properties:
        location: User-held hardware security key or platform authenticator
        format: FIDO2 / WebAuthn credential (P-256)

    - ID: DFNS_WALLET_KEY
      type: credential
      title: DFNS MPC Wallet Signing Key
      description: |
        MPC key share set representing a privileged protocol role wallet
        (e.g., Curator, Vault Manager, Protocol Config Authority). Key shares
        are distributed across DFNS cloud nodes and never reconstructed in full.
        Signing requires DFNS API call + policy check + MPC ceremony.
      inScope: true
      properties:
        location: DFNS cloud MPC network (key shares only; full key never assembled)
        format: Ed25519 MPC key shares (Solana compatible)

    - ID: DFNS_API
      type: system
      title: DFNS Cloud API
      description: |
        External DFNS cloud service providing MPC wallet management, signing
        policy enforcement, and key share coordination. Managed entirely by DFNS.
      inScope: false

    - ID: MICROSOFT_SSO
      type: system
      title: Microsoft Azure AD / Entra ID (SSO Provider)
      description: |
        External identity provider used for federated authentication of R3
        operational staff into DFNS. Managed by R3 IT / Microsoft.
      inScope: false

    - ID: DF_BFF_TO_DFNS
      type: dataflow
      title: BFF → DFNS API (Signing Request)
      description: |
        HTTPS/REST dataflow from the Admin BFF or Curator BFF to the DFNS API
        to initiate a signing request for a vault operation transaction.
        Authenticated with the DFNS service account credential.
      inScope: true

    - ID: DF_USER_TO_DFNS
      type: dataflow
      title: Curator/Admin Browser → DFNS (WebAuthn Approval)
      description: |
        Browser-based WebAuthn interaction between the Admin/Curator and the
        DFNS API for interactive signing approval. Bound to the user's FIDO2
        authenticator.
      inScope: true

    - ID: DF_CURATOR_TO_SSO
      type: dataflow
      title: Curator/Admin → Microsoft SSO (OIDC Login)
      description: |
        OIDC/OAuth2 authentication flow from the Admin UI to Microsoft Azure AD,
        resulting in an OIDC token used to establish a DFNS session.
      inScope: true

    - ID: DF_DFNS_TO_SOLANA
      type: dataflow
      title: DFNS Signature → Solana RPC (Transaction Broadcast)
      description: |
        The final signed transaction (assembled in the BFF with the DFNS signature)
        is submitted to the Solana RPC for broadcast to mainnet.
      inScope: true

  assumptions:
    - ID: DFNS_CLOUD_TRUSTED
      description: |
        DFNS cloud infrastructure is assumed operationally trustworthy for key
        share storage and MPC signing ceremony execution. A full DFNS compromise
        (nation-state level) is considered out of scope for this baseline.

    - ID: FULL_CLOUD_DEPLOYMENT
      description: |
        All key shares reside in DFNS cloud nodes. Mixed or on-premises signer
        deployments are out of scope.

    - ID: MICROSOFT_IDP_BASELINE
      description: |
        Microsoft Azure AD is assumed to be correctly configured with MFA enforced
        for all R3 operational accounts.

  attackers:
    - ID: COMPROMISED_ADMIN_DEVICE
      description: |
        An Admin or Curator whose workstation or browser session has been
        compromised via malware, phishing, or supply-chain attack, giving an
        attacker control over the authenticated session and any locally stored
        credentials.
      inScope: true

    - ID: DFNS_INSIDER
      description: |
        A DFNS employee or contractor with privileged access to DFNS cloud
        infrastructure, potentially able to influence key share operations,
        signing policy enforcement, or audit logs.
      inScope: true

analysis: |
  DFNS functions as the cryptographic signing infrastructure for all privileged
  vault operations in the Corda Protocol. Because a DFNS wallet key IS the
  protocol authority key (Curator, Vault Manager, etc.), a compromise of the
  DFNS signing path is equivalent to a compromise of that protocol role.

  The primary risk surfaces are:

  - **Authentication chain:** Microsoft SSO → DFNS user account → WebAuthn approval.
    Any break in this chain enables unauthorised signing initiation or approval.
  - **Service credential:** The BFF-held DFSS API service credential can initiate
    signing without user interaction (depending on DFNS policy configuration).
    Exfiltration of this credential is a critical single-factor attack path.
  - **DFNS as SPOF:** Full cloud deployment means DFNS availability directly
    maps to protocol operational availability. Prolonged DFNS outage halts all
    curator and admin operations.
  - **Blind signing:** DFNS policies can be configured to auto-approve signing
    requests from the BFF service account without per-transaction human review.
    Without WYSIWYS controls, the curator may approve a signing policy that
    allows arbitrary transaction content.
  - **Supply-chain attack on Admin UI:** A compromised Admin UI can inject
    crafted signing requests into the DFNS API flow without the curator's
    knowledge, exploiting an authenticated browser session.
  - **DFNS policy misconfiguration:** Overly permissive DFNS wallet policies
    (no approval requirements, no destination restrictions) eliminate the DFNS
    policy layer as a countermeasure.

threats:

  - ID: DFNS_SERVICE_CREDENTIAL_COMPROMISE
    title: DFNS service credential exfiltration enables unauthorised signing
    attack: |
      An attacker gains access to the DFNS service account credential (API key +
      private key pair) stored in the BFF server-side secret manager. This could
      occur via:

      - Secret manager misconfiguration (overly broad IAM policy)
      - Compromised CI/CD pipeline injecting credential into logs or artifacts
      - Lateral movement after initial server compromise
      - Insider access to infrastructure secrets

      With the service credential, the attacker can call the DFNS API directly
      to initiate signing requests for any wallet associated with that service
      account, subject only to DFNS wallet policy enforcement.

    threatType: Elevation of Privilege, Information Disclosure
    impactDesc: |
      The attacker can initiate signing requests for privileged protocol role
      wallets (Curator, Vault Manager, Protocol Config Authority) without any
      user interaction. Depending on DFNS policy configuration:

      - If policy requires no human approval: attacker can sign arbitrary
        vault operations immediately (settlement manipulation, config changes,
        emergency pause/unpause).
      - If policy requires WebAuthn approval: attacker is blocked at the
        approval step but can still trigger signing ceremonies, causing
        operational disruption.

    impactedSecObj:
      - REFID: CONFIDENTIALITY
      - REFID: INTEGRITY
      # - REFID: DFNS_KEY_CUSTODY
    assets:
      - REFID: DFNS_SERVICE_CREDENTIAL
      - REFID: DF_BFF_TO_DFNS
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: COMPROMISED_ADMIN_DEVICE
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H'
    pentestTestable: false
    fullyMitigated: false
    countermeasures:
      - ID: DFNS_CRED_IN_SECRETS_MANAGER
        title: Store DFNS service credential in a dedicated secret manager
        description: |
          Store the DFNS API service credential exclusively in a dedicated secret
          manager (e.g., Azure Key Vault, HashiCorp Vault) with:

          - IAM-scoped access (BFF service identity only, no human access)
          - Audit logging of every secret retrieval
          - Automatic rotation on a defined schedule (e.g., 90 days)
          - Alerts on unexpected access patterns

        inPlace: false
        public: false
        operational: false

      - ID: DFNS_REQUIRE_WEBAUTHN_APPROVAL
        title: Require WebAuthn approval for all high-privilege signing operations
        description: |
          Configure DFNS wallet policies to require an interactive WebAuthn
          approval from a designated approver for any signing operation that
          modifies vault state (config changes, emergency pause, settlement).
          Low-risk operational signing (e.g., read-only calls) may be exempted.

          This ensures that service credential compromise alone is insufficient
          to complete a signing ceremony.

        inPlace: false
        public: false
        operational: false

      - ID: DFNS_CRED_ROTATION
        title: Rotate DFNS service credential on compromise or staff change
        description: |
          Establish an incident response runbook for immediate DFNS service
          credential rotation on: suspected compromise, staff departure, or
          infrastructure access review findings.

        inPlace: false
        public: false
        operational: true
        operator: Security Operations Team

  - ID: DFNS_SPOF_UNAVAILABILITY
    title: DFNS cloud unavailability halts all privileged vault operations
    attack: |
      DFNS cloud experiences an outage (infrastructure failure, DDoS, regulatory
      action, vendor business continuity event). Because all key shares reside in
      DFNS cloud nodes, no signing ceremony can complete without DFNS availability.

      This means ALL operations requiring privileged signing are blocked for the
      duration of the outage:

      - Curator cannot settle investments or redemptions
      - Vault Manager cannot execute batch snapshots
      - Protocol Manager cannot pause or unpause the vault in an emergency
      - Vault Guard cannot execute an emergency halt

    threatType: Denial of Service
    impactDesc: |
      Prolonged DFNS outage causes:

      - Investor funds locked in pending investment/redemption queues with no
        settlement possible
      - Inability to execute emergency pause in response to an active exploit
      - Reputational and regulatory exposure from missed settlement SLAs

    impactedSecObj:
      - REFID: AVAILABILITY
      - REFID: USER_FUNDS_SAFETY
    assets:
      - REFID: DFNS_API
      - REFID: DF_BFF_TO_DFNS
    attackers:
      - REFID: EXTERNAL_ATTACKER
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:N/I:N/A:H'
    pentestTestable: false
    fullyMitigated: false
    countermeasures:
      - ID: DFNS_EMERGENCY_HALT_REDUNDANCY
        title: Maintain emergency halt keys outside DFNS on a high-availability wallet
        description: |
          Hold the Security Halt (emergency pause) key for the vault on a
          secondary, DFNS-independent wallet (e.g., high-availability mobile
          wallet such as Ledger Live or Phantom with push-notification alerting
          integrated with NCC SOC). This wallet is used exclusively for emergency
          pause during a DFNS outage.

          The halt key should be held on a separate Squads multisig or hardware
          wallet with an offline backup, not dependent on DFNS signing.

        inPlace: false
        public: false
        operational: true
        operator: Security Operations Team / Protocol Manager

      - ID: DFNS_SLA_MONITORING
        title: Monitor DFNS API availability and alert on degradation
        description: |
          Integrate DFNS status API / webhooks with the NCC SOC monitoring stack.
          Alert the on-call Protocol Manager within 5 minutes of DFNS API latency
          exceeding SLA thresholds. Define an operational runbook for DFNS outage
          scenarios including investor communication and SLA escalation.

        inPlace: false
        public: false
        operational: true
        operator: Security Operations Team

      - ID: DFNS_VETO_KEY_REDUNDANCY
        title: Hold veto keys on a DFNS-independent high-availability wallet
        description: |
          Veto keys (used to cancel time-locked actions during a DFNS outage)
          must be held outside DFNS on a high-availability mobile wallet with
          push notifications for pending time-locked action outcomes.
          NCC SOC integration should alert the veto key holder before timelock
          expiry.

        inPlace: false
        public: false
        operational: true
        operator: Security Operations Team / Vault Guard

  - ID: DFNS_BLIND_SIGNING
    title: Curator blind-signs a DFNS transaction without on-chain payload verification
    attack: |
      A malicious or compromised Admin UI presents the Curator with a misleading
      description of a pending vault operation. The Curator approves the DFNS
      WebAuthn signing request based on the UI description alone, without verifying
      the actual Solana transaction payload that DFNS will sign.

      Attack vectors:

      - Supply-chain compromise of the Admin UI (malicious JS replaces the
        displayed transaction intent with a benign description)
      - MITM attack on the BFF → Admin UI channel substituting the transaction
        summary
      - Social engineering: curator approves a "routine settlement" that is
        actually a configuration change

      Because DFNS signs whatever transaction the BFF submits, the curator's
      WebAuthn approval is bound to the DFNS signing request ID, not to the
      decoded Solana transaction content.

    threatType: Tampering, Repudiation
    impactDesc: |
      The Curator's cryptographic approval is attached to a Solana transaction
      different from what they intended to sign. Consequences:

      - Unauthorised configuration changes (e.g., new curator authority key)
      - Malicious settlement amounts or off-ramp destinations
      - Vault pause/unpause without the Curator's knowledge
      - Difficulty repudiating the action (the curator's WebAuthn key signed it)

    impactedSecObj:
      - REFID: SIGNING_TRANSACTION_INTEGRITY
      - REFID: INTEGRITY
      - REFID: AUDITABILITY
    assets:
      - REFID: DFNS_USER_CREDENTIAL
      - REFID: DF_USER_TO_DFNS
      - REFID: DF_BFF_TO_DFNS
    attackers:
      - REFID: COMPROMISED_ADMIN_DEVICE
      - REFID: EXTERNAL_ATTACKER
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:L/UI:R/S:C/C:N/I:H/A:N'
    pentestTestable: true
    fullyMitigated: false
    countermeasures:
      - ID: DFNS_TRANSACTION_PREVIEW
        title: Display decoded Solana transaction content before DFNS WebAuthn approval
        description: |
          The Admin UI must decode and display the full Solana transaction
          instruction set (program ID, accounts, instruction discriminator,
          parsed arguments) to the Curator before presenting the DFNS WebAuthn
          approval prompt. The display must be generated independently of the
          data passed to the DFNS API — fetched directly from an on-chain
          simulation or decoded locally from the serialized transaction bytes.

          This is the DFNS equivalent of the WYSIWYS (What You See Is What You
          Sign) control described in the SignOps model.

        inPlace: false
        public: false
        operational: false

      - ID: DFNS_OOB_SIGNING_INTENT
        title: Out-of-band signing intent verification for high-risk DFNS operations
        description: |
          For high-risk DFNS signing operations (config changes, emergency pause,
          upgrade authority actions), require the Curator to verify the transaction
          intent via a secondary out-of-band channel (Slack alert with decoded
          instruction summary, independent of the Admin UI) before approving in
          DFNS.

          This mirrors the Tier 2 WYSIWYS process defined in the SignOps model.

        inPlace: false
        public: false
        operational: true
        operator: Curator / Security Operations Team

      - ID: DFNS_TIMELOCK_INTEGRATION
        title: Route high-risk DFNS-signed operations through Squads timelocks
        description: |
          Ensure that all DFNS-signed vault configuration changes are submitted
          via Squads time-locked proposals (1-of-1 with vetoer) rather than
          directly on-chain. The timelock window provides a veto opportunity even
          if the signing step was compromised.

        inPlace: false
        public: false
        operational: false

  - ID: DFNS_SSO_ACCOUNT_TAKEOVER
    title: Microsoft SSO compromise leads to DFNS account takeover
    attack: |
      An attacker compromises the Microsoft Azure AD identity of a privileged
      protocol role holder (Admin, Curator) through:

      - Phishing attack capturing SSO credentials and MFA push-notification
        approval (MFA fatigue / prompt bombing)
      - Attacker-in-the-middle (AiTM) phishing proxy intercepting the OIDC
        session token after successful MFA
      - Compromised Microsoft tenant (directory-wide breach)
      - Conditional access policy misconfiguration allowing access from
        unmanaged devices

      With a valid OIDC token, the attacker can establish a DFNS session as the
      victim user, bypass WebAuthn if the DFNS session is still valid, and
      initiate or approve signing requests.

    threatType: Spoofing, Elevation of Privilege
    impactDesc: |
      Attacker gains full DFNS session access as a privileged role holder.
      Depending on the compromised role:

      - As Curator: can initiate signing for settlement, off-ramp, and batch ops
      - As Protocol Config Authority: can sign config changes including curator
        replacement and timelock modifications
      - As Vault Manager: can initiate settlement and batch snapshot operations

    impactedSecObj:
      - REFID: INTEGRITY
      # - REFID: DFNS_KEY_CUSTODY
      - REFID: USER_FUNDS_SAFETY
    assets:
      - REFID: DFNS_USER_CREDENTIAL
      - REFID: DF_CURATOR_TO_SSO
      - REFID: MICROSOFT_SSO
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: COMPROMISED_ADMIN_DEVICE
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:C/C:H/I:H/A:N'
    pentestTestable: true
    fullyMitigated: false
    countermeasures:
      - ID: DFNS_PHISHING_RESISTANT_MFA
        title: Enforce phishing-resistant MFA (FIDO2) for DFNS-linked SSO accounts
        description: |
          Configure Azure AD Conditional Access to require FIDO2 hardware
          security key authentication (not SMS or push-notification MFA) for all
          accounts that have DFNS access. This blocks AiTM phishing attacks that
          intercept TOTP or push-approval MFA.

        inPlace: false
        public: false
        operational: false

      - ID: DFNS_CONDITIONAL_ACCESS
        title: Restrict DFNS SSO access to managed, compliant devices only
        description: |
          Configure Azure AD Conditional Access policies to allow DFNS-related
          SSO sessions only from R3-managed, compliant devices (Intune enrolled,
          up-to-date endpoint protection). Deny access from personal or unmanaged
          devices.

        inPlace: false
        public: false
        operational: false

      - ID: DFNS_WEBAUTHN_SEPARATE_FROM_SSO
        title: Require DFNS WebAuthn approval independent of the SSO session
        description: |
          Ensure that DFNS signing approvals require a WebAuthn step that is
          cryptographically bound to a separate FIDO2 credential (not re-using
          the SSO authenticator), so that SSO session compromise alone is
          insufficient to approve a signing request.

        inPlace: false
        public: false
        operational: false

