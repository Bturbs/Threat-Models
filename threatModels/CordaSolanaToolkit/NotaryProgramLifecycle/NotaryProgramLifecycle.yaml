  securityObjectives:

    - ID: KEY_GOVERNANCE_INTEGRITY
      title: Key Governance Integrity
      description: |
        Ensure governance for Upgrade Authority and Notary Admin keys enforces segregation of duties and auditable approvals.
      group: Key Management
      contributesTo:
        - REFID: ASSET_INTEGRITY

  assets:
    - ID: SQUADS_MULTISIG_SYSTEM
      type: system
      title: Squads Multisig Account
      description: |
        Solana Squads multisig used to authorize privileged operations with a 3-of-5 signing threshold.
      inScope: true

    - ID: UPGRADE_AUTHORITY_WALLET
      type: key
      title: Upgrade Authority Wallet
      description: |
        Privileged wallet/key (PDA) used to approve program upgrade operations.
      inScope: true
      properties:
        keyType: PDA (Program Derived Address)
        curve: Ed25519
        storage: On-chain (Squads Multisig)
        threshold: 3-of-5

    - ID: NOTARY_WALLET_STN
      type: key
      title: Notary Admin Wallet
      description: |
        Privileged wallet/key (PDA) used to approve administrative instructions for the notary deployment.
      inScope: true
      properties:
        keyType: PDA (Program Derived Address)
        curve: Ed25519
        storage: On-chain (Squads Multisig)
        threshold: 3-of-5

    - ID: DEPLOYMENT_KEYPAIR
      type: credential
      title: Temporary Deployment Keypair
      description: |
        Ephemeral keypair used during bootstrap deployment before upgrade authority
        is transferred to the Squads multisig PDA.
      inScope: true
      properties:
        format: Ed25519 keypair
        intendedLifetime: Single deployment ceremony
        risk: If compromised during bootstrap, attacker can subvert initial trust state

    # - ID: SIGNER_KEYS
    #   type: credential
    #   title: Multisig Signer Keys (4)
    #   description: |
    #     Five signer keys enrolled in Squads multisig and used to reach the 3-of-5 threshold.
    #   inScope: true

    - ID: DEPLOYMENT_APPROVAL_FLOW
      type: dataflow
      title: Deployment and Admin Approval Flow
      description: |
        Proposal creation, review, and co-signing workflow for privileged Solana transactions.
      inScope: true

    - ID: DF_SHARE_MEMBER_PUBKEY
      type: dataflow
      title: Member Public Key Exchange Flow
      description: |
        Flow where candidate multisig members share their public keys with the multisig initializer
        through authenticated communication channels.
      inScope: true

    - ID: DF_VALIDATE_MEMBER_PUBKEYS
      type: dataflow
      title: Member Public Key Validation Flow
      description: |
        Flow where the multisig initializer validates submitted member keys and confirms key ownership,
        ideally via out-of-band challenge signature verification.
      inScope: true

    - ID: DF_REGISTER_MULTISIG
      type: dataflow
      title: Multisig Registration Flow
      description: |
        Flow for createKey selection, initial member pubkey submission, threshold configuration,
        and multisig PDA creation in the Squads program.
      inScope: true

    - ID: DF_DEPLOY_NOTARY_PROGRAM
      type: dataflow
      title: Notary Program Deployment Flow
      description: |
        Governed flow where multisig members propose and approve deployment,
        and Squads executes deployment of the Notary Program.
      inScope: true

    - ID: DF_VERIFY_DEPLOYMENT
      type: dataflow
      title: Deployment Verification Flow
      description: |
        Post-deployment verification flow that reads on-chain program ID, code hash,
        and authority state against expected release artifacts.
      inScope: true

    - ID: DF_CREATE_NETWORK
      type: dataflow
      title: Create Corda Network Administration Flow
      description: |
        Governed administrative flow to execute create_network instruction
        and persist network configuration on-chain.
      inScope: true

    - ID: DF_NOTARY_ADMIN
      type: dataflow
      title: Notary Administration Flow
      description: |
        Governed administrative flow for authorize/revoke notary and related
        on-chain notary administration state changes.
      inScope: true

    - ID: DF_UPGRADE_NOTARY_PROGRAM
      type: dataflow
      title: Notary Program Upgrade Flow
      description: |
        Governed flow for proposing, approving, and executing program upgrades,
        followed by post-upgrade verification checks.
      inScope: true

    - ID: DF_IMMUTABLE_LOCK
      type: dataflow
      title: Immutable Lock Finalization Flow
      description: |
        Governed flow that executes immutable lock and persists immutable program state,
        disabling future code upgrades.
      inScope: true

    - ID: DF_MEMBER_UPDATE
      type: dataflow
      title: Multisig Member Update Flow
      description: |
        Flow for adding or removing member pubkeys and updating role assignments,
        executed only through multisig proposal and threshold voting.
      inScope: true

  assumptions:
    - ID: DISTINGUISHED_OPERATORS
      description: |
        The five signer keys are controlled by distinct operators and not by the same individual.

    - ID: HARDWARE_BACKED_KEYS
      description: |
        Signers will transition to hardware-backed wallets or hardened signing environments for key custody.

        **Phase 1 (initial deployment):** Software wallets (e.g., Phantom) are used during bootstrapping.
        This assumption is relaxed during Phase 1 — see HARDWARE_SIGNING countermeasure for migration plan
        and accepted risk.

    - ID: NOTARY_PROGRAM_MUTABLE_AT_DEPLOYMENT
      description: |
        During deployment and initial configuration, the notary program may be in a mutable state
        until immutability is explicitly finalized and verified on-chain.

  attackers:
    - ID: EXTERNAL_ATTACKER
      title: External Attacker
      description: |
        Adversary without legitimate privileges attempting to compromise signer endpoints or approval workflow.
      inScope: true

    - ID: MALICIOUS_SIGNER
      title: Malicious Signer
      description: |
        Legitimate signer who abuses their role or colludes with another signer to approve unauthorized actions.
      inScope: true

    - ID: COMPROMISED_DEVELOPER
      title: Compromised Developer
      description: |
        Developer whose machine or local environment is compromised, exposing deploy keypairs,
        `.keys/` folder contents, or devnet credentials that are reused or production-adjacent.
      inScope: true

    - ID: COMPROMISED_OPERATOR
      title: Compromised Operator
      description: |
        Operator or deployment engineer whose CI/CD context or deployment ceremony is compromised,
        allowing manipulation of what gets deployed or how the deployment is executed.
        Unlike COMPROMISED_DEVELOPER (key material leak), this attacker controls the execution
        channel itself and can tamper with deployment artifacts, scripts, or ceremony steps.
      inScope: true

    - ID: SOLANA_CORE_COMPROMISE
      title: Solana Core Compromise
      description: |
        Catastrophic compromise of Solana core protocol or validator majority.
      inScope: false

analysis: |
  This analysis focuses on practical governance and deployment controls for the Notary Program lifecycle.

  **Operational procedures context:**
  This threat model informs the definition of key management procedures and operational controls
  for Solana Notary signers. Key decisions being evaluated include multisig threshold selection
  (3-of-5 selected), geographical signer distribution, phased key management (software wallets
  to hardware wallets), signing ceremony procedures, and succession playbooks.

  **Primary elevation-of-privilege impacts** (from signer compromise or collusion — upgrade code + admin):

  - Double spending via malicious program upgrade (higher impact, likely)
  - Routing bridging/unbridging assets to attacker-controlled Solana accounts (higher impact, unlikely — TBC)
  - Adding unauthorized Corda network (lower impact)

  **Primary denial-of-service impacts** (from lost keys or signer unavailability):

  - Cannot add a new Corda network (mitigable via redeployment + new ProgramID configuration)
  - Cannot fix a critical bug timely (extended vulnerability exposure window)

  **Risk concentration areas:**

  - Bootstrap deployment key exposure before upgrade-authority handover
  - Governance misconfiguration (members, threshold, and role assignments)
  - Signer compromise/collusion against multisig threshold
  - Liveness failures (unavailable signers, deadlock, or poor succession planning)

  **Priority controls:**

  - Atomic deployment ceremony with immediate authority handover
  - Mandatory independent post-deployment verification (program ID, code hash, authority)
  - Hardware-backed key custody (phased migration) with signer diversity and monitoring
  - Documented succession and break-glass processes with regular signing drills

  STRIDE matrix details are intentionally excluded in this version to keep the model
  deployment-lifecycle focused and easier to maintain.

threats:

  - ID: BOOTSTRAP_ABUSE
    title: Deployment Bootstrap and development Key Compromise Before Authority Handover
    attack: |
      A temporary deployment key is used to deploy the Notary Program before upgrade authority
      is transferred to the governed multisig.

      If this temporary key is compromised during the bootstrap window, an attacker can execute
      malicious deployment-time actions before handover finalization.
    threatType: Elevation of Privilege, Tampering
    impactDesc: |
      The attacker can subvert the initial trust state before multisig governance takes control.

      - Deploy unexpected or backdoored program code
      - Set an attacker-controlled authority during bootstrap
      - Trigger unauthorized upgrade or configuration changes before handover

      This undermines downstream governance assumptions even if multisig is configured later.

    impactedSecObj:
      - REFID: KEY_GOVERNANCE_INTEGRITY
      - REFID: ASSET_INTEGRITY
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: MALICIOUS_SIGNER
      - REFID: COMPROMISED_OPERATOR
      - REFID: COMPROMISED_DEVELOPER
    assets:
      - REFID: DEPLOYMENT_KEYPAIR
      - REFID: UPGRADE_AUTHORITY_WALLET
      - REFID: DF_DEPLOY_NOTARY_PROGRAM
      - REFID: DF_VERIFY_DEPLOYMENT
      - REFID: DF_CREATE_NETWORK
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H'
    pentestTestable: true
    fullyMitigated: false
    countermeasures:

      - ID: ATOMIC_AUTHORITY_HANDOVER
        title: Atomic Handover to Multisig During Deployment Ceremony
        description: |
          Treat deployment and upgrade-authority transfer as one controlled ceremony.

          - Submit authority transfer immediately after deployment
          - Block operational use until transfer is finalized on-chain
          - Record transaction evidence for both steps in the same release ticket
        inPlace: true
        public: true
        operational: true
        operator: Platform Operations and Security team

      - ID: PRE_USE_ONCHAIN_VERIFICATION
        title: Mandatory On-Chain Verification from Independent Channel
        description: |
          **CRITICAL**: Run post-deploy verification from a separate, independent channel —
          not from the same operator machine, CI/CD pipeline, or deployment context that
          performed the deployment. This is the primary control against COMPROMISED_OPERATOR:
          if the deployment channel is compromised, verification from the same channel is worthless.

          Require independent verification by at least two operators before enabling production use.
          Block production operations until all checks pass.

          **Pre-Production Verification Checklist** (automated script, run from independent environment):

          | Check | Description |
          |---|---|
          | No prior upgrades | Verify program hasn't been upgraded by unauthorized party (check upgrade tx history) |
          | Correct program ID | Verify deployed program ID matches expected address |
          | Upgrade authority | Verify upgrade authority == Squads multisig PDA (not still deployer key) |
          | Notary admin authority | Verify notary admin authority matches approved multisig PDA |
          | Code hash | Verify deployed bytecode matches deterministic build (Anchor verifiable build) |
          | Initialization state | Verify network and notary accounts exist and are properly initialized |
          | No unexpected txs | Audit program transaction history for unauthorized activity during bootstrap |
        inPlace: true
        public: true
        operational: true
        operator: Platform Operations and Security team

      - ID: EPHEMERAL_DEPLOY_KEY_RETIREMENT
        title: Retire Temporary Deployment Key After Handover
        description: |
          Use an ephemeral deployment key only during the bootstrap ceremony and
          permanently retire it immediately after authority transfer completes.

          This control reduces two risks:

          - Limits bootstrap abuse window before multisig governance is active
          - Limits blast radius if the deploy key is exfiltrated during ceremony
        inPlace: true
        public: true
        operational: true
        operator: Platform Operations and Security team

      - ID: NOTARY_OWN_DEPLOYMENT
        title: Notary Program Self-Deployment
        description: |
          Corda Network operator (Corda Network operator) perform their own deployment.

          This strategy requires configuration (ProgramID) and potentially code changes to the
          Corda Release (Uniqueness Provider) to support self-deployment by the notary program,
          but it eliminates the need for a separate upgrade bootstrap key.
        inPlace: false
        public: true
        operational: true
        operator: Corda Network operator

      - ID: DETERMINISTIC_VERIFIABLE_BUILD
        title: Use Anchor Verifiable Builds for Deterministic Bytecode
        description: |
          Build the notary program using `anchor build --verifiable` to produce deterministic,
          reproducible bytecode that can be independently verified against the deployed program.

          **Build command**:
          ```
          anchor build --verifiable
          ```

          **Verification command** (anyone can run):
          ```
          anchor verify <PROGRAM_ID> --provider.cluster mainnet
          ```

          This fetches on-chain bytecode and compares against a fresh verifiable build.
          Mismatch indicates tampering or non-deterministic build was deployed.

          Benefits:

          - Enables independent third-party verification of deployed code
          - Detects if deployed bytecode differs from audited source
          - Required for the code hash check in pre-production verification
        inPlace: false
        public: true
        operational: false

      - ID: DEPLOYMENT_CEREMONY_RUNBOOK
        title: End-to-End Deployment Ceremony Runbook
        description: |
          Consolidate all deployment-phase controls into a single sequenced operational runbook
          that covers the full lifecycle from bootstrap to production readiness.

          **Ceremony sequence:**

          1. **Pre-ceremony:** Verify signer availability, confirm build artifacts,
             prepare independent verification environment
          2. **Bootstrap deployment:** Deploy notary program using ephemeral deployment keypair
             (EPHEMERAL_DEPLOY_KEY_RETIREMENT)
          3. **Authority handover:** Transfer upgrade authority and notary admin to Squads
             multisig PDA in same ceremony (ATOMIC_AUTHORITY_HANDOVER)
          4. **Independent verification:** Run pre-production verification checklist from
             independent channel (PRE_USE_ONCHAIN_VERIFICATION)
          5. **Initial configuration:** Execute create_network and authorize_notary via
             multisig governance flow
          6. **Post-config verification:** Verify on-chain state matches expected configuration
          7. **Sign-off:** At least two independent operators confirm deployment is production-ready
          8. **Key retirement:** Permanently retire ephemeral deployment keypair

          **Evidence requirements:**

          - Record all transaction signatures and verification outputs
          - Capture operator attestations at each stage
          - Store ceremony log in release ticket for audit trail

          **Abort criteria:**

          - Any verification check failure
          - Signer unavailability during ceremony
          - Unexpected on-chain state at any stage
        inPlace: true
        public: true
        operational: true
        operator: Platform Operations and Security team

  - ID: DEPLOYMENT_KEYPAIR_ABUSE
    title: Deployment Keypair Abuse
    attack: |
      An attacker exfiltrates
      the temporary deployment keypair used in bootstrap.

      If key exfiltration occurs before handover finalization, attacker-controlled
      deployment or unauthorized upgrade activity may be executed.
    threatType: Information Disclosure, Elevation of Privilege
    impactDesc: |
      Exfiltrated deployment keys can compromise initial trust establishment.

      - Unauthorized deployment or bootstrap-time authority manipulation
      - Malicious changes before governance controls are fully active
      - Loss of confidence in release integrity and deployment evidence
      - Squatting on expected program ID with rogue code if attacker deploys first and blocks legitimate deployment

    impactedSecObj:
      - REFID: KEY_GOVERNANCE_INTEGRITY
      - REFID: ASSET_INTEGRITY
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: MALICIOUS_SIGNER
      - REFID: COMPROMISED_DEVELOPER
      - REFID: COMPROMISED_OPERATOR
    assets:
      - REFID: DEPLOYMENT_KEYPAIR
      - REFID: DF_DEPLOY_NOTARY_PROGRAM
      - REFID: DF_VERIFY_DEPLOYMENT
    CVSS:
      vector: 'CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:H'
    pentestTestable: false
    fullyMitigated: false
    countermeasures:
      - REFID: ATOMIC_AUTHORITY_HANDOVER

      - REFID: PRE_USE_ONCHAIN_VERIFICATION

      - REFID: EPHEMERAL_DEPLOY_KEY_RETIREMENT

      - ID: SECURE_DEPLOYMENT_ENVIRONMENT
        title: Secure and Isolate Deployment Environment
        description: |
          Run bootstrap deployment from hardened, dedicated environments with restricted
          operator access and short-lived credentials.

          - Avoid personal developer laptops for bootstrap deployment
          - Restrict filesystem and secret access to deployment process only
          - Capture immutable deployment logs for audit evidence
        inPlace: false
        public: true
        operational: true
        operator: Platform Operations and Security team
      
      - ID: CONFIDENTIAL_DEPLOYMENT_KEY
        title: Confidential Handling of Deployment Key Material
        description: |
          Treat deployment keypairs as sensitive secrets with access controls.

          - Avoid storing deployment keys in public version control or public shared storage

          Deployment keys will still need to be shared for ease of development and secure coding practices (keeping ProgramsIDs and CPI calls constant across environments). Pollution of CPIs and ProgramsIds has more severeconsequences. OTher controls during the bootstrap mitigates the risk of deployment keys compromise. 
        inPlace: false
        public: true
        operational: true
        operator: Platform Operations and Security team

      - ID: GITIGNORE_KEY_MATERIAL
        title: Enforce .gitignore for All Key Material
        description: |
          Ensure `target/deploy/`, `.keys/`, and `*-keypair.json` patterns are in `.gitignore`
          and enforced via pre-commit hooks. Audit git history for accidental commits.
        inPlace: true
        public: true
        operational: false

  - ID: NOTARY_ADMIN_SINGLE_KEY_COMPROMISE
    title: Notary Admin Single-Key Compromise
    attack: |
      If Notary Admin authority is controlled by a single private key instead of governed multisig,
      compromise of that key allows unilateral administrative control.

      Attack vectors include endpoint compromise, phishing, key exfiltration, or malicious insider abuse.
    threatType: Elevation of Privilege, Denial of Service
    impactDesc: |
      A compromised admin key can directly alter notary trust decisions and service behavior.

      Concrete impact scenarios:

      - **Add unauthorized Corda network:** Attacker uses admin authority to register a rogue
        Corda network, enabling illegitimate notarization requests.

      - **Double spending (if admin can influence notary authorization):** Attacker authorizes
        rogue notaries or revokes legitimate ones, potentially creating conditions for double-spend
        (likelihood TBC — depends on whether admin-only actions can enable this without code upgrade).

      - Authorize rogue notaries
      - Revoke legitimate notaries
      - Trigger denial of service through destructive admin actions

      Unlike deployment bootstrap risk, this threat persists for the full operational lifetime
      if single-key admin is retained.

    impactedSecObj:
      - REFID: KEY_GOVERNANCE_INTEGRITY
      - REFID: ASSET_INTEGRITY
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: MALICIOUS_SIGNER
    assets:
      - REFID: NOTARY_WALLET_STN
      - REFID: DF_NOTARY_ADMIN
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H'
    pentestTestable: true
    fullyMitigated: true
    countermeasures:

      - ID: SQUADS_MULTISIG_ADMIN
        title: Use Squads Multisignature for Notary Admin Authority
        description: |
          Do not retain single-key control for Notary Admin operations.

          Use a Squads multisig account (3-of-5 threshold) so that no single signer can
          authorize or revoke notaries unilaterally.
        inPlace: true
        public: true
        operational: false

  - ID: MULTISIG_POLICY_MISCONFIGURATION
    title: Multisig Policy Misconfiguration
    attack: |
      During setup or maintenance, operators misconfigure the multisig policy for Upgrade Authority or Notary Admin.
      Examples include reducing threshold below 2, enrolling unauthorized signers, or assigning the wrong multisig account
      as authority.

      The attacker then exploits weaker policy to execute privileged transactions.
    threatType: Tampering
    impactDesc: |
      Privileged operations can be executed without intended governance guarantees, enabling unauthorized
      upgrades or administrative actions.

      - Unauthorized program upgrade
      - Unauthorized notary admin action
      - Loss of trust in deployment governance

    impactedSecObj:
      - REFID: ASSET_INTEGRITY
      - REFID: KEY_GOVERNANCE_INTEGRITY
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: MALICIOUS_SIGNER
    assets:
      - REFID: SQUADS_MULTISIG_SYSTEM
      - REFID: UPGRADE_AUTHORITY_WALLET
      - REFID: NOTARY_WALLET_STN
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:N/I:H/A:H'
    pentestTestable: true
    fullyMitigated: false
    countermeasures:
      - ID: POLICY_AS_CODE
        title: Enforce Multisig Policy as Code
        description: |
          Define authority addresses, threshold, and member set in version-controlled deployment manifests.
          Add pre-deployment validation gates that fail if expected values do not match on-chain state.
        inPlace: false
        public: true
        operational: true
        operator: Platform Operations and Security team

      - ID: TWO_PERSON_REVIEW
        title: Independent Two-Person Review for Policy Changes
        description: |
          Require security and platform reviewers to approve any multisig membership or threshold update.
          Changes must include rollback steps and explicit risk acceptance.
        inPlace: false
        public: true
        operational: true
        operator: Platform Operations and Security team

      - ID: OOB_CHALLENGE_SIGNATURE
        title: Out-of-Band Challenge Signature Verification for Member Keys
        description: |
          Before registering or updating member keys, require each candidate member to sign a fresh
          challenge message with the submitted public key. Verify signatures out-of-band and record
          evidence with reviewer approval.

          This reduces spoofing and tampering risk in member key onboarding.
        inPlace: false
        public: true
        operational: true
        operator: Platform Operations and Security team

      - ID: SIGNER_ONBOARDING_CEREMONY
        title: Signer Selection and Onboarding Ceremony
        description: |
          Define and execute a structured process for selecting, vetting, and onboarding
          multisig signers.

          **Signer selection criteria:**

          - Signer must be a distinct trusted individual (not shared accounts or bots)
          - Signer must meet geographic separation requirements (see SIGNER_SELECTION_RULES)
          - Signer must not share a management chain with another signer
          - Signer must have operational availability commitments (SLA for signing response)
          - Signer must accept key custody responsibilities and succession obligations

          **Onboarding steps:**

          - Identity verification of candidate signer by at least two existing signers
          - Candidate generates keypair on approved device (Phase 1: Phantom, Phase 2: hardware wallet)
          - Candidate shares public key via authenticated channel (DF_SHARE_MEMBER_PUBKEY)
          - Out-of-band challenge signature verification (OOB_CHALLENGE_SIGNATURE)
          - Two-person review and approval of membership addition
          - Multisig member update executed on-chain (DF_MEMBER_UPDATE)
          - Post-update on-chain verification of new member set

          **Records:**

          - Document signer identity, public key, geographic location, and approval evidence
          - Maintain a signer registry for audit and succession planning
        inPlace: false
        public: false
        operational: true
        operator: Platform Operations and Security team

  - ID: WRONG_SIGNERS_GROUP
    title: Inadequate Multisig Signer Selection
    attack: |
      Signers are selected without following established criteria or a formal approval process.
      Selection failures include:

      - All signers located in the same geographic jurisdiction — a single legal order,
        regional outage, or coordinated physical threat can compromise or freeze quorum
      - Signers from the same management chain — managerial pressure can coerce coordinated
        action, effectively collapsing the multisig to single-party control
      - Signers without adequate technical competence — increased risk of key loss,
        operational errors, or susceptibility to phishing/social engineering
      - Signers with undisclosed conflicts of interest — hidden relationships that
        increase collusion probability
      - No formal vetting or identity verification — signer identity cannot be reliably
        established or audited after the fact
      - No documented acceptance of custody responsibilities — signers may not understand
        or commit to their obligations, creating accountability gaps

      This threat is a precondition amplifier: weak signer selection increases the likelihood
      and impact of TWO_SIGNER_COLLUSION_OR_COMPROMISE and MULTISIG_LIVENESS_FAILURE.

    threatType: Elevation of Privilege, Denial of Service, Repudiation
    impactDesc: |
      Governance guarantees are undermined regardless of technical multisig configuration.

      **Security impacts:**

      - Correlated compromise: geographically co-located signers can be simultaneously
        targeted via legal seizure, physical coercion, or infrastructure failure
      - Collusion enablement: organizationally dependent signers can be pressured into
        coordinated malicious action
      - Operational fragility: technically incompetent signers increase liveness risk
        and key loss probability

      **Compliance impacts:**

      - No audit trail of signer selection rationale or due diligence
      - Cannot demonstrate to regulators or auditors that governance meets fiduciary standards
      - Signer accountability gaps if responsibilities were never formally accepted
      - Non-compliance with key ceremony and custody standards (e.g., SOC2, PCI-DSS key management)

    impactedSecObj:
      - REFID: KEY_GOVERNANCE_INTEGRITY
      - REFID: ASSET_INTEGRITY
