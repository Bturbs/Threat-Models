  - ID: DFNS_POLICY_MISCONFIGURATION
    title: Overly permissive DFNS wallet policy allows unilateral service-account signing
    attack: |
      DFNS wallet policies are misconfigured (or intentionally set permissively
      during initial integration) to allow the BFF service account to sign any
      transaction for a privileged wallet without requiring a human WebAuthn
      approval step.

      An attacker who compromises the BFF service credential (see
      DFNS_SERVICE_CREDENTIAL_COMPROMISE) can then sign arbitrary vault
      operations without any additional human checkpoint.

      Additionally, policy changes in DFNS may themselves be made without
      adequate change-control review, allowing a malicious insider or compromised
      admin to weaken policies silently.

    threatType: Elevation of Privilege, Tampering
    impactDesc: |
      The DFNS policy layer — the primary technical safeguard against service
      credential compromise — is rendered ineffective. A single point of
      compromise (the BFF service account) is sufficient to sign any vault
      operation. All privileged protocol roles are exposed with no additional
      verification barrier.

    impactedSecObj:
      - REFID: INTEGRITY
      # - REFID: DFNS_KEY_CUSTODY
      - REFID: USER_FUNDS_SAFETY
    assets:
      - REFID: DFNS_API
      - REFID: DFNS_SERVICE_CREDENTIAL
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: DFNS_INSIDER
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:N/I:H/A:N'
    pentestTestable: true
    fullyMitigated: false
    countermeasures:
      - ID: DFNS_POLICY_REVIEW
        title: Periodic review and audit of DFNS wallet signing policies
        description: |
          Conduct quarterly reviews of DFNS wallet policies for all privileged
          wallets. Ensure each policy requires human WebAuthn approval for
          high-risk operations. Policy changes must follow a documented
          change-management process with security review sign-off.

        inPlace: false
        public: false
        operational: true
        operator: Security Operations Team

      - ID: DFNS_POLICY_ALERTING
        title: Alert on DFNS policy changes for privileged wallets
        description: |
          Configure DFNS webhook alerts (or periodic policy diff checks) to
          notify the Security Operations Team immediately when a signing policy
          is modified for a privileged wallet. Route alerts to the NCC SOC
          monitoring channel.

        inPlace: false
        public: false
        operational: true
        operator: Security Operations Team / NCC SOC

  - ID: DFNS_INSIDER_KEY_SHARE_ABUSE
    title: DFNS insider manipulates key share nodes to enable unauthorised signing
    attack: |
      A DFNS employee or contractor with privileged access to the DFNS cloud
      infrastructure modifies MPC key share node configuration to:

      - Force a signing ceremony without the required policy approvals
      - Export or reconstruct partial key material from compromised nodes
      - Manipulate signing ceremony outputs to produce signatures for attacker-
        chosen transactions

      This attack does not require compromise of R3 credentials but exploits the
      inherent trust placed in DFNS as a cloud MPC provider.

    threatType: Elevation of Privilege, Tampering
    impactDesc: |
      An attacker with DFNS insider access can sign arbitrary Solana transactions
      for any R3 privileged wallet, bypassing all R3-side policy controls and
      WebAuthn approval requirements. Impact equivalent to full key compromise
      for all protocol roles.

    impactedSecObj:
      # - REFID: DFNS_KEY_CUSTODY
      - REFID: INTEGRITY
      - REFID: USER_FUNDS_SAFETY
    assets:
      - REFID: DFNS_WALLET_KEY
      - REFID: DFNS_API
    attackers:
      - REFID: DFNS_INSIDER
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:H/UI:N/S:C/C:H/I:H/A:N'
    pentestTestable: false
    fullyMitigated: false
    countermeasures:
      - ID: DFNS_VENDOR_DUE_DILIGENCE
        title: Validate DFNS SOC 2 Type II attestation and MPC architecture audit
        description: |
          Require DFNS to provide current SOC 2 Type II audit reports and
          third-party MPC architecture security assessments prior to production
          deployment. Review annually or upon material changes to DFNS
          infrastructure.

        inPlace: false
        public: false
        operational: true
        operator: Security Research Team / Legal

      - ID: DFNS_UPGRADE_KEYS_EXTERNAL_MULTISIG
        title: Hold deployment and upgrade authority keys on an external M-of-N Squads multisig with R3 physical keys
        description: |
          Program upgrade authority and protocol config authority keys must NOT
          reside solely in DFNS. A second approval layer via an external M-of-N
          Squads multisig (with R3-owned hardware wallet keys held physically)
          ensures that even a full DFNS compromise cannot unilaterally execute
          critical upgrades or config changes.

          This mirrors the disaster recovery design note: "Deployment/upgrade keys
          on another Squads (M of N) with R3 owned physical keys."

        inPlace: false
        public: false
        operational: false

      - ID: DFNS_AUDIT_LOG_INTEGRITY
        title: Export and independently preserve DFNS audit logs
        description: |
          Configure DFNS to export signing event audit logs to an R3-controlled
          immutable log store (e.g., Azure Sentinel, immutable blob storage).
          Verify log completeness periodically. A DFNS insider cannot retroactively
          alter logs held outside DFNS infrastructure.

        inPlace: false
        public: false
        operational: true
        operator: Security Operations Team / NCC SOC
