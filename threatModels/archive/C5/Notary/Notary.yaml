        [Code REF](https://github.com/corda/corda-runtime-os/blob/a04dbb486fe8ade28c94526df203a7095b14c710/components/ledger/ledger-utxo-flow/src/main/kotlin/net/corda/ledger/utxo/flow/impl/flows/finality/v1/UtxoFinalityFlowV1.kt#L66C23-L66C23) 
      inScope: true

    - ID: DF_sendUnseenSignaturesToCounterparties
      type: DataFlow
      title: Sending Notary signature to counterparties
      description: |
        Sending Notary signature to all counterparties participating in the TX
        [Code REF](https://github.com/corda/corda-runtime-os/blob/a04dbb486fe8ade28c94526df203a7095b14c710/components/ledger/ledger-utxo-flow/src/main/kotlin/net/corda/ledger/utxo/flow/impl/flows/finality/v1/UtxoFinalityFlowV1.kt#L63C22-L63C22) 
      inScope: true

    - ID: NOTARY_KEYS
      title: Notary Key
      type: key
      description: (A.K.A. Notary Signing Key) public and private notary keys. 
        Each notary service is represented by one or more notary virtual nodes. 
        Each notary virtual node has its own public / private key pair for 
        signing successful notarization requests. A notary service (represented 
        by multiple notary nodes) has a composite public key that is used to 
        validate the signature of any notary node that represents that notary 
        service. The MGM is responsible for maintaining the composite public key
        for the notary service as a whole, which it broadcasts as part of 
        network information to members. The notary service does not have a 
        public key of its own; instead, the MGM provides a composite public key 
        of all active notary representatives. This allows a virtual node to 
        verify that approval of a notarization request was valid by ensuring 
        that at least one notary representative of a notary service signed a 
        notarization request.
      inScope: true
      properties:
        location: CRYPTO_WORKER Java memory process, VNODE_DB (encrypted with 
          wrapping keys), to be checked
        format: ECDSA key pair
        length: 256
        type: Private signature key
      applicationRelated: true
      infrastructureRelated: false


  assumptions:

    - ID: IDENTIFICATION_AUTHENTICATION
      description: >
        Corda is a permissioned network, where all participants are identified and
        authenticated.  Participants communicate confidentially in peer-to-peer, and
        mutual identification and authentication takes place prior to any ledger
        operation.      
    - ID: TXID_SENSITIVITY_SECRET
      description: >
        TXID are considered to be secret and are not meant to be disclosed except
        in the following cases,

        - particpants to the transaction
        - the notary assigned to notarize the transaction
        - backchain validation: participants to future transactions that are related
        to that transaction states      
         

