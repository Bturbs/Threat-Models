analysis: |2

  <img src="img/ConfIDSeq4.svg"/>

  **Detailed flow of the Confidential Identities protocol:**

  <img src="img/ci-flow-security-protocol.png"/>

  The Confidential Identities protocol allows parties to transact without revealing their real identities into the backchain.
  It achieves this by using confidential keys for each transaction and selectively syncing identity mappings.

  Every Node participanting in the trasaction known the other parties real identity. 

  By Leveraging Confidential Identities, the protocol ensures that other parties can validate
   the origin and legitimacy of the token they're receiving without learning the real identity of 
   previous owners in the backchain with the exception of the issuer of the token itself.




# https://github.com/corda/confidential-identities/blob/master/README.md

# ✅ Functional goal: Let Charlie validate the origin and legitimacy of the token he's receiving without learning Alice’s real identity.

# ✅ Privacy guarantee: Each transaction uses a fresh confidential key, and identity mappings are selectively synced—so Charlie sees enough to trust the asset but not enough to trace Alice personally.

# ✅ Security and auditability: The backchain remains verifiable through state references and mappings, and audit nodes (or selectively included parties) can resolve identities if needed.

threats:
  - ID: CONFIDENTIAL_IDENTITY_DISCLOSURE_FLOW
    title: Confidential Identity Disclosure in SyncKeyMappingFlow
    attack: |
      The SyncKeyMappingFlow may reveal confidential identities from other parties involved in a transaction to the counterparty. 
      If the counterparty requests resolution for these identities, and the node can resolve them, the well-known identities will be disclosed.
    threatType: Information Disclosure
    impactDesc: |
      Compromises the privacy of transaction participants by exposing confidential identities to unintended parties, potentially leading to misuse of sensitive information.
    impactedSecObj:
      - REFID: DATA_CONFIDENTIALITY
    attackers:
      - REFID: MALICIOUS_NODE
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:N/A:N'
    fullyMitigated: true
    countermeasures:
      - ID: FILTERED_IDENTITY_LIST
        title: Use Filtered Identity List
        description: |
          Provide a filtered list of confidential identities to the flow,
           ensuring only the necessary identities are shared with the counterparty.
        inPlace: false
        public: true
      # - ID: IDENTITY_RESOLUTION_AUDIT
