  - ID: UPGRADE_VULNERABILITY_DISCLOSURE
    title: Vulnerability Disclosure via Program Upgrade Process
    attack: |
      When upgrading a Solana program to fix a security vulnerability, the
      upgrade process itself can disclose the vulnerability before the fix is
      live:

      - **PDA buffer visibility:** The new program binary is written to a PDA
        buffer account before the upgrade instruction executes. Anyone can read
        this buffer and diff it against the current program to identify the
        vulnerability.
      - **4-of-7 cold storage signing delay:** Collecting signatures from 7
        cold storage signers takes time, extending the disclosure window.
      - **On-chain visibility:** All Solana transactions are publicly visible,
        making it impossible to hide the upgrade preparation.

      This creates a race condition: the vulnerability is effectively disclosed
      to sophisticated observers before the fix is deployed.
    threatType: Information Disclosure
    impactDesc: |
      Attacker identifies and exploits the vulnerability in the window between
      upgrade preparation (buffer write) and upgrade execution:

      - Vulnerability details derivable from program binary diff
      - Exploitation possible before fix is deployed
      - Especially dangerous for critical vulnerabilities affecting user funds
    impactedSecObj:
      - REFID: CONFIDENTIALITY
      - REFID: PROGRAM_INTEGRITY
      - REFID: USER_FUNDS_SAFETY
    attackers:
      - REFID: EXTERNAL_ATTACKER
    assets:
      - REFID: VAULT_UPGRADE_AUTHORITY_KEYS
      - REFID: VAULT_PROGRAM
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
    fullyMitigated: true
    countermeasures:
      - ID: COMMIT_HASH_REVEAL_UPGRADE
        title: Commit-Hash and Atomic Reveal Upgrade Strategy (Security Fix)
        description: |
          For security-critical upgrades, use a two-phase commit-reveal
          pattern:

          - **Phase 1 (Commit):** Publish only a hash of the new program binary
            to the buffer; collect all threshold signatures against this hash
          - **Phase 2 (Reveal + Execute):** Once threshold is met, write the
            actual binary and execute the upgrade atomically

          This eliminates the disclosure window since the binary is not readable
          until the upgrade is ready to execute.
        inPlace: false
        public: true
        operational: false
      - ID: PDA_BUFFER_BUG_BOUNTY
        title: PDA Buffer as Bug Bounty Incentive (Non-Security Fix)
        description: |
          For non-security upgrades, the PDA buffer visibility can serve as a
          natural "bug bounty" mechanism:

          - Researchers can review the new binary before it goes live
          - Incentivizes responsible disclosure over exploitation
          - Only appropriate for non-security upgrades where disclosure is
            acceptable
        inPlace: false
        public: true
        operational: true
      - ID: HALT_VAULT_UNTIL_SECURITY_UPGRADE
        title: Halt Vault Operations Until Security Upgrade Completes
        description: |
          For critical security upgrades, consider halting all vault operations
          until the upgrade is fully executed:

          - Use break-glass authority to pause vault before starting upgrade
          - Only resume operations after upgrade completes successfully
          - This prevents exploitation of the vulnerability during the upgrade window
        inPlace: true
        public: true
        operational: true
        operator: Vault Guard
  - ID: SETTLEMENT_FRONT_RUNNING
    title: Front-Running via Signature or Timelock Information Disclosure
    attack: |
      Timelocked signatures and pending transactions disclose
      market-sensitive information that can be front-run:

      - **Fee changes:** Pending protocol or curator fee adjustments visible
        on-chain during timelock period, allowing users to time investments or
        redemptions
      - **AUM updates:** Pending NAV/AUM updates reveal asset performance
        before settlement, enabling informed trading of vTokens
      - **Settlement timing:** Timelock expiry times reveal when settlements
        will execute, enabling market positioning

      Front-running vectors:

      - Reading pending timelocked transactions on-chain
      - Monitoring transaction mempool for signing activity
      - Using RPC broadcasted transactions (visible to RPC providers)
    threatType: Information Disclosure
    impactDesc: |
      Market participants gain unfair informational advantage:

      - Front-run fee increases by investing before new fees take effect
      - Trade vTokens based on unreleased NAV information
      - Position ahead of known settlement amounts
      - Systematically extract value from information asymmetry
    impactedSecObj:
      - REFID: CONFIDENTIALITY
      - REFID: USER_FUNDS_SAFETY
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: MALICIOUS_USER
    assets:
      - REFID: PROTOCOL_MANAGER_KEYS
      - REFID: VAULT_MANAGER_KEYS
      - REFID: CURATOR_KEYS
    ticketLink: https://r3-cev.atlassian.net/browse/PROT-864
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    fullyMitigated: false
    countermeasures:
      - ID: FRONT_RUNNING_MITIGATIONS
        title: Front-Running Mitigations
        description: |
          Reduce information leakage and front-running opportunities:

          - **TPU/Jito bundles:** Submit transactions directly to validators
            via TPU or use Jito bundles (not public RPC) to prevent mempool
            observation
          - **Commit-hash and reveal:** For fee changes and AUM updates, commit
            only a hash during timelock period; reveal actual values atomically
            at execution
          - **Batch processing:** Batch settlements to reduce individual
            transaction observability
        inPlace: false
        public: true
        operational: false
  - ID: BREAK_GLASS_ABUSE
    title: Abuse of Single-Signature Break-Glass Emergency Actions
    attack: |
      Several roles have single-signature, no-timelock "break-glass" actions
      designed for emergency response:

      - **Protocol Manager:** Pause vault (single sig), Revoke pending actions (single sig)
      - **Vault Guard:** Pause vault (single sig), Revoke pending actions (single sig)
      - **Vault Manager:** Pause vault (single sig)
      - **Curator:** Pause vault (single sig)

      These actions intentionally bypass multisig and timelock protections for
      speed. However, this creates a lower-security path that can be abused:

      - Compromised single key can pause the entire vault (DoS)
      - Malicious insider can revoke legitimate pending actions
      - Break-glass actions used to create confusion during a coordinated attack
      - Rogue signer pauses vault to extort or disrupt operations

      The resume vault action requires higher threshold (2 of ?) with timelock,
      making recovery from malicious pause slower than the attack.
    threatType: Denial of Service, Elevation of Privilege
    impactDesc: |
      Unauthorized use of break-glass actions:

      - Vault paused, blocking all investment and redemption operations
      - Legitimate timelocked actions revoked, forcing re-initiation
      - Asymmetric impact: pause is instant (single sig) but resume requires
        multisig + timelock, creating extended downtime
      - Repeated pause attacks can degrade user confidence
    impactedSecObj:
      - REFID: AVAILABILITY
      - REFID: USER_FUNDS_SAFETY
    attackers:
      - REFID: PROTOCOL_MANAGER
      - REFID: VAULT_GUARD
      - REFID: VAULT_MANAGER
      - REFID: CURATOR
      - REFID: EXTERNAL_ATTACKER
    assets:
      - REFID: PROTOCOL_MANAGER_KEYS
      - REFID: VAULT_GUARD_KEYS
      - REFID: VAULT_MANAGER_KEYS
      - REFID: CURATOR_KEYS
    ticketLink: https://r3-cev.atlassian.net/browse/PROT-856
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:C/C:N/I:H/A:H
    fullyMitigated: false
    countermeasures:
      - ID: REDUCE_BLAST_RADIUS
        title: Reduce Break-Glass Blast Radius
        description: |
          Limit the impact of break-glass actions:

          - **Circuit breaker design:** Pause affects limited scope rather than
            entire vault operations
          - **Rate limiting:** Prevent repeated pause/unpause cycling
          - **Cooldown periods:** After break-glass use, require elevated
            threshold for subsequent break-glass actions
          - **Automatic escalation:** Break-glass use triggers immediate
            multi-party review
        inPlace: false
        public: true
        operational: false
      - ID: BREAK_GLASS_MONITORING
        title: Break-Glass Event Monitoring and Audit
        description: |
          Enhanced monitoring for break-glass actions:

          - Immediate alerting to all stakeholders on any break-glass use
          - Mandatory post-incident review and documentation
          - Off-chain audit trail capturing justification and context
          - Pattern detection for suspicious break-glass usage
        inPlace: false
        public: true
        operational: true
