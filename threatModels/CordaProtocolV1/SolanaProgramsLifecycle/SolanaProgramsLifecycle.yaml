      #     Generate distinct keypairs for each environment. Never reuse devnet
      #     deployment keys, admin keys, or program IDs for mainnet.

      #     Document the separation policy and enforce via CI checks.

      #   inPlace: false
      #   public: true
      #   operational: true

      - ID: ACCEPT_PRE_RELEASE_CODE_DISCLOSURE
        title: Accept that devnet code is public and visible to attackers
        description: |
          Acknowledge that deploying to devnet inherently exposes program IDs and
          initialization transactions publicly. Focus security efforts on secure code and mainnet
          deployment controls rather than attempting to hide devnet activity.
        inPlace: true
        public: true
        operational: false

      - ID: ACCEPT_PUBLIC_PROGRAM_IDS
        title: Accept That Program IDs Are Public After Deployment
        description: |
          Acknowledge that once deployed, program IDs are inherently public on Solana.
          Focus security on key custody and governance rather than ID secrecy.
        inPlace: true
        public: true
        operational: false


  - ID: IMMUTABLE_LOCK_PREMATURE_OR_INCOMPLETE
    title: Premature or Incomplete Immutable Lock
    attack: |
      Operators execute immutable lock (revoke upgrade authority) on one or more programs
      before all initialization, configuration, and cross-program verification is complete.

      Alternatively, operators fail to lock programs that should be immutable, leaving
      an unnecessary upgrade attack surface.

      In a multi-program deployment, partial locking creates inconsistent
      governance states.

    threatType: Denial of Service, Tampering
    impactDesc: |
      Premature lock:

      - Cannot fix discovered bugs or misconfigurations
      - Cannot update hardcoded program IDs if mismatch is found post-lock
      - Requires full redeployment and state migration to recover

      Incomplete lock:

      - Upgradeable programs remain vulnerable to governance compromise
      - Inconsistent security posture across the program suite

    impactedSecObj:
      - REFID: KEY_GOVERNANCE_INTEGRITY
      - REFID: AVAILABILITY
      - REFID: PROGRAM_INTEGRITY
    attackers:
      - REFID: MALICIOUS_SIGNER
    assets:
      - REFID: DF_IMMUTABLE_LOCK
      - REFID: UPGRADE_AUTHORITY_PDA
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:N/I:H/A:H'
    pentestTestable: false
    fullyMitigated: true
    countermeasures:
      - ID: NO_IMMUTABLE_LOCK
        title: Do Not Lock Programs — Retain Multisig Upgrade Capability
        description: |
          Deliberately avoid making programs immutable. Keep both programs
          upgradeable via Squads multisig governance indefinitely.

          **Rationale**:

          - Preserves ability to fix critical vulnerabilities post-deployment
          - Eliminates risk of premature lock causing permanent operational issues
          - Multisig already provides sufficient protection against unauthorized upgrades
          - Immutability provides marginal security benefit vs. governance compromise risk

          **Trade-off accepted**:

          - Programs remain theoretically upgradeable if multisig is compromised
          - Mitigated by multisig signer controls (hardware wallets, diversity, monitoring)

          This approach avoids the entire threat category of premature/incomplete locking.

        inPlace: true
        public: true

      - ID: LOCK_PRECONDITIONS_CHECKLIST
        title: Mandatory Pre-Lock Verification Checklist
        supersededBy: NO_IMMUTABLE_LOCK
        description: |
          **Not applicable**: Programs will not be locked.

          Original purpose: Before executing immutable lock on any program, verify
          all deployment and initialization steps are complete.

        inPlace: false
        public: true
        operational: true

      - ID: COORDINATED_LOCK_STRATEGY
        title: Coordinated Lock Strategy for All Programs
        supersededBy: NO_IMMUTABLE_LOCK
        description: |
          **Not applicable**: Programs will not be locked.

          Original purpose: Define a lock sequence respecting cross-program dependencies.

        inPlace: false
        public: true
        operational: true

  - ID: MULTISIG_POLICY_MISCONFIGURATION
    title: Multisig Policy Misconfiguration
    attack: |
      During setup or maintenance, operators misconfigure the Squads multisig policy
      governing upgrade authority for the vault.

      Examples include reducing threshold below 2, enrolling unauthorized signers,
      or assigning the wrong multisig account as upgrade authority.

      The attacker then exploits weaker policy to execute privileged upgrade transactions
      without intended governance guarantees.
    threatType: Tampering
    impactDesc: |
      Privileged operations can be executed without intended governance guarantees:

      - Unauthorized program upgrade for the vault
      - Loss of trust in deployment governance
      - Potential persistent compromise through malicious upgrade code

    impactedSecObj:
      - REFID: KEY_GOVERNANCE_INTEGRITY
      - REFID: PROGRAM_INTEGRITY
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: MALICIOUS_SIGNER
    assets:
      - REFID: SQUADS_MULTISIG
      - REFID: UPGRADE_AUTHORITY_PDA
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:N/I:H/A:H'
    pentestTestable: true
    fullyMitigated: false
    ticketLink: 'https://r3-cev.atlassian.net/browse/PROT-867'
    countermeasures:
      - ID: POLICY_AS_CODE
        title: Enforce Multisig Policy as Code
        description: |
          Define authority addresses, threshold, and member set in version-controlled deployment manifests.
          Add pre-deployment validation gates that fail if expected values do not match on-chain state.
        inPlace: false
        public: true
        operational: true
        operator: Deployment Team

      - ID: TWO_PERSON_REVIEW
        title: Independent Two-Person Review for Policy Changes
        description: |
          Require security and platform reviewers to approve any multisig membership or threshold update.
          Changes must include rollback steps and explicit risk acceptance.
        inPlace: false
        public: true
        operational: true
        operator: Deployment Team

      - ID: OOB_CHALLENGE_SIGNATURE
        title: Out-of-Band Challenge Signature Verification for Member Keys
        description: |
          Before registering or updating member keys, require each candidate member to sign a fresh
          challenge message with the submitted public key. Verify signatures out-of-band and record
          evidence with reviewer approval.

          This reduces spoofing and tampering risk in member key onboarding.
        inPlace: false
        public: true
        operational: true
        operator: Deployment Team

  - ID: MULTISIG_BRICKING_AND_PERMANENT_DEADLOCK
    title: Multisig Bricking and Permanent Deadlock
    attack: |
      Operators mismanage multisig threshold settings or lose access to a critical number
      of signer keys. Common failure modes include setting an impractical threshold
      (for example, effectively requiring all members), inadequate key recovery planning,
      and simultaneous signer attrition.

      Once quorum becomes unreachable, privileged governance actions can no longer be executed.
      Unlike temporary liveness failure, this state is permanent.
    threatType: Denial of Service
    impactDesc: |
      Privileged assets and operations become permanently unrecoverable:

      - Cannot upgrade vault to fix critical vulnerabilities
      - Non-rotatable admin keys cannot be recovered via governance
      - Emergency changes and recovery actions cannot be approved
      - Long-term operational lockout and incident escalation

    impactedSecObj:
      - REFID: AVAILABILITY
      - REFID: KEY_GOVERNANCE_INTEGRITY
    attackers:
      - REFID: EXTERNAL_ATTACKER
    assets:
      - REFID: SQUADS_MULTISIG
      - REFID: UPGRADE_AUTHORITY_PDA
      - REFID: DF_UPGRADE_PROGRAMS
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:N/I:N/A:H'
    pentestTestable: false
    fullyMitigated: false
    ticketLink: 'https://r3-cev.atlassian.net/browse/PROT-874'
    countermeasures:
      - ID: SUCCESSION_PLAN_FOR_SIGNERS
        title: Establish Signer Succession and Recovery Plan
        description: |
          Define and test a documented succession process for signer replacement,
          key loss, and operator departure.

          Include pre-authorized recovery procedures, role handover controls,
          and periodic validation drills.
        inPlace: false
        public: false
        operational: true

      - ID: THRESHOLD_DESIGN_GUARDRAILS
        title: Keep 2-of-4, Avoid 100% Thresholds Unless Strictly Necessary
        description: |
          Keep 2-of-4 threshold as default for upgrade authority to balance security and liveness.
          Set threshold policies to preserve liveness under realistic operator availability.

          For larger teams, avoid unanimous thresholds by default and require explicit risk sign-off
          when 100% thresholds are proposed.
        inPlace: true
        public: true
        operational: true

  - ID: UNVERIFIED_LOGIC_PATH_IN_PRIVILEGED_FLOW
    title: Unverified Logic Path in Privileged Flow
    attack: |
      An attacker identifies a privileged instruction path or state transition in the Squads
      multisig that was not covered by formal proofs (or where proofs are stale after code changes).

      The attacker crafts transaction parameters that satisfy runtime checks but violate intended
      governance invariants for program upgrades.

      This can occur when verification scope does not include all critical properties for multisig
      authorization and state transitions.
    threatType: Tampering
    impactDesc: |
      Privileged transaction processing may behave differently than intended:

      - Invariant bypass in upgrade approval workflow
      - Unsafe state transition in privileged operation
      - Reduced assurance in deployment governance for both programs

    impactedSecObj:
      - REFID: PROGRAM_INTEGRITY
      - REFID: KEY_GOVERNANCE_INTEGRITY
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: MALICIOUS_SIGNER
    assets:
      - REFID: SQUADS_MULTISIG
      - REFID: DF_UPGRADE_PROGRAMS
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:N/I:H/A:H'
    pentestTestable: false
    fullyMitigated: true
    countermeasures:
      - ID: FORMAL_VERIFICATION
        title: Formal Verification of Critical Governance Logic
        description: |
          Maintain mathematical proofs for critical safety and authorization properties
          covering proposal lifecycle, threshold enforcement, and execution constraints.

          Enforce verification as a release gate so changes cannot ship without updated
          proofs and independent review.
        inPlace: true
        public: true
        operational: false

  - ID: MUTABLE_PROGRAM_RISK_FOR_PRIVILEGED_CONTROL
    title: Mutable Program Risk for Privileged Control
    attack: |
      An attacker attempts to introduce malicious behavior by targeting a mutable Squads
      deployment path, or by tricking operators into interacting with a mutable/incorrect
      program instance rather than the immutable v4 instance.

      If successful, attacker-controlled logic could alter proposal validation or privileged
      execution behavior for vault program upgrades.
    threatType: Elevation of Privilege
    impactDesc: |
      Governance trust assumptions fail if privileged operations are routed through
      mutable or non-canonical code:

      - Unauthorized logic changes in upgrade control plane
      - Bypass of expected governance guarantees
      - Potential persistent compromise of upgrade authority for all programs

    impactedSecObj:
      - REFID: PROGRAM_INTEGRITY
      - REFID: KEY_GOVERNANCE_INTEGRITY
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: MALICIOUS_SIGNER
    assets:
      - REFID: SQUADS_MULTISIG
      - REFID: UPGRADE_AUTHORITY_PDA
      - REFID: DF_UPGRADE_PROGRAMS
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:C/C:N/I:H/A:H'
    pentestTestable: true
    fullyMitigated: true
    countermeasures:
      - ID: V4_IMMUTABILITY_ENFORCEMENT
        title: Enforce Immutable v4 Program Usage
        description: |
          Use only the immutable Squads v4 program instance (immutable since November 2024)
          for all privileged upgrade workflows.

          Add startup and CI checks that verify:

          - Program ID matches approved immutable v4 ID
          - Upgrade authority is permanently disabled for that program
          - Runtime configuration rejects non-approved alternatives
        inPlace: true
        public: true
        operational: false

  - ID: ROLE_PERMISSION_DRIFT_OR_ABUSE
    title: Role Permission Drift or Abuse
    attack: |
      A signer or administrator misassigns or abuses Squads roles (Proposer, Voter, Executor),
      creating excess privileges or collapsing separation of duties.

      Examples include granting execution rights too broadly, allowing self-approval flows,
      or bypassing intended proposal/vote/execution segregation.
    threatType: Elevation of Privilege
    impactDesc: |
      Role abuse can weaken governance controls and increase the chance of unauthorized
      privileged execution:

      - Separation-of-duties breakdown for upgrade authority
      - Increased insider abuse window across both programs
      - Reduced auditability and accountability

    impactedSecObj:
      - REFID: PROGRAM_INTEGRITY
      - REFID: KEY_GOVERNANCE_INTEGRITY
    attackers:
      - REFID: MALICIOUS_SIGNER
    assets:
      - REFID: SQUADS_MULTISIG
      - REFID: DF_UPGRADE_PROGRAMS
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:H/I:H/A:N'
    pentestTestable: true
    fullyMitigated: true
    countermeasures:
      - ID: ROLE_BASED_PERMISSION_MODEL
        title: Enforce Squads Role-Based Permissions
        description: |
          Enforce granular role separation across Proposer, Voter, and Executor
          with least-privilege defaults.

          Apply controls including:

          - No single member can complete proposal, approval, and execution alone
          - Role assignment reviews and periodic recertification
          - Alerting on role changes and high-risk role combinations
        inPlace: true
        public: true
        operational: true
        operator: Deployment Team
