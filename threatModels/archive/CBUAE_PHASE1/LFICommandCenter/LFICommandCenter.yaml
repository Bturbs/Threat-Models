ID: LFICommandCenter
schemaVersion: 2
title: LFI Command Center
parent: CBUAE_PHASE1


scope:
  description: LFI Command Center (TAN)

  assets:

    - ID: DF_LFI_WS_CON_CORDA
      title: LFI_WHOLESALE_CONNECTOR to LFI Corda Cluster connection
      type: dataflow
      description: |
        Connection from the LFI_WHOLESALE_CONNECTOR to the Corda Cluster VNode for initiating Flows
      inScope: true

    - ID: LFI_WHOLESALE_CONNECTOR
      title: LFI Command Center wholesale connector
      type: process
      description: |
        LFI Command Center wholesale connector
      inScope: true


    - ID: LFI_WCONNECTOR_VNODE_CRED
      title: Credentials (user/pass) to start LFI's VNode flows
      type: credential
      description: |
        Corda Cluster REST client Credentials (user/pass) to call/start LFI's VNode flows
      inScope: true
      properties:
        location: |
          VAULT, injected as sidecar to POD (RFI: how is this secret stored/injected)
        format: |
          test (user/password)
        length: |
          (RFI: what is the VNode user/pass format and requirements)
        type: text
      applicationRelated: true
      infrastructureRelated: false

analysis: |2

  Initially the solution may rely on a single Corda cluster manages by the CB. 
  This configuration changes the Threat Model mitigating many threats on the 
  [DF_P2P_WHOLESALE](#DF_P2P_WHOLESALE) dataflow but introducing others in the 
  [DF_LFI_WS_CON_CORDA](#DF_LFI_WS_CON_CORDA) dataflow.

threats:


  - ID: NODE_AUTH_FAIL_1
    title: Spoofing and elevation of privileges on Flows initiation
    assets:
      - REFID: DF_LFI_WS_CON_CORDA
    attackers:
      - REFID: LFI
    CVSS:
      vector: CVSS:3.1/AV:A/AC:L/PR:L/UI:N/S:U/C:L/I:H/A:H
    conditional: |
      Single Cluster Network (Shared Corda Cluster)
    threatType: Spoofing, Elevation of Privileges, Information Disclosure
    attack: |
      An authentication failure (e.g. shared credentials for any VNode: admin/admin) allows an LFI to act as a Central Bank,
      Including minting tokens etc.
    impactDesc: An LFI can act as another LFI or Central Bank
    impactedSecObj:
      - REFID: ZERO_TRUST
      - REFID: NON_REPUDIATION
      - REFID: MONETARY_INTEGRITY
    public: false
    fullyMitigated: false
    ticketLink: 
      https://r3-cev.atlassian.net/jira/software/c/projects/DW/boards/2020?selectedIssue=DW-1049
    countermeasures:
      - ID: PER_NODE_CLUSTER_AUTHX
        title: Per VNode REST credentials
        description: |
          Every VNode will have a different:

           - Cluster HTTP REST user
           - Secret credentials (user/password)
           - Filtered Allow-list REST URLS API ENDPOINTS (the VNode shotID is in the REST URL path and needs to be restricted 
           to every VNode User)
           - Allow configuration only for what Flows every VNode user can call.

           <br>There will be a REST cluster user that is only allowed to call flows with its own specific shortHash:
           https://localhost:8888/api/v1/flow/{{CommercialBank3-shortHash}}. This should not be confused with RBAC 
           as in [FLOW_INIT_REST_RBAC_CLUSTER_CONFIG](#FLOW_INIT_REST_RBAC_CLUSTER_CONFIG) that does not prevent an LFI to call 
           the same authorized flow pretending to be another identity (LFI, Issuer etc.)
           
           Code ref: val ownerKeys = memberLookup.myInfo().ledgerKeys in [REF](https://github.com/corda/digital-currencies/blob/6e5ee960cd3b2009f0bc485383bf33383fa1293e/workflows/src/main/kotlin/com/r3/dc/workflows/v1/token/balance/QueryTokenBalanceAppFlows.kt#L116)
           will infer the caller NVode from the PATH shortHash.
        inPlace: false
        public: false


  - ID: QUERY_BALANCE_INFO_DISCLOSURE
    title: Disclosure of token balance
    assets:
      # - REFID: DF_QUERY_BALANCE_FLOW
      - REFID: DF_LFI_WS_CON_CORDA
    attackers:
      - REFID: LFI
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N
    conditional: |
      Single Cluster Network (Shared Cluster)
    threatType: Information disclosure
    attack: |
      This is a specific example of [NODE_AUTH_FAIL_1](#NODE_AUTH_FAIL_1)
      An attacker calls query balance to get token balance of another VNode. 
      This could be done by changing the shortHash path param with the one of another Bank:
       https://localhost:8888/api/v1/flow/{{CommercialBank3-shortHash}}  

    impactDesc: An LFI can know the balance of another LFI
    impactedSecObj:
      - REFID: CONFIDENTIALITY
    public: false
    fullyMitigated: false
    countermeasures:
      - REFID: PER_NODE_CLUSTER_AUTHX
