    - ID: MONETARY_BASE_INTEGRITY
      title: Reliable monetary base
      description: |
        A reliable monetary base is expected according to the Central Bank's policies and knowledge.
        This ensures that the total amount of digital currency in circulation is accurately
         tracked and managed.
        The system should provide (and do not dispupt) mechanisms to monitor, audit,
         and report on the monetary base, ensuring transparency and trust in the digital currency system. 
         Additionally, it should include safeguards to detect and respond to any anomalies in the monetary base.

      contributesTo:
        - REFID: INTEGRITY
        - REFID: AVAILABILITY
      group: Business specific

    - ID: COIN_OWNERSHIP_GUARANTEE
      title: LFI cannot interfere with retail coin ownership
      description: |
        An LFI cannot arbitrarily interfere with retail coin ownership in ways other than those implied by enforcing Central Bank policies; for example, via Corda contracts. An LFI cannot arbitrarily seize or change retail coin ownership and functionality, opposing those central bank-defined policies.  

        In retail CDBC systems, as defined in “The technology of retail central bank digital currency", retail ownership of a digital coin/token (private key signature) tends to achieve this objective by having trust-less intermediaries (LFIs) while also exposing the user to different threats (for example, the risk of losing ownership by losing private keys).  

        On the other hand, retail coin ownership, linked to an account with identity and authentication, does not tend to automatically achieve this goal, as the retail user needs to trust intermediaries (such as LFIs). In this latter case, compromised or colluding intermediaries can interfere with the owner’s coins, so that specific countermeasures need to be defined. 
      contributesTo:
        - REFID: INTEGRITY
        - REFID: AVAILABILITY
        - REFID: TRUSTLESS_CONTRACTS_EXECUTION
      group: Business specific

    - ID: DEFENSE_IN_DEPTH
      title: Defense in depth
      description: |
        Preventative defence measures should be implemented at multiple layers; 
        for example, across the network, application, and data access layers.
      contributesTo:
        - REFID: COMPLIANCE
      group: Architectural

    - ID: ZERO_TRUST
      title: Zero trust
      description: |
        Zero-trust security practices including strong authentication, 
        least privilege, network segmentation, and continuous validation of 
        identity and trust, and so on.
      contributesTo:
        - REFID: COMPLIANCE
      group: Architectural

    - ID: MINIMAL_RISK_SURFACE
      title: Minimal risk surface
      description: |
        The central bank has designed the CBDC
        architecture in such a way as to minimize the
        attack surface for sensitive data and CBDC
        value; for example, by reducing the number of
        parties in the ecosystem that hold financial value
        or that store/process unencrypted sensitive data.
        De-scoping using anonymous IDs is another way of minimizing risk 
        surface.
      contributesTo:
        - REFID: COMPLIANCE
      group: Architectural

    - ID: PRINCIPLE_LEAST_PRIVILEGE
      title: Principle of Least Privilege
      description: |
        The *principle of least privilege* (PoLP) is an information security concept that states that 
        users should only have access to the minimum amount of data and resources they need to perform their jobs. 
        It is considered a best practice for cybersecurity and is a key component of zero trust network access
      contributesTo:
        - REFID: COMPLIANCE
      group: Architectural

    - ID: SEGREGATION_DUTIES
      title: Segregation of Duties
      description: |
        *Segregation of duties* (SoD) in software architectures refers to the design principle of dividing tasks
        and responsibilities among multiple roles or systems to prevent any single entity from having unchecked control. 
        This minimizes risks such as fraud, errors, or abuse by ensuring that critical operations require 
        collaboration and oversight, thereby enhancing security, compliance, and accountability.
      contributesTo:
        - REFID: COMPLIANCE
      group: Architectural

    - ID: ADMIN_ATTACK_RESILIENCE
      title: Admin attack resilience
      description: |
        The system is designed in a way that an insider user with administrative privileges is not able to compromise the security of the system 
        (other than partial AVAILABILITY). For example, the user cannot impersonate other users, tamper the data, and so on. 
      contributesTo:
        - REFID: PRINCIPLE_LEAST_PRIVILEGE
        - REFID: SEGREGATION_DUTIES
      group: Architectural

