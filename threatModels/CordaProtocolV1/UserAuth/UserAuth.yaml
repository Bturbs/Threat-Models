        public: true
        operational: true
  - ID: KEY_ROTATION_REVOCATION_FAILURE
    title: Key Rotation and Revocation Failures
    attack: |
      Stale or compromised keys remain valid in the multisig set due to
      operational failures:

      - **Departed signers retain keys:** Personnel changes not reflected in
        on-chain multisig membership
      - **No emergency revocation process:** Suspected key compromise cannot be
        addressed quickly
      - **Stale keys weaken trust model:** Over time, the effective trust
        distribution degrades as signers change roles or leave the organization
      - **Rotation ceremony failures:** Key rotation procedures not documented,
        not rehearsed, or botched during execution

      Affects all multisig roles. Single-signer roles (ACL Authority, Freeze
      Authority) require full key replacement rather than member rotation.
    threatType: Elevation of Privilege
    impactDesc: |
      Former signers or holders of compromised keys can:

      - Participate in threshold signing without authorization
      - Reduce effective threshold (departed signers' keys + fewer corrupted active signers)
      - Block emergency response if key replacement procedures fail
      - Accumulate stale keys over time, creating growing attack surface
