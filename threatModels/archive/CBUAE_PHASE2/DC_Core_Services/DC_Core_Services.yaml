ID: DC_Core_Services
schemaVersion: 2
parent: CBUAE_PHASE2

scope:
  description: |
    Digital Currency (DC) Core Services manage the issuance, redemption, and transfer of digital currencies,
    integrating with Collateral Management Systems (CMS) to ensure every DC operation is 
    backed by corresponding collateral movement. Supports domestic retail and cross-border transactions via mBridge.

    **Refs:** [HLD - 4.3 Solution Design/Core Business Services](#HLD), [LLD - 1 Wallet Services](#LLD), [LLD - 7 Corda Distributed Ledger Technology](#LLD)

  assets:

    - ID: COLLATERAL_MANAGEMENT_SYSTEM
      type: process
      description: |
        Collateral Management System (CMS) is a system that manages the collateral used 
        to back digital currency issuance, redemption, and transfer operations. 
        It ensures that every DC operation is backed by corresponding collateral movement.
        The CMS is provided by the Central Bank and is intended to be Flexcube.

        **Refs:** [HLD - 5.3.18 Solution Analysis/Design decisions/Central reserve ledger (FlexCube)](#HLD)
      inScope: false

    - ID: CMS_CONNECTOR
      type: process
      description: |
        Connector that integrates the Digital Currency Core Services with the 
        Collateral Management System.
        The connector is also called `Flexcube Connector` and it 
        is in scope but not for this portion of analysis.

        **Refs:** [HLD - 4.3 Solution Design/Core Business Services](#HLD)
      inScope: false

    - ID: MBRIDGE
      type: system
      description: |
        The Multiple Central Bank Digital Currency Bridge (mBridge) project is a cross-border CBDC payments system. 
        The project aims to provide faster, cheaper, and transparent cross-border payment system compared to the existing systems. 
        mBridge supports the following use-cases:

        - Issuance and Redemption of mBridge CBDC between Central Bank and Commercial Banks.
        - Cross-border payment between Commercial Banks using local CBDC.

        The mBridge network consists of central bank nodes, which are all connected, and FI nodes, which are connected just to their corresponding central bank. 
        This design is focused on connecting the mBridge nodes for one central bank and their corresponding FIs to R3's DC product suite. 
        The aim is to coordinate issuance, redemption and transfer requests on mBridge with collateral movements in the collateral management system. 
        The mBridge network and connector is not in scope for this portion of threat model analysis.

        **Refs:** [HLD - 4.1.3 Solution Design/System overview/Functional view](#HLD)
      inScope: false
    - ID: MBRIDGE_CONNECTOR
      type: process
      description: |
        Connector that integrates the Digital Currency Core Services with the mBridge network.
        It is in scope but not for this portion of analysis.

        **Refs:** [HLD - 4.3 Solution Design/Core Business Services](#HLD)
      inScope: false
    - ID: DF_DCCS_CLIENT_REQ
      type: dataflow
      description: |
        Client request to Digital Currency Core Services (API).

        **Refs:** [LLD - 1.4.1 Wallet Service implementation/API](#LLD)
      inScope: true


analysis: |2

  <img src="img/DC_CS_1.png"/>

