ize="14" font-weight="bold" lengthAdjust="spacing" textLength="37.0371" x="1109" y="331.1211">Note:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="202.5146" x="1109" y="347.6094">Must be whitelisted to receive</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="204.3057" x="1109" y="364.0977">vTokens. Creates receipts and</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="71.0322" x="1109" y="380.5859">proposals.</text></g><!--class ManagerWallet--><g class="entity" data-qualified-name="ManagerWallet" data-source-line="66" id="ent0005"><rect fill="#D3D3D3" height="155.5508" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.5;" width="232.2813" x="3593" y="223.5"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="46.5586" x="3685.8613" y="240.1016">&#171;wallet&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="99.3057" x="3659.4878" y="256.168">ManagerWallet</text><line style="stroke:#000000;stroke-width:0.5;" x1="3594" x2="3824.2813" y1="264.1211" y2="264.1211"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="118.1318" x="3599" y="281.6563">+pubkey: Pubkey</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="161.6973" x="3599" y="298.1445">+privateKey: privateKey</text><line style="stroke:#000000;stroke-width:1;" x1="3594" x2="3824.2813" y1="305.0977" y2="305.0977"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="50.8252" x="3599" y="322.6328">Owner:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="109.8535" x="3654.2549" y="322.6328">System Program</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="37.0371" x="3599" y="339.1211">Note:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="220.2813" x="3599" y="355.6094">Manages liquidity pool deposits,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="202.8564" x="3599" y="372.0977">withdrawals, and rebalancing.</text></g><g class="entity" data-qualified-name="GMN110" data-source-line="647" id="ent0111"><path d="M5511.5,1256 L5511.5,1357.8633 A0,0 0 0 0 5511.5,1357.8633 L5702.9663,1357.8633 A0,0 0 0 0 5702.9663,1357.8633 L5702.9663,1266 L5692.9663,1256 L5609.3339,1256 L3126.2229,1212.2032 L5601.3339,1256 L5511.5,1256 A0,0 0 0 0 5511.5,1256" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M5692.9663,1256 L5692.9663,1266 L5702.9663,1266 L5692.9663,1256" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="108.6655" x="5517.5" y="1273.5684">Security Critical:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146.853" x="5517.5" y="1288.8789">All vToken minting and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.3013" x="5517.5" y="1304.1895">redemption operations</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="145.8755" x="5517.5" y="1319.5">must validate whitelist.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.4663" x="5517.5" y="1334.8105">Account closed on removal</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="103.6509" x="5517.5" y="1350.1211">(rent reclaimed).</text></g><g class="entity" data-qualified-name=