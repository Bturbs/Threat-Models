        Network Nodes can run in different Corda Clusters.

  attackers:

    - ID: TokenDefinitionAuthority
      title: Token Definition Authority
      description: |
        Digital Currencies CorDapp VNode identity having permissions to:

        - ActivateTokenDefinition
        - CreateTokenDefinitionAppFlows
        - DecommissionTokenDefinition (RFI: is this in scope for 'v1'/protocol=2 version?)
        - QueryTokenDefinitionStates

        [REF](https://r3-cev.atlassian.net/wiki/spaces/DC/pages/4495671381/Digital+Currencies+RBAC+Design+Considerations)

      inScope: false

    - ID: TokenIssuingEntity
      title: Token Issuing Entity
      description: |
        Digital Currencies CorDapp VNode identity having permissions to:

        - QueryTokenBalance
        - BurnToken
        - IssueToken
        - MintToken
        - QueryTokenManagementApproval
        - UpdateTokenManagementApproval

      inScope: false

    - ID: Bank
      title: Bank / LFI
      description: |
        Digital Currencies CorDapp VNode identity having permissions to:

        - QueryTokenDefinitionStates
        - RequestTokenDefinition
        - ShareTokenDefinition
        - QueryTokenBalance
        - RedeemToken
        - TransferToken
        - CreateTokenManagementApproval
        - CreateTokenTransferApproval
        - QueryTokenManagementApproval
        - QueryTokenTransferApproval
        - UpdateTokenTransferApproval       
      inScope: true

    - ID: Auditor
      title: Bank / LFI CorDapp
      description: |
        Digital Currencies CorDapp VNode identity having permissions to:

        - QueryTokenDefinitionStates
        - QueryTokenBalance
        - QueryTokenManagementApproval
        - QueryTokenTransferApproval
      inScope: true
analysis: |
  *Create Token Definition Flow STRIDE analysis*
  <img src="img/CreateTokenDefinition1.svg"/>

  *Main CorDapp roles are\:* 

  - TokenDefinitionAuthority
  - TokenIssuingEntity
  - Bank (LFI)
  - Auditor

  ref: https://r3-cev.atlassian.net/wiki/spaces/DC/pages/4495671381/Digital+Currencies+RBAC+Design+Considerations

    TODO: threat: according to this code: com/r3/dc/contract/utxo/token/v1/Token.kt:94
      the method isFungible between two tokens require that both tokens points to the same TokenDefinition (State Ref),
       that may make two tokens, i.e. both denominated in "GBP", to be non isFungible. Check the use of this contract method
       in the code.

    Note: Smart contract code verifying overall inputs quantity = outputs quantity: 
    com.r3.corda.ledger.utxo/corda-ledger-extensions-fungible/0.9.0/13e2c4d2e9fbc6be1aa2e5280fde90188df39685/corda-ledger-extensions-fungible-0.9.0-sources.jar!/com/r3/corda/ledger/utxo/fungible/FungibleConstraints.java:111
    not using double spending (inputs are not spent check) at the notary logic call (and, maybe at some more base contract validation level)

    TODO threat Elev of Priv...: in create transfer token request responder flow (likely the CB approving), the CB signs all the states while only checking one state value
      ref: com/r3/dc/workflows/v1/approval/transfer/create/CreateTransferRequestFlowResponder.kt:42 as the \$Initiator"
      if the initiator (running it own cluster) adds states to the tx in the session those would be signed by the CB without specific checks
      (that means, if contractually valid). But given the lack of contract authorization logic, the initiator may include any type of valid states, including minting states etc.

    Note: authorization options as now: <br/> 
    
    - use hardcoded net.corda.v5.base.types.MemberX500Name for special user/roles, 
    for example for #TokenIssuingEntity and #TokenDefinitionAuthority
    this may not be available at the contract level as identities are of type java.security.PublicKey
    but MemberX500Name are resolvable at Flow Responder code level, for example in com.r3.dc.workflows.v1.approval.issuance.create.CreateIssuanceRequestFlowResponder:
    <code>
            val expectedInitiator = memberLookup.lookupOrThrow(issuanceRequest.requester).name
            checkCorrectInitiator(session, expectedInitiator)
    </code>

threats:

  - ID: UNAUTH_CREATE_TOKEN_DEF_T1
    title: Unauthorized Create Token Definition Flow on Central Bank Node API
    assets:
      - REFID: DF_CREATE_TOKEN_DEF1
    attackers:
      - REFID: TokenIssuingEntity
      - REFID: Bank
      - REFID: Auditor
    CVSS:
      vector: CVSS:3.1/AV:A/AC:L/PR:L/UI:N/S:U/C:N/I:L/A:N/CR:H/IR:H/AR:H
    threatType: Elevation of Privileges
    attack: |
      Unauthorized Create Token Definition on Central Bank Node API by another Cluster HTTP users
    impactDesc: Other users or network participant can create a Token definition
    impactedSecObj:
      - REFID: INTEGRITY

    public: true
    fullyMitigated: true
    countermeasures:
      - ID: FLOW_INIT_REST_RBAC_CLUSTER_CONFIG
        title: RBAC enforced at the HTTP cluster endpoint
        description: |
          Only expected VNode user can call the expected initiating flow.
          Admin (cluster operator) is not able to call any flow at all.

          ref: ()[https://docs.r3.com/en/platform/corda/5.0/deploying-operating/config-users/permission-system-entities.html#permission]
          ref: https://r3-cev.atlassian.net/wiki/spaces/DC/pages/4489150505/RBAC+API+permission+string

          The cluster operator needs to configure specific permission via REST API, here's an example:
          ```
          <br/>
          {<br/>
          "groupVisibility": null,<br/>
          "permissionString": "StartFlow:com.r3.dc.workflows.v1.tokendefinition.create.CreateTokenDefinitionAppFlows$Initiator\\$Initiator",<br/>
          "permissionType": "ALLOW",<br/>
          "virtualNode": null<br/>
          }
          ```
        operational: true
        operator: CLUSTER_OPERATOR
        inPlace: false
        public: true


  - ID: UNAUTHZ_CREATE_TOKEN_DEF_FINALIZE_T1
    title: Unauthorized Create Token Definition Flow by another CorDapp 
      participant over P2P
    assets:
      - REFID: DF_CREATE_TOKEN_DEF_FINALIZE_LFI
    attackers:
      - REFID: TokenIssuingEntity
      - REFID: Bank
      - REFID: Auditor
    CVSS:
      vector: CVSS:3.1/AV:A/AC:L/PR:L/UI:N/S:U/C:N/I:L/A:N
    threatType: Elevation of Privileges
    attack: |
      Unauthorized Create Token Definition Flow by another CorDapp participant over P2P, for example a [BANK](#Bank) and not the 
      supposed [Token Definition Authority](#TokenDefinitionAuthority) (usually the Central Bank).
      An LFI or BANK can simply call the Flow ()[DF_CREATE_TOKEN_DEF_FINALIZE_LFI] on their Cluster/Node. 
      By design RBAC on the corDapp network participant REST endpoint is not in the control of the Central Bank Cluster (MULTI_CLUSTER_NETWORK),
       and cannot be enforced by the Central Bank.
    impactDesc: Other users or network participant without 
      [](#TokenDefinitionAuthority) rights can create a Token definition
    impactedSecObj:
      - REFID: INTEGRITY
# @David is this attack similar to token definition update. They are both have the same mitigation techniques.  
    public: false
    fullyMitigated: false
    countermeasures:
      - ID: VALIDATION_NOTARY_LOGIC
        title: Notary enforces authorization on Central Bank requests
        description: |
          The notary knows that only the Central bank Identity can create Token Definitions states, 
          and do not notarize any attempt by other parties.

        operational: false
        inPlace: false
        public: true

      # - ID: CHECK_AUTHOR_ON_ANY_TOKEN_DEF_RELATED_FLOW
      #   title: RBAC enforced at the CorDapp CPI Flow code level (Hardcoded Identity)
      #   description: |
      #     All participants know the Central Bank Identity (Hardcoded in the CPI) and validate 
      #     the Token Definition Author at every CorDapp operation. Every participant enforces this authorization inside the Flow logic. 
      #   operational: false
      #   inPlace: false
      #   public: true

      - ID: CORDAPP_TOKEN_DEF_CREATION_FLOW_AUTHZ
        title: CorDapp logic enforces Authorization at Token Definition creation
          Flow time
        description: |
          CorDapp logic (CPI) only allows Central Bank to create Token Definition.
          Every participant enforces this authorization inside the Flow logic. 
          It could be achieved by leveraging some kind of CorDapp Role defined by the MGM (RFI: are CorDapp ROLES feature active in Corda 5 yet) 
          or by hardcoding the identity of the  Central bank inside the CorDapp CPI itself.
        operational: false
        inPlace: false
        public: true



  - ID: CREATE_TOKEN_DEF_FINALIZE_DOS1
    title: Unresponsive Flow participants (observers) block the transaction 
      finalization
    assets:
      - REFID: DF_CREATE_TOKEN_DEF_FINALIZE_LFI
    attackers:
      - REFID: TokenIssuingEntity
      - REFID: Bank
      - REFID: Auditor
    CVSS:
      vector: CVSS:3.1/AV:A/AC:L/PR:L/UI:N/S:U/C:N/I:L/A:N
    threatType: Denial of Service
    attack: |
      <q>  observers. If any of them fails to perform this task or is unavailable, it may result in delays or incomplete updates across the network, which will prevent the update of the token definition as they flow might not complete.
      </q>[REF](https://r3-cev.atlassian.net/wiki/spaces/DC/pages/4480958571/Share+Token+Definition+state+updates)
       
    impactDesc: Other users or network participant can obstruct the Token 
      Definition Creation
    impactedSecObj:
      - REFID: AVAILABILITY
    public: false
    fullyMitigated: false
    countermeasures:
      - ID: TODO_CREATE_TOKEN_DEF_FINALIZE_DOS1_CM
        title: CREATE_TOKEN_DEF_FINALIZE_DOS1 countermeasure TODO RFI
        description: |
          (RFI: what solution is finally implemented? https://r3-cev.atlassian.net/wiki/spaces/DC/pages/4480958571/Share+Token+Definition+state+updates)
        operational: false
        inPlace: false
        public: true

      - ID: HARDCODED_TOKEN_DEFINITION
        title: Hard-coded Token definition in the CPI
        description: |
          By using the Token Definition(s) as a constant, there are not problem on status synchronization. 
          Updated to Token Definition would require a new CPI upgrade process. 
        operational: false
        inPlace: false
        public: true

  - ID: P2P_ELEVATION_OF_PRIVILEGES
    title: Elevation of privileges of participant nodes
    assets:
      - REFID: DF_P2P_WHOLESALE
    attackers:
      - REFID: Bank
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:H/A:H
    conditional: |
      Multiple Clusters Network (as no P2P from Non Central Bank Corda Nodes are present in single cluster network)
    threatType: Elevation of Privileges
    attack: |
      CorDapp participants, including LFI/Banks, can call arbitrary Flows Responders by forging and tampering P2P protocol calls.
      <br/> Elevation of Privileges over P2P (only HTTP REST/RPC enforces strict configurable flow authorization)<br/>
    impactDesc: Loss of integrity and availability due to unexpected Flows 
      Responder being called
    impactedSecObj:
      - REFID: ZERO_TRUST
      - REFID: NON_REPUDIATION
    public: false
    fullyMitigated: false
    countermeasures:
      - ID: SINGLE_CLUSTER_NETWORK
        title: Single Cluster network
        description: |
          The whole Corda Network for wholesale CBDC runs on a single cluster that is controlled by a trusted party (UAE Central Bank)
          there will be authorization at the RPC level defining what nodes can run a specific flow.
        inPlace: true
        public: true
        operational: true
        operator: INFRASTRUCTURE_OPERATOR

      - ID: FLOW_LEVEL_AUTHORIZATION
        title: Flow Level authorization
        description: |
          - use hardcoded net.corda.v5.base.types.MemberX500Name for special user/roles, 
           for example for #TokenIssuingEntity and #TokenDefinitionAuthority
           this may not be available at the contract level as identities are of type java.security.PublicKey
           but MemberX500Name are resolvable at Flow Responder code level, for example in com.r3.dc.workflows.v1.approval.issuance.create.CreateIssuanceRequestFlowResponder:
           <code>
                   val expectedInitiator = memberLookup.lookupOrThrow(issuanceRequest.requester).name
                   checkCorrectInitiator(session, expectedInitiator)
           </code>
        inPlace: false
        public: true

      - ID: CONTRACT_LEVEL_AUTHORIZATION
        title: Ledger and contracts level authorization
        description: |
          The current framework does not support explicit authorization (roles) for Ledger entities (java publicKey).
          One approach would to be include a reference to a role inside the signed TX. This role reference would be a TX State
           (no much else belongs to a self referenced Corda Ledger). For example the backchain validation of the role/State would be to linked a CPI 
           hardcoded public Key that defines Policy administrator. 
        inPlace: false
        public: true


  - ID: FLOW_RESPONDER_VALIDATION_FAIL1
    title: Insufficient Validation on Flow Responders
