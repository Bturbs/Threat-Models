ID: SolanaTrustedNotary
schemaVersion: 2
title: Solana Trusted Notary
version: 0.1
# authors: |
#    David Cervigni (derived from Solana Notary design document)
parent: CordaSolanaToolkit

scope:
  description: |
    This threat model covers the design of a Corda notary service that is backed by a Solana program.
    In this "Trusted Model", a Corda notary node still exists, but instead of using a traditional relational database for state tracking, it interacts with a Solana cluster to record and verify the spendable status of Corda states.
    The primary function is to perform notarisation (preventing double-spends) by leveraging Solana's blockchain capabilities.
    A key feature enabled by this architecture is the atomic invocation of other Solana programs (CPIs) alongside Corda transaction notarisation.
    This document focuses on the Solana-side program (`commit` instructions) and its interaction with the Corda notary node.

  assets:
    # Systems / Components
    - ID: SOLANA_NOTARY_PROGRAM
      type: system
      title: Solana Notary Program
      description: |
        The on-chain Solana program containing the logic for `commit`, 
        and other administrative instructions. It manages NotarisedTransactionAccount PDAs.
      inScope: true

    - ID: CORDA_NOTARY_NODE_SOLANA
      type: system
      title: Corda Notary Node (Solana Integrated)
      description: |
        The Corda notary node in the trusted model that interacts with the Solana Notary Program instead of a local database. It constructs and submits Solana transactions for notarisation.
      inScope: true

    - ID: SOLANA_CLUSTER
      type: system
      title: Solana Cluster
      description: |
        The underlying Solana blockchain network that executes the Solana Notary Program and stores its state.
      inScope: false

    - ID: NOTARISED_TRANSACTION_ACCOUNT_PDA
      type: data # Stored on Solana, so data
      title: NotarisedTransactionAccount PDA
      description: |
        A Program Derived Address (PDA) on Solana storing the spent status (bitset) of output states for a specific Corda transaction ID, and its time window.
      inScope: true

    - ID: NOTARY_AUTHORIZATION_PDA
      type: data
      title: Notary Authorization PDA
      description: |
        Every authorized notary is represented by an on-chain account created using a Program Derived Address (PDA). In this project, the PDA is derived using a seed (the string literal for notary authorization) combined with the notary's public key. The resulting PDA is used as the account address where the authorization data—in particular the notary’s public key—is stored. This ensures the account is controlled by the program and ties the authorization specifically to the intended notary.
      inScope: true
    # - ID: JUMBO_COMMIT_PARAMETERS_ACCOUNT_PDA
    #   type: data
    #   title: JumboCommitParametersAccount PDA
    #   description: |
    #     A temporary PDA used to store encrypted parameters for Corda transactions that are too large to fit in a single Solana transaction's instruction data.
    #   inScope: true
    # - ID: CROSS_NETWORK_COMMIT_PARAMETERS_ACCOUNT_PDA
    #   type: data
    #   title: CrossNetworkCommitParametersAccount PDA
    #   description: |
    #     A temporary PDA used to store encrypted parameters for one leg of a cross-Corda-network atomic notarisation.
    #   inScope: true
    # - ID: NOTARY_DAO
    #   type: system
    #   title: Notary DAO (Global Model)
    #   description: |
    #     A Decentralized Autonomous Organization responsible for administering the global Solana Notary Program, including network registration and parameter setting.
    #   inScope: true # For Global Trusted Model
    # - ID: EXTERNAL_SOLANA_PROGRAM
    #   type: system
    #   title: External Solana Program (CPI Target)
    #   description: |
    #     Other Solana programs that can be invoked atomically during the notarisation process via Cross-Program Invocation (CPI).
    #   inScope: true

    # Data
    - ID: COMMIT_INSTRUCTION_PARAMS
      type: data
      title: Commit Instruction Parameters
      description: |
        Data passed to the `commit` instruction, including input/reference StateRefs, time window, output hashes, component group hashes, Corda signatures, and potentially CPI instructions.
      inScope: true

    - ID: CORDA_STATE_REF_SOLANA
      type: data
      title: Corda StateRef (for Solana)
      description: |
        Tuple of Corda transaction_id (hash) and output_index, used by the Solana program to uniquely identify states.
      inScope: true

    - ID: SPENT_STATE_BITSET
      type: data
      title: Spent State Bitset
      description: |
        Bitset within NotarisedTransactionAccount PDA indicating whether each output state is spendable (1) or spent (0).
      inScope: true

    - ID: CORDA_TX_SIGNATURES_FOR_SOLANA
      type: data
      title: Corda Transaction Signatures (for Solana)
      description: |
        Ed25519 signatures from Corda transaction participants, verified by the `commit` instruction against the derived Corda transaction ID.        
      inScope: true

    - ID: CPI_INSTRUCTIONS_DATA
      type: data
      title: CPI Instructions Data
      description: |
        Serialized Solana `Instruction` data to be executed via CPI as part of the `commit` process.
      inScope: true
    # - ID: ENCRYPTED_JUMBO_PARAMETERS
    #   type: data
    #   title: Encrypted Jumbo Transaction Parameters
    #   description: |
    #     Corda transaction parameters (inputs, references, etc.) encrypted and stored in JumboCommitParametersAccount PDA.
    #   inScope: true
    # - ID: ENCRYPTED_X_NETWORK_PARAMETERS
    #   type: data
    #   title: Encrypted Cross-Network Transaction Parameters
    #   description: |
    #     Parameters for a leg of a cross-network transaction, including required signers, encrypted and stored in a CrossNetworkCommitParametersAccount PDA.
    #   inScope: true

    # - ID: SHARED_ENCRYPTION_KEY_X_NETWORK
    #   type: credential
    #   title: Shared Encryption Key (Cross-Network)
    #   description: |
    #     AES-GCM key derived from a shared secret, used to encrypt/decrypt parameters for cross-network notarisation.
    #   inScope: true

    # - ID: NETWORK_ID_GLOBAL
    #   type: data
    #   title: Network ID (Global Model)
    #   description: |
    #     Identifier (e.g., u16) assigned to each Corda network using the global notary program, stored in NotarisedTransactionAccount PDAs.
    #   inScope: true

    - ID: STN_ADMIN_PUBLIC_KEY
      type: key#
      title: Solana Notary Program Admin Public Key
      description: |
        The Solana public key authorized to perform administrative functions on the
         Solana Notary Program (e.g., held by network operator or DAO).
      inScope: true
      properties:
        - name: type
          value: Ed25519
        - name: lenght
          value: 256 bits
        - name: Key Usage
          value: Administrative functions for the Solana Notary Program

    - ID: STN_ADMIN_PRIVATE_KEY
      type: key
      title: Solana Notary Program Admin Private Key
      description: |
        The private key corresponding to the Solana [Notary Program admin public key](#STN_ADMIN_PUBLIC_KEY),
         used for signing administrative transactions.
      inScope: true
      properties:
        - name: type
          value: Ed25519
        - name: length
          value: 256 bits
        - name: Key Usage
          value: Administrative functions for the Solana Notary Program

    - ID: STN_PUBLIC_KEY
      type: key
      title: Solana Notary Program Public Key
      description: |
        The public key of the Solana Notary Program, used to derive PDAs (TODO verify this) and verify program signatures.
        (STN_ADMIN_KEY)[] can called authorize_notary with this key.
      inScope: true
      properties:
        - name: type
          value: Ed25519
        - name: length
          value: 256 bits

    - ID: STN_PRIVATE_KEY
      type: key
      title: Solana Notary Program Private Key
      description: |
        Private key on an [STN_PUBLIC_KEY](#STN_PUBLIC_KEY) that is used to sign notarizatio instructions.
      inScope: true
      properties:
        - name: type
          value: Ed25519
        - name: length
          value: 256 bits

    - ID: ADMIN_PDA
      type: data
      title: Admin PDA
      description: |
        A Program Derived Address (PDA) that holds the admin key for the Solana Notary Program, created during initialization.
        This PDA is used to validate administrative actions and ensure only the
         designated admin can authorize or revoke notaries.
      inScope: true

    # Dataflows
    - ID: NOTARY_NODE_TO_SOLANA_PROGRAM
      type: dataflow
      title: Corda Notary Node to Solana Notary Program
      description: |
        Submission of `commit` (or jumbo/cross-network commit) instructions and parameters 
        from the Corda Notary Node to the Solana Notary Program.
      inScope: true

    - ID: ADMIN_TO_SOLANA_PROGRAM
      type: dataflow
      title: Administrator to Solana Notary Program
      description: |
        Invocation of administrative instructions like `authorize_notary`, `initialize` by the program administrator (Network Operator or DAO).
      inScope: true
    - ID: SOLANA_PROGRAM_CPI_CALL
      type: dataflow
      title: Solana Notary Program to External Solana Program (CPI)
      description: |
        Cross-Program Invocation from the Solana Notary Program's `commit` instruction to another Solana program.
      inScope: true
    - ID: DF_STN_INIT_PROGRAM
      type: dataflow
      title: Initialize Notary Program
      description: |
        Dataflow for initializing the Solana Notary Program, including creating required PDAs, 
        setting initial parameters, and registering administrator accounts.

        The program creates an administration PDA as part of its initialization (the owner of the program is not the caller by default).
         The [ADMIN_PDA](#ADMIN_PDA) is generated using a fixed seed (e.g., `"\admin\\"`) and is funded and assigned
          based on the initializer's signature during the `Initialize` instruction. The [ADMIN_PDA](#ADMIN_PDA) then holds
           the admin key, and the program logic later uses it to validate that only the designated admin
            can authorize or revoke notaries. So yes, the admin PDA is established during initialization,
             and the program assigns its special rights based on that identity.
      inScope: true

    - ID: DF_STN_REVOKE_NOTARY
      type: dataflow
      title: Revoke Notary Account
      description: |
        Dataflow for revoking a notary account by the program administrator, removing it from the list of authorized notaries.
        This is done by calling the `revoke_notary` instruction with the notary's public key.
      inScope: true

    - ID: DF_STN_SUBMIT_REQUEST
      type: dataflow
      title: Submit Notarisation Request
      description: |
        Dataflow from Corda Participant to Corda Notary Node, submitting notarisation requests with Corda transaction parameters.
      inScope: true
    - ID: DF_STN_INVOKE_COMMIT
      type: dataflow
      title: Invoke Commit Instruction
      description: |
        Dataflow from Corda Notary Node to Solana Notary Program, invoking the `commit` instruction with notarisation parameters.
      inScope: true
    - ID: DF_STN_CHECK_PDA_EXISTENCE
      type: dataflow
      title: Check PDA Existence
      description: |
        Dataflow within Solana Notary Program to check for the existence of a NotarisedTransactionAccount PDA for the transaction ID.
      inScope: true
    - ID: DF_STN_RETURN_SUCCESS
      type: dataflow
      title: Return Success (Idempotency Ensured)
      description: |
        Dataflow from Solana Notary Program to Corda Notary Node, returning success if the PDA already exists, ensuring idempotency.
      inScope: true
    - ID: DF_STN_VALIDATE_TIME_WINDOW
      type: dataflow
      title: Validate Time Window
      description: |
        Dataflow within Solana Notary Program to validate the transaction's `time_window` against Solana's `Clock::get()?.unix_timestamp`.
      inScope: true
    - ID: DF_STN_RETURN_FAILURE
      type: dataflow
      title: Return Failure (Invalid Time Window)
      description: |
        Dataflow from Solana Notary Program to Corda Notary Node, returning failure if the transaction's time window is invalid.
      inScope: true

    - ID: DF_STN_CREATE_PDA
      type: dataflow
      title: Create NotarisedTransactionAccount PDA
      description: |
        Dataflow within Solana Notary Program to create a new NotarisedTransactionAccount PDA for the transaction ID.
        Pubkey::find_program_address is a Solana SDK function that deterministically derives a "Program Derived Address" (PDA) using a set of seed values and the program ID.
          The seeds used here are [REF](https://github.com/corda/enterprise/blob/e8b0346eae512a178c5316bfab74efdfe28ee645/solana-aggregator/notary-program/programs/corda-notary/src/commit.rs#L135C8-L136C1):

          - "corda_tx".as_bytes() — a static string indicating this is related to a "corda_tx".
          - txhash.as_ref() — the transaction hash, unique per transaction.
          - notary.key.as_ref() — the public key of the notary.
          - ctx.program_id is the ID of the smart contract (program).      
      inScope: true
    - ID: TX_PDA
      type: data
      title: Transaction PDA
      description: |
        The Program Derived Address (PDA) for the NotarisedTransactionAccount, derived from the transaction ID and notary public key.
        This PDA is used to store the spent state bitset and other transaction metadata.
        TODO: StateRef is a tuple of transaction_id (hash) and output_index, 
        which uniquely identifies a Corda state.
      inScope: true
    - ID: DF_STN_UPDATE_BITSET
      type: dataflow
      title: Update Spent State Bitset
      description: |
        Dataflow within Solana Notary Program to update the spent state bitset in the NotarisedTransactionAccount PDA.
      inScope: true
    - ID: DF_STN_DOUBLE_SPENDING_FAILURE
      type: dataflow
      title: Return Failure (Double Spending Detected)
      description: |
        Dataflow from Solana Notary Program to Corda Notary Node, returning failure if double spending is detected.
      inScope: true
    - ID: DF_STN_NOTARISATION_SUCCESS
      type: dataflow
      title: Return Success (Transaction Notarised)
      description: |
        Dataflow from Solana Notary Program to Corda Notary Node, returning success after successful transaction notarisation.
      inScope: true
    - ID: DF_STN_NOTIFY_RESULT
      type: dataflow
      title: Notify Notarisation Result
      description: |
        Dataflow from Corda Notary Node to Corda Participant, notifying the result of the notarisation process.
      inScope: true
    - ID: DF_STN_VERIFY_ACCOUNT_COUNT
      type: dataflow
      title: Verify Account Count
      description: |
        Dataflow within Solana Notary Program to verify the number of accounts passed in during the `commit` instruction.
        Ensures the correct number of accounts are provided for processing the transaction.
      inScope: true

    - ID: NOTARY_WALLET_STN
      type: credential
      title: Notary Wallet
      description: |
        Solana wallet owned by the authorized notary for the Corda network.
        Used to sign `Commit` instructions on the Solana Notary Program.
        Holds the public key that is authorized to perform notarization operations.
      inScope: true
      properties:
        location: Secure key storage, out-of-band management
        format: Ed25519 keypair (public + private key)
        publicKeyLength: 256 bits
        privateKeyLength: 256 bits
      applicationRelated: true
      infrastructureRelated: false

    - ID: ADMIN_WALLET_STN
      type: credential
      title: Admin Wallet
      description: |
        Solana wallet owned by the administrator of the Corda Notary program.
        Used to sign administrative instructions such as `Initialize`, `AuthorizeNotary`, `RevokeNotary`, and `CreateNetwork`.
        Controls the Authorization and Network PDA state.
      inScope: true
      properties:
        location: Secure key storage, out-of-band management
        format: Ed25519 keypair (public + private key)
        publicKeyLength: 256 bits
        privateKeyLength: 256 bits
      applicationRelated: true
      infrastructureRelated: false

    - ID: CORDA_NODE_CA_KEYPAIR_STN
      type: credential
      title: Corda Node CA Keypair
      description: |
        Node Certificate Authority keypair used to issue the node’s identity certificates
        for the Solana-integrated notary node.
      inScope: true
      properties:
        location: |
          nodekeystore.jks (alias: nodeca) or HSM-backed crypto service
        format: X.509 certificate + private key
        algorithm: RSA-2048/4096 or ECDSA P-256 (configurable)
        keyLength: 2048-4096 bits (RSA) or 256 bits (ECDSA)
      applicationRelated: false
      infrastructureRelated: true

    - ID: CORDA_LEGAL_IDENTITY_KEYPAIR_STN
      type: credential
      title: Corda Legal Identity Keypair
      description: |
        Legal identity signing keypair used by the notary node to sign Corda transactions.
      inScope: true
      properties:
        location: |
          nodekeystore.jks (alias: identity-private-key) or HSM-backed crypto service
        format: X.509 certificate + private key
        algorithm: RSA-2048/4096 or ECDSA P-256 (configurable)
        keyLength: 2048-4096 bits (RSA) or 256 bits (ECDSA)
      applicationRelated: true
      infrastructureRelated: false

    - ID: CORDA_TLS_KEYPAIR_STN
      type: credential
      title: Corda TLS Keypair
      description: |
        TLS keypair used by the notary node for node-to-node and RPC/TLS communication.
      inScope: true
      properties:
        location: sslkeystore.jks or messaging server SSL keystore (if Corda 
          Firewall is used)
        format: X.509 certificate + private key
        algorithm: RSA-2048/4096 or ECDSA P-256 (configurable)
        keyLength: 2048-4096 bits (RSA) or 256 bits (ECDSA)
      applicationRelated: false
      infrastructureRelated: true

  assumptions:
    - ID: R3_PROGRAM_DEPLOYMENT_AND_ADMIN
      description: |
        The Solana Notary Program is deployed and administered by R3 (the Corda platform maintainer).
        R3 performs the initial `initialize` instruction, becoming the single admin for the deployed program.
        Each Corda network operator that wishes to use this shared program instance must apply to R3 for network creation and notary authorization.
        This ensures a trusted bootstrapping phase and centralized governance of the program instance.
    - ID: SOLANA_INFRA_SECURE
      description: |
        The underlying Solana cluster is assumed to be secure, available, and correctly executing smart contracts according to its protocol. Solana's own consensus and security are out of scope of this specific model.
    - ID: TRUSTED_CORDA_NOTARY_NODE
      description: |
        In the "Trusted Model", the Corda Notary Node is trusted to correctly form and submit valid notarisation requests to the Solana Notary Program based on legitimate Corda transactions.
    - ID: TRUSTED_PROGRAM_ADMIN
      description: |
        The administrator of the Solana Notary Program (R3) is trusted to manage the program correctly and not abuse administrative privileges.
    - ID: CRYPTO_PRIMITIVES_SECURE
      description: |
        Cryptographic primitives used (SHA-256, Ed25519 signatures, AES-GCM encryption, KDFs) are assumed to be cryptographically secure and correctly implemented.
    - ID: CORDA_TX_COMPONENTS_GENUINE
      description: |
        The Corda transaction components (inputs, references, outputs, time window, signatures) provided to the `commit` instruction are assumed to be genuine parts of the Corda transaction being notarised. The `commit` instruction verifies their assembly and signatures.
    - ID: SOLANA_TX_FEES_EXIST
      description: |
        Standard Solana transaction fees and compute unit limits provide some baseline protection against trivial DoS attacks.
    - ID: CPI_TARGET_PROGRAM_SECURITY
      description: |
        The security of external Solana programs called via CPI is the responsibility of those external programs. The Notary Program ensures atomicity but not necessarily the internal security of the CPI target.
    - ID: STN_PROGRAM_SINGLE_CALLER
      description: |
        The notary program do not allow for other callers (e.g. Other Notaries in different Corda Networks or other participant)
        to execute calls, even if only for verification purposes.
  attackers:
    - ID: MALICIOUS_CORDA_PARTICIPANT_STN
      description: |
        A Corda network participant attempting to exploit the Solana Notary, e.g., by trying to double-spend, submit malformed requests to the Corda Notary Node, or find flaws in the Solana program logic via interactions.
      inScope: true
    - ID: COMPROMISED_CORDA_NOTARY_NODE_STN
      description: |
        The Corda Notary Node (Solana Integrated) is compromised, allowing an attacker to send arbitrary or malicious requests to the Solana Notary Program.
        Note: only attacks from a Notary to a different network are in scope (trusted for its own Corda network only)
      inScope: false
    - ID: MALICIOUS_SOLANA_PROGRAM_ADMIN_STN
      description: |
        An individual or entity with administrative control over the Solana Notary Program (e.g., network operator) acting maliciously.
      inScope: false
    - ID: ATTACKER_ON_SOLANA_NETWORK_STN
      description: |
        An attacker with capabilities on the Solana network (e.g., observing transactions, attempting to exploit Solana vulnerabilities, DoS Solana nodes) trying to impact the Notary Program.
      inScope: true

