  - ID: NON_AUDITABLE_CONFIG_API_CALLS
    title: Non auditable or tamperable logs for configuration API
    assets:
      - REFID: SSO_cred
      - REFID: DF_UsrMngAnyEndP
      - REFID: DF_adminPolicyEndP1
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:N
    attackers:
      - REFID: CLUSTER_OPERATOR
    threatType: Repudiation
    pentestTestable: true
    attack: |
      A malicious CLUSTER_OPERATOR temporarily changes configuration and perform an attack that can be also based on
      the temporary created identity. Then the CLUSTER_OPERATOR rolls the change back. 
      The attack cannot be traced back to the attacker user
      by verifying logs, creating a repudiation issues. 
    impactDesc: Repudiation
    impactedSecObj:
      - REFID: COMPLIANCE
      - REFID: CLUSTER_OPERATOR_PROTECTION
    public: true
    fullyMitigated: true
    countermeasures:
      - REFID: AUDITABLE_API_CALLS


  - ID: CACHED_PASSWORD_CHANGE
    title: Cached credential non evicted after credential rotation
    assets:
      - REFID: DF_ALL_HTTP_ENDP
      - REFID: CACHED_PASSWORD
    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:U/C:H/I:L/A:L
    threatType: Spoofing
    attack: |
      An attacker that compromises an account may be still able to access the account even after a password change. 
      A compromised password would still work even after it has changed in the database, as the old one it is still in 
      the unevicted in-mempory cache used by the REST_WORKER to authenticate clients.
    impactDesc: RPC broken authentication, ultimatelly compromising the security
      of the entire cluster
    impactedSecObj:
      - REFID: FULL_CIA
    public: true
    fullyMitigated: false
    pentestTestable: true
    countermeasures:
      - ID: CACHED_PASSWORD_EVICTION
        title: Password cache eviction/invalidation
        description: |
          Password cache invalidation on password update on all the HTTP_GATEWAY processes.
        inPlace: false
        public: true

