  - ID: HoldingIDCollision1
    title: Generated HoldingID collision
    impactDesc: VNode identity theft and denial of service
    impactedSecObj:
      - REFID: LEDGER_SPOOFING_PREVENTION
      - REFID: AVAILABILITY
    assets:
      - REFID: HoldingID
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H/MC:H/MI:H/MA:H
    threatType: Spoofing (caused by HoldingID collision)
    attack: |
      A attacker registrant, by controlling a malleable (chosen by the attacker) X500 registration part can craft a special
       X500 generating the same VNode ID of another present or future NEtwork participant.
      The entropy chosen for HoldingID is not enough to avoid collisions based on a controllable part of the attacker 
      (any malleability/parameter of a X.500 name). Given the hypothetical cost, this attack may be feasible.
      A single ASIC SHA-256 Bitcoin miner can generate around 2^44 hashes per second (Hash Rate: 13.5TH/s), 
      a collision may be generated in less than one minute, so it is considered not expensive. In this attack ehe nonce used to find
       the collision even maintaining
      X500 main fields (CN, O...) arbitrary could be PC (postal code) or an email alias part. 
    public: false
    fullyMitigated: true
    countermeasures:
      - ID: FULL_SHA_IDS
        title: Full SHA-256 for HoldingID
        description: |
          Use a full SHA-256 hash or at least a length than makes creating a collision identity un-economical
           for the attacker
        inPlace: false
        vulnManagementLink:
        public: true
      - ID: ID_COLLISION_CHECK
        title: HoldingID uniqueness check
        description: |
          Check uniqueness when onboarding a virtual Node, abort if not unique
          ref: https://github.com/corda/platform-eng-design/blob/master/core/corda-5/corda-5.0/virtual-node/onboarding-journey.md#node-creation-journey
          TODO: check assumptions: if the uniqueness is on HoldingID or in the X.500 AND Membership group or in the X500 significant fields
        inPlace: true
        public: true

