threats:
  - ID: FLOW_SANDBOX_EVASION_INPUT
    lastReview: 2024-04-24
    title: FLOW_SANDBOX evasion by malicious VNode flow input
    impactedSecObj:
      - REFID: FULL_CIA
    assets:
      - REFID: DF_EXEC_SB1
    attackers:
      - REFID: VNODE_OPERATOR
    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:L/E:U/RC:U
    threatType: Elevation of privileges
    attack: |
      A malicious Flow payload `requestData{...}` or `className` parameter triggers
       a vulnerability in the Sandboxed Flow code. This could happens:

       - targeting vulnerable dependencies JAR (e.g. old log4j versions)
       - Deserialization Vulnerabilities
       - Use of: Mass assignment frameworks (e.g. BeanUtils), Object Graph Navigation Library, Java Expression Language, other generic data input parsers
       - A vulnerability is disclosed in unmaintained library difficult to replace, e.g. quasar library (since 2018), 
       
       NOTE: This attack by VNODE_OPERATOR is an attempt to exploit the residual risk lest after applying the countermeasures To
        (CPI_KNOWN_VULNERABILITIES_MNG1)[#CPI_KNOWN_VULNERABILITIES_MNG1]; the overall calculated severity
         takes this into account using the `temporal` parameters.

    public: true
    fullyMitigated: false
    countermeasures:
      - ID: CPI_KNOWN_VULNERABILITIES_MNG1
        title: Monitor and update vulnerable JARs in static CPIs
        description: |
          Implement security scanning capabilities for CPIs. Classic SCA (software composition analysis) 
          would not understand CPI format and would not scan CPIs stored in CLUSTER_DB.
          This control could/should be implemented by all parties accessing directly the CPI. For example the CORDAPP_PUBLISHER
          could continuously monitor for security issues and publish CorDapp updates as needed.
        operational: true
        operator: CORDAPP_PUBLISHER
        inPlace: false
        public: true
      - ID: CPI_KNOWN_VULNERABILITIES_MNG2
        title: Monitor vulnerable JARs at runtime
        description: |
          Implement security scanning capabilities that detect vulnerable libraries at runtime, including in 
          uploaded CPIs, via JVM instrumentation, for example:
          https://docs.contrastsecurity.com/en/java-configuration.html
        operational: true
        operator: INFRASTRUCTURE_OPERATOR
        inPlace: false
        public: true
      - ID: CPB_SECURE_CODING_GUIDELINES
        title: Provide guidance for Secure Flow implementations
        description: |
          Provide guidance on how:

            - Avoid deserialization vulnerabilities
            - Parsing issues in code
            - Apply proper input validation
        operational: true
        operator: CORDAPP_PUBLISHER
        inPlace: false
        public: true
      - ID: MAINTAIN_QUASAR
        title: Maintain Quasar library
        description: |
          Maintain or fork the Quasar library so that in case of a disclosed vulnerability R3 is able to patch,
           rebuild and distribute a non vulnerable version.
        operational: true
        operator: CORDAPP_PUBLISHER
        inPlace: true
        public: true



  - ID: FLOW_SANDBOX_EVASION_CPB
    title: FLOW_SANDBOX evasion by malicious VNode flow code execution
    lastReview: 2024-04-24
    conditional: |
      `Unconstrained multi-hosting`
    impactedSecObj:
      - REFID: FULL_CIA

    assets:
      - REFID: DF_EXEC_SB1
    attackers:
      - REFID: CORDAPP_PUBLISHER
    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:H/UI:N/S:U/C:H/I:H/A:L
    threatType: Elevation of privileges
    attack: |
      A malicious actor with ApplicationPublisher credentials (that can sign CPIs that are truster by root certificate installed in the cluster)
       crafts a Flow that get then executed on any VNodes calls to that CordApp.
      Malicious java code from the CPI that access unauthorized data and procedures outside of the Flow SandBox is then executed.
      This could happen in several ways:

       - CPK containing code that evades Java Sec Manager (e.g. JNI libraries allowed)
       - Read/Write ThreadLocal variables
       - Used JRE do not implement a safe JSM
       - JSM configuration is too complex and prone to error
       - JSM uses `Deny list` logic policy (VS suggested strict `Allow` logic), this is prone to misconfiguration
    public: true
    fullyMitigated: false
    countermeasures:
      - ID: DENY_LOADLIB_POLICY
        title: JMS policy denying load arbitrary code and libraries
        description: |
          Deny all load library permissions `loadLibrary.*` that could be exploited for example by loading CPIs internal JNI libs (non native java libraries)  
          evidence: [Code link: components/security-manager/src/main/resources/high_security.policy](https://github.com/corda/corda-runtime-os/blob/54392791214771b808fc699288ce8fa596a8bcc0/components/security-manager/src/main/resources/high_security.policy#L73)
        operational: false
        inPlace: true
        public: true
      - REFID: CPI_KNOWN_VULNERABILITIES_MNG1
        # title: Monitor and update vulnerable JARs in CPI
        # description: | 
        #   TODO
        #   evidence: 
        # operational: false
        # inPlace: false
        # public: true
      - ID: JAVA_SEC_MGN_POLICY_HARDENING
        title: Configure a restrictive Java Security Manager Component
        description: |
          Currently there's a deny on reflection to all R3 and internal packages. 
          While this is necessary to make CPI serialization libraries to function an hardened 
          implementation would use a serialization library that support a minimal grant to the
           deserialization method and a deny on reflection for any other package (REF)[https://corda.net/blog/sandboxes-in-corda-5-java-security-manager/]
        operational: false
        inPlace: false
        public: false
        ticketLink:
      - ID: JAVA_THREAD_LOCAL_CHECK
        title: Check that threatLocal is not used in an insecure way
        description: |
          OSGi framework securely clears threadlocal variable. (RFI: would be good to have an evidence like a Karaf src or documentation link)
        operational: false
        inPlace: true
        public: true
      - ID: JSM_CONFIG1
        title: Use explicit `allow` configurations
        description: |
          Use JSM policy definition that only allows a set of safe actions instead od denying dangerous operations.
        operational: false
        inPlace: false
        public: true
      - ID: JSM_VERSION1
        title: Define a compatible and tested JRE
        description: |
          Execute specific dynamic testing that validates af JRE implementations and mandate exact requirements for JRE/JSM versions.
        operational: false
        inPlace: true
        public: true


  - ID: CLUSTER_OPERATOR_EOP1
    lastReview: 2024-04-24
    title: Cluster Operator sandbox evasion
    conditional: |
      `Unconstrained multi-hosting`
    impactedSecObj:
      - REFID: CLUSTER_OPERATOR_PROTECTION
    assets:
      - REFID: DF_EXEC_SB1
    attackers:
      - REFID: CLUSTER_OPERATOR
    CVSS:
      vector: CVSS:3.0/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:L
    threatType: Elevation of privileges
    attack: |
      An attacker with Cluster operator credential/access maliciously downgrades security policy for JSM, 
      set up a self signed Root of trust and 
      and upload a malicious CPIs.
      Note: this could happen also for compatibility: CLUSTER_OPERATOR disable restrictions to make one CPI work.
    public: true
    fullyMitigated: false
    countermeasures:
      - ID: DO_NOT_ALLOW_JSM_POLICY_DOWNGRADING
        title: No RPC user is able to downgrade security
        description: |
          The only way to change the JSM policy configuration should be via the INFRASTRUCTURE_OPERATOR access level,
           the same as the installation.
        operational: false
        inPlace: false
        public: true
      # - IDREF:  TODO reference to the deny to CLUSTER_OP to configure root of trusts for CPIs
      # TODO     Cluster operator downgrades security policy for JSM for improving compatibility


  - ID: FLOW_DOS1
    title: FLOW consumes too many resources
    lastReview: 2024-04-24
    conditional: |
      `Unconstrained multi-hosting`
    impactedSecObj:
      - REFID: AVAILABILITY
    assets:
      - REFID: DF_EXEC_SB1
    attackers:
      - REFID: VNODE_OPERATOR
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:H
    threatType: Denial of Services
    attack: |
      A malfunctioning Flow could allow a VNode to consume system resources also based on VNode Flow parameters (CPU, Memory etc)
    public: true
    fullyMitigated: false
    countermeasures:
      - ID: LIMIT_SANDBOX_RESOURCES
        title: Limit sandbox resources consumption
        description: |
          Monitor and limit the consumption of the resources of the java code, for example limiting the times the flow can be
           un-suspended form the DB serialized form. This is not trivial as the Java VM in general does not offer base methods to achieve limited 
           resources consumption.
        operational: false
        inPlace: false
        public: true

      - ID: MONITOR_AND_UPDATE_CPI
        title: Redeploy updated CPI code limiting code resources consumption
        description: |
          Detect resources abuses and overuses and respond by deploying an new CPIs fixing the flow/code issue.
        operational: true
        operator: CLUSTER_OPERATOR
        inPlace: false
        public: true

  - ID: VULNERABLE_FLOW_RESUME
    lastReview: 2024-04-23
    title: Vulnerable FLOW resume
    impactedSecObj:
      - REFID: DATABASE_TAMPER_RESILIENCY
    assets:
      - REFID: DF_UNSUSPEND_SB1
    attackers:
      - REFID: VNODE_OPERATOR
    CVSS:
      vector: CVSS:3.0/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:L
    threatType: Elevation of privileges
    attack: |
      One or more VNode user starts flows that are suspended intentionally maintaining them suspended. 
      They exploit a bug after it has been disclosed by resuming the sandbox code. This is possible as deserialized flows do not obey CPI updates for an undefinite span of time
    public: true
    fullyMitigated: true
    countermeasures:
      - ID: FLOWS_INVALIDATION1
        title: Flow invalidations on CPI update
        description: |
          Flow purging cab be part of the CPI upgrade process.
          Cluster Operator will need to purge the serialized flows by explicit REST API call: (REF)[https://docs.r3.com/en/platform/corda/5.0-beta/rest-api/C5_OpenAPI.html#tag/Virtual-Node-Maintenance-API/operation/post_maintenance_virtualnode_forcecpiupload]
        operational: true
        operator: CLUSTER_OPERATOR
        inPlace: true
        public: true

  - ID: FLOW_TAMPERING_AT_REST1
    lastReview: 2024-04-23
    title: Serialized suspended sandbox code (Checkpoint) tampering
    impactedSecObj:
      - REFID: DATABASE_TAMPER_RESILIENCY
    assets:
      - REFID: DF_UNSUSPEND_SB1
    attackers:
      - REFID: ANONYMOUS
    CVSS:
      vector: CVSS:3.1/AV:L/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:L
    threatType: Tampering, Elevation of Privileges, Info disclosure
    attack: |
      VNode database credential disclosure, or another security incident, that leads to tampering 
      would allow an attacker to execute arbitrary code impersonating a VNode. 
    public: true
    fullyMitigated: false
    # ticketLink: https://r3-cev.atlassian.net/servicedesk/customer/portal/xxxx
    countermeasures:
      - ID: SUSPENDED_FLOW_ENCRYPTION
        title: Encrypted serialized flows
        description: |
          Encrypt suspended serialized flows with credential injected in the same WORKER_PROCESS;
          The FLOW_WORKER would have to decrypt the serialized flow and by doing do confirm the 
          integrity of the serialized data, prior to FLOW_SANDBOX execution. The serialized slow would also be encrypted at rest 
          protecting any sensitive data part of the flow from database data disclosure.
          The encryption implementation could be similar to the MASTER_ENCRYPTION_KEY used to encrypt wrapping 
          keys in the CRYPTO_WORKER, also using fast AES-256 algorithms.
        operational: false
        inPlace: false
        public: true

  - ID: FLOW_DISCLOSURE_AT_REST1
    lastReview: 2024-04-23
    title: Serialized suspended code disclosure
    impactedSecObj:
      - REFID: DATABASE_LEAK_RESILIENCY
    assets:
      - REFID: DF_UNSUSPEND_SB1
    attackers:
      - REFID: ANONYMOUS
    CVSS:
      vector: CVSS:3.1/AV:L/AC:H/PR:N/UI:N/S:U/C:H/I:N/A:N
    threatType: Info disclosure
    attack: |
      VNode database data leak, or another security incident leading to DB disclosure
      would allow an attacker to access confidential flows data.
    public: true
    fullyMitigated: false
    ticketLink: https://r3-cev.atlassian.net/servicedesk/customer/portal/xxxx
    countermeasures:
      - REFID: SUSPENDED_FLOW_ENCRYPTION
