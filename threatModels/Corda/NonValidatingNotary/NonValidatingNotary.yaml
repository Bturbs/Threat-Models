ID: NonValidatingNotary
schemaVersion: 2
title: Non-Validating Notary

scope:
  description: |
    This threat model describes the risks associated with a non-validating notary in a Corda network. 

analysis: <img src="img/NonValidatingNotary_seq1.svg"/>

threats:
  - ID: LARGE_SPENTSTATES_DB
    title: Large Spent States Database
    attack: |
      The spent transactions are ever growing in number without the possibility to garbage collect spent transactions 
      the notary does not know the number of output of every transaction, so it cannot efficiently track spent
       states a completely consumed transaction with all spent outputs. The Notary has a ever growing database of
        that becomes which can lead to performance issues and increased resource consumption.
    threatType: Denial of Service
    impactDesc: |
      Can lead to increased latency and resource consumption in the network, affecting transaction processing times.
    impactedSecObj:
      - REFID: AVAILABILITY
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:L' # High impact on availability
    fullyMitigated: false
    countermeasures:
      - ID: UTXO_TRACKING_STRATEGY
        title: UTXO Tracking Mechanism
        description: |
          Implement a mechanism to track unspent transaction outputs (UTXOs) instead of spent states, 
          allowing the notary to manage double spending more efficiently.
        inPlace: false # CorDapp design choice
        public: true
      - ID: SCALABLE_NOTARY_ARCHITECTURE
        title: Scalable Notary Architecture
        description: |
          Design the notary service to handle large databases efficiently,
           possibly using sharding or partitioning strategies.
        inPlace: true # CorDapp design choice
        public: true
        operational: true
        operator: NODE_OPERATOR




