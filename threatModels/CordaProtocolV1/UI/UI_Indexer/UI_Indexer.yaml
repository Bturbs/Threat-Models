ID: UI_Indexer
schemaVersion: 2
title: Indexer Backend
status: Draft

parent: UI

scope:
  description: |
    Threat model for the read-only indexer backend that supports the Web Application UI.
    The service ingests Solana transaction activity, stores normalized and raw records,
    performs catch-up and reconciliation, and exposes browser-consumed REST and WebSocket
    APIs behind a delivered WAF / API gateway.

    **Scope Boundaries:**

    - Browser access is read-oriented, but all implemented endpoints are in scope, including
      operational/admin routes, because the current backend is still a reference design
    - The current service code is not treated as the final implementation; this model captures
      the intended delivered architecture and required mitigations
    - Security controls such as JWT validation and route exposure policy may be implemented at
      the API gateway rather than in the Ktor application itself

    **Technology Stack:**

    - Kotlin, Ktor, Gradle
    - PostgreSQL, Flyway, jOOQ
    - Solana RPC / WebSocket feeds, with LaserStream or equivalent managed provider as a target deployment option
    - Kubernetes deployment, with separate application and infrastructure/security teams

    **Key Trust Boundaries:**

    - Browser to WAF / API gateway
    - WAF / API gateway to indexer backend
    - Indexer backend to PostgreSQL
    - Indexer backend to Solana RPC / LaserStream provider

    **Diagram:**
    <img src="img/indexer_seq1.svg" alt="Sequence diagram showing the indexer backend's role in ingesting Solana data and serving browser requests."/>


  assets:

    - ID: INDEXER_GATEWAY
      type: system
      title: Indexer API Gateway / WAF
      description: |
        Internet-facing gateway enforcing route policy, transport security, authentication,
        and abuse controls before traffic reaches the indexer backend.
      inScope: true

    - ID: INDEXER_SERVICE
      type: system
      title: Indexer Backend Service
      description: |
        Backend service that ingests Solana activity, stores activity records, performs
        reconciliation, and exposes read-oriented REST and WebSocket APIs.
      inScope: true

    - ID: INDEXER_DATABASE
      type: system
      title: Indexer PostgreSQL Database
      description: |
        PostgreSQL instance storing cursor state, normalized activity rows, and raw transaction-derived payloads.
      inScope: true

    - ID: INDEXER_ACTIVITY_STORE
      type: data
      title: Indexed Activity and Derived Read Model Data
      description: |
        Persisted activity rows, investor identifiers, cursor metadata, and raw JSON payloads
        used to populate browser-facing read APIs.
      inScope: true

    - ID: INDEXER_PUBLIC_API
      type: endpoint
      title: Public Read API and WebSocket Endpoints
      description: |
        Browser-consumed routes such as `/api/activities`, `/api/completed-activities`,
        `/api/investors`, and `/ws/activities`.
      inScope: true

    - ID: INDEXER_ADMIN_API
      type: endpoint
      title: Operational Admin Endpoint
      description: |
        Operational route such as `/admin/indexer/run-once` used to trigger reconciliation
        or indexing work on demand.
      inScope: true

    - ID: SOLANA_DATA_PROVIDER
      type: system
      title: Solana RPC / LaserStream Provider
      description: |
        External Solana data provider used for subscriptions, transaction fetches, and
        catch-up/reconciliation reads. This may be an RPC endpoint, LaserStream, or another
        managed streaming provider.
      inScope: false

    - ID: INDEXER_DATABASE_CREDENTIALS
      type: credential
      title: Database Credentials
      description: |
        Credentials or secret material used by the indexer backend to authenticate to PostgreSQL.
      inScope: true

    - ID: SOLANA_PROVIDER_CREDENTIALS
      type: credential
      title: Solana Provider Credentials
      description: |
        API keys, authenticated endpoint URLs, or equivalent credential material used to access
        Solana RPC or LaserStream providers.
      inScope: true

    - ID: DF_BROWSER_TO_INDEXER_GATEWAY
      type: dataflow
      title: Browser to Gateway Read Traffic
      description: |
        HTTPS and WebSocket traffic from the browser-based UI to the WAF / API gateway.
      inScope: true

    - ID: DF_GATEWAY_TO_INDEXER_SERVICE
      type: dataflow
      title: Gateway to Indexer Backend Traffic
      description: |
        Internal traffic forwarded from the WAF / API gateway to the Ktor indexer service.
      inScope: true

    - ID: DF_INDEXER_TO_DATABASE
      type: dataflow
      title: Indexer to PostgreSQL Traffic
      description: |
        Application traffic used to read and write cursor state, indexed activity rows,
        and raw transaction-derived payloads.
      inScope: true

    - ID: DF_INDEXER_TO_SOLANA_PROVIDER
      type: dataflow
      title: Indexer to Solana Provider Traffic
      description: |
        Traffic used for subscriptions, transaction fetches, replay, catch-up, and reconciliation
        against Solana RPC or LaserStream providers.
      inScope: true

  assumptions:
    - ID: GATEWAY_ENFORCEMENT_POINT
      description: |
        The delivered architecture uses the gateway / WAF as the primary enforcement point for
        route exposure policy, authentication, and rate-limiting controls.

    - ID: CHAIN_DATA_IS_UNTRUSTED
      description: |
        Solana transactions, logs, and provider responses are treated as untrusted input and must
        be validated, normalized, and safely handled before persistence or downstream rendering.

analysis: |
  This child model focuses on trust-boundary crossings and the ways stale, missing, spoofed,
  or unsafely handled indexer data can drive incorrect user or operator decisions.

  The most important design risks are:

  - Browser-driven denial of service that makes the read model stale and causes users to repeat or delay actions incorrectly
  - Missing or misconfigured gateway policy that exposes routes beyond the intended read-only browser surface
  - Upstream provider tampering, inconsistency, or replay gaps that mislead the indexer and therefore the UI
  - Unsafe persistence and downstream handling of attacker-controlled transaction-derived payloads
  - Storage and indexing design choices that degrade availability as history grows or attackers amplify query load

threats:
  - ID: PUBLIC_API_DOS_CAUSES_STALE_ACTIONS
    title: Public API denial of service causes stale data and wrong user actions
    attack: |
      An attacker or abusive client overwhelms the browser-facing API surface across the main
      trust boundary by:

      - Flooding REST routes with repeated history queries or expensive pagination patterns
      - Opening excessive WebSocket streams and forcing large backlog delivery
      - Replaying requests through the public gateway faster than the service can ingest,
        query, and broadcast updates

      The indexer may remain partially up while serving stale, delayed, or incomplete data to the UI.

    threatType: Denial of Service
    impactDesc: |
      Users and operators act on a stale or incomplete view of activity data.

      - A user may repeat an action because the prior action is not yet visible
      - A curator or operator may make a logically wrong decision based on missing activity
      - The live activity feed may appear healthy while lagging materially behind actual chain state
      - Service degradation can expand into reconciliation lag and backlog growth

    impactedSecObj:
      - REFID: AVAILABILITY
      - REFID: INTEGRITY
      - REFID: USER_FUNDS_SAFETY
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: MALICIOUS_USER
    assets:
      - REFID: DF_BROWSER_TO_INDEXER_GATEWAY
      - REFID: INDEXER_GATEWAY
      - REFID: INDEXER_PUBLIC_API
      - REFID: INDEXER_SERVICE
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:N/I:H/A:H'
    pentestTestable: true
    fullyMitigated: false
    ticketLink: "https://r3-cev.atlassian.net/browse/PROT-1176"
    countermeasures:
      - ID: GATEWAY_RATE_LIMITING
        title: Enforce Gateway Rate Limits and Connection Quotas
        description: |
          Apply rate limits, concurrency limits, and WebSocket connection quotas at the gateway / WAF.

          - Rate-limit anonymous and authenticated callers separately
          - Bound WebSocket fan-out and backlog replay sizes
          - Reject obviously abusive request patterns before they reach the service

        inPlace: false
        public: true
        operational: true
        operator: Infrastructure Team

      - ID: JWT_ROUTE_PROTECTION
        title: Require Authenticated Access for Browser Routes
        description: |
          Require JWT or equivalent identity validation for browser-consumed routes so anonymous
          traffic cannot fully exercise the public API surface.

          Authentication does not eliminate denial of service, but it reduces the exposed attack
          surface and supports differentiated quotas and abuse handling.

        inPlace: false
        public: true
        operational: false

      - ID: DATA_FRESHNESS_SIGNALING
        title: Surface Data Freshness and Block Risky Actions When Stale
        description: |
          Expose cursor lag, last indexed slot, and freshness state to the UI and operational dashboards.

          - Warn when data is stale beyond an acceptable threshold
          - Disable or gate user actions that rely on near-real-time data when freshness is unknown
          - Alert on reconciliation backlog growth

        inPlace: false
        public: false
        operational: false

  - ID: INGESTION_FAILURE_TO_STALE_DATA
    title: Transient ingestion failures cause stale or gapped read model data
    attack: |
      Temporary delivery or runtime failures can interrupt live indexing even without a malicious actor.

      Examples include:

      - WebSocket disconnects or dropped subscription events from the Solana provider
      - Short process outages or restarts while the service is ingesting activity
      - Temporary inability to fetch a transaction at the moment a signature is observed
      - Browser WebSocket reconnects after missing live push events

      Without recovery controls, these failures would leave the browser and operators with stale,
      gapped, or duplicated activity views.

    threatType: Denial of Service
    impactDesc: |
      Freshness and continuity of the read model would be lost during normal operational hiccups.

      - Activity may temporarily disappear from the live feed
      - Gaps could remain after a restart or reconnect
      - Operators could reason about incomplete history during recovery windows

    impactedSecObj:
      - REFID: AVAILABILITY
      - REFID: INTEGRITY
      - REFID: USER_FUNDS_SAFETY
      - REFID: AUDITABILITY
    assets:
      - REFID: INDEXER_SERVICE
      - REFID: INDEXER_DATABASE
      - REFID: INDEXER_ACTIVITY_STORE
      - REFID: DF_INDEXER_TO_SOLANA_PROVIDER
      - REFID: INDEXER_PUBLIC_API
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:H'
    pentestTestable: true
    fullyMitigated: true
    countermeasures:
      - ID: FAIL_FAST_AND_AUTOMATIC_RESTART
        title: Fail Fast and Recover Through Orchestrator Restart
        description: |
          The service is designed to fail fast on unrecoverable persistence or connectivity errors,
          and the deployment model assumes orchestrated restart of the failed instance.

          - Short-lived faults do not require manual reconstruction of index state
          - Recovery resumes from durable checkpoint state after restart

        inPlace: true
        public: false

      - ID: DURABLE_CURSOR_CHECKPOINTING
        title: Persist a Durable Cursor for Recovery
        description: |
          The indexer persists the last finalized slot and signature in PostgreSQL and reloads that
          cursor on startup.

          - Recovery starts from durable state instead of a guessed time window
          - Cursor advancement is monotonic, reducing rollback or duplicate-progress errors

        inPlace: true
        public: false
        operational: false

      - ID: STARTUP_CATCHUP_FROM_CURSOR
        title: Run Startup Catch-Up from Stored Cursor
        description: |
          On startup, the indexer performs bounded catch-up from the stored cursor before relying on
          steady-state live delivery.

          - Missed activity produced while offline is backfilled
          - Recovery does not depend solely on uninterrupted live subscription delivery

        inPlace: true
        public: true
        operational: false

      - ID: PERIODIC_RECONCILIATION_SAFETY_NET
        title: Reconcile Periodically Against Upstream History
        description: |
          A recurring reconciliation loop re-reads upstream history from the finalized cursor to fill
          gaps and re-check partially indexed signatures.

          - Missed events can be recovered after transient delivery failures
          - Previously non-finalized rows can be refreshed into finalized, non-stale state

        inPlace: true
        public: true
        operational: false

      - ID: IDEMPOTENT_ACTIVITY_UPSERTS
        title: Make Replay and Retry Safe with Idempotent Upserts
        description: |
          Activity persistence uses idempotent upsert semantics keyed by signature, instruction index,
          and inner index.

          - Catch-up and reconciliation can replay signatures safely
          - Recovery does not require fragile duplicate suppression outside the datastore

        inPlace: true
        public: true
        operational: false

      - ID: WEBSOCKET_BACKLOG_RESUME
        title: Resume Browser Streams from the Last Seen Activity ID
        description: |
          Browser consumers can reconnect with `afterId` and receive backlog delivery before live push resumes.

          - Temporary browser disconnects do not require a full state rebuild
          - Missed live events can be replayed from persisted activity rows

        inPlace: true
        public: true
        operational: false

      - ID: NON_STALE_COMPLETED_READ_FILTERS
        title: Filter Completed Views to Finalized, Non-Stale Rows
        description: |
          Browser-facing completed-history and investor lookup routes filter to finalized, non-stale data.

          - Recovery logic can keep stale rows out of the most trusted read paths
          - Downstream users are less likely to act on partially recovered records

        inPlace: true
        public: true
        operational: false

  - ID: ROUTE_POLICY_AND_AUTH_GAPS_EXPOSE_ENDPOINTS
    title: Missing route policy or authentication exposes feed and admin endpoints
    attack: |
      Because the backend implementation is still evolving, attackers probe all reachable routes and
      take advantage of missing or misconfigured gateway policy.

      Examples include:

      - Public exposure of routes intended only for trusted browser flows
      - Direct access to operational routes such as `/admin/indexer/run-once`
      - Missing JWT validation, audience checks, or route-level authorization
      - WebSocket access without equivalent policy enforcement to REST routes

    threatType: Spoofing, Information Disclosure, Elevation of Privilege
    impactDesc: |
      Unauthorized callers can access data or operational behavior outside the intended design.

      - Read APIs may disclose investor identifiers, activity history, or operational state
      - Admin routes may be used to trigger costly work or manipulate service behavior
      - Missing caller identity weakens forensic attribution and abuse response

    impactedSecObj:
      - REFID: CONFIDENTIALITY
      - REFID: INTEGRITY
      - REFID: AVAILABILITY
      - REFID: AUDITABILITY
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: MALICIOUS_USER
    assets:
      - REFID: INDEXER_GATEWAY
      - REFID: INDEXER_SERVICE
      - REFID: INDEXER_PUBLIC_API
      - REFID: INDEXER_ADMIN_API
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H'
    pentestTestable: true
    fullyMitigated: false
    ticketLink: "https://r3-cev.atlassian.net/browse/PROT-1177"
    countermeasures:
      - ID: GATEWAY_ROUTE_ALLOWLIST
        title: Enforce an Explicit Route Allowlist at the Gateway
        description: |
          Expose only the routes required for the browser use case at the public gateway.

          - Keep admin routes off the public ingress when possible
          - Apply separate policies for REST and WebSocket routes
          - Default-deny newly added endpoints until they are reviewed

        inPlace: false
        public: true
        operational: true
        operator: Infrastructure Team

      - ID: JWT_VALIDATION_AND_AUTHZ
        title: Validate JWTs and Enforce Route-Level Authorization
        description: |
          Validate token signature, issuer, audience, and expiry at the gateway and/or service.

          - Require authenticated callers for intended browser routes
          - Enforce stricter authorization for operational endpoints
          - Apply equivalent checks to WebSocket upgrade requests

        inPlace: false
        public: true
        operational: false

      - ID: ADMIN_SURFACE_ISOLATION
        title: Isolate or Disable Admin Endpoints in Normal Deployments
        description: |
          Place operational routes behind separate ingress, separate authentication, or disable them
          entirely outside controlled environments.

        inPlace: false
        public: false
        operational: true
        operator: Application Team

      - ID: ACCESS_AUDIT_LOGGING
        title: Audit Access to Public and Admin Routes
        description: |
          Record caller identity, route, source metadata, and outcome for public and admin endpoint access.

        inPlace: false
        public: false
        operational: true
        operator: Security Operations Team

  - ID: UPSTREAM_PROVIDER_TAMPERING_OR_INCONSISTENCY
    title: Upstream provider tampering or inconsistency misleads the read model
    attack: |
      The indexer trusts upstream Solana provider responses across a major trust boundary.
      An attacker, compromised provider, or misconfiguration can cause the service to ingest
      misleading data by:

      - Returning incomplete, delayed, or reordered transaction history
      - Suppressing events or replaying outdated data during catch-up
      - Pointing the service at an attacker-controlled provider endpoint
      - Causing commitment-level confusion that hides freshness or finality problems

    threatType: Spoofing, Tampering
    impactDesc: |
      The backend publishes an incorrect activity view to the browser and operators.

      - Users may take logically wrong actions based on false or incomplete activity
      - Operational teams may trust reconciliation results that are materially inaccurate
      - Compliance and audit expectations may be undermined if indexed history is incomplete or misleading

    impactedSecObj:
      - REFID: INTEGRITY
      - REFID: USER_FUNDS_SAFETY
      - REFID: COMPLIANCE
      - REFID: AUDITABILITY
    attackers:
      - REFID: EXTERNAL_ATTACKER
    assets:
      - REFID: DF_INDEXER_TO_SOLANA_PROVIDER
      - REFID: SOLANA_DATA_PROVIDER
      - REFID: INDEXER_SERVICE
      - REFID: INDEXER_ACTIVITY_STORE
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:L/I:H/A:L'
    pentestTestable: true
    fullyMitigated: false
    ticketLink: "https://r3-cev.atlassian.net/browse/PROT-1180"
    countermeasures:
      - ID: PROVIDER_CONFIGURATION_HARDENING
        title: Protect Provider Configuration and Credentials
        description: |
          Manage provider URLs and credentials as controlled secrets and deployment configuration.

          - Do not allow arbitrary runtime override of provider endpoints
          - Rotate provider credentials when compromise is suspected
          - Restrict who can change upstream provider configuration

        inPlace: false
        public: false
        operational: true
        operator: Application Team

      - ID: PROVIDER_CROSS_CHECKS
        title: Cross-Check or Reconcile Critical Provider Results
        description: |
          Validate critical read-model state through reconciliation and, where practical,
          cross-check important reads against a secondary source.

          - Detect missing signatures and cursor gaps
          - Distinguish stale, replayed, and finalized data states
          - Fail or warn loudly when provider results are inconsistent

        inPlace: false
        public: true
        operational: false

      - ID: FRESHNESS_AND_FINALITY_EXPOSURE
        title: Expose Freshness and Finality State to Consumers
        description: |
          Make freshness, cursor lag, and commitment/finality state visible to browser and operator consumers
          so incorrect trust is not placed in stale or partially reconciled data.

        inPlace: false
        public: false
        operational: false

  - ID: TRANSACTION_DERIVED_PAYLOAD_INJECTION
    title: Transaction-derived payload is used for injection attacks
    attack: |
      An attacker places crafted content into transaction-derived fields, logs, or other on-chain payloads.
      The indexer decodes and persists these values, including raw JSON and selected derived fields.

      If downstream code later reuses this data unsafely, the payload can become:

      - Stored XSS when activity data is rendered in a browser without strict output encoding
      - Injection into future query or reporting paths if developers build SQL or templates unsafely
      - Misleading content that changes user understanding of what happened on-chain

      The risk exists even when the current code is only a reference implementation, because the
      architectural data path persists attacker-controlled content for later reuse.

    threatType: Tampering, Information Disclosure
    impactDesc: |
      Unsafe reuse of persisted transaction-derived content can compromise consumers of the read model.

      - Browser sessions or administrative viewers may execute attacker-controlled script
      - Sensitive tokens or user context may be exposed through downstream XSS
      - Query paths may become vulnerable if future code abandons parameterized access patterns
      - Users may be shown manipulated activity descriptions or payloads

    impactedSecObj:
      - REFID: INTEGRITY
      - REFID: CONFIDENTIALITY
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: MALICIOUS_USER
    assets:
      - REFID: INDEXER_ACTIVITY_STORE
      - REFID: INDEXER_DATABASE
      - REFID: INDEXER_SERVICE
      - REFID: UI_APP
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:L'
    pentestTestable: true
    fullyMitigated: false
    ticketLink: "https://r3-cev.atlassian.net/browse/PROT-1178"
    countermeasures:
      - ID: STRICT_INPUT_NORMALIZATION
        title: Normalize and Validate Transaction-Derived Data Strictly
        description: |
          Treat all chain-derived content as untrusted and decode it into explicit, typed fields.

          - Reject malformed or unexpected payload structures
          - Bound field sizes before persistence
          - Avoid carrying opaque attacker-controlled strings further than necessary

        inPlace: false
        public: true
        operational: false

      - ID: PARAMETERIZED_DATA_ACCESS
        title: Use Parameterized Queries and Avoid String-Built SQL
        description: |
          Keep all database reads and writes parameterized and prohibit string-built SQL for any
          path that handles transaction-derived values.

          This is required even when the current implementation uses safer query builders,
          because future reporting and search features often regress into dynamic query construction.

        inPlace: false
        public: true
        operational: false

      - ID: SAFE_RENDERING_OF_ACTIVITY_DATA
        title: Render Indexed Activity Data with Strict Output Encoding
        description: |
          Any browser or administrative UI that renders indexed activity must apply output encoding,
          avoid dangerous HTML insertion, and maintain CSP protections.

        inPlace: false
        public: true
        operational: false

      - ID: LIMIT_RAW_JSON_REUSE
        title: Restrict Raw JSON Exposure and Rendering
        description: |
          Keep raw transaction JSON out of normal browser responses unless there is a controlled,
          reviewed need for it.

          - Prefer normalized fields over raw blobs in API contracts
          - Quarantine raw payload views behind stricter operational controls

        inPlace: false
        public: false
        operational: false

  - ID: DB_INEFFICIENCY_TO_DOS
    title: Schema index gaps cause non-availability as data grows
    attack: |
      The indexer stores large historical datasets and raw JSON payloads. If query-critical fields
      remain embedded in blobs or are not indexed appropriately, the service becomes vulnerable to
      effective denial of service through:

      - Organic data growth that makes common UI queries progressively slower
      - Repeated high-cardinality reads that amplify poor query plans
      - WebSocket backlog and pagination patterns that force expensive scans
      - Operational queries over raw payloads that bypass targeted indexes

    threatType: Denial of Service
    impactDesc: |
      The service degrades gradually rather than failing immediately, but the effect on users can be the same.

      - Browser queries become slow or time out
      - Data freshness deteriorates and hides real system state
      - Users and operators may act on lagging data while the system still appears nominally available
      - Recovery becomes harder as backlog and table size increase

    impactedSecObj:
      - REFID: AVAILABILITY
      - REFID: INTEGRITY
      - REFID: USER_FUNDS_SAFETY
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: MALICIOUS_USER
    assets:
      - REFID: INDEXER_ACTIVITY_STORE
      - REFID: INDEXER_DATABASE
      - REFID: INDEXER_PUBLIC_API
      - REFID: INDEXER_SERVICE
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:H'
    pentestTestable: true
    fullyMitigated: false
    ticketLink: "https://r3-cev.atlassian.net/browse/PROT-1179"
    countermeasures:
      - ID: NORMALIZE_QUERY_CRITICAL_FIELDS
        title: Normalize Query-Critical Data Instead of Relying on Raw JSON Blobs
        description: |
          Persist query-critical attributes in explicit columns and typed tables rather than relying
          on ad hoc traversal of raw JSON payloads.

        inPlace: false
        public: true
        operational: false

      - ID: TARGETED_INDEX_STRATEGY
        title: Maintain Targeted Indexes for Real API Access Patterns
        description: |
          Create and review indexes for the actual browser and operational query patterns.

          - Cover pagination, investor lookups, and freshness-related reads
          - Revisit indexes as endpoint behavior evolves
          - Reject new query features that lack a matching performance design

        inPlace: false
        public: true
        operational: false

      - ID: QUERY_GUARDRAILS_AND_PAGINATION
        title: Enforce Query Limits, Pagination, and Backlog Guardrails
        description: |
          Bound result windows, cap replay sizes, and apply sensible defaults so the service does not
          let a single client force pathological query behavior.

        inPlace: false
        public: true
        operational: false

      - ID: PERFORMANCE_OBSERVABILITY
        title: Monitor Latency, Cursor Lag, and Query Plan Regression
        description: |
          Track latency, queue depth, WebSocket backlog, and cursor lag so performance regression is
          detected before it becomes user-visible stale data.

        inPlace: false
        public: false
        operational: true
        operator: Application Team

# Additional threat candidates to evaluate later:
# - Dedicated abuse case for `/admin/indexer/run-once` once the operational model is finalized
# - Leakage or misuse of database and Solana provider credentials
# - Repudiation and observability gaps that hide stale, replayed, or partially reconciled data
# - Cache poisoning or stale intermediate layers if extra API caching tiers are introduced