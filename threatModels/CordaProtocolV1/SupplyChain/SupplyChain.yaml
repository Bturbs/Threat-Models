        title: Remove Hard-coded Secrets and Implement Secret Management
        description: |
          Immediately remove all hard-coded secrets from Jenkinsfiles and Dockerfiles:

          - Move Web3Auth client ID to Jenkins credentials store
          - Move Azure SP credentials to Jenkins credentials store or Azure Key Vault
          - Use Docker BuildKit secrets (`--secret`) instead of build args for
            sensitive values
          - Rotate all currently exposed credentials
          - Add pre-commit hooks to detect secret patterns
            (e.g., gitleaks, detect-secrets)

        inPlace: false
        public: true

  # ============================================================
  # CONTAINER IMAGE THREATS
  # ============================================================

  - ID: DOCKER_BASE_IMAGE_COMPROMISE
    title: Docker Base Image Compromise
    attack: |
      An attacker compromises a base Docker image (e.g., node:20 on Docker Hub)
      or exploits tag mutability to substitute a malicious image. Since all
      Dockerfiles in the project reference base images by tag (not digest),
      a compromised tag affects all subsequent builds silently.

      **Attack vectors:**

      - Docker Hub account compromise — malicious image published under existing tag
      - Tag repointing: `node:20` is mutable, can be replaced without warning
      - Vulnerable base images with known CVEs in OS packages
      - Supply chain attack on upstream image build pipeline
    threatType: Tampering
    impactDesc: |
      A compromised base image can contain:

      - Backdoors, miners, or credential stealers embedded in OS packages
      - Modified binaries (e.g., compromised npm, node, or cargo executables)
      - Known vulnerabilities in unpatched OS libraries

      All services built from the compromised base inherit the compromise.
      6 Dockerfiles across solana-token-vault-program are affected.

    impactedSecObj:
      - REFID: INTEGRITY
    attackers:
      - REFID: EXTERNAL_ATTACKER
    assets:
      - REFID: DOCKER_BASE_IMAGES
      - REFID: BUILD_ARTIFACTS
    compliance:
      - ISO27001:
          - ref: A.5.21 (Managing information security in the ICT supply chain)
          - ref: A.8.8 (Management of technical vulnerabilities)
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:N'
    ticketLink: 'https://r3-cev.atlassian.net/browse/PROT-853'
    fullyMitigated: false
    countermeasures:
      - ID: PIN_BASE_IMAGES_BY_DIGEST
        title: Pin Docker Base Images by Digest
        description: |
          Pin all Dockerfile base images by SHA256 digest instead of mutable tags:

          `FROM node:20@sha256:abc123...`

          This ensures builds use the exact image version that was reviewed and tested,
          regardless of tag mutations on Docker Hub.

          Combine with automated digest update tooling (e.g., Renovate with
          Docker digest pinning mode).

        inPlace: false
        public: true

      - ID: CONTAINER_IMAGE_SCANNING
        title: Container Image Scanning in CI
        description: |
          Scan all built Docker images for vulnerabilities before pushing to
          Azure Container Registry. Examples: Trivy, Grype, Snyk Container.

          Integrate as a Jenkins build gate: fail the build if critical/high
          CVEs are detected in the final image.

        inPlace: true
        public: true

      - ID: CONTAINER_IMAGE_SIGNING
        title: Container Image Signing (Sigstore/cosign)
        description: |
          Sign all Docker images after build using Sigstore cosign. Verify
          signatures before deployment to Azure Container Apps.

          Keyless signing via OIDC (Jenkins identity) eliminates key management
          overhead while providing non-repudiation via Rekor transparency log.

          Reference: https://docs.sigstore.dev/cosign/signing/signing_with_containers/

        inPlace: false
        public: true

      - ID: MINIMAL_BASE_IMAGES
        title: Use Minimal/Distroless Base Images
        description: |
          Replace full OS base images with minimal alternatives to reduce
          attack surface:

          - Use distroless or Alpine variants for production images
          - Multi-stage builds: build in full image, run in minimal image
          - Remove unnecessary tools (curl, wget, bash) from production images

        inPlace: false
        public: true

  # ============================================================
  # DEVELOPER ENVIRONMENT THREATS
  # ============================================================

  - ID: COMPROMISED_DEVELOPER_WORKSTATION
    title: Compromised Developer Workstation
    attack: |
      An attacker compromises a developer's workstation via malware, phishing,
      or physical access. The compromised machine is used to:

      - Push malicious code to GitHub (using cached SSH keys/tokens)
      - Approve malicious PRs (using cached GitHub session)
      - Trigger Jenkins builds with tampered inputs
      - Show fake UI and trick signers into signing malicious transactions
      - Exfiltrate credentials stored locally (SSH keys, cloud provider tokens,
        wallet keys)

      This is explicitly identified in the supply chain taxonomy as a primary
      attack vector: "Compromised PC shows fake UI and let users sign malicious TXs."
    threatType: Spoofing, Tampering
    impactDesc: |
      A compromised developer workstation enables:

      - Code injection via legitimate-looking commits
      - PR approval bypassing review controls (reviewer's machine compromised)
      - Credential theft (SSH keys, GitHub tokens, cloud provider credentials)
      - Transaction manipulation — fake UI showing different transaction data
        than what is actually being signed
      - Persistence across multiple repositories and systems accessible from the machine

    impactedSecObj:
      - REFID: INTEGRITY
      - REFID: CONFIDENTIALITY
    attackers:
      - REFID: DEVELOPER
      - REFID: EXTERNAL_ATTACKER
    assets:
      - REFID: DEVELOPER_WORKSTATION
      - REFID: DF_DEV_TO_GITHUB
      - REFID: GITHUB_REPOS
    compliance:
      - ISO27001:
          - ref: A.8.1 (User endpoint devices)
          - ref: A.6.7 (Remote working)
          - ref: A.8.7 (Protection against malware)
    CVSS:
      vector: 'CVSS:3.1/AV:L/AC:L/PR:N/UI:R/S:C/C:H/I:H/A:N'
    ticketLink: 'https://r3-cev.atlassian.net/browse/PROT-869'
    fullyMitigated: false
    countermeasures:
      - ID: SIGNED_COMMITS
        title: Require GPG/SSH Signed Commits
        description: |
          Enforce commit signing via GPG or SSH keys on all repositories.
          Configure GitHub branch protection to require verified signatures.

          This proves commit authorship and prevents impersonation via
          compromised credentials (attacker would also need the signing key,
          ideally stored on a hardware token).

        inPlace: false
        public: true

      - ID: BRANCH_PROTECTION_HARDENING
        title: Harden GitHub Branch Protection Rules
        description: |
          Strengthen branch protection on all repositories:

          - Require minimum 2 reviewers for PRs
          - Dismiss stale reviews on new pushes
          - Require signed commits (see SIGNED_COMMITS)
          - Require all status checks to pass
          - Restrict force-push and deletion
          - Require CODEOWNERS review for sensitive files
            (Jenkinsfile, Dockerfile, package.json, Cargo.toml, build.gradle.kts)

          **Current state:** Reviews required but no signed commits,
          no CODEOWNERS enforcement.

        inPlace: false
        public: true

      - ID: HARDWARE_AUTH_KEYS
        title: Hardware Security Keys for GitHub Authentication
        description: |
          Require FIDO2/WebAuthn hardware security keys for GitHub authentication
          to prevent credential phishing attacks. Even if a developer's password
          or session is compromised, the attacker cannot authenticate to GitHub
          without the physical key.

        inPlace: false
        public: true

      - ID: PRECOMMIT_SECRET_SCANNING
        title: Pre-commit Secret Scanning Hooks
        description: |
          Implement pre-commit hooks across all repositories to prevent
          accidental secret commits:

          - gitleaks or detect-secrets as pre-commit hooks
          - GitHub secret scanning enabled at org level
          - CI-level secret scanning as an additional gate

        inPlace: false
        public: true

  - ID: BRANCH_PROTECTION_BYPASS
    title: Branch Protection Bypass via Compromised Reviewer
    attack: |
      An attacker compromises a reviewer's GitHub account (via phishing,
      session hijacking, or workstation compromise) and uses it to approve
      malicious PRs targeting the main branch. Since signed commits are not
      required, the attacker can push code from any machine using stolen
      credentials.

      **Alternative vectors:**

      - Exploit the CODEOWNERS file (if not protected) to add themselves as
        an approved reviewer
      - Use GitHub API to approve PRs programmatically with stolen token
      - Social engineering to get legitimate reviewer to approve without
        thorough review
    threatType: Spoofing, Tampering
    impactDesc: |
      Malicious code merged into protected branches reaches the CI/CD pipeline
      and can:

      - Inject backdoors into production builds
      - Modify Jenkinsfiles to exfiltrate secrets
      - Alter smart contract logic before compilation
      - Compromise all downstream artifacts and deployments

    impactedSecObj:
      - REFID: INTEGRITY
      - REFID: AUDITABILITY
    attackers:
      - REFID: DEVELOPER
    assets:
      - REFID: GITHUB_REPOS
      - REFID: DF_DEV_TO_GITHUB
    compliance:
      - ISO27001:
          - ref: A.5.15 (Access control)
          - ref: A.8.25 (Secure development life cycle)
          - ref: A.8.4 (Access to source code)
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:N/I:H/A:N'
    fullyMitigated: false
    ticketLink: 'https://r3-cev.atlassian.net/browse/PROT-857'
    countermeasures:
      - ID: SIGNED_COMMITS
        title: Require GPG/SSH Signed Commits
        description: |
          See COMPROMISED_DEVELOPER_WORKSTATION countermeasure.
        inPlace: false
        public: true
      - ID: BRANCH_PROTECTION_HARDENING
        title: Harden GitHub Branch Protection Rules
        description: |
          See COMPROMISED_DEVELOPER_WORKSTATION countermeasure.
        inPlace: false
        public: true
      - ID: HARDWARE_AUTH_KEYS
        title: Hardware Security Keys for GitHub Authentication
        description: |
          See COMPROMISED_DEVELOPER_WORKSTATION countermeasure.
        inPlace: false
        public: true

  # ============================================================
  # BUILD INTEGRITY THREATS
  # ============================================================

  - ID: NON_DETERMINISTIC_BUILDS
    title: Non-deterministic Builds Preventing Verification
    attack: |
      Build outputs are not reproducible — the same source code produces different
      binaries on different builds. This makes it impossible to verify that deployed
      artifacts correspond to reviewed source code. An attacker who compromises one
      build can insert malicious code that cannot be detected by rebuilding from source.

      **Current gaps:**

      - No reproducible build verification for Solana programs
      - Dockerfiles use `npm install` (non-deterministic) instead of `npm ci`
      - No provenance attestation linking artifacts to source code
      - No SBOM tracking exact dependency versions in built artifacts
    threatType: Tampering, Repudiation
    impactDesc: |
      Without deterministic builds:

      - Cannot verify deployed code matches reviewed source
      - Attacker can tamper with build output without detection
      - No forensic capability to detect supply chain compromise after the fact
      - Fails ISO 27001 A.8.25 (Secure development life cycle) evidence requirements

    impactedSecObj:
      - REFID: INTEGRITY
      - REFID: AUDITABILITY
    attackers:
      - REFID: DEVELOPER
      - REFID: EXTERNAL_ATTACKER
    assets:
      - REFID: BUILD_ARTIFACTS
      - REFID: JENKINS_PIPELINE
    compliance:
      - ISO27001:
          - ref: A.8.25 (Secure development life cycle)
          - ref: A.8.28 (Secure coding)
          - ref: A.8.29 (Security testing in development and acceptance)
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:N/I:H/A:N'
    fullyMitigated: false
    ticketLink: 'https://r3-cev.atlassian.net/browse/PROT-883'
    countermeasures:
      - ID: DETERMINISTIC_BUILDS
        title: Implement Deterministic / Reproducible Builds
        description: |
          Achieve reproducible builds across all build targets:

          - **Solana programs:** Use `anchor build --verifiable` to produce
            deterministic BPF bytecode
          - **Docker images:** Use `npm ci` everywhere, pin base images by digest,
            set BUILD_DATE to epoch for layer reproducibility
          - **Gradle:** Use `--configuration-cache`, dependency locking, and
            reproducible archive settings

          Reproducible builds enable third-party verification that deployed
          artifacts match published source code.

        inPlace: false
        public: true

      - ID: BUILD_PROVENANCE
        title: Build Provenance Attestation (SLSA L3)
        description: |
          Generate signed provenance metadata for all build artifacts documenting:

          - Source repository and commit hash
          - Build system identity and configuration
          - Builder image digest
          - Input dependency hashes
          - Build timestamp and duration

          Target: SLSA Build L3 — hardened build platform with non-falsifiable provenance.

          Reference: https://slsa.dev/spec/v1.2/build-track-basics#build-l3

          Tools: in-toto attestations, SLSA GitHub generator, Jenkins SLSA plugin.

        inPlace: false
        public: true

      - ID: SBOM_GENERATION
        title: SBOM Generation for All Build Artifacts
        description: |
          Generate Software Bill of Materials (SBOM) for every build artifact:

          - npm: `@cyclonedx/cli` or `cdxgen`
          - Cargo: `cargo-cyclonedx`
          - Gradle: CycloneDX Gradle plugin
          - Docker: `syft` for container image SBOMs

          SBOMs must be:

          - Stored alongside build artifacts
          - Version-controlled and signed
          - Used for continuous vulnerability monitoring of deployed versions
          - Available as ISO 27001 audit evidence (A.5.21, A.8.8)

        inPlace: false
        public: true

  # ============================================================
  # ARTIFACT INTEGRITY THREATS
  # ============================================================

  - ID: ARTIFACT_TAMPERING_IN_REGISTRY
    title: Artifact Tampering in Package Registries
    attack: |
      An attacker gains access to R3 Artifactory or Azure Container Registry
      and replaces published artifacts with tampered versions. Alternatively,
      exploits tag mutability in container registries to repoint tags to
      malicious images.

      **Attack vectors:**

      - Compromised Artifactory credentials (from Jenkins or developer machines)
      - Azure SP credential leak (currently hard-coded in Jenkinsfile.deploy)
      - Registry misconfiguration allowing artifact overwrites
      - MITM on registry connections (if not TLS-pinned)
    threatType: Tampering
    impactDesc: |
      Tampered artifacts are consumed by downstream services and deployments:

      - Modified Gradle libraries consumed by Corda-side applications
      - Tampered Docker images deployed to Azure Container Apps
      - Backdoored artifacts distributed to all environments consuming from the registry

    impactedSecObj:
      - REFID: INTEGRITY
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: DEVELOPER
    assets:
      - REFID: BUILD_ARTIFACTS
      - REFID: DF_JENKINS_TO_REGISTRIES
      - REFID: JENKINS_CREDENTIALS
    compliance:
      - ISO27001:
          - ref: A.8.24 (Use of cryptography)
          - ref: A.5.21 (Managing information security in the ICT supply chain)
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:N/I:H/A:N'
    fullyMitigated: false
    ticketLink: 'https://r3-cev.atlassian.net/browse/PROT-859'
    countermeasures:
      - ID: ARTIFACT_SIGNING
        title: Build Artifact Signing
        description: |
          Sign all published artifacts cryptographically:

          - Docker images: Sigstore cosign with keyless OIDC signing
          - Gradle artifacts: PGP signing via Gradle signing plugin
          - Verification at consumption time (cosign verify, Gradle dependency verification)

          Keyless signing (Sigstore) eliminates key management burden while
          providing non-repudiation via Rekor transparency log.

        inPlace: false
        public: true

      - ID: IMMUTABLE_TAGS
        title: Immutable Tags in Container Registry
        description: |
          Enable immutable tag policy in Azure Container Registry to prevent
          tag repointing attacks. Once an image is pushed with a tag, the tag
          cannot be overwritten.

          Combine with content trust (Docker Content Trust / Notary v2).

        inPlace: false
        public: true

  # ============================================================
  # SCANNING COVERAGE THREAT
  # ============================================================

  - ID: INSUFFICIENT_SECURITY_SCANNING
    title: Insufficient Security Scanning Coverage
    attack: |
      Only one of five repositories (corda-solana-toolkit) has automated dependency
      scanning (Snyk). The remaining repositories — including those producing
      Solana programs, Docker images, and UI components — have no automated
      vulnerability detection.

      An attacker exploits a known CVE in an unscanned dependency that would have
      been flagged by standard scanning tools.
    threatType: Tampering, Elevation of Privilege
    impactDesc: |
      Known vulnerabilities in dependencies remain undetected and reach production:

      - Exploitable CVEs in npm packages (UI, services)
      - Vulnerable Rust crates in Solana programs
      - Unpatched OS packages in Docker images
      - Known issues in Gradle dependencies

      This is a systematic gap, not an individual vulnerability.

    impactedSecObj:
      - REFID: INTEGRITY
    attackers:
      - REFID: EXTERNAL_ATTACKER
    assets:
      - REFID: NPM_DEPENDENCIES
      - REFID: CARGO_DEPENDENCIES
      - REFID: GRADLE_DEPENDENCIES
      - REFID: DOCKER_BASE_IMAGES
    compliance:
      - ISO27001:
          - ref: A.8.8 (Management of technical vulnerabilities)
          - ref: A.8.28 (Secure coding)
          - ref: A.8.29 (Security testing in development and acceptance)
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:L'
    fullyMitigated: false
    ticketLink: 'https://r3-cev.atlassian.net/browse/PROT-868'
    countermeasures:
      - ID: UNIVERSAL_SCANNING
        title: Deploy Scanning Across All Repositories
        description: |
          Extend automated security scanning to ALL repositories:

          - **npm:** Snyk or npm audit as CI gate
          - **Cargo:** cargo-audit + cargo-deny in CI
          - **Gradle:** Snyk Gradle plugin or OWASP dependency-check
          - **Docker:** Trivy or Grype for container image scanning
          - **Secrets:** gitleaks or detect-secrets in pre-commit + CI

          Configure as build gates: fail CI on critical/high findings.
          Run nightly full scans for all repositories (not just corda-solana-toolkit).

        inPlace: false
        public: true

  # ============================================================
  # LONG-TERM INFILTRATION
  # ============================================================

  - ID: LONG_TERM_DEPENDENCY_INFILTRATION
    title: Long-term Open Source Maintainer Infiltration
    attack: |
      A sophisticated attacker establishes trust in a critical open-source dependency
      over months or years, eventually introducing a subtle backdoor. This follows
      the xz-utils attack pattern (CVE-2024-3094, March 2024):

      - Build trust as a helpful contributor over 2+ years
      - Gain commit access and co-maintainer status
      - Introduce backdoor via build system (not in reviewed source code)
      - Backdoor activates only under specific conditions
        (CI environments, specific architectures)

      **Relevant dependencies:** The Anchor framework, Solana SDK crates,
      SPL token-2022 libraries, and major npm packages in the dependency tree
      are potential targets. These are high-value targets because they are used
      across the entire Solana ecosystem.

      This attack is extremely difficult to detect via standard code review or
      automated CVE scanning because the malicious code is obfuscated or injected
      during build, the attacker has legitimate commit access, and changes appear
      as routine maintenance.
    threatType: Tampering, Elevation of Privilege
    impactDesc: |
      A backdoored core dependency (e.g., Anchor framework, Solana SPL libraries,
      or a critical npm package) can compromise:

      - All Solana programs built with the backdoored framework
      - All services built with the compromised npm package
      - Complete infrastructure if the backdoor provides remote access

      The blast radius is proportional to how fundamental the compromised
      dependency is in the stack.

    impactedSecObj:
      - REFID: INTEGRITY
      - REFID: CONFIDENTIALITY
    attackers:
      - REFID: EXTERNAL_ATTACKER
    assets:
      - REFID: NPM_DEPENDENCIES
      - REFID: CARGO_DEPENDENCIES
      - REFID: BUILD_ARTIFACTS
    compliance:
      - ISO27001:
          - ref: A.5.19 (Information security in supplier relationships)
          - ref: A.5.21 (Managing information security in the ICT supply chain)
          - ref: A.8.8 (Management of technical vulnerabilities)
    CVSS:
      vector: 'CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:C/C:H/I:H/A:H'
    fullyMitigated: false
    ticketLink: 'https://r3-cev.atlassian.net/browse/PROT-852'
    countermeasures:
      - ID: BEHAVIORAL_DEPENDENCY_ANALYSIS
        title: Behavioral Dependency Analysis
        description: |
          Deploy tools that analyze dependency behavior beyond known CVEs:

          - OpenSSF Scorecard: rates open-source project health (CI/CD practices,
            contributor diversity, vulnerability disclosure)

          These tools detect xz-utils style attacks that traditional CVE
          scanners miss.

          **Example implementation (npm):**

          - Use npq for interactive risk review of new packages:
            `npq install <package-name>`

          Reference: https://securityscorecards.dev/
          Reference: https://github.com/lirantal/npm-security-best-practices

        inPlace: false
        public: true

      - ID: DEPENDENCY_QUARANTINE
        title: Dependency Update Quarantine
        description: |
          See MALICIOUS_DEPENDENCY_INJECTION countermeasure.
        inPlace: false
        public: true

      - ID: DETERMINISTIC_BUILDS
        title: Implement Deterministic / Reproducible Builds
        description: |
          See NON_DETERMINISTIC_BUILDS countermeasure.
        inPlace: false
        public: true

      - ID: DEPENDENCY_MINIMIZATION
        title: Dependency Minimization and Lightweight Frameworks
        description: |
          See MALICIOUS_DEPENDENCY_INJECTION countermeasure.
        inPlace: false
        public: true
