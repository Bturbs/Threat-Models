threats:

  - ID: BALANCE_CORRUPTION_VIA_SWAPDATA
    title: Tampering of Jupiter Swap Data on Deposit and Redeem
    attack: |
      During DF_INVOKE_DEPOSIT and DF_INVOKE_REDEEM, the client submits an opaque/encoded
      "route vector" for a Jupiter CPI. The vault treats this as untrusted input and relies
      on SPL token balance changes to determine what was actually spent and received.

      An attacker attempts to craft the route (accounts layout/order, program IDs, mints) so
      that:

        - the CPI targets an unexpected program (rogue DEX or router),
        - custody is misdirected away from the canonical vault USDC/investment accounts, or
        - the vault ends up spending more USDC or investment token than intended, or
        - the vault ends up crediting more USDC or investment token than intended on redeem.

      If the program did not:

        - bind custody accounts and mints from configuration (VaultState),
        - validate the Jupiter program ID, and
        - compute deltas from pre/post SPL balances,

      then such manipulation could silently drain value or mint/burn shares against
      incorrect deltas in either direction (deposit or redeem).

      In the current design, the vault:

        - checks USDC and INVESTMENT mints and the Jupiter program ID,
        - binds custody accounts to a PDA-owned ATAs (USDC and INVESTMENT),
        - snapshots balances before the swap and after the swap, and
        - mints/burns shares strictly based on the measured INVESTMENT and USDC deltas.

      Residual risk remains if there is no explicit check that "USDC (or investment) spent"
      equals the caller-intended `usdc_amount` or `shares` / `min_out` on both deposit and
      redeem (e.g. partial swap or unexpected extra spend).
    threatType: Tampering
    impactDesc: |
      If custody binding or delta checks were missing or bypassed, a malicious route could
      cause on either deposit or redeem:

        - value extraction or loss due to receiving fewer tokens than intended for the amount
          of USDC or investment spent,
        - misdirected credits (tokens not landing in the correct vault or user account),
        - shares minted or burned against incorrect deltas, leading to insolvency or NAV
          drift, and
        - audit trails that do not match underlying token movements.

      With the current balance-based design, the primary remaining concern is mismatch
      between intended token amounts and measured spent/received deltas (e.g. partial swaps
      or extra spend/receive on both deposit and redeem).
    impactedSecObj:
      - REFID: PROGRAM_INTEGRITY
      - REFID: SWAP_SAFETY
      - REFID: USER_FUNDS_SAFETY
      - REFID: AUDITABILITY
    attackers:
      - REFID: MALICIOUS_USER
      - REFID: EXTERNAL_ATTACKER
      - REFID: ROGUE_CPI_TARGET
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:H/A:L
    fullyMitigated: true
    countermeasures:
      - ID: PRE_POST_SWAP_BALANCE_CHECKS
        title: Assert custody balances before/after CPI swap (source spent, dest
          received)
        description: |
          Treat the Jupiter route as opaque/untrusted input. Snapshot SPL token balances of
          VAULT_USDC_ACCOUNT (source) and VAULT_INVESTMENT_ACCOUNT (destination) immediately
          before invoking the Jupiter CPI; immediately after the CPI returns, reload both
          accounts and compute deltas strictly from on-chain SPL balances:

            - spent_usdc = pre_usdc - post_usdc (must be >= 0)
            - received_invest = post_invest - pre_invest (must be >= 0)

          Apply the same pattern symmetrically for redeem (investment -> USDC):

            - spent_invest = pre_invest - post_invest (must be >= 0)
            - received_usdc = post_usdc - pre_usdc (must be >= 0)

          Reject if deltas are negative or indicate "no-op" (no source spent or no
          destination received). Mint/burn shares strictly proportional to the measured
          deltas to keep share supply aligned with delivered value; emit events with the
          measured deltas for auditability.

          Status: implemented in `deposit.rs` and `redeem.rs` (pre/post balance reload and
          InvestmentNotReceived / UsdcNotSpent checks), with shares computed from the
          received delta.
        inPlace: true
        public: true

      - ID: VALIDATE_CPI_TARGETS
        title: Restrict CPI to whitelisted Jupiter program IDs
        description: |
          Enforce program ID equality to the expected Jupiter aggregator. Ensure only the
          vault PDA is an authorized signer and deny any extra signers in the CPI account
          meta construction.

          Status: implemented via `require_keys_eq!(jupiter_program, JUPITER_PROGRAM_ID)` and
          signer selection based on PDA equality.
        inPlace: true
        public: true

      - ID: STRICT_ACCOUNT_AND_MINT_BINDINGS
        title: Bind custody accounts and mints; deny user-supplied custody
        description: |
          Validate that the USDC and investment token accounts used in the CPI are the
          configured vault custody accounts (PDA-owned ATAs) and that their mints match the
          expected USDC and investment token mints. Reject any instruction that attempts to
          swap from/to arbitrary accounts.

          Status: implemented using associated_token constraints for both vault USDC and
          vault investment accounts plus USDC_MINT / INVESTMENT_MINT checks.
        inPlace: true
        public: true

      - ID: ENFORCE_INTENDED_SPEND
        title: Ensure token spent equals caller-intended amount
        description: |
          After the swap, compare the measured source-token delta with the caller-intended
          amount (on deposit: `usdc_amount`; on redeem: `shares` / derived expected token
          amounts and/or `min_out`):

            - require!(spent_usdc == usdc_amount, CustomError::UsdcSpendMismatch);
            - and analogous checks for redeem flows.

          Or, if partial swaps are intentionally allowed, enforce a tight acceptable range
          and reflect the actual spent amount explicitly in the event. This prevents routes
          from spending more or less than the requested amounts in both deposit and redeem.
        inPlace: false
        public: true

      # - ID: DEPOSIT_EVENT_DELTAS
      #   title: Include measured deltas in deposit and redeem events
      #   description: |
      #     Emit events that carry measured `usdc_spent` / `investment_received` (deposit) and
      #     `investment_spent` / `usdc_received` (redeem) so that off-chain monitoring can
      #     verify that on-chain behavior matches expectations and quickly detect any anomalous
      #     swaps.
      #   inPlace: false
      #   public: true

      - ID: STRUCTURED_SWAP_DATA_VALIDATION
        title: Parse and validate structured Jupiter swap data instead of 
          treating as opaque
        description: |
          Replace the current “opaque byte array” assumption for `JUPITER_SWAP_DATA` with a
          structured, versioned swap instruction type understood by the vault. The vault
          would:

            - deserialize the swap data into a strongly-typed route structure,
            - enforce maximum hop count / route complexity,
            - validate all intermediate swap program IDs against an allowlist,
            - check critical numeric fields (e.g. out_amount_min, fees) against policy.

          This would allow the vault to reject obviously pathological or malicious routes
          *before* invoking Jupiter CPI and to express more granular constraints on swap
          behavior.

          Trade-offs / rationale for not adopting:

            - couples the vault binary to Jupiter’s internal CPI ABI and layout, requiring
              upgrades whenever Jupiter changes,
            - expands on-chain attack surface (parsing/validation logic),
            - conflicts with the current architectural choice to keep `JUPITER_SWAP_DATA`
              opaque and rely solely on balance-based invariants.

          Documented here as a consciously *not chosen* mitigation to show that deeper
          inspection of swap data was considered and rejected in favor of a balance-based,
          program-ID-and-custody-bound design.
        inPlace: false
        public: true

  - ID: DEPOSIT_JUPITER_SWAP_DOS
    title: Denial of Service via Jupiter Swap Manipulation
    attack: |
      An attacker can craft malicious Jupiter swap routes during DF_INVOKE_DEPOSIT that are
      extremely complex, illiquid, or likely to revert, causing repeated transaction failure
      and high compute usage.

      Vectors include:

        - complex multi-hop routes that exhaust compute units inside the Jupiter CPI,
        - routes through illiquid pools causing repeated reverts,
        - repeated attempts that hold write locks on the shared vault custody accounts
          (USDC and investment) for the duration of failing transactions.

      Because `jupiter_swap_data` is user-controlled opaque input, an attacker can always
      bypass any off-chain routing or UX restrictions and directly send pathological swap
      instructions to the on-chain vault program. The vault must still invoke the CPI to
      discover swap failure, so a determined attacker can impose a higher compute and lock
      cost on the vault than on themselves.
    threatType: Denial of Service
    impactDesc: |
      Legitimate users may observe intermittent or persistent deposit failures and degraded
      responsiveness of DF_INVOKE_DEPOSIT due to:

        - frequent transaction reverts,
        - contention on the PDA-owned custody token accounts,
        - validators deprioritizing or dropping expensive deposit transactions.

      This affects AVAILABILITY of deposit flows and, indirectly, USER_FUNDS_SAFETY (capital
      cannot be deployed) and AUDITABILITY (high noise from failed attempts).
    impactedSecObj:
      - REFID: AVAILABILITY
      - REFID: USER_FUNDS_SAFETY
      - REFID: PROGRAM_INTEGRITY
      - REFID: AUDITABILITY
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: MALICIOUS_USER
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H
    fullyMitigated: false
    ticketLink: https://r3-cev.atlassian.net/browse/PROT-132

    countermeasures:
      - ID: ECONOMIC_MIN_DEPOSIT
        title: Enforce economically-meaningful minimum deposit amount (on-chain)
        description: |
          Enforce a minimum USDC deposit amount in the vault program (e.g. in `deposit.rs`
          via `require!(usdc_amount >= MIN_DEPOSIT_USDC, CustomError::DepositBelowMinimum);`)
          so that each attempted deposit must commit non-trivial value. This raises the
          economic cost of sustained DoS using complex or failing swap routes, since the
          attacker must fund each transaction with at least the minimum deposit.
        inPlace: false
        public: true
      - ID: VAULT_PAUSE_FLAG
        title: On-chain vault pause for deposits during abnormal failure 
          conditions
        description: |
          Introduce an on-chain boolean flag in `VaultState` (e.g. `deposits_paused`) and
          guard `process_deposit` with a simple check:

            - if `deposits_paused` is true, reject new deposits early with minimal compute.

          Governance or an authorized authority can toggle this flag in response to observed
          DoS attempts or upstream Jupiter instability. This provides a coarse but purely
          on-chain circuit breaker to protect vault liveness and custody during incidents.
        inPlace: false
        public: true
      - ID: PER_USER_RATE_LIMITING_ONCHAIN
        title: Optional per-signer rate limiting in the vault program
        description: |
          Add an optional per-signer rate-limiting account (e.g. `RateLimitState` PDA keyed
          by the depositor) updated by `process_deposit` on-chain. Reject or throttle
          deposits if a single signer exceeds a configured number of attempts per slot
          window. This limits the impact of a single attacker identity, while still
          allowing distributed honest users to proceed.

          Note: This does not stop Sybil-style attacks but raises the bar and is enforceable
          entirely by the vault program.
        inPlace: false
        public: true
  - ID: REDEEM_SWAP_DEPENDENCY_LOCKUP
    title: Overreliance on Jupiter for Redemption (Dependency and Liquidity 
      Lockup)
    attack: |
      The redeem flow (DF_INVOKE_REDEEM) relies on a Jupiter CPI swap to convert
      `INVESTMENT_MINT` tokens held in `VAULT_INVESTMENT_ACCOUNT` back to USDC before the
      user can receive value.

      If Jupiter cannot produce a valid route, cannot execute the route, or executes but
      fails to deliver sufficient USDC (e.g. `min_out` cannot be met), the redeem
      transaction reverts and the user cannot exit.

      This failure mode can be triggered by upstream dependencies and market conditions
      that are outside the vault program’s direct control, for example:

        - Jupiter program upgrades/ABI changes or temporary outages,
        - price-oracle failures or stale/incorrect data used by routing/quoting logic
          (e.g. Pyth feed disruptions),
        - insufficient on-chain liquidity for the `INVESTMENT_MINT -> USDC` swap pair,
        - market manipulation or liquidity drain that makes redemptions economically
          infeasible within acceptable slippage bounds.

      Because the vault does not hold USDC reserves sized for all redemptions (it holds the
      investment token), a prolonged inability to swap can effectively lock user value in
      the vault and render shares practically un-redeemable.
    threatType: Denial of Service
    impactDesc: |
      Users may be unable to redeem shares for USDC for an extended period, leading to:

        - loss of liveness of the core redeem flow (redemption halt),
        - trapped value in `VAULT_INVESTMENT_ACCOUNT` and forced illiquidity for users,
        - reputational and regulatory impact if redemption guarantees cannot be met,
        - operational incident response complexity (manual unwind / emergency governance).
    impactedSecObj:
      - REFID: AVAILABILITY
      - REFID: USER_FUNDS_SAFETY
      - REFID: SWAP_SAFETY
      - REFID: AUDITABILITY
    attackers:
      - REFID: EXTERNAL_ATTACKER
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H
    fullyMitigated: true
    ticketLink: https://r3-cev.atlassian.net/browse/PROT-133
    countermeasures:

      - ID: REDEEM_EMERGENCY_MODE
        title: Add an on-chain emergency redemption mode and governance controls
        description: |
          Introduce an on-chain emergency mode flag (e.g. `redeem_mode`) in `VaultState`
          that can switch between:

            - normal redeem: shares -> USDC via Jupiter swap
            - emergency redeem: shares -> `INVESTMENT_MINT` (in-kind)

          Require appropriate authorization to toggle modes and emit events on mode
          changes for auditability.
          TODO: check admin_withdraw https://github.com/corda/solana-token-vault-program/blame/development/protocol-programs/programs/pre-commit-vault/src/lib.rs#L51C11-L51C32
        inPlace: true
        public: true

      - ID: LIQUIDITY_BUFFER_POLICY
        title: Maintain a USDC liquidity buffer or staged redemption queue
        description: |
          Reduce hard dependency on immediate on-chain swaps by maintaining a limited USDC
          buffer for redemptions (policy + operations), and/or implementing a staged
          redemption queue that can be settled over time rather than requiring an
          instantaneous swap in every redeem transaction.
        inPlace: false
        public: true


  - ID: KYC_COMPLIANCE_AVOIDANCE1
    title: Insufficient Onboarding Controls for Vault Participation
    attack: |
      The Token-2022 share mint and vault instructions accept any signer that
      provides the required token accounts. There is no whitelist registry,
      depositor identity binding, or freeze authority check, so sanctioned or
      anonymous wallets can freely deposit USDC, receive shares, and redeem.
      The attacker just needs to craft a valid transaction invoking
      `process_deposit` or `process_redeem` with the correct accounts; this way will circumvent
      any off-chain KYC/AML checks performed by the vault operator, for example by not allowing this kind of GUI and Web UI Flows.
    assets:
      - REFID: DF_INVOKE_DEPOSIT
      - REFID: DF_INVOKE_REDEEM
    threatType: Elevation of Privilege
    impactDesc: |
      - Breach of KYC/AML obligations for the vault operator
      - Exposure to sanctioned wallets and money-laundering flows
      - Inability to halt redemptions or freeze malicious accounts
      - Regulatory enforcement, fines, and reputational damage
    impactedSecObj:
      - REFID: COMPLIANCE
    attackers:
      - REFID: EXTERNAL_ATTACKER
      - REFID: MALICIOUS_USER
    CVSS:
