  - ID: RPC_PROVIDER_SURVEILLANCE
    title: RPC Provider Activity Surveillance
    attack: |
      The RPC provider logs and correlates all Bridge Authority activity, including:

      - Redemption address monitoring patterns
      - Transaction submission timing and amounts
      - Associated Corda holder addresses (if exposed in metadata)

      This data could be used for competitive intelligence, regulatory reporting, or sold to third parties.
    threatType: Information Disclosure
    impactDesc: |
      Loss of operational privacy for the bridge. Bridge activity patterns, volumes, and timing are
      exposed to the RPC provider and potentially to third parties.
    impactedSecObj:
      - REFID: DATA_CONFIDENTIALITY
    attackers:
      - REFID: MALICIOUS_RPC_PROVIDER
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:N/A:N
    fullyMitigated: true
    countermeasures:
      - ID: MINIMIZE_RPC_EXPOSURE
        title: Minimize Metadata in RPC Requests
        description: |
          Avoid including unnecessary metadata in RPC requests. Use separate addresses for different
          operations to limit correlation.
        inPlace: true
        public: true
      - ID: RPC_PROVIDER_PRIVACY_POLICY
        title: Review RPC Provider Privacy Policy
        description: |
          Select RPC providers with strong privacy commitments and data retention policies. Prefer
          providers that do not log request details beyond operational necessity.
        inPlace: false
        public: true
        operational: true
        operator: Corda Network operator
      - ID: SELF_HOSTED_NODE
        title: Self-Hosted Validator Node
        description: |
          For maximum privacy and trustlessness, consider running a self-hosted Solana RPC node.
          This eliminates third-party visibility into bridge operations but requires significant
          infrastructure investment.
        inPlace: false
        operationsal: true
        operator: Corda Network operator
        public: true

