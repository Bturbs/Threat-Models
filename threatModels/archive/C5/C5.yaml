        - REFID: CONFIDENTIALITY
        - REFID: COMPLIANCE
      group: Advanced
      treeImage: true

    - ID: FLOW_HIGH_AVAILABILITY
      title: High Availability aspects of CorDapps and flow protocol
      description: |
        FROM [REF](https://github.com/corda/platform-eng-design/blob/1677ffca79c269e997db0fe3e2dad0ef20999f92/core/corda-5/corda-5.0/p2p-ha/e2e-authentication-protocol.md):

        Below is a list of requirements for this design work. As explained below, the design needs to address all of these, but they can be delivered incrementally as long as this is possible architecturally.

            * The p2p layer should provide high availability. This translates into the following terms:
              * as a short-term goal, the messaging layer should be able to tolerate single-machine failures without the need of operational intervention and with limited downtime (< 5 seconds).
              * as a medium-term goal, the messaging layer should be able to tolerate single-datacenter failures without the need of operational intervention and with limited downtime (< 5 seconds).
              * any maintenance windows required should be kept to minimum duration and impact. As a maintenance window, we define a time window where the platform's performance might degrade due to maintenance tasks.
              * the messaging layer should provide the capability of performing rolling upgrades of Corda or CorDapps without any downtime. This can be tackled as a medium-term goal.
              * customers should be able to setup a deployment of the components in a topology that could provide up to 5 9s of availability. This could be either on an on-premise setup, on the cloud or even using a managed service, if that's possible.
            * It should be possible to deploy the messaging layer in a low-cost version that might compromise on performance, scalability & availability in order to reduce the total cost of ownership of the overall system.
            * It should be possible to deploy Corda in a setup, where traffic is authenticated end-to-end, but only encrypted across the public network. This is a requirement from customers that want external traffic to be encrypted, but still want a way to inspect traffic as it enters their network perimeter. There should also be another operational mode for customers that are more security-sensitive, which would enforce end-to-end encryption to prevent any traffic from being exposed in cleartext before it reaches any Corda components performing the actual processing (e.g. Corda nodes).
            * The platform should be using a communications protocol that is more widely adopted and that is supported by an ecosystem with extensive tooling. An example of such a protocol that has been requested by customers is HTTP (in contrast to AMQP).
            * It should be possible to provide unreliable delivery in the future, i.e. specifying a TTL for messages that are going to be dropped after this has elapsed.
            * It should be possible to preserve and reuse old certificates from Corda 4.x. It is acceptable if this is only possible within the same network, i.e. nodes with old-style certificates can only talk to nodes with old-style certificates (and the same for the new standard web certificates).
            * The platform should be capable of exposing information to the operator, which can be used to determine where a message is stuck through the pipeline. This information could then be used to identify which component or link might be causing failures.
            * The p2p layer should provide the ability to communicate across different networks/groups. For instance, a deployment of the p2p components can front two different holding identities belonging in different networks/groups.

          [REF](https://github.com/corda/platform-eng-design/blob/1677ffca79c269e997db0fe3e2dad0ef20999f92/core/corda-5/corda-5.0/p2p-ha/e2e-authentication-protocol.md)
          (RFI: @Dries, is it still the case?)

      failureImpact: High availability not guaranteed

      contributesTo:
        - REFID: AVAILABILITY
        - REFID: COMPLIANCE
      group: Advanced
      treeImage: true


  description: |
    This is the Corda NextGen Cluster threat model.

    **Operational Modes**

    There are different ways in which a Corda 5 Cluster can be used/operated, here summarized in three main tenancy modes:

    1) **Single tenant**: Cluster with single VNode and single or multiple trusted CordApp CPIs

    2) **Multiple tenants with trusted CPIs**: Cluster with multiple VNodes with a single or multiple trusted (by all NVodes) CordApp CPIs

    3) **Full multi-tenancy**: Cluster with multiple VNodes with multiple untrusted CorDapps CPIs

    The different operational modes may impact specific threats and their mitigations. 
    In particular `Single tenant` poses less threats than `Multiple tenants with trusted CPIs`
    that poses less threat than `Full multi-tenancy` operational mode.


  assets:
    - ID: C5CLUSTER
      type: cluster
      title: Corda 5 Cluster
      description: Corda 5 Cluster
      inScope: true
    - ID: DF_CPI_UPLOAD
      type: dataflow
      title: CPI upload
      description: Application Publisher uploads a CPI to create a Virtual Node
      inScope: true
    - ID: DF_CONF_CPIBK_VER_CRED
      type: dataflow
      title: CPI verification credentials configuration
      description: |
        configure the credentials (RFI: root cert, PubK, x500 name only?) to verify the CPI,CPB,CPK (nested) signatures by the Cluster Operator REF RFI
        Example from [REF](https://github.com/corda/corda-runtime-os/wiki/CorDapp-Packaging):
        ``` 
        curl --insecure -u admin:admin -X PUT -F alias="signingkey1-2022" -F certificate=@signingkey1.pem https://localhost:8888/api/v1/certificates/codesigner
        ```
      inScope: true
    - ID: DF_CONF_CPIBK_VER_TRANS
      type: dataflow
      title: CPI verification credentials transmission
      description: |
        trusted root credentials (RFI: PubKs, X500 Name...with root PKICert?) transmitted out of band (RFI) by the network operator to the Cluster
         operator to then configure no the cluster (same MGM cluster or another non MGM cluster)
      inScope: false
    - ID: CDF_PB_ACQUISITION
      type: dataflow
      title: transmission of the CPI from the APP publisher (RFI also App Dev?)
      description: |
        out of band transmission of the CPI from the APP publisher to the Network Operator
      inScope: false
    - ID: DF_CPK_TRUSTED_CRED
      type: dataflow
      title: transmission of the trusted credentials from the App Developer to 
        the Network operator
      description: |
        out of band transmission of the trusted credentials (RFI what credentials, X500 name, cert, pubK?) from the App Developer to the Network operator
      inScope: false
    - ID: DF_CPI_CREATION
      type: dataflow
      title: CPI signing
      description: Network Operator signs CPI 
        [REF](https://github.com/corda/corda-runtime-os/wiki/CorDapp-Packaging#signing-key-setup-only-needed-first-time)
      inScope: true
    - ID: DF_CPI_TRANSIT_OPERATOR
      type: dataflow
      title: CPI transmission to Cluster Operator
      description: out of band CPI transmission to Cluster Operator from the 
        Network Operator
      inScope: false
    - ID: DF_CPI_TESTING
      type: dataflow
      title: CPI testing with self signed certs
      description: |
        CPI testing ith self signed certs RFI: TBC
      inScope: false
    - ID: DF_CPB_ACQUISITION
      type: dataflow
      title: CPB acquisition
      description: Group network operator acquires a .cpb to form a CPI by 
        signing it
      inScope: false
    - ID: DF_FLOW_1
      type: dataflow
      title: Flow transaction
      description: CordApp executes a transactions with another CorDapp (Virtual
        lNode)
      inScope: true
    - ID: DF_OP_1
      type: dataflow
      title: Cluster installation and initial configuration
      description: Cluster installation and initial configuration
      inScope: false
