  - ID: API_CSRF
    title: Cross Site Request Forgery (XSRF) in APIs
    threatType: Spoofing
    assets:
      - REFID: DF_VNodeAnyEndP
    attackers:
      - REFID: ANONYMOUS
    impactedSecObj:
      - REFID: FULL_CIA
    attack: |
      An anonymous user can forge a target page/email that once a UI logged in user (e.g. Swagger API UI)
       user visits triggers arbitrary HTTP requests: [Cross Site Request forgery](https://owasp.org/www-community/attacks/csrf)
       For example an anonymous could target a CLUSTER_OPERATOR to perform an arbitrary configuration (may be prevented by PUT HTTP method)
       or target a VNODE_OPERATOR to execute a flow tracsaction (not prevented by POST HTTP method)
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H/E:U/RC:U
    fullyMitigated: false
    pentestTestable: true
    countermeasures:
      # - ID: NON_STD_HTTP_METHOD
      #   title: Do not use GET/POST HTTP methods
      #   description: |
      #     Not using GET/POST method together with a default or not relaxed same-origin policy/CORS.
      #   inPlace: false
      #   public: true
      #   operational: true
      # - ID: XSS_PREVENTION1
      #   title: Do not use the same API domain for content (HTML ot other)
      #   description: |
      #     No other content should be served on the same domain/http origin as the APIs.
      #     Content management systems needs to be avoided on the same API domain.
      #   inPlace: false
      #   public: true
      #   operational: true
      - ID: RESTRICTIVE_HTTP_CORS
        title: Do not relax Same Origin Policy/CORS
        description: |
          Do not relax [Same Origin Policy](https://en.wikipedia.org/wiki/Same-origin_policy),
          for example by defining specific CORS headers
        inPlace: true
        public: true
        operational: true
        operator: INFRASTRUCTURE_OPERATOR
      - ID: XSS_PREVENTION
        title: Cross Site Scripting (XSS) prevention
        description: |
          APIs should not serve HTML or user content (reflected or stored) that is not correctly encoded to avoid XSS.
        inPlace: true
        public: true
      - ID: CLIENT_ANTI_CSRF
        title: Custom web GUIs CSRF prevention
        description: |
          Custom GUIs that stored credentials to call Cluster APIs need to put in place special prevention to avoid CSRF:
           e.g. `anti-CSRF tokens`
        inPlace: false
        operational: true
        operator: CORDAPP_PUBLISHER
        public: true

      - ID: CLUSTER_ANTI_CSRF
        title: Custom web GUIs CSRF prevention
        description: |
          Configure the cluster to not accept HTTP Basic Authentication, NTLM, cookie based authenticatino or any other 
