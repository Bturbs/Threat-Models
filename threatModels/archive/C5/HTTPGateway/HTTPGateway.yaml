  - ID: UNAUTH_API_DISCLOSURE
    title: Unauthenticated API info disclosure
    assets:
      - REFID: DF_ALL_HTTP_ENDP
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    threatType: Information disclosure
    pentestTestable: true
    attack: |
      An anonymous attacker can access endpoints `getAPIVersion()` and the Swagger `openAPI()`, enabling them
      to harvest information about installed CorDapps, flow definitions, and cluster version.
    impactDesc: Minor information disclosure (version and API docs)
    impactedSecObj:
      - REFID: CONFIDENTIALITY
    public: true
    fullyMitigated: true
    countermeasures:
      - ID: UNAUTH_API_NON_SENSITIVE_DATA
        description: Calling public APIs, including openAPI() as an anonymous 
          user will not give information about flows or other sensitive data, 
          directly or via side channels (e.g. slower response depending on 
          parameters) This is also enforced by RBAC controls implemented by the 
          Gateway.
        title: Minimize info public API in response
        inPlace: yes
        public: true

