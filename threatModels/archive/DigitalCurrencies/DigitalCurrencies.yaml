        title: Responder Flows complete validation
        description: |
          Responder Flows validated that the input states and session are: 
            - as many as expected
            - Not more than expected, ref: com/r3/dc/workflows/v1/token/transfer/TransferTokenFlowResponder.kt:32
        inPlace: false
        public: false

      - ID: CONTRACT_COMPLETE_VALIDATION
        title: Contract complete validation
        description: |
          While CorDapps contract commands verify single portions of the transaction, the transaction itself delegates validation to specific subset of commands.
          A transaction may contain more commands than expected (formally valid, still potentially unwanted by come parties). 
          The Responder Flow TX signing (tx.finalize() call) will not check the semantic of all TX commands.
          For example a CB responder Flow will sign a valid mint command in a redeem Flow responder TODO code ref.
        inPlace: false
        public: false


