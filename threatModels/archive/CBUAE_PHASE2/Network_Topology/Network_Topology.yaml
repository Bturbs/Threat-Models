ID: Network_Topology
schemaVersion: 2
parent: CBUAE_PHASE2
scope:
  assumptions:
    - ID: K8S_PER_DATACENTER
      description: |
        There will be a Kubernetes nodes/cluster per network participant per datacenter

        **Refs:** [LLD - 5.4.3 Corda Networks/High availability, failover, and backup/restore/High availability](#LLD), [LLD - 5.4.4 Corda Networks/High availability, failover, and backup/restore/Cross-site failover](#LLD)
  assets:
    - ID: K8S_CLUSTER
      type: process
      title: Kubernetes Cluster
      description: |
        Runs containerized applications across multiple availability
         zones with automated deployment and scaling.

        **Refs:** [HLD - 4.1.4 Solution Design/System overview/System topology](#HLD), [LLD - 5.4.3.2 Corda Networks/High availability, failover, and backup/restore/High availability/High availability within a Kubernetes cluster](#LLD)
      inScope: true

    - ID: F5_LOAD_BALANCING
      type: process
      title: Load Balancer (F5 BIG-IP)
      description: |
        Distributes incoming traffic across multiple Kubernetes nodes.

        **Refs:** [LLD - 5.1.4 Corda Networks/Networking/Solution design](#LLD)
      inScope: true

    - ID: OBSERVABILITY_STACK
      type: service
      title: Observability Stack (Dynatrace / Splunk)
      description: |
        Provides visibility into application and infrastructure health. 
        Includes Dynatrace OneAgent for logs and metrics collection, 
        and Splunk for centralized monitoring.

        **Refs:** [LLD - 5.5 Corda Networks/Observability](#LLD), [LLD - 5.5.3 Corda Networks/Observability/Proposed solution](#LLD)
      inScope: true

    - ID: OPENTELEMETRY_INTEGRATION
      type: service
      title: OpenTelemetry Integration
      description: |
        Applications send traces and metrics to Dynatrace using the OpenTelemetry framework, 
        allowing distributed tracing and detailed performance insights.

        **Refs:** [LLD - 8.3.7 Corda Workflow SDK Overview/Solution design/Monitoring and instrumentation](#LLD), [LLD - 8.3.7.2 Corda Workflow SDK Overview/Solution design/Monitoring and instrumentation/Tracing](#LLD)
      inScope: true

    - ID: FORTIGATE_WAF
      type: process
      title: Web Application Firewall (FortiGate)
      description: |
        Try protecting against various threats like OWASP Top 10 
        threats and DDoS attacks.

        **Refs:** [LLD - 5.1.4 Corda Networks/Networking/Solution design](#LLD)
      inScope: true

    - ID: SERVICE_MESH
      type: process
      title: Service Mesh (Linkerd)
      description: |
        Secures intra-cluster HTTP communication via mTLS.
        IT Injects proxies into solution applications.

        **Refs:** [LLD - 5.3 Corda Networks/Service mesh](#LLD), [LLD - 5.3.4 Corda Networks/Service mesh/Solution design](#LLD)
      inScope: true

    - ID: HSM
      type: hardware
      title: Hardware Security Module
      description: |
        Dedicated device for secure key storage, used by HashiCorp Vault to unseal.

        **Refs:** [LLD - 10.6.4.1 Cryptography and Public Key Infrastructure/Cryptographic key management/Implementation components/Component 1 - HashiCorp Vault Transit secrets engine](#LLD), [LLD - 11.6.1.3 Secrets Management/Secrets management service/Implementation components](#LLD)
      inScope: true

    - ID: HASHICORP_VAULT
      type: process
      title: HashiCorp Vault
      description: |
        Manages secrets, certificates, and cryptographic operations. Uses a Raft cluster for replication.

        **Refs:** [LLD - 11 Secrets Management](#LLD), [LLD - 11.6 Secrets Management/Secrets management service](#LLD), [LLD - 10.6 Cryptography and Public Key Infrastructure/Cryptographic key management](#LLD)
      inScope: true

    - ID: DATABASES
      type: process
      title: Distributed Databases
      description: |
        Includes CockroachDB, PostgreSQL, Apache Ignite, etc. 
        Provide data storage, replication, and high availability.

        **Refs:** [LLD - 7.3.8 Corda Distributed Ledger Technology/Solution design/Data storage & management](#LLD), [LLD - 1.4.2.5 Wallet Services/Wallet Service implementation/Wallet Service data models/Database tables and ERD](#LLD)
      inScope: true

    - ID: NATS_CLUSTER
      type: service
      title: NATS JetStream
      description: |
        Pub-sub messaging with key-value storage. 
        Used for asynchronous workflow state.

        **Refs:** [LLD - 8.3.5.8 Corda Workflow SDK Overview/Solution design/Networking/NATS messaging, headers, payloads, topics](#LLD), [LLD - 8.3.6 Corda Workflow SDK Overview/Solution design/State management](#LLD)
      inScope: true

    - ID: NATS_MESSAGING
      type: service
      title: NATS Messaging service
      description: |
        Highly available publish-subscribe messaging for legacy integrations.
      inScope: false

    - ID: API_GATEWAY
      type: service
      title: API Gateway (APISIX)
      description: |
        Manages external access to cluster services, 
        routes requests, enforces authentication/authorization.

        **Refs:** [LLD - 5.2 Corda Networks/API gateway](#LLD), [LLD - 5.2.4 Corda Networks/API gateway/Solution design](#LLD)
      inScope: true

analysis: |
  The topology uses Kubernetes, distributed databases, an HSM, and a Vault-based 
  secrets module. Major concerns include misconfiguration, unauthorized network access, 
  data replication consistency, and secure storage of private keys.

  **Refs:** [HLD - 4.1.4 Solution Design/System overview/System topology](#HLD), [LLD - 5 Corda Networks](#LLD)

threats:

  - ID: UNAUTHORIZED_CLUSTER_ACCESS
    title: Unauthorized Access to Kubernetes Cluster
    attack: |
      An attacker might exploit unsecured endpoints
       or misconfigurations to gain control over cluster resources.

      **Refs:** [LLD - 5.4.3.2 Corda Networks/High availability, failover, and backup/restore/High availability/High availability within a Kubernetes cluster](#LLD)
    impactDesc: |
      Unauthorized user may deploy malicious containers,
       exfiltrate secrets, or disrupt services.

      **Refs:** [LLD - 11.9 Secrets Management/Security information and event management (SIEM), monitoring and alerting](#LLD)
    impactedSecObj:
      - REFID: FULL_CIA
      - REFID: MINIMAL_RISK_SURFACE
    fullyMitigated: true
    threatType: Spoofing, Tampering
    pentestTestable: true
    public: true
    CVSS:
      vector: CVSS:3.1/AV:A/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H
    countermeasures:
      - ID: RBAC_ENFORCEMENT
        title: Strict Kubernetes RBAC
        description: |
          Configure Role-Based Access Control to restrict unauthorized actions. 
          Segment privileges using namespaces and network policies.

          **Refs:** [LLD - 12.11 Identity and Access Management (IAM)/Authorization services](#LLD)
        inPlace: true
        public: true
      - ID: TRACKED_CICD_CONFIGURATIONS
        title: Tracked CI/CD K8s Configurations
        description: |
          Kubernetes configuration is integrated into the deployment process and tracked
           with versioned source system without the need have additional permission and actors
           to change cluster configurations.

          **Refs:** [LLD - 9.2 Solution Delivery/Solution promotion](#LLD), [LLD - 9.4 Solution Delivery/Solution deployment](#LLD)
        inPlace: true
        public: true

  - ID: HSM_COMPROMISE
    title: HSM Key Compromise
    attack: |
      An attacker gains physical or logical access to the HSM, exposing unseal or master keys for Vault.

      **Refs:** [LLD - 10.6.4.1 Cryptography and Public Key Infrastructure/Cryptographic key management/Implementation components/Component 1 - HashiCorp Vault Transit secrets engine](#LLD)
    impactDesc: |
      Potential decryption of Vault secrets, leading to severe breach of critical data.

      **Refs:** [LLD - 11.6.1.3 Secrets Management/Secrets management service/Implementation components](#LLD)
    impactedSecObj:
      - REFID: FULL_CIA
    fullyMitigated: true
    threatType: Information Disclosure, Elevation of Privilege
    pentestTestable: false
    public: true
    CVSS:
      vector: CVSS:3.1/AV:P/AC:H/PR:H/UI:N/S:U/C:H/I:H/A:H
    countermeasures:
      - ID: PHYSICAL_SECURE_HSM
        title: Physical Security & Strong Access Control
        description: |
          Store the HSM in a secure environment with restricted physical
           access and strict authentication.

          **Refs:** [LLD - 10.6.4.1 Cryptography and Public Key Infrastructure/Cryptographic key management/Implementation components/Component 1 - HashiCorp Vault Transit secrets engine](#LLD)
        inPlace: false
        public: true
      - ID: SEGREGATED_HSM_NETWROK
        title: Segregated HSM Network
        description: |
          The HSM will not be located in a DMZ, but a separate secure network on its own.
          This prevents data at rest being compromised even if access to the physical storage 
          device on which Vault persists data is obtained.
           Vault supports HSMs which support PKCS#11 version 2.20+ interfaces.

          **Refs:** [LLD - 11.6.1.3 Secrets Management/Secrets management service/Implementation components](#LLD)
        inPlace: true
        public: true

  - ID: MISCONFIGURED_VAULT
    title: Misconfiguration of HashiCorp Vault
    attack: |
      Vault policies or token scopes are too broad, allowing unauthorized data access or key usage.

      **Refs:** [LLD - 11.6.1.3 Secrets Management/Secrets management service/Implementation components](#LLD)
    impactDesc: |
      Unauthorized users can retrieve secrets or generate certificates, compromising system integrity.

      **Refs:** [LLD - 10.9.4.4 Cryptography and Public Key Infrastructure/Certificate propagation: platform operator and local certificate store/Component 1: Back-end Vault KV store/Security guarantees](#LLD)
    impactedSecObj:
      - REFID: FULL_CIA
      - REFID: PRINCIPLE_LEAST_PRIVILEGE
    fullyMitigated: true
    threatType: Spoofing
    pentestTestable: true
    public: true
    CVSS:
      vector: CVSS:3.1/AV:A/AC:H/PR:H/UI:N/S:U/C:H/I:H/A:N
    countermeasures:
      - ID: VAULT_POLICY_REVIEW
        title: Regular Vault Policy Review
        description: |
          Enforce least privilege. Periodically audit policy
           scopes and ensure system roles match business requirements.
        inPlace: false
        public: true
      - REFID: TRACKED_CICD_CONFIGURATIONS

  - ID: SERVICE_MESH_COMPROMISE
    title: Service Mesh Configuration Compromise
    attack: |
      Attackers exploit incorrectly configured service mesh injection or trust policies 
      to intercept or modify traffic in transit.

      **Refs:** [LLD - 5.3.4 Corda Networks/Service mesh/Solution design](#LLD)
    impactDesc: |
      Results in eavesdropping, data injection, or man-in-the-middle attacks.

      **Refs:** [LLD - 5.3.5 Corda Networks/Service mesh/Solution analysis](#LLD)
    impactedSecObj:
      - REFID: MINIMAL_RISK_SURFACE
      - REFID: PRINCIPLE_LEAST_PRIVILEGE
    fullyMitigated: true
    threatType: Spoofing, Tampering
    pentestTestable: true
    public: true
    CVSS:
      vector: CVSS:3.1/AV:A/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:N
    countermeasures:
      - ID: MESH_POLICY_HARDENING
        title: Service Mesh Policy Hardening
        description: |
          Enable strict mTLS authentication/authorization checks
           and regularly audit mesh-wide configurations.

          **Refs:** [LLD - 5.3.4 Corda Networks/Service mesh/Solution design](#LLD), [LLD - 13.4.3 Network Identity Detailed Design/Exchanging application identity via tokens/Security guarantees](#LLD)
        inPlace: true
        public: true
      - REFID: TRACKED_CICD_CONFIGURATIONS



  - ID: INTRA_CLUSTER_INSECURE_COMMUNICATION
    title: Insecure Intra-Cluster Communication
    attack: |
      Applications communicate over HTTP without mTLS, exposing sensitive data to interception.
      This applies for example to service to service communications between two different LFIs.

      **Refs:** [LLD - 5.3.4 Corda Networks/Service mesh/Solution design](#LLD), [LLD - 8.3.5 Corda Workflow SDK Overview/Solution design/Networking](#LLD)
    impactDesc: |
      Sensitive data may be exposed to unauthorized services or users within the cluster.

      **Refs:** [LLD - 7.3.4.1 Corda Distributed Ledger Technology/Solution design/Privacy and cryptography/Privacy in transit](#LLD)
    assets:
      - REFID: K8S_CLUSTER
      - REFID: API_GATEWAY
    impactedSecObj:
      - REFID: ZERO_TRUST
      - REFID: MINIMAL_RISK_SURFACE
      - REFID: PRINCIPLE_LEAST_PRIVILEGE
    fullyMitigated: true
    threatType: Information Disclosure, Tampering
    pentestTestable: true
    public: true
    CVSS:
      vector: CVSS:3.1/AV:A/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:L
    countermeasures:
      - ID: API_GW_TLS
        title: API Gateway TLS
        description: |
          All intra-cluster communication must go through the two API Gateway, 
          which enforces mTLS (authentication) and minimal access (contributes to authorization).

          **Refs:** [LLD - 5.2.4 Corda Networks/API gateway/Solution design](#LLD), [LLD - 5.3.4 Corda Networks/Service mesh/Solution design](#LLD)
        inPlace: true
        public: true
title: Network Topology
