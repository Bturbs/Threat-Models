  - ID: MULTISIG_MEMBERSHIP_HIJACK
    title: Unauthorized Multisig Membership Change
    attack: |
      Squads v4 provides a dual-threshold system: a **Vault Threshold** for
      operational actions and a **Config Threshold** for governance changes
      (membership, threshold modification). An attacker who controls enough
      members to meet the Config Threshold (via key theft, collusion, or
      coercion) can:

      - **Add attacker-controlled keys** to the multisig, diluting legitimate
        members and eventually reaching a majority
      - **Remove legitimate members** to reduce the pool, making future
        threshold easier to meet
      - **Lower either threshold** to make the multisig easier to compromise
        in subsequent actions
      - **Chain membership changes:** Incrementally modify the multisig over
        multiple proposals — each change individually appears minor but
        collectively transfers control
      - **Abuse permissions:** If Proposer/Voter/Executor/Owner permissions
        are not configured correctly, an attacker with Owner permissions on
        fewer accounts than expected could still push through config changes

      This is distinct from KEY_ROTATION_REVOCATION_FAILURE (operational
      failures) — this threat targets the **governance authority over the
      multisig itself** as an escalation path.

      The attack is especially dangerous when:

      - Config Threshold is set equal to or close to Vault Threshold,
        negating the dual-threshold protection
      - All members have Owner permissions (no permission separation), so
        meeting the operational threshold also meets the governance threshold
      - Timelocks are not applied to config-threshold actions, allowing rapid
        sequential membership changes
    threatType: Elevation of Privilege, Tampering
    impactDesc: |
      Attacker gains permanent control of a multisig authority by reshaping its
      membership:

      - Replace legitimate signers with attacker-controlled keys
      - Lower threshold to single-signer, eliminating all multisig protections
      - Once membership is captured, attacker can execute any action the role
        permits — including further membership changes across other multisigs
        if roles overlap
      - Recovery requires out-of-band intervention (e.g., program upgrade to
        replace the authority) since the legitimate members have been removed
    impactedSecObj:
      - REFID: INTEGRITY
      - REFID: USER_FUNDS_SAFETY
