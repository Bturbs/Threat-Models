  - ID: BURN_ARBITRARY_TOKENS1
    title: LFI burn tokens that does not own
    assets:
      - REFID: DF_P2P_WHOLESALE
    attackers:
      - REFID: Bank
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:H/A:H
    conditional: |
      Multiple Clusters Network (as the code of the CPI is not ensured by the trusted CB itself)
    threatType: Tampering, Denial of Service
    attack: |
      An LFI can run a different Initiator Flow code (as the LFI controls the Cluster) and over the P2P session it sends 
      not a normally selected tokens list to burn, but a mix of his own tokens and a token owned by another party.
      Also the attack LFI adds the victim as a coutnerparty (signatory).
      The Responder (issuer authority/ CB) checks only that the list of owners of all tokens in the transaction
      contains the initiator (the attacking LFI). At this point the CB consumes tokens states that are maliciously selected by the initiator LFI.

      [REF](https://github.com/corda/digital-currencies/blob/015057ce4b10d04b8c1d17f0e081b0856e12b255/workflows/src/main/kotlin/com/r3/dc/workflows/v1/Extensions.SubFlow.kt#L58):
      <br/>
      <code>
      check(expectedInitiators.contains(session.counterparty)) 
      </code>
      The validation should check that all tokens (including the change tokens) are owned by the initiator;
       currently the check is that at least one token is owned by the initiator (see 'contains' vs expected single value) 
    impactDesc: Token of a party get burn without permission
    impactedSecObj:
      - REFID: MONETARY_INTEGRITY
    public: false
    fullyMitigated: true
    countermeasures:
      - ID: BURNTOKEN_RESP_FLOW_AND_CONTRACT_VALIDATION
        title: Combined Burn Flow Responder validation and contract validation
        description: |
          Currently the responder Flows validates the expected initiator 
          (it needs te be among the owners of all Token stated in the TX)
          The TX contract delegated the validation to the burn command (com/r3/dc/contract/utxo/token/v1/TokenCommand.kt:127)
          <code>
                      check(tokenInputs.allEqualBy { it.owner }) { CONTRACT_RULE_INPUTS_OWNER }
          </code>
          that checks that all owner of the input tokens are the same
          Together those two validation avoid this threat.
          Also the Responder Flow checks the type of transaction and command (allows only Burn command)
          (RFI: confirm all necessary validations are in place)
          TODO: in general all responder flows should check the right type of (this to add to CorDapp dev guidelines):
           - TX command
           - Initiator and participant parties (including Notary)
           - Filer on expected input/status status and concatenated check may be skipped due to null filter results.
        inPlace: false
        public: true


  - ID: TX_TAMPERING_OVER_P2P_BURN
    title: LFI mint tokens instead of the Central Bank by tampering TXs over P2P
    assets:
      - REFID: DF_P2P_WHOLESALE
    attackers:
      - REFID: Bank
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:H/AR:H
    conditional: |
      Multiple Clusters Network (as the code of the CPI is not ensured by the trusted CB itself)
    threatType: Tampering
    attack: |
      An LFI sends to the CB a forged mint TX over P2P to the Burn Token responder Flow.
      The code in the responder (ref: net.corda.v5.ledger.utxo.transaction.UtxoSignedTransaction) does not 
      explicitly requires a Burn TX (Token TX with single burn command). The contract validation will fall to the 
      Mint token onVerify() method (REF: com.r3.dc.contract.utxo.token.v1.TokenCommand.Mint#onVerify). 
      The CB will sign the TX as is formally valid e.g. <code>check(tokenDefinitionReference.issuer in transaction.signatories)</code>
      being the CB a signatory of the forged TX.
      <img src="img/TX_TAMPERING_OVER_P2P_BURN.svg"/>
    impactDesc: Token of a party get burn without permission
    impactedSecObj:
      - REFID: MONETARY_INTEGRITY
    public: false
    fullyMitigated: false
    ticketLink: 
      https://r3-cev.atlassian.net/jira/software/c/projects/DW/boards/2020?selectedIssue=DW-1047
    countermeasures:
      - REFID: BURNTOKEN_RESP_FLOW_AND_CONTRACT_VALIDATION
      - ID: BURN_TOKEN_COMMAND_SYNKED_VALIDATION
        title: Synchronised signatories value validation in contract
        description: |
          Signatories values at the time of validation [REF](https://github.com/corda/digital-currencies/blob/6312c444da62d86c686aee4049389c6793173904/contracts/contract-utxo-token/src/main/kotlin/com/r3/dc/contract/utxo/token/v1/TokenCommand.kt#L54)
          does not contain the signing party (Central Bank).ledgerKeys
        inPlace: false
        public: true



