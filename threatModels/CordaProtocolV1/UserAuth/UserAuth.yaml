      - ID: ANTI_DOS_SIGNER_MEASURES
        title: Anti-DoS Measures for Signers and Infrastructure
        description: |
          Availability hardening for signing operations:

          - **Large signer pool with redundancy:** N significantly larger than
            threshold M, so losing some signers does not block operations
          - **Private signer identities:** No public disclosure of who holds
            signing keys to prevent targeted attacks
          - **Geographic and infrastructure diversity:** Signers distributed
            across regions, ISPs, and hosting providers
          - **Redundant watchtowers:** Multiple independent monitoring services
            to eliminate single point of failure
          - **Anonymous watchtowers:** Watchtower operators not publicly
            identified
          - **Dead-man's switch:** If watchtower stops heartbeating, system
            freezes automatically (fail-closed design)
