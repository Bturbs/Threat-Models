ID: CordaSolanaToolkit
schemaVersion: 2
title: Corda - Solana Toolkit
version: 1.0

children:
  - REFID: SolanaTrustedNotary
  - REFID: NotaryProgramLifecycle
  - REFID: Corda2SolanaBridging
scope:
  description: |
    This threat model covers the Corda to Solana bridging capability provided by the **corda-solana-toolkit**.

    Bridge-protocol details (phases, assets, attackers/assumptions, analysis, and threats) are documented in the child threat model **Corda2SolanaBridging**.

    **Reference Implementation:** [corda-solana-toolkit](https://github.com/corda/corda-solana-toolkit)

    **Diagrams:**

    - Generic bridging flow: [C2SBridge_seq1.puml](img/C2SBridge_seq1.puml)
    - Stock demo scenario: [C2SBridge_stockDemo.puml](img/C2SBridge_stockDemo.puml)

  # diagram: img/C2SBridge_seq1.puml
  securityObjectives:

    - ID: CORDA_NETWORK_AUTH
      title: Corda Network Access Control
      description: |
        Ensure that only authorized nodes can join the network and interact with its services, 
        preventing unauthorized access or malicious participation.
      group: Compliance & Audit

    - ID: AUDITABILITY
      title: Auditability and Non-Repudiation
      description: |
        Ensure that transactions are linked to verified legal identities and that participation 
        can be proven.
      group: Compliance & Audit
    - ID: DATA_CONFIDENTIALITY
      title: Transaction Data Confidentiality
      description: |
        Ensure that the details of transactions and states are only accessible to parties explicitly involved in those transactions or who have a legitimate need to know.
      group: Data Security
    - ID: ASSET_INTEGRITY
      title: Asset Integrity
      description: |
        Ensure that assets are not lost, duplicated, or illegitimately modified during the bridging process between Corda and Solana. This includes preventing double-spending.
      group: System Integrity
      contributesTo:
        - REFID: LEDGER_INTEGRITY
    - ID: ATOMICITY
      title: Atomic Settlement
      description: |
        Guarantee that the locking of an asset on Corda and the minting of a reference asset on Solana occur atomically. Both operations must either succeed or fail together to prevent inconsistent states.
      group: Operational Security
    - ID: TRANSACTION_PRIVACY
      title: Transaction Privacy
      description: |
        Preserve the confidentiality of sensitive transaction details and participant information on the Corda network, ensuring that only necessary information is exposed on the public Solana blockchain.
      group: Data Security
      contributesTo:
        - REFID: DATA_CONFIDENTIALITY
    - ID: REGULATORY_COMPLIANCE
      title: Regulatory Compliance
      description: |
        Ensure that all cross-chain operations adhere to relevant financial regulations, including KYC/AML requirements, and are fully auditable.
      group: Compliance
      contributesTo:
        - REFID: AUDITABILITY
    - ID: AVAILABILITY
      title: Availability and Resilience
      description: |
        Maintain the availability and reliability of the bridging service, protecting it against denial-of-service attacks, network failures, and other disruptions.
      group: Operational Security
    - ID: PROVENANCE
      title: Asset Provenance
      description: |
        Maintain a clear and verifiable history of asset transfers and transformations across both the Corda and Solana ledgers.
      group: Auditability
      contributesTo:
        - REFID: AUDITABILITY
    - ID: FLOW_INTEGRITY
      title: Flow Framework Integrity
      description: |
        Ensure that the multi-step protocols (flows) used to propose and agree on 
        ledger updates execute correctly and are resilient to failures or malicious interruption.
      group: System Integrity
    - ID: LEDGER_INTEGRITY
      title: Ledger Integrity and Consistency
      description: |
        Ensure that all parties involved in a transaction eventually reach a consistent view of the shared facts recorded on the ledger, and that historical data cannot be tampered with.
      group: Ledger Integrity


