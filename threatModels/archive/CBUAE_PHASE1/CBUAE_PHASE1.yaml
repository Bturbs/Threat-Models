# @BASEM TO Check. The FC converts JSON <-> XML, there is not authentication/authorzation mechanism in the application layer. 
#  Basically, whatever the FC sends to the Flex would be accepted as coming from the IP and 
#  whatever the FC sends to the IP would be accepted by the IP as coming from the Flexcube.
#  Actually whatever is sent on KAFKA channel would be accpeted by the FC as coming from the IP
#  and whatever on the KAFKA channel would be accepted by the IP as coming from FC. 
#  There is no other layer of authentication/authorisation. If KAFKA is compromised then undetected message tampering is possible 

