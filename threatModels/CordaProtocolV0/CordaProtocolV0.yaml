    countermeasures:
      - ID: OFFCHAIN_KYC_ONBOARDING
        title: Off-chain KYC/AML onboarding and wallet whitelisting
        description: |
          Implement an off-chain KYC/AML process for vault participants, maintaining a
          whitelist of approved wallet addresses. The vault operator verifies user identity
          and compliance status before allowing deposits or redemptions. Only whitelisted wallets are
          permitted to interact with the vault program. This approach leverages off-chain
          controls to enforce compliance without complicating on-chain logic.
        inPlace: true
