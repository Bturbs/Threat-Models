threats:
  - ID: BRIDGE_DOUBLE_SPEND
    title: Double Spending of Bridged Assets via Race Condition
    attack: |
      A malicious bridging party attempts to spend the original Corda asset after it has been locked and a corresponding reference asset has been minted on Solana. This could be achieved by exploiting a race condition or a failure in the locking mechanism.
    threatType: Tampering
    impactDesc: |
      Successful double-spending would lead to the creation of unbacked reference assets on Solana, causing financial loss and undermining the integrity of the bridge.
    impactedSecObj:
      - REFID: ASSET_INTEGRITY
    attackers:
      - REFID: BRIDGING_PARTY
    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:N/I:H/A:L
    fullyMitigated: true
    countermeasures:
      - ID: NOTARY_DOUBLE_SPEND_CHECK
        title: Notary Double-Spend Check
        description: |
          The Solana Notary (all of the versions) performs a double-spend check during the notarization process to
           ensure that the Corda asset has been properly locked and is not being spent again.
        inPlace: true
        public: true
      - ID: ATOMIC_LOCK_MINT
        title: Atomic Lock-and-Mint
        description: |
          The Corda asset must be verifiably locked (encumbered) in the same atomic transaction that mints the
          Solana reference asset. The Solana Notary ensures that the Corda state transition is only notarized if
          the corresponding Solana mint instruction is successfully executed.

          This atomicity is achieved during the **SN -> SN: Build Solana transaction (commit + mint_to)** step
          in the bridging sequence, where the Solana Notary constructs a transaction that simultaneously
          finalizes the Corda state transition (consuming the proxy) and triggers the `mint_to` instruction
          on the Solana network.
        inPlace: true
        public: true


  - ID: SOLANA_KEY_EXPOSURE_VIA_APPLICATION
    title: Solana Key Exposure via Application Handling
    attack: |
      The Bridge Authority's Solana keypair is loaded from a file (bridgeAuthorityWalletFile config)
       and held in memory during flow execution. An attacker with access to the Bridge Authority node 
       could extract the key via: (1) reading the key file directly, (2) memory dump/heap analysis, 
       (3) log file exposure if key material is inadvertently logged, (4) crash dumps containing key data.
    threatType: Elevation of Privilege
    impactDesc: |
      Attacker can sign arbitrary Solana transactions as the Bridge Authority, potentially minting unbacked tokens, burning tokens without unlocking on Corda, or performing other unauthorized operations.
    impactedSecObj:
      - REFID: ASSET_INTEGRITY
      - REFID: REGULATORY_COMPLIANCE
    attackers:
      - REFID: COMPROMISED_BRIDGE_AUTHORITY_OPERATOR
    CVSS:
      vector: CVSS:3.1/AV:L/AC:L/PR:H/UI:N/S:C/C:H/I:H/A:N
    fullyMitigated: true
    countermeasures:
      - ID: SECURE_KEY_FILE_PERMISSIONS
        title: Secure Key File Permissions
        description: |
          The Solana keypair file must have restrictive filesystem permissions (e.g., 600) and be stored outside web-accessible directories. Access should be limited to the Bridge Authority service account.
        operational: true
        operator: Corda Network operator
        inPlace: false
        public: true
      - ID: AVOID_KEY_LOGGING
        title: Prevent Key Material in Logs
        description: |
          Ensure logging frameworks are configured to never log key material. Review all log statements in BridgingService and related flows to confirm Solana keys are not exposed.
        inPlace: true
        public: true
      - ID: SECURE_HEAP_HANDLING
        title: Secure Heap Handling
        description: |
          Consider zeroing sensitive key material after use and avoiding heap dumps in production. JVM options like -XX:+DisableAttachMechanism can prevent runtime memory access.
          Also -XX:HeapDumpPath=/dev/null to prevent heap dumps 
          from being written to disk.
        operational: true
        operator: Corda Network operator
        inPlace: false
        public: true

  - ID: DEV_KEY_BUNDLED_IN_SOURCE
    title: Development Keypair Bundled in Source Code
    attack: |
      A Solana keypair for Devnet testing is bundled in the source repository (bridging-token-workflows/src/main/resources/). If this key is accidentally used in production or if the repository is public, attackers have immediate access to signing credentials.
    threatType: Information Disclosure
    impactDesc: |
      If the bundled key is used beyond Devnet, attackers can impersonate the Bridge Authority on Solana.
    impactedSecObj:
      - REFID: ASSET_INTEGRITY
    attackers:
      - REFID: NETWORK_ATTACKER
    CVSS:
      vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    fullyMitigated: true
    pentestTestable: true
    countermeasures:
      - ID: SEPARATE_PROD_KEYS
        title: Separate Production Keys
        description: |
          Production Solana keys must never be stored in source control. Use environment-specific configuration to inject keys at deployment time.
        inPlace: true
        public: true
        operational: true
        operator: Corda Network operator
      - ID: DEVNET_ONLY_ANNOTATION
        title: Mark Bundled Keys as Devnet-Only
        description: |
          Clearly document that bundled keys are for Devnet testing only. Consider build-time checks to prevent production builds from including test keys.
        inPlace: true
        public: true


  - ID: WEBSOCKET_SUBSCRIPTION_SPOOFING
    title: Spoofing of WebSocket Redemption Notifications
    attack: |
      The BridgingService uses WebSocket subscriptions to monitor Solana redemption addresses.
       An attacker could attempt to spoof WebSocket messages to trigger false redemption flows,
        potentially causing the Bridge Authority to unlock tokens without actual Solana burns.
    threatType: Spoofing
    pentestTestable: true
    impactDesc: |
      Tokens unlocked on Corda without corresponding burn on Solana, breaking the 1:1 peg and causing financial loss.
    impactedSecObj:
      - REFID: ASSET_INTEGRITY
      - REFID: ATOMICITY
    attackers:
      - REFID: NETWORK_ATTACKER
    CVSS:
      vector: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:N/I:H/A:N
    fullyMitigated: true
    countermeasures:
      - ID: VERIFY_SOLANA_STATE
        title: Verify Solana State Before Redemption
        description: |
          Before processing any redemption, the Bridge Authority  Solana program
           must independently query the Solana state to verify
           the redemption address balance and burn transaction, not relying solely on WebSocket notifications.
        inPlace: false
        public: true
      - ID: SECURE_WEBSOCKET_CONNECTION
        title: Secure WebSocket Connection
        description: |
          Use authenticated, encrypted WebSocket connections to trusted Solana RPC endpoints. Validate the TLS certificate of the RPC server.
        inPlace: true
        public: true

