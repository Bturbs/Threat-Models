analysis: |

# STRIDE mainly external flows ( CBCC, MB, HEALTHDASHBOARD, REPORTING)
# STRIDE on internal flows 
# Keys management
# DF_MBC_KAFKA: Forge issuance, redemption requests/ info disclosure/ repudiation/replay attacks/tampering/DoS
#  countermeasure: kafka access controls?, integrity checks/digital signatures?, 
#            support unavailability if the CBCC or the connector is down, scalable deplyment
#   cm->1.  mBridge Connector interfaces with Kafka for its communication with the CBCC (Issuance Platform) services. 
#        The Kafka broker is configured to accept connections from clients only over SSL / TLS 
#        which ensures encrypted data communication. 
#       2. The connection to Kafka is authenticated using SASL mechanism using access tokens that 
#           are provided by the Secrets service i.e., Hashicorp

# DF_MBC_MB_XML: spoofing, tampering, repudiation-> cm: Message layer signature, core element signature
# DF_MBC_MB_XML: info. disc -> cm: TLS
# DF_MBC_MB_XML: DoS -> cm : Firewalls, scalable deployment
# DF_MBC_MB_XML: Elevation Of privileges, is this even applicable?
# DF_MBC_MB_XML: support error handling and retries,
#  cm - >1. The mBridge CBUAE node deployed in a separate mBridge network communicates with 
#          the HTTPS Docking API of the mBridge Connector deployed in a Kubernetes cluster in the CBCC
#            infrastructure over secure VPN
#  cm -> 2. The message integrity is handled by a signature verification mechanism. 
#            The signature is calculated by the sender by creating a hash of the entire XML body of the 
#            message and then signing this hash with the sender private key. The signed hash is set in the
#             HTTP request header. 
#            The receiver extracts  and verifies the signature 
#            using the corresponding public key stored in its keystore. 

# DF_MBC_MB_XML: support deduplication -> This is handled by the CB MB node, not the MBC. 
# The MBC will not check for duplicate messages

# DF_MBC_REPORTING_SERVICE_KAFKA : forge reports, info disclosure, tampering, DoS, 
#   -> cm: Kafka access controls, integrity checks/digital signature

# DF_MBC_DASHBOARD: forge metrics, info disclosure-> cm: RBAC
# What about internal DF? Are they immune to stride?
# Threats to the translating service?
# Is the institution’s digital certificate (private key) -p.26 LLD report- used to sign the signature element 
#  string a different asset from the MBC_SOAP_MESSAGE_SIGNING_KEY?

#  DOS attacks against extrtnal dataflows and components
#   cm -> scalable implementation, error handling, log connections time out, firewalls 

threats:
  - ID: KAFKA_CONNECTION_VULNERABILITIES_MBC
    title: Attacks against unsecured mBridge Connector Kafka connections
    assets:
      - REFID: DF2_CBCC_KAFKA_MBRIDGECON
      # - REFID: DF_MBC_REPORTING_SERVICE_KAFKA
    # attackers:
    CVSS:
      vector: CVSS:3.1/AV:A/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:L
    threatType: Spoofing, Tampering, Repudiation, Information disclosure, DoS, 
      Elevation of privilieges
    attack: |
      Misconfiguring or not securing the Kafka connection between the mBridge connector and the CBCC can expose the 
      data in transit to a wide number of attacks including; forging and tampering of issuance and redemption requests and responses, disclosing 
      data, and even affecting the availability of communication.

    impactDesc: Attackers can send issuance requests, responses and 
      acknowledgments for the MBC or the CBCC to consume. The attacker can 
      instruct the CBCC to execute redemption requests. It can instruct the 
      mBridge connector to send ussuance requests.
    impactedSecObj:
      - REFID: ISSUANCE_REDEMPTION_CONTROL
      - REFID: NON_REPUDIATION
      - REFID: MONETARY_INTEGRITY
      - REFID: REPORTING_MONITORING

    public: true
    fullyMitigated: true
    countermeasures:
      - ID: TLS_KAFKA_CONNECTION
        title: TLS Connection between Kafka broker and clients
        description: |
          The Kafka broker is configured to accept connections from clients only over SSL / TLS 
           which ensures encrypted data communication.
        operational: false
        inPlace: true
        public: true
      - ID: Access_Tokens_Authentication
        title: Access tokens authentication
        description: |
          The connection to Kafka is authenticated using SASL mechanism using access tokens that 
          are provided by the Secrets service i.e., Hashicorp.
        operational: false
        inPlace: true
        public: true
      - ID: ACCESS_CONTROL_KAFKA_TOPIC
        title: Apply Access control for Kafka topic
        description: |
          Configure Kafka topics dedicated for the sole communication between the issuance platform and the mBridge Connector.
          Apply access controls to prevent other entities from accessing these topics. 
        operational: false
        inPlace: true
        public: true


